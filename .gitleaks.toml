title = "texlate"

[extend]
useDefault = true

# 历史已提交的秘密按精确值放行（regexTarget=line 匹配整行，值不变即豁免）。
# 只放已经入库的既定事实；新值仍会命中规则。不要用 paths 整文件放行。
# [allowlist]
# regexTarget = "line"
# regexes = ['''password: "EXACT-LEGACY-VALUE"''']

# share_key/cache_key 是内容寻址标识符不是凭据：cache_key 恒为 sha256 十六进制，
# share_key 为 s- 前缀包名或 64-hex——两类「字段名+值形态」组合在本仓语义上
# 永不承载 secret（bench/results 落盘 dump 与 web fixture 实证命中
# generic-api-key，全为假阳）。
[allowlist]
description = "content-addressed identifiers (share_key/cache_key), not credentials"
regexTarget = "line"
regexes = [
  '''"(share_key|cache_key)"\s*:\s*"[0-9a-f]{64}"''',
  '''share_key:\s*"s-[0-9a-z-]+"''',
  # vendored huashu-design 文档里的豆包 TTS 示例配置——voice_id 是公开
  # 音色预设名不是凭据（.agents/skills/huashu-design/references/voiceover-pipeline.md）
  '''DOUBAO_TTS_VOICE_ID=zh_female_xiaohe_uranus_bigtts''',
  # tests/ 合成夹具 sk-* 假值：真实 provider key 永不带 test/secret/fuzz/
  # canary 等自明标记词，纯重复串（sk-xxxxxxxx）与序数假值单列豁免
  '''sk-[A-Za-z0-9_-]*(test|secret|fuzz|canary|scrubbed|abcdef|8675309|NEVERLEAK|xxxx)[A-Za-z0-9_-]*''',
  '''sk-(abcdefghij[0-9]*|ant-api03-[a-z0-9]+|rt-[0-9]+|live-[a-z0-9]+|should-be-[a-z-]+)''',
  '''Bearer abc\.def-ghi''',
]

# 自有凭据格式：真实值在任意已入库文件都拦，占位符放行。
# 例：面板账密只应存在于 gitignored 的 xxx.env；example 文件的占位符豁免。
# [[rules]]
# id = "my-credential"
# description = "My credential (live value; placeholder allowed)"
# regex = '''MY_CREDENTIAL=[^\s#]+'''
# [rules.allowlist]
# regexTarget = "line"
# regexes = ['''your-placeholder-''']
