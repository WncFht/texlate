# rules/85-shim.yaml — fixloop 规则库分片：shim/shadow/polyfill —— vendored 隔离与 bundle 遮蔽族
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/00-base.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # 新增 (docs/08:269): 工程自带旧 .sty/.cls 遮蔽已装新版 ——
  # 错误触发型 (undefined_cs/already_def 反复出现时才怀疑遮蔽),
  # 按 \\ProvidesPackage 日期比较, 盲删必死 (同目录 cls 可能是唯一来源)
  - id: vendored_sty_shadow
    mechanisms: [W100, B05]
    description: "工程自带旧 .sty/.cls 比系统新装版本旧 → rename 隔离 (.fixloop-iso); 路径限定装载点 (./x/y 形) 命中 → 原径回填 \\input 系统副本 shim"
    phase: loop
    order: 150
    when:
      any:
        - { category: undefined_cs }
        - { category: already_def }
    condition: { vendored_shadow: true } # builtin 探测: 本地副本日期 < 系统副本日期
    action:
      kind: builtin_transform
      function: vendored_shadow_isolate
      params:
        exts: [.sty, .cls]
        suffix: ".fixloop-iso"
        # 同包伴船整组隔离（wave-2, apj-bib-scout §S2/S3）：只隔 biblatex.sty
        # 会留 vendored .def/.bbx/.cbx/.lbx 继续遮蔽系统件 → 新旧混栈。
        cohort_map:
          biblatex.sty:
            [
              "biblatex.def",
              "biblatex.cfg",
              "blx-*.def",
              "*.bbx",
              "*.cbx",
              "*.lbx",
              "*.dbx",
            ]
    risk: medium # rename 会改变工程布局; 只在确证更旧时动
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # tectonic 同理: cwd 旧版遮蔽 bundle 新版
    provenance:
      - { corpus: "—", error: "装了新包但错误依旧 → 工程内旧 .sty 遮蔽" }
    stats: { fires: 61, rescued_cells: 17, status: active }
    source_ref: "docs/spec/compile.md L269"

  # ── 2026-09-17 支援件腐蚀复原 (prose gate 落地前残案兜底) ──
  # builtin 五条件全 conjunctive 自判 (baseline 同名件在 ∧ 字节异 ∧ 无
  # % texlate/% fixloop 自有标记 ∧ 工作件 CJK 计数超 baseline ∧ baseline
  # 判 support); baseline_dir 由 worker/stagerun 按 transform 名运行时
  # 注入, 缺席即 False 空转 —— when 放宽 always 每轮便宜扫一遍。
  - id: restore_support_from_src
    description: "被翻译写脏的 support 件 → 从 baseline 树逐字节复原"
    phase: loop
    order: 154 # vendored_sty_shadow(150) 后, shadow/bbl_regen 族(155-159) 前
    when: { always: true }
    action:
      kind: builtin_transform
      function: restore_support_from_src # params.baseline_dir 由调用侧注入
    risk: low # 五条件全中才动; parse 崩/baseline 非 support → 不碰
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "scout-supportfiles 残案 (pstricks/epsf/tikzlibrary 宏件)",
          error: "support 件被注入 CJK → illegal_unit/undefined_cs 级联 (0707.4206 \\psunit 同族)",
        }
    stats: { fires: 9, rescued_cells: 6, status: active }
    source_ref: "builtins.py restore_support_from_src (c47e844) + worker 挂点 (2f1daf5)"

  # ── 2026-09-19 slotrevert lane (tmp/lane-zhleak + task#188) ──
  # segmenter 把未注册机位实参 (csname 体/未注册 env 尾随参等) 放上
  # chunk 翻译字面量面 → zh 化后 splice 写回机位 → "Undefined color
  # '这是译文'"/"No counter"/"can't find file" 族 (~74 cells 历史签名)。
  # builtin 用 judge._MACHINE_SLOT_RXS + 扩展表在 mask_tex 视图上定位
  # 机位实参, 对 baseline_dir pristine 树逐文件 per-kind 序号对齐配对:
  # baseline 参纯 ASCII 标识符 ∧ zh 参含 CJK ∧ 相异 → zh 参位换回
  # baseline 字节。序在 shipped_sty_input_wrap(-0.5) 之后、
  # static_precheck(0) 之前 —— 还原的 \usepackage{真名} 供装包扫描
  # 收; 亦是 L2 resplice 后首个耐写入点 (早于它的改写会被 resplice
  # 冲掉)。baseline_dir 缺席 (standalone precheck 不注入) → False
  # 空转。双侧命中数分歧 → 该 kind 整跳防错位回写。
  - id: slot_arg_revert
    description: "zh 化机位实参 (csname/env 参/色名/计数名/kv/文件名等) → 按 baseline 配对还原 ASCII 标识符"
    phase: precheck
    order: -0.4 # shipped_sty_input_wrap(-0.5) 后, static_precheck(0) 前
    when: { always: true }
    condition:
      # 零 CJK 树 (en 臂/未翻工程) 一条 raw 粗筛即空转省电; builtin 内
      # mask_tex 遮盖视图 + baseline 配对是权威。
      source_contains: "[\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\u3007]"
    action:
      kind: builtin_transform
      function: slot_arg_revert # params.baseline_dir 由调用侧注入 (ruleset_with_baseline)
    risk: low # 双侧序号对齐 + ASCII ident 白名单 + CJK 谓词三重闸; 分歧即整 kind 跳
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 源字节还原与引擎无关
    provenance:
      - {
          corpus: "tmp/lane-zhleak census (~74 cells '这是译文' 族; 残余 csname/env-arg 6 cells)",
          error: "Undefined color '这是译文' / No counter 'ZH' / can't find file 'ZH' (机位实参被 zh 化)",
        }
    stats: { fires: 1854, rescued_cells: 1330, status: active }
    source_ref: "tmp/lane-zhleak/notes.md; judge.py _MACHINE_SLOT_RXS/_slot_args 配对机位面"

  # 新增 (fixloop-v2 整改): tectonic bundle 内建类太老遮蔽 —— 内置
  # aastex 5.0rc3.1 (1999) 缺 \actaa/deluxetable 宏族, missing_file 打不到
  # (bundle 能解析), 只能 undefined_cs 确证后往 wdir 注 stub 遮蔽换 emulateapj
  # (全 API 面一次补齐, 含 \rotate no-op; emulateapj 经 ctan_fetch 拉进 wdir)。
  - id: aastex_bundle_shadow
    mechanisms: [W86, W96]
    description: "tectonic 内置 aastex 5.0rc3 缺新宏 → wdir 注 aastex.cls stub 遮蔽 (→emulateapj)"
    phase: loop
    order: 155 # journal_cs_polyfill(160) 之前: 遮蔽换类比逐宏补表更彻底
    when: { category: undefined_cs, payload_required: true }
    condition:
      engine_in: [tectonic] # bundle 内建类问题只存在于 tectonic
      # 同款注释-FP 收紧: %\documentclass{aastex} 注释行不得触发遮蔽
      # (行锚同 :369 latex209 gate 先例)。
      source_contains: "(?m)^[ \\t]*\\\\documentclass[ \\t]*(\\[[^\\]]*\\])?[ \\t]*\\{aastex\\}"
    action:
      kind: builtin_transform
      function: bundled_class_shadow
      params:
        target: aastex.cls
        needs: ["emulateapj.cls"]
        include_journal_table: true # \\actaa 族也算触发宏
        cs_set: # aastex 5.0rc3 缺失的 deluxetable/新宏族 (emulateapj 全覆盖)
          [
            tabletypesize,
            tablefontsize,
            tablewidth,
            tablenum,
            tablehead,
            colhead,
            startdata,
            enddata,
            tablecomments,
            tablerefs,
            rotate,
            deluxetable,
            tablebreak,
            figset,
            platecomment,
            splittablenotes,
            texttwelveudash,
          ]
        body: |
          \NeedsTeXFormat{LaTeX2e}
          \ProvidesClass{aastex}[2026/09/15 fixloop bundle shadow -> emulateapj]
          % emulateapj5 自指递归保险 —— ver@/opt@ 预注册同 shim_map aastex61.cls 条
          % (原 aastex.cls 槽已删: vendored 先中)
          \expandafter\def\csname ver@emulateapj5.sty\endcsname{2026/09/17}
          \expandafter\def\csname opt@emulateapj5.sty\endcsname{twocolumn,onecolumn}
          \LoadClassWithOptions{emulateapj}
          % aastex5 frontmatter 面 (真件 aastex.cls v5 抄签名, clsfidcen 普查
          % ~230 格): emulateapj 全缺此族 —— \email 用 provide+renew 双写
          % (同 aastex6x_body 先例, 防御 emulateapj 变体自带版), 余者
          % provide 即可。references env 真件是参考文献块容器 —— 守卫让位
          % (emulateapj 若自带则用原生版)。
          \providecommand{\email}[1]{}
          \renewcommand{\email}[1]{}
          \providecommand{\authoremail}[1]{}
          \providecommand{\received}[1]{}
          \providecommand{\revised}[1]{}
          \providecommand{\accepted}[1]{}
          \providecommand{\journalid}[2]{}
          \providecommand{\articleid}[2]{}
          \providecommand{\cpright}[2]{}
          \providecommand{\ccc}[1]{}
          \@ifundefined{references}{\newenvironment{references}{}{}}{}
          \providecommand{\rotate}{}
          % 1907.10408 (qc-impl): aastex \texttwelveudash 十二连破折号
          % (em-dash ×4 视觉) → \textemdash 近似; 缺位时 \keywords 展开
          % 成空剩 FFFD 框
          \providecommand{\texttwelveudash}{\textemdash}
          \endinput
    engines:
      xelatex: { mode: native } # 实际不可达: engine_in 门只放行 tectonic
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1806.06690 tectonic 臂 (fixloop-corpusv2)",
          error: "Undefined control sequence \\actaa → \\tabletypesize (aastex 5.0rc3.1 连环缺)",
        }
    stats: { fires: 1, rescued_cells: 1, status: validated } # 1806.06690 tec 实证 clean
    source_ref: "fixloop-v2 整改; tectonic bundle aastex 版本实证"

  # loop1-2410.00012: ieeeaccess.cls \RequirePackage{spotcolor} —— spotcolor
  # 是 pdfTeX-only 包 (内部 \pdfobj/\pdflastobj 原语), xelatex/tectonic 下
  # 必炸 undefined_cs; missing_file 通路打不到 (TL 有真包)。
  # REWRITE (qc-impl 2026-09-28): xespotcolor 桥接弃用 —— cls 无 cmyk
  # 退路 (else 支即 spotcolor 路), pdfcolorstack/pdfrefobj payload 经
  # cls 内直调浮出救不了; 改纯 xcolor 仿真 (cmyk 解析 + spotcolor
  # 模型拦截 named + 余 API noop), needs 清零去外部依赖。
  - id: spotcolor_xetex_shadow
    description: "spotcolor (pdfTeX-only) → wdir 注 spotcolor.sty stub (xcolor cmyk 仿真)"
    phase: loop
    order: 156 # aastex_bundle_shadow(155) 同档: 遮蔽先于逐宏补
    when:
      any: # 67debb6 起 subclassify 把宏体内 pdf 原语改判 pdftex_prim:pdfobj
        - { category: undefined_cs, payload_required: true }
        - { category: pdftex_prim, payload_required: true }
    condition:
      source_contains: "\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*\\bspotcolor\\b"
    action:
      kind: builtin_transform
      function: bundled_class_shadow
      params:
        target: spotcolor.sty
        needs: [] # 纯 xcolor 仿真不再桥 xespotcolor —— 零外部依赖
        cs_set: # spotcolor 公开 API 名 + 其内部 pdfTeX 原语 (两口径 payload)
          [
            SpotSpace,
            AddSpotColor,
            NewSpotColorSpace,
            SetPageColorResource,
            SetPageColorSpace,
            SpotColor,
            csgrab,
            pdfobj,
            pdflastobj,
            pdfcolorstack,
            pdfrefobj,
          ]
        # REWRITE (qc-impl 2026-09-28): xespotcolor 桥接弃用 ——
        # ieeeaccess.cls 无 cmyk 退路 (else 支即 spotcolor 路本身),
        # \pdfcolorstack/\pdfrefobj payload 面经 cls 内直调浮出
        # (桥接件救不了包外原语)。改纯 xcolor 仿真: AddSpotColor 4 参
        # (space/name/disp/"c m y k") 空隔分词 cmyk 解析落
        # \definecolor{name}{cmyk}{c,m,y,k}; \definecolor 包装拦截
        # {spotcolor}{name,tint} 模型 → {named}{name} (取首元, tint
        # 舍近似); NewSpotColorSpace/SetPageColorSpace/
        # SetPageColorResource/SpotSpace 全 noop。
        body: |
          \NeedsTeXFormat{LaTeX2e}
          \ProvidesPackage{spotcolor}[2026/09/28 fixloop shadow -> xcolor cmyk emulation]
          \DeclareOption*{}
          \ProcessOptions\relax
          \RequirePackage{xcolor}
          % \AddSpotColor{space}{name}{disp}{"c m y k"} →
          % \definecolor{name}{cmyk}{c,m,y,k}: 空隔分词靠限定参
          % (尾部补 0 0 0 垫不齐 3 元组面), #6 吞残段
          \def\txl@spot@cmyk#1#2 #3 #4 #5 #6\@nil{%
            \definecolor{#1}{cmyk}{#2,#3,#4,#5}}
          \providecommand{\AddSpotColor}[4]{%
            \txl@spot@cmyk{#2}#4 0 0 0 \@nil}
          % \definecolor{x}{spotcolor}{name,tint} → {named}{name}
          % (取逗号前首元 = AddSpotColor 已定义色); xcolor 真签名带
          % [type] 可选参 —— \@ifnextchar 派发两臂, opt 臂同查
          % spotcolor 模型 (模型在 #3 位), 余者原样直通防吞 [..]
          \let\txl@spot@origdefinecolor\definecolor
          \def\txl@spot@first#1,#2\@nil{\def\txl@spot@nm{#1}}
          \def\txl@spot@dc@plain#1#2#3{%
            \begingroup
            \def\txl@spot@m{#2}\def\txl@spot@s{spotcolor}%
            \ifx\txl@spot@m\txl@spot@s
              \endgroup
              \expandafter\txl@spot@first#3,\@nil
              \txl@spot@origdefinecolor{#1}{named}{\txl@spot@nm}%
            \else
              \endgroup
              \txl@spot@origdefinecolor{#1}{#2}{#3}%
            \fi}
          \def\txl@spot@dc@opt[#1]#2#3#4{%
            \begingroup
            \def\txl@spot@m{#3}\def\txl@spot@s{spotcolor}%
            \ifx\txl@spot@m\txl@spot@s
              \endgroup
              \expandafter\txl@spot@first#4,\@nil
              \txl@spot@origdefinecolor[#1]{#2}{named}{\txl@spot@nm}%
            \else
              \endgroup
              \txl@spot@origdefinecolor[#1]{#2}{#3}{#4}%
            \fi}
          \def\definecolor{\@ifnextchar[\txl@spot@dc@opt\txl@spot@dc@plain}
          % 余 API 面 noop: 色彩空间登记/页面资源/SpotSpace 空串
          \providecommand{\NewSpotColorSpace}[1]{}
          \providecommand{\SetPageColorSpace}[1]{}
          \providecommand{\SetPageColorResource}[1]{}
          \providecommand{\SpotColor}[2]{}
          \def\SpotSpace{ }
          \endinput
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同缺 pdf 原语
    provenance:
      - {
          corpus: "2410.00012 (loop1 stagerun)",
          error: "ieeeaccess.cls:128 Undefined control sequence (spotcolor \\AddSpotColor→\\pdfobj, payload=SpotSpace)",
        }
    stats: { fires: 7, rescued_cells: 2, status: active }
    source_ref: "loop1 rerun residual; xespotcolor.sty v2.1 API 核对"

  # 新增 (loop2-delta 残格): axessibility 是 pdfTeX-only 可访问性标注包,
  # TL 有真包 (missing_file 打不到), 其体内 \pdfcompresslevel/
  # \pdfoptionpdfminorversion/\pdfglyphtounicode 在 xelatex/tectonic 下
  # undefined_cs→pdftex_prim。包面无用户命令 (只补丁 \document/\section
  # 内部做 ActualText 标注) → 空 stub 吞掉 accsupp/tagpdf 选项即可。
  - id: axessibility_xetex_shadow
    description: "axessibility (pdfTeX-only) → wdir 注 axessibility.sty 空 stub 吞选项"
    phase: loop
    order: 157 # spotcolor_xetex_shadow(156) 同档: 遮蔽先于逐宏补
    when:
      any:
        - { category: undefined_cs, payload_required: true }
        - { category: pdftex_prim, payload_required: true }
    condition:
      source_contains: "\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*\\baxessibility\\b"
    action:
      kind: builtin_transform
      function: bundled_class_shadow
      params:
        target: axessibility.sty
        needs: []
        cs_set: # 包体 pdfTeX 原语全集 (payload 口径可命中任一)
          [
            pdfcatalog,
            pdfcompresslevel,
            pdfextension,
            pdfgentounicode,
            pdfglyphtounicode,
            pdfoptionpdfminorversion,
          ]
        body: |
          \NeedsTeXFormat{LaTeX2e}
          \ProvidesPackage{axessibility}[2026/09/16 fixloop shadow -> no-op (pdfTeX-only)]
          \DeclareOption*{}
          \ProcessOptions\relax
          \endinput
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同缺 pdf 原语
    provenance:
      - {
          corpus: "2105.03906/2203.00048/2211.00005/2308.12590/2403.05523/2403.05532 (loop2-delta)",
          error: "axessibility.sty:349 \\pdfcompresslevel=0 Undefined control sequence → unfixable:pdftex_prim",
        }
    stats: { fires: 9, rescued_cells: 7, status: active }
    source_ref: "loop2-delta unfixable:pdftex_prim ×6 全为 \\usepackage[accsupp]{axessibility}"

  # 2504.07951 (qc-impl 2026-09-28): accsupp 是 pdfTeX-era ActualText
  # 标注包 —— 体内 \pdfliteral/\pdfobj/\pdfrefobj/\pdfannot/
  # \pdflastobj 原语在 xelatex 下 undefined_cs→pdftex_prim 级联;
  # accsupp 也常随 [accsupp]{axessibility} 装载面被上游引入
  # (axessibility stub 吞选项后 accsupp 本身若被直拉仍炸)。包面
  # 语义只是"包夹文本附加 ActualText" —— noop 吞选项/端点 cs,
  # 被包夹正文照排不丢字。
  - id: accsupp_xetex_shadow
    description: "accsupp (pdfTeX-era ActualText 标注) → wdir 注 accsupp.sty noop stub (包夹文本保留)"
    phase: loop
    order: 157.5 # axessibility_xetex_shadow(157) 同档姊妹臂: 遮蔽先于逐宏补
    when:
      any:
        - { category: warn_missing_char } # 缺字面亦可浮出 (族臂判据认 when 含此)
        - { category: undefined_cs, payload_required: true }
        - { category: pdftex_prim, payload_required: true }
    condition:
      source_contains: "accsupp"
    action:
      kind: builtin_transform
      function: bundled_class_shadow
      params:
        target: accsupp.sty
        needs: []
        cs_set: # 包体 pdfTeX 原语 + 公开 API 端点 (payload 口径两路命中)
          [
            pdfliteral,
            pdfobj,
            pdfrefobj,
            pdfannot,
            pdflastobj,
            BeginAccSupp,
            EndAccSupp,
            AccSupp,
          ]
        body: |
          \NeedsTeXFormat{LaTeX2e}
          \ProvidesPackage{accsupp}[2026/09/28 fixloop shadow -> no-op (pdfTeX-only)]
          \DeclareOption*{}
          \ProcessOptions\relax
          % accsupp API 面: \BeginAccSupp{opts}...\EndAccSupp{} 包夹
          % + \AccSupp{opts}{text} 一次形 —— noop 吞选项, 包夹文本照排
          \providecommand{\BeginAccSupp}[1]{}
          \providecommand{\EndAccSupp}[1]{}
          \providecommand{\AccSupp}[2]{#2}
          \endinput
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2504.07951 (vault QC replay, qc-impl-2026-09-28)",
          error: "accsupp.sty 内 pdfliteral/pdfobj/pdfrefobj/pdfannot/pdflastobj 原语 → undefined_cs/pdftex_prim 级联",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json accsupp_xetex_shadow; axessibility_xetex_shadow(157) 同构"
    known_gap: "ActualText 标注义丢失 (无视觉差异, 仅可访问性元数据); 包内非 API 原语调用面已由 stub 整体遮蔽不触"
  # → \DeclareOption* 里 \InputIfFileExists{sv\CurrentOption.clo} 逐选项
  # 落空, \journalopt 停 \@empty → "Class SVJour Error: No valid journal
  # specified" + \stop。builtin 按 \documentclass 选项写 sv<opt>.clo noop
  # stub (\endinput), InputIfFileExists 走真臂置 \journalopt 即过; 盘上
  # 真 .clo 不覆盖。taxonomy 无专类: '!' 行落 other, 尾部 \stop 抢签时
  # 归 emergency —— ctx_suggests 正则 err_head 两类归属下都判别。
  # 与 vendored svjour.cls 不冲突 (shim_map 槽已删): vendored_fetch 管缺类,
  # 这条管有类缺 clo。
  - id: svjour_clo_stub
    mechanisms: [B05]
