  # shipclscen census (begindoccen 残件): 随源 .cls/.sty 内部裸 \input X.sty
  # 站 —— \input 以宿主当前 @ catcode 读件; 宿主自身经裸 \input/2.09 option
  # 链载入 (@=other) 时载入件内全部 @-cs 断名 → Missing \begin{document}
  # 级联 (aipproc.cls:10 \input{aipproc.sty} 型, 语料 ~20 随源件带此站)。
  # input_sty_to_usepackage(-11)/input_sty_209_requirepkg(-12) 两臂只管
  # doc 侧 .tex 导言区 (\begin{document} 前瞻闸 + \documentclass/style 门),
  # 随源件内部站点与 fragment .tex 够不着 —— 本规则补位: \edef 存
  # \catcode 64 现值 → =11 读件 → 复元 (svglov3.clo exact-restore idiom;
  # 裸 \makeatletter/\makeatother 对会把 @=letter 宿主尾段强翻回 12,
  # 1608.06693 15\p@ 实证), @=letter 宿主下恒等变换。
  - id: shipped_sty_input_wrap
    description: "随源 .cls/.sty/.tex 件内裸 \\input X.sty (@=other 载入 → @-cs 全裂) → exact-restore @ 包裹"
