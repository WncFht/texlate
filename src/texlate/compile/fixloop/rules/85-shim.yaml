    order: -0.5 # input_sty 两臂 (-12/-11) 与 tar_blob_extract(-1) 之后, static_precheck(0) 前 —— doc 侧改写+冒名件解包落地后收网余下 live 站
    when: { always: true }
    condition:
      # raw 粗筛 —— builtin 内 mask_tex 遮盖视图复核是权威
      source_contains: "\\\\input\\s*\\{?\\s*[A-Za-z][A-Za-z0-9_./-]*\\.sty"
