  # 2026-09-20 csfix8 (1511.06717): aa.cls \def\filedate{2014/12/1} —
  # 月/日段单数字让 kernel \@parse@version@dash 错位, \@nil 漏进 \ifnum →
  # 每次 \@ifl@ter/\usepackage 处 undefined_cs|@nil 级联。根修 = 源级把
  # YYYY/M/D 单数字月日段补零 (双臂: 日段 / 月段), 双位数日期不动。
  # masked 面匹配防注释行误改; 条件双门 (payload=@nil + 源有短日期形)
  # 挡无关 @nil 触发。
  - id: provides_date_daypad
    mechanisms: [B05]
    description: "随源 cls/sty/tex 版本日期月日段单数字 → \\@parse@version 错位 \\@nil 入 \\ifnum → 月日段补零"
    phase: loop
    order: 159.5 # svjour_clo_stub(159) 与 journal_cs_polyfill(160) 之间: cls 源级补丁先于逐宏补
    when: { category: undefined_cs, payload_required: true }
    condition:
      payload_pattern: "^\\\\?@nil$"
      source_contains: "(?<![0-9])[0-9]{4}/(?:[0-9]{1,2}/[0-9](?![0-9])|[0-9]/[0-9]{1,2}(?![0-9]))"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(?<![0-9])([0-9]{4}/[0-9]{1,2}/)([0-9])(?![0-9])",
              repl: "\\g<1>0\\g<2>",
              match_surface: masked,
            }
          - {
              pattern: "(?<![0-9])([0-9]{4}/)([0-9])(/[0-9]{1,2}(?![0-9]))",
              repl: "\\g<1>0\\g<2>\\g<3>",
              match_surface: masked,
            }
    risk: low # 双门窄签 + 仅单数字段补零; 双位数日期与三位数段均不动
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1511.06717 (singles4 csfix8)",
          error: "Undefined control sequence \\@nil (aa.cls \\def\\filedate{2014/12/1} 单数字日段)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-csfix8/ aafix.cls+trb.log 实证"

  # 新增 (fixloop-v2 整改): AAS 期刊缩写宏缺失 —— tectonic bundle 内置
  # aastex 5.0rc3.1 (1999) 没有 \actaa 族 (emulateapj/后期 aastex 才有);
  # undefined_cs payload (l.N 行末 cs 名) 命中期刊表 → 全表 \providecommand
  # 注入主文件 \documentclass 后。payload 不命中 → False 落 guess。
  - id: journal_cs_polyfill
    mechanisms: [W96]
    description: "AAS 期刊缩写宏缺失 (老 aastex/内置类太旧) → 注入期刊宏表 providecommand"
    phase: loop
    order: 160 # vendored_sty_shadow(150) 之后, undefined_cs_guess(900) 之前
    when: { category: undefined_cs, payload_required: true }
    action:
      kind: builtin_transform
      function: journal_cs_polyfill
      params:
        # fixable-data (astro-ph/0605222): aastex 族天文缩写宏 —— 稿写
        # [O~{\sciii}] 形 (O 字面), 故 sciii 展开为 {\sc iii} 而非 AAS 的
        # [O\,{\sc iii}] 全形; hb/ha 巴尔末线, arcsec 角秒。
        macros:
          sciii: '{\sc iii}'
          scii: '{\sc ii}'
          ha: 'H$\alpha$'
          hb: 'H$\beta$'
          arcsec: "''"
          # fixer-polyfill-journal 2026-09-17: \farcs=AAS 角秒小数
          # (0\farcs60→.″60, 1003.0851 实证); \hbox{$''$} 双模安全
          farcs: ".\\hbox{$''$}"
          # aa.cls 系裸 \acknowledgements 章头 —— 0806.3705/astro-ph/0408064/
          # astro-ph/0501615; env 形 \begin{acknowledgements} 别签名不进此表
          acknowledgements: '\section*{Acknowledgements}'
          # aj_pt4/aaspp4 横排表页声明宏 —— deluxetable 前哨标记, 无独立
          # 输出, 版面旋转由 deluxetable 侧自理; astro-ph/0003115
          # (documentstyle[aj_pt4], 编译走到 l.356 仅炸本宏) 实证
          ptlandscape: ""
          # 1907.10408 (qc-impl 2026-09-28): aastex-era \texttwelveudash
          # 十二连破折 → \textemdash 近似 (aastex_bundle_shadow body
          # 同位条目, emulateapj shim 体同式)
          texttwelveudash: "\\textemdash"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1806.06690 tectonic 臂 (fixloop-corpusv2)",
          error: "Undefined control sequence \\actaa (bundle 内 aastex 5.0rc3.1 无此宏)",
        }
    stats: { fires: 2, rescued_cells: 1, status: active }
    source_ref: "fixloop-v2 整改; emulateapj.cls L1201-1256 期刊表"

