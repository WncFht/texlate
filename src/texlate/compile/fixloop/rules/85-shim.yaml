  # mathchar census (failmine3, ~6 格): 译稿把 CJK 放进 \bm{...} 实参,
  # xelatex/tectonic 下炸 "Extended mathchar used as mathchar (<0x05xxxxxx>)"
  # —— bm.sty \bm@test@token 原子遍历对实参内每个 catcode-11/12 token 做
  # \count@\mathcode`#1, XeTeX 的 \mathcode 旧式 15-bit 操作数扫描对 >0xFF
  # 字符 (xeCJK CJK 字/扩展 mathcode) 必炸 (tmp/mathchar 实证: \mathcode`这
  # operand scan 即炸, \mathcode`Ω 同炸非 CJK 专属; 裸 $这$/{\rm}/\tilde/
  # 上下标全不炸 —— 触发面只锁 \bm 族实参)。taxonomy 无专类归 other,
  # ctx_suggests 锁错误签名。修法 = 序言守卫式重定义: \bm#1 → \TeXlateBM{{#1}}
  # 双花括号走 bm 自带 group 路径 (\bm@gr@@p→\boldmath), 遍历被跳过且粗体
  # 语义保留; \b/\unit 等 \newcommand 别名调用点重展开 \bm 同愈;
  # \boldsymbol/\heavysymbol (\let 别名) 经 \ifx 等义复核后重绑。
  - id: bm_extended_mathchar_wrap
    description: "\\bm{<CJK>} 撞 Extended mathchar 墙 → 守卫式 \\bm 族重定义走 group 路径"
    phase: loop
    order: 162 # biblatex_bbx_rename(161) 与 physics_stub_detach(163) 之间: 源级补丁同档
    when: # taxrow 落地前归 other —— mathchar_ext 专属行 + other 兼容
      any:
        - { category: other }
        - { category: mathchar_ext }
    condition:
