  # fmsingles census (failmine4 item5, 2105.03729 stagerun-loop3): siunitx v3
  # \__siunitx_load_check:n 对不兼容名单 {SIunits,sistyle,units,unitsdef,
  # fancyunits} 做 \@ifpackageloaded 硬报错 (装载时 + AtBeginDocument 复查
  # 前三), 且 \NewDocumentCommand\unit 撞 units 已定义 → already_def。
  # 该格三签名同机理: incompatible×2 (other) + \unit already_def +
  # \close@column@grid 级联。修法 = 装载点前置 ver@X.sty=\relax 注销全部
  # 不兼容名 (physics_stub_detach 同机理) + 存/摘 \unit 让 siunitx 落定义
  # + 载后复元 units 语义 (\unit[38]{mW} units 语法实证, tmp/lane-fmsingles)。
  - id: siunitx_incompat_peace
    mechanisms: [W100]
    description: "siunitx v3 不兼容名单 (units/SIunits 等) \\@ifpackageloaded 硬报错 → ver@ 注销续载 + \\unit 存复"
    phase: loop
