# rules/50-font.yaml — fixloop 规则库分片：字体 —— fontspec/missing_pfb 字体替换与度量族
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/00-base.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  - id: install_sysfont
    description: "fontspec 'font X cannot be found' → 按 {X}.otf/.ttf/.ttc 搜包安装"
    phase: loop
    order: 30
    when: { category: fontspec_missing, payload_required: true }
    action:
      kind: install_file
      params:
        {
          file: "{payload}",
          try_exts: [".otf", ".ttf", ".ttc"],
          font_related: true,
        }
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: ctan_fetch_font # 拉包装字体文件; 但 fontspec 按名查找需 fontconfig 可见
        fallback: advisory # 建议: 换 bundle 内字体名 / 注入 fontspec Path=./ / 装系统字体
        note: "放 workdir 不够, 需配合源改写 Path= 或字体注册 → 标 partial"
    provenance:
      - {
          corpus: "*/ctex|zh (14格)",
          error: "font “FandolSong-Regular” cannot be found → fandol",
        }
    stats: { fires: 14, rescued_cells: 14 }
    source_ref: "fixloop.py L324-332"

  # 2026-09-16 wave-3: install_sysfont 失败后的二级出路 —— 名查找的字体
  # (fontconfig 面) 根本不在 TL 包索引 (Noto Mono: 发行版只有 Noto Sans
  # Mono; 名字带空格亦进不了 filemap) → 把文档对 {payload} 的引用换成
  # LM 显示名。用显示名不用文件名: 全家族解析 (\textbf/\textit 自动
  # 命中字重), 裸 .otf 只给单重; "Latin Modern *" 经 engine 注入的
  # FONTCONFIG_FILE (texmf opentype 注册) 保证可解, 每个 TL 都有 lm。
  - id: font_name_substitute
    description: "fontspec 名查找字体真缺 (install 无解) → 引用换成 Latin Modern 显示名"
    phase: loop
    order: 31 # install_sysfont(30) 装不上才轮到换名
    when: { category: fontspec_missing, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(\\\\setmonofont|\\\\setCJKmonofont)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>{Latin Modern Mono}',
            }
          - {
              pattern: "(\\\\setmathfont)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>{Latin Modern Math}',
            }
          - {
              pattern: "(\\\\setmainfont|\\\\setsansfont|\\\\setromanfont|\\\\setmathrm|\\\\fontspec|\\\\setCJKmainfont|\\\\setCJKsansfont|\\\\setfontfamily)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>{Latin Modern Roman}',
            }
          - {
              pattern: "(\\\\newfontfamily|\\\\newfontface|\\\\setfontface|\\\\newCJKfontfamily)(\\s*(?:\\[[^\\]]*\\]\\s*)?)(\\s*\\{[^}]*\\}|\\\\[a-zA-Z@]+)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>\g<3>\g<4>{Latin Modern Roman}',
            }
          # ── qc99 (2026-09-28, 2609.20684): babel \babelfont 面 ──
          # \babelfont[<langs>]{<fam>}[<features>]{<font>} —— 主参尾 brace
          # 才是 fontspec_missing payload 槽位; features 括号内 XxxFont=
          # 引用同族文件名 (Amiri-Bold.ttf 等) 会下轮连环报缺 → 当括号
          # 全由 *Font= 键构成时整括号丢弃, 目标家族自解析 Bold/Italic
          # 面 (Naskh/LM 均带真字重)。arabic 臂必先于 generic 臂 (generic
          # 同样匹配 [arabic] 括号, 抢跑会把阿拉伯语面换 LM → tofu)。
          - {
              pattern: "(\\\\babelfont\\s*\\[[^\\]]*arabic[^\\]]*\\]\\s*\\{[^}]*\\})\\s*\\[\\s*(?:(?:BoldFont|ItalicFont|BoldItalicFont|SlantedFont|BoldSlantedFont|SwashFont|BoldSwashFont|SmallCapsFont|UprightFont)\\s*=\\s*[^,\\]]+\\s*(?:,\\s*)?)+\\]\\s*\\{\\s*{payload}(?:\\.(?:otf|ttf|ttc|OTF|TTF|TTC))?\\s*\\}",
              repl: '\g<1>{Noto Naskh Arabic}',
            }
          - {
              pattern: "(\\\\babelfont\\s*(?:\\[[^\\]]*\\]\\s*)?\\{[^}]*\\})\\s*\\[\\s*(?:(?:BoldFont|ItalicFont|BoldItalicFont|SlantedFont|BoldSlantedFont|SwashFont|BoldSwashFont|SmallCapsFont|UprightFont)\\s*=\\s*[^,\\]]+\\s*(?:,\\s*)?)+\\]\\s*\\{\\s*{payload}(?:\\.(?:otf|ttf|ttc|OTF|TTF|TTC))?\\s*\\}",
              repl: '\g<1>{Latin Modern Roman}',
            }
          # features 括号含非 *Font 键 (Script/Scale 等) → 保留括号只换主参
          - {
              pattern: "(\\\\babelfont\\s*\\[[^\\]]*arabic[^\\]]*\\]\\s*\\{[^}]*\\})(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}(?:\\.(?:otf|ttf|ttc|OTF|TTF|TTC))?\\s*\\}",
              repl: '\g<1>\g<2>{Noto Naskh Arabic}',
            }
          - {
              pattern: "(\\\\babelfont\\s*(?:\\[[^\\]]*\\]\\s*)?\\{[^}]*\\})(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}(?:\\.(?:otf|ttf|ttc|OTF|TTF|TTC))?\\s*\\}",
              repl: '\g<1>\g<2>{Latin Modern Roman}',
            }
    risk: medium # 字体观感改变 (Noto→LM); 只对已确认装不上的字体动手
    known_gap: "显示名解析依赖 engine 的 FONTCONFIG_FILE 注入 (texmf opentype 注册); payload 含正则元字符会过配 (brace 边界已挡大部分); addfontfeatures 等冷门 cs 未覆盖 → applied=False; \babelfont features 括号混非 *Font 键时括号保留、其内缺名字体下轮仍可能报缺 (applied=False 落人工)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop2-delta fontspec_missing (1706.00240)",
          error: "The font \"Noto Mono\" cannot be found (\\setmonofont, bundled font-termes.sty)",
        }
    stats: { fires: 10, rescued_cells: 2, status: active }
    source_ref: "wave-3: fontspec_missing 名替换面 (install_sysfont 兜底)"

  - id: missing_pfb_updmap
    description: "xdvipdfmx 物理字体缺失 (.vf/pfb) → updmap-user 重建 map"
    phase: loop
    order: 40
    when: { category: missing_pfb }
    action:
      kind: run_tool
      params: { argv: ["updmap-user"], once_per_payload: true, timeout: 120 }
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: unsupported # tectonic 无 updmap, map 由 bundle 管
        fallback: escalate_llm # 建议路由回 xelatex 或人工
    provenance:
      - {
          corpus: "—",
          error: "xdvipdfmx:fatal: Cannot proceed without .vf/physical font",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "fixloop.py L335-341"

  # 新增 (docs/08:275): tectonic 下 missing_pfb 的改写出路 ——
  # 物理字体投放已实证死路 (ctanfetch-probe §3.4), 换 Type1 近亲 shim
  - id: font_sub_shim
    mechanisms: [W103]
    description: "MF-only 字体包 (bbm 等) → Type1 近亲 (dsfont/dsrom) shim 改写"
    phase: loop
    order: 45 # missing_pfb 在 tectonic 的顺位 (updmap unsupported → 落此)
    when: { category: missing_pfb, payload_required: false }
    condition:
      engine_in: [tectonic]
      shim_known: true # 工程须用了 shim_map 内的 MF-only 包
    action:
      kind: builtin_transform
      function: font_sub_shim
      params:
        exts: [.tex, .sty]
        shim_map:
          bbm:
            {
              usepackage: "dsfont",
              cs_map:
                { mathbbm: "mathds", mathbmss: "mathds", mathbmtt: "mathtt" },
            }
          # 探针实证改写 (ctanfetch-probe §3.4): 注掉 bbm, dsfont 已在 bundle 内
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 有 updmap, 不需要 shim
    provenance:
      - {
          corpus: "2305.14335 (ctanfetch-probe)",
          error: "xdvipdfmx: bbm10 physical font dead",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/spec/compile.md L275; ctanfetch-probe.md §3.4"

  - id: px_to_bp
    description: "非法单位 px → bp 换算 (pdfTeX 缺省忠实: 1px = 1bp)"
    phase: loop
    order: 60
    when: { category: illegal_unit }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty]
        rewrites:
          - { pattern: "(\\d*\\.?\\d+)\\s*px\\b", function: px_to_bp }
          # px_to_bp: repl = fmt(num, 去尾零) + "bp" (pdfTeX 忠实 1:1)
    risk: low
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1810.04805/*",
          error: "Illegal unit of measure (px inserted)",
        }
    stats: { fires: 3, rescued_cells: 3, status: active }
    source_ref: "fixloop.py L364-375"

  - id: microtype_off
    description: "XeTeXglyph×TFM (microtype 探针量不了 TFM) → 关 protrusion/expansion"
    phase: loop
    order: 70 # 同 trigger 的 times_to_newtx(80) 之前: 先保守关特性
    when: { category: xetexglyph_tfm }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\(usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{microtype\\}",
              repl: '\\\g<1>[protrusion=false,expansion=false]{microtype}',
            }
    risk: low
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1706.03762/ctex|zh, 1906.08237/ctex|zh",
          error: "Cannot use XeTeXglyph with ptmr8c",
        }
    stats: { fires: 4, rescued_cells: 4 }
    source_ref: "fixloop.py L378-393"

  # 2026-09-20 microtypelis lane (soak-2026-09-18 普查 5 格同签 +
  # wave-10 后续 3 格 fairmeta.cls 同签第二容器):
  # ICLR-2027 系 doc-shipped cls (applemlr/onethree/style/technical_report/
  # fairmeta) 模板段 ``\DisableLigatures[f]{family=sf*}`` —— microtype 该 cs 仅
  # pdfTeX≥1.30/LuaTeX 可达, XeTeX 族 (xelatex/tectonic) 下抛可恢复
  # \PackageError "Disabling ligatures of a font is only possible with
  # pdftex version 1.30 or newer. Ignoring \DisableLigatures." —— PDF 照出
  # 但 error 计数使 verdict 落 best_effort_pdf。file-line 形签名 taxrow 归
  # microtype_pdftex (other 闸保兼容);
  # 与 microtype_off 的 xetexglyph_tfm 主场分臂 (触发面与动作皆异——
  # 同改 usepackage 行会顺带关 protrusion/expansion, 超出本错所需)。
  # 修 = 行注释中和: microtype 自报 "Ignoring" 即本引擎下该调用本就空转,
  # 注释零语义差; masked 面挡 verbatim/已注释行重复点火。
  - id: microtype_lig_off
    description: "microtype \\DisableLigatures (pdfTeX/LuaTeX 专属 cs) → XeTeX 族下注释中和"
    phase: loop
    order: 71 # microtype_off(70) 同族邻位; other+ctx 臂与 xetexglyph_tfm 臂互不抢签
    when: # file-line 签名 taxrow 归 microtype_pdftex; other 保兼容
      any:
        - { category: other }
        - { category: microtype_pdftex }
    condition:
      ctx_suggests: "Disabling ligatures"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "^[ \\t]*\\\\DisableLigatures\\b[^\\n]*",
              repl: "%\\g<0>",
              flags: [MULTILINE],
              match_surface: masked,
            }
    risk: low # 本引擎下该调用恒被 microtype Ignoring, 注释即其自身语义
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # tectonic XeTeX 血统同不可达该 cs
    provenance:
      - {
          corpus: "soak-2026-09-18 (2609.19356/19911/20511/20581/20804; ICLR-2027 系 doc-shipped cls)",
          error: "Package microtype Error: Disabling ligatures of a font is only possible with pdftex version 1.30 or newer",
        }
      - {
          corpus: "stagerun-m1k-2026-09-19 (2412.06264/2504.01017) + soak-2026-09-18 (2609.19664); fairmeta.cls 同签第二容器",
          error: "fairmeta.cls:25: Package microtype Error: Disabling ligatures ... (同 ICLR 簇 \\DisableLigatures[f]{family=sf*})",
        }
    stats: { fires: 13, rescued_cells: 13, status: active }
    source_ref: "microtype.sty \\DisableLigatures pdfTeX/LuaTeX 引擎闸; tmp/lane-microtypelis/"

  # 2026-09-20 optfix lane (singlesweep microtype-xetex 机理, 2310.02541
  # base): microtype ``expansion`` 族在 XeTeX 下恒不工作
  # (microtype-xetex.def:874 \\MT@error —— protrusion 支持, expansion
  # 不支持), ``\\usepackage[...,expansion=true,...]{microtype}`` (多行
  # 括号) → file-line "Package microtype Error: Font expansion does not
  # work with xetex" 归 other。修 = microtype 附着括号/PassOptions 首参内
  # expansion 键值翻 false + activate 键 (protrusion+expansion 复合开关)
  # 无显式 expansion 键时尾补 `,expansion=false` —— 只关 expansion,
  # protrusion 等其余键全留。masked 面挡注释内候选配置 (该文档常并排
  # 注释多套 usepackage 备选, 2310.02541:215-216 实证)。
  - id: microtype_expansion_off
    description: "microtype expansion/activate 开 (XeTeX 不支持 expansion) → 附着括号内翻 false"
    phase: loop
    order: 72 # microtype_off(70)/microtype_lig_off(71) 同族邻位; other+ctx 臂
    when: # file-line 签名 taxrow 归 microtype_pdftex; other 保兼容
      any:
        - { category: other }
        - { category: microtype_pdftex }
    condition:
      ctx_suggests: "expansion does not work"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # \\usepackage[..,expansion=<非false>,..]{microtype} → expansion=false
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*\\[[^\\]]*?\\bexpansion\\s*=\\s*)(?!false\\b)[\\w-]+([^\\]]*\\]\\s*\\{microtype\\})",
              repl: "\\g<1>false\\g<2>",
              match_surface: masked,
            }
          # \\PassOptionsToPackage{..,expansion=<非false>,..}{microtype} 同形
          - {
              pattern: "(\\\\PassOptionsToPackage\\s*\\{[^}]*?\\bexpansion\\s*=\\s*)(?!false\\b)[\\w-]+([^}]*\\}\\s*\\{microtype\\})",
              repl: "\\g<1>false\\g<2>",
              match_surface: masked,
            }
          # activate={..}/activate=<v> 且括号内无显式 expansion 键 → 尾补
          # `,expansion=false` (activate 复合含 expansion; keyval 后写键赢)
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*\\[(?![^\\]]*\\bexpansion\\s*=)[^\\]]*\\bactivate\\s*=\\s*(?:\\{[^}]*\\}|[^\\s,\\]]+)[^\\]]*)\\](\\s*\\{microtype\\})",
              repl: "\\g<1>,expansion=false]\\g<2>",
              match_surface: masked,
            }
    risk: low # expansion 在 XeTeX 下本即不可达, 关断即 microtype 自报语义
    known_gap: "\\microtypesetup{expansion=...} 载后配置面与 \\DeclareMicrotypeSet 家族未覆盖"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同不支持 expansion
    provenance:
      - {
          corpus: "stagerun-m1k-2026-09-19 (2310.02541/base; singlesweep microtype-xetex)",
          error: "main.tex:323: Package microtype Error: Font expansion does not work with xetex (\\usepackage[protrusion=true,expansion=true,final,babel]{microtype})",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-singlesweep/mech_buckets.json microtype-xetex; microtype-xetex.def:874 \\MT@error"

  - id: times_to_newtx
    description: "times/mathptmx/mathptm (T1 TFM 字体族) → newtxtext/newtxmath (OTF)"
    phase: loop
    order: 80 # 与 microtype_off 同 trigger; dedup 使同 payload 二轮才轮到它
    when: { category: xetexglyph_tfm }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty]
        rewrites:
          - {
              pattern: "\\{mathptmx\\}|\\{mathptm\\}",
              repl: "{newtxtext,newtxmath}",
            }
          - { pattern: "\\{times\\}", repl: "{newtxtext}" }
    risk: medium # 换字体族改版式
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "—",
          error: "xetexglyph_tfm 的二线方案 (microtype_off 修不动时)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "fixloop.py L396-406"

  # 1907.03923 (stagerun-loop3) 实证: ``\usepackage{pigpen}`` → dist 侧
  # ``pigpen.map`` 行 ``pigpen <pigpen.pfa`` 折进 pdftex.map → xdvipdfmx
  # 对 ASCII Type1 按扩展名硬拒 (只收 .pfb 二进制)。签名只走
  # stderr→stdout_tail (.log 干净) —— ``_report_of`` 归一成 '!' 行使
  # ``other`` 类目可见 (pdf_asset_sanitize 同族派发面)。修复 = 纯 python
  # pfa→pfb 转换 (t1binary 等价, eexec 密文段原样 hex 解码不解密) 产物
  # 落 usertree ``home/fonts/type1/`` + pdftex.map 改写副本落
  # ``var/fonts/map/pdftex/updmap/`` (TEXMFVAR 位遮蔽系统树) + 源
  # ``<pkg>.map`` 同路径遮蔽落 ``home/fonts/map/dvips/`` (updmap 再生
  # 面保险) —— 全在格级 usertree, 不动宿主树, 幂等。
  - id: pfa_to_pfb
    description: "xdvipdfmx 'pfa format not supported' fatal → usertree 内 pfa→pfb 转换 + pdftex.map/源 .map 遮蔽"
    phase: loop
    order: 42 # missing_pfb_updmap(40)/font_sub_shim(45) 同族物理字体面
    when: { category: other }
    condition:
      ctx_suggests: "pfa format not supported"
    action:
      kind: builtin_transform
      function: pfa_to_pfb
      params: {}
    risk: low # 只写 usertree 遮蔽件不改源; 工程内 map 才就地改写
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: unsupported # tectonic 无 usertree/updmap map 遮蔽面
        fallback: escalate_llm # 建议路由回 xelatex 或人工
    provenance:
      - {
          corpus: "1907.03923 (stagerun-loop3; \\pigpenfont 在 xymatrix 邻接符)",
          error: "xdvipdfmx:fatal: Sorry, pfa format not supported; please convert the font to pfb, e.g., with t1binary.",
        }
    stats: { fires: 3, rescued_cells: 1, status: active }
    source_ref: "tmp/lane-pfa/; kpsewhich TEXFONTMAPS/T1FONTS 遮蔽序实测"
