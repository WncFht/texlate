# rules/95-targeted.yaml — fixloop 规则库分片：cs_targeted_fix —— undefined_cs → 定点修复表（单条独占）
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # 新增 (2026-09-16): undefined_cs 无包映射项的 cs→修复表 —— spec 支持
  # strip_pkg/usepackage+装文件/cs_map/polyfill 组合 (builtins.cs_targeted_fix)。
  # 首版表: headerps@out→剥 breakurl (dvips 钩子在 Unicode 引擎无定义),
  # mathbbm→xelatex 装 bbm / tectonic 换 dsfont\mathds。
  - id: cs_targeted_fix
    mechanisms: [W17, W96, B01, W112, W113, W114, W122, W125]
    description: "undefined_cs payload 命中 cs 修复表 → 剥包/装包/宏改写/polyfill 定向修"
    phase: loop
    order: 165 # journal_cs_polyfill(160) 之后, undefined_cs_guess(900) 之前
    when:
      any:
        - { category: undefined_cs, payload_required: true }
        # 批七扩类: pkg_obsolete payload=废弃包名, 同表 strip_pkg+usepackage
        # 语义 (amstex→amsmath)。builtin 不验 category, 表查询与来源无关。
        - { category: pkg_obsolete, payload_required: true }
    action:
      kind: builtin_transform
      function: cs_targeted_fix
      params:
        # 默认表 = _builtins_csfix._CS_FIX_TABLE; 此 cs_table 叠加在其上。
        # n100 undefined_cs 逐签名归因: 全部 24 个 payload 均为 splice/join
        # 合并残骸 (cs+后 token 粘连), 非缺包 —— cs_map 拆回原形
        # (\\old\b 词边界定, 不碰更长 cs)。笔误类 llm_hook 候选本批为零。
        cs_table:
          # \item+X: 1012.1321/2003.10959/2009.11013/2105.03900/2410.06025/
          # math--0307301 —— itemize 内 \item 与首词粘连
          itemFSU: { cs_map: { itemFSU: "item FSU" } }
          itemNGA: { cs_map: { itemNGA: "item NGA" } }
          itemCM: { cs_map: { itemCM: "item CM" } }
          itemBalakrishnan:
            { cs_map: { itemBalakrishnan: "item Balakrishnan" } }
          itemSPELL: { cs_map: { itemSPELL: "item SPELL" } }
          itemFlop: { cs_map: { itemFlop: "item Flop" } }
          # \par+罗马号: 1206.1808 —— 原文 "\pari) 在 \cite..." 即 "\par i)"
          pari: { cs_map: { pari: "par i" } }
          parii: { cs_map: { parii: "par ii" } }
          # {\it+op}: 2203.13109 —— 同文上行就有正确的 {\it op.cit.}
          itop: { cs_map: { itop: "it op" } }
          # \hline+Cd: 1003.4522 deluxetable 行 "Cd~\textsc{i}"
          hlineCd: { cs_map: { hlineCd: "hline Cd" } }
          # \linebreak+GF: math--0605301 bibitem "quotient ring GF(2)"
          linebreakGF: { cs_map: { linebreakGF: "linebreak GF" } }
          # 1511.02908 ×13: 自定义 \def\dd{\operatorname{d}} 被粘 (\ddr=d/dr 等);
          # \frac/\bf/\Delta/\nabla/\in 同型合并
          ddr: { cs_map: { ddr: "dd r" } }
          ddf: { cs_map: { ddf: "dd f" } }
          ddt: { cs_map: { ddt: "dd t" } }
          ddR: { cs_map: { ddR: "dd R" } }
          ddF: { cs_map: { ddF: "dd F" } }
          frack: { cs_map: { frack: "frac k" } }
          fracr: { cs_map: { fracr: "frac r" } }
          Deltau: { cs_map: { Deltau: "Delta u" } }
          nablau: { cs_map: { nablau: "nabla u" } }
          bfr: { cs_map: { bfr: "bf r" } }
          bfv: { cs_map: { bfv: "bf v" } }
          bfk: { cs_map: { bfk: "bf k" } }
          inV: { cs_map: { inV: "in V" } }
          # {\it/\rm+首词} 粘连 —— 2401.17274 (aa.cls 缺类后级联面) +
          # hep-ph/9910403: {\it Uhuru}/{\rm and} 同型
          itUhuru: { cs_map: { itUhuru: "it Uhuru" } }
          itEinstein: { cs_map: { itEinstein: "it Einstein" } }
          itChandra: { cs_map: { itChandra: "it Chandra" } }
          itXMM: { cs_map: { itXMM: "it XMM" } }
          rmROSAT: { cs_map: { rmROSAT: "rm ROSAT" } }
          rmSRG: { cs_map: { rmSRG: "rm SRG" } }
          rmand: { cs_map: { rmand: "rm and" } }
          # natbib 引用宏 —— 类内 natbib 缺席 (shim 顶替后) 或作者漏装包;
          # 2026-09-19 failmine 残面全家族同修 (citet: 0905.0154/1109.2284/
          # 1206.5819/1404.0559/1404.2241/astro-ph/0605325+0605512,
          # citealt: 0707.4614/1003.0340/1206.0597/1206.5620)
          citep: { usepackage: natbib }
          citeyear: { usepackage: natbib }
          citet: { usepackage: natbib }
          citealt: { usepackage: natbib }
          citealp: { usepackage: natbib }
          citeauthor: { usepackage: natbib }
          citeyearpar: { usepackage: natbib }
          citetext: { usepackage: natbib }
          citenum: { usepackage: natbib }
          # natbib thebibliography 侧对偶 (failmine2 ~13 cells: 1109.6007/
          # 1306.0551/astro-ph/0501240): natbib.sty:1070 重定义 env 内
          # \renewcommand\newblock 要宿主先定义, 老类/shim 缺位面炸内核签
          # "Command \newblock undefined" (taxonomy 归 undefined_cs:newblock)。
          # canonical hskip 形 (natbib/elsart/quantumarticle/ptptex 同值);
          # providecommand 先于 renewcommand 落位 → renew 合法接管。
          newblock:
            {
              polyfill: "\n\\providecommand{\\newblock}{\\hskip .11em plus .33em minus .07em}",
            }
          # 2501.14787 (repro-2501-2026-09-16): \DeclareUnicodeCharacter 是
          # inputenc 私有 cs, XeTeX 内核恒未定义 (en/zh 两臂同炸) → lccode
          # 惯用法 polyfill。normalize.XETEX_COMPATIBILITY 同源 shim
          # (c582736 已源头落); 本条目兜底绕开 normalize 的编译路径。
          DeclareUnicodeCharacter:
            {
              polyfill: "\n\\providecommand{\\DeclareUnicodeCharacter}[2]{\\begingroup\\lccode`\\~=\"#1\\relax\\lowercase{\\endgroup\\catcode`~\\active\\protected\\def~}{#2}}",
            }
          # ── 2026-09-17 partial-taxonomy §C 期刊/类宏缺位族 ──
          # 全表 polyfill 带 \n 前缀 —— _inject_after_docclass 在 docclass
          # 行尾缝注入, 行尾 % 注释会整吞无前缀 snippet (1404.0346 %!PN
          # 实证, applied=True 死注入); \n 逃出注释落下一行。
          # elsarticle \corauth[label]{注} → 批八升级: 桥 elsarticle
          # \cortext (与 elsart.cls shim body 同式); 无 cortext 时静默
          corauth:
            {
              polyfill: "\n\\providecommand{\\corauth}[2][]{\\ifdefined\\cortext\\cortext[#1]{#2}\\fi}",
            }
          # svjour/amsthm \smartqed 重定义 \qed → noop (qed 保持包默认)
          smartqed: { polyfill: "\n\\providecommand{\\smartqed}{}" }
          # amsthm \QED 收尾标记 —— 缺 proof/amsthm 面常用 (0707.1588
          # IEEEtran undefined_cs:QED 实证); 纯原语开口盒 (amsthm
          # \qedsymbol 形) 不依赖 amssymb \square; proof env 已定义的
          # 独立 QED 缺位由本键兜 (env polyfill 对偶件只管 conjunctive)
          QED:
            {
              polyfill: "\n\\providecommand{\\QED}{\\leavevmode\\hbox to.77778em{\\hfil\\vrule\\vbox to.675em{\\hrule width.6em\\vfil\\hrule}\\vrule}}",
            }
          # 期刊投稿注 \submitto{journal} → noop
          submitto: { polyfill: "\n\\providecommand{\\submitto}[1]{}" }
          # ── fmsingles failmine4 残面 (2026-09-19, 机制确证单发) ──
          # renew-on-undefined 族 (taxonomy "Command \X undefined" 内核签):
          # 2609.20238 main.tex:191 \renewcommand*\backref[1]{…} —— hyperref
          #   未开 backref 选项 → \backref 恒缺; provide 预置 → renew 接管
          # math/0408290 macros.tex:227 \renewcommand{\U}{{\Upsilon}} ——
          #   amsart+xelatex 下 \U 缺位 (稿内 $\U$ 高频); 同形预置
          # 2026-09-19 renewguard: guard 键替手写 \providecommand 字面形
          # (csname 包裹 emission, @-名/裸名通吃 —— 裸 \providecommand\foo@bar
          # @=other 断名静默错义, \providecommand\csname 静默 no-op 双死)。
          backref: { guard: "[1]" }
          U: { guard: "[1]" }
          # 1306.0124 arxiv-DCDSA-May2013.tex:58 \renewcommand{\C}{{\mathbb C}}
          # —— \C 恒缺 (稿载 amssymb, renew 后 \mathbb 就位); 同族预置
          C: { guard: true }
          # 0806.3016: babel-russian v1.3m (2021) ldf 已不定义 \No (№ 号);
          # \textnumero 内核文本符号零依赖
          No: { polyfill: "\n\\providecommand{\\No}{\\textnumero}" }
          # 1003.4727: OSA 版式宏 \ocis 被稿挪进 article 类 (osajnl 类
          # shim 按类名够不到); 与 90-shim-legacy osajnl_body 同式
          ocis:
            {
              polyfill: "\n\\providecommand{\\ocis}[1]{\\par\\noindent\\textbf{OCIS codes:} #1\\par}",
            }
          # 0806.4149: 随稿 emulateapj.cls 缺 \newbox\footbox 分配 (upstream
          # 完整件有; \balance@two 双栏平衡钩 shipout 期调用) → 分配补位
          footbox: { polyfill: "\n\\newbox\\footbox" }
          # 0905.1299: ucs 在 unicode 引擎不定义 \PrerenderUnicode
          # (pdftex-era 预渲件) —— 静默吞参即 unicode 下正确语义
          PrerenderUnicode: { polyfill: "\n\\providecommand{\\PrerenderUnicode}[1]{}" }
          # \keywords{...} 渲染保留而非丢文 (article 系无此 cs)
          keywords:
            {
              polyfill: "\n\\providecommand{\\keywords}[1]{\\medskip\\par\\noindent\\textbf{Keywords:} #1\\medskip}",
            }
          # IEEEtran \PARstart{首}{余} 首字下沉 → 平排保字母
          PARstart: { polyfill: "\n\\providecommand{\\PARstart}[2]{#1#2}" }
          # elsarticle/acmart \email → tt 渲染 (防 em 头把 email 误拆 \em ail)
          email: { polyfill: "\n\\providecommand{\\email}[1]{\\texttt{#1}}" }
          # REPLACE (fixer-polyfill-journal 2026-09-17): 原裸 \maketitle 兜底
          # 在类已定义时 no-op 不治病根 —— ~25 格 maketitle payload 全是
          # l.N 行末抢签, 真炸点 \email/\authorblockN/A 藏 \@author 展开体。
          # 全家桶幂等注入; \n 前缀逃 docclass 行尾 % 注释吞注入
          # (1404.0346 %!PN 实证; _inject_after_docclass eol 缝点缺陷,
          # builtin 根治归 1d)。实证: 0905.0440/1003.0851 clean, 1404.0346 愈。
          # REPAIR (shimfix-b 2026-09-19): 旧形 \\[1ex]{\small #1} 把稿面
          # \authorblockA{#1} 自带 \\ 囚进对齐格内花括组 → Missing}
          # current-column 级联 (0905.1990/1404.0346, shimdiag cluster-B)。
          # 真件 IEEEtran V1.8a 自带 \IEEEauthorblockN/A (类源 :6310-6311
          # 注释掉的 legacy 别名即此桥) —— 在场则 \let 直通真件机制
          # (strut/interlinespace 全保真); 缺席 fallback 内层 tabular 兜住
          # #1 内 \\ (内层行分组不触外层对齐, \small 随 ambient 覆全部行)。
          maketitle:
            {
              polyfill: "\n\\providecommand{\\maketitle}{}\n\\providecommand{\\email}[1]{\\texttt{#1}}\n\\ifdefined\\IEEEauthorblockN\\let\\authorblockN\\IEEEauthorblockN\\else\\providecommand{\\authorblockN}[1]{#1}\\fi\n\\ifdefined\\IEEEauthorblockA\\let\\authorblockA\\IEEEauthorblockA\\else\\providecommand{\\authorblockA}[1]{\\\\[1ex]{\\small\\begin{tabular}[t]{@{}c@{}}#1\\end{tabular}}}\\fi\n\\providecommand{\\authorrunning}[1]{}\n\\providecommand{\\titlerunning}[1]{}\n\\providecommand{\\inst}[1]{\\textsuperscript{#1}}\n\\providecommand{\\institute}[1]{}",
            }
          # 同块挂直接 payload 键 (\authorblockN 裸调顶层时 payload 直达)
          authorblockN:
            {
              polyfill: "\n\\providecommand{\\email}[1]{\\texttt{#1}}\n\\ifdefined\\IEEEauthorblockN\\let\\authorblockN\\IEEEauthorblockN\\else\\providecommand{\\authorblockN}[1]{#1}\\fi\n\\ifdefined\\IEEEauthorblockA\\let\\authorblockA\\IEEEauthorblockA\\else\\providecommand{\\authorblockA}[1]{\\\\[1ex]{\\small\\begin{tabular}[t]{@{}c@{}}#1\\end{tabular}}}\\fi",
            }
          authorblockA:
            {
              polyfill: "\n\\providecommand{\\email}[1]{\\texttt{#1}}\n\\ifdefined\\IEEEauthorblockN\\let\\authorblockN\\IEEEauthorblockN\\else\\providecommand{\\authorblockN}[1]{#1}\\fi\n\\ifdefined\\IEEEauthorblockA\\let\\authorblockA\\IEEEauthorblockA\\else\\providecommand{\\authorblockA}[1]{\\\\[1ex]{\\small\\begin{tabular}[t]{@{}c@{}}#1\\end{tabular}}}\\fi",
            }
          # 元数据宏裸调直达键 (aaspp4/svjour 系 preamble 散调)
          authorrunning:
            { polyfill: "\n\\providecommand{\\authorrunning}[1]{}" }
          titlerunning: { polyfill: "\n\\providecommand{\\titlerunning}[1]{}" }
          institute: { polyfill: "\n\\providecommand{\\institute}[1]{}" }
          inst:
            { polyfill: "\n\\providecommand{\\inst}[1]{\\textsuperscript{#1}}" }
          affil: { polyfill: "\n\\providecommand{\\affil}[1]{#1}" } # aaspp4
          # \csname bibitemStop\endcsname 融合残留 —— NoStop 条目对偶
          # (10-11 格)。拆回 → \bibitemStop 在场则调, 未定义也安全 (\relax)
          csnamebibitemStop:
            { cs_map: { csnamebibitemStop: "csname bibitemStop" } }
          # recmath 系 wide-abstract \wideabs{...} —— cond-mat/0104373
          # /9901011/9910489, nucl-th/0104002 (~5 格)。quote 块保全文面
          wideabs:
            {
              polyfill: "\n\\providecommand{\\wideabs}[1]{\\begin{quote}\\small\\noindent #1\\end{quote}}",
            }
          # imsart/EJS 局部定义区定界 (1012.2012/1206.1960/1811.10292)。
          # ★ \endlocaldefs 不可 \providecommand —— \@ifdefinable 拒 \end
          #   前缀名 (1206.1960 already_def 级联实证) → \ifdefined..\else
          #   \def..\fi 守卫式; 两键对称先到先注。
          startlocaldefs:
            {
              polyfill: "\n\\providecommand{\\startlocaldefs}{}\n\\ifdefined\\endlocaldefs\\else\\def\\endlocaldefs{}\\fi",
            }
          endlocaldefs:
            {
              polyfill: "\n\\providecommand{\\startlocaldefs}{}\n\\ifdefined\\endlocaldefs\\else\\def\\endlocaldefs{}\\fi",
            }
          # imsart/EJS keyword 收集宏 —— 与 localdefs 同格 (1012.2012/
          # 1206.1960/1811.10292): shim 未触面裸调直达; noop 吞参保编译
          # (shim 收集体用 \g@addto@macro, docclass 缝注入 @ 非 letter
          # 不可用 → 取 noop 形; 真身收集进 keyword env, 丢渲染不丢结构)
          kwd: { polyfill: "\n\\providecommand{\\kwd}[1]{}" }
          # 老 AMS/期刊 running-head 对 (1012.1584, astro-ph/9901236/9901311)
          lefthead:
            { polyfill: "\n\\providecommand{\\lefthead}[1]{\\markboth{#1}{}}" }
          righthead:
            { polyfill: "\n\\providecommand{\\righthead}[1]{\\markboth{}{#1}}" }
          # epstopdf 包宏 (2104.00126) —— 稿已 \usepackage{epstopdf} 但
          # v2.11 在 xelatex "Drivers other than pdftex/luatex not
          # supported" 装载即中止, 用户宏面零定义 → 装包臂保留 (无包稿面
          # 仍装) + 全签名 gobble 补位。实参四参形:
          # \epstopdfDeclareGraphicsRule{.tif}{png}{.png}{convert #1 \OutputFile}
          # + \AppendGraphicsExtensions{.tif} 姊妹宏同站 (xelatex 读不了
          # .tif, 剥扩展名即避 unknown-extension 次生错)
          epstopdfDeclareGraphicsRule:
            {
              usepackage: epstopdf,
              polyfill: "\n\\providecommand{\\epstopdfDeclareGraphicsRule}[4]{}\n\\providecommand{\\AppendGraphicsExtensions}[1]{}\n\\providecommand{\\PrependGraphicsExtensions}[1]{}",
            }
          # 2.09 \eqnobysec (equation 按节重置) —— \@addtoreset 走
          # \csname 形零字面 @: 定义时刻/调用处 catcode 皆无关
          eqnobysec:
            {
              polyfill: "\n\\providecommand{\\eqnobysec}{\\csname @addtoreset\\endcsname{equation}{section}\\renewcommand{\\theequation}{\\thesection.\\arabic{equation}}}",
            }
          # \hboxto 作者笔误 (0707.4206 等 ~15 格): \hboxto5cm → \hbox to5cm
          hboxto: { cs_map: { hboxto: "hbox to" } }
          # \csname bibitemNoStop\endcsname 融合残留 (revtex \BibitemShut
          # 展开件, 45 格) —— 补回空格即复原 \csname..\endcsname 完整形,
          # \endcsname 本就在场, 展开的 \bibitemNoStop 未定义自动 \relax
          csnamebibitemNoStop:
            { cs_map: { csnamebibitemNoStop: "csname bibitemNoStop" } }
          # 1306.0281: acm_proc_article-sp→acmart shim 后老稿 \numberofauthors{N}
          # 未定义 (acmart 自动计数, 老类手动设) —— 元数据提示宏, no-op 无损
          numberofauthors:
            { polyfill: "\n\\providecommand{\\numberofauthors}[1]{}" }
          # pkg_obsolete 面 (批七, wave-final ×6): TL amstex.sty 本身即
          # 废弃 stub 自报 "Package `amstex' is obsolete" → 剥装载点 +
          # amsmath 补位 (amstex 功能是 amsmath 子集)。_drop_pkg_loads
          # 覆盖 list/solo 两形。
          amstex: { strip_pkg: "amstex", usepackage: "amsmath" }
          # ── 批七 shim-surface 面 (1d 移交, 0707.0128 实证): iopams/
          # setstack TL-missing, shim stub 落 wdir 但无公共 cs 面 →
          # \Tref/\Fref/\Eref/\Sref/\br/\mr/\ns/\bb/\bc 连串 undefined_cs。
          # iopart.cls 公共宏族抄值 —— 引用宏带参需 freeform polyfill
          # (journal_cs_polyfill 表只产无参形), 各键互挂同一幂等块:
          # \providecommand 重复注入无害; \n 前缀逃 docclass 行尾注释缝。
          Tref:
            {
              polyfill: "\n\\providecommand{\\Tref}[1]{Table~\\ref{#1}}\n\\providecommand{\\Fref}[1]{Figure~\\ref{#1}}\n\\providecommand{\\Eref}[1]{Eq.~(\\ref{#1})}\n\\providecommand{\\Sref}[1]{Section~\\ref{#1}}\n\\providecommand{\\br}{\\hline}\n\\providecommand{\\mr}{\\hline}\n\\providecommand{\\ns}{\\\\}\n\\providecommand{\\bb}{}\n\\providecommand{\\bc}{}",
            }
          Fref:
            {
              polyfill: "\n\\providecommand{\\Tref}[1]{Table~\\ref{#1}}\n\\providecommand{\\Fref}[1]{Figure~\\ref{#1}}\n\\providecommand{\\Eref}[1]{Eq.~(\\ref{#1})}\n\\providecommand{\\Sref}[1]{Section~\\ref{#1}}\n\\providecommand{\\br}{\\hline}\n\\providecommand{\\mr}{\\hline}\n\\providecommand{\\ns}{\\\\}\n\\providecommand{\\bb}{}\n\\providecommand{\\bc}{}",
            }
          Eref:
            {
              polyfill: "\n\\providecommand{\\Tref}[1]{Table~\\ref{#1}}\n\\providecommand{\\Fref}[1]{Figure~\\ref{#1}}\n\\providecommand{\\Eref}[1]{Eq.~(\\ref{#1})}\n\\providecommand{\\Sref}[1]{Section~\\ref{#1}}\n\\providecommand{\\br}{\\hline}\n\\providecommand{\\mr}{\\hline}\n\\providecommand{\\ns}{\\\\}\n\\providecommand{\\bb}{}\n\\providecommand{\\bc}{}",
            }
          Sref:
            {
              polyfill: "\n\\providecommand{\\Tref}[1]{Table~\\ref{#1}}\n\\providecommand{\\Fref}[1]{Figure~\\ref{#1}}\n\\providecommand{\\Eref}[1]{Eq.~(\\ref{#1})}\n\\providecommand{\\Sref}[1]{Section~\\ref{#1}}\n\\providecommand{\\br}{\\hline}\n\\providecommand{\\mr}{\\hline}\n\\providecommand{\\ns}{\\\\}\n\\providecommand{\\bb}{}\n\\providecommand{\\bc}{}",
            }
          br:
            {
              polyfill: "\n\\providecommand{\\Tref}[1]{Table~\\ref{#1}}\n\\providecommand{\\Fref}[1]{Figure~\\ref{#1}}\n\\providecommand{\\Eref}[1]{Eq.~(\\ref{#1})}\n\\providecommand{\\Sref}[1]{Section~\\ref{#1}}\n\\providecommand{\\br}{\\hline}\n\\providecommand{\\mr}{\\hline}\n\\providecommand{\\ns}{\\\\}\n\\providecommand{\\bb}{}\n\\providecommand{\\bc}{}",
            }
          mr:
            {
              polyfill: "\n\\providecommand{\\Tref}[1]{Table~\\ref{#1}}\n\\providecommand{\\Fref}[1]{Figure~\\ref{#1}}\n\\providecommand{\\Eref}[1]{Eq.~(\\ref{#1})}\n\\providecommand{\\Sref}[1]{Section~\\ref{#1}}\n\\providecommand{\\br}{\\hline}\n\\providecommand{\\mr}{\\hline}\n\\providecommand{\\ns}{\\\\}\n\\providecommand{\\bb}{}\n\\providecommand{\\bc}{}",
            }
          ns:
            {
