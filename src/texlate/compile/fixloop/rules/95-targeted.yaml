  # misc_singles (a): babel_opt|spanish —— babel_lang_ldf_install 的
  # ldf 映射面无 spanish.ldf (TL2025+ babel 不再单体 ldf 制), install
  # 臂恒 miss → 剥 babel 选项表里的 spanish 词位保编译 (语种回默认,
  # 断词/连字规则退化优于全灭)。payload_pattern 钉 spanish 防其他
  # babel_opt 格误中; 三臂覆盖 表内中尾位/表首位/独位 全形。
  - id: babel_opt_drop_uninstallable
    description: "babel_opt|spanish (ldf 无映射不可装) → \\usepackage[..spanish..]{babel} 选项词位剥除"
    phase: loop
    order: 199.91
    when: { category: babel_opt, payload_required: true }
    condition:
      payload_pattern: "^spanish$"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          # 中/尾位 ',spanish' 连前逗号剥
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*\\[[^\\]\\n]*?),\\s*spanish\\b",
              repl: "\\g<1>",
              match_surface: masked,
            }
          # 表首位 'spanish,' 剥名留 [ 与后续项
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*\\[)\\s*spanish\\s*,\\s*",
              repl: "\\g<1>",
              match_surface: masked,
            }
          # 独位 [spanish] → 整选项块剥
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*)\\[\\s*spanish\\s*\\](\\s*\\{babel\\})",
              repl: "\\g<1>\\g<2>",
              match_surface: masked,
            }
    risk: medium # 语种选项剥除 → babel 回默认断词/连字规则; 不剥则 babel_opt 恒炸全灭, 退化优于死
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "vault QC replay misc_singles (qc-impl-2026-09-28)",
          error: "Package babel Error: Unknown option `spanish' —— ldf 不在 install 映射面, 恒炸",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json item50(a) babel_opt_drop_uninstallable"
    known_gap: "\\documentclass[..spanish..] 全局选项形态不收 (该行无法判 babel 装载面, 剥除易误伤他包选项); babel_undef (语言本体未声明) 签异不归本臂"

  # item24(a) spec builtin imsart_printead_shim 未注册 —— regex 等价:
  # imsart 系类 \\printead 走 \\@@printead[#1]#2{\\ead@size #2} 内部
  # 签名, hyperref/saferef 级联下定义位丢失 → 'Illegal parameter
  # number'/\\ead 级联 0 页。导言 \\providecommand 补位 (类内真定义
  # 在场则 noop 不覆盖); \\makeatletter 段包裹保 @ 字面 catcode
  # (注入位 preamble @=12 域)。与 imsart_nohyperref(195) 姊妹臂
  # 互补: 彼关 hyperref 拉载, 此补定义缺位。
  - id: imsart_printead_restore
    description: "imsart 系 \\printead/\\ead 撞 → 导言补 \\@@printead 签名定义 (providecommand 守卫形)"
    phase: loop
    order: 199.92
    when: { category: syntax }
    condition:
      ctx_suggests: "Illegal parameter number|ead@|printead"
      source_contains: "\\\\@?@?printead"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "(?<!\\\\def\\\\txlateprintead\\{\\}\n)(\\\\begin\\s*\\{document\\})",
              repl: "\\makeatletter\\providecommand\\@@printead[#1]#2{\\ead@size #2}\\makeatother\n\\def\\txlateprintead{}\n\\g<1>",
              match_surface: masked,
            }
    risk: low # \\providecommand 不覆盖类内真定义; cs 签名钉死 spec 形
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1107.0158 (vault QC replay layout:no_pdf, qc-impl-2026-09-28)",
          error: "\\printead:417/423 'Illegal parameter number' → \\ead/aug 机制级联 → 0 pages",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json item24(a) imsart_printead_shim"
    known_gap: "\\ead@size 亦缺席时守卫内调用仍 ucs (交下游 cs 面续修); myectaart_frontmatter (item24c) 需 docfix builtin 剥 2.09 字体命令, 不归本臂"
