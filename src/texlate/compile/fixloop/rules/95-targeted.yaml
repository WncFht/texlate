              polyfill: "\n\\AddToHook{begindocument/before}{\\expandafter\\ifx\\csname default@color\\endcsname\\relax\\expandafter\\gdef\\csname default@color\\endcsname{gray 0}\\fi\\expandafter\\ifx\\csname current@color\\endcsname\\relax\\expandafter\\gdef\\csname current@color\\endcsname{gray 0}\\fi}",
            }
          # tkz-obj 废弃装载器 \usetkzobj{all} (modern tkz-euclide 移除)
          # → noop 吞参
          usetkzobj: { polyfill: "\n\\providecommand{\\usetkzobj}[1]{}" }
          # ieeeaccess-era \AddSpotColor{space}{name}{disp}{"c m y k"}
          # 4 参签名 —— spotcolor.sty 在 TL 缺席时 payload 直达;
          # 真 cmyk 仿真走 85-shim spotcolor_xetex_shadow (vendor 件)
          AddSpotColor: { polyfill: "\n\\providecommand{\\AddSpotColor}[4]{}" }
          # 1003.0045 (qc-impl 2026-09-28): revtex bibitem 渲染链残留
          # \bibinfo{field}{content} —— 类面缺席时 ucs; 打 #2 保字段
          # 内容 (年份/页码不丢), 比 noop 全吞多保书目信息
          bibinfo: { polyfill: "\n\\providecommand{\\bibinfo}[2]{#2}" }
          # \Ref → \ref (already_def/undefined 双面; provide 已定义时
          # no-op 兜 renew 接管)
          Ref: { polyfill: "\n\\providecommand{\\Ref}[1]{\\ref{#1}}" }
          # pst-calculate vendor 真件在档 → 装载优先 + provide 兜底;
          # ifpst@useCalc 是 \newif 布尔 (非宏) —— \let\iffalse 语义
          # 保真 (calc 特性关), csname 形免 @ catcode 断名
          pscalculate:
            {
              usepackage: pst-calculate,
              polyfill: "\n\\providecommand{\\pscalculate}[1]{}",
            }
          ifpst@useCalc:
            {
              polyfill: "\n\\expandafter\\let\\csname ifpst@useCalc\\endcsname\\iffalse",
            }
        # 表外 fallback (2026-09-16): glue 残骸前缀拆分 —— payload 未命中
        # cs_table 时, 若 cs = 已知粘连头 + 残余 (大写起首或 ≤4 字符) 则合成
        # cs_map 拆回 "head rest" (replay 实证 rmPT 型新残骸仍零星冒头,
        # 逐条收表追不上)。split_guard 挡与头同前缀的真宏名 (part/parbox/
        # ddot/fraction…); 含 @ 的包内私有 cs 不拆 (版本偏斜非粘连)。
        # in 头不收: int/indent/input/index/infty 前缀面太热, inV 留显式条目。
        # 2026-09-17 +字体开关头族 (1e partial-taxonomy §C ≥100 格):
        # \emPhys \itJHK \scpin \bfB \rmeff \emcf 全是 reconstruct 丢 \em/\it
        # 保护块尾随空格的熔合残骸 → head+大写残余自动拆回。em/sc/sf/sl/tt/cal
        # 补位; emph/texttt/sfcode/sloppy/slash 等同前缀真宏进 guard。
        split_heads:
          [
            linebreak,
            item,
            hline,
            nabla,
            Delta,
            frac,
            par,
            dd,
            bf,
            it,
            rm,
            em,
            sc,
            sf,
            sl,
            tt,
            cal,
          ]
        split_guard:
          [
            part,
            para,
            parbox,
            parskip,
            itemize,
            itemsep,
            ddot,
            ddots,
            fraction,
            emph,
            texttt,
            sfcode,
            sloppy,
            slash,
          ]
    risk: medium # 剥包/换宏族改版式; 表只收语料实证条目
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
