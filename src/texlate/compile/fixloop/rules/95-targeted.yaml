  # 2026-09-18 C3 (stats 驱动, loop1 dedup 面): undefined_cs 残留签名
  # 第二表 —— 复用 cs_targeted_fix builtin, params.cs_table 叠加在
  # _builtins_csfix._CS_FIX_TABLE 之上 (builtin 内 dict.update 合并);
  # 主表(165)已收条目主表先中, 本表只收新增 payload, id/order 不撞。
  - id: cs_targeted_fix_c3
    description: "undefined_cs 新批: variorefoptionifavailable (AIP 模板自造cs) / firstfigfalse+firsttabfalse (\\newif 对未建)"
    phase: loop
    order: 166 # cs_targeted_fix(165) 后, undefined_cs_guess(900) 前
    when: { category: undefined_cs, payload_required: true }
    action:
      kind: builtin_transform
      function: cs_targeted_fix
      params:
        cs_table:
          # 1206.0565 aipguide.tex:56 裸调用 —— AIP 官方 guide 模板自造
          # 标记 cs ("either varioref or" 注释自述), 无包提供; noop 即可。
          variorefoptionifavailable:
            { polyfill: "\n\\providecommand\\variorefoptionifavailable{}" }
          # hep-ph/0104121 fixes.sty:41-42 \global\firstfigfalse +
          # \global\firsttabfalse 双闸连发 —— 宿主类未建 \newif 对
          # (preprintsty 死区分支), 一注补齐两对。
          firstfigfalse:
            { polyfill: "\n\\newif\\iffirstfig\\newif\\iffirsttab" }
