  - id: atdef_cat_wrap
    mechanisms: [W125]
    description: "@-token def 站 (\\newtheorem/\\newenvironment/\\def 族) → exact-restore @=11 包裹 (无签名门版, spacefactor_atdef_wrap 姊妹臂)"
