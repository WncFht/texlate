  # spacefactor_atdef_wrap(198.5) 的无签名门版: @-token def 站
  # (\newtheorem{@#1}{#2}[section] / \newenvironment{clm}{..\edef
  # \@currentlabel..} / \def\the@clm 族) 在 doc scope @=12 下 tokenize →
  # "Use of \@ doesn't match" mismatch 洪泛 + Missing-number (146 错,
  # syntax/other/illegal_unit/undefined_cs 散格)。builtin 同款
