  # kernel 参机制 → amsthm proof 定义 runaway → Missing \\begin{document}
  # → p1 排 '1.'。源级改 \\usepackage 行 amstex→amsmath (cs_table
  # strip_pkg+usepackage 同语义, 无签名面走 regex 直达)。
  - id: amstex_conflict_strip
    description: "\\usepackage{amstex} (TL 兼容尸位毁 kernel 参机制) → 改写 amsmath 装载"
