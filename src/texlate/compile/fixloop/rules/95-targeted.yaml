          # cs_map/gobble 无一能吞 —— 装真包是唯一正解 (tikz.sty 供 \node/\draw/
          # \path/\coordinate/\fill/\filldraw/\matrix/\tikzset/tikzpicture;
          # arrows+positioning+shapes 三库兜 `>=latex'`/`above right=of`/`mynode`
          # 系常见库键)。polyfill 自带 \usepackage{tikz} 前缀: 注缝 LIFO 语义下
          # 裸 \usetikzlibrary 会落在 arm 的 usepackage 行**之前** → 新
          # undefined_cs (bad-order 实证); 自足块对死臂/注释载/稿后载全免疫,
          # preamble 库键 \tikzset 调用面亦安全。dup `\usepackage{tikz}` 行
          # (arm 注入 + polyfill 内联) 是 benign no-op —— LaTeX 重载同包零选项
          # 静默跳过; arm 的 install_file/probe + refire done 非空语义照留。
          node:
            {
              usepackage: tikz,
              polyfill: "\n\\usepackage{tikz}\n\\usetikzlibrary{arrows,positioning,shapes}",
            }
          draw:
            {
              usepackage: tikz,
              polyfill: "\n\\usepackage{tikz}\n\\usetikzlibrary{arrows,positioning,shapes}",
            }
          path:
            {
              usepackage: tikz,
              polyfill: "\n\\usepackage{tikz}\n\\usetikzlibrary{arrows,positioning,shapes}",
            }
          coordinate:
            {
              usepackage: tikz,
              polyfill: "\n\\usepackage{tikz}\n\\usetikzlibrary{arrows,positioning,shapes}",
            }
          fill:
            {
              usepackage: tikz,
              polyfill: "\n\\usepackage{tikz}\n\\usetikzlibrary{arrows,positioning,shapes}",
            }
          filldraw:
            {
              usepackage: tikz,
              polyfill: "\n\\usepackage{tikz}\n\\usetikzlibrary{arrows,positioning,shapes}",
            }
          matrix:
            {
              usepackage: tikz,
              polyfill: "\n\\usepackage{tikz}\n\\usetikzlibrary{arrows,positioning,shapes}",
            }
        # 表外 fallback (2026-09-16): glue 残骸前缀拆分 —— payload 未命中
        # cs_table 时, 若 cs = 已知粘连头 + 残余 (大写起首或 ≤4 字符) 则合成
        # cs_map 拆回 "head rest" (replay 实证 rmPT 型新残骸仍零星冒头,
        # 逐条收表追不上)。split_guard 挡与头同前缀的真宏名 (part/parbox/
        # ddot/fraction…); 含 @ 的包内私有 cs 不拆 (版本偏斜非粘连)。
        # in 头不收: int/indent/input/index/infty 前缀面太热, inV 留显式条目。
        # 2026-09-17 +字体开关头族 (1e partial-taxonomy §C ≥100 格):
        # \emPhys \itJHK \scpin \bfB \rmeff \emcf 全是 reconstruct 丢 \em/\it
        # 保护块尾随空格的熔合残骸 → head+大写残余自动拆回。em/sc/sf/sl/tt/cal
        # 补位; emph/texttt/sfcode/sloppy/slash 等同前缀真宏进 guard。
        split_heads:
          [
            linebreak,
            item,
            hline,
            nabla,
            Delta,
            frac,
            par,
            dd,
            bf,
            it,
            rm,
            em,
            sc,
            sf,
            sl,
            tt,
            cal,
          ]
        split_guard:
          [
            part,
            para,
            parbox,
            parskip,
            itemize,
            itemsep,
            ddot,
            ddots,
            fraction,
            emph,
            texttt,
            sfcode,
            sloppy,
            slash,
          ]
    risk: medium # 剥包/换宏族改版式; 表只收语料实证条目
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
