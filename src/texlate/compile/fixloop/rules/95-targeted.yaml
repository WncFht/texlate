  # feynmp 改写未采 (mpost 同样要外跑且 .mp/.mf 源面异)。
  - id: feynmf_mf_pass
    description: "missing_tfm + 稿用 feynmf → run_tool mf <stem>.mf 补产 TFM (两遍工缺跑修复)"
