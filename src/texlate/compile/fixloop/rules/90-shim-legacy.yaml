              \providecommand{\bSigma}{\boldsymbol{\Sigma}}
              \providecommand{\bUpsilon}{\boldsymbol{\Upsilon}}
              \providecommand{\bPhi}{\boldsymbol{\Phi}}
              \providecommand{\bPsi}{\boldsymbol{\Psi}}
              \providecommand{\bOmega}{\boldsymbol{\Omega}}
              \providecommand{\bnabla}{\boldsymbol{\nabla}}
              \providecommand{\bpartial}{\boldsymbol{\partial}}
              % 批八补齐真身残面 (iopams.sty v1996 抄值): var 变形 + 杂项 +
              % amssymb 升级版装饰符号 (\renew 语义=要赢过 iopart cls 简形,
              % \def 直覆避免 \@ifdefinable 检查)
