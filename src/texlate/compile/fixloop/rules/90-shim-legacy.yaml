          # IOP 系 (iopart.cls 作者工具包, 1996 版起不在 TL): 实证 wdir 常自带
          # iopart.cls 只缺 \@ptsize 尺寸 .clo (1306.5813) —— article 同构,
          # 借内核 sizeNN.clo; 裸缺 iopart.cls 的稿走 cls 级 article shim。
          iopart.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{iopart}[2026/09/16 fixloop legacy shim -> article + IOP polyfills]
              \LoadClassWithOptions{article}
              % ── 批八扩列: 真身 iopart.cls (1996 作者工具包, 语料 1907.00138
              % 随包本) 公共面抄值 —— shim 落 wdir 后 \fl(15格)/\eqnobysec(13)/
              % \ams(8)/\PRL(4)/\iopamstrue(4) 等仍 undefined_cs。寄存器/开关
              % 先立, 宏面按 providecommand 幂等补。
              \newdimen\mathindent
              \mathindent=6pc
              \newif\ifiopams
              \newif\ifnumbysec
              \newif\ifletter
              \providecommand{\pacs}[1]{\par\noindent\textbf{PACS:} #1\par}
              \providecommand{\pacscodes}[1]{}
              \providecommand{\pacno}[1]{\vspace{10pt}\noindent{\bf PACS number:} #1\par}
              \providecommand{\submitted}[1]{}
              \providecommand{\submitto}[1]{\vspace{10pt}\noindent{\it Submitted to: #1}\par}
              \providecommand{\ams}[1]{\vspace{10pt}\noindent{\bf AMS classification:} #1\par}
              \providecommand{\comment}[1]{}
              \providecommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              % iopart 稿在 document 体内用 \address{...}/\ead{...} 印通讯块
              \providecommand{\address}[1]{\par{\footnotesize #1\par}}
              \providecommand{\ead}[1]{\par{\footnotesize\texttt{#1}\par}}
              \providecommand{\eads}[1]{\par{\footnotesize E-mail: \texttt{#1}\par}}
              \providecommand{\mailto}[1]{\texttt{#1}}
              \@ifundefined{ack}{\newenvironment{ack}{\par\small\noindent\textbf{Acknowledgments.}\space}{\par}}{}
              \providecommand{\ackn}[1]{\par\medskip\noindent #1\par}
              % \eqnobysec = \numbysectrue + 按节重置 (真身 iopart.cls:812)
              \providecommand{\eqnobysec}{\numbysectrue\@addtoreset{equation}{section}\renewcommand{\theequation}{\thesection.\arabic{equation}}}
              \providecommand{\noappendix}{\setcounter{figure}{0}\setcounter{table}{0}\def\thetable{\arabic{table}}\def\thefigure{\arabic{figure}}}
              % 交叉引用小写/大写族 (真身同款)
              \providecommand{\eref}[1]{(\ref{#1})}
              \providecommand{\tref}[1]{table~\ref{#1}}
              \providecommand{\fref}[1]{figure~\ref{#1}}
              \providecommand{\sref}[1]{section~\ref{#1}}
              \providecommand{\Eref}[1]{Equation~(\ref{#1})}
              \providecommand{\Sref}[1]{Section~\ref{#1}}
              \providecommand{\Fref}[1]{Figure~\ref{#1}}
              \providecommand{\Tref}[1]{Table~\ref{#1}}
              % eqnarray 行首回拉 + 数学助记 (\fl 真身 \hspace*{-\mathindent})
              \providecommand{\fl}{\hspace*{-\mathindent}}
              \providecommand{\e}{\mathrm{e}}
              \providecommand{\rme}{\mathrm{e}}
              \providecommand{\rmi}{\mathrm{i}}
              \providecommand{\rmd}{\mathrm{d}}
              \providecommand{\Tr}{\mathop{\mathrm{Tr}}\nolimits}
              \providecommand{\tr}{\mathop{\mathrm{tr}}\nolimits}
              \providecommand{\Or}{\mathord{\mathrm{O}}}
              \providecommand{\lshad}{[\![}
              \providecommand{\rshad}{]\!]}
              \providecommand{\case}[2]{{\textstyle\frac{#1}{#2}}}
              \providecommand{\dsty}{\displaystyle}
              \providecommand{\tsty}{\textstyle}
              \providecommand{\ssty}{\scriptstyle}
              \providecommand{\sssty}{\scriptscriptstyle}
              \providecommand{\tdot}[1]{\stackrel{\dots}{#1}}
              \providecommand{\tqs}{\hspace*{25pt}}
              \providecommand{\lo}[1]{\llap{${}#1{}$}}
              \providecommand{\eql}{\llap{${}={}$}}
              \providecommand{\lsim}{\llap{${}\sim{}$}}
              \providecommand{\lsimeq}{\llap{${}\simeq{}$}}
              \providecommand{\lequiv}{\llap{${}\equiv{}$}}
              \def\pt(#1){({\it #1\/})}
              % 表格 \noalign 间距件 + 对齐助记 (真身 \ms/\bs/\ns/\es 原值)
              \providecommand{\ms}{\noalign{\vspace{3\p@ plus2\p@ minus1\p@}}}
              \providecommand{\bs}{\noalign{\vspace{6\p@ plus2\p@ minus2\p@}}}
              \providecommand{\ns}{\noalign{\vspace{-3\p@ plus-1\p@ minus-1\p@}}}
              \providecommand{\es}{\noalign{\vspace{6\p@ plus2\p@ minus2\p@}}\displaystyle}
              \providecommand{\br}{\ms\hline\ms}
              \providecommand{\mr}{\ms\hline\ms}
              \providecommand{\centre}[2]{\multispan{#1}{\hfill #2\hfill}}
              \providecommand{\crule}[1]{\multispan{#1}{\hspace*{\tabcolsep}\hrulefill\hspace*{\tabcolsep}}}
              \providecommand{\lineup}{\def\0{\hbox{\phantom{\footnotesize\rm 0}}}\def\m{\hbox{$\phantom{-}$}}\def\-{\llap{$-$}}}
              \providecommand{\etal}{{\it et al\/}\ }
              \providecommand{\dash}{------}
              \providecommand{\nonum}{\par\item[]}
              \providecommand{\mat}[1]{\underline{\underline{#1}}}
              % verifier-batch8 残面回添: fulltable 横通栏表环境 (真身
              % rotating 横排) —— 降级为普通 table 容器保内容
              \ifdefined\fulltable\else\newenvironment{fulltable}{\begin{table}\small}{\end{table}}\fi
              % 装饰框/线族 (真身同款; iopams.sty 装载后升 amssymb 版见彼身)
              \providecommand{\opencircle}{\mbox{\Large$\circ\,$}}
              \providecommand{\opensquare}{\mbox{$\rlap{$\sqcap$}\sqcup$}}
              \providecommand{\opentriangle}{\mbox{$\triangle$}}
              \providecommand{\opentriangledown}{\mbox{$\bigtriangledown$}}
              \providecommand{\opendiamond}{\mbox{$\diamondsuit$}}
              \providecommand{\fullcircle}{\mbox{{\Large$\bullet\,$}}}
              \providecommand{\fullsquare}{\,\vrule height5pt depth0pt width5pt}
              \providecommand{\dotted}{\protect\mbox{${\mathinner{\cdotp\cdotp\cdotp\cdotp\cdotp\cdotp}}$}}
              \providecommand{\dashed}{\protect\mbox{-\; -\; -\; -}}
              \providecommand{\broken}{\protect\mbox{-- -- --}}
              \providecommand{\longbroken}{\protect\mbox{--- --- ---}}
              \providecommand{\chain}{\protect\mbox{--- $\cdot$ ---}}
              \providecommand{\dashddot}{\protect\mbox{--- $\cdot$ $\cdot$ ---}}
              \providecommand{\full}{\protect\mbox{------}}
              % 期刊缩写全表 (真身两族: IOP 自家 + 物理通用, bbl/正文散调)
              \providecommand{\CQG}{{\it Class. Quantum Grav.} }
              \providecommand{\CTM}{{\it Combust. Theory Modelling\/} }
              \providecommand{\DSE}{{\it Distrib. Syst. Engng.\/} }
              \providecommand{\EJP}{{\it Eur. J. Phys.} }
              \providecommand{\JNE}{{\it J. Neural Eng.} }
              \providecommand{\PB}{{\it Phys. Biol.} }
              \providecommand{\SMS}{{\it Smart Mater. Struct.} }
              \providecommand{\HPP}{{\it High Perform. Polym.} }
              \providecommand{\IP}{{\it Inverse Problems\/} }
              \providecommand{\JHM}{{\it J. Hard Mater.} }
              \providecommand{\JO}{{\it J. Opt.} }
              \providecommand{\JOA}{{\it J. Opt. A: Pure Appl. Opt.} }
              \providecommand{\JOB}{{\it J. Opt. B: Quantum Semiclass. Opt.} }
              \providecommand{\JPA}{{\it J. Phys. A: Math. Gen.} }
              \providecommand{\JPB}{{\it J. Phys. B: At. Mol. Phys.} }
