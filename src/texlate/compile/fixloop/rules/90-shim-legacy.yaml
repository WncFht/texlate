              \endinput
          # revtex.sty: REVTeX3 伴船 sty (hep-th/0103239 稿自带真 REVTeX3
          # revtex.cls 薄壳 :94 \RequirePackage{revtex} 伴生缺口) ——
          # 原身即 class-in-sty 架构: \LoadClass 在 .sty 语境被
          # latex.ltx \@currext=\@pkgextension 检查硬拒 (! \LoadClass
          # in package file) → \@currext 存复位绕过 (已载类场景
          # \@ifl@aded clashchk 空参幂等; 薄壳先行 \input{latex209.def}
          # 起 compat 模式, article \DeclareOldFontCommand 被 compat
          # 内 noop 化不撞 \bf 族)。\address/\andaddress/\pacs 就地印
          # 会炸 preamble 调用 (Missing \begin{document}) → 累进 \rtx@front
          # \maketitle 钩 + AtEndDocument 扫残两序通吃。revtex3 残面同
          # vendor/shims/revtex.cls compat 臂表。
          revtex.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{revtex}[2026/09/20 fixloop legacy shim -> article + revtex3 surface]
              \DeclareOption*{}
              \ProcessOptions\relax
              \@ifundefined{@maketitle}{%
                \let\rtx@save@currext\@currext
                \let\@currext\@clsextension
                \LoadClass{article}%
                \let\@currext\rtx@save@currext}{}
              \def\rtx@front{}
              \providecommand{\address}[1]{\g@addto@macro\rtx@front{\par{\itshape#1\par}}}
              \providecommand{\andaddress}[1]{\g@addto@macro\rtx@front{\par{\itshape#1\par}}}
              \providecommand{\pacs}[1]{\g@addto@macro\rtx@front{\par\noindent\textbf{PACS:} #1\par}}
              \def\rtx@emitfront{\ifx\rtx@front\@empty\else
                \rtx@front\global\let\rtx@front\@empty\fi}
              \@ifundefined{maketitle}{}{%
                \let\rtx@maketitle\maketitle
                \renewcommand{\maketitle}{\rtx@maketitle\rtx@emitfront}}
              \AtEndDocument{\rtx@emitfront}
              \providecommand{\preprint}[1]{}
              \providecommand{\draft}{}
              \providecommand{\tighten}{}
              \providecommand{\tightenlines}{}
              \providecommand{\widetext}{}
              \providecommand{\narrowtext}{}
              \providecommand{\submit}[1]{}
              \endinput
    engines:
