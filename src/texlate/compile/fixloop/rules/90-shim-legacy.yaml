          # ── 2026-09-16 signature-mining F 扩列 ──
          # (mn2e.cls 槽已删: vendor/shims 同名替身 stub 在 —— vendored 先中,
          #  死配置; usegraphicx 选项剔除面见 vendor stub, 旧体见 git 考古)
          # (svjour.cls 槽已删: vendor/shims 同名替身 stub 在 —— vendored
          #  先中, 死配置; theorem/proof 基座/biblatex-bbl polyfill 面见
