              \@ifundefined{acknowledgements}{\newenvironment{acknowledgements}{\par\noindent{\bfseries\ackname.}\enspace\ignorespaces}{\par}}{}
              \endinput
          # EPL epl2.cls (Europhysics Letters, 期刊外发): 旧体 \abstract/
          # \pacs/\institute 即时排版 → 导言区调用 no_begindoc (0905.1214
          # 双格实证)。全真件 epl2.cls 结构 (corpus/1206.2258 随稿):
          # PRE 收集制 (\abstract/\pacs/\institute 存值, \maketitle 吐),
          # bbl-struct 宏族抄真件 L1312-1344 (\Name/\Review/\REVIEW/\Book/
          # \Publ/\Vol/\Year/\Page/\Pages/\Editor/\Section/\SAME +
          # \ifepl@book 条件 + bibitem 前置钩), acknowledgments 环境 +
          # \acknowledgments/\acknowledgements/\stars cs 形,
          # \shrinkacknowledgments/\enlargeacknowledgments 旋钮 noop。
          # \and 在 \Name 实参内 → \Name 组内局部重绑防 \crcr 坍塌。
          epl2.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{epl2}[2026/09/18 fixloop legacy shim -> article + epl polyfills]
              \LoadClassWithOptions{article}
              % qc-impl 2026-09-28: +graphicx belt (vendor shims 真件先中,
              % 本键兜底面; manifest deferred_to_rules_lane 项)
              \RequirePackage{graphicx}
              % ── frontmatter 存值 (PRE 调用, \maketitle 包装吐) ──
              \let\epl@abstract\@empty
              \let\epl@inst\@empty
              \def\epl@pacs{}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\gdef\epl@abstract{#1}}
              \providecommand{\institute}[1]{\gdef\epl@inst{#1}}
              \providecommand{\pacs}[2]{\g@addto@macro\epl@pacs{\par\noindent\textbf{PACS:} #1\quad #2\par}}
              \providecommand{\inst}[1]{\textsuperscript{#1}}
              \providecommand{\shorttitle}[1]{}
              \providecommand{\shortauthor}[1]{}
              \providecommand{\shortinstitute}[1]{}
              \providecommand{\email}[1]{\texttt{#1}}
              \let\epl@mk\maketitle
              \renewcommand{\maketitle}{\epl@mk
                \ifx\epl@inst\@empty\else\par\noindent{\small\epl@inst}\par\fi
                \ifx\epl@abstract\@empty\else\begin{quote}\textbf{Abstract.}---\enspace\epl@abstract\end{quote}\fi
                \epl@pacs}
              % ── acknowledgments 双形: \newenvironment 的 begin 段即
              % 排版体 —— 裸 \acknowledgments 调用与 \begin{...} 环境
              % 两形通吃 (0905.1214 cs 形 / 1003.0792 env 形实证)。
              % \stars 真件里是 \acknowledgments 别名。
              \newenvironment{acknowledgments}{\par\medskip\noindent\textbf{Acknowledgments.}\space}{\par}
              \newenvironment{acknowledgements}{\par\medskip\noindent\textbf{Acknowledgements.}\space}{\par}
              \providecommand{\stars}{\par\medskip\noindent\textbf{Acknowledgments.}\space}
              \providecommand{\shrinkacknowledgments}[1]{}
              \providecommand{\enlargeacknowledgments}[1]{}
              % ── bbl-struct 宏族 (真件抄值): \bibitem 前置复位 + \ifepl@book ──
              \newif\ifepl@book\epl@bookfalse
              \newif\ifepl@gotand\epl@gotandfalse
              \let\epl@org@bibitem\bibitem
              \def\bibitem{\epl@bookfalse\epl@org@bibitem}
              \providecommand{\Name}[1]{{\let\and\epl@and\scshape #1},}
              \providecommand{\Review}[1]{\epl@bookfalse{\itshape #1},}
              \providecommand{\REVIEW}[4]{\Review{#1} \Vol{#2} \Year{#3} \Page{#4}}
              \providecommand{\Book}[1]{\epl@booktrue{\itshape #1}}
              \providecommand{\Vol}[1]{\ifepl@book\else{\bfseries #1}\fi}
              \providecommand{\Year}[1]{\ifepl@book\else(#1)\fi}
              \providecommand{\Page}[1]{\ifepl@book\else p.~#1\fi}
              \providecommand{\Pages}[1]{\ifepl@book\else pp.~#1\fi}
              \providecommand{\Publ}[1]{\ifepl@book\unskip\ \fi{\normalfont(#1)}}
              \providecommand{\Editor}[1]{\epl@gotandfalse{\let\and\epl@and\normalfont #1}, ed.}
              \providecommand{\Section}[1]{#1}
              \providecommand{\SAME}[3]{}
              \def\epl@and{\unskip\ and\ }
              \let\And\and
              \endinput
          # EuroPhys.cls: epl2 前代 EPL 类 (EDP ~1999-2006 发行面, TL 无;
          # cond-mat/0103528 实证面) —— \rec{收}{修} 双参 noop、\pacs 单
          # 子串内嵌 \Pacs{号}{码}{文} 三元组、\institute 存值 \maketitle 吐。
          EuroPhys.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{EuroPhys}[2026/09/26 fixloop legacy shim -> article + EuroPhys polyfills]
              \LoadClassWithOptions{article}
              \let\eplx@inst\@empty
              \let\eplx@pacs\@empty
              \providecommand{\institute}[1]{\gdef\eplx@inst{#1}}
              \providecommand{\rec}[2]{}
              \providecommand{\pacs}[1]{\gdef\eplx@pacs{#1}}
              \providecommand{\Pacs}[3]{\par\noindent\textbf{PACS:} #1.#2\quad #3\par}
              \providecommand{\shorttitle}[1]{}
              \providecommand{\shortauthor}[1]{}
              \providecommand{\email}[1]{\texttt{#1}}
              \let\eplx@mk\maketitle
              \renewcommand{\maketitle}{\eplx@mk
                \ifx\eplx@inst\@empty\else\par\noindent{\small\eplx@inst}\par\fi
                \ifx\eplx@pacs\@empty\else{\small\eplx@pacs}\fi}
              \endinput
          # EuroMacr.tex: EDP EuroMacr 宏件 (EuroPhys 类伴生宏包, TL 无;
          # cond-mat/0103528 ``\input EuroMacr`` 裸装载实证, 裸 payload 归
          # 一到本键同 psfig.tex 先例) —— EPL bbl 结构宏族同 epl2.cls 抄值。
          EuroMacr.tex:
            body: |
              %% fixloop legacy stub: EuroMacr.tex (EDP EPL macro set, not in TL)
              \makeatletter
              \newif\ifeplm@book\eplm@bookfalse
              \newif\ifeplm@gotand\eplm@gotandfalse
              \@ifundefined{bibitem}{}{%
                \let\eplm@org@bibitem\bibitem
                \def\bibitem{\eplm@bookfalse\eplm@org@bibitem}}
              \providecommand{\Name}[1]{{\let\and\eplm@and\scshape #1},}
              \providecommand{\Review}[1]{\eplm@bookfalse{\itshape #1},}
              \providecommand{\REVIEW}[4]{\Review{#1} \Vol{#2} \Year{#3} \Page{#4}}
              \providecommand{\Book}[1]{\eplm@booktrue{\itshape #1}}
              \providecommand{\Vol}[1]{\ifeplm@book\else{\bfseries #1}\fi}
              \providecommand{\Year}[1]{\ifeplm@book\else(#1)\fi}
              \providecommand{\Page}[1]{\ifeplm@book\else p.~#1\fi}
              \providecommand{\Pages}[1]{\ifeplm@book\else pp.~#1\fi}
              \providecommand{\Publ}[1]{\ifeplm@book\unskip\ \fi{\normalfont(#1)}}
              \providecommand{\Editor}[1]{\eplm@gotandfalse{\let\and\eplm@and\normalfont #1}, ed.}
              \providecommand{\Section}[1]{#1}
              \providecommand{\SAME}[3]{}
              \def\eplm@and{\unskip\ and\ }
              \let\And\and
              \makeatother
              \endinput
          # (imsart.cls 槽已删: vendor/shims 同名替身 stub 在 —— vendored
          #  先中, 死配置; frontmatter 收集制/aug/keyword env 面见 vendor
          #  stub, 旧体见 git 考古)
          # ACM conm-p-l.cls (90s 会议 preprint 版式) → acmart 官方继任。
          # 1003.0067 实证: acmart→unicode-math 装载后 \Psi 类希腊字母变
          # \mitPsi chardef —— 稿内 \section{...$\pdo$...} 在 hyperref
          # \pdfstringdef (bookmark) 展开时 `` `\mitPsi `` 炸 "Improper
          # alphabetic constant" + intcalc 级联 → \pdfstringdefDisableCommands
          # 域内把 \pdo 降级成纯文本。
          conm-p-l.cls:
            needs: ["acmart.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{conm-p-l}[2026/09/18 fixloop legacy shim -> acmart]
              \LoadClassWithOptions{acmart}
              \AtBeginDocument{\@ifundefined{pdfstringdefDisableCommands}{}{%
                \pdfstringdefDisableCommands{\def\pdo{PsiDO}}}}
              \endinput
          # JHEP 作者样式、Elsevier espcrc1 —— TL 全数缺席, vendor stub 兜底。
          # (jinstpub/jheppub/espcrc1 槽已删: vendor/stubs/*.sty 真 stub 在,
          #  scan_install vendored 预检先于 missing_file 分类落件, shim_map
          #  永远轮不到此名 —— 死配置; 旧 espcrc1 body 无 \readRCS 复活即回归)
          # ── 2026-09-16 wave-2 (loop2-delta 残盘 ~27 格, 1d scout-unfix 枚举) ──
          # 继任类桥: emulateapj-rtx4 (revtex4 时代变体, 1404.2351 实证),
          # amsart2000 (vintage amsart), nature2 (老 Nature 名) —— 同
          # sig-alternate 先例。
          emulateapj-rtx4.cls:
            { loads: "emulateapj", needs: ["emulateapj.cls"] }
          amsart2000.cls: { loads: "amsart", needs: ["amsart.cls"] }
          nature2.cls: { loads: "nature", needs: ["nature.cls"] }
          # acm_proc_article-sp (2009 时代 ACM 版式, 1306.0281 实证) —— 纯
          # loads 桥只换类壳, 老作者块族 (\titlenote/\alignauthor/\affaddr/
          # \affinst/\additionalauthors) 在 acmart 下语义错配: 原生
          # \titlenote 向 \@title 追加 \footnotemark, 在 \author{} 参内
          # \MakeUppercase→\__text_expand 展开即 \@xfootnotemark 定界参失配
          # + Missing \endcsname 百连 (unfixable:early_eof)。body 套件:
          # \titlenote 无条件 \protected 桥 \thanks (原生定义即炸点),
          # \alignauthor→\par (列起始命令), \affaddr/\affinst→\emph (保文
          # 不污 \addresses), \additionalauthors→\author, abstract 序桥按
          # \@ACM@maketitle@typeset 分路 (late path 不走 Collect@Body),
          # \cal/\mit 复活 (amsart 有意略去, head.tex \cA 族 ~100 调用)。
          # 降级面: 五作者并单条 (列流无法无损重建), 机构 emph 行内保文。
          # 实证/设计: bench/results/fixer-legacy-acm-2026-09-17/。
          acm_proc_article-sp.cls:
            needs: ["acmart.cls"]
            body: "\n\\NeedsTeXFormat{LaTeX2e}\n\\ProvidesClass{acm_proc_article-sp}[2026/09/17 fixloop legacy shim -> acmart + author-block kit]\n\\LoadClassWithOptions{acmart}\n% --- acm_proc_article-sp author-block family under acmart (1306.0281) ---\n% \\alignauthor is a column-starter (no arg, name runs to \\\\) — \\par mirrors\n% the old \"new author column\" break inside the single acmart \\author{} arg.\n\\ifdefined\\alignauthor\\else\\protected\\def\\alignauthor{\\par}\\fi\n% \\affaddr/\\affinst{inst} sit loose inside \\author{} — acmart \\affiliation\n% would corrupt \\addresses there; inline emph keeps the text.\n\\ifdefined\\affaddr\\else\\protected\\def\\affaddr#1{\\emph{#1}}\\fi\n\\ifdefined\\affinst\\else\\protected\\def\\affinst#1{\\emph{#1}}\\fi\n% \\titlenote inside \\author{} executes inside \\MakeUppercase: acmart's\n% native def appends \\footnotemark to \\@title -> \\@xfootnotemark mismatch\n% + Missing \\endcsname storm (100 errs). Override is mandatory — \\protected\n% bridge to \\thanks survives text_expand and lands in the \\thankses strip.\n\\protected\\def\\titlenote#1{\\thanks{#1}}\n% \\additionalauthors{names} top-level -> register as another acmart author.\n\\ifdefined\\additionalauthors\\else\\protected\\long\\def\\additionalauthors#1{\\author{#1}}\\fi\n% \\numberofauthors{N} — acmart auto-counts (cs_table polyfill also covers).\n\\ifdefined\\numberofauthors\\else\\protected\\def\\numberofauthors#1{}\\fi\n% acmart has native \\subtitle — guard only for exotic load paths.\n\\ifdefined\\subtitle\\else\\protected\\def\\subtitle#1{}\\fi\n% Old acm_proc order puts abstract AFTER \\maketitle; acmart \\@saveabstract\n% ClassErrors once \\@ACM@maketitle@typeset. Conditional bridge: pre-maketitle\n% keeps the native Collect@Body stash; post-maketitle typesets the body as a\n% plain labelled block — NO Collect@Body on the late path (its body-scan\n% hijacks \\abstract and cannot tolerate a typesetting callback).\n\\renewenvironment{abstract}{\\if@ACM@maketitle@typeset\\par\\medskip\\noindent{\\bfseries\\abstractname.}\\space\\ignorespaces\\else\\Collect@Body\\@saveabstract\\fi}{\\if@ACM@maketitle@typeset\\par\\medskip\\fi}\n% 2.09 font switches: acmart inherits \\rm\\sf\\tt\\bf\\it\\sl\\sc from\n% amsart (its \\DeclareOldFontCommand block); only \\cal/\\mit are missing\n% (amsart deliberately omits them) — doc \\cA->{\\cal A} family needs them.\n\\ifdefined\\cal\\else\\DeclareOldFontCommand{\\cal}{\\normalfont\\itshape}{\\mathcal}\\fi\n\\ifdefined\\mit\\else\\DeclareOldFontCommand{\\mit}{\\normalfont\\itshape}{\\mathnormal}\\fi\n% ntheorem compat (scout-thmtwin, 1306.0281): the amsthm bridge above\n% leaves \\@begintheorem in three-arg form, but ntheorem loaded WITHOUT\n% the [amsthm] option calls it kernel two-arg — `[` becomes the #2\n% delimiter and the scan swallows to \\par (Paragraph ended x6 + missing\n% \\item x6). Restore item-only defs, double-gated: only when ntheorem\n% loaded, amsthm-option form untouched. \\PassOptionsToPackage{amsthm}\n% {ntheorem} rejected — collides on style/proof/openbox + \\NAT@@citetp.\n\\AtBeginDocument{\\@ifpackageloaded{ntheorem}{%\n  \\def\\@begintheorem#1#2{\\item[\\hskip\\labelsep \\theorem@headerfont #1\\ #2.]}%\n  \\def\\@opargbegintheorem#1#2#3{\\item[\\hskip\\labelsep \\theorem@headerfont #1\\ #2\\ (#3).]}%\n}{}}\n% --- sig-alternate 同族版式件 (clsfidcen ~9 格): conference/category\n% 族存值件 noop, \\category 尾可选参经定界 eater 吞 ---\n\\def\\acmsp@eato[#1]{}\n\\ifdefined\\category\\else\\protected\\def\\category#1#2#3{\\@ifnextchar[\\acmsp@eato\\relax}\\fi\n\\ifdefined\\conferenceinfo\\else\\protected\\def\\conferenceinfo#1#2{}\\fi\n\\ifdefined\\CopyrightYear\\else\\protected\\def\\CopyrightYear#1{}\\fi\n\\ifdefined\\crdata\\else\\protected\\def\\crdata#1{}\\fi\n\\ifdefined\\permission\\else\\protected\\def\\permission#1{}\\fi\n\\ifdefined\\isbn\\else\\protected\\def\\isbn#1{}\\fi\n\\ifdefined\\doi\\else\\protected\\def\\doi#1{}\\fi\n\\ifdefined\\printccsdesc\\else\\protected\\def\\printccsdesc{}\\fi\n\\ifdefined\\toappear\\else\\protected\\def\\toappear#1{}\\fi\n\\ifdefined\\toappearbox\\else\\protected\\def\\toappearbox#1{}\\fi\n\\ifdefined\\balancecolumns\\else\\protected\\def\\balancecolumns{}\\fi\n\\endinput\n"
          # TL 全缺席出版商类 → article 桥 (版式降级保内容): svmult
          # (Springer 专著), cimento (Nuovo Cimento), eptcs, JINST, PoS
          # (SISSA), appolb, pasj00, aa501 (A&A), kapproc —— 逐格实证名见
          # REPORT 补记7 delta 残盘表。
          # svmult.cls (Springer 专著类, TL 无) → article + 真件宏面
          # (clsfidcen ~31 格; 真件 corpus_daily/2609.19176 抄签名):
          # running-heads 是 \newtoks 寄存器 (稿 \titlerunning{...} 赋
          # 值), theorem 面 = svjour3 同款三式 \spnewtheorem 路由。
          svmult.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{svmult}[2026/09/20 fixloop legacy shim -> article + svmult polyfills]
              \LoadClassWithOptions{article}
              % toks 寄存器 verbatim: 稿 \titlerunning{...} 是赋值非调用
              \@ifundefined{titlerunning}{\newtoks\titlerunning}{}
              \@ifundefined{authorrunning}{\newtoks\authorrunning}{}
              \@ifundefined{toctitle}{\newtoks\toctitle}{}
              \@ifundefined{tocauthor}{\newtoks\tocauthor}{}
              \providecommand{\inst}[1]{\unskip$^{#1}$}
              \providecommand{\orcidID}[1]{\unskip$^{[#1]}$}
              \providecommand{\fnmsep}{\unskip$^,$}
              \providecommand{\subtitle}[1]{\gdef\@subtitle{#1}}
              \providecommand{\institute}[1]{\gdef\@institute{#1}}
              \providecommand{\email}[1]{\texttt{#1}}
              % \svhline 真件 verbatim (booktabs 式粗线, 依赖内核 \@xhline)
              \providecommand{\svhline}{\noalign{\ifnum0=`}\fi\hrule \@height2\arrayrulewidth \futurelet\reserved@a\@xhline}
              % \greeksym{chr} 真件走 psy 字体 —— xetex 下不稳, 降级直印;
              % \umu/\udelta 真件由 greeksym 字母派生 → 数学字母兜底
              \providecommand{\greeksym}[1]{#1}
              \providecommand{\umu}{\ensuremath{\mu}}
              \providecommand{\udelta}{\ensuremath{\delta}}
              % qed 族 (画框版 \squareforqed, 同 svjour3 stub 先例)
              \def\squareforqed{\hbox{\vbox{\hrule height0.6pt\hbox{%
                \vrule height1.3ex width0.6pt\hskip0.8ex\vrule width0.6pt}\hrule height0.6pt}}}
              \providecommand{\qed}{\ifmmode\else\unskip\quad\fi\squareforqed}
              \providecommand{\smartqed}{\def\qed{\ifmmode\squareforqed\else{\unskip\nobreak\hfil
              \penalty50\hskip1em\null\nobreak\hfil\squareforqed
              \parfillskip=0pt\finalhyphendemerits=0\endgraf}\fi}}
              % \spnewtheorem 三式路由 → kernel \newtheorem (字体两参丢弃)
              \providecommand{\spnewtheorem}{\@ifstar\texlate@svm@uthm\texlate@svm@thm}
              \def\texlate@svm@thm#1{\@ifnextchar[{\texlate@svm@thmA{#1}}{\texlate@svm@thmB{#1}}}
              \def\texlate@svm@thmA#1[#2]#3#4#5{\newtheorem{#1}[#2]{#3}}
              \def\texlate@svm@thmB#1#2{\@ifnextchar[{\texlate@svm@thmC{#1}{#2}}{\texlate@svm@thmD{#1}{#2}}}
              \def\texlate@svm@thmC#1#2[#3]#4#5{\newtheorem{#1}{#2}[#3]}
              \def\texlate@svm@thmD#1#2#3#4{\newtheorem{#1}{#2}}
              \def\texlate@svm@uthm#1#2#3#4{\@ifundefined{#1}%
                {\newenvironment{#1}{\par\noindent{\bfseries#2}\enspace\ignorespaces}{\par}}{}}
              % acknowledgement env 真件 \trivlist 形 → 标题段降级; \ackname 供
              \providecommand{\ackname}{Acknowledgements}
              \@ifundefined{acknowledgement}{\newenvironment{acknowledgement}{\par\noindent{\bfseries\ackname.}\enspace\ignorespaces}{\par}}{}
              % 版式指示件 noop
              \providecommand{\biblstarthook}[1]{}
              \providecommand{\sidecaption}{}
              \providecommand{\frontmatter}{}
              \providecommand{\mainmatter}{}
              \providecommand{\backmatter}{}
              \providecommand{\cleardoublepage}{\clearpage}
              \endinput
          # memo-l.cls: memoir+amsaddr 混合书稿类 (IMS 讲义系, TL 无;
          # 1003.0348 实证面: \frontmatter、\address/\email/\thanks 前置
          # 收集、\subjclass[2000]{...}、\keywords{...}、\onehalfspacing)
          # —— memoir 底 (TL 在库) + ams frontmatter polyfill。
          memo-l.cls:
            # qc-impl 2026-09-28: +amsthm.sty belt (vendor/stubs 真件
            # 常态先中, 本键只在 vendored_fetch 绕行时兜底 —— manifest
            # deferred_to_rules_lane 项)
            needs: ["memoir.cls", "setspace.sty", "amsthm.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{memo-l}[2026/09/26 fixloop legacy shim -> memoir + ams-addr polyfills]
              \LoadClassWithOptions{memoir}
              \RequirePackage{setspace}
              % qc-impl 2026-09-28: +amsthm (vendor stub :17 同款) —— 稿
              % \theoremstyle{definition}/{remark}+\begin{proof} 面不装
              % amsthm 即 Undefined; TL 在场恒可载, 稿自装幂等
              \RequirePackage{amsthm}
              \let\memol@subj\@empty
              \let\memol@keys\@empty
              \providecommand{\address}[1]{\g@addto@macro\@author{\\ {\normalsize\itshape\begin{tabular}[t]{@{}c@{}}#1\end{tabular}}}}
              \providecommand{\email}[1]{\g@addto@macro\@author{\\ {\footnotesize\texttt{#1}}}}
              \providecommand{\subjclass}[2][2000]{\gdef\memol@subj{\par\noindent{\footnotesize #1 \textit{Mathematics Subject Classification.} #2}\par}}
              \providecommand{\keywords}[1]{\gdef\memol@keys{\par\noindent{\footnotesize\textbf{Keywords:} #1}\par}}
              \renewcommand{\thanks}[1]{\g@addto@macro\@author{\\ {\footnotesize #1}}}
              \let\memol@mk\maketitle
              \renewcommand{\maketitle}{\memol@mk
                \ifx\memol@subj\@empty\else\memol@subj\fi
                \ifx\memol@keys\@empty\else\memol@keys\fi}
              \endinput
          # cimento.cls (Nuovo Cimento, TL 无): article + 实证 frontmatter
          # 面 (0905.4620 随稿签名)——\from{key} \inst{key} \instlist{...}
          # \PACSes{...\PACSit{code}{desc}...}。
          cimento.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{cimento}[2026/09/19 fixloop legacy shim -> article + cimento polyfills]
              \LoadClassWithOptions{article}
              \providecommand{\from}[1]{\textsuperscript{#1}}
              \providecommand{\inst}[1]{\textsuperscript{#1}~}
              % \instlist 在 preamble 期调用 (0905.4620 :14, \begin{document}
              % :25); \PACSes 同族 frontmatter 位 (稿内注释态 :16)——排印件
              % 一律 \AtBeginDocument 包裹: preamble 调用延后至 begindoc
              % 合法排印, in-doc 调用 (1003.0945 系 pasj00 签名实证另一路)
              % 在现代 one-time hook 语义下立即执行——两路皆安全, 免存值件。
              \providecommand{\instlist}[1]{\AtBeginDocument{\par\medskip\noindent #1\par}}
              \providecommand{\PACSes}[1]{\AtBeginDocument{\par\noindent\textbf{PACS:} #1\par}}
              \providecommand{\PACSit}[2]{#1\quad #2\par}
              % clsfidcen 补面 (真件 1107.0266 verbatim 抄值): \atque/\And
              % \etal/\idest/\jr 行内字面件; \acknowledgments 三星居中块 +
              % \stars/\solong 别名; \drm/\sy/\tx/\un/\chem/\mth/\acro
              % 单位-记号族 (math-only 件保 \ensuremath 双模)
              \providecommand{\atque}{{\normalfont\MakeLowercase{and\ \ignorespaces}}}
              \def\And{\atque}
              \providecommand{\etal}{{\rmfamily\itshape\mdseries et al.}}
              \providecommand{\idest}{{\rmfamily\itshape\mdseries i.e.}}
              \providecommand{\jr}{{\upshape jr.}}
              \providecommand{\acknowledgments}{\par\medskip{\centering$\ast\ \ast\ \ast$\par}\medskip}
              \let\stars\acknowledgments
              \let\solong\acknowledgments
              \providecommand{\drm}{\mathrm{d}}
              \providecommand{\sy}[1]{\mathrm{#1}}
              \let\ab\sy
              \providecommand{\tx}[1]{\mbox{#1}}
              \providecommand{\un}[1]{{\,\mbox{#1}}}
              \providecommand{\chem}[1]{\ensuremath{\mathrm{#1}}}
              \providecommand{\mth}[1]{\ensuremath{#1}}
              \providecommand{\acro}[1]{{\normalfont #1}}
              % bbl-struct 宏族 (真件 :1760-1768 verbatim) + \ETC noop +
              % \issue/\shortauthor/\institute 存值件
              \providecommand{\NAME}[1]{\textsc{#1}}
              \let\name\NAME
              \providecommand{\BY}[1]{\NAME{#1},}
              \providecommand{\IN}[4]{\textit{#1}, \textbf{#2} (#3) #4}
              \providecommand{\SAME}[3]{\textbf{#1} (#2) #3}
              \providecommand{\TITLE}[1]{\textit{#1}}
              \providecommand{\ETC}{}
              \providecommand{\issue}[3]{}
              \providecommand{\shortauthor}[1]{}
              \providecommand{\institute}[1]{}
              % eqnletter/mathletters env (真件 :1338-1346): eqnarray 包
