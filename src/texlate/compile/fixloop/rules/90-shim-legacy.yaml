              \renewcommand{\maketitle}{\ich@maketitle
                \ifx\ich@affils\@empty\else\par{\footnotesize\ich@affils\par}\fi
                \ifx\ich@abstract\@empty\else\begin{quotation}\noindent
                \textbf{Abstract.} \ich@abstract\end{quotation}\fi}
              \providecommand{\fl}{}
              \newcommand{\Table}[2]{\begin{tabular}{#1}#2\end{tabular}}
