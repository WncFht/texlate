# rules/90-shim-legacy.yaml — fixloop 规则库分片：legacy_pkg_shim —— 退役包/类 shim_map 大表（单条独占）
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/00-base.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # 新增 (fixloop-v2 整改): 退役/改名包 shim —— install_file 查无真包后的出路。
  # 实证: 1806.06690 缺 aastex.cls → emulateapj 顶替出 13 页全文档 pdf;
  # psfig→epsfig 桥可用因 epsfig 的 Gin key 同收 figure=/file= (graphics pkg,
  # TL 内装得上)。真 2.09 文档到不了这里 —— gate 先拒, 语义分层干净。
  - id: legacy_pkg_shim
    mechanisms: [B05, W80]
    description: "退役/改名包 (aas2pp4/elsart1p/jhep 等老名) → wdir 注入同名 stub + 装依赖 (vendored 名归 vendored_fetch 先中, 本表只存非 vendored 缺口)"
    phase: loop
    order: 12 # install_file(10) 之后: 真包装得上先用真包, 查无才 shim
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: legacy_pkg_shim
      params:
        shim_map:
          # \ProvidesClass 版本串必须日期开头, 否则 \@ifl@t@r 解析崩 \ifnum。
          # (aastex.cls/revtex.cls/psfig.sty 槽已删: vendor/files·shims 有
          #  真件/替身 stub —— vendored_fetch(11.5) 先于本规则(12)命中,
          #  死配置。aastex→emulateapj/psfig→epsfig 旧论证与 revtex.cls 的
          #  2.09 残面语义见 git 考古; revtex 系残面现由 vendor/shims/
          #  revtex.cls + 文件尾 revtex209_surface_polyfill 承担)
          # \input psfig / \input{psfig.tex} 裸装载形 (批七 wave-final ×1):
          # 同桥 epsfig —— \input 语境必在导言区 (psfig 史前装载惯例),
          # \RequirePackage 合法; 若真有正文内 \input 会报 preamble-only 错
          # 再议 (未观测)。裸 payload `psfig` 由 legacy_pkg_shim L722-726
          # 归一到 psfig.tex 键, 同条覆盖 ×6 裸签格。
          psfig.tex:
            needs: ["epsfig.sty"]
            body: |
              % fixloop legacy shim: psfig.tex -> epsfig (官方 (e)psfig emulation)
              \RequirePackage{epsfig}
              % psfig 专有 rheight/rwidth (reserved box dims, 真身默认回落到
              % width/height) epsfig 仿真全 kv 灌 \setkeys{Gin} → Gin 无键
              % Package keyval Error (hep-lat/0501006 实证) —— 补 Gin 别名
              % 到 height/width 同宏。\input 装载 @=12 → catcode64
              % save/restore 裹 (geom.sty 体同款惯例)。
              \edef\psfigrestore{\catcode 64=\the\catcode 64\relax}
              \catcode 64=11\relax
              \define@key{Gin}{rheight}{\def\Gin@eheight{#1}}
              \define@key{Gin}{rwidth}{\def\Gin@ewidth{#1}}
              \psfigrestore
              \endinput
          # ── AAS v4 系 2.09 选项文件 (批七 + C-bucket 残盘 16 格并面) ──
          # \documentstyle[...,aas2pp4]{article} 经 legacy 重写成
          # \usepackage{...} → TL 不载 → missing_file。v4 family 共享超集
          # body = apjprepr 面 + preamble 安全化: \slugcomment 系 PRE 调用
          # → 存值 + \AtBeginDocument 吐页眉行 (旧体即时排版 →
          # no_begindoc 4 格实证); \title/\author/\affil BOD 调用 → 即时
          # 排版 (doc2sty 范式, 16 格里 \maketitle 仅 1 现)。多名同 body
          # 双载防御: 首载置 \aasfour@done, 后载即 \endinput (ver@ 已注册
          # 无副作用) —— 0111197/9901091/9910131 等 7 格 aasms4+aaspp4
          # 同载实证, \newenvironment/\newcounter 裸跑必撞。
          # (aasms4.sty/aaspp4.sty 槽已删: vendor/stubs 同名 stub 在 ——
          #  vendored_fetch(11.5) 先中, 死配置; aas4_body anchor 由
          #  aas2pp4 持锚, 双载守卫同款内嵌)
          aas2pp4.sty:
            needs: ["amssymb.sty", "epsf.sty"]
            body: &aas4_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{aas4x}[2026/09/18 fixloop legacy shim -> article + AAS v4 surface]
              \DeclareOption*{}
              \ProcessOptions\relax
              \@ifundefined{aasfour@done}{}{\endinput}
              \def\aasfour@done{1}
              \RequirePackage{amssymb}
              \@ifundefined{epsfbox}{\RequirePackage{epsf}}{}
              % ── 导言区 meta: noop 或存值 ──
              \def\received#1{}
              \def\accepted#1{}
              \def\journalid#1#2{}
              \def\articleid#1#2{}
              \def\notetoeditor#1{}
              \def\subjectheadings#1{}
              \def\lefthead#1{\markboth{#1}{}}
              \def\righthead#1{\markboth{}{#1}}
              \def\aas@slug{}
              \def\aas@email{}
              \def\slugcomment#1{\gdef\aas@slug{#1}}
              \def\authoremail#1{\gdef\aas@email{#1}}
              \AtBeginDocument{\ifx\aas@slug\@empty\else\noindent{\footnotesize\aas@slug}\par\fi
                \ifx\aas@email\@empty\else\noindent{\footnotesize\aas@email}\par\fi}
              % ── 正文区 frontmatter: doc2sty 即时排版 ──
              \def\title#1{\begin{center}\large\bfseries#1\end{center}}
              \def\author#1{\begin{center}\normalsize#1\end{center}}
              \def\affil#1{\begin{center}\small#1\end{center}}
              \def\and{\begin{center}and\end{center}}
              \let\authoraddr=\@gobble
              \def\altaffilmark#1{\textsuperscript{#1}}
              \def\altaffiltext#1#2{\par\medskip\noindent\textsuperscript{#1}\,#2\par}
              \def\keywords#1{\par\noindent\textbf{Keywords:} #1\par}
              \def\acknowledgments{\section*{Acknowledgments}}
              \let\acknowledgements=\acknowledgments
              \def\tighten{\def\baselinestretch{1.0}}
              \let\tightenlines=\tighten
              \def\singlespace{\def\baselinestretch{1.0}\normalsize}
              \def\doublespace{\def\baselinestretch{1.6}\normalsize}
              \def\eqsecnum{\@addtoreset{equation}{section}%
              \def\theequation{\thesection-\arabic{equation}}}
              % ── deluxetable 复合面 (aaspp4 实证模型 + qc-impl 2026-09-28
              %   vendor/stubs/aasms4.sty:57-72 自开张移植): 真件 \tablehead/
              %   \startdata 各自可开 tabular。旧 stub 只在 \tablehead 开张、
              %   \startdata 纯 noop → 稿省 \tablehead 直书 \startdata 时整表
              %   塌成一段 (impl-builtins item 2 让渡条)。开张标记
              %   \aasfour@dtopen 用 \gdef —— \tablehead 尾端在 halign 格内
              %   展开, \def 随格组消亡传到 \startdata 已丢; env 开头
              %   \global\let 复位供同稿多表。\@delspec 缺席兜底 'l'。 ──
              \newenvironment{deluxetable}[1]{\begin{table}[htbp]\centering\def\@delspec{#1}\global\let\aasfour@dtopen\@undefined}{\end{table}}
              \newenvironment{deluxetable*}[1]{\begin{table}[htbp]\centering\def\@delspec{#1}\global\let\aasfour@dtopen\@undefined}{\end{table}}
              \let\planotable=\deluxetable
              \let\endplanotable=\enddeluxetable
              \def\tablewidth#1{}
              \def\tablecolumns#1{}
              \def\tablecaption#1{\caption{#1}}
              \def\tablehead#1{\expandafter\tabular\expandafter{\@delspec}#1\\\hline\gdef\aasfour@dtopen{1}}
              \def\tabletail#1{}
              \def\tableheadfrac#1{}
              \def\startdata{\@ifundefined{aasfour@dtopen}{\@ifundefined{@delspec}{\def\@delspec{l}}{}\expandafter\tabular\expandafter{\@delspec}\gdef\aasfour@dtopen{1}}{}}
              \def\enddata{\@ifundefined{aasfour@dtopen}{}{\endtabular\global\let\aasfour@dtopen\@undefined}}
              \def\nl{\\}
              \let\nextline=\nl
              \def\tableline{\hline}
              \def\colhead#1{#1}
              \def\tablevspace#1{\noalign{\vskip#1}}
              \def\tablebreak{\\}
              \def\cutinhead#1{\hline#1\\\hline}
              \def\sidehead#1{\noalign{\vskip1.5ex}#1\\\noalign{\vskip.5ex}}
              \def\tablenum#1{\def\thetable{#1}\let\@currentlabel\thetable\addtocounter{table}{\m@ne}}
              \def\figurenum#1{\def\thefigure{#1}\let\@currentlabel\thefigure\addtocounter{figure}{\m@ne}}
              \let\placetable=\@gobble
              \let\placefigure=\@gobble
              \let\placeplate=\@gobble
              \def\phs{\phantom{0}}
              \def\phn{\phantom{0}}
              \def\phd{\phantom{.}}
              \def\phm#1{\phantom{#1}}
              \def\tablenotetext#1#2{\par\smallskip\noindent\textsuperscript{#1}\,#2\par}
              \def\tablenotemark#1{\textsuperscript{#1}}
              \def\tablerefs#1{\par\medskip\noindent References. --- #1\par}
              \def\tablecomments#1{\par\medskip\noindent Note. --- #1\par}
              \newcommand{\figcaption}[2][]{\par\medskip\noindent\textbf{Figure.} #2\par}
              \newcounter{cureqno}
              \newenvironment{mathletters}{\refstepcounter{equation}%
              \setcounter{cureqno}{\value{equation}}%
              \let\@curtheeqn\theequation%
              \edef\cur@eqn{\theequation}%
              \def\theequation{\cur@eqn\alph{equation}}%
              \setcounter{equation}{0}}%
              {\let\theequation\@curtheeqn%
              \setcounter{equation}{\value{cureqno}}}
              \def\eqnum#1{\def\theequation{#1}\let\@currentlabel\theequation\addtocounter{equation}{\m@ne}}
              % ── references 环境 + \reference→\refpar (9910131×47 实证大户) ──
              \def\references{\subsection*{References}%
              \bgroup\parindent=\z@\parskip=\itemsep
              \def\refpar{\par\hangindent=3em\hangafter=1}}
              \def\endreferences{\refpar\egroup}
              \def\markcite{}
              \def\reference{\refpar}
              % ── epsf 系图片件 ──
              \def\eps@scaling{.95}
              \def\epsscale#1{\def\eps@scaling{#1}}
              \def\plotone#1{\par\medskip\centering\leavevmode
              \epsfxsize=\eps@scaling\columnwidth\epsfbox{#1}\par\medskip}
              \def\plottwo#1#2{\par\medskip\centering\leavevmode
              \epsfxsize=.45\columnwidth\epsfbox{#1}\hfil
              \epsfxsize=.45\columnwidth\epsfbox{#2}\par\medskip}
              % \plotfiddle{file}{voff}{rot}{hsf}{vsf}{htrans}{vtrans} (aastex
              % 7参变换形, 9901236 实证 28 调) → 降级吃 file+忽略变换
              \def\plotfiddle#1#2#3#4#5#6#7{\par\medskip\centering\leavevmode
              \epsfxsize=\eps@scaling\columnwidth\epsfbox{#1}\par\medskip}
              % ── 物理记号/单位件 ──
              \def\sun{\hbox{$\odot$}}
              \def\earth{\hbox{$\oplus$}}
              \def\sq{\hbox{\rlap{$\sqcap$}$\sqcup$}}
              \let\la=\lesssim
              \let\ga=\gtrsim
              \def\arcdeg{\hbox{$^\circ$}}
              \def\arcmin{\hbox{$^\prime$}}
              \def\arcsec{\hbox{$^{\prime\prime}$}}
              \def\fd{\hbox{$.\!\!^{\rm d}$}}
              \def\fh{\hbox{$.\!\!^{\rm h}$}}
              \def\fm{\hbox{$.\!\!^{\rm m}$}}
              \def\fs{\hbox{$.\!\!^{\rm s}$}}
              \def\fdg{\hbox{$.\!\!^\circ$}}
              \def\farcm{\hbox{$.\mkern-4mu^\prime$}}
              \def\farcs{\hbox{$.\!\!^{\prime\prime}$}}
              \def\fp{\hbox{$.\!\!^{\scriptscriptstyle\rm p}$}}
              \def\micron{\hbox{$\mu$m}}
              \def\case#1#2{\hbox{$\frac{#1}{#2}$}}
              \def\slantfrac#1#2{\hbox{$\,^#1\!/_#2$}}
              \def\onehalf{\slantfrac{1}{2}}
              \def\onethird{\slantfrac{1}{3}}
              \def\twothirds{\slantfrac{2}{3}}
              \def\onequarter{\slantfrac{1}{4}}
              \def\threequarters{\slantfrac{3}{4}}
              \def\ubvr{\hbox{$U\!BV\!R$}}
              \def\ub{\hbox{$U\!-\!B$}}
              \def\bv{\hbox{$B\!-\!V$}}
              \def\vr{\hbox{$V\!-\!R$}}
              \def\ur{\hbox{$U\!-\!R$}}
              \def\ion#1#2{#1$\;${\small\rm\@Roman{#2}}\relax}
              \def\nodata{ ~$\cdots$~ }
              % ── 期刊缩写全表 (emulateapj/apjprepr 同表) ──
              \def\aj{AJ}
              \def\araa{ARA\&A}
              \def\apj{ApJ}
              \def\apjl{ApJ}
              \def\apjs{ApJS}
              \def\ao{Appl.~Opt.}
              \def\apss{Ap\&SS}
              \def\aap{A\&A}
              \def\aapr{A\&A~Rev.}
              \def\aaps{A\&AS}
              \def\azh{AZh}
              \def\baas{BAAS}
              \def\jrasc{JRASC}
              \def\memras{MmRAS}
              \def\mnras{MNRAS}
              \def\pra{Phys.~Rev.~A}
              \def\prb{Phys.~Rev.~B}
              \def\prc{Phys.~Rev.~C}
              \def\prd{Phys.~Rev.~D}
              \def\pre{Phys.~Rev.~E}
              \def\prl{Phys.~Rev.~Lett.}
              \def\pasp{PASP}
              \def\pasj{PASJ}
              \def\qjras{QJRAS}
              \def\skytel{S\&T}
              \def\solphys{Sol.~Phys.}
              \def\sovast{Soviet~Ast.}
              \def\ssr{Space~Sci.~Rev.}
              \def\zap{ZAp}
              \def\nat{Nature}
              \def\iaucirc{IAU~Circ.}
              \def\aplett{Astrophys.~Lett.}
              \def\apspr{Astrophys.~Space~Phys.~Res.}
              \def\bain{Bull.~Astron.~Inst.~Netherlands}
              \def\fcp{Fund.~Cosmic~Phys.}
              \def\gca{Geochim.~Cosmochim.~Acta}
              \def\grl{Geophys.~Res.~Lett.}
              \def\jcp{J.~Chem.~Phys.}
              \def\jgr{J.~Geophys.~Res.}
              \def\jqsrt{J.~Quant.~Spec.~Radiat.~Transf.}
              \def\memsai{Mem.~Soc.~Astron.~Italiana}
              \def\nphysa{Nucl.~Phys.~A}
              \def\physrep{Phys.~Rep.}
              \def\physscr{Phys.~Scr}
              \def\planss{Planet.~Space~Sci.}
              \def\procspie{Proc.~SPIE}
              \let\astap=\aap
              \let\apjlett=\apjl
              \let\apjsupp=\apjs
              \let\applopt=\ao
              \endinput
          # (eqsecnum.sty 槽已删: vendor/stubs 同名 stub 在 —— vendored
          #  先中, 死配置; cs_table eqnobysec 条仍管 docclass 后注入面,
          #  分工照旧)
          # ── 2026-09-16 n100 F1 扩列 ──────────────────────────────────
          # elsart 家族 → elsarticle: Elsevier 官方继任类, 明确兼容 elsart 稿
          # (\author[tag]/\address[tag]/abstract 环境同签名)。0707.4465 实证。
          # (elsart.cls 槽已删: vendor/files 真件在 —— vendored 先中, 死配置;
          #  elsart_body anchor 由存活键 elsart1p 持锚)
          # body 形缘起 (hep-lat/0111059): 派生类 cpcauth
          # \LoadClass{elsart} 后直接引用 elsart 私有面, elsarticle 不导出。
          # eqntopsep/eqnarraycolsep 被赋 \@plus/\@minus 胶 → 必须 \newskip;
          # \@bls 在因子位 (2\@bls) 用 → \newdimen。余为 elsart 私有 if/count/
          # 版式宏; \@sharp 由内核 \mkpream 自绑, 无需补。纯增量对普通
          # elsart 稿无副作用。
          elsart1p.cls:
            needs: ["elsarticle.cls"]
            body: &elsart_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{elsart}[2026/09/17 fixloop legacy shim -> elsarticle]
              \LoadClassWithOptions{elsarticle}
              \newskip\eqntopsep
              \newskip\eqnarraycolsep
              \newdimen\@bls
              \@bls=13\p@
              \newdimen\@frontmatterwidth
              \newcount\@maxlistdepth
              \@maxlistdepth=8
              \newif\if@TwoColumn
              \@TwoColumntrue
              \newif\if@ussrhead
              \newif\if@Elproofing
              \def\@pagenumprefix{}
              \def\ESpagenumber#1{\arabic{#1}}
              \def\head@format#1#2{#1\space#2}
              \def\@secnumfont{\bfseries}
              \def\head@style{}
              % 批八: elsart 公开面补 (corauth 30格实证) —— \corauth[label]{注}
              % 桥 elsarticle \cortext; \startlocaldefs/\endlocaldefs 是
              % elsart 导言区局部定义定界 (imsart 同构), noop 对吞界定符
              % 保留内部定义生效; \end 前缀名 \@ifdefinable 拒收用 ifdefined 守。
              \providecommand{\corauth}[2][]{\ifdefined\cortext\cortext[#1]{#2}\fi}
              \providecommand{\startlocaldefs}{}
              \ifdefined\endlocaldefs\else\def\endlocaldefs{}\fi
              % verifier-batch8 残面回添: \corauthref{label} 引注号回指 +
              % frontmatter 依赖件 —— \NoHyper 是 hyperref 时代 env 名
              % (elsart 稿当 begin/end 用), \t@glob@notes 是 elsarticle
              % 内部注件容器 (@=letter 域内直定义)。
              \providecommand{\corauthref}[1]{\ref{#1}}
              \ifdefined\NoHyper\else\newenvironment{NoHyper}{}{}\fi
              \providecommand{\t@glob@notes}{}
              \endinput
          # 批八: elsart 全系兄弟共享同体 (ProvidesClass 名差仅 warning,
          # siam_body 先例) —— loads 裸桥无公开宏面, elsart1p 实证 corauth 炸。
          elsart3p.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsart5p.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsevier.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          # elsart 旁系 (gtrap-scout-2026-09-16 §a): elsart3/3-1/elsart1、
          # autart (Automatica, \proc@elem 逐字节同 elsart)、personal
          # (elsart 克隆) —— 非 ship 声明的 class-not-found 模态同图
          # elsarticle; ship 真载体的 misschar 毒化由 CJK_FIRST_USE_WARMUP
          # 覆盖 (cmrepro 10/10 实证), 不属本表。
          elsart3.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsart3-1.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsart1.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          autart.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          personal.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          # sig-alternate (ACM ≤2015 版式) → acmart 官方继任; naturemag → nature。
          sig-alternate.cls:
            needs: ["acmart.cls"]
            body: &sigalt_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{sig-alternate}[2026/09/20 fixloop legacy shim -> acmart + sig-alternate kit]
              \LoadClassWithOptions{acmart}
              % sig-alternate (ACM ≤2015 版式) → acmart 桥 (clsfidcen ~19 格;
              % 真件 1602.00244 抄签名): \alignauthor 列起始 → \par (acm_proc
              % 先例), \numberofauthors acmart 自计, \category 3 参+尾可选
              % 版本参吞, \conferenceinfo/\CopyrightYear/\crdata/\permission/
              % \isbn/\doi/\toappear 存值件 noop —— 全 \ifdefined 守卫防
              % acmart 原生同名 (acm_proc_article-sp \protected\def 同例)
              \ifdefined\alignauthor\else\protected\def\alignauthor{\par}\fi
              \ifdefined\numberofauthors\else\protected\def\numberofauthors#1{}\fi
              \def\sigalt@eato[#1]{}
              \ifdefined\category\else\protected\def\category#1#2#3{\@ifnextchar[\sigalt@eato\relax}\fi
              \ifdefined\conferenceinfo\else\protected\def\conferenceinfo#1#2{}\fi
              \ifdefined\additionalauthors\else\protected\long\def\additionalauthors#1{\author{#1}}\fi
              \ifdefined\CopyrightYear\else\protected\def\CopyrightYear#1{}\fi
              \ifdefined\crdata\else\protected\def\crdata#1{}\fi
              \ifdefined\permission\else\protected\def\permission#1{}\fi
              \ifdefined\isbn\else\protected\def\isbn#1{}\fi
              \ifdefined\doi\else\protected\def\doi#1{}\fi
              \ifdefined\printccsdesc\else\protected\def\printccsdesc{}\fi
              \ifdefined\toappear\else\protected\def\toappear#1{}\fi
              \ifdefined\toappearbox\else\protected\def\toappearbox#1{}\fi
              \ifdefined\balancecolumns\else\protected\def\balancecolumns{}\fi
              \endinput
          sig-alternate-05-2015.cls:
            { needs: ["acmart.cls"], body: *sigalt_body }
          naturemag.cls: { loads: "nature", needs: ["nature.cls"] }
          # AASTeX v6.x 全退役 (TL 无 aastex6x) → emulateapj + 6x 宏面 polyfill。
          # emulateapj 自带 deluxetable*/\tablehead/\affiliation/\keywords/\dataset
          # 等 aastex5 面; 6x 新增元数据宏在 body 里补 (2105.03750 实证面:
          # \received/\email/\correspondingauthor/\startlongtable/\facilities 等)。
          aastex61.cls:
            needs: ["emulateapj.cls", "epsf.sty"]
            body: &aastex6x_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{aastex6x}[2026/09/16 fixloop legacy shim -> emulateapj]
              % emulateapj5 自指递归保险 —— ver@/opt@ 预注册 (85-shim aastex
