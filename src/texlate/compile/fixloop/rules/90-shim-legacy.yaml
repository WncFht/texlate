          # (slashbox.sty 槽已删: vendor/stubs 同名 stub 在 —— vendored
          #  先中, 死配置; diagbox 委托旧论证见 git 考古)
          # geom.sty (S. Levy 1992, LaTeX2.09 巨型样式; 不在 TL) —— geometry
          # 桥接 + 宏面 polyfill (0806.0904 \input{geom.sty} 实证)。原包 =
          # CTAN latex209/contrib/geomsty (Silvio Levy 1995, geom.sty +
          # geomenv/geomfig/geomart 分件) —— 已取件核实宏面。稿经
          # \makeatletter 区内 \input 装载 (0806.0904:114-121) → @=11;
          # 为兜 @=12 装载者, @-cs 段裹 \catcode64 save/restore。
          # @ catcode 对稿侧无影响: 稿自备 makeatletter。
          # 真身默认值: \ifproofing/\ifautolabel/\ifstarredcontents 均 true
          # (稿各自再 toggle 覆盖)。\presection 真身是 \newskip 不是宏
          # (稿 \@startsection 重定义 \advance\@tempskipa by\presection
          # 直读 → 宏版致 missing-number/illegal-unit 洪泛)。\prooftag
          # 真身 0 参 (\pro@f[\prooftag] 当值用, [1] 版吞后续 token)。
          # \newtheorem 真身取 [{intro}{}]{name} 首可选参 → \@@newtheorem
          # 派工 (稿 0806.0904:661 重定义 @@newtheorem, 靠 geom 供
          # \newtheorem/\@nnthm→\@xnnthm|\@ynnthm 计数创建器/\@enva|b;
          # 稿版 \@nothm/\@nnnthm 3n 系自备, 缺 \@nnnthm 时 \let 兜底
          # \@thm)。proof/Figure env 稿仅 \renewenvironment → 需基座存在;
          # \provedbox/\captionskip/\@captionmargin/\@captionwidth 同补。
          geom.sty:
            needs: ["geometry.sty", "amssymb.sty", "amsmath.sty"]
            body: |
              \typeout{fixloop legacy shim: geom.sty -> geometry + polyfills}
              \DeclareOption*{}
              \ProcessOptions\relax
              \RequirePackage{geometry}
              \RequirePackage{amssymb}
              \RequirePackage{amsmath}
              \newif\ifproofing \proofingtrue
              \newif\ifautolabel \autolabeltrue
              \newif\ifstarredcontents \starredcontentstrue
              \providecommand{\prooftag}{}
              \providecommand{\theoremintro}[1]{{\normalfont\bfseries#1. }}
              \providecommand{\ns}{}
              \providecommand{\marginparstyle}[1]{}
              \providecommand{\mediumseries}{\mdseries}
              \providecommand{\normalshape}{\normalfont}
              \providecommand{\raggedcenter}{\centering}
              \providecommand{\Bbb}{\mathbb}
              \providecommand{\markbothsame}[1]{\markboth{#1}{#1}}
              \providecommand{\unnumbered}[1]{\expandafter\let\csname the#1\endcsname\relax}
              \providecommand{\fullref}[1]{\ref{#1}}
              \providecommand{\Fullref}[1]{\ref{#1}}
              \providecommand{\reftype}[1]{}
              \providecommand{\Reftype}[1]{}
              \providecommand{\setlabeltype}[2]{}
              \providecommand{\preref}{}
              \newskip\presection \presection 0pt plus 10ex\relax
              \newskip\captionskip \captionskip=10pt
              \newbox\provedbox
              \newenvironment{proof}[1][Proof]{\trivlist\item[\textbf{#1}.]}{\endtrivlist}
              \newenvironment{Figure}[2][htbp]{\begin{figure}[#1]}{\end{figure}}
              \let\geomoriglabel\label
              \def\label{\futurelet\geomnext\geomlabelx}
              \def\geomlabelx{\ifx\geomnext*\expandafter\geomlabelstar\else\expandafter\geomoriglabel\fi}
              \def\geomlabelstar*#1{\geomoriglabel{#1}}
              \edef\geomrestore{\catcode 64=\the\catcode 64\relax}
              \catcode 64=11\relax
              \def\newtheorem{\@ifnextchar[{\@newtheorem}{\@newtheorem[{}{}]}}%]
              \long\def\@newtheorem[#1]{\@@newtheorem#1}
              \def\@nnthm#1#2{\@ifnextchar[{\@xnnthm{#1}{#2}}{\@ynnthm{#1}{#2}}}
              \def\@xnnthm#1#2[#3]{\@definecounter{#1}\@addtoreset{#1}{#3}%
                \expandafter\xdef\csname the#1\endcsname{\expandafter\noexpand
                  \csname the#3\endcsname\@thmcountersep\@thmcounter{#1}}%
                \global\@namedef{#1@}{\@nnnthm{#1}{#2}}\global\@namedef{end#1@}{\@endtheorem}}
              \def\@ynnthm#1#2{\@definecounter{#1}%
                \expandafter\xdef\csname the#1\endcsname{\@thmcounter{#1}}%
                \global\@namedef{#1@}{\@nnnthm{#1}{#2}}\global\@namedef{end#1@}{\@endtheorem}}
              \def\@enva#1#2[#3]{\begin{#1@}[#3]#2}
              \def\@envb#1#2{\begin{#1@}#2}
              \long\def\@@newtheorem#1#2#3{%
                \newenvironment{#3}%
                  {\def\object@type{#3}#1\@ifnextchar[{\@enva{#3}{#2}}{\@envb{#3}{#2}}}%]
                  {\end{#3@}}%
                \@ifnextchar[{\@othm{#3@}}{\@nnthm{#3}}%]
              }
              \@ifundefined{@nnnthm}{\let\@nnnthm\@thm}{}
              \def\setprooftag{\xdef\prooftag{\@currentlabel}}
              \newdimen\@captionmargin\@captionmargin=\parindent
              \newdimen\@captionwidth\@captionwidth=\hsize
              \providecommand{\margins}[3][0pt]{\ifx\geometry\@notprerr\newgeometry{hmargin=#2,vmargin=#3}\else\geometry{hmargin=#2,vmargin=#3}\fi}
              \geomrestore
              \endinput
