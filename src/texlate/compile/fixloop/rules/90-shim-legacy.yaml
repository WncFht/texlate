              % 直通 (第 3 参弃)
              \@ifundefined{c@subequation}{\newcounter{subequation}}{}
              \@ifundefined{eqnletter}{\newenvironment{eqnletter}{\begin{eqnarray}}{\end{eqnarray}\stepcounter{equation}\setcounter{subequation}{1}\aftergroup\ignorespaces}}{}
              \@ifundefined{mathletters}{\newenvironment{mathletters}{\stepcounter{equation}\setcounter{subequation}{1}}{\par}}{}
              \@ifundefined{narrowtabular}{\newenvironment{narrowtabular}[3][]{\tabular[#1]{#2}}{\endtabular}}{}
              \endinput
          eptcs.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{eptcs}[2026/09/20 fixloop legacy shim -> article + EPTCS polyfills]
              \LoadClassWithOptions{article}
              % EPTCS frontmatter 面 (真件 1312.0342 抄值, clsfidcen ~35 格):
              % \event/\volume/\anno/\eid/\titlerunning/\authorrunning/
              % \publicationstatus/\copyrightholders 全 0 参文本 holder —
              % 稿 \renewcommand/\def 覆盖即出版信息
              \providecommand{\event}{}
              \providecommand{\volume}{??}
              \providecommand{\anno}{20??}
              \providecommand{\eid}{??}
              \providecommand{\titlerunning}{Please define {\tt \string\titlerunning}}
              \providecommand{\authorrunning}{Please define {\tt \string\authorrunning}}
              \providecommand{\publicationstatus}{}
              \providecommand{\copyrightholders}{\authorrunning}
              % \firstpage 是 counter 非 cs (真件 :207 verbatim)
              \@ifundefined{c@firstpage}{\newcounter{firstpage}\setcounter{firstpage}{1}}{}
              % \institute/\email 打印形 (真件 :188-192 verbatim)
              \providecommand{\institute}[1]{\\{\scriptsize\begin{tabular}[t]{@{\footnotesize}c@{}}#1\end{tabular}}}
              \providecommand{\email}[1]{\\{\footnotesize\tt #1}}
              \endinput
          # JINST 升级版 (1e scout-modec-resid 实测 1306.0302 xelatex
          # 16pp/0err/0miss): JINST 语义 = \begin{document} 自动出标题块
          # (稿内无 \maketitle) → abstract/keywords stash + AtBeginDocument
          # 释放; \email/\acknowledgments/\arxiv/\proceeding/\notoc 宏面。
          JINST.cls:
            needs: ["graphicx.sty", "hyperref.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{JINST}[2026/09/16 fixloop legacy shim -> article + JINST polyfills]
              \LoadClassWithOptions{article}
              \RequirePackage{graphicx}
              \RequirePackage{hyperref}
              \providecommand{\email}[1]{\href{mailto:#1}{\texttt{#1}}}
              \def\JINST@abstract{}
              \def\JINST@keywords{}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\gdef\JINST@abstract{#1}}
              \providecommand{\keywords}[1]{\gdef\JINST@keywords{#1}}
              \providecommand{\acknowledgments}{\section*{Acknowledgments}}
              \providecommand{\arxiv}[1]{\href{https://arxiv.org/abs/#1}{arXiv:#1}}
              \providecommand{\proceeding}[1]{}
              \providecommand{\notoc}[1]{}
              % clsfidcen 补面 (JINST ~2 格 + 高频 arxiv-abbrev 族; 真件
              % 2306.00097 抄形): \preprint 存值 AtBeginDocument 吐;
              % \nuclex/\physics/\quantph/\jinst 等档号宏 = \href 打印面
              % (hyperref 已载 —— \href 不补, 普查项是误报)
              \providecommand{\preprint}[1]{\long\gdef\@preprint{#1}}
              \providecommand{\nuclex}[1]{\href{https://arxiv.org/abs/nucl-ex/#1}{\tt nucl-ex/#1}}
              \providecommand{\nuclth}[1]{\href{https://arxiv.org/abs/nucl-th/#1}{\tt nucl-th/#1}}
              \providecommand{\physics}[1]{\href{https://arxiv.org/abs/physics/#1}{\tt physics/#1}}
              \providecommand{\quantph}[1]{\href{https://arxiv.org/abs/quant-ph/#1}{\tt quant-ph/#1}}
              \providecommand{\jinst}[1]{\href{https://arxiv.org/abs/#1}{\tt #1}}
              \providecommand{\hepth}[1]{\href{https://arxiv.org/abs/hep-th/#1}{\tt hep-th/#1}}
              \providecommand{\hepph}[1]{\href{https://arxiv.org/abs/hep-ph/#1}{\tt hep-ph/#1}}
              \providecommand{\hepex}[1]{\href{https://arxiv.org/abs/hep-ex/#1}{\tt hep-ex/#1}}
              \providecommand{\heplat}[1]{\href{https://arxiv.org/abs/hep-lat/#1}{\tt hep-lat/#1}}
              \providecommand{\grqc}[1]{\href{https://arxiv.org/abs/gr-qc/#1}{\tt gr-qc/#1}}
              \providecommand{\astroph}[1]{\href{https://arxiv.org/abs/astro-ph/#1}{\tt astro-ph/#1}}
              \providecommand{\condmat}[1]{\href{https://arxiv.org/abs/cond-mat/#1}{\tt cond-mat/#1}}
              \providecommand{\mathph}[1]{\href{https://arxiv.org/abs/math-ph/#1}{\tt math-ph/#1}}
              \providecommand{\qalg}[1]{\href{https://arxiv.org/abs/q-alg/#1}{\tt q-alg/#1}}
              \providecommand{\chaodyn}[1]{\href{https://arxiv.org/abs/chao-dyn/#1}{\tt chao-dyn/#1}}
              \providecommand{\accphys}[1]{\href{https://arxiv.org/abs/accphys/#1}{\tt accphys/#1}}
              \providecommand{\alggeom}[1]{\href{https://arxiv.org/abs/alg-geom/#1}{\tt alg-geom/#1}}
              \providecommand{\dgga}[1]{\href{https://arxiv.org/abs/dg-ga/#1}{\tt dg-ga/#1}}
              \providecommand{\nlinsys}[1]{\href{https://arxiv.org/abs/nlin-sys/#1}{\tt nlin-sys/#1}}
              \providecommand{\solvint}[1]{\href{https://arxiv.org/abs/solv-int/#1}{\tt solv-int/#1}}
              \providecommand{\suprcon}[1]{\href{https://arxiv.org/abs/supr-con/#1}{\tt supr-con/#1}}
              \AtBeginDocument{%
                \ifx\@title\@empty\else\maketitle\fi
                \ifx\JINST@abstract\@empty\else\begin{quotation}\noindent\textbf{Abstract.} \JINST@abstract\end{quotation}\fi
                \ifx\JINST@keywords\@empty\else\par\noindent\textbf{Keywords:} \JINST@keywords\par\fi}
              \endinput
          # PoS.cls (SISSA Proceedings of Science, TL 无): article + 实证
          # frontmatter 面 (1306.5919 随稿签名)——\ShortTitle \speaker
          # \email + \abstract{} 命令形 (PoS 无 env 形, SISSA 惯例; JINST
          # 条已立同形先例)。\abstract 在 preamble 期调用 (:22,
          # \begin{document}:41)——排印件 \AtBeginDocument 包裹双路安全
          # (imsart \arxiv / pasj00 \Received 同构)。
          PoS.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{PoS}[2026/09/19 fixloop legacy shim -> article + PoS polyfills]
              \LoadClassWithOptions{article}
              \RequirePackage{graphicx}
              \providecommand{\ShortTitle}[1]{\gdef\@shorttitle{#1}}
              \providecommand{\speaker}[1]{#1}
              \providecommand{\email}[1]{\texttt{#1}}
              % \FullConference{...} 会议信息块 (:37 preamble 实证)。
              \providecommand{\FullConference}[1]{\AtBeginDocument{\par\noindent{\footnotesize #1}\par}}
              \newenvironment{acknowledgments}{\section*{Acknowledgments}}{\par}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\AtBeginDocument{\par\medskip\noindent\textbf{Abstract.}\space #1\par}}
              % clsfidcen 补面 (PoS ~9 格; 真件 1008.0653 抄形): \href
              % 真件走 dvi-special → 打印第二参降级; \pos = \href 缩写宏
              \providecommand{\href}[2]{#2}
              \providecommand{\pos}[1]{\href{https://pos.sissa.it/#1}{\tt #1}}
              \endinput
          appolb.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{appolb}[2026/09/20 fixloop legacy shim -> article + appolb polyfills]
              \LoadClassWithOptions{article}
              % appolb (Acta Phys. Pol. B) 面 (clsfidcen ~13 格; 真件
              % 2410.17921 抄签名): \eqsec 开 equation 按 section 编号
              % (真件 verbatim 减 \eq@sec 内部 flag); \address/\PACS
              % 即时打印块; \Tr = mathop{\operator@font Tr} → {\rm Tr}
              % 兜底 (无 amsopn); \preprint/\runhead 存值件 noop
              \providecommand{\eqsec}{\def\theequation{\thesection.\@arabic\c@equation}\@addtoreset{equation}{section}}
              \providecommand{\address}[1]{\par\vspace*{6pt}\noindent{\small\rmfamily #1}\par}
              \providecommand{\PACS}[1]{\par\noindent\strut\kern18pt{\footnotesize\rmfamily PACS numbers: #1}\par}
              \providecommand{\Tr}{\mathop{\rm Tr}\nolimits}
              \providecommand{\preprint}[1]{}
              \providecommand{\runhead}[1]{}
              \endinput
          # pasj00.cls (PASJ 老版, TL 无): article + natbib/amssymb/graphicx
          # + 实证 frontmatter 面 (1003.0945 随稿签名)——\DeclareAbbreviation
          # \CS{text} 2 参定义件 (稿 30+ 散调) + 真件内建期刊缩写集
          # (\mnras×11/\apj×8/\pasj×8/\aap×8/\aj/\pasp/\aaps/\qjras/\iaucirc,
          # providecommand 让稿内 \DeclareAbbreviation 可覆盖) +
          # \SetRunningHead/\Received/\Accepted/\KeyWords/\email/\draft +
          # AAS 式 \altaffilmark/\altaffiltext (稿 :86-96) + \FigureFile
          # (w,h){eps} 图件 (:274×5) + \lesssim/\gtrsim (amssymb) + \rm
          # 2.09 字件。排印件一律 \AtBeginDocument 包裹: in-doc 调用立即
          # 执行 (1003.0945 :77-114 全在 \begin{document} 后), preamble
          # 调用延后——双路皆安全。
          pasj00.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{pasj00}[2026/09/19 fixloop legacy shim -> article + pasj00 polyfills]
              \LoadClassWithOptions{article}
              % numbers 模式对 author-year 形与裸形 bibitem 通吃 (aa.cls
              % 同案: 裸 \bibitem{} 回读炸 "not compatible with author-year")。
              \RequirePackage[numbers]{natbib}
              \RequirePackage{amssymb}
              \RequirePackage{graphicx}
              \providecommand{\DeclareAbbreviation}[2]{\providecommand{#1}{#2}}
              \providecommand{\SetRunningHead}[2]{\gdef\@oddhead{\hfil#2\hfil}\gdef\@evenhead{\hfil#1\hfil}}
              \providecommand{\Received}[1]{\AtBeginDocument{\par\noindent{\footnotesize Received #1}\par}}
              \providecommand{\Accepted}[1]{\AtBeginDocument{\par\noindent{\footnotesize accepted #1}\par}}
              \providecommand{\KeyWords}[1]{\AtBeginDocument{\par\noindent\textbf{Key Words:} #1\par}}
              \providecommand{\email}[1]{\texttt{#1}}
              \providecommand{\draft}{}
              \providecommand{\altaffilmark}[1]{\textsuperscript{#1}}
              \providecommand{\altaffiltext}[2]{\AtBeginDocument{\par\textsuperscript{#1}{\footnotesize #2}\par}}
              \def\FigureFile(#1,#2)#3{\includegraphics[width=#1,height=#2]{#3}}
              \DeclareOldFontCommand{\rm}{\normalfont\rmfamily}{\mathrm}
              \providecommand{\aj}{AJ}
              \providecommand{\apj}{ApJ}
              \providecommand{\apjl}{ApJ}
              \providecommand{\apjs}{ApJS}
              \providecommand{\aap}{A\&A}
              \providecommand{\aaps}{A\&AS}
              \providecommand{\mnras}{MNRAS}
              \providecommand{\pasj}{PASJ}
              \providecommand{\pasp}{PASP}
              \providecommand{\qjras}{QJRAS}
              \providecommand{\iaucirc}{IAU~Circ.}
              \providecommand{\nat}{Nature}
              \providecommand{\araa}{ARA\&A}
              \providecommand{\physrep}{Phys.~Rep.}
              \providecommand{\ssr}{Space~Sci.~Rev.}
              \endinput
          # aa501.cls (老 A&A 类名) → aa.cls 桥: aa 替身 stub vendored
          # (TL/AA 均无), needs 预装不成则下轮 missing_file 由
          # vendored_fetch 落 vendor/stubs/aa.cls 件。
