          # SISSA 高能类 (jhep/jcap 作者包, 不在 TL; JHEP.cls/JHEP3.cls 槽
          # 已删 —— vendor/shims 同名替身 stub 在, vendored 先中, 死配置;
          # sissa_body anchor 由存活键 jhep 持锚) —— article +
          # 真 JHEP3.cls 面 (corpus/0806.2278 随稿件): 导言区全收集制
          # (\abstract/\author/\email/\keywords/\preprint/\received/\revised/
          # \accepted/\dedicated/\JHEPspecialurl 皆 PRE 调用 → 存值,
          # \AtBeginDocument 自动 emit —— 真件 \auto@maketitle 同款;
          # 1404.0033 \maketitle 被注释, 显式调用路径靠不住)。
          # \author 单参多调用累积 (\renewcommand 即 \long —— 1404.0033
          # \author 实参含空行, 内核短参 \def 会 Paragraph-ended 炸);
          # \FIGURE/\TABLE/\EPSFIGURE/\TABULAR/\DOUBLEFIGURE/\DOUBLETABLE
          # 是 floatflt 系速记 → 降级成 figure/table/tabular, 强制 [htbp]
          # (稿里 [float]/[v]/[h] 当版式词非法位)。amssymb 是真件依赖
          # (0905.1170/hep-th--0307148 \mathbb + 0408134 \Box 实证)。
          jhep.cls:
            needs: ["amssymb.sty"]
            body: &sissa_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{jhep-family}[2026/09/18 fixloop legacy shim -> article + SISSA polyfills]
              \LoadClassWithOptions{article}
              \RequirePackage{amssymb}
              % 存值位: \let 初始化保证 \ifx\@empty 判定真 (\gdef 短参 store
