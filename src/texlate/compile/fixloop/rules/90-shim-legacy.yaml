          # 9703152 实证可用) —— shim 只在缺文件时点火, 面取 aaspp4 超集:
          # title/author 直排版 (2.09 范式无 \maketitle), \eqsecnum/\tighten
          # 系, mathletters/\eqnum, references 环境, \plotone/\plottwo
          # (epsf 通路), 物理符号 (\sun/\earth/\sq/\la/\ga/\micron/\ion/
          # \fd-\fs/\fdg/\farcm/\farcs/\fp/\case/\slantfrac 系/\ubvr 系/
          # \nodata/\phd/\phm/\nextline) 与扩充期刊缩写表 —— 全移植自
          # vendored AASPP4.STY 原文。\RequirePackage{amssymb} 取代
          # vendored \def\lesssim/\gtrsim 版 (与 amssym shim 的 undef 闸
          # 同策, 免撞 \newcommand)。
          apjprepr.sty:
            needs: ["amssymb.sty", "epsf.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{apjprepr}[2026/09/17 fixloop legacy shim]
              \DeclareOption*{}
              \ProcessOptions\relax
              \RequirePackage{amssymb}
              \@ifundefined{epsfbox}{\RequirePackage{epsf}}{}
              \def\slugcomment#1{}
              \def\received#1{}
              \def\accepted#1{}
              \def\journalid#1#2{}
              \def\articleid#1#2{}
              \def\notetoeditor#1{}
              \def\lefthead#1{}
              \def\righthead#1{}
              \def\keywords#1{}
              \def\subjectheadings#1{}
              \def\acknowledgments{\section*{Acknowledgments}}
              \let\acknowledgements=\acknowledgments
              \def\altaffilmark#1{\textsuperscript{#1}}
              \def\altaffiltext#1#2{\par\medskip\noindent\textsuperscript{#1}\,#2\par}
              \def\title#1{\begin{center}\large\bfseries#1\end{center}}
              \def\author#1{\begin{center}\normalsize#1\end{center}}
              \let\authoraddr=\@gobble
              \let\authoremail=\@gobble
              \def\affil#1{\begin{center}#1\end{center}}
              \def\and{\begin{center}and\end{center}}
              \def\sluginfo{}
              \let\dates=\sluginfo
              \def\eqsecnum{\@addtoreset{equation}{section}%
              \def\theequation{\thesection-\arabic{equation}}}
