              \newenvironment{leqnarray}{\begin{eqnarray}}{\end{eqnarray}}
              \endinput
          # sn-jnl.cls: Springer Nature 投稿类 (2604.04274 \documentclass
          # [sn-basic,pdflatex]{sn-jnl}, journal-shipped 非 CTAN/TL) ——
          # article 底 + sn frontmatter 面: \title[短]{长} opt 宽容;
          # \author[*][编号]{名} 星号+可选参双宽容累进 \@author; \affil
          # [*][编号]{org 件} 星号吞弃/\abstract{文}/\keywords{文} 累进
          # → \maketitle
          # 后放出, emit 清位 + AtEndDocument 兜底扫残 (preamble/正文
          # 任意调用序不丢内容); \fnm/\sur/\orgdiv/\orgname/\orgaddress/
          # \city/\postcode/\country 参文直印。
          sn-jnl.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{sn-jnl}[2026/09/20 fixloop legacy shim -> article + sn-jnl surface]
              \LoadClassWithOptions{article}
              \RequirePackage{natbib} % sn-jnl 引用面 (\citep 2604.04274 实证)
              \RequirePackage{hyperref} % \phantomsection/\url 面 (2604.04274 \manualsectionlabel 实证)
              \renewcommand{\title}{\@ifnextchar[{\snj@title@o}{\snj@title@p}}
              \def\snj@title@o[#1]#2{\gdef\@title{#2}}
              \def\snj@title@p#1{\gdef\@title{#1}}
              \gdef\@author{}
              \renewcommand{\author}{\@ifstar{\snj@author@s}{\snj@author@n}}
              \def\snj@author@s{\@ifnextchar[{\snj@author@so}{\snj@author@sp}}
              \long\def\snj@author@so[#1]#2{\snj@addauthor{#2}}
              \long\def\snj@author@sp#1{\snj@addauthor{#1}}
              \def\snj@author@n{\@ifnextchar[{\snj@author@no}{\snj@author@np}}
              \long\def\snj@author@no[#1]#2{\snj@addauthor{#2}}
              \long\def\snj@author@np#1{\snj@addauthor{#1}}
              \long\def\snj@addauthor#1{%
                \ifx\@author\@empty\gdef\@author{#1}%
                \else\g@addto@macro\@author{\and #1}\fi}
              \def\snj@affils{}
              \providecommand{\affil}{\@ifstar{\snj@affil@x}{\snj@affil@x}}
              \def\snj@affil@x{\@ifnextchar[{\snj@affil@o}{\snj@affil@p}}
              \long\def\snj@affil@o[#1]#2{\snj@addaffil{#2}}
              \long\def\snj@affil@p#1{\snj@addaffil{#1}}
              \long\def\snj@addaffil#1{%
                \ifx\snj@affils\@empty\gdef\snj@affils{#1}%
                \else\g@addto@macro\snj@affils{\par #1}\fi}
              \def\snj@abstract{}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\gdef\snj@abstract{#1}}
              \def\snj@keywords{}
              \providecommand{\keywords}[1]{\gdef\snj@keywords{#1}}
              \providecommand{\fnm}[1]{#1}
              \providecommand{\sur}[1]{#1}
              \providecommand{\orgdiv}[1]{#1}
              \providecommand{\orgname}[1]{#1}
              \providecommand{\orgaddress}[1]{#1}
              \providecommand{\city}[1]{#1}
              \providecommand{\postcode}[1]{#1}
              \providecommand{\country}[1]{#1}
              \def\snj@emitfront{%
                \ifx\snj@affils\@empty\else
                  \par{\footnotesize\snj@affils\par}\global\let\snj@affils\@empty\fi
                \ifx\snj@abstract\@empty\else
                  \begin{quotation}\noindent\textbf{Abstract.} \snj@abstract
                  \end{quotation}\global\let\snj@abstract\@empty\fi
                \ifx\snj@keywords\@empty\else
                  \par\noindent\textbf{Keywords:} \snj@keywords\par
                  \global\let\snj@keywords\@empty\fi}
              \let\snj@maketitle\maketitle
              \renewcommand{\maketitle}{\snj@maketitle\snj@emitfront}
              \AtEndDocument{\snj@emitfront}
              \endinput
          # mncite.sty: MNRAS 引用伴船件 (0712.0823 \usepackage{mncite};
          # 稿 \citep 已由 vendored shims/mn2e.cls usenatbib 解) —— noop
          # + cite 别名 provide 作无 natbib 路径兜底。
          mncite.sty:
            body: |
