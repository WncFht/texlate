          # [epsfig]{ichep}) —— article 底 + 三件面: \affil 累进;
          # \abstract{...} 单参命令形 (article 已定义 env-begin 同名
          # → 须 provide+renew, 否则 {参} 入 env-begin 排版且 env 不
          # 闭合炸 \@checkend); \fnm{N}{t} 显式脚注号 → superscript+
          # footnote 双件 (\@maketitle 内 \let\footnote\thanks 不吃可
          # 选参, 直传 [#1] 会留 `1]t` 残文); 累进件于 \maketitle
          # 后放出 (preamble/正文两序通吃)。
          ichep.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{ichep}[2026/09/20 fixloop legacy shim -> article + ICHEP94 surface]
              \LoadClassWithOptions{article}
              \def\ich@affils{}
              \def\ich@abstract{}
              \providecommand{\affil}[1]{\g@addto@macro\ich@affils{\par #1}}
              \providecommand{\abstract}{}
