          # Springer svjour 系 (期刊模板外发, 不在 TL): article 底 + 文档化
          # 宏面 polyfill (\journalname/\titlerunning/\institute/\keywords/
          # \pacs/\communicated/\dedication/\mail/\offprints/\subclass)。
          svjour3.cls:
            body: &svjour_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{svjour3}[2026/09/16 fixloop legacy shim -> article + svjour polyfills]
              \LoadClassWithOptions{article}
              \providecommand{\journalname}[1]{}
              \providecommand{\titlerunning}[1]{}
              \providecommand{\authorrunning}[1]{}
              \providecommand{\institute}[1]{}
              \providecommand{\date}[1]{}
              \providecommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              \providecommand{\subclass}[1]{}
              \providecommand{\pacs}[1]{\par\noindent\textbf{PACS:} #1\par}
              % \PACS/\MSC 大写形 (svjour2 腔, 1206.5684 undef_cs:\PACS 实证);
              % \and 分隔多码 → \quad 驯化
              \providecommand{\PACS}[1]{{\let\and\quad\par\noindent\textbf{PACS:} #1\par}}
              \providecommand{\MSC}[1]{{\let\and\quad\par\noindent\textbf{MSC:} #1\par}}
              \providecommand{\communicated}[1]{}
              \providecommand{\dedication}[1]{}
              \providecommand{\mail}[1]{}
              \providecommand{\offprints}[1]{}
              \endinput
          svjour2.cls: { body: *svjour_body }
          # EPL epl2.cls (Europhysics Letters, 期刊外发): 旧体 \abstract/
          # \pacs/\institute 即时排版 → 导言区调用 no_begindoc (0905.1214
          # 双格实证)。全真件 epl2.cls 结构 (corpus_v3/1206.2258 随稿):
          # PRE 收集制 (\abstract/\pacs/\institute 存值, \maketitle 吐),
          # bbl-struct 宏族抄真件 L1312-1344 (\Name/\Review/\REVIEW/\Book/
          # \Publ/\Vol/\Year/\Page/\Pages/\Editor/\Section/\SAME +
          # \ifepl@book 条件 + bibitem 前置钩), acknowledgments 环境 +
          # \acknowledgments/\acknowledgements/\stars cs 形,
          # \shrinkacknowledgments/\enlargeacknowledgments 旋钮 noop。
          # \and 在 \Name 实参内 → \Name 组内局部重绑防 \crcr 坍塌。
          epl2.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{epl2}[2026/09/18 fixloop legacy shim -> article + epl polyfills]
              \LoadClassWithOptions{article}
              % ── frontmatter 存值 (PRE 调用, \maketitle 包装吐) ──
              \let\epl@abstract\@empty
              \let\epl@inst\@empty
              \def\epl@pacs{}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\gdef\epl@abstract{#1}}
              \providecommand{\institute}[1]{\gdef\epl@inst{#1}}
              \providecommand{\pacs}[2]{\g@addto@macro\epl@pacs{\par\noindent\textbf{PACS:} #1\quad #2\par}}
              \providecommand{\inst}[1]{\textsuperscript{#1}}
              \providecommand{\shorttitle}[1]{}
              \providecommand{\shortauthor}[1]{}
              \providecommand{\shortinstitute}[1]{}
              \providecommand{\email}[1]{\texttt{#1}}
              \let\epl@mk\maketitle
              \renewcommand{\maketitle}{\epl@mk
                \ifx\epl@inst\@empty\else\par\noindent{\small\epl@inst}\par\fi
                \ifx\epl@abstract\@empty\else\begin{quote}\textbf{Abstract.}---\enspace\epl@abstract\end{quote}\fi
                \epl@pacs}
              % ── acknowledgments 双形: \newenvironment 的 begin 段即
              % 排版体 —— 裸 \acknowledgments 调用与 \begin{...} 环境
              % 两形通吃 (0905.1214 cs 形 / 1003.0792 env 形实证)。
              % \stars 真件里是 \acknowledgments 别名。
              \newenvironment{acknowledgments}{\par\medskip\noindent\textbf{Acknowledgments.}\space}{\par}
              \newenvironment{acknowledgements}{\par\medskip\noindent\textbf{Acknowledgements.}\space}{\par}
              \providecommand{\stars}{\par\medskip\noindent\textbf{Acknowledgments.}\space}
              \providecommand{\shrinkacknowledgments}[1]{}
              \providecommand{\enlargeacknowledgments}[1]{}
              % ── bbl-struct 宏族 (真件抄值): \bibitem 前置复位 + \ifepl@book ──
              \newif\ifepl@book\epl@bookfalse
              \newif\ifepl@gotand\epl@gotandfalse
              \let\epl@org@bibitem\bibitem
              \def\bibitem{\epl@bookfalse\epl@org@bibitem}
              \providecommand{\Name}[1]{{\let\and\epl@and\scshape #1},}
              \providecommand{\Review}[1]{\epl@bookfalse{\itshape #1},}
              \providecommand{\REVIEW}[4]{\Review{#1} \Vol{#2} \Year{#3} \Page{#4}}
              \providecommand{\Book}[1]{\epl@booktrue{\itshape #1}}
              \providecommand{\Vol}[1]{\ifepl@book\else{\bfseries #1}\fi}
              \providecommand{\Year}[1]{\ifepl@book\else(#1)\fi}
              \providecommand{\Page}[1]{\ifepl@book\else p.~#1\fi}
              \providecommand{\Pages}[1]{\ifepl@book\else pp.~#1\fi}
              \providecommand{\Publ}[1]{\ifepl@book\unskip\ \fi{\normalfont(#1)}}
              \providecommand{\Editor}[1]{\epl@gotandfalse{\let\and\epl@and\normalfont #1}, ed.}
              \providecommand{\Section}[1]{#1}
              \providecommand{\SAME}[3]{}
              \def\epl@and{\unskip\ and\ }
              \let\And\and
              \endinput
          # IMS imsart.cls (TL 无): article 底 + frontmatter 常用件 +
          # 结构 env 面 (1003.1513 随稿签名 :10-52): frontmatter 包裹
          # \title/aug/abstract/keyword 整块, env 尾触 \maketitle (稿内
          # 无 \maketitle 调用); aug=author-group noop; keyword env noop
          # + \kwd 并入 \imsart@keywords 存值 frontmatter 尾释放;
          # \address 单参 (稿 :29 实证) 非旧稿 2 参形; \printead{e1,u1}
          # 是 \email 标签引用件, noop。排印件 \AtBeginDocument 包裹
          # 双路安全 (\arxiv preamble :6 调用实证)。
          imsart.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{imsart}[2026/09/16 fixloop legacy shim -> article + imsart polyfills]
              \LoadClassWithOptions{article}
              \providecommand{\thankstext}[2]{}
              \providecommand{\affiliation}[1]{}
              \providecommand{\address}[1]{{\footnotesize #1\par}}
              \providecommand{\runtitle}[1]{}
              \providecommand{\runauthor}[1]{}
              \providecommand{\printead}[1]{}
              % \ead[label=k]{addr} imsart 键标 email 件 (\author 内 :20-21 实证)。
              \providecommand{\ead}[2][]{\texttt{#2}}
              \providecommand{\arxiv}[1]{\AtBeginDocument{\par\noindent{\footnotesize arXiv:#1}\par}}
              \providecommand{\thanksref}[1]{\textsuperscript{#1}}
              \def\imsart@keywords{}
              \providecommand{\kwd}[1]{\g@addto@macro\imsart@keywords{#1;\space}}
              \newenvironment{frontmatter}{}{%
                \maketitle
                \ifx\imsart@keywords\@empty\else\par\noindent\textbf{Keywords:} \imsart@keywords\par\fi}
              \newenvironment{aug}{}{}
              \newenvironment{keyword}{}{}
              \endinput
          # ACM conm-p-l.cls (90s 会议 preprint 版式) → acmart 官方继任。
          # 1003.0067 实证: acmart→unicode-math 装载后 \Psi 类希腊字母变
          # \mitPsi chardef —— 稿内 \section{...$\pdo$...} 在 hyperref
          # \pdfstringdef (bookmark) 展开时 `` `\mitPsi `` 炸 "Improper
          # alphabetic constant" + intcalc 级联 → \pdfstringdefDisableCommands
          # 域内把 \pdo 降级成纯文本。
          conm-p-l.cls:
            needs: ["acmart.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{conm-p-l}[2026/09/18 fixloop legacy shim -> acmart]
              \LoadClassWithOptions{acmart}
              \AtBeginDocument{\@ifundefined{pdfstringdefDisableCommands}{}{%
                \pdfstringdefDisableCommands{\def\pdo{PsiDO}}}}
              \endinput
          # JHEP 作者样式、Elsevier espcrc1 —— TL 全数缺席, vendor stub 兜底。
          # (jinstpub/jheppub/espcrc1 槽已删: vendor/stubs/*.sty 真 stub 在,
          #  scan_install vendored 预检先于 missing_file 分类落件, shim_map
          #  永远轮不到此名 —— 死配置; 旧 espcrc1 body 无 \readRCS 复活即回归)
          # ── 2026-09-16 wave-2 (loop2-delta 残盘 ~27 格, 1d scout-unfix 枚举) ──
          # 继任类桥: emulateapj-rtx4 (revtex4 时代变体, 1404.2351 实证),
          # amsart2000 (vintage amsart), nature2 (老 Nature 名) —— 同
          # sig-alternate 先例。
          emulateapj-rtx4.cls:
            { loads: "emulateapj", needs: ["emulateapj.cls"] }
          amsart2000.cls: { loads: "amsart", needs: ["amsart.cls"] }
          nature2.cls: { loads: "nature", needs: ["nature.cls"] }
          # acm_proc_article-sp (2009 时代 ACM 版式, 1306.0281 实证) —— 纯
          # loads 桥只换类壳, 老作者块族 (\titlenote/\alignauthor/\affaddr/
          # \affinst/\additionalauthors) 在 acmart 下语义错配: 原生
          # \titlenote 向 \@title 追加 \footnotemark, 在 \author{} 参内
          # \MakeUppercase→\__text_expand 展开即 \@xfootnotemark 定界参失配
          # + Missing \endcsname 百连 (unfixable:early_eof)。body 套件:
          # \titlenote 无条件 \protected 桥 \thanks (原生定义即炸点),
          # \alignauthor→\par (列起始命令), \affaddr/\affinst→\emph (保文
          # 不污 \addresses), \additionalauthors→\author, abstract 序桥按
          # \@ACM@maketitle@typeset 分路 (late path 不走 Collect@Body),
          # \cal/\mit 复活 (amsart 有意略去, head.tex \cA 族 ~100 调用)。
          # 降级面: 五作者并单条 (列流无法无损重建), 机构 emph 行内保文。
          # 实证/设计: bench/results/fixer-legacy-acm-2026-09-17/。
          acm_proc_article-sp.cls:
            needs: ["acmart.cls"]
            body: "\n\\NeedsTeXFormat{LaTeX2e}\n\\ProvidesClass{acm_proc_article-sp}[2026/09/17 fixloop legacy shim -> acmart + author-block kit]\n\\LoadClassWithOptions{acmart}\n% --- acm_proc_article-sp author-block family under acmart (1306.0281) ---\n% \\alignauthor is a column-starter (no arg, name runs to \\\\) — \\par mirrors\n% the old \"new author column\" break inside the single acmart \\author{} arg.\n\\ifdefined\\alignauthor\\else\\protected\\def\\alignauthor{\\par}\\fi\n% \\affaddr/\\affinst{inst} sit loose inside \\author{} — acmart \\affiliation\n% would corrupt \\addresses there; inline emph keeps the text.\n\\ifdefined\\affaddr\\else\\protected\\def\\affaddr#1{\\emph{#1}}\\fi\n\\ifdefined\\affinst\\else\\protected\\def\\affinst#1{\\emph{#1}}\\fi\n% \\titlenote inside \\author{} executes inside \\MakeUppercase: acmart's\n% native def appends \\footnotemark to \\@title -> \\@xfootnotemark mismatch\n% + Missing \\endcsname storm (100 errs). Override is mandatory — \\protected\n% bridge to \\thanks survives text_expand and lands in the \\thankses strip.\n\\protected\\def\\titlenote#1{\\thanks{#1}}\n% \\additionalauthors{names} top-level -> register as another acmart author.\n\\ifdefined\\additionalauthors\\else\\protected\\long\\def\\additionalauthors#1{\\author{#1}}\\fi\n% \\numberofauthors{N} — acmart auto-counts (cs_table polyfill also covers).\n\\ifdefined\\numberofauthors\\else\\protected\\def\\numberofauthors#1{}\\fi\n% acmart has native \\subtitle — guard only for exotic load paths.\n\\ifdefined\\subtitle\\else\\protected\\def\\subtitle#1{}\\fi\n% Old acm_proc order puts abstract AFTER \\maketitle; acmart \\@saveabstract\n% ClassErrors once \\@ACM@maketitle@typeset. Conditional bridge: pre-maketitle\n% keeps the native Collect@Body stash; post-maketitle typesets the body as a\n% plain labelled block — NO Collect@Body on the late path (its body-scan\n% hijacks \\abstract and cannot tolerate a typesetting callback).\n\\renewenvironment{abstract}{\\if@ACM@maketitle@typeset\\par\\medskip\\noindent{\\bfseries\\abstractname.}\\space\\ignorespaces\\else\\Collect@Body\\@saveabstract\\fi}{\\if@ACM@maketitle@typeset\\par\\medskip\\fi}\n% 2.09 font switches: acmart inherits \\rm\\sf\\tt\\bf\\it\\sl\\sc from\n% amsart (its \\DeclareOldFontCommand block); only \\cal/\\mit are missing\n% (amsart deliberately omits them) — doc \\cA->{\\cal A} family needs them.\n\\ifdefined\\cal\\else\\DeclareOldFontCommand{\\cal}{\\normalfont\\itshape}{\\mathcal}\\fi\n\\ifdefined\\mit\\else\\DeclareOldFontCommand{\\mit}{\\normalfont\\itshape}{\\mathnormal}\\fi\n% ntheorem compat (scout-thmtwin, 1306.0281): the amsthm bridge above\n% leaves \\@begintheorem in three-arg form, but ntheorem loaded WITHOUT\n% the [amsthm] option calls it kernel two-arg — `[` becomes the #2\n% delimiter and the scan swallows to \\par (Paragraph ended x6 + missing\n% \\item x6). Restore item-only defs, double-gated: only when ntheorem\n% loaded, amsthm-option form untouched. \\PassOptionsToPackage{amsthm}\n% {ntheorem} rejected — collides on style/proof/openbox + \\NAT@@citetp.\n\\AtBeginDocument{\\@ifpackageloaded{ntheorem}{%\n  \\def\\@begintheorem#1#2{\\item[\\hskip\\labelsep \\theorem@headerfont #1\\ #2.]}%\n  \\def\\@opargbegintheorem#1#2#3{\\item[\\hskip\\labelsep \\theorem@headerfont #1\\ #2\\ (#3).]}%\n}{}}\n\\endinput\n"
          # TL 全缺席出版商类 → article 桥 (版式降级保内容): svmult
          # (Springer 专著), cimento (Nuovo Cimento), eptcs, JINST, PoS
          # (SISSA), appolb, pasj00, aa501 (A&A), kapproc —— 逐格实证名见
          # REPORT 补记7 delta 残盘表。
          svmult.cls: { loads: "article" }
          # cimento.cls (Nuovo Cimento, TL 无): article + 实证 frontmatter
          # 面 (0905.4620 随稿签名)——\from{key} \inst{key} \instlist{...}
          # \PACSes{...\PACSit{code}{desc}...}。
          cimento.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{cimento}[2026/09/19 fixloop legacy shim -> article + cimento polyfills]
              \LoadClassWithOptions{article}
              \providecommand{\from}[1]{\textsuperscript{#1}}
              \providecommand{\inst}[1]{\textsuperscript{#1}~}
              % \instlist 在 preamble 期调用 (0905.4620 :14, \begin{document}
              % :25); \PACSes 同族 frontmatter 位 (稿内注释态 :16)——排印件
              % 一律 \AtBeginDocument 包裹: preamble 调用延后至 begindoc
              % 合法排印, in-doc 调用 (1003.0945 系 pasj00 签名实证另一路)
              % 在现代 one-time hook 语义下立即执行——两路皆安全, 免存值件。
              \providecommand{\instlist}[1]{\AtBeginDocument{\par\medskip\noindent #1\par}}
              \providecommand{\PACSes}[1]{\AtBeginDocument{\par\noindent\textbf{PACS:} #1\par}}
              \providecommand{\PACSit}[2]{#1\quad #2\par}
              \endinput
          eptcs.cls: { loads: "article" }
          # JINST 升级版 (1e scout-modec-resid 实测 1306.0302 xelatex
          # 16pp/0err/0miss): JINST 语义 = \begin{document} 自动出标题块
          # (稿内无 \maketitle) → abstract/keywords stash + AtBeginDocument
          # 释放; \email/\acknowledgments/\arxiv/\proceeding/\notoc 宏面。
          JINST.cls:
            needs: ["graphicx.sty", "hyperref.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{JINST}[2026/09/16 fixloop legacy shim -> article + JINST polyfills]
              \LoadClassWithOptions{article}
              \RequirePackage{graphicx}
              \RequirePackage{hyperref}
              \providecommand{\email}[1]{\href{mailto:#1}{\texttt{#1}}}
              \def\JINST@abstract{}
              \def\JINST@keywords{}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\gdef\JINST@abstract{#1}}
              \providecommand{\keywords}[1]{\gdef\JINST@keywords{#1}}
              \providecommand{\acknowledgments}{\section*{Acknowledgments}}
              \providecommand{\arxiv}[1]{\href{https://arxiv.org/abs/#1}{arXiv:#1}}
              \providecommand{\proceeding}[1]{}
              \providecommand{\notoc}[1]{}
              \AtBeginDocument{%
                \ifx\@title\@empty\else\maketitle\fi
                \ifx\JINST@abstract\@empty\else\begin{quotation}\noindent\textbf{Abstract.} \JINST@abstract\end{quotation}\fi
                \ifx\JINST@keywords\@empty\else\par\noindent\textbf{Keywords:} \JINST@keywords\par\fi}
              \endinput
          # PoS.cls (SISSA Proceedings of Science, TL 无): article + 实证
          # frontmatter 面 (1306.5919 随稿签名)——\ShortTitle \speaker
          # \email + \abstract{} 命令形 (PoS 无 env 形, SISSA 惯例; JINST
          # 条已立同形先例)。\abstract 在 preamble 期调用 (:22,
          # \begin{document}:41)——排印件 \AtBeginDocument 包裹双路安全
          # (imsart \arxiv / pasj00 \Received 同构)。
          PoS.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{PoS}[2026/09/19 fixloop legacy shim -> article + PoS polyfills]
              \LoadClassWithOptions{article}
              \RequirePackage{graphicx}
              \providecommand{\ShortTitle}[1]{\gdef\@shorttitle{#1}}
              \providecommand{\speaker}[1]{#1}
              \providecommand{\email}[1]{\texttt{#1}}
              % \FullConference{...} 会议信息块 (:37 preamble 实证)。
              \providecommand{\FullConference}[1]{\AtBeginDocument{\par\noindent{\footnotesize #1}\par}}
              \newenvironment{acknowledgments}{\section*{Acknowledgments}}{\par}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\AtBeginDocument{\par\medskip\noindent\textbf{Abstract.}\space #1\par}}
              \endinput
          appolb.cls: { loads: "article" }
          # pasj00.cls (PASJ 老版, TL 无): article + natbib/amssymb/graphicx
          # + 实证 frontmatter 面 (1003.0945 随稿签名)——\DeclareAbbreviation
          # \CS{text} 2 参定义件 (稿 30+ 散调) + 真件内建期刊缩写集
          # (\mnras×11/\apj×8/\pasj×8/\aap×8/\aj/\pasp/\aaps/\qjras/\iaucirc,
          # providecommand 让稿内 \DeclareAbbreviation 可覆盖) +
          # \SetRunningHead/\Received/\Accepted/\KeyWords/\email/\draft +
          # AAS 式 \altaffilmark/\altaffiltext (稿 :86-96) + \FigureFile
          # (w,h){eps} 图件 (:274×5) + \lesssim/\gtrsim (amssymb) + \rm
          # 2.09 字件。排印件一律 \AtBeginDocument 包裹: in-doc 调用立即
          # 执行 (1003.0945 :77-114 全在 \begin{document} 后), preamble
          # 调用延后——双路皆安全。
          pasj00.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{pasj00}[2026/09/19 fixloop legacy shim -> article + pasj00 polyfills]
              \LoadClassWithOptions{article}
              % numbers 模式对 author-year 形与裸形 bibitem 通吃 (aa.cls
              % 同案: 裸 \bibitem{} 回读炸 "not compatible with author-year")。
              \RequirePackage[numbers]{natbib}
              \RequirePackage{amssymb}
              \RequirePackage{graphicx}
              \providecommand{\DeclareAbbreviation}[2]{\providecommand{#1}{#2}}
              \providecommand{\SetRunningHead}[2]{\gdef\@oddhead{\hfil#2\hfil}\gdef\@evenhead{\hfil#1\hfil}}
              \providecommand{\Received}[1]{\AtBeginDocument{\par\noindent{\footnotesize Received #1}\par}}
              \providecommand{\Accepted}[1]{\AtBeginDocument{\par\noindent{\footnotesize accepted #1}\par}}
              \providecommand{\KeyWords}[1]{\AtBeginDocument{\par\noindent\textbf{Key Words:} #1\par}}
              \providecommand{\email}[1]{\texttt{#1}}
              \providecommand{\draft}{}
              \providecommand{\altaffilmark}[1]{\textsuperscript{#1}}
              \providecommand{\altaffiltext}[2]{\AtBeginDocument{\par\textsuperscript{#1}{\footnotesize #2}\par}}
              \def\FigureFile(#1,#2)#3{\includegraphics[width=#1,height=#2]{#3}}
              \DeclareOldFontCommand{\rm}{\normalfont\rmfamily}{\mathrm}
              \providecommand{\aj}{AJ}
              \providecommand{\apj}{ApJ}
              \providecommand{\apjl}{ApJ}
              \providecommand{\apjs}{ApJS}
              \providecommand{\aap}{A\&A}
              \providecommand{\aaps}{A\&AS}
              \providecommand{\mnras}{MNRAS}
              \providecommand{\pasj}{PASJ}
              \providecommand{\pasp}{PASP}
              \providecommand{\qjras}{QJRAS}
              \providecommand{\iaucirc}{IAU~Circ.}
              \providecommand{\nat}{Nature}
              \providecommand{\araa}{ARA\&A}
              \providecommand{\physrep}{Phys.~Rep.}
              \providecommand{\ssr}{Space~Sci.~Rev.}
              \endinput
          # aa501.cls (老 A&A 类名) → aa.cls 桥: aa shim 同仓 shim_map
          # 在条 (TL/AA 均无), needs 预装不成则下轮 missing_file 兜 shim。
          # astro-ph/0104346 实证: article 底缺 \offprints 等 A&A 面;
          # 0104007 同构仿真 0err/18pp。
          aa501.cls: { loads: "aa", needs: ["aa.cls"] }
          kapproc.cls: { loads: "article" }
          # multind 两参 \index{name}{entry} —— noop 必须吞双参, 否则第二参
          # 泄进正文 (0806.3028 实证用法)。
          multind.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{multind}[2026/09/16 fixloop stub -> two-arg index swallow]
              \providecommand{\makeindex}[1]{}
              \renewcommand{\index}[2]{}
              \providecommand{\printindex}[2]{}
              \endinput
          # ams.sty 老 AMS 捆名 ([defs] 选项) → amsmath+amssymb 桥。
          ams.sty:
            needs: ["amsmath.sty", "amssymb.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{ams}[2026/09/16 fixloop shim -> amsmath/amssymb]
              \DeclareOption*{}
              \ProcessOptions\relax
              \RequirePackage{amsmath}
              \RequirePackage{amssymb}
              \endinput
          # widetext 唯一宏面 = widetext 环境 (跨栏宽公式); 1706.02511 未显式
          # 用仍保底定义。
          widetext.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{widetext}[2026/09/16 fixloop stub - widetext env]
              \newenvironment{widetext}{}{}
              \endinput
          # 纯 noop .sty: numcompress (elsarticle 引文压缩件, sort&compress
          # 已由 natbib 担), ol2/docs (私名件), sw20lart (Scientific Word),
          # xetex-inputenc (luainputenc 链内引用, xelatex 原生 UTF-8 免),
          # umlaut/isolatin1 (化石编码件), llncsdoc (llncs 文档样式)。
          numcompress.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{numcompress}[2026/09/16 fixloop noop stub - elsarticle cite-compress kit]
              \endinput
          ol2.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{ol2}[2026/09/16 fixloop noop stub - not in TL]
              \endinput
          docs.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{docs}[2026/09/16 fixloop noop stub - not in TL]
              \endinput
          sw20lart.sty:
