# rules/20-warnings.yaml — log 红线 warning 扫描表（redlines.py 注册表
# ``rules`` 切片的镜像面，逐条 (id, pattern) 序由 tests/compile/test_redlines.py pin）
version: 1

# ────────────────────────────────────────────────────────────────
# log 尾部红线 warning 扫描 (docs/spec/compile.md): 只记录进 cell.warnings,
# 其中 invalid_utf8 在无 '!' 错时升级为 warn_utf8 类别驱动修复轮。
# ────────────────────────────────────────────────────────────────
warnings:
  - {
      id: invalid_utf8,
      pattern: "Invalid UTF-8 byte|Missing character.*U\\+FFFD|replaced by U\\+FFFD",
    }
  # missing_char 排除 nullfont 行: 测量盒/\write 上下文按设计不可印
  # (scout-misschar ×5 pids 纯噪音)。tempered 窗口限本消息体内——不越过
  # 下一条 Missing character 起点与本消息 in font 终止符，至多跨一个
  # 折行续行——真字体行紧邻 nullfont 行仍中，已声明字体的消息不被后行
  # "in font nullfont" 字样误豁免。
  - {
      id: missing_char,
      pattern: "Missing character:(?!(?:(?!Missing character|in font )[^\\n]){0,90}?(?:\\n(?:(?!Missing character|in font )[^\\n]){0,90}?)?in font nullfont)",
    } # CJK 渲染检查原料
  - {
      id: missing_graphic,
      pattern: "File `[^']+\\.(eps|png|jpg|pdf)' not found|cannot (find|open) image",
    }
  - { id: tectonic_degrade, pattern: "^!+ .*not found" } # tectonic File..not found 降级行
  # 版面缺陷的 log 面签名 (qc layout:* 同源) —— rules-only 红线条目
  # (redlines.py overfull_hbox/float_too_large 行注): 无 '!' 错时升
  # warn_overfull/warn_float_big 伪类别驱修复轮，不进 engine 判红面。
  - { id: overfull_hbox, pattern: "Overfull \\\\hbox" } # qc layout:overfull 探针
  - { id: float_too_large, pattern: "Float too large for page" } # qc layout:float_lost/float_fit 探针
  # ── 2026-09-28 qc-impl (vault QC replay 诊断蒸馏 impl-rules.json) ──
  # undef_ref_warn: Reference/Citation/Label undefined 警告 + 'There were
  #   undefined references' 尾标 → warn_undef_ref 伪类别 (10-taxonomy),
  #   消费臂 = 80-bib.yaml pagerange/endlabel 注入族 + bbl_cite_undef_regen。
  #   首遍噪音由引擎 _resolve_tail 出货前解析趟吸收 (aux 已播种 + marks
  #   命中即自适应补趟); 本 id 只在末遍编译 log 仍报 undefined 时点火。
  #   redlines.py REDLINES 镜像行由该表属主同步 (mirror pin 测试).
  - {
      id: undef_ref_warn,
      pattern: "LaTeX Warning: (Reference|Citation|Label).{0,80}undefined|There were undefined references",
    }
  # bbl_version: biblatex 'File X.bbl is wrong format version' 警告 →
  #   warn_bbl_version → bbl_version_regen (80-bib order 158.5)。
  #   warning-only 稿无 '!' 行，原 bbl_regen 的 undefined_cs 门永不命中。
  - { id: bbl_version, pattern: "is wrong format version" }
  # overfull_vbox: Overfull \vbox → 10-taxonomy 别名行复用 warn_overfull
  #   类别 (tabular/math/display/gfx 各消费臂自门谓词; 专属 vbox 臂
  #   vbox_geometry_clamp builtin 未注册，落地后可拆伪类别)。
  - { id: overfull_vbox, pattern: "Overfull \\\\vbox" }
