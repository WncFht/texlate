# rules/65-encoding.yaml — fixloop 规则库分片：编码 —— inputenc/非 UTF-8 源/aux 中间件腐蚀
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # 新增 (2026-09-16, compilebench-v3 失败构成): inputenc 对 Unicode 引擎
  # 整包拒载 → 剥装载点 + \inputencoding 调用。源真为非 UTF-8 时下一轮
  # 由 non_utf8_source(95) 接续转码 —— 两轮分工, 本轮只动声明。
  - id: inputenc_strip
    mechanisms: [B02, W10, W13]
    description: "inputenc 拒绝 xetex/luatex → 剥 \\usepackage{inputenc} 装载点与 \\inputencoding 调用"
    phase: loop
    order: 94
    when: { category: inputenc_unicode }
    action:
      kind: builtin_transform
      function: strip_inputenc
      params: { exts: [.tex, .sty, .cls] }
    risk: low # 只剥 Unicode 引擎下必拒载的包; 列表装载外科摘除不波及同列包
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1012.1124/1206.5628/1608.02354/2308.04174 (compilebench-v3)",
          error: "Package inputenc Error: inputenc is not designed for xetex or luatex",
        }
    # 2026-09-16 fixloop-rules 实跑 (5 篇 xelatex 格): fires=5 → clean×3
    # (1012.1124/1206.5832/1608.02354) + best_effort_pdf×2 (1206.5628/2308.04174);
    # tectonic 格全部死于 tlextras-2022 pin bundle os error 2 (环境), 与本规则无关
    stats: { fires: 7, rescued_cells: 5, status: validated }
    source_ref: "handoff-2026-09-15 §2.2; compilebench-v3 失败构成"

  # 新增 (docs/08:272): xelatex 对非 UTF-8 源静默出 U+FFFD —— warning 驱动轮
  - id: non_utf8_source
    mechanisms: [B02, W72, W13]
    description: "xelatex 静默 U+FFFD (latin-5 等非 UTF-8 源) → 就地转码 UTF-8"
    phase: loop
    order: 95
    when: { category: warn_utf8 } # warnings 段 invalid_utf8 命中升级的伪类别
    condition: { engine_in: [xelatex] }
    action:
      kind: builtin_transform
      function: non_utf8_recode # 逐文件 utf-8 解码失败 → cp1252/latin-1 重读重写
      params: { exts: [.tex, .sty, .cls, .bib] }
    risk: medium # 转码错判会毁源码; 只对真 decode-fail 文件动刀
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "非 UTF-8 语料 (docs/spec/compile.md 路由表)",
          error: "Invalid UTF-8 byte / U+FFFD 静默",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/spec/compile.md L221, L272"

  # 2026-09-16 compile-hard 新增 (2211.13013 闭环·引擎自产臂): aux_scan_eof
  # 命中 → 删「utf-8 解码失败 或 末行不完整」的 aux 族可再生件, 下遍
  # 引擎重生成; shipped 件归 normalize.INTERMEDIATE_SUFFIXES 转码兜底。
  # 2026-09-20 scaneof 扩臂 (m1k aux-malformed 簇 11 singles): 同根
  # (截断/错配 aux) 三签名面 —— (a) aux_scan_eof 原面; (b) runaway_scan
  # 读端 cs 落 aux 书写族 (aux 被截/旧 arity 错配, TeX 回读扫到尾行宏);
  # (c) undefined_cs 站点直落 *.aux:N (行界齐整但写端遗迹错配 ——
  # 损坏谓词放行的健康字节形, 由 payload 锚定内容删补)。condition.any
  # 三臂各复述签名实形, (a) 臂与 taxonomy 读端 pattern 同串 → 对
  # aux_scan_eof 恒真, 原覆盖面零回归。
  - id: aux_purge_regen
    description: "aux 族回读 EOF/读端 cs 崩 (中间件被劈断或写端错配) → 删除损坏可再生件后重跑"
    phase: loop
    order: 96
    when:
      any:
        - { category: aux_scan_eof }
        - { category: runaway_scan, payload_required: true }
        - { category: undefined_cs, payload_required: true }
    condition:
      any:
        # (a) aux_scan_eof: taxonomy 读端 pattern 复述 —— 对该 cat 恒真
        - { ctx_suggests: "File ended while scanning use of \\\\?@?(newl@?bel|writefile|contentsline)" }
        # (b) runaway_scan 读端 = aux 书写族 cs (含 \\@writefile 直引)
        # 2026-09-20 singbun: +redactcite (2606.18573 指派; 该格实为 doc 级
        # 未闭合 \\redactcite{ 非 aux 回读 —— 健康 aux 上 builtin decline,
        # 表列名补全语义一致族, 真修见 75-syntax redactcite_brace_close)
        - {
            ctx_suggests: "scanning use of \\\\((abx|blx|zref|oddpage|abspage|lastpage|NAT|hyper)@[A-Za-z@]*|bibcite|citation|bibdata|bibstyle|newlabel|@writefile|@input|pgfsyspdfmark|redactcite)",
          }
        # (c) undefined_cs 站点直落 .aux 行 (file:NN 误差行锚定)
        - { ctx_suggests: "\\.aux:\\d+: Undefined control sequence" }
    action:
      kind: builtin_transform
      function: purge_corrupt_intermediates
      params:
        {
          exts: [.aux, .out, .toc, .lof, .lot, .nav, .snm, .vrb, .ent],
          # payload 锚定臂: 良好字节形但含错配写端 cs 的 .aux —— 仅机械族
          # cs 放行 (bibcite/newlabel 类通用件不入, 防误删健康/xr 外链 aux)
          payload_purge_cs: "^(abx|blx|zref|oddpage|abspage|lastpage|NAT|hyper)@[A-Za-z@]*$",
          payload_purge_exts: [.aux],
        }
    risk: low # 谓词自检损坏才删 + payload 白名单锚定; 健康件 (xr 外链 aux) 保留
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2211.13013 (aux-cjk-truncation 留档)",
          error: "Invalid UTF-8 byte → File ended while scanning use of \\@newl@bel",
        }
      - {
          corpus: "m1k zh 2503.10110 / zh+base 2510.03388 (scaneof lane)",
          error: "runaway_scan: File ended while scanning use of \\abx@aux@cite / \\bibcite",
        }
      - {
          corpus: "m1k base 2503.10110 (scaneof lane)",
          error: "undefined_cs: root.aux:67: Undefined control sequence (\\abx@* 写端错配)",
        }
    stats: { fires: 2, rescued_cells: 1, status: active }
    source_ref: "docs/research/latex/2026-09-16-aux-cjk-truncation.md; tmp/lane-scaneof/"

  # 2026-09-20 watchimpl cjk-pkg-invalid-char (1607.00157/2601.07372 base 格):
  # taxonomy 把 "Package CJK Error: Invalid character code" 归 invalid_char,
  # 但 recode 臂对两格皆空转 —— 1607 是 GBK 源 (recode 只碰 cp1252/latin-1
  # 孤字节, GBK 整文件 decode-fail 不在其面), 2601 全 UTF-8 (env 内混排
  # 拉丁扩展字符触 CJK 包解码错, 无字节可转)。根修 = 旧 CJK/CJKutf8 包
  # 换装 xeCJK (normalize_legacy_cjk 同径, zh arm 已实证): \begin{CJK*}
  # 族改 {…} 组 + \setCJKmainfont Fandol。source_contains 门把 CJK 稿从
  # 纯字节损坏格分流 —— 无 CJK 标记的 invalid_char 仍落 97 recode。
  - id: cjk_env_relax
    description: "invalid_char 且源载 CJK/CJKutf8 环境 → 旧 CJK 包换装 xeCJK + 环境改组"
    phase: loop
    order: 96.5 # invalid_char_recode(97) 前 —— CJK 稿先走包换装, 纯字节损坏才转码
    when: { category: invalid_char }
    condition:
      source_contains: "\\\\begin\\s*\\{CJK|\\\\usepackage\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*CJK"
    action:
      kind: builtin_transform
      function: cjk_env_relax
      params: { exts: [.tex, .sty, .cls] }
    risk: medium # 包级换装 (CJK→xeCJK+Fandol 字体替换); zh arm 同径已量产
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1607.00157 (singlesweep base 格, GBK 源)",
          error: "Package CJK Error: Invalid character code (\\begin{CJK*}{GB}{gbsn})",
        }
      - {
          corpus: "2601.07372 (singlesweep base 格, UTF-8 源)",
          error: "Package CJK Error: Invalid character code (CJK env 内拉丁扩展字符)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-singlesweep/mech_buckets.json cjk-pkg-invalid-char"

  # 2026-09-16 signature-mining: head 段 "Text line contains an invalid
  # character" (二进制垃圾/非 UTF-8 字节) 与 warn_utf8 同病理 → 复用
  # non_utf8_recode 动作 (cond-mat/0307744 实证, tectonic 格)。
  - id: invalid_char_recode
    mechanisms: [B02, W72]
    description: "invalid_char (源码非法字节) → 就地转码 UTF-8"
    phase: loop
    order: 97
    when: { category: invalid_char }
    action:
      kind: builtin_transform
      function: non_utf8_recode # 与 non_utf8_source 同函数; 仅入口类别不同
      params: { exts: [.tex, .sty, .cls, .bib] }
    risk: medium # 转码错判会毁源码; 只对真 decode-fail 文件动刀
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "cond-mat/0307744 (cbv4 other 拆家)",
          error: "Text line contains an invalid character",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/research/methods/2026-09-16-signature-mining.md §2.2"

  # ── 2026-09-20 lane-nfsstu: nfss_enc 三臂 (xelatex TU 下 legacy NFSS
  # enc 声明族; 0712.1142 / 2609.20339 / 2609.20539 原全归 other|None)。
  # 同 cat 三臂各复述签名实形 ctx_suggests 分流 (aux_purge_regen 同构):
  # (a) ``Command \X unavailable in encoding E`` → 补 ``\DeclareTextCommand
  #     {\X}{E}{body}`` (体表内置, \ensuremath 件两模态通用; 空
  #     \DeclareFontEncoding 实证产 "Corrupted NFSS tables" 不可用);
  # (b) ``Encoding scheme `E' unknown`` → 活 ``\usefont/\fontencoding{E}``
  #     站点改 TU + enc 字形 cs 表 \providecommand polyfill;
  # (c) ``Font family `E+F' unknown`` → ``\DeclareFontFamily{E}{F}{}``
  #     (空 family 合法, fd 文件同款; 与空 enc 声明不同机制)。
  - id: nfss_cmd_enc_polyfill
    description: "Command \\X unavailable in encoding E → docclass 后补 \\DeclareTextCommand{\\X}{E}{body}"
    phase: loop
    order: 98.1
    when: { category: nfss_enc, payload_required: true }
    condition: { ctx_suggests: "unavailable in encoding" }
    action:
      kind: builtin_transform
      function: nfss_cmd_enc_polyfill
    risk: low # 仅补 per-enc 分支声明; 体表外 cs 直 decline 不猜字形
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0712.1142 (stagerun-overnite-2026-09-20 splice)",
          error: "LaTeX Error: Command \\textprime unavailable in encoding TU ×50 (hyperref puenc.def 盖过稿 \\providecommand)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-nfsstu/ (f1d repro: \\ensuremath{'} 体两模态净)"

  - id: nfss_enc_scheme_relax
    description: "Encoding scheme `E' unknown → \\usefont/\\fontencoding{E} 站点改 TU + 字形 cs polyfill"
    phase: loop
    order: 98.2
    when: { category: nfss_enc, payload_required: true }
    condition: { ctx_suggests: "Encoding scheme" }
    action:
      kind: builtin_transform
      function: nfss_enc_scheme_relax
      params: { exts: [.tex, .sty, .cls] }
    risk: low # 站点级 enc 改写 + providecommand 幂等注入; 无活站点 decline
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2609.20339 (soak-2026-09-18 splice)",
          error: "LaTeX Error: Encoding scheme `T2A' unknown ×108 + undefined_cs|\\CYRZH (\\easycyrsymbol \\usefont{T2A} 族)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-nfsstu/ (f2b repro: usefont→TU + \\providecommand{\\CYRZH}{Ж} 净)"

  - id: nfss_fam_declare
    description: "Font family `E+F' unknown → docclass 后补 \\DeclareFontFamily{E}{F}{}"
    phase: loop
    order: 98.3
    when: { category: nfss_enc, payload_required: true }
    condition: { ctx_suggests: "Font family" }
    action:
      kind: builtin_transform
      function: nfss_fam_declare
    risk: low # 空 family 声明合法 (fd 文件同款); payload 非 E+F 形 decline
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2609.20539 (soak-2026-09-18 splice)",
          error: "LaTeX Error: Font family `T1+ptm' unknown (times.sty + \\AtBeginDocument \\DeclareFontShape)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-nfsstu/ (f3 repro: \\DeclareFontFamily{T1}{ptm}{} 净)"
