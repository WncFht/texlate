# rules/00-base.yaml — fixloop 规则库公共段（version/meta/capabilities/filemap）
#
# 2026-09-17 起规则库由单文件 rules.yaml 按域拆为本目录多分片；
# _yamlish.load_yaml 对目录按文件名序逐件装载后顶层段合并（list 拼接、
# map 递归、标量冲突报错）。本文件承载非列表段；rules/taxonomy/warnings
# 各列表段见同目录其余分片。
#
# rules.yaml — fixloop 编译修复规则表 (schema v1.1)
#
# 来源: bench/py/fixloop.py spike (冷 TEXMFHOME, 22 格, 16/16 救回) 的
# 硬编码修复逻辑 → 数据化; 另并入 docs/spec/compile.md 实证缺口回填的 9 条新规则。
# v2 (2026-09-15 corpus_v2 40 篇实测整改): eps_route 由 fileset 静态拒改
# log 确证 (ps_image taxonomy + eps_to_pdf 救回 + 兜底拒); pstricks 独立成
# pstricks_route; legacy_pkg_shim 接住退役包; aastex_bundle_shadow 遮蔽
# tectonic 内置老类 (aastex 5.0rc3); journal_cs_polyfill 补期刊缩写宏;
# undefined_cs payload 改抓 l.N 行末 cs 名; latex209 gate 修行锚定防注释误杀。
# 整改后 tectonic 臂 FAIL→pdf 1/16→12/16, reject 21→10 格, union pdf
# 32→34/40, 零回归。missing_tfm 对账: 全 8 格经 install_tfm 修复、零
# unfixable; astro-ph/0306068 xelatex 的 unfixable:other 实系 wdir 自带
# 化石类 caps.cls (1997 CUP) 手工重实现 tabular 内核 (\hbox\bgroup$ +
# \@tabarray + \ifnum0=`} 技巧) 与 LaTeX2e≥2024 内核不兼容 —— 任意
# \chapter 即炸 "Extra }, or forgotten $.", 可恢复错被 halt-on-error
# 提升为致命; tectonic bundle LaTeX2e 2021 不受影响 → clean。判为正确
# 裁决 (修需改写对方 cls 内核, 无可泛化规则), 留痕备查。
# v3 (2026-09-16): taxonomy +inputenc_unicode (inputenc 拒载 Unicode 引擎)
# +undefined_cs 空 l.N 变体行 (宏/钩展开上下文取末位 cs); syntax 族扩
# Extra }/\\endgroup/\\fi 等组/条件多 token 错; rules +inputenc_strip(94)
# +cs_targeted_fix(165, cs→修复表首版 headerps@out/mathbbm)。
# v4 (2026-09-16 signature-mining 扩列): filemap.overrides +epsf.tex
# /tcilatex.tex (.tex 索引缺席兜底); taxonomy +missing_graphic/+babel_opt/
# +hyperref_driver/+float_opt/+pkg_order/+invalid_char/+expl3_backend
# ("other" 拆家) + ps_image 数字扩展名变体 (metapost); shim_map +mn2e/
# svjour/slashbox/geom/tcilatex/epsf/svglov3; rules +graphic_case_link(17)
# +graphic_repair(18) +invalid_char_recode(97)。同轮 FP 收紧 (fix-engine-fp
# 口径对齐): latex209 head/tail 收真 2.09 签名 (\documentstyle cs/compat-mode
# 横幅/"LaTeX Version 2.09"/"in LaTeX 2.09" 错文; aastex "Original \LaTeX2.09"
# 横幅四案误中实证); source_contains 三处加行锚 (?m)^[ \t]* 防注释误中
# (pstricks_route/pstricks_dvips_preflight/aastex_bundle_shadow, 1803.08846;
# pstricks 包名口径对齐 engine.py _PSTRICKS_RE 元素级)。
# 社区贡献入口 = 新增/修改本文件条目。
#
# 两层结构:
#   taxonomy: log 文本 → (category, payload)      —— "这是什么错"
#   rules:    (category, payload) → 修复动作       —— "怎么修"
# 新增一个修复通常只需在 rules 追加一条 (复用已有 category);
# 只有新错误形态才需要加 taxonomy 行。
#
# 语法约定: pattern/repl 均按 Python re 语义; repl 里 \g<N> 为分组引用;
# action.function 表示该动作是命名内置函数 (算法型, 非纯 regex,
# 注册表在 builtins.py —— 新函数才需要 PR 代码)。
# 书写约束: flow 集合 {..}/[..] 必须单行写完 (子集解析器不跨行)。
#
# 每条规则逐条带注释: 出处为 spike 行号 (fixloop.py Lxxx) 或 docs/spec/compile.md 行号。

version: 1

meta:
  source: "bench/py/fixloop.py + docs/spec/compile.md"
  generated: "2026-09-15"
  engine_default: xelatex
  loop:
    max_rounds: 8 # spike L40
    one_rule_per_round: true # 每轮只应用一条成功规则, 便于归因 (L549-565)
    dedup_key: "{rule_id}:{payload}" # ctx.applied, 同规则同负载不重复 (L552,561)
    stuck_sig_repeat: 3 # 同 category:payload 连续 ≥3 轮且末轮派发耗尽(主+次级无 apply) → verdict=stuck; 结算点移派发后——产出轮只续窗口不占判负 (L756-761 旧制在派发前预判, 会抢掉同签后位规则)
    clean_err_max: 3 # pdf 且 '!' 错 ≤3 → acceptable (L41, L786-791)
    compile_passes: 2 # 终编臂开关 (>1 启用) + 遍数语义: ≤2 → 引擎自适应门 (rerun-hint 才升遍); >2 → 显式无条件遍数透传 (L628-630)
    timeout_sec: 120
    warn_demote: false # warnings 只记录不改判; §4.3 clean 三件套在 pipeline 层做
    warn_driven_fixes: true # v1.1: 错误全无时 warnings 可驱动 warn_* 类别修复轮

# ────────────────────────────────────────────────────────────────
# 引擎能力位（声明式矩阵）: when.cap_available 判的是引擎自报 caps
# 集合（eng.caps）；本段是各引擎能力对照基线/审计文档，不参与 dispatch
# ────────────────────────────────────────────────────────────────
capabilities:
  xelatex:
    kpsewhich: true
    tlmgr: true
    updmap: true
    shell_escape: true
    bundle: false
  tectonic:
    kpsewhich: false # 无 kpsewhich; 以"本地文件存在+bundle 含不含"近似
    tlmgr: false # 无 tlmgr → install_* 走 ctan_fetch 降级
    updmap: false # 无 updmap; 字体 map 由 bundle 内部管理
    shell_escape: partial # 新版支持但受限; minted 场景按不可完全依赖处理
    bundle:
      true # bundle 内建按需拉文件 (install_file 等价物),
      # 但只覆盖 bundle 索引内文件; 物理字体仍须改写规则

# ────────────────────────────────────────────────────────────────
# 共享知识: file → TeX Live 包名 索引 (install_* 动作的 oracle)
# xelatex: tlmgr search --global --file '/X' (fixloop.py L176-208)
# tectonic: 离线解析 texlive.tlpdb 生成的静态索引 + overrides 手工表
#   (ctan.py: tlpkg/texlive.tlpdb.xz ~2.8MB → 8148 包 / 138K basename,
#    filemap.json ~5.5MB, 构建 0.14s, 缓存 ~/.cache/texlate/)
# ────────────────────────────────────────────────────────────────
filemap:
  xelatex_oracle: "tlmgr search --global --file '/{fname}'"
  tectonic_oracle: "texlive.tlpdb 离线索引 (随规则库分发, 定期重建)"
  cache: "全局 json 缓存, file→[pkg] (远端仓库知识, 与环境冷热无关)"
  denylist_platform_suffixes: # 过滤平台特定包条目 (L190-204)
    [windows, win32, macosx, linux, x86_64, aarch64, amd64, i386, universal]
  denylist_prefixes: [tlmgr, tlgs]
  overrides: # 社区贡献: "fname": "tl_pkg" 手工映射兜底
    # 例: "iclr14submit_e.sty": null   # TL 无此包 → 预检扫描的已知噪声
    # 2026-09-16 起全引擎生效: tectonic 经 CtanFetcher.index 套入, xelatex
    # 等经 _wire_engine 的 eng.filemap 实例遮蔽 (overrides-first 包装)。
    "binhex.tex": "kastrup" # 真身在 kastrup (2211.04574 实证); .tex 入索引后仍留显式钉
    # .tex 已入 INDEX_EXTS (runfiles 段限定, doc/src 噪声不收) —— 此表
    # 继续作显式钉与已知噪声登记 (signature-mining 2026-09-16 §2.1;
    # overrides 是 basename→pkg 直表, 不经 runfiles 过滤)。
    "epsf.tex": "epsf" # 1706.02568; 真身 tex/generic/epsf/epsf.tex ∈ epsf 包
    "tcilatex.tex": null # physics/0307021; TL 无 (TCI 私有) → 已知噪声, 走 vendor stub
    # graphicx.tex: TL 有真身但命中的是 tex/plain/graphics/ miniltx 包装 —
    # xelatex LaTeX 语境 \zap@space 无限递归爆 input stack
    # (nucl-ex/0408018 实证 61 错 1 页 stub)。已知毒件 → 走 shim_map 桥。
    "graphicx.tex": null
    # ── 2026-09-16 babel ldf 钉组: `.ldf` 不在 INDEX_EXTS → 索引恒 miss,
    # overrides-first 直通真包 (babel_lang_ldf_install 规则的查询落点)。
    # 钉名 = 规则 try_exts 实际查询名 ({lang}.ldf / {lang}b.ldf)。
    "german.ldf": "babel-german"
    "germanb.ldf": "babel-german"
    "ngerman.ldf": "babel-german"
    "ngermanb.ldf": "babel-german"
    "russian.ldf": "babel-russian" # TL 无此名 (真身 russianb.ldf) —— 首候选
    # 装上包后 probe miss, 次候选 russianb.ldf 走 already_present_ok 收口
    "russianb.ldf": "babel-russian"
    "french.ldf": "babel-french"
    "frenchb.ldf": "babel-french"
    "francais.ldf": "babel-french"
