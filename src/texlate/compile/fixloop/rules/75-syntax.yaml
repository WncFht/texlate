# rules/75-syntax.yaml — fixloop 规则库分片：语法与宏面改写 —— syntax/already_def/散件杂项 + 兜底 escalate
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # ─── o2-builtin-cs (m1b-residue-routes-2026-09-17 §2): 缺字第三子路 ───
  # §/ø 类缺字由 \S/\o 等 cs 在 TFM 字体下产出 —— 源内无字面字符,
  # missing_char_fix(25) 字面替换与 font_fallback(26) newunicodechar 都
  # 够不到。order 25.7 抢在 26 前: 0xF8 落 font_fallback 拉丁扩展带,
  # 慢一拍会被无回效的 \newunicodechar{ø} 白烧该格 (applied 键占位)。
  # 居本分片因 60-misschar.yaml 归他线名下 (文件级互斥) —— order
  # 全局排序与文件位次无关。
  - id: missing_char_cs_rebind
    mechanisms: [W42, W43]
    description: "缺字码位有产出 cs (\\S→§/\\o→ø) 且源无字面 → \\protected\\def 重绑回退字体"
    phase: loop
    order: 25.7 # missing_char_fix(25)/accent_mark_fix(25.5) 后, font_fallback(26) 前 —— 抢收 cs 产出面防字面回退白烧
    when:
      any:
        - { category: warn_missing_char }
        - { category: warn_utf8 } # 同 missing_char_fix —— 类别排他 quirk 补漏
    action:
      kind: builtin_transform
      function: cs_rebind
      params:
        # char_table 条目可带 produced_by: "<cs>" 扩产出面; producers
        # hex 键直给码位→cs 覆盖。fallback_cs 与 font_fallback 同族
        # 共享 \ifdefined 守卫 (\newfontfamily 不互踩)。
        fallback_cs: txlatefallback
    risk: low # \protected\def 只绑已缺字 cs; \ifmmode 双域模板; moving-arg 实证 (\markboth/\cite[\S 7])
    known_gap: "cs 兼产多码位/参数化产出 (\\char\\NN) 未覆盖; 字面与产出并存时字面路先修, 本规下轮接手"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2403.15096 (m1b-residue-routes-2026-09-17 §2)",
          error: 'Missing character: no § ("A7) in font cmr10 — 31×\S 零字面 §',
        }
      - {
          corpus: "physics/9901057 (同上)",
          error: 'no ø ("F8) in font cmr9 ×2 — \o 在 \markboth/\bibitem 内产出',
        }
    stats: { fires: 98, rescued_cells: 84, status: active }
    source_ref: "peer1-residue-routes.md §2 簇; produced_by 键 = char_table 扩口; \\protected\\def 超 spec \\renewcommand 建议 (moving-arg 安全)"

  # 姊妹臂 (misscharext #154 stage-B): cs_rebind 重绑回退字体保 cs 形,
  # 本臂把"宏名产字"站点直接换成 \\ensuremath 等价 (\\texttildelow→
  # \\sim/\\textlangle→\\langle/\\textrangle→\\rangle) —— 这些 cs 的语义
  # 本体就是数学符, 换字体绑不回正确形。双闸: 缺字码位∈日志 ∧ 肇事 cs
  # 仍在源 —— 防对无关工程烧 dedup 格。
  # misscharcen #162 扩表 (loop3 残余普查): \\textendash→\\mbox{--}
  # (0806.2407 数学态 ket 记号内产 U+2013, cmr10 ×40); \\textgravedbl→
  # \\mbox{\\quotedblbase} + \\textacutedbl→\\mbox{''} (hep-ph/0605319
  # 作者 „...˝ 引号对, gravedbl 产 U+02F5 缺 ×12, acutedbl 键伴生 02F5
  # 使引号对成对归一为 „...")。
  # misscharcen #169 再扩 (wave-2): \\char<dec> OT1/cmc 槽位原语臂 —
  # Unicode 字体下 \\char13 产码位 13 而非 cmcsc 13 号 fl 连字
  # (1404.0578 \\textsc{\\char13} lmromancaps10 ^^M ×41)。产码位=
  # 实参值 → _OT1_CHAR_SLOTS 0-31 同闸改写; 槽位表对 TFM 语境亦
  # 语义保持 (fl 字母重归连字槽) —— 门控失误零副作用。
  - id: macro_glyph_fix
    mechanisms: [W42, W43]
    description: "宏名/原语产缺字 (\\texttildelow 族 6 cs + \\char<dec> OT1 槽位表) → 站点改写双模安全等价"
    phase: loop
    order: 25.8 # cs_rebind(25.7) 后, font_fallback(26) 前 —— 同闸同域, 换形臂
    when:
      any:
        - { category: warn_missing_char }
        - { category: warn_utf8 }
        - { category: invalid_in_math }
    action:
      kind: builtin_transform
      function: macro_glyph_fix
      params: { exts: [.tex, .bbl, .cls] }
    risk: low # 站点级双闸 (码位∈日志 ∧ cs∈源); \\ensuremath/\\mbox 双模安全
    known_gap: "\\let\\x\\textlangle 单 token 别名绑定不匹配; 表外 cs 产字 decline 交下轮; \\textacutedbl 键伴生 U+02F5 触发 (引号对归一), 音标域 U+02DD 真缺字不触发; \\char 槽表外 (≥32 ASCII 面) 与非数值实参 (\\char`a/\\char\\numexpr) 不收"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "misscharext #154 (utf8census 派生): 2308.04265 U+02F7×2, 2403.00011 U+2329/232A×6",
          error: "Missing character: There is no ˷/〈/〉 — \\texttildelow/\\textlangle/\\textrangle 站点产出",
        }
      - {
          corpus: "misscharcen #162 (loop3 残余普查 tmp/lane-misscharcen/cells.json): 0806.2407 U+2013×40 cmr10, hep-ph/0605319 U+02F5×12 lmroman10/12",
          error: "Missing character: –(U+2013)/˵(U+02F5) — \\textendash/\\textgravedbl(+\\textacutedbl 引号对) 站点产出",
        }
      - {
          corpus: "misscharcen #169 (loop3 残余普查): 1404.0578 U+000D ^^M×41 lmromancaps10",
          error: "Missing character: no ^^M (U+000D) — \\textsc{\\char13} OT1/cmcsc 槽位 13=fl 连字被读作码位",
        }
    stats: { fires: 29, rescued_cells: 9, status: active }
    source_ref: "task #154 stage-B; tmp/lane-misscharext/report.md — 直换 \\ensuremath 非字面 (一轮达, \\qdist def 站是文本态序言而展开在数学); #162/#169 扩表 tmp/lane-misscharcen/cells.json"

  - id: hyphenation_sane
    description: "\\hyphenation{} 参数混入非拉丁 token (中文) → 剥离, 只留 [a-zA-Z-]"
    phase: loop
    order: 90
    when: { category: hyphenation }
    condition: { ctx_suggests: "\\hyphenation" } # "Not a letter" 也可能来自别处, 有 ctx 复核更稳
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\hyphenation\\{([^}]*)\\}",
              flags: [DOTALL],
              function: keep_latin_tokens,
            }
          # keep_latin_tokens: re.findall(r"[a-zA-Z][a-zA-Z-]*") → " ".join
    risk: low
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1512.03385/zh",
          error: "Not a letter (\\hyphenation 混入 CJK token)",
        }
    stats: { fires: 1, rescued_cells: 1 }
    source_ref: "fixloop.py L409-426"

  - id: soul_cjk_mbox
    description: "soul 族 (\\hl\\ul\\st\\so\\caps) 参数含 CJK → \\mbox 包裹防逐字重构"
    phase: loop
    order: 100
    when: { category: soul_err }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\(hl|ul|st|so|caps)\\{((?:[^{}]|\\{[^{}]*\\})*[\\u4e00-\\u9fff\\u3000-\\u303f\\uff00-\\uffef](?:[^{}]|\\{[^{}]*\\})*)\\}",
              repl: '\\\g<1>{\\mbox{\g<2>}}',
            }
    risk: low
    known_gap: "2005.11401/zh 触发 soul_err 但 regex 0 文件命中 → skip → dirty_pdf; 实际 soul 错因不在此 pattern 覆盖范围, 沉淀队列头号 case"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "2005.11401/zh", error: "Package soul Error (6 errs 残留)" }
    stats:
      {
        fires: 1,
        rescued_cells: 1,
        status: active,
        note: "唯一触发格 0 命中 → 已知覆盖缺口",
      }
    source_ref: "fixloop.py L429-445"

  # ── 2026-09-20 mathbd lane (singles3 bundle A) ──
  # soul_cjk_mbox(100) 姊妹臂: soul 族实参为单个 cs (``\hl{\model}``) 时
  # 字面 CJK 闸不命中——CJK/组结构藏在 cs 定义体内 (``\model``=``\texttt{ReAct}``,
  # 展开出 ``\texttt{..}`` 组 → soul 判「可断材料包在组括号内」→ Reconstruction
  # failed; TU 编码 xelatex 下无 inputenc/fontenc 包裹层)。修 = cs 裹 \mbox
  # 成原子盒, soul 直接透传。pattern 只收单-cs 实参形 (多 token 不命中);
  # \mbox 是 kernel 原语, 对任意 cs 实参包裹皆安全。
  - id: soul_cs_mbox
    description: "soul 族 (\\hl\\ul\\st\\so\\caps) 实参为单个 cs → \\mbox 包裹 (cs 展开体内组/CJK 触发逐字重构失败)"
    phase: loop
    order: 102 # soul_cjk_mbox(100) 字面 CJK 形先收; 本臂兜单-cs 实参形
    when: { category: soul_err }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\(hl|ul|st|so|caps)\\{\\s*(\\\\[a-zA-Z@]+)\\s*\\}",
              repl: '\\\g<1>{\\mbox{\g<2>}}',
              match_surface: "masked",
            }
    risk: low # \mbox kernel 原语零依赖; 已裹站点实参为 \mbox{..} 非单 cs → 不再命中 (幂等)
    known_gap: "多 token 实参 (\\hl{a \\model}) 不收——soul_err 复发后无后续规则接, 残面同 soul_cjk_mbox 已知缺口"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2210.03629/zh",
          error: "Package soul Error: Reconstruction failed — \\hl{\\model}/\\act/\\reason 28 站 (cs 定义体含 \\texttt 组)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-mathbd/cells/2210.03629: 28-site \\mbox{\\cs} wrap xelatex 净编译实证"

  # ── 2026-09-19 citemath 匝道 (task #79; lane-citemath EVIDENCE) ──
  # natbib ``\@citex`` 未定义引用标记 ``{\reset@font\bfseries ?}`` 无盒
  # 裸置 → 数学域内 ``\cite`` 展开炸 "Command \bfseries invalid in math
  # mode" (\not@math@alphabet); halt_on_error 死在 thebibliography 前 →
  # ``\bibcite`` 不落 .aux → 每轮同错自续。修 = latex209.wrap_math_cites
  # 走查面 ($ 系定界 + 数学 env 域, \mbox/\text 文本实参除外), 数学域内
  # 裸 cite 族调用裹 ``\mbox{..}`` 把标记带回文本域。同签可由字面
  # ``{\bfseries X}`` 数学域误用触发——无 cite token 命中即 decline
  # (applied=False), 不烧轮次。
  - id: cite_in_math_mbox
    description: "数学域内裸 cite 族调用 (natbib 未定义标记 \\bfseries 炸点) → \\mbox{} 包裹"
    phase: loop
    order: 105 # soul_cjk_mbox(100) 与 thm_sibling_strip(110) 之间
    when: { category: invalid_in_math }
    action:
      kind: builtin_transform
      function: cite_in_math_mbox
      params:
        exts: [.tex]
    risk: low # \mbox 是 kernel 原语无包依赖; 已裹调用居 \mbox 文本域不重复命中 (幂等); 注释/逐字面由 visible_tex 遮蔽
    known_gap: "同签名字面 {\\bfseries X} 误用无 cite token → applied=False 交下轮; 跨域残缺调用 (\\cite 与 {key} 分居两侧定界) 不裹; \\cite 无 {key} 的残缺形不收"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "gr-qc/9901082 (citemath-census-2026-09-18; min6/mbox 实证)",
          error: "Command \\bfseries invalid in math mode — revtex4-2 \\rtx@citex→natbib \\@citex {\\reset@font\\bfseries ?} 无盒标记",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-citemath/EVIDENCE.md; latex209.wrap_math_cites (209 cite 臂独立出口, _MATH_CITE_CS_209 17 命令清单)"

  - id: thm_sibling_strip
    description: "thmtools sibling= 定理计数器冲突 (already defined) → 剥 sibling 选项, 各定理独立编号"
    phase: loop
    order: 110
    when: { category: already_def }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty]
        rewrites:
          - { pattern: "sibling\\s*=\\s*\\w+\\s*,?\\s*", repl: "" }
    risk: medium # 改变定理编号
    known_gap: "sibling= 0 命中时泛化 newtheorem 去重未实现 → applied=False (L453-455)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "—",
          error: "Command \\c@thm already defined (thmtools sibling)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "fixloop.py L448-456"

  # ─── o2-builtin-cs (m1b-residue-routes-2026-09-17 §2): already_def 批量清位 ──
  # journal_abbrev 族: mnras.cls 预定义 \aj/\mnras 系, 稿内 \newcommand
  # 6-11 名连环撞 —— renew(111) payload-bound 逐轮一名, 10+ 撞名烧尽轮次。
  # halt_on_error 下每轮 log 只见首撞名 → 本规按"撞名 ∪ 撞名站点所在
  # 文件的全部 \newcommand 族站点"计数 ≥min_batch, 一轮把 guilty 文件
  # 内全部"名必须未定义"族站点前置 \let\@undefined (未撞名站点前置是
  # 语义无操作: undefine+define≡define; 1206.0299 实证 12 名单轮清,
  # verdict 由 best_effort 升 clean) + 证实撞名 docclass 块双修。孤站
  # 单撞名格仍让位 renew(111)/undefine(113) 已验证路径。other 臂兜底
  # Command 前缀缺位的 already defined 签 (taxonomy 无下家 —— builtin
  # 侧 min_batch 恒按 1); 反引号签 ``Command `\X'`` 自 2026-09-19
  # taxonomy 扩引号形后落 already_def 主臂带 payload。
  - id: already_def_batch_undefine
    mechanisms: [W45, W49]
    description: "already_def 撞名∪同文件站点簇 ≥2 (或反引号 other 签) → 一轮批清 \\let\\X\\@undefined (站点前置+docclass 块双修)"
    phase: loop
    order: 110.5 # thm_sibling_strip(110) 后, renew(111) 前 —— 批量先收, 单撞名落 111/113
    when:
      any:
        - { category: already_def, payload_required: true }
        - { category: other } # Command 前缀缺位的 already defined 签兜底 (反引号签已归 already_def 臂)
    condition:
      ctx_suggests: "already defined"
    action:
      kind: builtin_transform
      function: undefine_for_redef
      params:
        min_batch: 2 # payload=None (other 臂) 时 builtin 内恒按 1
    risk: medium # 同 already_def_undefine(113): 清先定义位让后定义者赢; 寄存器/盒型分配名护栏同套
    known_gap: "log 截断时撞名集不全 → 残名下轮补扫; 站点在非 wdir 外 (\\input 树外) 未锚; Theorem-style payload 非 cs 自动丢弃"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1206.0299 (m1b-residue §2 journal_abbrev)",
          error: "odg.tex:221-226 Command \\aj/\\jcap/\\prd/\\pasp/\\mnras/\\physrep already defined ×6 (mnras.cls 预定义)",
        }
      - {
          corpus: "1706.00106 (同上)",
          error: "ms.tex:217-229 \\mnras/\\aap/\\aapr/\\pasp/\\rmxaa/\\nar/\\nat/\\physrep/\\pasj/\\pasa ×10",
        }
      - {
          corpus: "astro-ph/0408445 (同上 mathalpha_redef)",
          error: 'PolarShapelets.tex:342/344 Command `\mathbfit''/`\mathbfss'' already defined (bm 包后定义窗口 → 站点前置修形)',
        }
    stats: { fires: 122, rescued_cells: 47, status: active }
    source_ref: "peer1-residue-routes.md §2; undefine_for_redef 批量化 (site_cmds 表可扩)"

  # ─── o2-builtin-cs (wontfix-scout 裁决1, wontfix→rule 改判): fontspec
  # merge 表撞车 ── IMS 系 cls \renewcommand\sldefault{it} (arximspdf:227/
  # arxstspdf:181) → fontspec 2.9g \__fontspec_merge_default_shapes 的
  # \tl_const:cn 展开产 4 组重名 (it_sc/sc_it/scit_it/scit_n)。签名落
  # other (无 Command 关键字 —— "Control sequence \c__fontspec_shape_*_tl
  # already defined")。修 = preamble 顶 (\documentclass 前) hook 对:
  # before 存 cls 值+复位 \sldefault{sl} 让 merge 表展开不撞, after 还原。
  # 错发在 preamble 期包加载 (注入 ctex→xeCJK→fontspec 链), hook 完全可达;
  # fixprobe 实测 0 错 PDF 正常 (tmp/wontfix-scout/work/fixprobe.tex)。
  - id: fontspec_double_merge
    description: "cls 重定义 \\sldefault 撞 fontspec merge 常量表 → \\documentclass 前注 fontspec before/after hook 对暂存-复位-还原"
    phase: loop
    order: 110.7 # batch_undefine(110.5) 同面 —— 该签名无 Command 形 cs, 上家自 decline 后落此
    when: { category: other } # "Control sequence" 签不落 already_def taxonomy
    condition:
      ctx_suggests: "Control sequence \\\\c__fontspec_shape_\\w+ already defined"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "^[ \\t]*\\\\documentclass",
              flags: [M],
              repl: '\\AddToHook{package/fontspec/before}{\\let\\TeXlateSldefault\\sldefault \\def\\sldefault{sl}}\n\\AddToHook{package/fontspec/after}{\\let\\sldefault\\TeXlateSldefault} % fixloop: fontspec shape-merge guard\n\g<0>',
            }
    risk: low # hook 对为纯守卫: \sldefault 未被 cls 动过时存-复位-还原同值, 等同 no-op
    known_gap: "cls 自体在 \\documentclass 内加载 fontspec 的极端序仍盖 (hook 先于类载入); 多 docclass \\if 分支各臂同注, hook 幂等"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0806.3286/1003.5240/1206.0576 (arximspdf.cls:227) + 1012.1161 (arxstspdf.cls:181)",
          error: "fontspec-xetex.sty:4166 Control sequence \\c__fontspec_shape_{it_sc,sc_it,scit_it,scit_n}_tl already defined ×4",
        }
    stats: { fires: 16, rescued_cells: 6, status: proven }
    source_ref: "tmp/wontfix-scout/verdict.md 裁决1 + work/fixprobe.tex 实测 0 错"

  # ─── chineseclear (2403.00013 residual): expl3 ``Control sequence \X
  # already defined`` 签名 —— kaist-ucs.cls:71 \RequirePackage[nonfrench]
  # {dhucs} → xetexko.sty:364 \let\chinese\Schinese (\documentclass 内 cls
  # 链先定义), 注入 ctex 行 ctex.sty:500 \cs_new:Npn \chinese 恒拒。签名
  # 无 Command 关键字 → 落 other 无 payload, already_def_* 三家够不到。
  # cls 从不调 \chinese 本体 (只 \author opt-arg 串比较 "chinese") →
  # 清位 doc-safe。修 = docclass 缝顶 (注入 ctex 行之前)
  # \makeatletter\let\X\@undefined\makeatother —— 同 undefine_for_redef
  # "清先定义位让后定义者赢" 教义; 缝顶序保证 cls 先定义已跑、注入块
  # 后定义未跑。builtin 内文件门只收注入 CJK 块装载树 (ctex/xeCJK/
