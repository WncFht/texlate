  #   edef 内执行产字面 token; \expandafter 单展开 \string-bearing 宏留下
  #   \string 字面 → 仍 illegal, 两臂缺一不可)。
  # emulateapj \pt@tabular 另绑 array 中和掉的 kernel 存名
