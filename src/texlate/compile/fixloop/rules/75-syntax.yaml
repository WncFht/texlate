    description: "array 装载面 preamble 宏 token → call-站 \\expandafter + def-站 \\edef 烘焙 + emulateapj 死绑 let 链中和"
    phase: loop
    order: 198 # undefined_cs_guess(900) 之前; pream_token 新类无竞争消费者
    when: { category: pream_token, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\def(\\\\{payload}\\{\\\\string\\s*#1\\s*\\})",
              repl: "\\\\edef\\g<1>",
            }
          - {
              pattern: "\\\\(pt@tabular|@tabular|tabular)\\{\\s*\\\\{payload}\\s*\\}",
              repl: "\\\\expandafter\\\\\\g<1>\\\\expandafter{\\\\{payload}}",
            }
          - {
              pattern: "\\s*\\\\let\\\\@acol\\\\@ptabacol\\s*\\\\let\\\\@classz\\\\@tabclassz\\s*\\\\let\\\\@classiv\\\\@tabclassiv\\s*",
              repl: " ",
            }
          - {
