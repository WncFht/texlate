  # 未闭合 \if* → 文件尾 \fi 注入双臂 (failmine item 4, 16 格)。
  # other 臂: `! Incomplete \iffalse/\ifnum` 首错 (taxonomy 无专属条目 →
  # `^.` 兜底归 other, ctx_suggests 可及)。脚本对 doc 源件做注释剥离后的
  # \if*/\fi 栈平衡扫描, 只对"活区"亏格文件在 \end{document}/\endinput/EOF
  # 前补 \fi —— def 体内 open 是冻结 token (file-end \fi 够不到, 注入反而
  # 造 Extra \fi), 只计不注; 跨文件借用对 (\if 开 A 件 \fi 闭 B 件) 由全局
  # opens>closes 闸兜住不注。扫描器即 phantom 判别器: draftsty 类展开态
  # \iffalse (包内 edef 吞文件) 源件字面平衡 → 纯 noop 不误伤。
  # 2026-09-19 covgap-C 扩域 (2609.20323 实证): preamble 内开的 \if 若任
  # file-end \fi 裹住整 body, false 臂把 \document (\@mainaux open) 一并
  # 吞掉 → `I can't find file 'main.aux'` emergency 下游产物。脚本分两段:
  # \begin{document} 前开的 \if 注在 begdoc 行头 (守卫域限 preamble);
  # body 内开的仍注 boundary。坐标全部按原 text 计算后位先注。
  - id: unclosed_if_close
    mechanisms: [B05]
    description: "doc 源件未闭合 \\if* → preamble 开注 \\begin{document} 前 / body 开注 \\end{document}/\\endinput/EOF 前 (other 臂: Incomplete \\if 首错)"
    phase: loop
    order: 196 # pdfstring_cs_disarm(193)/80-bib(195) 之后, undefined_cs_guess(900) 之前; draftsty 补丁(11.95) 先拿 phantom
    when: { category: other }
    condition:
      ctx_suggests: "Incomplete \\\\if"
      tool_available: python3
    action:
      kind: run_tool
      params:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path
            import re

            try:
                from texlate.textutil import mask_tex, scan_ifs
            except Exception:
                mask_tex = scan_ifs = None

            MARK = "texlate-fixloop-injected"
            EXTS = {".tex", ".sty", ".cls"}
            BEGDOC_RE = re.compile(r"\\begin\s*\{document\}")

            if scan_ifs is None:
                print("ifclose: noop (texlate mask unavailable)")
                raise SystemExit(0)
            files = []
            for p in sorted(Path(".").rglob("*")):
                if not p.is_file() or p.suffix.lower() not in EXTS:
                    continue
                if any(part.startswith(".") for part in p.parts):
                    continue
                files.append(p)
            tot_opens = tot_closes = tot_phantom = 0
            deficits = []  # (path, unclosed_live, boundary)
            for p in files:
                try:
                    text = p.read_text(encoding="utf-8", errors="replace")
                except OSError:
                    continue
                if MARK in text:
                    continue
                r = scan_ifs(text)
                tot_opens += r.live_opens
                tot_closes += r.live_closes
                tot_phantom += len(r.phantoms)
                if r.unclosed_live:
                    deficits.append((p, r.unclosed_live, r.boundary))
            # noop if no deficit, or opens<=closes globally (cross-file borrowed
            # pair: \if in file A closed by \fi in \input'd file B works at runtime)
            if not deficits or tot_opens <= tot_closes:
                print(
                    f"ifclose: noop opens={tot_opens} closes={tot_closes} "
                    f"deficits={len(deficits)} phantom={tot_phantom}"
                )
            else:
                for p, opens, boundary in deficits:
                    text = p.read_text(encoding="utf-8", errors="replace")
                    # preamble 界注入 (covgap-C 2609.20323 实证): \begin{document}
                    # 前开的 \if 若任 file-end \fi 裹住整 body, false 臂把
                    # \document (\@mainaux open) 一并吞掉 → main.aux 缺件
                    # emergency 下游产物。preamble open 注在 \begin{document}
                    # 行前 (守卫域限 preamble); body 内 open 仍注 boundary。
                    inserts = []  # (pos, frag) 原 text 坐标 — 后位先注保序
                    masked = mask_tex(text)
                    begdoc = BEGDOC_RE.search(masked)
                    pre = post = []
                    if begdoc is not None:
                        begdoc_line = masked.count("\n", 0, begdoc.start()) + 1
                        pre = [o for o in opens if o[1] < begdoc_line]
                        post = [o for o in opens if o[1] >= begdoc_line]
                    else:
                        post = opens
                    if pre:
                        bl = text.rfind("\n", 0, begdoc.start()) + 1
                        inserts.append(
                            (
                                bl,
                                "\\fi" * len(pre)
                                + f" % {MARK}: closed {len(pre)} unclosed preamble \\if* before \\begin{{document}}\n",
                            )
                        )
                    if post:
                        line_start = text.rfind("\n", 0, boundary) + 1
                        inserts.append(
                            (
                                line_start,
                                "\\fi" * len(post)
                                + f" % {MARK}: closed {len(post)} unclosed \\if* at file end\n",
                            )
                        )
                    for pos, frag in sorted(inserts, key=lambda t: -t[0]):
                        text = text[:pos] + frag + text[pos:]
                    p.write_text(text, encoding="utf-8")
                    print(
                        f"ifclose: injected into {p} "
                        f"pre={len(pre)} post={len(post)} phantom={tot_phantom}"
                    )
        timeout: 30
    risk: low # 仅活区亏格件补 \fi (全局 opens>closes 才注); def 体 opens 只计不注 (file-end \fi 够不到冻结 token); 跨文件借用对/phantom 全局平衡 noop; 指纹幂等
    known_gap: "def 体内未闭合 open (aastex61.cls \\if@two@col 于 \\def\\endrotatetable* 体 —— 1706.00175 等 5 格真凶) 需 \\fi 注在体 `}` 前 (中段注入), 本规则按简报只做 file-end 注 → 记 def_unclosed 不修; \\if 开在 \toks/宏体寄存器赋值体 (\\mytoks={\\ifx}) 误计 live; 顶层外子目录经 rglob 已盖但 dot-dir 略过"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus failmine-4: 1206.0701/1306.0364 (loop2 \\iffalse), 0905.0193+1706.00175 等 (loop1 \\ifx)",
          error: "Incomplete \\iffalse; all text was ignored after line N (首错 `!` 形 → other); \\end occurred when \\ifx on line N was incomplete → early_eof",
        }
    stats: { fires: 172, rescued_cells: 2, status: active }
    source_ref: "tmp/lane-failmine/rule_targets.txt item4; 12 格抽样全字面平衡 (phantom 主导) —— 扫描器即判别器, 修复面兜底真亏格稿"

