    order: 172 # revtex4_array_swap_guard(170) 与 typein_neutralize(180) 之间; abstract 专名面已由 168 先行
    when: { category: env_undefined, payload_required: true }
    action:
      kind: builtin_transform
      function: undefined_env_polyfill
      params:
        deny: [document] # 不可 noop 化的环境名
        # env→真包臂 (pgffix, 1306.0281 族): 图类 env 装真包替代 noop —
        # noop 吞图体且体内 pgf cs (\node/\addplot) 连锁 undefined_cs
        # 白烧轮次; cs_table 无条目者 (axis/tikzcd) 更是唯一活路。
        # tikzpicture 的 polyfill 自带 \usepackage{tikz} 前缀: 注缝 LIFO
