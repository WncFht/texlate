  # 2026-09-17 wave-final 批七: legacy-rewrite 副产品 ×47 —— \documentstyle
  # {revtex}→revtex4-2 后, revtex4-2.cls:2685 把 abstract 环境仅 frontmatter
  # 期 let-bound (frontmatter@abstract, cls:3143 区域), \maketitle 后
  # \let\abstract\@undefined → 稿面老版式 maketitle→abstract 炸
  # Environment abstract undefined。preamble polyfill 无效 (cls 在
  # \maketitle 主动 undefine, polyfill 先被清)。修形=源级重排:
  # \begin{abstract}…\end{abstract} 连同与 \maketitle 间的间隔段
  # (\pacs/\keywords 等 frontmatter 散件) 整体前移至 \maketitle 前
  # —— revtex 系 canonical frontmatter 序。47/47 格核验均为
  # maketitle-then-abstract。ctx_suggests 限定仅 abstract payload 点火,
  # 其他 env_undefined (如 document/frontmatter) 不误排。
  - id: abstract_frontmatter_hoist
    description: "revtex4 系 abstract 环境仅 frontmatter 期存活 → abstract 块+间隔段前移 \\maketitle 前; 209 裸 \\abstract..\\endabstract 对先 env 化再同链前移"
    phase: loop
    order: 168 # acro_v3_key_rename(167) 与 revtex4_array_swap_guard(170) 之间
    when:
      any:
        - { category: env_undefined } # env 形: Environment abstract undefined
        - { category: undefined_cs } # 209 裸 \abstract/\endabstract 对: payload=abstract
    condition:
      any:
        - { ctx_suggests: "Environment abstract" } # env_undefined 签
        - { ctx_suggests: "\\\\abstract\\b" } # undefined_cs 签: l.N 行裸 \abstract (\b 拦 \abstractname)
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          # env 化先行: 同 pass 内裸对转 env 后, 下两条 hoist 立即接住 →
          # 内联裸对一轮收敛; \endabstract 内 abstract 前无 \ 不误伤。
          - { pattern: "\\\\abstract\\b", repl: '\\begin{abstract}' }
          - { pattern: "\\\\endabstract\\b", repl: '\\end{abstract}' }
          - {
              pattern: "(?s)\\\\maketitle(.*?)\\\\begin\\{abstract\\}(.*?)\\\\end\\{abstract\\}",
              repl: '\\begin{abstract}\g<2>\\end{abstract}\g<1>\\maketitle',
            }
          # 跨文件变体: 摘要在 \input{abstract} 件内 —— gap 限空白+注释行,
          # input 行整体移到 \maketitle 前 (hep-ph/0104029 实证形态)。
          - {
              pattern: "(?s)\\\\maketitle((?:\\s|%[^\\n]*)*?)\\\\input\\{\\s*abstract\\s*\\}",
              repl: '\\input{abstract}\g<1>\\maketitle',
            }
    risk: medium # 摘要块物理前移改文档结构; gap 段 (\pacs 等) 随块落 frontmatter 区, revtex 系正解
    known_gap: "abstract 体含 \\end{abstract} 字面嵌套/未配对括号时短匹截断; 稿面已是 abstract→maketitle 序时模式不中 → applied=False 无害; 裸对→env 转换链自收敛: 一轮内 env 化+前移同落, 漏网形态由下轮 env_undefined 兜住"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
