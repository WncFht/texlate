  # example/definition/theorem undefined 多 env 同轮齐缺。修形 =
  # docclass 后 \ifcsname 守卫 \newenvironment{X}{}{} noop (数学 env 给
  # \[..\] 壳) —— cls 其实有定义的残余格幂等, 一轮清全部缺名。
  - id: undefined_env_polyfill
    description: "Environment X undefined → docclass 后 \\ifcsname 守卫 \\newenvironment noop (数学 env 给 \\[..\\] 壳), 一轮批清"
