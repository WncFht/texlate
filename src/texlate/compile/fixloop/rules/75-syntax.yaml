# rules/75-syntax.yaml — fixloop 规则库分片：语法与宏面改写 —— syntax/already_def/散件杂项 + 兜底 escalate
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # ─── o2-builtin-cs (m1b-residue-routes-2026-09-17 §2): 缺字第三子路 ───
  # §/ø 类缺字由 \S/\o 等 cs 在 TFM 字体下产出 —— 源内无字面字符,
  # missing_char_fix(25) 字面替换与 font_fallback(26) newunicodechar 都
  # 够不到。order 25.7 抢在 26 前: 0xF8 落 font_fallback 拉丁扩展带,
  # 慢一拍会被无回效的 \newunicodechar{ø} 白烧该格 (applied 键占位)。
  # 居本分片因 60-misschar.yaml 归他线名下 (文件级互斥) —— order
  # 全局排序与文件位次无关。
  - id: missing_char_cs_rebind
    mechanisms: [W42, W43]
    description: "缺字码位有产出 cs (\\S→§/\\o→ø) 且源无字面 → \\protected\\def 重绑回退字体"
    phase: loop
    order: 25.7 # missing_char_fix(25)/accent_mark_fix(25.5) 后, font_fallback(26) 前 —— 抢收 cs 产出面防字面回退白烧
    when:
      any:
        - { category: warn_missing_char }
        - { category: warn_utf8 } # 同 missing_char_fix —— 类别排他 quirk 补漏
    action:
      kind: builtin_transform
      function: cs_rebind
      params:
        # char_table 条目可带 produced_by: "<cs>" 扩产出面; producers
        # hex 键直给码位→cs 覆盖。fallback_cs 与 font_fallback 同族
        # 共享 \ifdefined 守卫 (\newfontfamily 不互踩)。
        fallback_cs: txlatefallback
    risk: low # \protected\def 只绑已缺字 cs; \ifmmode 双域模板; moving-arg 实证 (\markboth/\cite[\S 7])
    known_gap: "cs 兼产多码位/参数化产出 (\\char\\NN) 未覆盖; 字面与产出并存时字面路先修, 本规下轮接手"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2403.15096 (m1b-residue-routes-2026-09-17 §2)",
          error: 'Missing character: no § ("A7) in font cmr10 — 31×\S 零字面 §',
        }
      - {
          corpus: "physics/9901057 (同上)",
          error: 'no ø ("F8) in font cmr9 ×2 — \o 在 \markboth/\bibitem 内产出',
        }
    stats: { fires: 0, status: proposed }
    source_ref: "peer1-residue-routes.md §2 簇; produced_by 键 = char_table 扩口; \\protected\\def 超 spec \\renewcommand 建议 (moving-arg 安全)"

  - id: hyphenation_sane
    description: "\\hyphenation{} 参数混入非拉丁 token (中文) → 剥离, 只留 [a-zA-Z-]"
    phase: loop
    order: 90
    when: { category: hyphenation }
    condition: { ctx_suggests: "\\hyphenation" } # "Not a letter" 也可能来自别处, 有 ctx 复核更稳
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\hyphenation\\{([^}]*)\\}",
              flags: [DOTALL],
              function: keep_latin_tokens,
            }
          # keep_latin_tokens: re.findall(r"[a-zA-Z][a-zA-Z-]*") → " ".join
    risk: low
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1512.03385/zh",
          error: "Not a letter (\\hyphenation 混入 CJK token)",
        }
    stats: { fires: 1, rescued_cells: 1 }
    source_ref: "fixloop.py L409-426"

  - id: soul_cjk_mbox
    description: "soul 族 (\\hl\\ul\\st\\so\\caps) 参数含 CJK → \\mbox 包裹防逐字重构"
    phase: loop
    order: 100
    when: { category: soul_err }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\(hl|ul|st|so|caps)\\{((?:[^{}]|\\{[^{}]*\\})*[\\u4e00-\\u9fff\\u3000-\\u303f\\uff00-\\uffef](?:[^{}]|\\{[^{}]*\\})*)\\}",
              repl: '\\\g<1>{\\mbox{\g<2>}}',
            }
    risk: low
    known_gap: "2005.11401/zh 触发 soul_err 但 regex 0 文件命中 → skip → dirty_pdf; 实际 soul 错因不在此 pattern 覆盖范围, 沉淀队列头号 case"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "2005.11401/zh", error: "Package soul Error (6 errs 残留)" }
    stats: { fires: 0, note: "唯一触发格 0 命中 → 已知覆盖缺口" }
    source_ref: "fixloop.py L429-445"

  - id: thm_sibling_strip
    description: "thmtools sibling= 定理计数器冲突 (already defined) → 剥 sibling 选项, 各定理独立编号"
    phase: loop
    order: 110
    when: { category: already_def }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty]
        rewrites:
          - { pattern: "sibling\\s*=\\s*\\w+\\s*,?\\s*", repl: "" }
    risk: medium # 改变定理编号
    known_gap: "sibling= 0 命中时泛化 newtheorem 去重未实现 → applied=False (L453-455)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "—",
          error: "Command \\c@thm already defined (thmtools sibling)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "fixloop.py L448-456"

  # ─── o2-builtin-cs (m1b-residue-routes-2026-09-17 §2): already_def 批量清位 ──
  # journal_abbrev 族: mnras.cls 预定义 \aj/\mnras 系, 稿内 \newcommand
  # 6-11 名连环撞 —— renew(111) payload-bound 逐轮一名, 10+ 撞名烧尽轮次。
  # halt_on_error 下每轮 log 只见首撞名 → 本规按"撞名 ∪ 撞名站点所在
  # 文件的全部 \newcommand 族站点"计数 ≥min_batch, 一轮把 guilty 文件
  # 内全部"名必须未定义"族站点前置 \let\@undefined (未撞名站点前置是
  # 语义无操作: undefine+define≡define; 1206.0299 实证 12 名单轮清,
  # verdict 由 best_effort 升 clean) + 证实撞名 docclass 块双修。孤站
  # 单撞名格仍让位 renew(111)/undefine(113) 已验证路径。other 臂接反
  # 引号签 ``Command `\X' already defined`` (ltcmd/老 \@ifdefinable 形,
  # taxonomy 落 other 无 payload —— builtin 侧 min_batch 恒按 1, 该面
  # 无下家)。
  - id: already_def_batch_undefine
    mechanisms: [W45, W49]
    description: "already_def 撞名∪同文件站点簇 ≥2 (或反引号 other 签) → 一轮批清 \\let\\X\\@undefined (站点前置+docclass 块双修)"
    phase: loop
    order: 110.5 # thm_sibling_strip(110) 后, renew(111) 前 —— 批量先收, 单撞名落 111/113
    when:
      any:
        - { category: already_def, payload_required: true }
        - { category: other } # 反引号签 `` `X' already defined`` 无 payload
    condition:
      ctx_suggests: "already defined"
    action:
      kind: builtin_transform
      function: undefine_for_redef
      params:
        min_batch: 2 # payload=None (other 臂) 时 builtin 内恒按 1
    risk: medium # 同 already_def_undefine(113): 清先定义位让后定义者赢; 寄存器/盒型分配名护栏同套
    known_gap: "log 截断时撞名集不全 → 残名下轮补扫; 站点在非 wdir 外 (\\input 树外) 未锚; Theorem-style payload 非 cs 自动丢弃"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1206.0299 (m1b-residue §2 journal_abbrev)",
          error: "odg.tex:221-226 Command \\aj/\\jcap/\\prd/\\pasp/\\mnras/\\physrep already defined ×6 (mnras.cls 预定义)",
        }
      - {
          corpus: "1706.00106 (同上)",
          error: "ms.tex:217-229 \\mnras/\\aap/\\aapr/\\pasp/\\rmxaa/\\nar/\\nat/\\physrep/\\pasj/\\pasa ×10",
        }
      - {
          corpus: "astro-ph/0408445 (同上 mathalpha_redef)",
          error: 'PolarShapelets.tex:342/344 Command `\mathbfit''/`\mathbfss'' already defined (bm 包后定义窗口 → 站点前置修形)',
        }
    stats: { fires: 0, status: proposed }
    source_ref: "peer1-residue-routes.md §2; undefine_for_redef 批量化 (site_cmds 表可扩)"

  # ─── o2-builtin-cs (wontfix-scout 裁决1, wontfix→rule 改判): fontspec
  # merge 表撞车 ── IMS 系 cls \renewcommand\sldefault{it} (arximspdf:227/
  # arxstspdf:181) → fontspec 2.9g \__fontspec_merge_default_shapes 的
  # \tl_const:cn 展开产 4 组重名 (it_sc/sc_it/scit_it/scit_n)。签名落
  # other (无 Command 关键字 —— "Control sequence \c__fontspec_shape_*_tl
  # already defined")。修 = preamble 顶 (\documentclass 前) hook 对:
  # before 存 cls 值+复位 \sldefault{sl} 让 merge 表展开不撞, after 还原。
  # 错发在 preamble 期包加载 (注入 ctex→xeCJK→fontspec 链), hook 完全可达;
  # fixprobe 实测 0 错 PDF 正常 (tmp/wontfix-scout/work/fixprobe.tex)。
  - id: fontspec_double_merge
    description: "cls 重定义 \\sldefault 撞 fontspec merge 常量表 → \\documentclass 前注 fontspec before/after hook 对暂存-复位-还原"
    phase: loop
    order: 110.7 # batch_undefine(110.5) 同面 —— 该签名无 Command 形 cs, 上家自 decline 后落此
    when: { category: other } # "Control sequence" 签不落 already_def taxonomy
    condition:
      ctx_suggests: "Control sequence \\\\c__fontspec_shape_\\w+ already defined"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "^[ \\t]*\\\\documentclass",
              flags: [M],
              repl: '\\AddToHook{package/fontspec/before}{\\let\\TeXlateSldefault\\sldefault \\def\\sldefault{sl}}\n\\AddToHook{package/fontspec/after}{\\let\\sldefault\\TeXlateSldefault} % fixloop: fontspec shape-merge guard\n\g<0>',
            }
    risk: low # hook 对为纯守卫: \sldefault 未被 cls 动过时存-复位-还原同值, 等同 no-op
    known_gap: "cls 自体在 \\documentclass 内加载 fontspec 的极端序仍盖 (hook 先于类载入); 多 docclass \\if 分支各臂同注, hook 幂等"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0806.3286/1003.5240/1206.0576 (arximspdf.cls:227) + 1012.1161 (arxstspdf.cls:181)",
          error: "fontspec-xetex.sty:4166 Control sequence \\c__fontspec_shape_{it_sc,sc_it,scit_it,scit_n}_tl already defined ×4",
        }
    stats: { fires: 4, status: proven } # 6638b4c 修复后 4-cell 回放实证 (tmp/fontspec-reprobe)
    source_ref: "tmp/wontfix-scout/verdict.md 裁决1 + work/fixprobe.tex 实测 0 错"

  # 2026-09-16 wave-2: already_def 泛化 (1003.0344/cond-mat-0501638) ——
  # 稿自带 \newcommand{\Ref}[1]{(\ref{#1})} 撞包先定义 (varioref 系),
  # thm_sibling_strip 只剥 sibling= 够不到。作者意图是自家定义胜出 →
  # \newcommand→\renewcommand 字面换词 ([n]{body} 槽位原样保留)。
  - id: already_def_newcmd_renew
    mechanisms: [W45, W49]
    description: "\\newcommand{\\X} 撞包先定义 → 换 \\renewcommand (作者书写面胜出)"
    phase: loop
    order: 111
    when: { category: already_def, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\newcommand(\\s*\\*?\\s*)\\{?\\s*\\\\{payload}(?![a-zA-Z@])\\s*\\}?",
              repl: '\\renewcommand\g<1>{\\{payload}}',
            }
    risk: low # renew 保留作者定义; 对自重复定义场景同样收敛
    known_gap: "newenvironment/DeclareRobustCommand/\\def 形撞名未覆盖 → applied=False; 稿内双 \\newcommand{同X} 时首个也被换成 renew (renew 未定义 cs 会新炸, 罕见)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop2-delta already_def×2 (1003.0344, cond-mat/0501638)",
          error: "Command \\Ref already defined",
        }
    stats: { fires: 0 }
    source_ref: "wave-2: already_def 类目首个泛化消费规则"

  # ── 2026-09-17 partial-taxonomy 包间撞名中性化 ──
  # 新签 "LaTeX cmd Error: Command '\X' already defined" (ltcmd 层
  # \NewDocumentCommand 严格化) 与 ntheorem "Theorem style X already defined"
  # 都不被 renew 规则覆盖: 重定义方在包内 (非作者书写面)。清位语义 = 让
  # 后加载包赢——\let\<cs>\@undefined 同时骗过两代检查 (\ifcsname 假阴性
  # 走 undefined 分支, \ifdefined 见 undefined 义; \relax 形只够前者)。
  - id: ntheorem_style_undefine
    mechanisms: [W49]
    description: "amsthm 预定义 th@<style> 撞 ntheorem 自检 → \\usepackage{ntheorem} 前清 th@X 位"
    phase: loop
    order: 112 # renew(111) 之后: doc 侧 \newcommand 撞名仍先走 renew
    when: { category: already_def, payload_required: true }
    condition: { ctx_suggests: "Theorem style" }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\(?:usepackage|RequirePackage)(\\s*\\[[^\\]]*\\])?\\s*\\{ntheorem\\}",
              repl: '\\makeatletter\\let\\th@{payload}\\@undefined\\makeatother\n\g<0>',
            }
    risk: medium # amsthm 的 th@X 样式被 ntheorem 定义覆盖 —— 作者装 ntheorem 即意图
    known_gap: "多包连环定义 th@X 时逐轮收敛; ntheorem 经 \\input 间接装载未锚"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1306.0281 (partial-taxonomy)",
          error: "ntheorem.sty:524 Theorem style plain already defined (shim acmart→amsthm 预定义)",
        }
      - {
          corpus: "1306.0281 复跑 (fixer-alreadydef-2026-09-17)",
          error: "修复前 repl 吞 usepackage 行 → undefined_cs:g 103 错; 修复后 already_def 清除, 残 undefined_cs:numberofauthors",
        }
    stats: { fires: 2, status: verified }
    source_ref: "partial-taxonomy-2026-09-17 散件; ntheorem.sty L515-522 自检; fixer-alreadydef 复跑订正 \\g<0>"

  - id: already_def_undefine
    mechanisms: [W49]
    description: "包内 \\NewDocumentCommand 撞先定义 → docclass 后 \\let\\<cs>\\@undefined 清位 (寄存器/盒型分配名护栏, 后加载者赢)"
    phase: loop
    order: 113 # ntheorem_style_undefine(112) 之后 —— 只接 Command 形签名
    when: { category: already_def, payload_required: true }
    condition: { ctx_suggests: "Command" }
    action:
      kind: builtin_transform # regex→builtin 升级: 规则层做不了寄存器护栏
      function: undefine_for_redef # \newbox/\newcount/\newif 族分配名 abstain
    risk: medium # 清掉包/类侧先定义让后载包重定义 —— doc 侧 \newcommand 撞名已由 renew 先行
    known_gap: "寄存器/盒型分配名 (\\newbox\\splitbox 族 + \\newif 伴生 \\Xtrue) 弃权交 LLM; usepackage 链内后定义者 (A 先 B 后, 非 docclass 位) 清位时机过早无效"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1706.07911 (partial-taxonomy)",
          error: "fontspec-xetex.sty:672 Command '\\liningnums' already defined (bundled acmart v1.39→libertine 先定义, inject ctex→fontspec 后撞)",
        }
      - {
          corpus: "1706.07911 复跑 (fixer-alreadydef-2026-09-17)",
          error: "修复前 repl 吞 documentclass 行 → 508 错 best_effort_pdf; 修复后 liningnums 清除, 残 missing_file:binhex.tex",
        }
      - {
          corpus: "2211.04482 (fixer-bblwall-2026-09-17 A5)",
          error: "aastex62.cls \\newbox\\splitbox 被 undefine → adjustbox 占名 → 类内 \\setbox\\splitbox Missing number",
        }
    stats: { fires: 1, status: verified }
    source_ref: "partial-taxonomy-2026-09-17 散件; \\let\\X\\@undefined 两代检查通吃; fixer-bblwall A5 升级 builtin (eol+1 缝 + 寄存器护栏)"

  # ─── o2-builtin-cs (m1b-residue-routes-2026-09-17 §3): AMS 上古字体 cs ──
  # hep-th/9703214: AMS 时代稿用 \<size><fam> 缩名 (\fivmi/\tensy 族),
  # \font 定义躺在 \doit{0} 死宏参块 → 活 \skewchar\fivmi/\textfont9=\tenex
  # 全链 undefined_cs ×83 (非 missing_tfm —— 无 \font 装载动作,
  # install_tfm 接不到)。shim = docclass 后 \font\<cs>=<cm 等价>
  # (fivmi→cmmi5, elvrm→cmr10 at 10.95pt): 先绑定后定义赢序, 稿内
  # 后到的活 \font/\def 仍覆盖, 只对真缺定义位生效。
  - id: ams_font_cs_shim
    mechanisms: [W96]
    description: "AMS 上古字体缩名 cs (\\<size><fam>: \\fivmi/\\tenmib 族) 用而未定义 → \\font\\<cs>=CM 等价注入"
    phase: loop
    order: 162 # biblatex_bbx_rename(161) 与 physics_stub_detach(163) 之间 —— journal_cs_polyfill(160) 不收的先截
    when: { category: undefined_cs, payload_required: true }
    action:
      kind: builtin_transform
      function: font_cs_shim # params.sizes/fams 可扩表; payload 不匹 <size><fam> 模式即落穿
    risk: low # 窄谓词 (<size><fam> 全词锚) + 死定义豁免 (\\def 系有定义证据不接管); 先绑后定义赢序
    known_gap: "非 <size><fam> 形字体 cs 不收; 死块 \\font 定义不可见 → 报错名恒重注 (可见 \\font 定义必为死定义)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "hep-th/9703214 (m1b-residue-routes-2026-09-17 §3, 83 errs)",
          error: "l.201 \\skewchar\\fivmi → Undefined control sequence (fivmi..twfvmi mi+sy 族, \\doit{0} 死块内 \\font 定义不执行)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "peer1-residue-routes.md §3; AMS 命名 <size>mi/sy/ex/bf 谱 (amsfonts 2.x 上古档通用)"

  # 2026-09-17 fixer-filemap (1706.07911): comment.sty 排除扫描器逐行找
  # 顶格 `\end{<env>}`; 源生 tab/空格缩进的 \end 行不匹配 → 扫到 EOF
  # runaway。detab 全部 \end{ 行首: verbatim/minted 体内字面 \end 行
  # 会被去缩进 (显示位移, 可接受) —— 不修则整篇无 PDF。
  - id: detab_end_scanlines
    mechanisms: [W07]
    description: "缩进 \\end{env} 行去前导空白 —— comment.sty 排除扫描器要求顶格终结行"
    phase: loop
    order: 164 # biblatex_bbx_rename(161) 与 cs_targeted_fix(165) 之间
    when: { category: runaway_scan }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - { pattern: "(?m)^[ \\t]+(\\\\end\\{)", repl: "\\g<1>" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1706.07911 (stagerun-loop1; fixer-filemap-2026-09-17)",
          error: "File ended while scanning use of \\next (comment.sty CCSXML 排除 env, 源生 tab 缩进 \\end{CCSXML})",
        }
    stats: { fires: 0, status: proposed }
