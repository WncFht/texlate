  # 未闭合 \if* → 文件尾 \fi 注入双臂 (failmine item 4, 16 格)。
  # other 臂: `! Incomplete \iffalse/\ifnum` 首错 (taxonomy 无专属条目 →
  # `^.` 兜底归 other, ctx_suggests 可及)。脚本对 doc 源件做注释剥离后的
  # \if*/\fi 栈平衡扫描, 只对"活区"亏格文件在 \end{document}/\endinput/EOF
  # 前补 \fi —— def 体内 open 是冻结 token (file-end \fi 够不到, 注入反而
  # 造 Extra \fi), 只计不注; 跨文件借用对 (\if 开 A 件 \fi 闭 B 件) 由全局
  # opens>closes 闸兜住不注。扫描器即 phantom 判别器: draftsty 类展开态
  # \iffalse (包内 edef 吞文件) 源件字面平衡 → 纯 noop 不误伤。
  - id: unclosed_if_close
    mechanisms: [B05]
    description: "doc 源件未闭合 \\if* → \\end{document}/\\endinput/EOF 前注入 \\fi (other 臂: Incomplete \\if 首错)"
    phase: loop
    order: 196 # pdfstring_cs_disarm(193)/80-bib(195) 之后, undefined_cs_guess(900) 之前; draftsty 补丁(11.95) 先拿 phantom
    when: { category: other }
    condition:
      ctx_suggests: "Incomplete \\\\if"
      tool_available: python3
    action:
      kind: run_tool
      params:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path

            try:
                from texlate.textutil import scan_ifs
            except Exception:
                scan_ifs = None

            MARK = "texlate-fixloop-injected"
            EXTS = {".tex", ".sty", ".cls"}

            if scan_ifs is None:
                print("ifclose: noop (texlate mask unavailable)")
                raise SystemExit(0)
            files = []
            for p in sorted(Path(".").rglob("*")):
                if not p.is_file() or p.suffix.lower() not in EXTS:
                    continue
                if any(part.startswith(".") for part in p.parts):
                    continue
                files.append(p)
            tot_opens = tot_closes = tot_phantom = 0
            deficits = []  # (path, n_unclosed, boundary)
            for p in files:
                try:
                    text = p.read_text(encoding="utf-8", errors="replace")
                except OSError:
                    continue
                if MARK in text:
                    continue
                r = scan_ifs(text)
                tot_opens += r.live_opens
                tot_closes += r.live_closes
                tot_phantom += len(r.phantoms)
                if r.unclosed_live:
                    deficits.append((p, len(r.unclosed_live), r.boundary))
            # noop if no deficit, or opens<=closes globally (cross-file borrowed
            # pair: \if in file A closed by \fi in \input'd file B works at runtime)
            if not deficits or tot_opens <= tot_closes:
                print(
                    f"ifclose: noop opens={tot_opens} closes={tot_closes} "
                    f"deficits={len(deficits)} phantom={tot_phantom}"
                )
            else:
                for p, n, boundary in deficits:
                    text = p.read_text(encoding="utf-8", errors="replace")
                    line_start = text.rfind("\n", 0, boundary) + 1
                    inject = (
                        "\\fi" * n
                        + f" % {MARK}: closed {n} unclosed \\if* at file end\n"
                    )
                    p.write_text(
                        text[:line_start] + inject + text[line_start:],
                        encoding="utf-8",
                    )
                    ln = text[:line_start].count("\n") + 1
                    print(f"ifclose: injected \\fi x{n} into {p} @line~{ln} phantom={tot_phantom}")
        timeout: 30
    risk: low # 仅活区亏格件补 \fi (全局 opens>closes 才注); def 体 opens 只计不注 (file-end \fi 够不到冻结 token); 跨文件借用对/phantom 全局平衡 noop; 指纹幂等
    known_gap: "def 体内未闭合 open (aastex61.cls \\if@two@col 于 \\def\\endrotatetable* 体 —— 1706.00175 等 5 格真凶) 需 \\fi 注在体 `}` 前 (中段注入), 本规则按简报只做 file-end 注 → 记 def_unclosed 不修; \\if 开在 \toks/宏体寄存器赋值体 (\\mytoks={\\ifx}) 误计 live; 顶层外子目录经 rglob 已盖但 dot-dir 略过"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus_v3 failmine-4: 1206.0701/1306.0364 (loop2 \\iffalse), 0905.0193+1706.00175 等 (loop1 \\ifx)",
          error: "Incomplete \\iffalse; all text was ignored after line N (首错 `!` 形 → other); \\end occurred when \\ifx on line N was incomplete → early_eof",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-failmine/rule_targets.txt item4; 12 格抽样全字面平衡 (phantom 主导) —— 扫描器即判别器, 修复面兜底真亏格稿"

  # early_eof 臂: `\end occurred when \ifx on line N was incomplete` + `No
  # pages of output` → early_eof (pay=\ifx) —— 该签名无 `!` 行 → err_head
  # 空 → ctx_suggests 不可及, 故独立规则走 source_contains 门 +
  # payload_required (滤掉 generic no-pages 与 inside-a-group 变体)。
  - id: unclosed_if_close_eof
    mechanisms: [B05]
    description: "doc 源件未闭合 \\if* → \\end{document}/\\endinput/EOF 前注入 \\fi (early_eof 臂: \\end occurred when \\ifX incomplete)"
    phase: loop
    order: 196.5 # unclosed_if_close(196) 同族姊妹臂; typein_neutralize(180) 抢早期 eof 首因先走
    when: { category: early_eof, payload_required: true }
    condition:
      source_contains: "\\\\if"
      tool_available: python3
    action:
      kind: run_tool
      params:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path

            try:
                from texlate.textutil import scan_ifs
            except Exception:
                scan_ifs = None

            MARK = "texlate-fixloop-injected"
            EXTS = {".tex", ".sty", ".cls"}

            if scan_ifs is None:
                print("ifclose: noop (texlate mask unavailable)")
                raise SystemExit(0)
            files = []
            for p in sorted(Path(".").rglob("*")):
                if not p.is_file() or p.suffix.lower() not in EXTS:
                    continue
                if any(part.startswith(".") for part in p.parts):
                    continue
                files.append(p)
            tot_opens = tot_closes = tot_phantom = 0
            deficits = []  # (path, n_unclosed, boundary)
            for p in files:
                try:
                    text = p.read_text(encoding="utf-8", errors="replace")
                except OSError:
                    continue
                if MARK in text:
                    continue
                r = scan_ifs(text)
                tot_opens += r.live_opens
                tot_closes += r.live_closes
                tot_phantom += len(r.phantoms)
                if r.unclosed_live:
                    deficits.append((p, len(r.unclosed_live), r.boundary))
            # noop if no deficit, or opens<=closes globally (cross-file borrowed
            # pair: \if in file A closed by \fi in \input'd file B works at runtime)
            if not deficits or tot_opens <= tot_closes:
                print(
                    f"ifclose: noop opens={tot_opens} closes={tot_closes} "
                    f"deficits={len(deficits)} phantom={tot_phantom}"
                )
            else:
                for p, n, boundary in deficits:
                    text = p.read_text(encoding="utf-8", errors="replace")
                    line_start = text.rfind("\n", 0, boundary) + 1
                    inject = (
                        "\\fi" * n
                        + f" % {MARK}: closed {n} unclosed \\if* at file end\n"
                    )
                    p.write_text(
                        text[:line_start] + inject + text[line_start:],
                        encoding="utf-8",
                    )
                    ln = text[:line_start].count("\n") + 1
                    print(f"ifclose: injected \\fi x{n} into {p} @line~{ln} phantom={tot_phantom}")
        timeout: 30
    risk: low # 同 unclosed_if_close: 活区亏格件才注, 全局平衡/def体/借用对 noop, 指纹幂等; early_eof 臂额外有 payload_required 闸
    known_gap: "同 unclosed_if_close (def 体中段注入缺位); 另: 裸 no-pages early_eof (pay=None) 与 inside-a-group 变体 (pay=None) 被 payload_required 滤掉 —— 未闭合 \\if 致 no-pages 但无 \\end-occurred 行的形态漏收"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus_v3 failmine-4 loop1 格 (0905.0193/1706.00175/1803.00054/1907.00128 等, taxonomy pay=\\ifx)",
          error: "(\\end occurred when \\ifx on line N was incomplete) + No pages of output → early_eof",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-failmine/rule_targets.txt item4; err_head 空无 `!` 行 → 与 other 臂分离独立 gating"

  # Missing \begin{document} @件装载: 随源 .sty 装载期调 \numberwithin 类
  # 排版 cs, 供方包 (amsmath) 却在更靠后的 \usepackage 行才装 → kernel
  # 对 preamble 期排版动作报 Missing \begin{document}。修 = 供方
  # \usepackage 前置到肇事 sty 的每个 live 消费方装载点; tex 肇事件
  # (main/\input) 无 usepackage 锚点 → docclass 缝顶补供方; cls/def/clo
  # 系 cls 内传递装载, 缝位鞭长莫及 → abstain (csfix2 lane)。
  - id: premature_cs_guard
    description: "Missing \\begin{document} @件装载 → 肇事 cs 供方包前置到消费方 \\usepackage 装载点 (\\numberwithin→amsmath)"
    phase: loop
    order: 196.7
    when: { category: syntax }
    condition:
      ctx_suggests: "Missing \\\\begin\\{document\\}"
    action:
      kind: builtin_transform
      function: premature_cs_guard
    risk: low # 供方 usepackage 前置语义保持 (kernel 幂等去重, 同文件先装站跳过); 无锚点 abstain
    known_gap: "cls/def/clo 肇事件无 usepackage 锚点 → abstain; \\input 装载消费件不收; cs_pkg 表外 cs decline; 非 file-line-error log 不定界不收"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2009.11053 (shipclscen; stagerun-rt1)",
          error: "mystyle.sty:33 Missing \\begin{document} — l.33 \\numberwithin 先于 ms.tex:48 amsmath",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-bbkresid/report.md csfix-batch2 queue; csfix2 lane"

  # phantom 臂: `Incomplete \if` 签名在同签下轮复发 = unclosed_if_close(196)
  # 字面扫描 noop 过——源件 \if*/\fi 平衡, 真凶是展开态 conditional:
  # \newif-setter 替换体 `\let\if@X\iffalse` 在 \edef/\xdef 扫描内 \let 惰性
  # 但 \if@X 执行 → 假 open 吞到 EOF (amsproc \@nmbrlistfalse / myectaart
  # \@forced@seriesfalse, 1206.0701/1306.0364 原文英文稿即炸 —— 上游
  # cls/TL 偏斜非 texlate 注入)。file-end \fi 修不了 (edef 参不闭, 还会
  # 造 Extra \fi)。修 = 脆弱前稿 cs 族 \protected let-wrap 重定义: eTeX
  # \protected 属性钉在 cs 本体, 不被 \let\protect\relax 剥除 → edef 扫描
  # 内整体带过, setter 链走不到。\AtBeginDocument 注入 (包重定义先跑完),
  # 逐 cs \ifdefined 闸。transform 内置凭据闸: ledger 无 196 的 ifclose:
  # 判词 (python3 缺位 cond-skip) → 字面亏格未排, 保守不收。
  - id: if_phantom_protect
    mechanisms: [B05]
    description: "phantom Incomplete \\if (字面平衡复发) → \\footnote/\\thanks+\\bf\\it\\rm\\sf\\tt\\sc\\sl eTeX \\protected 重定义 (@\\begin{document} 钩)"
    phase: loop
    order: 197.5 # unclosed_if_close(196)+eof 臂(196.5) 字面扫描先烧 dedup 位, 同签复发才轮到本规则 = phantom 判别
    when: { category: other }
    condition:
      ctx_suggests: "Incomplete \\\\if"
    action:
      kind: builtin_transform
      function: if_phantom_protect
    risk: low # let-wrap 保原义 (wrapper 无参直通原 cs 参扫); \ifdefined 闸不收未定义名; \AtBeginDocument 包后序位; 注入幂等 (snippet 指纹在件即跳)
    known_gap: "被护 \\footnote token 仍会进 running-head 流 (\\markboth 标记语境展开)——phantom 错消但眉行可能多一个 footnote mark/次序怪; 扫描器 verdict 缺席即不收 (与 196 强序耦合: 规则被禁/重排则本规则永不发); 字面+phantom 混合稿在 196 注入 \fi 后复发才收"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus_v3 flipcheck7: 1206.0701 (amsproc \\footnote-in-\\author → \\shortauthors→\\markboth edef 链), 1306.0364 (myectaart \\bf-in-\\title → \\xdef\\@argi 链)",
          error: "Incomplete \\iffalse; all text was ignored after line N (源件字面平衡, unclosed_if_close 纯 noop)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-ifclosegap: min8 (\\protected\\def\\footnote) + t2/m2 (\\protected\\def\\bf) 双臂 PDF 实证; min1-7 展开链 \\tracingifs 归因"

  # ── 2026-09-19 arraypream lane ──
  # array.sty \@mkpream 只改写 *-repeat 与 \NC@ 名, 其余 preamble 宏留字面
  # token → "Illegal pream-token (\X)" (kernel \@xexpast 全展开形原可吃,
  # 差异即 array 装载面)。aastex 时代 deluxetable 复合面两族:
  #   \@delspec 系 (aaspp4/aasms4 \tablehead → \tabular{\@delspec})
  #   \pt@format 系 (aastex.cls/emulateapj \def\pt@format{\string#1}
  #     + \pt@tabular/\@tabular{\pt@format} 调用站)
  # 修复 = call-站 \expandafter 一阶展开 + def-站 \edef 烘焙 (\string 在
  #   edef 内执行产字面 token; \expandafter 单展开 \string-bearing 宏留下
  #   \string 字面 → 仍 illegal, 两臂缺一不可)。
  # emulateapj \pt@tabular 另绑 array 中和掉的 kernel 存名
  #   (\let\@classz\@tabclassz / \let\@classiv\@tabclassiv → "Missing #"),
  #   臂3/4 整链删除 (连 \@acol 绑位一并——\@ptabacol 变种可能无定义,
  #   留绑反生 Undefined cs; array 默认 \@acol 兜底)。\s* 收行间空白防
  #   \par token 混入宏体。
  - id: pream_token_cs_expand
    mechanisms: [W86]
    description: "array 装载面 preamble 宏 token → call-站 \\expandafter + def-站 \\edef 烘焙 + emulateapj 死绑 let 链中和"
    phase: loop
    order: 198 # undefined_cs_guess(900) 之前; pream_token 新类无竞争消费者
    when: { category: pream_token, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\def(\\\\{payload}\\{\\\\string\\s*#1\\s*\\})",
              repl: "\\\\edef\\g<1>",
            }
          - {
              pattern: "\\\\(pt@tabular|@tabular|tabular)\\{\\s*\\\\{payload}\\s*\\}",
              repl: "\\\\expandafter\\\\\\g<1>\\\\expandafter{\\\\{payload}}",
            }
          - {
              pattern: "\\s*\\\\let\\\\@acol\\\\@ptabacol\\s*\\\\let\\\\@classz\\\\@tabclassz\\s*\\\\let\\\\@classiv\\\\@tabclassiv\\s*",
              repl: " ",
            }
          - {
              pattern: "\\s*\\\\let\\\\@classz\\\\@tabclassz\\s*\\\\let\\\\@classiv\\\\@tabclassiv\\s*",
              repl: " ",
            }
    risk: low # 字面 spec 展开只益 preamble; \edef 烘焙幂等; 死绑 let 在 array 面恒为 \relax 删之无损失
    known_gap: "CJK 字面 token (这/是/译/文 系 ~54 实例——译文漏 preamble 另一机制) 不落本类; 非 aastex 族 preamble 宏覆盖外; let 链序异/缺节变种 → 臂3 落空靠臂4, 皆空则 decline; \\gdef/\\xdef 形 def-站未覆盖"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "arraypream census 2026-09-19: records 内 cs-token 实例 \\@delspec×30/\\pt@format×11 (~7 cells: astro-ph/9901037/9901371 等)",
          error: "Package array Error: Illegal pream-token (\\@delspec): `c' used.",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "task #105; tmp/preamfix t2/t7/t8/t13 全链编译实证"

