# rules/80-bib.yaml — fixloop 规则库分片：文献链 —— bbl stub/regen/citekey/bbx 改名
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/00-base.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # 新增 (docs/spec/compile.md §6.3 80-bib 分片行): tectonic 自动 bibtex
  # 产 stub bbl 在内存层遮蔽真 bbl
  # (ctanfetch-probe §3.2 铁证: missing \item 真凶), 改写断链
  - id: bbl_stub_shadow
    mechanisms: [W06, W16, W36]
    description: "有 .bbl 无 .bib → \\bibliography{x} 改写 \\input{main.bbl}, 阻断 tectonic 自动 bibtex stub 遮蔽"
    phase: loop
    order: 140
    when: { category: syntax } # 表现形态: Something's wrong--perhaps a missing \item
    condition:
      engine_in: [tectonic]
      fileset: { has_ext: [.bbl], lacks_ext: [.bib] }
    action:
      kind: builtin_transform
      function: bbl_stub_rewrite
      params: { exts: [.tex] }
    risk: low
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 侧同症由 normalize.use_bundled_bibliography 无条件处理
    provenance:
      - {
          corpus: "2305.14335 (ctanfetch-probe §3.2)",
          error: "missing \\item @ \\end{thebibliography} (stub bbl 遮蔽 360 行真 bbl)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/spec/compile.md §6.3 (80-bib 分片行) / §6.6 (_builtins_bib: bbl stub 改写); ctanfetch-probe.md §3.2"

  # 2026-09-17 wave-2 (apj-bib-scout §S4, 11 格): ADS/apj.bst 时代 .bbl
  # cite-key 裸 &/_ 在现代内核炸 Missing $/Misplaced alignment tab ——
  # \bibitem 定义点与 \cite 引用点必须双侧一致重写 (&→A、_→-), .aux
  # 残留 \bibcite/\citation 陈旧键同源处理。
  - id: citekey_sanitize
    mechanisms: [W23]
    description: "旧 .bbl cite-key 裸 &/_ → \\bibitem/\\cite/aux 三侧一致重写"
    phase: loop
    order: 141 # bbl_stub_shadow(140) 之后, vendored_sty_shadow(150) 之前
    when: { category: syntax }
    condition:
      fileset: { has_ext: [.bbl] }
      # 两种 log 形态同盖: file-line-error 形 `ms.bbl:4: Missing $...` 与
      # '!' 形 `! Missing $ inserted.`（'!' 形文件名入 file_stack 不在
      # err_head——靠 builtin 自验 unsafe key 存在性兜底, 误签至多白扫一遍）。
      ctx_suggests: "Missing \\$ inserted|Misplaced alignment tab"
    action:
      kind: builtin_transform
      function: citekey_sanitize
    risk: low # 双侧一致改写; 无裸 &/_ 键即 no-op 自幂
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "apj-bib-scout-2026-09-17 §S4 (1003.1717/1206.5852/…×11)",
          error: ".bbl:N: Missing $ inserted / Misplaced alignment tab character &",
        }
    stats: { fires: 12, rescued_cells: 5, status: active }
    source_ref: "bench/results/apj-bib-scout-2026-09-17/report.md §S4"

  # 2009.11064 (stagerun-loop1): e-print 捆绑 biber <3.3 旧格式 .bbl,
  # TL biblatex 3.21 拒载 (\sortlist undefined / wrong format version);
  # .bcf+.bib 在场即 biber <stem> 就地重生成正确版本 .bbl (a5ba9a7 builtin)。
  - id: bbl_regen
    description: "bundled 旧版 .bbl 撞新 biblatex → biber <stem> 就地重生成 (.bcf 在场)"
    phase: loop
    order: 158 # shadow 族(155-157)同档: 结构性处置先于逐宏补
    when: { category: undefined_cs, payload_required: true }
    condition:
      fileset: { has_ext: [.bcf] } # .bcf 只在 biber 通路存在, 天然限定 biblatex 稿
      tool_available: biber
    action:
      kind: builtin_transform
      function: bbl_regen
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2009.11064 (stagerun-loop1)",
          error: "Undefined control sequence \\sortlist / File 'ms.bbl' is wrong format version",
        }
    stats: { fires: 28, rescued_cells: 7, status: active }
    source_ref: "builtins.py bbl_regen (a5ba9a7)"

  # 2026-09-17 fixer-apjbbx (1706.00240): bundled apj.bbx (2017,
  # biblatex≤3.7 期) 以 \bbx@patchmacro 补丁旧宏名; 3.8 改名
  # date+extrayear→+extradate / labelyear+extrayear→+extradate 后
  # find-text 与目标宏双失配 (旧名仅剩 authoryear.bbx provide-shim,
  # 体不含 patch find-text)。源级更名双侧对齐——不引 shim。
  # 尾险 (fragment §risk): 文件自带 *正向* shim
  #   \providebibmacro*{date+extradate}{\usebibmacro{date+extrayear}}
  # 且自身新名 patch 先失败时, 改写会成自指 → capacity 兜住,
  # 属换墙非静默腐蚀; 今零 acmauthoryear 格发 Cannot-patch。
  - id: biblatex_bbx_rename
    mechanisms: [B05]
    description: "bundled .bbx/.cbx/.sty 补丁 biblatex>=3.8 已改名宏 → 源级更名 date/labelyear+extrayear→+extradate"
    phase: loop
    order: 161 # journal_cs_polyfill(160) 与 cs_targeted_fix(165) 之间
    when: { category: cannot_patch_macro }
    action:
      kind: regex_rewrite
      params:
        exts: [.bbx, .cbx, .sty, .tex]
        rewrites:
          - { pattern: "date\\+extrayear", repl: "date+extradate" }
          - { pattern: "labelyear\\+extrayear", repl: "labelyear+extradate" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1706.00240 (stagerun-loop1; fixer-apjbbx-2026-09-17)",
          error: "Package biblatex Error: Cannot patch bibliography macro author / date+extrayear (bundled apj.bbx 2017 vs biblatex 3.21)",
        }
    stats: { fires: 7, rescued_cells: 1, status: verified }
    source_ref: "fixer-apjbbx-2026-09-17; apj.bbx L192-197 双点归因 + r1 rewrite in 1 files"

  # 2026-09-18 task t_c9249919e8d7a13f: tectonic bundle 钉 biblatex 3.17
  # (bcf 3.8) 但外调 biber 走系统 PATH (2.22 要 bcf 3.11) —— bundle 内
  # 无解的工具链错配, 一切 biblatex 稿在 tectonic 下必死。log 形态:
  # "! the external tool exited ..." 后 biber stdout dump 含
  # "Found biblatex control file version 3.8, expected version 3.11." —
  # head 窗盖到则类 toolchain_skew, 盖不到落 other; builtin 两级复核
  # (err_head 快径 → _fixloop_log 全文) 同收, 不中 False 让位后续 other
  # 规则。REJECT route=xelatex 令牌由 repair 跨引擎臂换编 (本地 TeXLive
  # biber/biblatex 成对)。order 8 殿前: 硬墙先路由, 不陪跑可修类。
  - id: biber_biblatex_skew_route
    mechanisms: [B05]
    description: "tectonic bundle biblatex ↔ 系统 biber bcf 版本错配 → REJECT route=xelatex 换引擎 (不改源)"
    phase: loop
    order: 8 # toolchain_skew/other 族首评: 硬墙先路由
    when: { any: [{ category: toolchain_skew }, { category: other }] }
    condition:
      engine_in: [tectonic]
    action:
      kind: builtin_transform
      function: biber_biblatex_skew_route
      params: { route: xelatex }
    risk: low # 不改源只发路由令牌; 签名自验不中即 False
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 侧 biber/biblatex 同源自 TeXLive, 无此错配
    provenance:
      - {
          corpus: "task t_c9249919e8d7a13f (arXiv 2609.18207v1, 2026-09-18)",
          error: "! the external tool exited / biber: Found biblatex control file version 3.8, expected version 3.11",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "_builtins_bib.py biber_biblatex_skew_route; repair.py cross_engine_retry reject_route 臂"

  # 2026-09-25 scale50 批实证 (t_0c9a/2609.20470, t_dce88/2609.19713,
  # t_a4ae/2510.22418): tectonic bib 管线双盲区——
  # (a) 内嵌 Rust bibtex 特定输入死循环: tex pass 出 xdv 后
  #   ``note: Running BibTeX on main.aux`` 即无输出烧满 240s 墙钟落
  #   timeout (系统 bibtex 同 .aux 秒过);
  # (b) tectonic 不看 .bbl 在席强跑 biber: src 只发 main.bbl 未发
  #   references.bib 时 ``! can't open path`` 落 other 硬毙 (xelatex
  #   _bib_pass bbl 在席整臂跳过)。
  # 两臂签名走 builtin 两级复核 (err_head → _fixloop_log); REJECT
  # route=xelatex 令牌同 skew_route 跨引擎臂换编。order 8.1 贴 skew(8)
  # 后: 同族硬墙先路由。
  - id: tectonic_bib_stall_route
    mechanisms: [B05]
    description: "tectonic bibtex 挂死/bbl在席缺.bib 强跑 biber 毙 → REJECT route=xelatex 换引擎 (不改源)"
    phase: loop
    order: 8.1 # skew_route(8) 后: 工具链硬墙族先路由
    when: { any: [{ category: timeout }, { category: other }] }
    condition:
      engine_in: [tectonic]
    action:
      kind: builtin_transform
      function: tectonic_bib_stall_route
      params: { route: xelatex }
    risk: low # 不改源只发路由令牌; 签名自验不中即 False
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 侧 bib 工具链全由系统件承担, 无此盲区
    provenance:
      - {
          corpus: "scale50 批 t_0c9a3e4159db8ffb (arXiv 2609.20470v1, 2026-09-25)",
          error: "unfixable:timeout — note: Running BibTeX on main.aux 后静默烧墙钟",
        }
      - {
          corpus: "scale50 批 t_dce88d3272e1fd5e (arXiv 2609.19713v1, 2026-09-25)",
          error: "unfixable:timeout — 同 bibtex 挂死签名 (120 页)",
        }
      - {
          corpus: "scale50 批 t_a4ae1dea34e2bf45 (arXiv 2510.22418v1, 2026-09-25)",
          error: "unfixable:other — ! can't open path `references.bib` (main.bbl 在席)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "_builtins_bib.py tectonic_bib_stall_route; repair.py cross_engine_retry reject_route 臂"

  # 2026-09-18 natbib-lane (astro-ph/0307344, stagerun-rt1): natbib_numbers_pass
  # (95-targeted order 186) 的 (\\begin\{document\}) 重写无注释遮盖——注释行
  # 提到 \begin{document} 的被 \n 尾巴切成两半, "command."/"." 尾脱注释成
  # 行首活 \begin{document} (ms.tex:172/198), 首个活行在 \NAT@numberstrue
  # 注入位 (:285) 之前触发 aux 读 → compat 炸 (ms.aux:32) + preamble-only
  # 级联 (103 err)。aux purge 无用——裂伤在 tex 层。本规则收伤: 行首
  # \begin{document} 带可见尾文 (排除尾挂注释) 且后文另有行首者重注释;
  # 唯一带尾文的合法 \begin{document}Hello 形由 lookahead 门保住。
  - id: begindoc_tail_recomment
    mechanisms: [W117, W126]
    description: "注入式 rewrite 注释切分裂伤 → 带尾文的行首孤立 \\begin{document} 重注释 (后起行首 \\begin{document} 门)"
    phase: loop
    order: 194 # natbib_numbers_pass(186) 裂伤兜底, 同签下轮收
    when: # 两臂签名分归 bib_compat/preamble_only (taxrow 行) —— other 保兼容
      any:
        - { category: other }
        - { category: bib_compat }
        - { category: preamble_only }
    condition:
      ctx_suggests: "Bibliography not compatible with author-year|Can be used only in preamble"
      source_contains: "\\n\\\\begin\\{document\\}[^\\S\\r\\n]*[^\\s%]"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "^\\\\begin\\{document\\}(?=[^\\S\\r\\n]*[^\\s%][\\s\\S]*^\\\\begin\\{document\\})",
              repl: "%\\g<0>",
              flags: [MULTILINE],
            }
    risk: low # 仅重注释裂伤活行; lookahead 门保唯一带尾文 \begin{document} 合法稿
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "astro-ph/0307344 (stagerun-rt1)",
          error: "ms.aux:32 natbib compat + ms.tex:198/222/223 preamble-only 级联 — natbib_numbers_pass 注释切分裂伤",
        }
    stats: { fires: 1, rescued_cells: 1, status: active }
    source_ref: "natbib.sty:974 \\NAT@force@numbers; ms.tex:172/198 裂伤行 vs :285 注入位"

  # 2026-09-19 failmine item 2 (4 格): natbib_numbers_pass (95-targeted
  # order 186) preamble 末翻 \\NAT@numberstrue, 使 natbib \\AtEndDocument
  # 向 aux 写 \\NAT@force@numbers 空转——只挡 FUTURE 写; 先前编译留下的
  # .aux 已含 "\\providecommand\\NAT@force@numbers{}\\NAT@force@numbers"
  # 行 (natbib.sty:967-968 写面), 次遍 \\begin{document} 期 aux 读仍炸
  # "Bibliography not compatible with author-year citations"——同签复炸
  # 而 numbers_pass 已 applied 不再点火。整行剥除: aux 族可再生,
  # numbers_pass 在位即无再写源, 剥一次即净。
  - id: natbib_aux_force_purge
    mechanisms: [W117, W126]
    description: "陈旧 .aux 残留 \\NAT@force@numbers 强制行 → 整行剥除 (numbers_pass 已挡再写)"
    phase: loop
    order: 195 # begindoc_tail_recomment(194) 同签族殿后: tex 层裂伤先收, aux 残毒后剥
    when: # .aux:NN file-line 签名 taxrow 归 bib_compat; other 保兼容
      any:
        - { category: other }
        - { category: bib_compat }
    condition:
      ctx_suggests: "Bibliography not compatible with author-year"
      fileset: { has_ext: [.aux] }
    action:
      kind: regex_rewrite
      params:
        exts: [.aux]
        rewrites:
          - {
              pattern: "^[^\\n]*\\\\NAT@force@numbers(?![a-zA-Z@])[^\\n]*\\n?",
              repl: "",
              flags: [MULTILINE],
            }
    risk: low # aux 可再生; 仅含标记的行整删余行逐字节不动; 无标记 0 命中不点火
    known_gap: "\\NAT@force@letters (authoryear 强制臂) 未收——inverse 病理无实证格; 其他强制标记同理留待实证"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0707.1345, astro-ph/0307344, astro-ph/0408113, astro-ph/0501630 (failmine loop2)",
          error: ".aux:NN: Package natbib Error: Bibliography not compatible with author-year citations (stale aux \\NAT@force@numbers)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-failmine/rule_targets.txt item 2; natbib.sty:967-968 \\AtEndDocument aux 写面"

  # ── 2026-09-20 armgap4 (2605.29672 fired_ineffective) ──
  # biblatex backend=bibtex: bibtex 是 8-bit 工具, 行包 (~2000B) 劈断
  # multibyte UTF-8 → 产出 .bbl 带非法序列 → warnings invalid_utf8 升级
  # warn_utf8 轮 (纯 warn-only fail)。毒件是引擎每遍重生成的 .bbl ——
  # non_utf8_source(95) 的 recode exts 不含 .bbl 且下遍再腐, 永不收敛。
  # 修 = biblatex 装载行 backend=bibtex → biber: biber 全 UTF-8, 下遍
  # .bcf→biber 通道产净 .bbl。三闸: .bcf 在场 (biblatex 稿天然限定,
  # bbl_regen 同口径) + 源有 backend=bibtex + biber 可执行。order 置
  # warn_utf8 消费族尾: misschar 臂(25.x)/non_utf8_source(95) 先评 —
  # latin1 .bib 先转码, 本臂只兜 bibtex-8bit 生成面腐 (同签共存稿各臂
  # 按序收不互抢)。
  - id: bib_backend_biber_swap
    description: "biblatex backend=bibtex (8-bit 劈 UTF-8 腐 .bbl) → backend=biber (全 UTF-8 通道)"
    phase: loop
    order: 195.5 # non_utf8_source(95) 先转码源件; 本臂兜 bibtex 生成面腐
    when: { category: warn_utf8 }
    condition:
      fileset: { has_ext: [.bcf] } # .bcf 只在 biber 通路存在, 天然限定 biblatex 稿
      source_contains: "backend\\s*=\\s*bibtex\\b"
      tool_available: biber
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*\\[[^\\]]*?)backend\\s*=\\s*bibtex\\b(?=[^\\]]*\\]\\s*\\{[^}]*\\bbiblatex\\b[^}]*\\})",
              repl: "\\g<1>backend=biber",
              match_surface: "masked",
            }
    risk: medium # 后端切换改参考文献产出路径; biber 本是 biblatex 默认通路, 其余选项原样保留
    known_gap: "backend=bibtex8 (同 8-bit 腐) 词界不收——实证格后再扩; 默认 backend (无显式键) 不改写; 已腐 .bbl 靠下遍重生成自愈"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2605.29672 (armgap4 census; stagerun-overnite-2026-09-20)",
          error: "invalid_utf8 ×4 @ splice/*.bbl — bibtex 8-bit 行包劈断 UTF-8 (.bib 本体净, recode 0 命中)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-armgap4/census.md §2605.29672; engine _bib_pass .bcf→biber 通道"

  # ════════════════════════════════════════════════════════════════
  # 2026-09-28 qc-impl (vault QC replay 诊断蒸馏 impl-rules.json,
  #   合流 IDX 0/17/28/36/49 + 26/45): warn 管线消费臂 + bib 预检小件。
  #   全部新条挂 conservative risk + qc-impl provenance; builtin 只引
  #   已注册名 (bbl_regen/purge_corrupt_intermediates)。
  # ════════════════════════════════════════════════════════════════

  # warn_bbl_version → bbl_regen (IDX 0/28/49 合流, warn_id 统一
  # bbl_version): biblatex 'wrong format version' 警告稿无 '!' 行, 原
  # bbl_regen(:74) 的 undefined_cs+payload_required 门永不点火。本规把
  # warn 面格送进同一 builtin: fmt<3.0 隔离臂无需 .bcf, fmt 3.x+.bcf
  # 走 biber 重生成; 无 .bib 的 3.1/3.2 格 builtin 内 biber 自删有
  # .fixloop-bak 回滚兜 (bbl_format_version_rewrite builtin 已写体未
  # 注册——注册后加 lacks_ext:[.bib] 前置臂接 fmt3.x 再生无路面)。
  - id: bbl_version_regen
    description: "warn_bbl_version (.bbl 头标版本拒载警告) → bbl_regen 隔离/重生成"
    phase: loop
    order: 158.5 # bbl_regen(158) 同簇 warn 入口
    when: { category: warn_bbl_version }
    condition:
      fileset: { has_ext: [.bbl] }
      tool_available: biber
    action:
      kind: builtin_transform
      function: bbl_regen
    risk: low # builtin 自带 .bcf 完整性门 + fmt<3.0 隔离 + fmt≥3.0 备份回滚
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "qc replay bbl-format 桶 21 格 (2112.00121/2208.00058/2302.00046 verbatim dump 13 + author-hash 4 + 等)",
          error: "Package biblatex Warning: File 'x.bbl' is wrong format version - expected 3.3 → 裸 sortlist/authorhash 排印",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX0/IDX28/IDX49"

  # 'No file X.bbl'/'File x.bbl not found' 型 missing_file → bbl_regen:
  # .bcf 在场 = biblatex 稿, biber <stem> 直接生出缺失 .bbl; 比
  # install_file 语义对路 (.bbl 是生成件非可装包)。2601.09875 同签名
  # 的 warning-only 变体由 warn_undef_ref 面 bbl_cite_undef_regen 收
  # (该格零 '!' 错, missing_file 类不到)。
  - id: bbl_missing_regen
    description: "missing_file payload=*.bbl + .bcf 在场 → biber <stem> 就地再生成"
    phase: loop
    order: 158.6 # 装包臂耗尽后的生成件救济位
    when: { category: missing_file, payload_required: true }
    condition:
      ctx_suggests: "(No file|File) [`'][^`'\\n]*\\.bbl"
      fileset: { has_ext: [.bcf] }
      tool_available: biber
    action:
      kind: builtin_transform
      function: bbl_regen
    risk: low # builtin .bcf 完整性门 + 备份臂; 不碰 .tex
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2601.09875 (qc xlat_broken_refs/vis 桶)",
          error: "No file 13thJan.bbl + There were undefined references (28 Citation-undefined, 15pp pdf)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX0/IDX17"

  # warn_undef_ref → bbl_regen (IDX17b/49 合流): Citation-undefined 存留
  # + .bcf 在场 = 末遍 bib 趟缺跑/陈旧 .bbl; biber 重生成 + needs_pass
  # 续趟把新 .bbl 的 \\bibcite 面写回 .aux。消耗轮序在注入臂前:
  # 根因格再生即解, 注入臂兜 cls/pagerange 类签名。
  - id: bbl_cite_undef_regen
    description: "warn_undef_ref + .bcf → bbl_regen 重跑 bib 趟 (stale/缺席 .bbl 的 cite-undef 根因臂)"
    phase: loop
    order: 158.7 # warn_undef_ref 消费族首臂: bib 根因先于标签注入
    when: { category: warn_undef_ref }
    condition:
      fileset: { has_ext: [.bcf] }
      tool_available: biber
    action:
      kind: builtin_transform
      function: bbl_regen
    risk: low # biber rc≠0/bcf 截断/在席 bbl 皆有 builtin 内闸与备份
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2212.00026 + 2601.09875 warn-only 变体 (qc xlat_broken_refs)",
          error: "There were undefined references / Citation undefined ×28 — .bcf 在席而 .bbl 缺席或陈旧",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX17(b)/IDX49 合流"

  # ── pagerange/endlabel 注入族 (IDX36/54 合流, builtin
  #    pagerange_label_inject 未注册 → 逐键 lookahead 闸 + 字面注入的
  #    regex_rewrite 同义表达) ──
  # 机理: 类模板约定 \\pagerange{\\pageref{firstpage}--\\pageref{lastpage}}
  #   靠作者手放 \\label{firstpage}/\\label{lastpage}; 缺标签 → 'Reference
  #   firstpage undefined'。注入点位字面: firstpage 紧随 \\begin{document}
  #   (页 1), lastpage 紧贴 \\end{document} 前 (末页)。不走
  #   \\AtEndDocument——0707.3683 jpsj 自定义 \\enddocument 早关 aux,
  #   钩内 \\label 可能落 aux 关闭后; 字面注入先于关序。
  # condition 单键三判 (regex 模块 lookahead): \A 锚 (?!...\\label{key}
  #   存活行不存在——% 前缀注释行不算活) ∧ (?=...ref 族用键) ∧ 中性体。
  - id: pagerange_firstpage_inject
    description: "warn_undef_ref + ref 族用 firstpage 而 \\label{firstpage} 缺席 → \\begin{document} 后注标签"
    phase: loop
    order: 158.8
    when: { category: warn_undef_ref }
    condition:
      source_contains: "(?sm)\\A(?!.*?^[^%\\n]*\\\\label\\s*\\{\\s*firstpage\\s*\\})(?=[\\s\\S]*?\\\\(?:pagerange|pageref|autoref|nameref|eqref|[cCvVf]?ref|labelref)\\b[^}\\n]{0,80}?\\bfirstpage\\b)[\\s\\S]"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\begin\\{document\\}",
              repl: "\\g<0>\n\\\\label{firstpage}% fixloop-qlabel",
              match_surface: "masked",
            }
    risk: low # 键缺席门 + masked 面; 注入即 \\label 幂等 (再轮 label 存活即不再点)
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1306.0005, 1607.00383, 1607.00386 (qc xlat_broken_refs)",
          error: "LaTeX Warning: Reference `firstpage' undefined — \\pagerange{firstpage--lastpage} 约定标签缺放",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX36/IDX54"
    known_gap: "cls 内部引用键 (revtex LastBibItem/totpages TotPages) 源面无 ref-use 字面, 本规不盖——须 log 键提取 builtin (pagerange_label_inject 未注册)"

  - id: pagerange_lastpage_inject
    description: "warn_undef_ref + ref 族用 lastpage 而 \\label{lastpage} 缺席 → \\end{document} 前注标签"
    phase: loop
    order: 158.9
    when: { category: warn_undef_ref }
    condition:
      source_contains: "(?sm)\\A(?!.*?^[^%\\n]*\\\\label\\s*\\{\\s*lastpage\\s*\\})(?=[\\s\\S]*?\\\\(?:pagerange|pageref|autoref|nameref|eqref|[cCvVf]?ref|labelref)\\b[^}\\n]{0,80}?\\blastpage\\b)[\\s\\S]"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\end\\{document\\}|\\\\enddocument\\b",
              repl: "\\\\label{lastpage}% fixloop-qlabel\n\\g<0>",
              match_surface: "masked",
            }
    risk: low # 同 firstpage 臂; \\enddocument 裸形 (jpsj) 同收
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1107.0455, 1107.0726, 2208.00008, 2607.09718, 0707.3683 (qc xlat_broken_refs)",
          error: "LaTeX Warning: Reference `lastpage' undefined — mnras/mn2e pagerange 约定标签缺放/被注释",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX36/IDX54"
    known_gap: "末页尾随浮体 (\\end{document} 的 \\clearpage 批放) 落点晚于注入位 → lastpage 页码可能偏早一页; 语义近似优于 ?? 未解"

  # warn_undef_ref → purge_corrupt_intermediates (IDX17b 窄臂): 引用断链
  # 且 .aux/.bbl/.blg 有真损坏件 (utf-8 劈断/末行截断) 时清场, 下遍
  # 引擎重写干净件即收。builtin 损坏谓词自门——健康陈旧 aux 不删
  # (2212.00026 型陈旧键面由 bbl_cite_undef_regen+续趟覆盖)。
  - id: cite_undef_aux_purge
    description: "warn_undef_ref + 损坏中间件在席 → purge_corrupt_intermediates 清 aux/bbl/blg"
    phase: loop
    order: 159.0 # 注入族后殿后: 断链且中间件损坏才清
    when: { category: warn_undef_ref }
    condition:
      any:
        - { fileset: { has_ext: [.aux] } }
        - { fileset: { has_ext: [.bbl] } }
    action:
      kind: builtin_transform
      function: purge_corrupt_intermediates
      params: { exts: [.aux, .bbl, .blg] }
    risk: low # builtin 损坏谓词 (utf-8 fail/末行不完整) 自门; 全健康即 decline
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2212.00026 (qc xlat_broken_refs)",
          error: "There were undefined references — 陈旧/损坏 aux 键面残响",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX17(b)"
    known_gap: "健康陈旧 aux (well-formed 但键过期) 不满足损坏谓词不删——真 stale-aux 面靠续趟重写覆盖"

  # invalid_char 归口 + 报错落 .bbl → 控制字节剥除 (IDX45 的
  # bbl_ctrl_sanitize builtin 未注册 → regex 同义): 0x00-08/0B/0C/0E-1F
  # 裸控制字节在 .bbl 内逢必杀 (合法 bbl 文本无此面)。ctx_suggests 钉
  # 报错文件面到 .bbl, 不碰 .tex 源。
  - id: bbl_ctrl_bytes_strip
    description: "invalid_char @ .bbl → 剥 [\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f] 控制字节"
    phase: loop
    order: 159.2 # bbl 面件注入族后
    when: { category: invalid_char }
    condition:
      ctx_suggests: "\\.bbl"
      fileset: { has_ext: [.bbl] }
    action:
      kind: regex_rewrite
      params:
        exts: [.bbl]
        rewrites:
          - { pattern: "[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]", repl: "" }
    risk: low # 非法控制字节无保留义; 剥后拼接不改变合法文本语义
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2407.06789 (qc xlat_broken_refs)",
          error: "bbl 读死在 entry ~9 —— 0x0B 控制字节嵌 {\\x0B{S}}umak, 143 hits 全下游 cite",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX45 (builtin bbl_ctrl_sanitize 未注册 → regex 同义)"

  # 1003.0045 (qc xlat_residual_en): 稿面 .bbl 残留 \\bibinfo{a}{v} 壳
  #   —— revtex/aps 系标记宏, 宿主类不定义即裸 cs 断链。剥壳留值
  #   \\bibinfo{a}{v} → {v} 语义恒等 (revtex 稿该宏本就排版为
  #   分组值)。precheck 一次性面: .bbl 不在 source_blob 扩展集
  #   (.tex/.sty/.cls) → fileset 门 + rewrite 零命中自 decline。
  - id: bibinfo_disarm
    description: ".bbl 内 \\bibinfo{a}{v} 壳 → {v} 剥除 (宿主类无定义时的断链预拆)"
    phase: precheck
    order: 1 # static_precheck(0) 后: 装包落定再拆壳
    when: { always: true }
    condition:
      fileset: { has_ext: [.bbl] }
    action:
      kind: regex_rewrite
      params:
        exts: [.bbl]
        rewrites:
          - { pattern: "\\\\bibinfo\\s*\\{[^{}\\n]*\\}\\s*\\{", repl: "{" }
    risk: low # 壳剥语义恒等; 0 命中不点火
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1003.0045 (qc xlat_residual_en)",
          error: "\\bibinfo 残留在 .bbl —— 宿主类无定义即 undefined_cs",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX26"
