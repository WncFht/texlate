# rules/80-bib.yaml — fixloop 规则库分片：文献链 —— bbl stub/regen/citekey/bbx 改名
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # 新增 (docs/08:274): tectonic 自动 bibtex 产 stub bbl 在内存层遮蔽真 bbl
  # (ctanfetch-probe §3.3 铁证: missing \item 真凶), 改写断链
  - id: bbl_stub_shadow
    mechanisms: [W06, W16, W36]
    description: "有 .bbl 无 .bib → \\bibliography{x} 改写 \\input{main.bbl}, 阻断 tectonic 自动 bibtex stub 遮蔽"
    phase: loop
    order: 140
    when: { category: syntax } # 表现形态: Something's wrong--perhaps a missing \item
    condition:
      engine_in: [tectonic]
      fileset: { has_ext: [.bbl], lacks_ext: [.bib] }
    action:
      kind: builtin_transform
      function: bbl_stub_rewrite
      params: { exts: [.tex] }
    risk: low
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 侧同症由 normalize.use_bundled_bibliography 无条件处理
    provenance:
      - {
          corpus: "2305.14335 (ctanfetch-probe §3.3)",
          error: "missing \\item @ \\end{thebibliography} (stub bbl 遮蔽 360 行真 bbl)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L274; ctanfetch-probe.md §3.3"

  # 2026-09-17 wave-2 (apj-bib-scout §S4, 11 格): ADS/apj.bst 时代 .bbl
  # cite-key 裸 &/_ 在现代内核炸 Missing $/Misplaced alignment tab ——
  # \bibitem 定义点与 \cite 引用点必须双侧一致重写 (&→A、_→-), .aux
  # 残留 \bibcite/\citation 陈旧键同源处理。
  - id: citekey_sanitize
    mechanisms: [W23]
    description: "旧 .bbl cite-key 裸 &/_ → \\bibitem/\\cite/aux 三侧一致重写"
    phase: loop
    order: 141 # bbl_stub_shadow(140) 之后, vendored_sty_shadow(150) 之前
    when: { category: syntax }
    condition:
      fileset: { has_ext: [.bbl] }
      # 两种 log 形态同盖: file-line-error 形 `ms.bbl:4: Missing $...` 与
      # '!' 形 `! Missing $ inserted.`（'!' 形文件名入 file_stack 不在
      # err_head——靠 builtin 自验 unsafe key 存在性兜底, 误签至多白扫一遍）。
      ctx_suggests: "Missing \\$ inserted|Misplaced alignment tab"
    action:
      kind: builtin_transform
      function: citekey_sanitize
    risk: low # 双侧一致改写; 无裸 &/_ 键即 no-op 自幂
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "apj-bib-scout-2026-09-17 §S4 (1003.1717/1206.5852/…×11)",
          error: ".bbl:N: Missing $ inserted / Misplaced alignment tab character &",
        }
    stats: { fires: 12, rescued_cells: 5, status: active }
    source_ref: "bench/results/apj-bib-scout-2026-09-17/report.md §S4"

  # 2009.11064 (stagerun-loop1): e-print 捆绑 biber <3.3 旧格式 .bbl,
  # TL biblatex 3.21 拒载 (\sortlist undefined / wrong format version);
  # .bcf+.bib 在场即 biber <stem> 就地重生成正确版本 .bbl (a5ba9a7 builtin)。
  - id: bbl_regen
    description: "bundled 旧版 .bbl 撞新 biblatex → biber <stem> 就地重生成 (.bcf 在场)"
    phase: loop
    order: 158 # shadow 族(155-157)同档: 结构性处置先于逐宏补
    when: { category: undefined_cs, payload_required: true }
    condition:
      fileset: { has_ext: [.bcf] } # .bcf 只在 biber 通路存在, 天然限定 biblatex 稿
      tool_available: biber
    action:
      kind: builtin_transform
      function: bbl_regen
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2009.11064 (stagerun-loop1)",
          error: "Undefined control sequence \\sortlist / File 'ms.bbl' is wrong format version",
        }
    stats: { fires: 28, rescued_cells: 7, status: active }
    source_ref: "builtins.py bbl_regen (a5ba9a7)"

  # 2026-09-17 fixer-apjbbx (1706.00240): bundled apj.bbx (2017,
  # biblatex≤3.7 期) 以 \bbx@patchmacro 补丁旧宏名; 3.8 改名
  # date+extrayear→+extradate / labelyear+extrayear→+extradate 后
  # find-text 与目标宏双失配 (旧名仅剩 authoryear.bbx provide-shim,
  # 体不含 patch find-text)。源级更名双侧对齐——不引 shim。
  # 尾险 (fragment §risk): 文件自带 *正向* shim
  #   \providebibmacro*{date+extradate}{\usebibmacro{date+extrayear}}
  # 且自身新名 patch 先失败时, 改写会成自指 → capacity 兜住,
  # 属换墙非静默腐蚀; 今零 acmauthoryear 格发 Cannot-patch。
  - id: biblatex_bbx_rename
    mechanisms: [B05]
    description: "bundled .bbx/.cbx/.sty 补丁 biblatex>=3.8 已改名宏 → 源级更名 date/labelyear+extrayear→+extradate"
    phase: loop
    order: 161 # journal_cs_polyfill(160) 与 cs_targeted_fix(165) 之间
    when: { category: cannot_patch_macro }
    action:
      kind: regex_rewrite
      params:
        exts: [.bbx, .cbx, .sty, .tex]
        rewrites:
          - { pattern: "date\\+extrayear", repl: "date+extradate" }
          - { pattern: "labelyear\\+extrayear", repl: "labelyear+extradate" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1706.00240 (stagerun-loop1; fixer-apjbbx-2026-09-17)",
          error: "Package biblatex Error: Cannot patch bibliography macro author / date+extrayear (bundled apj.bbx 2017 vs biblatex 3.21)",
        }
    stats: { fires: 7, rescued_cells: 1, status: verified }
    source_ref: "fixer-apjbbx-2026-09-17; apj.bbx L192-197 双点归因 + r1 rewrite in 1 files"

  # 2026-09-18 task t_c9249919e8d7a13f: tectonic bundle 钉 biblatex 3.17
  # (bcf 3.8) 但外调 biber 走系统 PATH (2.22 要 bcf 3.11) —— bundle 内
  # 无解的工具链错配, 一切 biblatex 稿在 tectonic 下必死。log 形态:
  # "! the external tool exited ..." 后 biber stdout dump 含
  # "Found biblatex control file version 3.8, expected version 3.11." —
  # head 窗盖到则类 toolchain_skew, 盖不到落 other; builtin 两级复核
  # (err_head 快径 → _fixloop_log 全文) 同收, 不中 False 让位后续 other
  # 规则。REJECT route=xelatex 令牌由 repair 跨引擎臂换编 (本地 TeXLive
  # biber/biblatex 成对)。order 8 殿前: 硬墙先路由, 不陪跑可修类。
  - id: biber_biblatex_skew_route
    mechanisms: [B05]
    description: "tectonic bundle biblatex ↔ 系统 biber bcf 版本错配 → REJECT route=xelatex 换引擎 (不改源)"
    phase: loop
    order: 8 # toolchain_skew/other 族首评: 硬墙先路由
    when: { any: [{ category: toolchain_skew }, { category: other }] }
    condition:
      engine_in: [tectonic]
    action:
      kind: builtin_transform
      function: biber_biblatex_skew_route
      params: { route: xelatex }
    risk: low # 不改源只发路由令牌; 签名自验不中即 False
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 侧 biber/biblatex 同源自 TeXLive, 无此错配
    provenance:
      - {
          corpus: "task t_c9249919e8d7a13f (arXiv 2609.18207v1, 2026-09-18)",
          error: "! the external tool exited / biber: Found biblatex control file version 3.8, expected version 3.11",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "_builtins_bib.py biber_biblatex_skew_route; repair.py cross_engine_retry reject_route 臂"

  # 2026-09-18 natbib-lane (astro-ph/0307344, stagerun-rt1): natbib_numbers_pass
  # (95-targeted order 186) 的 (\\begin\{document\}) 重写无注释遮盖——注释行
  # 提到 \begin{document} 的被 \n 尾巴切成两半, "command."/"." 尾脱注释成
  # 行首活 \begin{document} (ms.tex:172/198), 首个活行在 \NAT@numberstrue
  # 注入位 (:285) 之前触发 aux 读 → compat 炸 (ms.aux:32) + preamble-only
  # 级联 (103 err)。aux purge 无用——裂伤在 tex 层。本规则收伤: 行首
  # \begin{document} 带可见尾文 (排除尾挂注释) 且后文另有行首者重注释;
  # 唯一带尾文的合法 \begin{document}Hello 形由 lookahead 门保住。
  - id: begindoc_tail_recomment
    mechanisms: [W117, W126]
    description: "注入式 rewrite 注释切分裂伤 → 带尾文的行首孤立 \\begin{document} 重注释 (后起行首 \\begin{document} 门)"
    phase: loop
    order: 194 # natbib_numbers_pass(186) 裂伤兜底, 同签下轮收
    when: { category: other }
    condition:
      ctx_suggests: "Bibliography not compatible with author-year|Can be used only in preamble"
      source_contains: "\\n\\\\begin\\{document\\}[^\\S\\r\\n]*[^\\s%]"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "^\\\\begin\\{document\\}(?=[^\\S\\r\\n]*[^\\s%][\\s\\S]*^\\\\begin\\{document\\})",
              repl: "%\\g<0>",
              flags: [MULTILINE],
            }
    risk: low # 仅重注释裂伤活行; lookahead 门保唯一带尾文 \begin{document} 合法稿
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "astro-ph/0307344 (stagerun-rt1)",
          error: "ms.aux:32 natbib compat + ms.tex:198/222/223 preamble-only 级联 — natbib_numbers_pass 注释切分裂伤",
        }
    stats: { fires: 1, rescued_cells: 1, status: active }
    source_ref: "natbib.sty:974 \\NAT@force@numbers; ms.tex:172/198 裂伤行 vs :285 注入位"

  # 2026-09-19 failmine item 2 (4 格): natbib_numbers_pass (95-targeted
  # order 186) preamble 末翻 \\NAT@numberstrue, 使 natbib \\AtEndDocument
  # 向 aux 写 \\NAT@force@numbers 空转——只挡 FUTURE 写; 先前编译留下的
  # .aux 已含 "\\providecommand\\NAT@force@numbers{}\\NAT@force@numbers"
  # 行 (natbib.sty:967-968 写面), 次遍 \\begin{document} 期 aux 读仍炸
  # "Bibliography not compatible with author-year citations"——同签复炸
  # 而 numbers_pass 已 applied 不再点火。整行剥除: aux 族可再生,
  # numbers_pass 在位即无再写源, 剥一次即净。
  - id: natbib_aux_force_purge
    mechanisms: [W117, W126]
    description: "陈旧 .aux 残留 \\NAT@force@numbers 强制行 → 整行剥除 (numbers_pass 已挡再写)"
    phase: loop
    order: 195 # begindoc_tail_recomment(194) 同签族殿后: tex 层裂伤先收, aux 残毒后剥
    when: { category: other } # .aux:NN file-line 签名归 other (taxonomy `^.` 兜底)
    condition:
      ctx_suggests: "Bibliography not compatible with author-year"
      fileset: { has_ext: [.aux] }
    action:
      kind: regex_rewrite
      params:
        exts: [.aux]
        rewrites:
          - {
              pattern: "^[^\\n]*\\\\NAT@force@numbers(?![a-zA-Z@])[^\\n]*\\n?",
              repl: "",
              flags: [MULTILINE],
            }
    risk: low # aux 可再生; 仅含标记的行整删余行逐字节不动; 无标记 0 命中不点火
    known_gap: "\\NAT@force@letters (authoryear 强制臂) 未收——inverse 病理无实证格; 其他强制标记同理留待实证"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0707.1345, astro-ph/0307344, astro-ph/0408113, astro-ph/0501630 (failmine loop2)",
          error: ".aux:NN: Package natbib Error: Bibliography not compatible with author-year citations (stale aux \\NAT@force@numbers)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-failmine/rule_targets.txt item 2; natbib.sty:967-968 \\AtEndDocument aux 写面"
