# rules/70-pkgopt.yaml — fixloop 规则库分片：包选项 —— option_clash/pkg_order/minted/hyperref 驱动与类选项
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  - id: option_clash_merge
    mechanisms: [W48]
    description: "Option clash: 同包两次 \\usepackage → 合并选项到首处, 注释后处"
    phase: loop
    order: 120
    when: { category: option_clash, payload_required: true }
    action:
      kind: builtin_transform # 非单条 regex: 找重复加载→合并选项→注释后者
      function: option_clash_merge # params.pkg = payload; 详见 builtins.py 函数注册表
      params: { pkg: "{payload}", exts: [.tex, .sty, .cls] }
    risk: medium # 合并选项可能改变语义
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "—", error: "Option clash for package X" }
    stats: { fires: 0, status: proposed }
    source_ref: "fixloop.py L459-494"

  # 2026-09-16 wave-2: option_clash 跨文件形态 (cls 先载 vs doc 后载) ——
  # option_clash_merge 只合单文件双载; 0905.0081 elsart 先载 graphicx[] +
  # doc \usepackage[dvips]{graphicx} 够不到。驱动选项在 xelatex 下纯属错向
  # → doc 侧含驱动词的整括号剥除, 类端配置全量胜出。先于 passopts 规则:
  # 驱动词在场时绝不向上游传 (passopts 会把 dvips 注进 cls 装载)。
  - id: option_clash_loadopt_strip
    mechanisms: [W48]
    description: "option_clash 且 doc 侧选项含驱动词 (dvips 系) → 剥整括号, 类端配置胜出"
    phase: loop
    order: 121
    when: { category: option_clash, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\(?:usepackage|RequirePackage)\\s*\\[[^\\]]*\\b(?:dvips|dvipdfm|dvipdfmx|pdftex|pdflatex|xdvi|oztex|textures|vtex|xetex|latex)\\b[^\\]]*\\]\\s*(\\{[^{}]*\\b{payload}\\b[^{}]*\\})",
              repl: "\\\\usepackage\\g<1>",
            }
    risk: low # 驱动选项在 xelatex/tectonic 下本就错向; 同括号非驱动词顺带丢 (罕见)
    known_gap: "撞名载点在 \\input 的 .tex 内同样覆盖 (exts 面); doc 双侧同文件撞已由 merge(120) 先收"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop2-delta option_clash (0905.0081)",
          error: "Option clash for package graphicx (cls 先载 [], doc 要 [dvips])",
        }
    stats: { fires: 0 }
    source_ref: "wave-2: option_clash 跨文件形态 driver 面"

  # 非驱动选项形态: doc 要 [authoryear] 但 cls shim 先载 natbib[]
  # (astro-ph/0501556, aa.cls shim 内置 \RequirePackage{natbib}) ——
  # 把 doc 选项经 \PassOptionsToPackage 挂到 documentclass 之前, 让首次
  # 装载 (无论发生在哪个文件) 就带上 doc 意图, doc 侧括号剥除 → 裸请求
  # ⊆ 实载选项 → 静默收敛, 意图零损失。
  - id: option_clash_passopts
    mechanisms: [W48]
    description: "option_clash 非驱动选项 → \\PassOptionsToPackage 挂 documentclass 前, doc 括号剥除"
    phase: loop
    order: 122
    when: { category: option_clash, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "(\\n[ \\t]*)(\\\\documentclass)([\\s\\S]*?)(\\n[ \\t]*\\\\usepackage\\s*)\\[([^\\]]+)\\](\\s*\\{[^{}]*\\b{payload}\\b[^{}]*\\})",
              repl: '\g<1>\\PassOptionsToPackage{\g<5>}{{payload}}\g<1>\g<2>\g<3>\g<4>\g<6>',
            }
    risk: medium # PassOptions 把 doc 选项注进首次装载; 装载点在他文件时兜底同效
    known_gap: "documentclass/usepackage 须在非注释行首 (%行被 \\n[ \\t]*\\\\ 排除); 分文件 (\\input 拆) 或 documentclass 居文件 0 字节 → applied=False; 每文件仅首处括号载点获 hoist"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop2-delta option_clash (astro-ph/0501556)",
          error: "Option clash for package natbib (cls shim 先载 [], doc 要 [authoryear])",
        }
    stats: { fires: 0 }
    source_ref: "wave-2: option_clash 跨文件形态语义选项面"

  # pkg_order 首规则 (2308.12712): bundled 老 acmart.cls
  # \RequirePackage{hyperxmp} 先于 hyperref, 新 hyperxmp v5+ 硬检
  # \@ifpackageloaded 报错。两装载行夹 \\let 三明治 (存 pre-hyperref
  # 脚注记号) —— 不能互换位置, 只能把 hyperxmp 整行下沉到 hyperref 之后。
  - id: pkg_order_hyperxmp_relocate
    description: "hyperxmp 先于 hyperref 装载 → hyperxmp 整行下沉到 hyperref 载点后"
    phase: loop
    order: 123
    when: { category: pkg_order, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(\\\\(?:RequirePackage|usepackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{hyperxmp\\})([\\s\\S]*?)(\\\\(?:RequirePackage|usepackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{hyperref\\})",
              repl: '\g<2>\g<3>\n\g<1>',
            }
    risk: low # 纯重排, 中间行 (\\let 三明治) 原位保留仍在 hyperref 之前
    known_gap: "仅 hyperxmp↔hyperref 序对; hyperref 装载不在同文件/从未装载 → applied=False"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop2-delta pkg_order (2308.12712)",
          error: "hyperxmp.sty:279 Package hyperxmp Error: hyperref must be loaded before hyperxmp",
        }
    stats: { fires: 0 }
    source_ref: "wave-2: pkg_order 类目首个消费规则"

  - id: minted_frozencache
    mechanisms: [W40, B05]
    description: "minted frozencache 版本错配 → 有 pygmentize 则去 frozencache 选项 (需 -shell-escape)"
    phase: loop
    order: 130
    when: { category: minted_froz }
    condition: { tool_available: pygmentize } # 无 pygmentize → applied=False (L502-505)
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - { pattern: "frozencache\\s*,?\\s*", repl: "" }
        engine_flags: ["-shell-escape"]
    risk: medium
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: partial # shell-escape 受限 → 建议改写 listings 或 advisory
        fallback: advisory
    provenance:
      - { corpus: "—", error: "frozencache/Cannot highlight code" }
    stats: { fires: 0, status: proposed }
    source_ref: "fixloop.py L497-505"

  # 新增 (docs/08:270): xelatex 侧 minted v3 装包 × 工程自带 v2 frozencache
  # → 改挂 minted2 (v2 API 包)。注意改写只打包装载点: minted2 的 env 名仍是
  # {minted}, \begin{minted} 绝不能动 (盲改 {minted}→{minted2} 会毁 env)。
  - id: minted_v3_rewrite
    mechanisms: [W40, B05]
    description: "minted v3 装包 × 工程 v2 frozencache → \\usepackage{minted}→{minted2} 装载点改写"
    phase: loop
    order: 135 # frozencache 剥选项(130)先试; 它放弃/复发才轮到
    when: { category: minted_froz }
    condition:
      engine_in: [xelatex]
      cache_dir_glob: "_minted-*" # 工程确有 frozencache 目录才是 v3×v2 错配
      package_version_ge: { file: "minted.sty", version: 3 }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\(usepackage|RequirePackage)(\\s*\\[[^\\]]*\\])?\\s*\\{minted\\}",
              repl: '\\\g<1>\g<2>{minted2}',
            }
          - {
              pattern: "\\\\PassOptionsToPackage(\\{[^}]*\\})\\{minted\\}",
              repl: '\\PassOptionsToPackage\g<1>{minted2}',
            }
    risk: medium
    engines:
      xelatex: { mode: native }
      tectonic: { mode: skip } # tectonic 侧 minted 版本由 bundle 管, 无此错配
    provenance:
      - {
          corpus: "—",
          error: "minted v3 读 v2 frozencache 报 ~50 错 (docs/08:257)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L257, L270"

  # fixable-data 裁定 (2211.13028/2308.12612, 1d 已批): doc 强指 dvi/pdf
  # 驱动给 hyperref 家族, xelatex 下必炸 "Wrong driver option"/
  # "Wrong hyperref driver"。剥除一切选项括号内的驱动词让 hyperref/
  # graphicx 自侦 hxetex —— docclass 全局选项同样覆盖 (剥离对 xetex
  # 恒正确: 这些驱动在 XeTeX 下本来就走不通)。hypdvips 整包换 hyperref
  # (它只为 dvips 路由存在; doc 若另载 hyperref, 二次加载无害)。
  - id: hyperref_driver_neutralize
    description: "hyperref 家族驱动选项 (pdftex/dvips/…) + hypdvips → 剥词/换包, 交自侦"
    phase: loop
    order: 181 # typein_neutralize(180) 之后; early_eof/hyperref_driver 双签兜底
    when:
      any:
        - { category: hyperref_driver, payload_required: false }
        - { category: early_eof, payload_required: false }
        # W126 根修后 file-line 签名错归 other——同构失守面保活
        # (source_contains 既有守卫兜爆半径)
        - { category: other, payload_required: false }
    condition:
      source_contains: "hypdvips|\\[[^\\]]*\\b(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\b"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # hypdvips → hyperref (选项面保留, 多为 hyp* 公共键)
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]\\n]*\\]\\s*)?)\\{hypdvips\\}",
              repl: "\\g<1>{hyperref}",
            }
          # 全驱动括号: [dvips] / [dvips,pdftex] → [] (括号可跨行)
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\]",
              repl: "[]",
            }
          # 括号首位驱动词: [dvips,opt] → [opt]
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "[",
            }
          # 中段/末位驱动词: [opt,dvips,opt2] / [opt,dvips] → [opt,opt2]/[opt]
          - {
              pattern: "(\\[[^\\]]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\])",
              repl: "\\g<1>",
            }
          # PassOptionsToPackage/Class 首参同三套 (大括号形)
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\}",
              repl: "\\g<1>}",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "\\g<1>",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\})",
              repl: "\\g<1>",
            }
          # 空括号清扫: \usepackage[]{x} → \usepackage{x}
          - {
              pattern: "(\\\\(?:documentclass|usepackage|RequirePackage))\\s*\\[\\s*\\]",
              repl: "\\g<1>",
            }
    risk: low # xetex 下这些驱动本就失效; 自侦即作者意图
    known_gap: "doc 若用 hypdvips 专属 cs (嵌入 PS 钩子) 会前进到 undefined_cs → cs_targeted_fix; \\hypersetup 内驱动键、非括号赋值 (\\def\\@driver) 未覆盖"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同驱动面
    provenance:
      - {
          corpus: "fixable-data adjudication (2211.13028, 2308.12612)",
          error: "hypdvips: Wrong hyperref driver `hxetex' / hyperref: Wrong driver option `pdftex'",
        }
    stats: { fires: 0 }
    source_ref: "scout-fail59 fixable-data §4 驱动剥除 (1d 批准); taxonomy hyperref_driver 签名同期扩三形态"

  - id: docclass_post_option_normalize
    mechanisms: [W67]
    description: "\\documentclass{X}[opts] 后置选项畸形 → 孤儿 [opts] 行归位 \\documentclass[opts]{X}"
    phase: loop
    order: 183 # revtex4_legacy_class_rewrite(182) 之后, undefined_cs_guess(900) 之前
    when:
      any:
        - { category: syntax }
        - { category: undefined_cs }
    condition:
      # 孤儿选项行: segmenter 把 src 同行 `\documentclass{X}[opts]` 的
      # [opts] 段拆成独立块, splice 落 preamble 孤行 → Missing \begin{document}。
      source_contains: "(?m)^[ \\t]*\\[[0-9a-zA-Z,=.\\- ]+\\][ \\t]*$"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          # 既有选项 → 尾部合并: \documentclass[a]{X}…^[o]$ → \documentclass[a,o]{X}
          # 中间段以 \begin{document} 回火——正文内孤立 [x] 行不越界吞。
          - {
              pattern: "(\\\\documentclass[ \\t]*\\[[^\\]\\n]*)\\]([ \\t]*\\{[^}\\n]*\\})((?:(?!\\\\begin\\{document\\})[\\s\\S])*?)^[ \\t]*\\[([0-9a-zA-Z,=.\\- ]+)\\][ \\t]*$",
              repl: "\\g<1>,\\g<4>]\\g<2>\\g<3>",
              flags: [MULTILINE],
            }
          # 无既有选项 → 新建选项组: \documentclass{X}…^[o]$ → \documentclass[o]{X}
          - {
              pattern: "(\\\\documentclass[ \\t]*)(\\{[^}\\n]*\\})((?:(?!\\\\begin\\{document\\})[\\s\\S])*?)^[ \\t]*\\[([0-9a-zA-Z,=.\\- ]+)\\][ \\t]*$",
              repl: "\\g<1>[\\g<4>]\\g<2>\\g<3>",
              flags: [MULTILINE],
            }
    risk: low # 选项归位是源作者本意; 仅 preamble 内孤行, 正文 [x] 行不达
    known_gap: "多孤儿行只归位最近一条 (per-docclass 单匹配); 选项序改变 (o 尾插) 与源序不同但语义同"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop1 unfixable:syntax (1206.2111 schulze.tex src l.1 `\\documentclass{article}[12pt]`)",
          error: "LaTeX Error: Missing \\begin{document} @ splice l.36 (孤儿 [12pt] 行)",
        }
    stats: { fires: 0 }
    source_ref: "1206.2111 zh l.41 孤儿 [12pt] 在 inject 块后 preamble 内; src 原形 \\documentclass{article}[12pt] 同行后置"

  # 2026-09-18 C3 (stats 驱动, loop1 dedup 面): 老 pstricks.sty (稿自带,
  # elsart 时代捆绑) \PassOptionsToPackage{override}{xcolor} —— 'override'
  # 选项现代 xcolor 已删 (2004 起并入 dvipsnames 语义: dvips 色名覆盖
  # 标准集)。err 落 early_eof 桶 (0707.4206 实读: xcolor.sty:265
  # \ProcessKeyOptions "Unknown option 'override' for package xcolor")。
  ## REVIEW(c3): ctx+source 双闸 AND —— 仅当错误面与源码面同证此机理
  ## 才改; override→dvipsnames 是语义等效映射非裸删。
  - id: xcolor_override_opt_strip
    description: "老 pstricks 传 'override' 给现代 xcolor → 等效改 dvipsnames"
    phase: loop
    order: 184 # docclass_post_option_normalize(183) 后
    when:
      any:
        - { category: early_eof, payload_required: false }
        - { category: other, payload_required: false }
        - { category: syntax, payload_required: false }
    condition:
      ctx_suggests: "Unknown option 'override'"
      source_contains: "PassOptionsToPackage\\s*\\{override\\}\\s*\\{xcolor\\}"
    action:
      kind: regex_rewrite
      params:
        exts: [.sty, .cls, .tex]
        rewrites:
          - {
              pattern: "(\\\\PassOptionsToPackage\\s*)\\{override\\}(\\s*\\{xcolor\\})",
              repl: "\\g<1>{dvipsnames}\\g<2>",
            }
    risk: low # 选项名等效映射; 双闸限定只在此机理命中时动
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop1-dedup 0707.4206 (elsart.cls 工程, vendored_fetch 后残面)",
          error: "xcolor.sty:265 LaTeX Error: Unknown option 'override' for package xcolor",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-c3-fixloop/ — C3 stats 驱动; splice pstricks.sty:47 实读"

  # 2026-09-19 pstlane (stagerun-loop2 1003.2152 实读): pstcol 是 deprecated
  # 兼容壳——pstcol.sty 体内 \\PassOptionsToPackage{noxcolor}{pstricks} 硬
  # 压 color 路径 (自警告 "use pstricks directly"), 现代 pst-* 核
  # (pstricks-add.tex v3.94 :742 \\colorlet) 需 xcolor 必炸 undefined_cs。
  # 枚名换等价现代件: usepackage/RequirePackage 组内 pstcol→pstricks,
  # pstricks 默认 \\RequirePackage{xcolor} 且 \\DeclareOption* 把选项续传
  # xcolor——pstcol 时代传 color 的选项 (usenames/dvipsnames) 恰是 xcolor
  # 原生面, 语义严格不缩。masked 面只改活码 (注释内假装载不动)。
  - id: pstcol_pstricks_rewrite
    description: "pstcol 强压 noxcolor/color 路径 → 组内 pstcol 枚名换 pstricks (xcolor 自动续载)"
    phase: loop
    order: 185 # xcolor_override_opt_strip(184) 同族 option 病理位
    when:
      any:
        - { category: undefined_cs }
    condition:
      source_contains: "\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*\\bpstcol\\b"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{[^{}]*?)(?<=[{,\\s])pstcol(?=\\s*[,}])",
              repl: "\\g<1>pstricks",
              match_surface: "masked",
            }
    risk: low # deprecated 壳换正主; pstricks 选项续传 xcolor 比 pstcol→color 更贴原意
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1003.2152 (stagerun-loop2-2026-09-18)",
          error: "pstricks-add.tex:742 Undefined control sequence \\psset@pstricks-add@startColor->\\colorlet (pstcol→noxcolor→color-only)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "pstlane defect-B; pstcol.sty:22 noxcolor 实读 + splice main.log:605"

  # 2026-09-19 geomlane (stagerun-loop2 1206.0291 实读): option_clash 三规
  # (merge 120 / loadopt_strip 121 / passopts 122) 够不到的残留面 ——
  # vendored mn2e stub \LoadClassWithOptions{mnras} → mnras.cls:117
  # \usepackage[a4paper]{geometry} 先载, doc 要 [total={17.8cm,24.0cm},
  # centering] 撞。passopts 需 \n\documentclass 锚点把 doc 选项注进首载,
  # 本篇 documentclass 居文件 0 字节 (其 known_gap 自承) 且 cls 链不经
  # doc 侧文本 —— \geometry{} 是 geometry 自带运行时 keyval 面 (与装载
  # 选项同表), 括号整组挪到载点后: 裸载 ⊆ 实载选项恒静默收敛, 意图经
  # \geometry 零损失送达; 不依赖 documentclass 位置/存在, \input 拆分
  # preamble、cls/sty 内载点同覆盖。masked 面只改活码。
  - id: option_clash_geometry_hoist
    mechanisms: [W48]
    description: "option_clash geometry → 括号选项整组挪载点后 \\geometry{opts} (documentclass 位置无关)"
    phase: loop
    order: 186 # pstcol_pstricks_rewrite(185) 后; passopts(122) 失手形态兜底
    when: { category: option_clash, payload_required: true }
    condition:
      ctx_suggests: "Option clash for package geometry\\b"
      source_contains: "\\\\(?:usepackage|RequirePackage)\\s*\\[[^\\]]+\\]\\s*\\{[^}]*\\bgeometry\\b"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage))\\s*\\[([^\\]]+)\\]\\s*(\\{[^{}]*\\bgeometry\\b[^{}]*\\})",
              repl: '\g<1>\g<3>\n\\geometry{\g<2>}',
              match_surface: "masked",
            }
    risk: low # \geometry 是 geometry 自带运行时设置面; 裸载 ⊆ 实载恒静默, 选项意图续传
    known_gap: "组载 {geometry,other} 共享选项改挂 \\geometry{} 后只达 geometry——他包原受这份选项的意图收窄 (罕形); driver/truedimen/mag 等 load-only 键在 \\geometry 内无效 (warning 级, xetex 下本就错向)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1206.0291 (stagerun-loop2-2026-09-18)",
          error: "LaTeX Error: Option clash for package geometry (mnras.cls:117 [a4paper] 先载, doc [total={17.8cm,24.0cm},centering] 撞)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "geomlane; vendor/files/mnras.cls:117 + fixloop.jsonl error_pay option_clash=geometry 实读"

  # 2026-09-19 floatopt lane (failmine 提名, stagerun-loop1-2026-09-16 五格
  # 实读): float_opt|H —— 稿用 float 宏包专属锚 H (kernel \@xfloat 只认
  # h/t/b/p/!) 而 preamble 未载 float → "Unknown float option `H'"。五格
  # 形态: cond-mat/0408234 [H]; 0806.4088 [!Ht]; 1608.02624 [Hb]/[H!];
  # astro-ph/0307059 [H!tbp]; 1003.5014 [H] —— H 与 !/小写混排同炸,
  # 括号内 H 字符任意位都算使用证。根修即补包 (语义零改写, 非 [H]→[htbp]
  # 降级)。source_contains 单 regex 组合双断言: \A(?!.*LOAD) 全程无 float
  # 装载点 (usepackage/RequirePackage 名单元素级 \bfloat\b + \input
  # float.sty 裸载形), (?=.*USAGE) 存在含 H 的浮体选项括号——ctx+source
  # 双闸同证机理才动。注入落 \begin{document} 前 (masked 面: 注释掉的
  # 不算), 注入后 LOAD 断言自锁 → 跨轮幂等。
  - id: float_opt_h_pkgload
    description: "float_opt 'H' 且 float 未载 → \\begin{document} 前注入 \\usepackage{float}"
    phase: loop
    order: 187 # option_clash_geometry_hoist(186) 后; 同签 comma_strip(184, 95-targeted) 先收逗号形
    when: { category: float_opt, payload_required: true }
    condition:
      ctx_suggests: "Unknown float option [`']H'"
      # 2.09 (\documentstyle) 无 \\usepackage——注入即非法; docclass 断言并入
      # source_contains (main_head 仅 3k 窗, 0408234 注释堆 70 行 docclass@3280
      # 漏窗实证——fixloop6 replay 未点火)
      source_contains: "\\A(?![\\s\\S]*(?:\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]\\n]*\\])?\\s*\\{[^}]*\\bfloat\\b|\\\\input(?:\\s*\\{\\s*|\\s+)float\\.sty))(?=[\\s\\S]*\\\\documentclass)(?=[\\s\\S]*\\\\begin\\{[A-Za-z]+\\*?\\}\\s*\\[[^\\]\\n]*H)"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "(\\\\begin\\{document\\})",
              repl: "% fixloop: float_opt H specifier needs float pkg\n\\\\usepackage{float}\n\\g<1>",
              match_surface: "masked",
            }
    risk: low # float 只补锚定义; 已载稿被 LOAD 闸挡; 真双载 LaTeX 静默收敛
    known_gap: "LOAD 断言走 raw 源面: 注释内/verbatim 假装载点视作已载 → 保守不点火 (漏救非误改); .def/.clo/.ins 等 tex_files 扩展名外的装载不可见 → 误注无害双载; [H] 纯宏展开生成 (源面无字面括号 H) → USAGE 断言拒 (病理形)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0806.4088/1003.5014/1608.02624/astro-ph/0307059/cond-mat/0408234 (stagerun-loop1-2026-09-16 failmine)",
          error: "LaTeX Error: Unknown float option `H' @ \\begin{figure|table}[H]/[!Ht]/[Hb]/[H!tbp]",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "failmine float_opt|H lane; corpus_v3 五格源实读混排形"
