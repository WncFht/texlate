        fallback_cs: txlatecjkfb
        # 缺字字体名已含 CJK 字体特征时跳过 —— 真缺字形不归本规管, 防自回环
        font_not: "fandol|noto.*cjk|source.?han|uming|ukai|wqy|cjk"
    risk: low # newunicodechar 逐字绑; 不碰 xeCJK 路由, 失败即回原缺字
    known_gap: "死 \\selectfont 上下文内无效 (绑定锻造点, 真缺字发生在活上下文)"
    engines:
