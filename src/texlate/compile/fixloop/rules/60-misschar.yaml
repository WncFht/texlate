  # {\.z}kowska 意在 Drążkowska —— a/e 无 cedilla 预组字形, \c 产
  # base+U+0327 组合符 lmroman 无槽缺字。限定 a/e 两字母 (真 ogonek
  # 字母; c/s/t 真 cedilla 不动) + err ctx U+0327 双闸 —— accent
  # 臂 (25.5) 之先收 (否则 \c{a} 被剥成裸 a 语义错)。
  - id: cedilla_ogonek_fix
    mechanisms: [W42, W43]
    description: "\\c{a}/\\c a (OT1 cedilla 意图 ogonek) → \\k{a} 预组字改写 (限 a/e + U+0327 缺字证)"
    phase: loop
    order: 25.4 # accent_mark_fix(25.5) 之先 —— a/e cedilla 是真 ogonek, 让 accent 剥除会丢语义
    when:
      any:
        - { category: warn_missing_char }
        - { category: warn_utf8 }
    condition:
      ctx_suggests: "U\\+0327" # 组合 cedilla 缺字指纹 (Other 缺字不烧 stats)
      source_contains: "\\\\c\\s*\\{?\\s*[aeAE]"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .bbl]
        rewrites:
          - {
              pattern: "\\\\c\\s*\\{?\\s*([aeAE])\\s*\\}?",
              repl: "\\\\k{\\g<1>}",
              match_surface: masked,
            }
    risk: low # a/e 无 cedilla 正字法 —— 该形恒为 ogonek 误写或垃圾, 改 \\k 优于剥除
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2211.04497 (vault QC replay vis_degenerate, qc-impl-2026-09-28)",
          error: "Missing character U+0327 — Dr{\\c a}{\\.z}kowska 意在 Drążkowska, \\c 产组合符 lmroman 无槽",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json cedilla_ogonek_fix"
    known_gap: "\\c 后隔组写法 (\\c{a} 已含; \\c {a} 空白-组形已收) 外多 token 分隔不收; 非 a/e 宿主 (\\c{t} 等真 cedilla 域) 归 accent_mark_fix"
