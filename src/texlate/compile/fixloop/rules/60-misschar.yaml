  # 形 \mathbf{\Lambda} 与松散形 {\mathbf \Lambda} 并收 (后者不吃
  # 外层组闭 brace —— 交错两捕获组, repl \g<1>\g<2> 恒一空一实)。
  - id: mathbf_ot1_greek
    mechanisms: [W42, W43]
    description: "``\\mathbf{\\Lambda}`` 族 OT1 槽位-in-TU 字体控字符缺字 → ``\\ensuremath{\\boldsymbol{...}}`` 真粗希腊改写"
    phase: loop
