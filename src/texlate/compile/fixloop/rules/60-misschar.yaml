# rules/60-misschar.yaml — fixloop 规则库分片：缺字分诊 —— warn_missing_char/warn_utf8 驱动的缺字修复族
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/00-base.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # ─── F4 (2026-09-16): 缺字分诊 —— warnings 段 missing_char 升级类别驱动 ───
  # 两条互斥子路径都在 missing_char_fix 内 (码位×字体 查表):
  #   CJK 落非 CJK 字体 = xeCJK 字体绑定被污染 (elsart \no@harm → \protect
  #   重定义 → \selectfont 失效 → 首用把 xeCJK/<fam>/<ser>/<sh>/<size> 绑死
  #   lmroman; cond-mat/0307508 实跑 4379 缺字根因, /tmp/mc-repro 复现)
  #   → \AtBeginDocument 预热盒在干净上下文先绑常用 size;
  #   符号/拉丁缺字 (≠ U+2260 / − U+2212 / § U+A7 / ø U+F8 / è U+E8)
  #   → char→命令字面替换, 表条目见 builtins._MC_TABLE, params.char_table 可扩。
  - id: missing_char_fix
    mechanisms: [W42, W43]
    description: "无 '!' 错但 log 有 Missing character → 码位分级: CJK→xeCJK 绑定预热, 符号/拉丁→字面替换"
    phase: loop
    order: 25 # 与类别独占, 序位只影响同 category 规则间
    when:
      any:
        - { category: warn_missing_char }
        # warn_utf8 终类的格带缺字共存时原永不评估本族 (类别排他 quirk,
        # scout-misschar-coverage ×6 rows): log 无 missing char 时自然
        # applied=False 落穿, 有则先修缺字再让 utf8 规则接手。
        - { category: warn_utf8 }
    action:
      kind: builtin_transform
      function: missing_char_fix
      params:
        # cls_pretokenized (scout-misschar ×2): jetpl.cls 把西里尔字面编进
        # \addtocontents/token 寄存器 —— cls 装载即 token 化, 注入够不到;
        # 源级字面替换须在 token 化前改字节 → exts 扩 .cls/.sty/.bbl。
        exts: [.tex, .cls, .sty, .bbl]
        # Latin-1/标点散字补表 (scout-pf2final 盲区: £/ĳ 系落 cmr/cmmi/txmi
        # 无字形; ø/§/≠/−/è 已在内置 _MC_TABLE)。文本命令一律 \mbox 包裹防
        # 数学模式缺字复发; 数学符号走 \ensuremath。
        char_table:
          - { id: nbsp, cps: [0x00A0], replace: "~" }
          - { id: pound, cps: [0x00A3], replace: "\\mbox{\\pounds}" }
          - { id: copyright, cps: [0x00A9], replace: "\\mbox{\\textcopyright}" }
          - {
              id: registered,
              cps: [0x00AE],
              replace: "\\mbox{\\textregistered}",
            }
          - { id: degree, cps: [0x00B0], replace: "\\ensuremath{^\\circ}" }
          - { id: pm, cps: [0x00B1], replace: "\\ensuremath{\\pm}" }
          - { id: micro, cps: [0x00B5], replace: "\\ensuremath{\\mu}" }
          - { id: pilcrow, cps: [0x00B6], replace: "\\mbox{\\P}" }
          - { id: times, cps: [0x00D7], replace: "\\ensuremath{\\times}" }
          - { id: divide, cps: [0x00F7], replace: "\\ensuremath{\\div}" }
          - { id: ij_lig, cps: [0x0133], replace: "\\mbox{\\ij}" }
          - { id: ij_lig_up, cps: [0x0132], replace: "\\mbox{\\IJ}" }
          - { id: hyphen, cps: [0x2010], replace: "\\mbox{-}" }
          - { id: endash, cps: [0x2013], replace: "\\mbox{--}" }
          - { id: emdash, cps: [0x2014], replace: "\\mbox{---}" }
          - { id: lsquo, cps: [0x2018], replace: "\\mbox{`}" }
          - { id: rsquo, cps: [0x2019], replace: "\\mbox{'}" }
          - { id: ldquo, cps: [0x201C], replace: "\\mbox{``}" }
          - { id: rdquo, cps: [0x201D], replace: "\\mbox{''}" }
          - { id: dagger, cps: [0x2020], replace: "\\mbox{\\textdagger}" }
          - { id: ddagger, cps: [0x2021], replace: "\\mbox{\\textdaggerdbl}" }
          - { id: bullet, cps: [0x2022], replace: "\\mbox{\\textbullet}" }
          - { id: hellip, cps: [0x2026], replace: "\\mbox{\\dots}" }
          # ── outband 覆盖 (scout-misschar-coverage 2026-09-17, ×13 pids) ──
          # FFFD 条目已撤 (2026-09-28 qc-impl): 无语境 '-' 盲换产
          # '许-多'/'C-orcoles' 错修实证 —— 移交 fffd_context_fix 规则
          # (order 25.6) 邻域分派: CJK 间{} / 页码-- / 拉丁名断\'。
          # C1 控制符 / LRM / ZWSP / BOM —— 零宽不可见, 空组剥除;
          # misscharext 补完 200B-200F Cf 块 (2410.00026 ZWNJ bib→bbl)
          - { id: c1_ctrl, ranges: [[0x80, 0x9F]], replace: "{}" }
          - {
              id: zero_width,
              cps: [0x200B, 0x200C, 0x200D, 0x200E, 0x200F, 0xFEFF],
              replace: "{}",
            }
          - { id: pua_f047, cps: [0xF047], replace: "{}" }
          - { id: boxdraw_252c, cps: [0x252C], replace: "{}" }
          # 数学/标点散字 → \ensuremath 双模无恙
          - { id: fracslash, cps: [0x2044], replace: "/" }
          - { id: prime_2032, cps: [0x2032], replace: "\\ensuremath{'}" }
          - { id: astop_2217, cps: [0x2217], replace: "\\ensuremath{\\ast}" }
          - { id: sumop_2211, cps: [0x2211], replace: "\\ensuremath{\\sum}" }
          # M1-B 残余 (1502.06189): .bbl 字面 ℓ 落 lmroman9 无槽
          - { id: ell, cps: [0x2113], replace: "\\ensuremath{\\ell}" }
          # ── utf8census→misscharext 补表 (2026-09-19, loop3 ×5 格) ──
          # ¡ 数学内 TFM 字面 (1206.0663 n$¡ã$ txr): !` TFM 连字产 ¡;
          # 码位带外 (<_FB_RANGES 起点 0x00C0) —— latin-1 标点一律
          # 走表语义替换, 不扩回退带 (见本文件 font_fallback 注)
          - { id: excldown, cps: [0x00A1], replace: "\\mbox{!`}" }
          # ™ shipped .bbl 字面 (1811.10109 aer8)
          - { id: trademark, cps: [0x2122], replace: "\\mbox{\\texttrademark}" }
          # U+02F7 低 tilde / U+2329-232A 角括号字面量; cs 展开产出面
          # (\texttildelow/\textlangle/\textrangle) 归 macro_glyph_fix
          - { id: lowtilde, cps: [0x02F7], replace: "\\ensuremath{\\sim}" }
          - { id: langle_br, cps: [0x2329], replace: "\\ensuremath{\\langle}" }
          - { id: rangle_br, cps: [0x232A], replace: "\\ensuremath{\\rangle}" }
          # ── misscharcen #162 补表 (loop3 残余普查, 17 cells/35 lines) ──
          # 全部字面在源 (.tex 或 shipped .bbl), 缺字体 cmr*/zptmcm7t TFM
          # 无槽或 lmroman 偶缺。cmr 上下文须走数学族替换——TFM 字体没有
          # latin-1/符号槽位, \textXxx 在 TU 下产出同码位仍缺字 ——
          # ´/¼/½/≤/·/⋅/∼ 一律 \ensuremath; º/ʼ 落文本字体 (lmroman 有槽)。
          - { id: middot, cps: [0x00B7], replace: "\\ensuremath{\\cdot}" }
          - { id: sup2, cps: [0x00B2], replace: "\\ensuremath{^2}" }
          # ´ 观测点是数学内伪 prime (1003.1105 ``k'\tau´``) —— ' 产 ′
          # 双模皆活; TFM 下 \textasciiacute 会再缺同码位故不用
          - { id: acute_sp, cps: [0x00B4], replace: "\\ensuremath{'}" }
          - { id: frac14, cps: [0x00BC], replace: "\\ensuremath{\\frac{1}{4}}" }
          - { id: frac12, cps: [0x00BD], replace: "\\ensuremath{\\frac{1}{2}}" }
          - {
              id: ordmasc,
              cps: [0x00BA],
              replace: "\\mbox{\\textordmasculine}",
            }
          - { id: leq, cps: [0x2264], replace: "\\ensuremath{\\leq}" }
          - { id: dotop, cps: [0x22C5], replace: "\\ensuremath{\\cdot}" }
          - { id: tildeop, cps: [0x223C], replace: "\\ensuremath{\\sim}" }
          # ℤ shipped .bbl 字面 (1803.03082) —— \mathbb 依赖 amssymb,
          # 观测格已载; 无 amssymb 的假想格会把 warn 转 undefined_cs
          - { id: dblz, cps: [0x2124], replace: "\\ensuremath{\\mathbb{Z}}" }
          - { id: thinsp, cps: [0x2009], replace: "\\," }
          - { id: modapos, cps: [0x02BC], replace: "\\mbox{'}" }
          # ╨ = CP437-era 连字符 mojibake (1404.0389 shipped .bbl
          # ``silicone╨based``/``live╨cell``) → 还原连字符, 非剥除
          - { id: boxdraw_2568, cps: [0x2568], replace: "-" }
          # PUA 私用区残留 (0905.1031) —— 同 pua_f047 剥除
          - { id: pua_f07a, cps: [0xF07A], replace: "{}" }
          # ── misschars4 #190 补表 (loop3 残余普查 tmp/lane-misschar3, ~20 cells) ──
          # tab → 空格; ├/boxdraw → 剥除; ﬁ 复拼 religate; ˵ → 双引号。
          # 重音/修饰符走 accent 机制形 (无字体槽位依赖): ¯→\={} ǎ→\v{a}
          # ˆ→\^{}; ‰/€ 落文本字体 (lmroman 有槽) → \textperthousand/\texteuro;
          # ✓ → kernel 数学字形 \surd (免 amssymb 依赖); ₁₂ ∀∃∈∘∧∨∪⟨⟩
          # 数学符号字面 → \ensuremath 双模无恙。
          - { id: tab, cps: [0x0009], replace: " " }
          - { id: permill, cps: [0x2030], replace: "\\mbox{\\textperthousand}" }
          - { id: euro, cps: [0x20AC], replace: "\\mbox{\\texteuro}" }
          - { id: checkmark, cps: [0x2713], replace: "\\ensuremath{\\surd}" }
          - { id: macron, cps: [0x00AF], replace: "\\mbox{\\={}}" }
          - { id: boxdraw_251c, cps: [0x251C], replace: "{}" }
          - { id: acaron, cps: [0x01CE], replace: "\\mbox{\\v{a}}" }
          - { id: fi_lig, cps: [0xFB01], replace: "fi" }
          - { id: modcirc, cps: [0x02C6], replace: "\\mbox{\\^{}}" }
          - { id: sub1, cps: [0x2081], replace: "\\ensuremath{_1}" }
          - { id: sub2, cps: [0x2082], replace: "\\ensuremath{_2}" }
          - { id: forall, cps: [0x2200], replace: "\\ensuremath{\\forall}" }
          - { id: exists, cps: [0x2203], replace: "\\ensuremath{\\exists}" }
          - { id: isin, cps: [0x2208], replace: "\\ensuremath{\\in}" }
          - { id: composeop, cps: [0x2218], replace: "\\ensuremath{\\circ}" }
          - { id: wedgeop, cps: [0x2227], replace: "\\ensuremath{\\wedge}" }
          - { id: veeop, cps: [0x2228], replace: "\\ensuremath{\\vee}" }
          - { id: cupop, cps: [0x222A], replace: "\\ensuremath{\\cup}" }
          - {
              id: langle_27e8,
              cps: [0x27E8],
              replace: "\\ensuremath{\\langle}",
            }
          - {
              id: rangle_27e9,
              cps: [0x27E9],
              replace: "\\ensuremath{\\rangle}",
            }
          - { id: dblgrave, cps: [0x02F5], replace: "\\mbox{''}" }
          # ── 2026-09-20 erafam char-table (failmine7 桶 → lane-erafam census) ──
          # ‒ figuredash .bbl 字面落 lmroman12 (2603.07352) —— U+2012 在
          #   全部 _FB_RANGES 带外, fb 永不绑; "--" 是 canonical 近似
          - { id: figuredash, cps: [0x2012], replace: "--" }
          # ļ/ņ 拉脱维亚人名 \name{}/\textbf{} 内 (2603.08182): fb 绑定
          #   已在树 (newunicodechar 行在), 但 \name preamble 期 token 化
          #   catcode-11 字面逃出 AtBeginDocument 活化窗 → 落 cmunbx 缺字。
          #   字面替换在源级灭字, 与捕获时序无关。注: 已改树上会碰 fb
          #   行内同字面 —— fresh-run 路径干净 (census 已注)。
          - { id: lcomma, cps: [0x13C], replace: "\\mbox{\\c{l}}" }
          - { id: ncomma, cps: [0x146], replace: "\\mbox{\\c{n}}" }
          # । danda 在 \texttt{\detokenize{...}} regex 展示行内
          #   (2511.15886) —— detokenize 双挡 active-char 绑定与 cs 注入,
          #   且无已装字体覆盖 U+0964 (fb 也救不了) → 剥除唯一可达;
          #   有损 (regex 字类少一员) census 已注。
          - { id: danda, cps: [0x964], replace: "{}" }
          # ── failmine8 A1 补表 (2026-09-20, OTF/T1 缺字尾, 14 cps/12 cells) ──
          # ℝℚℂ 双线大写 + ∂ 落 lmmono8/9 (2608.09867/2609.19352/2609.20805,
          #   lean/literate 代码字面): \mathbb 依赖 amssymb, 观测格已载
          #   (同 dblz 先例 —— 未载格 warn 转 undefined_cs 由派发链接手);
          #   ∂ 是 kernel 数学形无依赖。
          - { id: dblr, cps: [0x211D], replace: "\\ensuremath{\\mathbb{R}}" }
          - { id: dblq, cps: [0x211A], replace: "\\ensuremath{\\mathbb{Q}}" }
          - { id: dblc, cps: [0x2102], replace: "\\ensuremath{\\mathbb{C}}" }
          - { id: partial, cps: [0x2202], replace: "\\ensuremath{\\partial}" }
          # 数学斜体字母落 LinLibertine 文本字体 (2609.20309/2510.02854)
          #   —— kernel 数学字形 (micro 先例), 斜体面不追求粗细细节
          - { id: itmu, cps: [0x1D707], replace: "\\ensuremath{\\mu}" }
          - { id: ittheta, cps: [0x1D703], replace: "\\ensuremath{\\theta}" }
          # ⪪ SMALLER THAN 关系符 (2609.19583 LinLibertine) → 字面义 <
          - { id: smaller_than, cps: [0x2AAA], replace: "\\ensuremath{<}" }
          # ― HORIZONTAL BAR 引文横棒 (2504.14870 ``― Yann LeCun``)
          #   —— emdash 同形; ‑ 不断行连字符 (2503.23278 third‑party 族)
          #   \mbox 内不折行与 hyphen 同形; ≥ leq 镜像; → kernel 箭头
          #   (2501.19393 \textbf{V2 → V3} 落 t1-stix TFM 无槽)
          - { id: horizbar, cps: [0x2015], replace: "\\mbox{---}" }
          - { id: nbhyphen, cps: [0x2011], replace: "\\mbox{-}" }
          - { id: geq, cps: [0x2265], replace: "\\ensuremath{\\geq}" }
          - { id: rarrow, cps: [0x2192], replace: "\\ensuremath{\\rightarrow}" }
          # Վ 亚美尼亚大写 VEW (1109.1915 lmroman9) —— 孤立字母按音写还 V
          - { id: armenian_vew, cps: [0x054E], replace: "V" }
          # ─│ 制表符 ascii-art (2408.07394 Verbatim 域内/nlin bbl 侧)
          #   —— 语义还原 ASCII 对等 (╨→- 先例, 有对等则还原非剥除);
          #   Verbatim 遮盖域内站点本臂够不到, 前瞻收非逐字面
          - { id: boxdraw_2500, cps: [0x2500], replace: "-" }
          - { id: boxdraw_2502, cps: [0x2502], replace: "|" }
          # ── 2026-09-20 重音拉丁字面补表 (作者名/keywords 批观测) ──
          # ğ ń ć š ł č ž ū ę ė 加大写兄弟 —— 全落 [0xC0,0x17F] fb 带,
          # 但 pre-tokenized 上下文 (\name/\textbf preamble 期 token 化)
          # fb 绑不住 (lcomma/ncomma 同机理先例), 源级字面替换灭字与
          # 捕获时序无关。一律 accent 机制形 (无字体槽位依赖): \v 卡隆/
          # \u 短音符/\' 尖音/\k 反尾形符/\. 上点/\= 长音符; ł/Ł 有专 cs
          # \l/\L 直接走。\' 在 yaml 双引号内是非法转义 → 单引号包。
          - { id: ccaron, cps: [0x10D], replace: "\\mbox{\\v{c}}" }
          - { id: ccaron_up, cps: [0x10C], replace: "\\mbox{\\v{C}}" }
          - { id: gbreve, cps: [0x11F], replace: "\\mbox{\\u{g}}" }
          - { id: gbreve_up, cps: [0x11E], replace: "\\mbox{\\u{G}}" }
          - { id: edot, cps: [0x117], replace: "\\mbox{\\.{e}}" }
          - { id: edot_up, cps: [0x116], replace: "\\mbox{\\.{E}}" }
          - { id: eogonek, cps: [0x119], replace: "\\mbox{\\k{e}}" }
          - { id: eogonek_up, cps: [0x118], replace: "\\mbox{\\k{E}}" }
          - { id: lstroke, cps: [0x142], replace: "\\mbox{\\l}" }
          - { id: lstroke_up, cps: [0x141], replace: "\\mbox{\\L}" }
          - { id: nacute, cps: [0x144], replace: '\mbox{\''{n}}' }
          - { id: nacute_up, cps: [0x143], replace: '\mbox{\''{N}}' }
          - { id: cacute, cps: [0x107], replace: '\mbox{\''{c}}' }
          - { id: cacute_up, cps: [0x106], replace: '\mbox{\''{C}}' }
          - { id: scaron, cps: [0x161], replace: "\\mbox{\\v{s}}" }
          - { id: scaron_up, cps: [0x160], replace: "\\mbox{\\v{S}}" }
          - { id: zcaron, cps: [0x17E], replace: "\\mbox{\\v{z}}" }
          - { id: zcaron_up, cps: [0x17D], replace: "\\mbox{\\v{Z}}" }
          - { id: umacron, cps: [0x16B], replace: "\\mbox{\\={u}}" }
          - { id: umacron_up, cps: [0x16A], replace: "\\mbox{\\={U}}" }
          # ── 2026-09-28 qc-impl 补表 (vault QC replay vis_degenerate 桶) ──
          # PUA F067/F074 = Symbol 字体私区字面后随真数学 (0812.1274)
          # —— γ/τ 语义还原 (同 pua_f047 先例但本对有数学对等)
          - { id: pua_f067, cps: [0xF067], replace: "\\ensuremath{\\gamma}" }
          - { id: pua_f074, cps: [0xF074], replace: "\\ensuremath{\\tau}" }
          # ߞ U+07DE Adlam 误植进 biblio (1306.0160) —— 无拉丁对等, 剥除
          - { id: adlam_07de, cps: [0x07DE], replace: "{}" }
          # □ U+25A1 白方块 (2105.00157 lmroman 无槽) —— picture env 内
          # \framebox(w,h) 才是真图形盒; 裸文本态 \framebox(7,7) 会把
          # '(' 误当必选参排版 —— 须连 picture 环境一起注
          - {
              id: white_sq,
              cps: [0x25A1],
              replace: "\\mbox{\\begin{picture}(7,7)\\put(0,0){\\framebox(7,7){}}\\end{picture}}",
            }
          # 圈码 ①-⑳ (2503.01891) —— builtin 序数臂缺位期 replace 表
          # 逐码位显式映射是唯一可达面; \textcircled 核心自带,
          # \scriptsize 防圈外溢出
          - { id: circ_01, cps: [0x2460], replace: "\\mbox{\\textcircled{\\scriptsize 1}}" }
          - { id: circ_02, cps: [0x2461], replace: "\\mbox{\\textcircled{\\scriptsize 2}}" }
          - { id: circ_03, cps: [0x2462], replace: "\\mbox{\\textcircled{\\scriptsize 3}}" }
          - { id: circ_04, cps: [0x2463], replace: "\\mbox{\\textcircled{\\scriptsize 4}}" }
          - { id: circ_05, cps: [0x2464], replace: "\\mbox{\\textcircled{\\scriptsize 5}}" }
          - { id: circ_06, cps: [0x2465], replace: "\\mbox{\\textcircled{\\scriptsize 6}}" }
          - { id: circ_07, cps: [0x2466], replace: "\\mbox{\\textcircled{\\scriptsize 7}}" }
          - { id: circ_08, cps: [0x2467], replace: "\\mbox{\\textcircled{\\scriptsize 8}}" }
          - { id: circ_09, cps: [0x2468], replace: "\\mbox{\\textcircled{\\scriptsize 9}}" }
          - { id: circ_10, cps: [0x2469], replace: "\\mbox{\\textcircled{\\scriptsize 10}}" }
          - { id: circ_11, cps: [0x246A], replace: "\\mbox{\\textcircled{\\scriptsize 11}}" }
          - { id: circ_12, cps: [0x246B], replace: "\\mbox{\\textcircled{\\scriptsize 12}}" }
          - { id: circ_13, cps: [0x246C], replace: "\\mbox{\\textcircled{\\scriptsize 13}}" }
          - { id: circ_14, cps: [0x246D], replace: "\\mbox{\\textcircled{\\scriptsize 14}}" }
          - { id: circ_15, cps: [0x246E], replace: "\\mbox{\\textcircled{\\scriptsize 15}}" }
          - { id: circ_16, cps: [0x246F], replace: "\\mbox{\\textcircled{\\scriptsize 16}}" }
          - { id: circ_17, cps: [0x2470], replace: "\\mbox{\\textcircled{\\scriptsize 17}}" }
