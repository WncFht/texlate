  # ─── hangul 缺字专臂 (hangulfont lane 2026-09-19) ───
  # 谚文码位落在无 hangul 块的字体: KAIST 韩文论文 2403.00013 ×1341
  # (FandolSong/Hei script=hani —— ctex 路由只认 CJK 家族, Fandol 本无
  # hangul) + 2410.18001 ×545 (lmroman)。cjk_font_fallback 旧带表含
  # [AC00,D7AF] 会把谚文绑回 FandolSong = 错字体谎报 → 已剔出, 谚文归
  # 本臂绑 ko 覆盖字体。候选序: TL 内 unfonts-core UnDotum.ttf 文件形
  # (scheme-full 的 collection-langkorean; 缺包 install_file 补) 优先,
  # fontconfig 家族名 (noto-cjk/plex-kr/nanum/malgun 常见 OS 件) 兜底;
  # 全灭 → decline 诚实 unfixable, 不发错字体声明。
  - id: hangul_font_fallback
    mechanisms: [W42, W43]
    description: "谚文缺字落无 hangul 字体 → newunicodechar 逐字回退 ko 覆盖字体 (候选探测式)"
    phase: loop
    order: 28 # cjk_font_fallback(27) 之后; 谚文段已自 cjk 带表剔出, 两臂带互不重叠
    when:
      any:
        - { category: warn_missing_char }
        - { category: warn_utf8 } # 同 missing_char_fix —— 类别排他 quirk 补漏
    action:
      kind: builtin_transform
      function: font_fallback
      params:
        # hangul 五段: 字母 jamo / 兼容 jamo / ext-B / 谚文音节 / ext-C
        fallback_ranges:
          - [0x1100, 0x11FF]
          - [0x3130, 0x318F]
          - [0xA960, 0xA97C]
          - [0xAC00, 0xD7A3]
          - [0xD7B0, 0xD7FB]
        # 有序候选: 文件形名走 kpathsea 探测 (+install 补装), 家族名走
        # fc-list 探测 —— 首个可解析者胜出 (builtins _fb_font_resolve)。
        fallback_fonts:
          - { name: "UnDotum.ttf", install: true } # TL unfonts-core (collection-langkorean)
          - "Noto Sans CJK KR" # OS noto-cjk 包 (debian/arch/macos 常见)
          - "IBM Plex Sans KR"
          - "Nanum Gothic"
          - "Malgun Gothic"
        # 独立 cs 名 —— 与 txlatefallback/txlatecjkfb 并存不撞
        fallback_cs: txlatekofb
        # 缺字字体名已具 hangul 覆盖 → 真缺字形不归本臂 (防自回环)。
        # fandol/texlatecjk 刻意不收——Fandol 系无 hangul 块正是病灶;
        # uming/ukai (IPA 日系) 亦无 hangul 块 → 不收, 落其上的谚文照认领。
        font_not: "noto.*(cjk|kr|korean)|source.?han|sarasa|hanazono|nanum|malgun|kopub|plex.*kr|apple|batang|dotum|gulim|gungsuh|myeongjo|dinaru|un(batang|dotum|graphic|pilgi|gungseo|dinaru|shinmun|yetgul|pen|taza|vada|park|jamo|bom|yeti|sora)|hcr|hamchorom|jamo|baekmuk|droid.*fallback|wqy|lxgw"
    risk: low # newunicodechar 逐字绑; 候选探测不过即 decline 不注入
    known_gap: "死 \\selectfont 上下文内无效 (同 cjk 臂); 无 fontconfig 且 texmf 无 unfonts 的极简环境 decline; tectonic probe_file 只查工程内文件 —— texmf 文件形候选恒 miss, 实走 fontconfig 家族名臂"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2403.00013 (drvverdict resid, KAIST 韩文论文; stagerun-drvdef/flipcheck8)",
          error: "Missing character: hangul ×1341 in [FandolSong/Hei*.otf]/OT:script=hani —— CJK 字体无 hangul 块",
        }
      - {
          corpus: "2410.18001 (stagerun-rt1/flipcheck)",
          error: "Missing character: hangul ×545 in lmroman —— 谚文路由未达 CJK 机制",
        }
    stats: { fires: 2, status: proposed }
    source_ref: "hangulfont lane census 2026-09-19 (tmp/hangulfont/census.json): 2 cells ×4 run-records"

  # ─── F4f (misscharcen #169, loop3 残余普查): bibtex-era ``^^XX`` UTF-8
  # 字节记法解码 —— 每 ``^^XX`` 在 xetex 下读作独立码位 U+00XX: 高位字节
  # 产 C1 (U+0080-9F) 缺字, 低位字节产 â/¼ 等静默 mojibake。门控 = 日志
  # 见 C1 缺字 (字节记法指纹); 解码面 = 全文 ``^^XX`` 段中严格合法 UTF-8
  # 多字节序列 → 字面量还原 (2104.00026 master2020.bbl: ^^e2^^80^^93=
  # en-dash ×4 + ^^c3^^bc=ü —— 后者字节都落 Latin-1 有槽面零缺字,
  # 字节级 seen-门会漏这类不可见 mojibake, 段级解方一并还原)。
  - id: caret_utf8_fix
    mechanisms: [W42, W43]
    description: ".bbl/.tex ``^^XX`` UTF-8 字节记法 → 解码还原字面量 (C1 缺字指纹门)"
    phase: loop
    order: 25.9 # 产出类站点臂簇尾 (accent 25.5/cs_rebind 25.7/macro_glyph 25.8 之后)
    when:
      any:
        - { category: warn_missing_char }
        - { category: warn_utf8 }
    action:
      kind: builtin_transform
      function: caret_utf8_fix
      params:
        exts: [.tex, .bbl]
    risk: low # 严格 UTF-8 校验, 非法序列原样回吐; 单 token ^^41/^^0d 合法记法不动
    known_gap: "纯 Latin-1 面字节对 (^^c3^^bc 类零 C1 缺字) 不产指纹 → 不可见 mojibake 不属证据修复面; .aux/.toc 同机制未收 (零观测)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2104.00026 (loop3 残余普查 tmp/lane-misscharcen/cells.json) master2020.bbl",
          error: 'Missing character: no ^^80 (U+0080)/^^93 (U+0093) ×4 lmroman9 —— bibtex 字节记法 ^^e2^^80^^93=en-dash / ^^c3^^bc=ü',
        }
    stats: { fires: 0, status: proposed }
