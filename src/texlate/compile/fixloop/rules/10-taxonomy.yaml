  # (Disabling-ligatures 折行 / kerning|spacing only works with pdftex
  # 1.40 / Font expansion does not work with xetex) —— microtypelis 修
  # 复臂已走 other-dispatch, 本行把不可见流量转为可测签名。
  - { id: microtype_pdftex, scope: head, pattern: "Package microtype Error" }
  # siunitx_err ×6: Invalid number 'X' / prefix-no-unit / pkg-incompatible。
  - { id: siunitx_err, scope: head, pattern: "Package siunitx Error" }
  # acro_err ×1: acro v3 属性定义错 (折行 msg, acro_v3_key_rename 配套)。
  - { id: acro_err, scope: head, pattern: "Package acro Error" }
  # pgfplots_err ×2 / amsmath_err ×2: 各自包内结构错族。
  - { id: pgfplots_err, scope: head, pattern: "Package pgfplots Error" }
  - { id: amsmath_err, scope: head, pattern: "Package amsmath Error" }
  # latex_hooks ×4: 钩子管理错 (generic-hook add / sort-rule 时序)。
  - { id: latex_hooks, scope: head, pattern: "LaTeX hooks Error" }
  # —— 内核/装载语义错族 ——
  # counter_undef ×11: `No counter 'X' defined` —— payload=计数器名
  # ('theorem' env-polyfill 族 + '这是译文' zh-leak 槽)。
  - {
      id: counter_undef,
      scope: head,
      payload_group: 1,
      pattern: "No counter '([^']+)' defined",
    }
  # fontsize_undef ×2: 字号命令未定义 (stubfid .clo 缺口), payload=cs。
  - {
      id: fontsize_undef,
      scope: head,
      payload_group: 1,
      pattern: "The font size command (\\\\[A-Za-z@]+) is not defined",
    }
  # symbol_font ×1: 声明/未定义家族三措辞 —— `Too many symbol fonts
  # declared` (无组→None) / `Symbol font `X' (is )?not defined`
  # (payload=字体名 gns@font)。
  - {
      id: symbol_font,
      scope: head,
      pattern: "Too many symbol fonts declared|Symbol font [`']([\\w@]+)' (?:is )?not defined",
    }
  # nfss_setup ×11 (bare-NFSS 兜底臂): `NFSS system isn't set up
  # properly` 无 `^No file X.fd` 探测行时, 前列 use_pre missing_file 臂
  # 够不着 —— 双证在场仍归 missing_file|X.fd (评估序), 裸 NFSS 中止
  # 归本类 payload=None。
  - {
      id: nfss_setup,
      scope: head,
      pattern: "NFSS system isn't set up properly",
    }
  # nfss_corrupt ×4: NFSS 内表腐败 (era 字体机械)。
  - { id: nfss_corrupt, scope: head, pattern: "Corrupted NFSS tables" }
  # grouped_load ×4 / preamble_only ×2 / options_section ×1 /
  # pkg_before_docclass ×1: 装载时序四签。
  - {
      id: grouped_load,
      scope: head,
      pattern: "Loading a class or package in a group",
    }
  - { id: preamble_only, scope: head, pattern: "Can be used only in preamble" }
  - {
      id: options_section,
      scope: head,
      pattern: "(?:\\\\RequirePackage|\\\\LoadClass|\\\\usepackage) (?:or|and) \\\\[A-Za-z@]+ in Options Section",
    }
  - {
      id: pkg_before_docclass,
      scope: head,
      pattern: "(?:\\\\usepackage|\\\\RequirePackage) before \\\\documentclass",
    }
  # nested_depth ×1 / cs_eol ×2 (\\verb ended by end of line)。
  - { id: nested_depth, scope: head, pattern: "Too deeply nested" }
  - {
      id: cs_eol,
      scope: head,
      payload_group: 1,
      pattern: "(\\\\[A-Za-z@]+) ended by end of line",
    }
  # cs_mismatch ×11: 定界宏参形错配 (csdefmismatch lane 修过 5) ——
  # 交替三支: 字母串 cs / 单字符 nonletter / `\<space>` 空格 cs
  # (`Use of \  doesn't` 双空格实证形; 提案 `\\\S` 漏此支, 补 `\\ `)。
  - {
      id: cs_mismatch,
      scope: head,
      payload_group: 1,
      pattern: "Use of (\\\\[A-Za-z@]+|\\\\\\S|\\\\ ) doesn't match its definition",
    }
  # vmode_prim ×11: 模式外原语 (\spacefactor/\unskip/\eqno/\halign,
  # spacefactor lane other-dispatch 修复面)。
  - {
      id: vmode_prim,
      scope: head,
      payload_group: 1,
      pattern: "You can't use [`'](\\\\[A-Za-z@]+)' in (?:vertical|horizontal|math|LR|internal) mode",
    }
  # lr_mode ×2: LR-mode 限制 (vmode_prim 同族异措辞)。
  - { id: lr_mode, scope: head, pattern: "Not allowed in LR mode" }
  # incomplete_if ×3: `Incomplete \if*; all text was ignored` ——
  # ifclose/ifprot 修复臂的签名面, payload=条件 cs。
  - {
      id: incomplete_if,
      scope: head,
      payload_group: 1,
      pattern: "Incomplete (\\\\if\\w*); all text was ignored",
    }
  # extra_brace ×5: `Too many }'s` 非对称闭括号 (syntax 交替无
  # 'Too many' 词, 独立成行)。
  - { id: extra_brace, scope: head, pattern: "Too many }'s" }
  # —— 数值/数学/排版引擎错族 ——
  # display_math_close ×2 / dim_overflow ×5 / arith_overflow ×1 /
  # output_loop ×3 / mathchar_ext ×1 / xypic_err ×1。
  - {
      id: display_math_close,
      scope: head,
      pattern: "Display math should end with \\$\\$",
    }
  - { id: dim_overflow, scope: head, pattern: "Dimension too large" }
  - { id: arith_overflow, scope: head, pattern: "Arithmetic overflow" }
  - {
      id: output_loop,
      scope: head,
      pattern: "Output loop---\\d+ consecutive dead cycles",
    }
  - {
      id: mathchar_ext,
      scope: head,
      pattern: "Extended mathchar used as mathchar",
    }
  - {
      id: xypic_err,
      scope: head,
      pattern: "Xy-pic error|A <box> was supposed to be here",
    }
  # 2026-09-16 扩 syntax 族: Extra }/\\endgroup/\\right/\\middle/\\else/\\fi/\\or
  # 与 Forgotten \\endgroup —— 组/定界/条件多 token 错误归 syntax
  # (astro-ph/0306068 "Extra }, or forgotten $." 原是 other 兜底;
  # Extra \\end 已由 env_mismatch 先行接住, 不重复列)。
  - id: syntax
    scope: head
    pattern: "Missing|Runaway|Paragraph ended|Misplaced|Double subscript|Illegal|There's no line|Lonely|Bad math|Something's wrong|not in outer par|allowed only in math|improper|Extra \\}|Forgotten \\\\endgroup|Extra \\\\(?:endgroup|right|middle|else|fi|or)\\b"
  # 兜底: 首错行在场必命中 —— rep.first 恒为 texlog.iter_log_events/
  # match_error_line 认证的错误行 ('!' 或 file-line `f.tex:N:` 形),
  # 故 `^.` 即「有签名错」全量覆盖。
  # 旧写 `^!` 漏 file-line 形: 无 head 签的 file-line 首错落 tail 段被
  # early_eof 吞 (W126: 0806.2594 TUletters / astro-ph/0408240 natbib-aux
  # 实证, \begin{document} 期 aux 读/字体声明错皆此形)。
  - { id: other, scope: head, pattern: "^." } # 兜底: 有错误行必命中
  # —— tail 段: 仅当全文 0 个 '!' 行时评估 (交互式缺文件/Emergency) ——
  # preempts: 致命尾错夺弱 head 类的路由 (regress4-2410.00012: chemgreek
  # 缺档是真杀手, 此前永远被上游包内 undefined_cs 抢路由)。early_eof
  # 不挂——零页是后果不是可修因, 抢占会盖住可行动的 head 错。
  - {
      id: missing_file,
      scope: tail,
      payload_group: 1,
      pattern: "File `([^']+\\.[a-zA-Z0-9_]+)' not found",
      guard: "Enter file name|Emergency",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  - {
      id: missing_file,
      scope: tail,
      payload_group: null,
      pattern: "Enter file name",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  # tail 行同款收紧 (aastex 横幅会落 tail 30 行内抢签) —— 与 head 行同表。
  # preempts [other]: `^.` 兜底后 file-line 形签名错恒归 other, 旧经裸
  # tail 评估可达的「file-line 错 + 尾段 2.09 横幅 → latex209」路由由此
  # 保留 (other 是唯一可夺类, 真签名类不被抢)。
  - {
      id: latex209,
      scope: tail,
      pattern: "(?m)\\\\documentstyle\\b|LaTeX 2\\.09 COMPATIBILITY MODE|LaTeX2e command[^\\n]*\\bin LaTeX 2\\.09|LaTeX Version 2\\.09|^[ \\t]*Compatibility mode",
      preempts: [other],
    }
  # —— cls/sty 「求档文」尾段: 类文件内部 \IfFileExists 失败→\stop 死路
  #   (aastex61 "Please update your system to include revtex4-1.cls" 实证:
  #   \stop 夹在条件内 → \end occurred incomplete, 无 '!' 无 missing_file
  #   行) —— plea 提出的文件名即 actionable payload, 归 missing_file 让
  #   install/shim 链接手; 须排在 early_eof 之前 (同尾共存时 plea 优先) ——
  - {
      id: missing_file,
      scope: tail,
      payload_group: 1,
      pattern: "(?:include|download|install|get|need)\\s+(\\S+\\.(?:cls|sty|clo|tex|def|fd|map|cfg))",
      guard: "No pages of output",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  # —— 干净日志零页面: TeX 早夭但无 '!' 行 (1706.00175 实证:
  #   "(\end occurred when \ifx on line 27 was incomplete)" + "No pages of
  #   output") —— guard 把「有页输出仅带 \end occurred 警告」挡在外面 ——
  - {
      id: early_eof,
      scope: tail,
      payload_group: 1,
      pattern: "\\\\end occurred (?:when (\\\\?\\w+)[^\\n]*?incomplete|inside a group)",
      guard: "No pages of output",
    }
  - {
      id: early_eof,
      scope: tail,
      pattern: "No pages of output",
      payload_group: null,
    }
  # —— warnings 段: 无 '!' 且无 tail 命中, 但 warning 红线命中 (v1.1) ——
  - { id: warn_utf8, scope: warnings, warn_id: invalid_utf8 } # docs/spec/compile.md non_utf8_source 的类别入口
  - { id: warn_missing_char, scope: warnings, warn_id: missing_char } # F4: 无 '!' 错但缺字 → 分诊修复入口
  # 版面缺陷入口 (qc 补票格的 log 驱动面; 序位在缺字族后——缺字语义
  # 损伤更重, 同命中时先分诊)
  - { id: warn_overfull, scope: warnings, warn_id: overfull_hbox } # qc layout:overfull/geo_margin_breach 同根
  - { id: warn_float_big, scope: warnings, warn_id: float_too_large } # qc layout:float_lost/float_fit 同根
  # 都不中: err 为空 → clean; err 非空 → other
