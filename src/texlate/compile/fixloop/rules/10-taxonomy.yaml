# rules/10-taxonomy.yaml — 分类学段（scope:head 按序首命中，序即语义）
# 段内条目顺序为分类评估序，插入新类须想清楚落点。来源同 00-base.yaml。
version: 1

# ════════════════════════════════════════════════════════════════
# 第一层: 分类学 —— log → (category, payload)
# 评估序: 存在错误行 ('!' 或 file-line `f.tex:N:` 形) 时按序首命中
#         (scope:head, 输入=首错行+其后8行); 全文无错误行时评估
#         scope:tail 段 (输入=log 末 30 行);
#         仍无命中但有 warning 命中 → scope:warnings 驱动 warn_* 类。
# 对应 fixloop.py classify() L67-125。
# ════════════════════════════════════════════════════════════════
taxonomy:
  # —— 文件缺失类 (抓文件名 → install_file) ——
  # 2026-09-20 taxon2/pdfex lane: 扩展名类补 "_" —— `figure2a.pdf_tex`
  # 系 \input{*.pdf_tex} 缺档旧穿 head 全臂落 other → tail `Enter file
  # name` 臂 (payload_group:null) 抢成 missing_file|None 丢 payload;
  # head `File`/`Cannot find` + tail 同款 `File` 三位同补。`.sty`/多段
  # `x.y.z.tex` 捕获不变。
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "File `([^']+\\.[a-zA-Z0-9_]+)' not found",
    }
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "I can't find file `([^']+)'",
    }
  # 2026-09-16 第三种缺档措辞: `\PackageError` 自报 "Cannot find the
  # file X.ext" (无反引号对) —— textgreek.sty:39 lgrenc.def 实证
  # (1706.02694/2308.00072/2410.06051 三格同墙, greek-fontenc 一包全解);
  # 不盖 'File `X' not found' 主签名, 互补并列。
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "Cannot find the file\\s+([\\w@.+-]+\\.[a-zA-Z0-9_]+)",
    }
  # 2026-09-19 nfssfd lane (loop2 普查 8 cells): NFSS .fd 缺档硬错——
  # 内核 \try@load@fontshape 先 \InputIfFileExists{<小写名>} 再
  # \@input@{<原名>}, 双探皆空 → \typeout 裸行 `No file X.fd.` 先于
  # 错误行 ~2 行落 log, 在 ctx8 前向窗外 → 旧恒归 other|None 无路由。
  # use_pre 把本条目检索面扩到首错前 _PRE_LINES 行 (pre+head blob,
  # 仅本条目——他条目 head-only 不变)。双重约束防误签:
  #   `^No file` 行首锚 —— `LaTeX Font Info:    No file X.fd.` 行内
  #     形态 (可恢复字体替换 info, 非硬错) 与 `No file X.bbl/toc` 等
  #     非 .fd 探测行天然排除;
  #   `NFSS system isn't set up properly` 同窗 —— 可恢复 .fd 缺档
  #     (内核 substitution 成功无后续硬错) 不误路由。
  # payload=X.fd 原名 → install_file (font_related_exts 含 fd);
  # 大小写桥在 _apply_install_file .fd 小写变体 (内核同序: 小写先探,
  # filemap `lgrcmr.fd`→cbfonts-fd, `LGRcmr.fd` 原名无键)。
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      use_pre: true,
      pattern: "(?m)^No file ([\\w@.+-]+\\.fd)\\.[ \\t]*\\n[\\s\\S]{0,600}?NFSS system isn't set up properly",
    }
  # 2026-09-20 taxonfix lane: tikz 库缺档自报 "I did not find the tikz
  # library 'X'" (Package tikz Error, file-line 形) —— payload=库名 (非
  # 文件名), tikz_library_install/pgf_library_install 两臂按命名约定
  # 拼 tikzlibrary{lib}.code.tex / pgflibrary{lib}.code.tex 走 filemap
  # (2308.00056 quantikz / 2609.20331+2609.20771 quantikz2 实证;
  # 旧恒归 other 永远够不到 install 面)。
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "did not find the tikz library '([^']+)'",
    }
  # 2026-09-20 routeclean: jabbrv.sty 自报缺伴档两措辞 (PackageError 形,
  # file-line 头) —— e-print 只带 jabbrv.sty 不带 .ldf 伴档 (jabbrv ∉ TL
  # 无包可装, install_file 索引恒 miss), 恒归 other 永远够不到 vendor
  # 面。payload=.ldf 名 → vendored_fetch 递 vendor/files 真档 (ltwa-all/
  # ltwa-en/jabbrv.sty 三件套随包, 语料 4 独立稿逐字节同档; 2507.10677
  # "master abbreviation language file `X' was not found" / "Abbreviation
  # language `X' not found" 双形实证)。
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "breviation language(?: file)? `([^']+\\.ldf)' (?:was )?not found",
    }
  # 2026-09-20 taxon2 lane: fontspec 装载的 TU/ 编码 NFSS 字体缺载行
  # `Font TU/<fam>(<i>)/m/n/<sz>[=<ext>]/OT at <d>pt not loadable` —— TU 为
  # fontspec 专属编码, 永不走 TFM; 旧落 missing_tfm 臂, 前缀 \S*? 膨胀到
  # 末段 `/OT` 后零宽 \s* 抓 "OT" 作死 payload (soak-2026-09-18
  # 2609.19944 errs 12 条实证 missing_tfm|OT, install_tfm 恒 miss)。
  # 改归 fontspec_missing: payload=去 .otf/.ttf/.ttc 扩展名与 (N) 实例缀
  # 的家族名 → install_sysfont try_exts 复原扩展名投递。须排在
  # missing_tfm 全臂之前 (评估序), 否则本签永远轮不到。
  - {
      id: fontspec_missing,
      scope: head,
      payload_group: 1,
      pattern: 'Font TU/([^\s/(]+?)(?:\.(?:otf|ttf|ttc))?(?:\(\d+\))?/[^\n]*?not loadable',
    }
  # —— TFM 字体缺失 (抓字体名=文件名 → install_tfm) ——
  # payload 类须含 "-": SkakNew-Diagram 型名按 [a-zA-Z0-9]/\w 抓会在
  # 连字符处截断成 "Diagram" → filemap 必 miss (loop1-2211.12985 实证)。
  # 2026-09-20 taxon2 lane: 规格两形 —— `\font\X=name at <d>pt` 印
  # "at Npt", `\font\X=name scaled <n>` 印 "scaled N" (harmony.sty:62
  # \newfont{\NOTEN}{musix13 scaled \value{notescl}} → "scaled 1200",
  # 2512.04896 实证归 other|None); scaled 可负 (镜像字体)。
  - {
      id: missing_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Font \\\\?\\S*?=?\\s*([\\w-]+) (?:at [0-9.]+pt|scaled -?[0-9]+) not loadable",
    }
  - {
      id: missing_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Metric \\(TFM\\) file[^\\n]*?([\\w-]+)\\.(tfm)",
    }
  # 2026-09-20 tfmhoist lane (tfmcen 普查 13 格全中): 下游驱动按裸名走
  # TFMFONTS 只认 compile cwd 扁平位, doc 自带私有 .tfm 在子目录够不到 →
  # xdvipdfmx:fatal / tectonic `error:` 双形 (引号内裸名无 .tfm 缀)。TeX 侧
  # 错清完后签名经 _report_of stdout_tail 归一 (! xdvipdfmx:fatal: …) 才落
  # head 段——stacked-error 格语义正确: 上游错没清永远轮不到驱动层。
  # 归 missing_tfm 非新类: install_tfm(20) 先尝 CTAN 可解名, 私有名 filemap
  # 必 miss benign-decline → driver_tfm_hoist(21) 同轮接住归位。
  - {
      id: missing_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Unable to find TFM file\\s*\\\\?\"([\\w.-]+)",
    }
  # —— fontspec 时代错配 / 系统字体缺失 ——
  - {
      id: xetexglyph_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Cannot use XeTeXglyph with (\\S+)",
    }
  - {
      id: missing_pfb,
      scope: head,
      pattern: "Cannot proceed without .vf|physical font",
    }
  # —— xdvipdfmx PS 硬墙 (tectonic 无 gs 通道; 实证签名 fixloop-v2 整改) ——
  # compilebench taxonomy 对应类别名 ps_image; 首错为
  # "! something bad happened inside xdvipdfmx" (stdout_tail 归一),
  # ctx8 内含 "caused by: pdf: image inclusion failed for "X.eps""。
  - {
      id: ps_image,
      scope: head,
      payload_group: 1,
      pattern: 'image inclusion failed for "([^"]+\.(?:eps|ps|EPS|PS))"|PostScript images are not supported',
    }
  # metapost 数字扩展名变体 (0806.4589: diag1.1 实为 EPS 产物; 上行只认
  # .eps/.ps → 漏归 other)。双引号 xdvipdfmx 形态 + 单引号 Unable-to-load
  # 形态并列; payload_group 缺省 = 首个非空组。
  - {
      id: ps_image,
      scope: head,
      pattern: "image inclusion failed for \"([^\"]+\\.[0-9]+)\"|Unable to load picture or PDF file '([^']+\\.[0-9]+)'",
    }
  # 2026-09-20 taxon2 lane: fontspec 错文按 ~79 列折行, 折点随字体名长
  # 漂 (HaranoAjiMincho-Regular 在 be|found 间断行: `cannot be\n(fontspec)
  # found;` —— soak-2026-09-18 2609.19944 实证恒归 other|None)。三处关节
  # (引号→cannot→be→found) 各容忍一个 `(<pkg>)` 续行前缀 + 空白垫;
  # 裸名单行形态 (Nimbus/Tinos/Amiri 实证已中) 不受扰。
  - {
      id: fontspec_missing,
      scope: head,
      payload_group: 1,
      pattern: 'font [“"]([^”"]+)[”"](?:\s*\([\w@*+-]+\))?\s*cannot(?:\s*\([\w@*+-]+\))?\s*be(?:\s*\([\w@*+-]+\))?\s*found',
    }
  # —— 源码级 ——
  - { id: illegal_unit, scope: head, pattern: "Illegal unit of measure" }
  - {
      id: option_clash,
      scope: head,
      payload_group: 1,
      pattern: "Option clash for package ([\\w-]+)",
    }
  - {
      # 引号两形并收: `'?\X'? (ltcmd `'\X'`/裸 \X') 与 `` `\X' `` (老
      # \@ifdefinable/amssymb 系反引号签 —— failmine2: \Bbbk 族 23 cells
      # 曾落 other 无 payload, already_def_* 规则够不到)。Control
      # sequence \X / Theorem style X 两签前缀不同, 天然不串线。
      id: already_def,
      scope: head,
      payload_group: 1,
      pattern: "Command [`']?\\\\?([\\w@]+)'? already defined",
    }
  - {
      # ntheorem 自检错 (Theorem style X already defined) —— amsthm/thmtools
      # 预定义同名 th@X 样式撞车, payload=样式名 (非 cs 名)
      id: already_def,
      scope: head,
      payload_group: 1,
      pattern: "Theorem style ([\\w@]+) already defined",
    }
  - {
      id: soul_err,
      scope: head,
      pattern: "Package soul Error|Reconstruction failed",
    }
  - { id: hyphenation, scope: head, pattern: "Not a letter" }
  - {
      # minted 缓存错配族：v3 "Missing definition for highlighting style"
      # (doc 自带 v2 *.pygstyle + frozencache 禁再生 → styledef 落空, chronic347
      # 普查 1803.00188 等 5 格实证) 与 v2 "Cannot find Pygments style" 同桶。
      id: minted_froz,
      scope: head,
      pattern: "frozencache|Cannot highlight code|Missing definition for highlighting style|Cannot find Pygments style",
    }
  # —— 2026-09-16 新增 (compilebench-v3 失败构成): inputenc 对 Unicode
  # 引擎整包拒载 (inputenc.sty:164), xelatex 走 -file-line-error 形态时
  # 首错即此。剥装载点见 inputenc_strip 规则 ——
  - {
      id: inputenc_unicode,
      scope: head,
      pattern: "inputenc is not designed for",
    }
  # 2026-09-16 收紧 (对齐 compile/engine.py _LATEX209_TAIL_RE): 裸
  # "LaTeX2.09" 字样误中 aastex 系 cls 的 info 横幅 "Original \LaTeX2.09
  # style" (LaTeX2e 文档; 2211.04503/1803.08927/1803.09046/2203.04385 四案
  # 实证)。真 2.09 只认: \documentstyle cs 本体 / 内核 compat-mode 横幅 /
  # "in LaTeX 2.09" 错文 / "LaTeX Version 2.09" 上古版横幅。
  - {
      id: latex209,
      scope: head,
      pattern: "(?m)\\\\documentstyle\\b|LaTeX 2\\.09 COMPATIBILITY MODE|LaTeX2e command[^\\n]*\\bin LaTeX 2\\.09|LaTeX Version 2\\.09|^[ \\t]*Compatibility mode",
    }
  # 冒犯 cs 取上下文"顶行"末位 (TeX 约定: 顶行末 token 即肇事者;
  # 宏展开时 l.N 行只是调用点——payload-scout-2026-09-17: 284/1146 存证
  # excerpt 抓到 \end/\maketitle 等调用点 cs, pdftex_prim 欠路由 ~23 格)。
  # head 内错误行重复两次 (first + ctx[0]), 必有后行; 顶行无 \cs 时本行
  # 不命中, 由下行裸短语兜底 payload=None。尾部非可选——可选组会在行0
  # 命中空串、永不锚到行1。旧"空 l.N 行"变体被顶行抓取完全吞并。
  # cs 名分两支: [a-zA-Z@]+ 字母串 | 单字符 nonletter cs (\+/\~/\% 等,
  # TeX 规定 nonletter cs 恰一字符)——b3a texlog 实证 \+ payload=None。
  # 2026-09-20 taxonfix lane: 提取移交 payload_scan python 提取器 (regex
  # 仍作匹配门)——\GenericError-led ctx 顶行末位是内核错误渲染宏 (真
  # 冒犯 cs 藏 #N 参内), 旧抓出 undefined_cs|GenericError 死 payload
  # (0712.1016 \diagchar / 2105.03751 \footnote 实证); 提取器对内核
  # 宏族回退 l.N 行末位非内核字母 cs → 中间展开层末位 cs。
  - id: undefined_cs
    scope: head
    pattern: "Undefined control sequence[^\\n]*\\n[^\\n]*\\\\([a-zA-Z@]+|[^\\s\\\\{}])[^\\\\\\n]*(?:\\n|$)"
    payload_group: 1
    payload_scan: undefined_cs
    subclassify:
      { pattern: "\\\\(pdf[a-zA-Z@]+)", into: pdftex_prim, payload_group: 1 }
  - { id: undefined_cs, scope: head, pattern: "Undefined control sequence" }
  # 2026-09-19 failmine2 (~13 cells): `\renewcommand`/`\RenewCommandCopy`
  # 对未定义 cs 的内核签 "Command \X undefined" (latex.ltx \renew@command,
  # `\X' 反引号形为 \MakeRobust) —— 定义点缺位与用点 "Undefined control
  # sequence" 同语义, 归同类携 cs payload → cs_targeted_fix 表查询。
  # natbib.sty:1070 \renewenvironment{thebibliography} 内 \renewcommand
  # \newblock 实证面 (老类/shim 无 \newblock 定义: 1109.6007/1306.0551/
  # astro-ph/0501240); "was never defined" 措辞形天然不落本签。
  - {
      id: undefined_cs,
      scope: head,
      payload_group: 1,
      pattern: "Command [`']?\\\\([\\w@]+)'? undefined",
    }
  # capacity payload 走 python 提取器 (payload_scan 注册表, logparse):
  # ``TeX capacity exceeded, sorry [<name>=<n>]`` bracket 归一 tag + ctx
  # 首层 pending cs → ``<tag>|<cs>`` —— triage 路由键: input_stack=递归,
  # main_memory=暴走, save_size=组泄漏 (capacity-scout-2026-09-17 4/4 格
  # 皆 input_stack)。pattern 保裸签名: bracket 折行/截断时仍归 capacity,
  # 提取退 ``<tag>``/``?|<cs>``/None 不失类。
  - id: capacity
    scope: head
    pattern: "TeX capacity exceeded"
    payload_scan: capacity
  # 2026-09-16 compile-hard 新增 (2211.13013, aux-cjk-truncation 留档):
  # 引擎自产 aux 族中间件被 8192B 写缓冲劈断多字节字符 → 下遍回读
  # "Invalid UTF-8 byte" + "! File ended while scanning use of \@newl@bel"。
  # 须在 emergency 前评估——'!' 行后 ctx8 可能混入 Emergency stop 抢签;
  # cs 名单覆盖 aux/toc/lof 回读宏族 (\@newl@bel/\@writefile/\contentsline)。
  - {
      id: aux_scan_eof,
      scope: head,
      payload_group: 1,
      pattern: "File ended while scanning use of \\\\?@?(newl@?bel|writefile|contentsline)",
    }
  # 2026-09-17 fixer-filemap (1706.07911): comment.sty 排除扫描器逐行找
  # 顶格 \end{<env>}, 源生 tab 缩进的终结行不认 → 扫到 EOF runaway。
  # 通用形排在 aux_scan_eof 窄签之后 (aux 族保持专属路由), emergency
  # 之前 ("File ended" 行的 ctx8 常混进 Emergency stop 抢签)。
  - {
      id: runaway_scan,
      scope: head,
      payload_group: 1,
      pattern: "File ended while scanning use of (\\\\[A-Za-z@]+)",
    }
  - {
      id: emergency,
      scope: head,
      pattern: "Emergency stop|cannot \\\\read|Fatal error|job aborted",
    }
  - {
      id: env_mismatch,
      scope: head,
      pattern: "begin\\{[^}]*\\}.*ended by|Extra \\\\end",
    }
  # ── 2026-09-17 wave-final 残面 (批七) ──
  # env_undefined ×47: revtex4-2 把 abstract 环境仅 frontmatter 期
  # let-bound (cls:2685 \let\abstract\@undefined), legacy-rewrite
  # 后稿面 \maketitle→abstract 老版式全炸此签。payload=环境名。
  - {
      id: env_undefined,
      scope: head,
      payload_group: 1,
      pattern: "Environment ([A-Za-z@*]+) undefined",
    }
  # pkg_obsolete ×6: TL 自带废弃包 stub 自报错 ("Package `amstex' is
  # obsolete" / 直引号形) —— payload=包名, cs_targeted_fix 表查
  # strip_pkg+usepackage。
  - {
      id: pkg_obsolete,
      scope: head,
      payload_group: 1,
      pattern: "Package [`']([\\w-]+)' is obsolete",
    }
  # ── 2026-09-16 signature-mining "other" 拆家 (§2.2) ── 精确字面签名须
  # 先于 syntax 宽词族评估 (syntax 含 Missing/Illegal 等词会抢签)。
  # file-line-error 形态 (无 '!' 前缀) 也走本段 —— _ERR_FILELINE_RE 已计。
  - {
      id: missing_graphic,
      scope: head,
      pattern: "Unable to load picture or PDF file '([^']+)'|image inclusion failed for \"([^\"]+\\.(?:pdf|png|jpe?g))\"",
    }
  # 2026-09-20 extless lane (failmine4 9-cell 实录: 0812.0404/0812.0413/
  # 2501.01277/2501.01445/2502.00504/2504.06300/2504.06571/2504.06813/
  # 2505.06480): \includegraphics{X}/\fig{..}{X} 无扩展名引用, 资产在所
  # 有试扩名下缺席 → graphicx \Gin@i 经 \@latex@error 落
  # `File `X' not found.` (裸 basename——前列 missing_file 臂要
  # `\.[a-zA-Z0-9_]+` 扩展名够不着, 原落 other|None 零规则可派发)。
  # 图形证据 = errhelp `I could not locate the file with any of these
  # extensions:` —— 仅 graphicx \Gin@i 错误路径落盘, 恒居错误行 +8
  # (恰出 ctx8 右缘) → 走 use_post 扩展窗; l.N 回显行的 graphic cs
  # (\includegraphics/\includepdf/\epsfig/\pgfimage) 为同窗旁证——
  # PoSlogo 钩 (\AtBeginDocument 装载, l.N 回显 `\begin{document}`) 与
  # 参数折行截断形态下回显无 cs, errhelp 仍是定证。无证据保守落 other:
  # \lstinputlisting/\verbatiminput 型 ext-less producer 发不出该
  # errhelp, taxonfix GenericError 语义不扰。tempered 前瞻禁跨后续错误
  # 块借 errhelp (File `/Error:/! /file:line: 新错起点即截断)。带扩展名
  # 的 File-not-found 恒被前列 missing_file 臂先签 (评估序), 本臂只见
  # 裸名 → payload=basename 直供 graphic_missing_placeholder/
  # graphics_ext_pslist_repair。
  - {
      id: missing_graphic,
      scope: head,
      payload_group: 1,
      use_post: true,
      pattern: "File `([^'\\n]+)' not found(?:(?!File `|Error:|! |:[0-9]+: )[\\s\\S]){0,1500}?(?:I could not locate the file with any of these extensions|\\\\includegraphics|\\\\includepdf|\\\\epsfig|\\\\pgfimage)",
    }
  - {
      id: babel_opt,
      scope: head,
      payload_group: 1,
      pattern: "Package babel Error: Unknown (?:option|language) [`']([^`']+)'",
    }
  # 2026-09-19 babel-lane: 语言本体未声明错 (区别于选项不认识的 babel_opt)
  # —— \selectlanguage/\iflanguage/ldf AtBeginDocument 钩引用了选项表外的
  # 语言名 (babel-german.def:739 \iflanguage{ngerman} 无条件钩实证: [german]
  # 装好 ldf 后格式无 \l@ngerman → 本签)。payload=语言名, 消费规则=
  # babel_undeclared_option 向选项表头补名 (非主语言位)。
  - {
      id: babel_undef,
      scope: head,
      payload_group: 1,
      pattern: "You haven't defined the language [`']([^`']+)'",
    }
  - {
      id: hyperref_driver,
      scope: head,
      payload_group: 1,
      # 三形态合一: "Wrong DVI mode driver option `X'" (hyperref 老文案) /
      # "Wrong driver option `X'" (hyperref 现行) / "Wrong hyperref driver `X'"
      # (hypdvips 自检) —— 2211.13028/2308.12612 曾因此漏签落 early_eof。
      pattern: "Wrong (?:hyperref driver|(?:DVI mode )?driver option) [`']([^`']+)'",
    }
  - {
      id: float_opt,
      scope: head,
      payload_group: 1,
      pattern: "Unknown float option [`']([^`']+)'",
    }
  - {
      id: pkg_order,
      scope: head,
      payload_group: 1,
      pattern: "Package (\\w+) Error: \\w+ must be loaded (?:before|after)",
    }
  # 2026-09-16 repro-2501 缺陷B: 色名参槽被译文/mock 污染 ({blue}→'这是译文')
  # → (x)color Undefined color; payload=色名, 供 undefined_color_fallback 兜底。
  # 2026-09-19 colorquote: 真实发射是 TeX 引法 `X' (ledger 实证 xcolor/color/
  # 内核 LaTeX Error 三发行方; 直引形仅兼容收) —— 原直引 pattern 零命中 ~44
  # cells 落 other。"Undefined color model `X'" 是另一错误 (模型名非色名),
  # color 后随 m 不中引号类 → 天然排除。
  - {
      id: undefined_color,
      scope: head,
      payload_group: 1,
      pattern: "(?:Package (?:x)?color|LaTeX) Error: Undefined color [`']([^']+)'",
    }
  # 2026-09-17 fixer-acro-v3: l3keys "key unknown" 行 (acro v3 弃键等)
  # 此前无 head 签命中 → 落 tail early_eof 误判。payload=键名 (acro/X 形)。
  - {
      id: key_unknown,
      scope: head,
      payload_group: 1,
      pattern: "The key '([\\w@./-]+)' is unknown and is being ignored",
    }
  # 2026-09-17 fixer-apjbbx: biblatex \patchcmd 失败走 PackageError
  # (file-line-error 形, 可无 '!' 前缀) —— bundled .bbx 撞 3.8+ 改名宏。
  - {
      id: cannot_patch_macro,
      scope: head,
      payload_group: 1,
      pattern: "Cannot patch (?:bibliography|citation) macro ([\\w@:+-]+)",
    }
  # 2026-09-18 t_c9249919e8d7a13f: tectonic 外调 biber 版本错配——
  # ``! the external tool exited`` 后 stdout dump 的 ERROR 行是锚
  # (bundle biblatex 3.17/bcf3.8 ↔ 系统 biber 2.22/bcf3.11); 超出
  # head 窗时落 ``other``, biber_biblatex_skew_route builtin 全文复核同收。
  - {
      id: toolchain_skew,
      scope: head,
      pattern: "biblatex control file version [\\d.]+, expected version [\\d.]+",
    }
  - {
      id: invalid_char,
      scope: head,
      pattern: "Text line contains an invalid character",
    }
  # ── 2026-09-20 cjkchar lane (#290, singlesweep cjk-pkg-invalid-char 2 格) ──
  # CJK 包自报同族错形: 非 UTF-8 字节进 CJKutf8/CJK 解码面才炸, 措辞非
  # 内核 "Text line contains..." —— 硬错在 head 段恒归 other|None 无
  # 路由 (1607.00157 file-line 形 main.tex:58 / 2601.07372 main.tex:222,
  # 1206.0266 tectonic `! ` 形, 三形同句)。归 invalid_char 后
  # invalid_char_recode(97) 接续——非 UTF-8 源格 (1607.00157
  # .tex+.cls decode-fail 实证) 转码即解; 全 UTF-8 格 recode 自
  # decline 不误伤 (转码只对 decode-fail 文件动刀)。
  - {
      id: invalid_char,
      scope: head,
      pattern: "Package CJK Error: Invalid character code",
    }
  - {
      id: expl3_backend,
      scope: head,
      pattern: "Backend request inconsistent with engine",
    }
  # ── 2026-09-18 nicematrix-lane ──
  # 装上件自检版本闸: expl3 ``\msg_critical`` 以 file-line 形落在刚装上的
  # 包文件 ("Critical Package X Error: Your LaTeX release is too old") ——
  # tlmgr/tlnet 只发最新版, 对运行期 format/L3 过新 (2308.12712 实证:
  # _texmf nicematrix v7.11c 要 format ≥2026-06-01, runtime LaTeX2e
  # 2025-11-01; ctan_fetch version_guard 只兜 tectonic 臂, xelatex tlmgr
  # 通路无闸)。payload=file-line 前缀 basename → pkg_version_skew_vendored
  # 规则以 vendor 兼容钉版平铺遮蔽。Class 与 msg_error 级同签并收;
  # ``too old`` 限定把版本闸与其他 critical 错分开 (错路由风险零化)。
  - {
      id: pkg_version_skew,
      scope: head,
      payload_group: 1,
      pattern: "([^()\\s:/]+\\.[A-Za-z0-9_-]{1,10}):\\d+: (?:Critical )?(?:Package|Class) [\\w@*+-]+ Error[\\s\\S]{0,600}?too old",
    }
  # ── 2026-09-19 citemath 匝道 ──
  # ``Command \X invalid in math mode`` —— \not@math@alphabet 签名。
  # 主战场: natbib ``\@citex`` 未定义引用标记 ``{\reset@font\bfseries ?}``
  # 无盒裸置, 数学域内裸 ``\cite`` 展开即炸 (gr-qc/9901082; lane-citemath
  # EVIDENCE: halt_on_error 死在 thebibliography 前 → \bibcite 不落 .aux
  # → 自续)。同签亦由字面 ``{\bfseries X}`` 数学域误用触发——路由到此
  # 类即可, cite_in_math_mbox 规则对无 cite token 面自然 decline。
  # 须在 syntax 前: syntax 交替含 ``improper``/``allowed only in math``
  # 但不盖本句式, 占位顺序只是为 head 段确定性求早评。
  # ``LaTeX Error:`` 前缀必带: ``\@latex@error`` 恒产此前缀, 而
  # ``LaTeX (Font )?Warning: Command \X invalid in math mode`` 是同句式
  # 软警告 (\r/\small/\sc 族, 非 \not@math@alphabet 硬报)——不锚前缀
  # 会被首错后 ctx8 窗内的警告行抢签误路由 (loop1 多格带此警告)。
  - {
      id: invalid_in_math,
      scope: head,
      payload_group: 1,
      pattern: "LaTeX Error: Command \\\\([a-zA-Z@]+) invalid in math mode",
    }
  # ── 2026-09-19 arraypream lane (arraypream-2026-09-19 普查) ──
  # array.sty \@mkpream 拒收签名: "Illegal pream-token (\X): `c' used."
  # (Package array Error 前缀, '!' 或 file-line 形皆有)。aastex 时代
  # 列型宏 (\@delspec/\pt@format 族) 漏进 tabular 头——kernel \@xexpast
  # 全展开能吃, array 重写只认 *-repeat 与 \NC@ 名, 其余宏留字面条目。
  # payload=cs 名 (无反斜杠), 供 pream_token_cs_expand 改写 (def-站
  # \edef 烘焙 + call-站 \expandafter + 类let 中和)。\\ 必带把 CJK
  # 字面 token (这/是/译/文 系 ~54 条——译文漏进 preamble 的另一机制)
  # 挡在本类之外落 syntax。
  # 须在 syntax 前: syntax 交替含 "Illegal" 宽词会抢签。
  - {
      id: pream_token,
      scope: head,
      payload_group: 1,
      pattern: "Illegal pream-token \\(\\\\([\\w@]+)\\)",
    }
  # ── 2026-09-20 nfss-encoding-under-TU (lane-nfsstu) ──
  # xelatex TU 下 legacy NFSS enc 声明三签名, 全带 ``LaTeX Error:`` 前缀
  # (kernel \@latex@error), file-line/``!`` 两形皆有:
  # (a) ``Command \X unavailable in encoding TU`` —— cs 只声明在 PU 等旧
  #     enc (hyperref puenc.def \DeclareTextCommand 盖过稿自带
  #     \providecommand 兜底), TU 下调用即报, payload=cs 名;
  # (b) ``Encoding scheme `E' unknown`` —— 源面 \usefont/\fontencoding{E}
  #     直选未声明 enc (easycyrsymbol T2A 族), payload=enc 名;
  # (c) ``Font family `E+F' unknown`` —— \DeclareFontShape{E}{F} 时家族
  #     未声明 (times.sty + AtBeginDocument T1+ptm 实证; E 已声明是
  #     本签成立前提——E 未声明会先报 (b)), payload="E+F"。
  # 归 nfss_enc 单类 payload 分形, 65-encoding.yaml 三臂按签名复述
  # ctx_suggests 分流 (aux_purge_regen 同构)。须在 syntax 前占位:
  # syntax 宽词不盖本句式, 早评只为 head 段确定性。
  - {
      id: nfss_enc,
      scope: head,
      payload_group: 1,
      pattern: "LaTeX Error: Command \\\\([\\w@]+) unavailable in encoding",
    }
  - {
      id: nfss_enc,
      scope: head,
      payload_group: 1,
      pattern: "LaTeX Error: Encoding scheme `([\\w]+)' unknown",
    }
  - {
      id: nfss_enc,
      scope: head,
      payload_group: 1,
      pattern: "LaTeX Error: Font family `([\\w]+\\+[\\w]+)' unknown",
    }
  # 2026-09-16 扩 syntax 族: Extra }/\\endgroup/\\right/\\middle/\\else/\\fi/\\or
  # 与 Forgotten \\endgroup —— 组/定界/条件多 token 错误归 syntax
  # (astro-ph/0306068 "Extra }, or forgotten $." 原是 other 兜底;
  # Extra \\end 已由 env_mismatch 先行接住, 不重复列)。
  - id: syntax
    scope: head
    pattern: "Missing|Runaway|Paragraph ended|Misplaced|Double subscript|Illegal|There's no line|Lonely|Bad math|Something's wrong|not in outer par|allowed only in math|improper|Extra \\}|Forgotten \\\\endgroup|Extra \\\\(?:endgroup|right|middle|else|fi|or)\\b"
  # 兜底: 首错行在场必命中 —— rep.first 恒为 _is_err_line 认证的错误行
  # ('!' 或 file-line `f.tex:N:` 形), 故 `^.` 即「有签名错」全量覆盖。
  # 旧写 `^!` 漏 file-line 形: 无 head 签的 file-line 首错落 tail 段被
  # early_eof 吞 (W126: 0806.2594 TUletters / astro-ph/0408240 natbib-aux
  # 实证, \begin{document} 期 aux 读/字体声明错皆此形)。
  - { id: other, scope: head, pattern: "^." } # 兜底: 有错误行必命中
  # —— tail 段: 仅当全文 0 个 '!' 行时评估 (交互式缺文件/Emergency) ——
  # preempts: 致命尾错夺弱 head 类的路由 (regress4-2410.00012: chemgreek
  # 缺档是真杀手, 此前永远被上游包内 undefined_cs 抢路由)。early_eof
  # 不挂——零页是后果不是可修因, 抢占会盖住可行动的 head 错。
  - {
      id: missing_file,
      scope: tail,
      payload_group: 1,
      pattern: "File `([^']+\\.[a-zA-Z0-9_]+)' not found",
      guard: "Enter file name|Emergency",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  - {
      id: missing_file,
      scope: tail,
      payload_group: null,
      pattern: "Enter file name",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  # tail 行同款收紧 (aastex 横幅会落 tail 30 行内抢签) —— 与 head 行同表。
  # preempts [other]: `^.` 兜底后 file-line 形签名错恒归 other, 旧经裸
  # tail 评估可达的「file-line 错 + 尾段 2.09 横幅 → latex209」路由由此
  # 保留 (other 是唯一可夺类, 真签名类不被抢)。
  - {
      id: latex209,
      scope: tail,
      pattern: "(?m)\\\\documentstyle\\b|LaTeX 2\\.09 COMPATIBILITY MODE|LaTeX2e command[^\\n]*\\bin LaTeX 2\\.09|LaTeX Version 2\\.09|^[ \\t]*Compatibility mode",
      preempts: [other],
    }
  # —— cls/sty 「求档文」尾段: 类文件内部 \IfFileExists 失败→\stop 死路
  #   (aastex61 "Please update your system to include revtex4-1.cls" 实证:
  #   \stop 夹在条件内 → \end occurred incomplete, 无 '!' 无 missing_file
  #   行) —— plea 提出的文件名即 actionable payload, 归 missing_file 让
  #   install/shim 链接手; 须排在 early_eof 之前 (同尾共存时 plea 优先) ——
  - {
      id: missing_file,
      scope: tail,
      payload_group: 1,
      pattern: "(?:include|download|install|get|need)\\s+(\\S+\\.(?:cls|sty|clo|tex|def|fd|map|cfg))",
      guard: "No pages of output",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  # —— 干净日志零页面: TeX 早夭但无 '!' 行 (1706.00175 实证:
  #   "(\end occurred when \ifx on line 27 was incomplete)" + "No pages of
  #   output") —— guard 把「有页输出仅带 \end occurred 警告」挡在外面 ——
  - {
      id: early_eof,
      scope: tail,
      payload_group: 1,
      pattern: "\\\\end occurred (?:when (\\\\?\\w+)[^\\n]*?incomplete|inside a group)",
      guard: "No pages of output",
    }
  - {
      id: early_eof,
      scope: tail,
      pattern: "No pages of output",
      payload_group: null,
    }
  # —— warnings 段: 无 '!' 且无 tail 命中, 但 warning 红线命中 (v1.1) ——
  - { id: warn_utf8, scope: warnings, warn_id: invalid_utf8 } # docs/08 §5.2 non_utf8_source 的类别入口
  - { id: warn_missing_char, scope: warnings, warn_id: missing_char } # F4: 无 '!' 错但缺字 → 分诊修复入口
  # 都不中: err 为空 → clean; err 非空 → other
