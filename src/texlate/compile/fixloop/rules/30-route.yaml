# rules/30-route.yaml — fixloop 规则库分片：路由层 —— gate 拒绝路由 + precheck 预检
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/00-base.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # ─── gate: 路由拒绝先于一切修复尝试 ───
  # 原型语义: 主循环 L748-755 在 pick_and_apply 之前短路,
  # 等效于最高优先级 → 用 phase:gate 显式建模。
  - id: latex209_reject
    mechanisms: [B01, W80, W88]
    description: "LaTeX 2.09 文档 (\\documentstyle/化石 cls) → 路由拒绝, 转 latex+dvips 通道"
    phase: gate
    order: 1
    # v4 收窄 (eracls2 普查/gatenarrow 2026-09-20): 删 missing_file 支 ——
    # latex209_upgrade 落地后带活 \documentstyle 的稿在 precheck 已转化或
    # 内携 REJECT, 到不了 gate; 该支唯一可达群体是升级稿 missing_file 载荷
    # (注释 %\documentstyle 残留命中 mhc raw 子串 + COMPAT_SHIM 面包屑满足
    # condition) —— 纯 FP, 把 shim/install/doc_absent 臂全挡死 (aas2pp4.sty
    # /flushrt.sty/laa.cls ~5 格实证)。真 209 籍由 latex209 类错误兜底。
    when: { category: latex209 }
    condition: {
        # v2 修正: mhc 子串会被注释 %\documentstyle 误中 (1806.06690);
        # 加行锚定复核 —— 真 2.09 文档的 \documentstyle 必在行首。
        # v3 补面 (latex209_upgrade 落地后): 升级稿已无 \documentstyle,
        # 但 post-upgrade 仍出 209 类错误 (compat-mode 残留) 时本文档
        # 方言归属不变——COMPAT_SHIM 面包屑行 (latex209.py 唯一出处)
        # 同判 209 籍, 路由拒绝语义保全而非 unfixable 白烧轮。
        source_contains: "(?m)^[ \\t]*\\\\documentstyle|% texlate: LaTeX 2\\.09 compatibility shim",
      }
    action:
      kind: reject_route
      params: { route: "latex+dvips", reason: "LaTeX 2.09 document" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 路由层策略, 与引擎无关
    provenance:
      - {
          corpus: "hep-th 类语料 (hjfy 经验移植)",
          error: "LaTeX2e command in LaTeX 2.09 document",
        }
    stats: { fires: 0, status: proposed } # 本轮语料未触发, 为 2.09 论文预留
    source_ref: "fixloop.py L508-520, L748-755"

  # 新增 (docs/08:273): pstricks 文档走 dvips 路由前的 .pro 前置检查
  - id: pstricks_dvips_preflight
    mechanisms: [B05]
    description: "pstricks 文档被路由 latex+dvips 前, 预检 pst-tools.pro 等 dvips 资源存在"
    phase: gate
    order: 0 # 先于 latex209_reject(1): pstricks 时先记 .pro 预检信息再路由
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: documentstyle 行锚定 (注释不命中) AND pstricks 依赖,
        # 单 pattern 内顺序表达: \documentstyle 恒在文档头部先于包引用。
        # 2026-09-16 再修: 后半 pstricks 组同病注释误中 (source_contains 跑
        # raw 源, % 注释行会命中) —— 内组加同款行锚, 口径同 pstricks_route
        # (@pstricks token 展开 = engine/_route.py PSTRICKS_SIG_ALTS 单源)。
        source_contains: "(?ms)^[ \\t]*\\\\documentstyle[\\s\\S]*?^[ \\t]*@pstricks",
      }
    action:
      kind: builtin_transform
      function: pstricks_dvips_preflight # 缺 .pro → REJECT note 附 advisory; 全在 → 正常 reject
      params: { require_files: ["pst-tools.pro"], route: "latex+dvips" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "—", error: "dvips 兜底缺 .pro 时白跑一路由 (docs/08:273)" }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/spec/compile.md L273"

  # W37/W68 孤儿裁决 (mechmap-2026-09-17): 纯 plain/amsTeX 稿无路由可救
  # (缺 plain.fmt 通道) → gate 显式拒 tex-plain, 诚实上报优于烧满轮次。
  # 可达场景: find_main_tex 宽松档扫 raw 头 60KB 被注释伪装行
  # (%\documentstyle) 骗入主 —— 纯 plain 零主档案已由 classify_no_main
  # 归 no_main_tex:plain_tex 不经此处。builtin 内遮盖视图复核是权威:
  # 活 \documentclass/\documentstyle 在场或零签名即 False 让位 loop。
  - id: plain_format_route
    mechanisms: [W37, W68]
    description: "纯 plain/amsTeX 稿 (无活 documentclass ∧ 行锚签名) → 拒 tex-plain 诚实上报"
    phase: gate
    order: 2 # latex209_reject(1) 后: 209 先归 dvips 通道, 此处只收真 plain
    when:
      any:
        - { category: undefined_cs }
        - { category: syntax }
        - { category: missing_file }
    condition: {
        # raw 粗筛省电 (builtin 内 mask_tex 遮盖视图复核是权威); 签名池
        # 与 builtin _PLAIN_SIGS 同源口径: ^\magnification / \font\cs=
        # / ^\bye$ / ^\end$ 裸行 / \input amstex 系。
        source_contains: "(?m)(^[ \\t]*\\\\magnification|\\\\font\\\\[a-zA-Z@]+\\s*=|^[ \\t]*\\\\bye[ \\t]*$|^[ \\t]*\\\\end[ \\t]*$|\\\\input\\s*\\{?\\s*(amstex|amsppt|harvmac|phyzzx|jytex|texinfo)\\b)",
      }
    action:
      kind: builtin_transform
      function: plain_format_detect # REJECT: route=tex-plain; 不中 False
      params: { route: tex-plain }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 源级判定与引擎无关
    provenance:
      - {
          corpus: "mechmap W37/W68 (plain.tex/amsTeX 稿)",
          error: "undefined_cs 连环 (\\magnification/\\font\\cs=cm* / ^\\bye$)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus/mechanisms.jsonl W37+W68 verdict suggested_rules"

  # ─── precheck: 静态路由 + 第 0 招装包, 不进循环 ───
  # 整改 (fixloop-corpusv2 实测): 原 eps_route 按 fileset 静态拒 .eps 工程,
  # 实证误杀 —— tectonic 对部分 eps 工程能出 pdf~ (0812.4521/nucl-th/0104042
  # baseline 即 pdf~), 且 epstopdf 转换可整格救回 (0903.0543/1406.1994 手测
  # 出 pdf)。.eps 文件 → 循环内 log 确证的 ps_image 规则处理 (见 loop);
  # 此处只留代码级 PS 依赖 (pstricks/pspicture) 的预检路由 —— 无转换路径。
  - id: pstricks_route
    mechanisms: [B05]
    description: "pstricks/pspicture/\\psset 源码依赖 → tectonic 无可行路径, 预检路由 xelatex"
    phase: precheck
    order: -10 # 路由决策先于装包预检
    when: { always: true }
    condition:
      engine_in: [tectonic]
      # 2026-09-16 注释-FP 收紧 (1803.08846 实证: %\usepackage{pstricks}
      # 注释行误杀 baseline-clean 稿): source_contains 跑 raw 源 → 各备选项
      # 行锚 (?m)^[ \t]* (:369 latex209 gate 先例, % 注释行不命中)。交替支
      # 单源 @pstricks = compile/engine/_route.py PSTRICKS_SIG_ALTS
      # (_PSTRICKS_RE 同源): pstricks(?:-\w+)?|pst-\w+ 元素边界 (防
      # {notpstricks} 子串), RequirePackage 同收, {amsmath,pstricks}
      # 非首元素命中; pspicture 收 \begin{pspicture*?}/\pspicture cs 两形态。
      source_contains: "(?m)^[ \\t]*@pstricks"
    action:
      kind: reject_route
      params:
        { route: "xelatex", reason: "pstricks/pspicture hard wall on tectonic" }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 下 pstricks 可走 (dvips 后端另议), 不触发
    provenance:
      - {
          corpus: "pstricks-probe (docs/research/latex/pstricks-route.md)",
          error: "xdvipdfmx EPS hard wall",
        }
    stats:
      {
        fires: 0,
        note: "v1 为 eps_route fileset 版; v2 拆出 .eps 改走 ps_image 循环规则",
      }
    source_ref: "docs/spec/compile.md L218, L271; fixloop-v2 整改"

  # W31 孤儿裁决 (mechmap-2026-09-17): svg 包 = inkscape + shell-escape
  # 外部链, tectonic 无可行路径 → precheck 直拒路由 xelatex; xelatex 臂
  # 由 loop 侧 svg_prepare 接管 (flag/预转换两臂)。行锚口径同 pstricks_route。
  - id: svg_route
    mechanisms: [W31, B05]
    description: "\\usepackage{svg}/\\includesvg 依赖 → tectonic 无 inkscape 链, 预检路由 xelatex"
    phase: precheck
    order: -9 # pstricks_route(-10) 后, static_precheck(0) 前
    when: { always: true }
    condition:
      engine_in: [tectonic]
      source_contains: "(?m)^[ \\t]*\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\bsvg\\b|^[ \\t]*\\\\includesvg\\b"
    action:
      kind: reject_route
      params:
        {
          route: "xelatex",
          reason: "svg package needs inkscape + shell-escape",
        }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 臂走 svg_prepare (inkscape 在请 flag, 缺席预转换)
    provenance:
      - {
          corpus: "mechmap W31 (svg 包 inkscape/shell-escape 链)",
          error: "File `*_svg-tex.pdf' not found / shell-escape disabled",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus/mechanisms.jsonl W31 verdict suggested_rules"

  # ── 2026-09-28 qc-impl (vault QC replay 诊断蒸馏 impl-rules.json IDX61) ──
  # 1003.0510: psfrag 是 dvips-special 链包, xdvipdfmx (xelatex/tectonic
  #   共同后端) 无 PS 解释器 —— \psfrag 替换静默不落, EPS 原始标签层浮在
  #   正文上 (compile clean, 无 log 签名 → 只能预检源码面截)。路由
  #   latex+dvips 让替换链原生生效——比 45-graphics psfrag_strip_xelatex
  #   (-6.5) 兜底注释更优; 行锚口径同 pstricks_route(-10) 防注释 FP,
  #   mid-line \psfrag 等未中形态仍落条带臂。
  - id: psfrag_route
    mechanisms: [B05]
    description: "\\usepackage{psfrag}/\\psfrag 源码依赖 → xdvipdfmx 无双解释器, 双引擎预检路由 latex+dvips"
    phase: precheck
    order: -8 # svg_route(-9) 后, psfrag_strip_xelatex(-6.5) 前: 路由是真修, 条带是兜底
    when: { always: true }
    condition:
      source_contains: "(?m)^[ \\t]*\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\bpsfrag\\b|^[ \\t]*\\\\psfrag\\b"
    action:
      kind: reject_route
      params:
        { route: "latex+dvips", reason: "psfrag needs dvips special chain" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # tectonic 同走 xdvipdfmx 输出链, 同一面硬墙
    provenance:
      - {
          corpus: "1003.0510 (qc geo_text_overlap)",
          error: "compile clean 但 \\psfrag 标签替换不落 —— EPS 原始标签压正文",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX61; 先例 pstricks_route/pstricks_dvips_preflight"

  # 1003.5537 (qc geo_margin_breach): 裸 \\epsfbox 无缩放钩 → 图按原始
  #   pt 排印出血 (fig5.eps 标签 y1=855.7 > 842 页界)。改写成
  #   \includegraphics[max width/max height] 由 adjustbox export 键限进
  #   版面盒; 裸 stem 出参让 \\Gin@extensions 拾 eps_to_pdf 转换件。
  #   spec 草 builtin epsfbox_fit 未注册 → 同义 regex_rewrite 表达; 序在
  #   ps_graphics_dvips_route(3) 前——纯 epsfbox 格尺寸修复优于改道
  #   (dvips 原样嵌入仍超版面), psfig/epsffile 混载格走后者签名不冲突。
  - id: epsfbox_fit
    description: "\\epsfbox 未缩放图 → \\includegraphics[max width/max height,keepaspectratio] + adjustbox[export] 注入"
    phase: precheck
    order: -6 # psfrag_route(-8)/psfrag_strip(-6.5) 后, tar_blob_extract(-1) 前
    when: { always: true }
    condition:
      # \A 锚定全 blob 三闸同位判: adjustbox 字面无 (防 option-clash 双载
      # —— 稿已装 adjustbox 则已有 export 语义讨论空间, 保守不碰) ∧
      # \documentclass 存在 (注入锚) ∧ \epsfbox 存活。
      source_contains: "(?s)\\A(?!.*adjustbox)(?=[\\s\\S]*\\\\documentclass)[\\s\\S]*?\\\\epsfbox"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "(?m)^[ \\t]*\\\\documentclass(\\[[^\\]\\n]*\\])?\\s*\\{[^}\\n]*\\}",
              repl: "\\g<0>\n% fixloop-epsfbox: adjustbox export keys cap includegraphics box\n\\\\usepackage[export]{adjustbox}",
              match_surface: "masked",
            }
          - {
              pattern: "\\\\epsfbox\\s*\\{([^}\\n]*?)(\\.eps)?\\s*\\}",
              repl: "\\\\includegraphics[max width=\\\\textwidth,max height=\\\\textheight,keepaspectratio]{\\g<1>}",
              match_surface: "masked",
            }
    risk: medium # 图像渲染通路改写; 无 adjustbox/无 docclass/无 epsfbox 三闸全过才动
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1003.5537 (qc geo_margin_breach)",
          error: "\\epsfbox{fig5.eps} 原始尺寸出血 —— 标签 y1=855.7 > 842pt 页界",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX32 (builtin epsfbox_fit 未注册 → regex_rewrite 同义)"

  # W164 孤儿裁决 (stybegindoc 车道 2026-09-18): e-print 偶发把整包源码
  # 以嵌套 tar 随投稿, 外层解包后 tar 以 .sty/.cls 名落进工作树 ——
  # TeX \input 读 tar 头成排版文本 → Missing \begin{document} 于伪装件
  # 第 N 行 (l.30 `A MSfonts.sty^^@^^@` NUL 填充实证)。必须在
  # static_precheck(0) 前抽成员——tar 内含真 .sty/.cls/主档, 成员落地
  # 后缺件扫描才看得见 (0707.0382 tar 含 iaus.cls 正是所需 docclass)。
  - id: tar_blob_extract
    mechanisms: [W164]
    description: "e-print 内嵌 tar 伪装 .sty/.cls → 成员补缺解包 + blob 改名退役"
    phase: precheck
    order: -1 # svg_route(-9) 后, static_precheck(0) 前: 成员先落地缺件扫描才收
    when: { always: true }
    action:
      kind: builtin_transform
      function: extract_tar_blobs
    risk: low # no-clobber 补缺 + 抽中才改名退役; 0 成员原样放回
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0707.0382, astro-ph/0104007 (stagerun-loop2 fail)",
          error: "Missing \\begin{document} at AMSbsy.sty:30 / aipproc.cls:30 — 文件本体是 POSIX tar (ustar@257), 非 .sty/.cls 内容",
        }
      - {
          corpus: "1706.00240 (同 lane 副修): physics_stub_detach \\input 裸载缺 @-catcode",
          error: "Missing \\begin{document} at physics.sty:13 — \\@undefined 在 @=other 下碎裂 (见 builtins.pkgload letter_wrap)",
        }
    stats: { fires: 3849, rescued_cells: 1812, status: active }
    source_ref: "tmp/lane-stybegindoc/ (loop2 cases.jsonl log_excerpt 取证)"

  # failmine3 车道 (3 格: 2410.00111/2003.03508/2310.16788): 非主 .tex
  # 自带 \documentclass (standalone/subfiles 子文档或整篇子稿) 被
  # \input/\subimport 进正文 —— preamble-only cs 在 doc body 执行 →
  # "Can be used only in preamble" @子文件:1。normalize #168 门只挡
  # 注入侧 prepend (subfiles 类), 文件自带导言行仍是毒: 剥至
  # \begin..\end{document} 内文是 \subfile/\includestandalone 包
  # skip 机制的恒等语义, 也是 \subimport/裸 \input 唯一可编译形。
  # builtin 内遮盖视图复核 (注释/verbatim 内 docclass 不算位) +
  # ctx.main_path() 排除主档; 无 \begin{document} 异形制不动。
  # 2409.00265 引用门: 只剥被存活 input 族 (\input/\include/\subfile/
  # \import 族/\InputIfFileExists) 引用的文件 —— 无引用 docclass 持件
  # (独立第二文档, 或 precheck main 误判下的真主档) 永不进编译流,
  # 剥它是纯害 (2409.00265: 真主档被剥成 body → env_undefined|
  # frontmatter + 1326 错级联)。
  # 序在 tar_blob_extract(-1) 后: 解包落地的子档同收; static_precheck(0)
  # 前剥掉子档导言免得死 \usepackage 触发无效装包。与 #168
  # subfilegate (normalize 注入侧) 互补: 一侧挡新毒, 一侧清自带毒。
  - id: subfile_docclass_strip
    description: "被 input 族引用的非主 .tex 含存活 \\documentclass → 剥至 \\begin..\\end{document} 内文"
    phase: precheck
    order: -0.7 # tar_blob_extract(-1) 后, static_precheck(0) 前
    when: { always: true }
    action:
      kind: builtin_transform
      function: subfile_docclass_strip
      params: { exts: [.tex] }
    risk: medium # 整段剥 preamble+docclass 区; 仅 docclass-bearing 非主档中位
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "failmine3 loop3 3 格 (2410.00111/2003.03508/2310.16788)",
          error: "LaTeX Error: Can be used only in preamble. @subfile.tex:1 (\\input 子档自带 docclass)",
        }
    stats: { fires: 2762, rescued_cells: 1791, status: active }
    source_ref: "tmp/lane-failmine3/ (#164b); 与 #168 subfilegate 注入侧互补"

  # m1k base 臂实证 (fixloop_209.py): latex209_reject gate 拒收的 21 格
  # 2.09 档, 主档 upgrade_209 转换后 21/21 converted → 20 clean + 1
  # partial。gate 一刀切拒收过时——升级是确定性变换, 放 precheck 前置:
  # 拆出的 \usepackage 缺件正好被 static_precheck(0) 同轮装包接住;
  # 不可转形态 (ds@ 选项机类/盲升守卫) builtin 内携细分 reason REJECT,
  # 与 gate 同路由语义但归因更准。zh 臂 splice 树 inject 已转,
  # \documentstyle 缺席 → 条件天然不触发, 双臂零回归面。
  - id: latex209_upgrade
    mechanisms: [B01, W80, W88]
    description: "主档 \\documentstyle → upgrade_209 升 2e (docclass+usepackage 拆分+compat shim); 不可转落 REJECT 兜 gate"
    phase: precheck
    order: -0.5 # subfile_docclass_strip(-0.7) 后, static_precheck(0) 前
    when: { always: true }
    condition: {
        # 行锚粗筛 (注释行不命中, 同 gate 口径); builtin 内 upgrade_209
        # 遮盖视图复核主档是权威 —— 条件命中子件而主档无 docstyle 时
        # no-docstyle False 让位, 不耗轮。
        source_contains: "(?m)^[ \\t]*\\\\documentstyle",
      }
    action:
      kind: builtin_transform
      function: latex209_upgrade
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 源级确定性变换, 与引擎无关
    provenance:
      - {
