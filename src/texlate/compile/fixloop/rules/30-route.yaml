# rules/30-route.yaml — fixloop 规则库分片：路由层 —— gate 拒绝路由 + precheck 预检
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

# ════════════════════════════════════════════════════════════════
# 第二层: 修复规则 （条数不手维护——`grep -c '^  - id: ' rules/*.yaml`）
# phase: gate(每轮分类后最先评估) / precheck(编译前一次性) / loop(每轮)
# 同 phase 内按 order 升序, 首个 when+condition 满足且 dedup 未命中的执行。
# engines.<name>.mode: native | same(源改写天然可移植) | degrade | unsupported | skip
# condition 原语: tool_available / cap_available / engine_in /
#   main_head_contains / source_contains / ctx_suggests / fileset /
#   vendored_shadow / package_version_ge / prim_read_form /
#   shim_known / cache_dir_glob / any:[...]  (未知键 → 规则跳过, fail-closed)
# ════════════════════════════════════════════════════════════════

rules:
  # ─── gate: 路由拒绝先于一切修复尝试 ───
  # spike 语义: 主循环 L748-755 在 pick_and_apply 之前短路,
  # 等效于最高优先级 → 用 phase:gate 显式建模。
  - id: latex209_reject
    mechanisms: [B01, W80, W88]
    description: "LaTeX 2.09 文档 (\\documentstyle/化石 cls) → 路由拒绝, 转 latex+dvips 通道"
    phase: gate
    order: 1
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: mhc 子串会被注释 %\documentstyle 误中 (1806.06690);
        # 加行锚定复核 —— 真 2.09 文档的 \documentstyle 必在行首。
        source_contains: "(?m)^[ \\t]*\\\\documentstyle",
      }
    action:
      kind: reject_route
      params: { route: "latex+dvips", reason: "LaTeX 2.09 document" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 路由层策略, 与引擎无关
    provenance:
      - {
          corpus: "hep-th 类语料 (hjfy 经验移植)",
          error: "LaTeX2e command in LaTeX 2.09 document",
        }
    stats: { fires: 0, status: proposed } # 本轮语料未触发, 为 2.09 论文预留
    source_ref: "fixloop.py L508-520, L748-755"

  # 新增 (docs/08:273): pstricks 文档走 dvips 路由前的 .pro 前置检查
  - id: pstricks_dvips_preflight
    mechanisms: [B05]
    description: "pstricks 文档被路由 latex+dvips 前, 预检 pst-tools.pro 等 dvips 资源存在"
    phase: gate
    order: 0 # 先于 latex209_reject(1): pstricks 时先记 .pro 预检信息再路由
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: documentstyle 行锚定 (注释不命中) AND pstricks 依赖,
        # 单 pattern 内顺序表达: \documentstyle 恒在文档头部先于包引用。
        # 2026-09-16 再修: 后半 pstricks 组同病注释误中 (source_contains 跑
        # raw 源, % 注释行会命中) —— 内组加同款行锚, 口径同 pstricks_route
        # (engine.py _PSTRICKS_RE 元素级语义)。
        source_contains: "(?ms)^[ \\t]*\\\\documentstyle[\\s\\S]*?^[ \\t]*(\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\b(pstricks(-\\w+)?|pst-\\w+)\\b|\\\\begin\\s*\\{pspicture\\*?\\}|\\\\pspicture\\b|\\\\psset\\b)",
      }
    action:
      kind: builtin_transform
      function: pstricks_dvips_preflight # 缺 .pro → REJECT note 附 advisory; 全在 → 正常 reject
      params: { require_files: ["pst-tools.pro"], route: "latex+dvips" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "—", error: "dvips 兜底缺 .pro 时白跑一路由 (docs/08:273)" }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L273"

  # ─── precheck: 静态路由 + 第 0 招装包, 不进循环 ───
  # v2 整改 (fixloop-corpusv2 实测): 原 eps_route 按 fileset 静态拒 .eps 工程,
  # 实证误杀 —— tectonic 对部分 eps 工程能出 pdf~ (0812.4521/nucl-th/0104042
  # baseline 即 pdf~), 且 epstopdf 转换可整格救回 (0903.0543/1406.1994 手测
  # 出 pdf)。.eps 文件 → 循环内 log 确证的 ps_image 规则处理 (见 loop);
  # 此处只留代码级 PS 依赖 (pstricks/pspicture) 的预检路由 —— 无转换路径。
  - id: pstricks_route
    mechanisms: [B05]
    description: "pstricks/pspicture/\\psset 源码依赖 → tectonic 无可行路径, 预检路由 xelatex"
    phase: precheck
    order: -10 # 路由决策先于装包预检
    when: { always: true }
    condition:
      engine_in: [tectonic]
      # 2026-09-16 注释-FP 收紧 (1803.08846 实证: %\usepackage{pstricks}
      # 注释行误杀 baseline-clean 稿): source_contains 跑 raw 源 → 各备选项
      # 行锚 (?m)^[ \t]* (:369 latex209 gate 先例, % 注释行不命中)。包名
      # 元素级口径同 compile/engine.py _PSTRICKS_RE (2d06184):
      # pstricks(?:-\w+)?|pst-\w+ 元素边界 (防 {notpstricks} 子串),
      # RequirePackage 同收, {amsmath,pstricks} 非首元素命中; pspicture
      # 收 \begin{pspicture*?}/\pspicture cs 两形态。
      source_contains: "(?m)^[ \\t]*(\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\b(pstricks(-\\w+)?|pst-\\w+)\\b|\\\\begin\\s*\\{pspicture\\*?\\}|\\\\pspicture\\b|\\\\psset\\b)"
    action:
      kind: reject_route
      params:
        { route: "xelatex", reason: "pstricks/pspicture hard wall on tectonic" }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 下 pstricks 可走 (dvips 后端另议), 不触发
    provenance:
      - {
          corpus: "pstricks-probe (docs/research/latex/pstricks-route.md)",
          error: "xdvipdfmx EPS hard wall",
        }
    stats:
      {
        fires: 0,
        note: "v1 为 eps_route fileset 版; v2 拆出 .eps 改走 ps_image 循环规则",
      }
    source_ref: "docs/08-translate-compile.md L218, L271; fixloop-v2 整改"

  - id: static_precheck
    mechanisms: [W11, W47, W61, B05, W80]
    description: "静态扫全部源码的 \\usepackage|\\RequirePackage|\\documentclass → 探测缺失 → filemap 批量装包 (一次装好, 省 N 轮循环)"
    phase: precheck
    order: 0
    when: { always: true }
    action:
      kind: scan_install
      params:
        scan_patterns:
          - {
              regex: "\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              split: ",",
              suffix: ".sty",
            }
          - {
              regex: "\\\\documentclass\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              suffix: ".cls",
            }
          # \input/\include/\InputIfFileExists —— 花括号/裸名两形态通收;
          # suffix 仅在名无扩展时补 (engine.py _apply_scan_install 条件化)
          # —— `\input epsf` 裸名此前不进预检清单 (loop1 实证)。
          - {
              regex: "\\\\(?:input|include|InputIfFileExists)(?=[^a-zA-Z])\\s*\\{?([^\\s{}%\\\\]+)",
              suffix: ".tex",
            }
        verify: file_probe # kpsewhich / 本地探测
        batch: true # 聚合后单次安装 (L611-617)
        # install_file 全链败 → repo vendored 兜底落 wdir (vendored_fetch 同源;
        # 穿透型缺件: missing_file 非首错时轮级分类看不到 —— hep-ph/0104121)
        vendored: true
        noise_filter: "^[\\w.-]+$" # 滤掉 '\\\\@tempb.sty' 类误捕 token (见 known_gaps)
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: skip # bundle 按需拉包, 预检基本多余
        fallback: ctan_fetch # 增强位: 仅做本地存在性检查, 缺则 ctan_fetch
        note: "bundle 没有的包 (自定义 sty) 仍值得预检 → 保留轻量版"
    provenance:
      - { corpus: "*", error: "冷 TEXMFHOME 下高频 missing_file" }
    stats: { fires: 22, note: "22/22 格执行; 每格装 0-9 包" }
    source_ref: "fixloop.py L594-618"
