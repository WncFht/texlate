# rules/30-route.yaml — fixloop 规则库分片：路由层 —— gate 拒绝路由 + precheck 预检
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

# ════════════════════════════════════════════════════════════════
# 第二层: 修复规则 （条数不手维护——`grep -c '^  - id: ' rules/*.yaml`）
# phase: gate(每轮分类后最先评估) / precheck(编译前一次性) / loop(每轮)
# 同 phase 内按 order 升序, 首个 when+condition 满足且 dedup 未命中的执行。
# engines.<name>.mode: native | same(源改写天然可移植) | degrade | unsupported | skip
# condition 原语: tool_available / cap_available / engine_in /
#   main_head_contains / source_contains / ctx_suggests / fileset /
#   vendored_shadow / package_version_ge / prim_read_form /
#   shim_known / cache_dir_glob / any:[...]  (未知键 → 规则跳过, fail-closed)
# ════════════════════════════════════════════════════════════════

rules:
  # ─── gate: 路由拒绝先于一切修复尝试 ───
  # spike 语义: 主循环 L748-755 在 pick_and_apply 之前短路,
  # 等效于最高优先级 → 用 phase:gate 显式建模。
  - id: latex209_reject
    mechanisms: [B01, W80, W88]
    description: "LaTeX 2.09 文档 (\\documentstyle/化石 cls) → 路由拒绝, 转 latex+dvips 通道"
    phase: gate
    order: 1
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: mhc 子串会被注释 %\documentstyle 误中 (1806.06690);
        # 加行锚定复核 —— 真 2.09 文档的 \documentstyle 必在行首。
        source_contains: "(?m)^[ \\t]*\\\\documentstyle",
      }
    action:
      kind: reject_route
      params: { route: "latex+dvips", reason: "LaTeX 2.09 document" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 路由层策略, 与引擎无关
    provenance:
      - {
          corpus: "hep-th 类语料 (hjfy 经验移植)",
          error: "LaTeX2e command in LaTeX 2.09 document",
        }
    stats: { fires: 0, status: proposed } # 本轮语料未触发, 为 2.09 论文预留
    source_ref: "fixloop.py L508-520, L748-755"

  # 新增 (docs/08:273): pstricks 文档走 dvips 路由前的 .pro 前置检查
  - id: pstricks_dvips_preflight
    mechanisms: [B05]
    description: "pstricks 文档被路由 latex+dvips 前, 预检 pst-tools.pro 等 dvips 资源存在"
    phase: gate
    order: 0 # 先于 latex209_reject(1): pstricks 时先记 .pro 预检信息再路由
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: documentstyle 行锚定 (注释不命中) AND pstricks 依赖,
        # 单 pattern 内顺序表达: \documentstyle 恒在文档头部先于包引用。
        # 2026-09-16 再修: 后半 pstricks 组同病注释误中 (source_contains 跑
        # raw 源, % 注释行会命中) —— 内组加同款行锚, 口径同 pstricks_route
        # (engine.py _PSTRICKS_RE 元素级语义)。
        source_contains: "(?ms)^[ \\t]*\\\\documentstyle[\\s\\S]*?^[ \\t]*(\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\b(pstricks(-\\w+)?|pst-\\w+)\\b|\\\\begin\\s*\\{pspicture\\*?\\}|\\\\pspicture\\b|\\\\psset\\b)",
      }
    action:
      kind: builtin_transform
      function: pstricks_dvips_preflight # 缺 .pro → REJECT note 附 advisory; 全在 → 正常 reject
      params: { require_files: ["pst-tools.pro"], route: "latex+dvips" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "—", error: "dvips 兜底缺 .pro 时白跑一路由 (docs/08:273)" }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L273"

  # W37/W68 孤儿裁决 (mechmap-2026-09-17): 纯 plain/amsTeX 稿无路由可救
  # (缺 plain.fmt 通道) → gate 显式拒 tex-plain, 诚实上报优于烧满轮次。
  # 可达场景: find_main_tex 宽松档扫 raw 头 60KB 被注释伪装行
  # (%\documentstyle) 骗入主 —— 纯 plain 零主档案已由 classify_no_main
  # 归 no_main_tex:plain_tex 不经此处。builtin 内遮盖视图复核是权威:
  # 活 \documentclass/\documentstyle 在场或零签名即 False 让位 loop。
  - id: plain_format_route
    mechanisms: [W37, W68]
    description: "纯 plain/amsTeX 稿 (无活 documentclass ∧ 行锚签名) → 拒 tex-plain 诚实上报"
    phase: gate
    order: 2 # latex209_reject(1) 后: 209 先归 dvips 通道, 此处只收真 plain
    when:
      any:
        - { category: undefined_cs }
        - { category: syntax }
        - { category: missing_file }
    condition: {
        # raw 粗筛省电 (builtin 内 mask_tex 遮盖视图复核是权威); 签名池
        # 与 builtin _PLAIN_SIGS 同源口径: ^\magnification / \font\cs=
        # / ^\bye$ / ^\end$ 裸行 / \input amstex 系。
        source_contains: "(?m)(^[ \\t]*\\\\magnification|\\\\font\\\\[a-zA-Z@]+\\s*=|^[ \\t]*\\\\bye[ \\t]*$|^[ \\t]*\\\\end[ \\t]*$|\\\\input\\s*\\{?\\s*(amstex|amsppt|harvmac|phyzzx|jytex|texinfo)\\b)",
      }
    action:
      kind: builtin_transform
      function: plain_format_detect # REJECT: route=tex-plain; 不中 False
      params: { route: tex-plain }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 源级判定与引擎无关
    provenance:
      - {
          corpus: "mechmap W37/W68 (plain.tex/amsTeX 稿)",
          error: "undefined_cs 连环 (\\magnification/\\font\\cs=cm* / ^\\bye$)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W37+W68 verdict suggested_rules"

  # ─── precheck: 静态路由 + 第 0 招装包, 不进循环 ───
  # v2 整改 (fixloop-corpusv2 实测): 原 eps_route 按 fileset 静态拒 .eps 工程,
  # 实证误杀 —— tectonic 对部分 eps 工程能出 pdf~ (0812.4521/nucl-th/0104042
  # baseline 即 pdf~), 且 epstopdf 转换可整格救回 (0903.0543/1406.1994 手测
  # 出 pdf)。.eps 文件 → 循环内 log 确证的 ps_image 规则处理 (见 loop);
  # 此处只留代码级 PS 依赖 (pstricks/pspicture) 的预检路由 —— 无转换路径。
  - id: pstricks_route
    mechanisms: [B05]
    description: "pstricks/pspicture/\\psset 源码依赖 → tectonic 无可行路径, 预检路由 xelatex"
    phase: precheck
    order: -10 # 路由决策先于装包预检
    when: { always: true }
    condition:
      engine_in: [tectonic]
      # 2026-09-16 注释-FP 收紧 (1803.08846 实证: %\usepackage{pstricks}
      # 注释行误杀 baseline-clean 稿): source_contains 跑 raw 源 → 各备选项
      # 行锚 (?m)^[ \t]* (:369 latex209 gate 先例, % 注释行不命中)。包名
      # 元素级口径同 compile/engine.py _PSTRICKS_RE (2d06184):
      # pstricks(?:-\w+)?|pst-\w+ 元素边界 (防 {notpstricks} 子串),
      # RequirePackage 同收, {amsmath,pstricks} 非首元素命中; pspicture
      # 收 \begin{pspicture*?}/\pspicture cs 两形态。
      source_contains: "(?m)^[ \\t]*(\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\b(pstricks(-\\w+)?|pst-\\w+)\\b|\\\\begin\\s*\\{pspicture\\*?\\}|\\\\pspicture\\b|\\\\psset\\b)"
    action:
      kind: reject_route
      params:
        { route: "xelatex", reason: "pstricks/pspicture hard wall on tectonic" }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 下 pstricks 可走 (dvips 后端另议), 不触发
    provenance:
      - {
          corpus: "pstricks-probe (docs/research/latex/pstricks-route.md)",
          error: "xdvipdfmx EPS hard wall",
        }
    stats:
      {
        fires: 0,
        note: "v1 为 eps_route fileset 版; v2 拆出 .eps 改走 ps_image 循环规则",
      }
    source_ref: "docs/08-translate-compile.md L218, L271; fixloop-v2 整改"

  # W31 孤儿裁决 (mechmap-2026-09-17): svg 包 = inkscape + shell-escape
  # 外部链, tectonic 无可行路径 → precheck 直拒路由 xelatex; xelatex 臂
  # 由 loop 侧 svg_prepare 接管 (flag/预转换两臂)。行锚口径同 pstricks_route。
  - id: svg_route
    mechanisms: [W31, B05]
    description: "\\usepackage{svg}/\\includesvg 依赖 → tectonic 无 inkscape 链, 预检路由 xelatex"
    phase: precheck
    order: -9 # pstricks_route(-10) 后, static_precheck(0) 前
    when: { always: true }
    condition:
      engine_in: [tectonic]
      source_contains: "(?m)^[ \\t]*\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\bsvg\\b|^[ \\t]*\\\\includesvg\\b"
    action:
      kind: reject_route
      params:
        {
          route: "xelatex",
          reason: "svg package needs inkscape + shell-escape",
        }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 臂走 svg_prepare (inkscape 在请 flag, 缺席预转换)
    provenance:
      - {
          corpus: "mechmap W31 (svg 包 inkscape/shell-escape 链)",
          error: "File `*_svg-tex.pdf' not found / shell-escape disabled",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W31 verdict suggested_rules"

  # W164 孤儿裁决 (stybegindoc-lane 2026-09-18): e-print 偶发把整包源码
  # 以嵌套 tar 随投稿, 外层解包后 tar 以 .sty/.cls 名落进工作树 ——
  # TeX \input 读 tar 头成排版文本 → Missing \begin{document} 于伪装件
  # 第 N 行 (l.30 `A MSfonts.sty^^@^^@` NUL 填充实证)。必须在
  # static_precheck(0) 前抽成员——tar 内含真 .sty/.cls/主档, 成员落地
  # 后缺件扫描才看得见 (0707.0382 tar 含 iaus.cls 正是所需 docclass)。
  - id: tar_blob_extract
    mechanisms: [W164]
    description: "e-print 内嵌 tar 伪装 .sty/.cls → 成员补缺解包 + blob 改名退役"
    phase: precheck
    order: -1 # svg_route(-9) 后, static_precheck(0) 前: 成员先落地缺件扫描才收
    when: { always: true }
    action:
      kind: builtin_transform
      function: extract_tar_blobs
    risk: low # no-clobber 补缺 + 抽中才改名退役; 0 成员原样放回
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0707.0382, astro-ph/0104007 (stagerun-loop2 fail)",
          error: "Missing \\begin{document} at AMSbsy.sty:30 / aipproc.cls:30 — 文件本体是 POSIX tar (ustar@257), 非 .sty/.cls 内容",
        }
      - {
          corpus: "1706.00240 (同 lane 副修): physics_stub_detach \\input 裸载缺 @-catcode",
          error: "Missing \\begin{document} at physics.sty:13 — \\@undefined 在 @=other 下碎裂 (见 _builtins_pkgload letter_wrap)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-stybegindoc/ (loop2 cases.jsonl log_excerpt 取证)"

  - id: static_precheck
    mechanisms: [W11, W47, W61, B05, W80]
    description: "静态扫全部源码的 \\usepackage|\\RequirePackage|\\documentclass → 探测缺失 → filemap 批量装包 (一次装好, 省 N 轮循环)"
    phase: precheck
    order: 0
    when: { always: true }
    action:
      kind: scan_install
      params:
        scan_patterns:
          - {
              regex: "\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              split: ",",
              suffix: ".sty",
            }
          - {
              regex: "\\\\documentclass\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              suffix: ".cls",
            }
          # \input/\include/\InputIfFileExists —— 花括号/裸名两形态通收;
          # suffix 仅在名无扩展时补 (engine.py _apply_scan_install 条件化)
          # —— `\input epsf` 裸名此前不进预检清单 (loop1 实证)。
          - {
              regex: "\\\\(?:input|include|InputIfFileExists)(?=[^a-zA-Z])\\s*\\{?([^\\s{}%\\\\]+)",
              suffix: ".tex",
            }
        verify: file_probe # kpsewhich / 本地探测
        batch: true # 聚合后单次安装 (L611-617)
        # install_file 全链败 → repo vendored 兜底落 wdir (vendored_fetch 同源;
        # 穿透型缺件: missing_file 非首错时轮级分类看不到 —— hep-ph/0104121)
        vendored: true
        noise_filter: "^[\\w.-]+$" # 滤掉 '\\\\@tempb.sty' 类误捕 token (见 known_gaps)
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: skip # bundle 按需拉包, 预检基本多余
        fallback: ctan_fetch # 增强位: 仅做本地存在性检查, 缺则 ctan_fetch
        note: "bundle 没有的包 (自定义 sty) 仍值得预检 → 保留轻量版"
    provenance:
      - { corpus: "*", error: "冷 TEXMFHOME 下高频 missing_file" }
    stats: { fires: 22, note: "22/22 格执行; 每格装 0-9 包" }
    source_ref: "fixloop.py L594-618"

  # W58 孤儿裁决 (mechmap-2026-09-17, 低优先级信号收割): % arara:/!TEX
  # 注释是作者明示构建需求但编译循环无人收割。此处注释本体即信号 —
  # source_contains 跑 raw 源反而对路 (与全局注释-FP 收紧惯例相反)。
  # builtin 不改源: shell 诉求 → engine_flags 请 -shell-escape (引擎
  # seam 自管拒放); !TEX program/arara 规则名 → advisories 账本留痕
  # (重路由权在 reject_route, 收割只记不动)。
  - id: build_directive_harvest
    mechanisms: [W58]
    description: "% arara:/!TEX 构建指令收割 → engine_flags/advisories 建议 (不改源)"
    phase: precheck
    order: 5 # static_precheck(0) 后殿后: 收割面只进账本, 不抢装包序
    when: { always: true }
    condition: { source_contains: "(?im)^[ \\t]*%+\\s*(arara:|!\\s*TEX)" }
    action:
      kind: builtin_transform
      function: harvest_build_directives
      params: {}
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # flag 请求被 seam 拒放即落 flags_dropped, 安全
    provenance:
      - {
          corpus: "mechmap W58 (arara/TeXShop 指令头稿)",
          error: "构建需求写在注释里无人执行 (shell-escape/引擎指定)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W58 verdict suggested_rules"
