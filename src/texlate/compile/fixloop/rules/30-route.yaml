  # ── 2026-09-28 qc-impl (impl-rules.json IDX29, geo_margin_breach ×10) ──
  # 2211.00031 + a4/a4wide 族 (0806.2250/0812.0267/1003.0230/1107.0598/
  #   1206.0240/1206.0756/1312.0413): ctex 注入 \linespread{1.3} 使
  #   \baselineskip 胀 → \textheight=N\baselineskip 赋值在胀值上求值
  #   (探针 th=803.7pt = 42×18.85bp) → 文本块超纸面, geo_margin_breach。
  #   a4.sty 族包体内同款 \baselineskip 单位赋值。无 log 签名 (几何量
  #   不产 overfull) → precheck 源码签名门。spec 草 builtin
  #   textheight_baseline_clamp 未注册 → 同义 regex_rewrite: 导言区注
  #   \AtBeginDocument \ifdim 钳到纸高安全值 (paperheight - 1in 偏置 -
  #   topmargin/headheight/headsep/footskip - 12pt 垫), \global 防钩内
  #   分组回收, 全串零 @ 字符免 catcode 议。fp-诊断两格
  #   (1907.00049/2105.11409 a4wide 忠实稿) 钳后与 en 侧 pdflatex
  #   版面同源——修复非分歧。fixloop-thclamp 标记幂等。
  - id: textheight_baselineskip_freeze
    description: "a4/a4wide/\\textheight=N\\baselineskip 撞 ctex \\linespread 胀值 → \\AtBeginDocument \\ifdim 几何钳"
    phase: precheck
    order: -0.45 # latex209_upgrade(-0.5)/shipped_sty_input_wrap(-0.5) 后: 209 升档落定后再钳 (a4wide 是 209 时代包)
    when: { always: true }
    condition:
      # \A 锚定单判三闸: 幂等标记缺席 ∧ (a4 族包装载 ∨ \textheight 直赋
      # \baselineskip 单位) 存在; 触发面与 spec 条件同式。
      source_contains: "(?s)\\A(?!.*fixloop-thclamp)(?=[\\s\\S]*(?:\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{[^}]*\\b(?:a4|a4wide|a4margins)\\b|\\\\textheight\\s*=?\\s*[0-9.]+\\s*\\\\baselineskip))[\\s\\S]"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "(?m)^[ \\t]*\\\\documentclass(\\[[^\\]\\n]*\\])?\\s*\\{[^}\\n]*\\}",
              repl: "\\g<0>\n% fixloop-thclamp: textheight guard under ctex linespread inflation\n\\\\AtBeginDocument{\\\\ifdim\\\\textheight>\\\\dimexpr\\\\paperheight-1in-\\\\topmargin-\\\\headheight-\\\\headsep-\\\\footskip-12pt\\\\relax\\\\global\\\\textheight=\\\\dimexpr\\\\paperheight-1in-\\\\topmargin-\\\\headheight-\\\\headsep-\\\\footskip-12pt\\\\relax\\\\fi}",
              match_surface: "masked",
            }
    risk: low # 只钳超界 \textheight 不放大; 标记幂等 + \ifdim 自门, 健康稿零改
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 源级守卫, 引擎无关
    provenance:
      - {
          corpus: "2211.00031 + a4 族 7 格 (qc geo_margin_breach)",
          error: "\\textheight45\\baselineskip 在 \\linespread{1.3} 下估值 803.7pt 超纸面可用高",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX29 (builtin textheight_baseline_clamp 未注册 → regex_rewrite 同义)"

  - id: static_precheck
    mechanisms: [W11, W47, W61, B05, W80]
    description: "静态扫全部源码的 \\usepackage|\\RequirePackage|\\documentclass → 探测缺失 → filemap 批量装包 (一次装好, 省 N 轮循环)"
    phase: precheck
    order: 0
    when: { always: true }
    action:
      kind: scan_install
      params:
        scan_patterns:
          - {
              regex: "\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              split: ",",
              suffix: ".sty",
            }
          - {
              regex: "\\\\documentclass\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              suffix: ".cls",
            }
          # \input/\include/\InputIfFileExists —— 花括号/裸名两形态通收;
          # suffix 仅在名无扩展时补 (engine.py _apply_scan_install 条件化)
          # —— `\input epsf` 裸名此前不进预检清单 (loop1 实证)。
          - {
              regex: "\\\\(?:input|include|InputIfFileExists)(?=[^a-zA-Z])\\s*\\{?([^\\s{}%\\\\]+)",
              suffix: ".tex",
            }
        verify: file_probe # kpsewhich / 本地探测
        batch: true # 聚合后单次安装 (L611-617)
        # install_file 全链败 → repo vendored 兜底落 wdir (vendored_fetch 同源;
        # 穿透型缺件: missing_file 非首错时轮级分类看不到 —— hep-ph/0104121)
        vendored: true
        noise_filter: "^[\\w.-]+$" # 滤掉 '\\\\@tempb.sty' 类误捕 token (见 known_gaps)
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: skip # bundle 按需拉包, 预检基本多余
        fallback: ctan_fetch # 增强位: 仅做本地存在性检查, 缺则 ctan_fetch
        note: "bundle 没有的包 (自定义 sty) 仍值得预检 → 保留轻量版"
    provenance:
      - { corpus: "*", error: "冷 TEXMFHOME 下高频 missing_file" }
    stats: { fires: 4905, rescued_cells: 1921, status: active }
    source_ref: "fixloop.py L594-618"

  # ── 2026-09-28 qc-impl (impl-rules.json IDX65, vis_blank_page ×2) ──
  # psfig/epsf 族 PS 时代图形走 \special{ps:} 通道 —— xelatex/tectonic
  #   的 xdvipdfmx 不解释 PS special, 图静默丢或报错 (compile clean 的
  #   空页/缺图面)。latex+dvips 通道已立 (latex209_reject 同令牌),
  #   dvips 原生接这类稿。序位 3: tar_blob_extract(-1)/subfile_strip
  #   (-0.7) 解包落定后源码签名才可见, static_precheck(0) 已先跑装包
  #   ——路由格浪费一次装包工, 换签名视野 (纯 \epsfbox 格先被
  #   epsfbox_fit(-6) 改写不再命中本签; psfig/epsffile/\special ps
  #   残签仍改道)。行锚口径同 pstricks_route。
  - id: ps_graphics_dvips_route
    mechanisms: [B05]
    description: "psfig/epsffile/\\special ps PS 时代图形 → xdvipdfmx 不接 PS special, 预检路由 latex+dvips"
    phase: precheck
    order: 3 # static_precheck(0) 后, build_directive_harvest(5) 前
    when: { always: true }
    condition:
      source_contains: "(?m)^[ \\t]*\\\\(psfig\\s*\\{|epsfbox|epsffile|special\\s*\\{?\\s*ps:)"
    action:
      kind: reject_route
      params:
        {
          route: "latex+dvips",
          reason: "PS-era graphics (psfig/epsf/\\special ps) — xdvipdfmx cannot embed",
        }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "qc vis_blank_page ×2 (impl-rules.json IDX65)",
          error: "psfig/epsf \\special ps 依赖 → xdvipdfmx 静默丢图/空页",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/qc_impl_spec/impl-rules.json IDX65; latex209_reject 同 latex+dvips 令牌先例"

  # W58 孤儿裁决 (mechmap-2026-09-17, 低优先级信号收割): % arara:/!TEX
  # 注释是作者明示构建需求但编译循环无人收割。此处注释本体即信号 —
  # source_contains 跑 raw 源反而对路 (与全局注释-FP 收紧惯例相反)。
  # builtin 不改源: shell 诉求 → engine_flags 请 -shell-escape (引擎
  # seam 自管拒放); !TEX program/arara 规则名 → advisories 账本留痕
  # (重路由权在 reject_route, 收割只记不动)。
  - id: build_directive_harvest
    mechanisms: [W58]
    description: "% arara:/!TEX 构建指令收割 → engine_flags/advisories 建议 (不改源)"
    phase: precheck
    order: 5 # static_precheck(0) 后殿后: 收割面只进账本, 不抢装包序
    when: { always: true }
    condition: { source_contains: "(?im)^[ \\t]*%+\\s*(arara:|!\\s*TEX)" }
    action:
      kind: builtin_transform
      function: harvest_build_directives
      params: {}
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # flag 请求被 seam 拒放即落 flags_dropped, 安全
    provenance:
      - {
          corpus: "mechmap W58 (arara/TeXShop 指令头稿)",
          error: "构建需求写在注释里无人执行 (shell-escape/引擎指定)",
        }
    stats: { fires: 62, rescued_cells: 24, status: active }
    source_ref: "bench/corpus/mechanisms.jsonl W58 verdict suggested_rules"
