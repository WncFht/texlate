# rules/55-prim.yaml — fixloop 规则库分片：引擎原语 —— pdftex_prim/expl3 后端与
# glyphtounicode 遮蔽
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/00-base.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # 2026-09-16 批二: expl3_backend×4 (0905.4874/1306.0364/hep-ph0501170/
  # 9910403) —— 全局驱动选项 (dvips/pdftex) 经 documentclass 传给 expl3
  # 后端探测 → "Backend request inconsistent with engine: using 'xetex'"
  # 于 ctex→expl3 装载点炸。xelatex 自决 xdvipdfmx, 驱动选项纯属死重 →
  # 从 \documentclass[..] 剥除。旧单正则 `,?driver,?` 双吃两侧逗号，
  # 中段剥除把邻项粘成幻影选项 (finalreqno) —— 拆 表首/表内/表尾
  # 三态 (同 hyperref_driver_neutralize 形)。corpus 普查: 驱动词
  # 恒单枚出现 (多枚形无实证); \b 词界挡 dvipsnames 伪命中。
  - id: expl3_driver_opt_strip
    description: "documentclass 驱动选项 (dvips/pdftex 系) 与 xelatex 后端冲突 → 剥除"
    phase: loop
    order: 35
    when: { category: expl3_backend }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          # 全驱动选项表: [dvips] / [dvips,dvipdfmx] → 整括号剥除
          - {
              pattern: "\\\\documentclass\\s*\\[\\s*(?:\\b(?:dvips|dvipdfmx?|pdftex|pdflatex|xdvi|oztex|textures|vtex)\\b\\s*,?\\s*)+\\]",
              repl: "\\\\documentclass",
            }
          # 表首驱动词连排: [dvips,opt] / [dvips,pdftex,opt] → [opt]
          - {
              pattern: "(\\\\documentclass\\s*\\[\\s*)(?:\\b(?:dvips|dvipdfmx?|pdftex|pdflatex|xdvi|oztex|textures|vtex)\\b\\s*,\\s*)+",
              repl: "\\g<1>",
            }
          # 表内/表尾驱动词连排: [a,dvips,b]→[a,b] [a,dvips]→[a]
          - {
              pattern: "(\\\\documentclass\\s*\\[[^\\]]*?)(?:,\\s*\\b(?:dvips|dvipdfmx?|pdftex|pdflatex|xdvi|oztex|textures|vtex)\\b\\s*)+(?=,|\\])",
              repl: "\\g<1>",
            }
          # 剥除残留的 ",]" 洞：[a,dvips,]→[a]
          - {
              pattern: "(\\\\documentclass\\s*\\[[^\\]]*?),\\s*\\]",
              repl: "\\g<1>]",
            }
    risk: low # 剥错向：dvipdfmx 名义上与 xetex 自决同路，剥了不亏
    known_gap: "同一括号内非连排多驱动词 (a,D,b,D2) 只剥首个连排段——锚消费形单遍限制，与 hyperref_driver_neutralize 同; corpus 无多驱动词实证"
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: same # tectonic 后端固定，同理由剥除
    provenance:
      - {
          corpus: "loop2-delta expl3_backend×4",
          error: "expl3.sty:154 Backend request inconsistent with engine: using 'xetex'",
        }
    stats: { fires: 0 }
    source_ref: "wave-2: expl3_backend 类目首个消费规则"

  # 2026-09-17 fixer-bblwall A3 (2105.03753): lipics-v2021.cls:510
  # `\IfFileExists{glyphtounicode.tex}{\input glyphtounicode}` —— texmf-dist
  # 里真文件在故守卫开火，体首 \pdfglyphtounicode/\pdfgentounicode 是
  # pdfTeX 原语 → xelatex 下 undefined_cs→pdftex_prim 细分。order 必须
  # 先于 guard(50)/polyfill(51) 截走 payload——守卫/polyfill 治不了
  # "文件存在但原语缺" 的形态，空 stub 让 \input 路径整个短路。
  - id: glyphtounicode_shadow
    mechanisms: [W104]
    description: "cls \\IfFileExists 守卫触发真 glyphtounicode.tex (pdfTeX 原语件) → wdir 注空 stub 遮蔽"
    phase: loop
    order: 46 # pdftex_prim_guard(50)/polyfill(51) 之前 —— payload 同格先截
    when:
      any:
        - { category: pdftex_prim, payload_required: true }
        - { category: undefined_cs, payload_required: true }
    condition:
      any:
        - { source_contains: "glyphtounicode" } # 源/cls 确有 \input 引用链才落 stub
        ## REVIEW 拓宽: 报错站点在 fileset 外 (axessibility.sty 型系统
        ## texmf 件 \input{glyphtounicode}) —— stub 落 wdir 由 TeX 文件
        ## 解析序 (cwd 先) 截获，与站点文件归属无关，臂不需源证据。
        - { err_outside_fileset: true }
    action:
      kind: builtin_transform
      function: bundled_class_shadow
      params:
        target: glyphtounicode.tex
        cs_set: [pdfglyphtounicode, pdfgentounicode]
        body: |
          % fixloop shadow: cls-guarded \input of pdftex-only glyphtounicode
          \ifdefined\pdfglyphtounicode\else\def\pdfglyphtounicode#1#2{}\fi
          \ifdefined\pdfgentounicode\else\newcount\pdfgentounicode\fi
          \endinput
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同缺 pdf 原语
    provenance:
      - {
          corpus: "2105.03753 (41 recut; fixer-bblwall-2026-09-17 A3)",
          error: "Undefined control sequence \\pdfglyphtounicode (lipics-v2021.cls:510 \\IfFileExists 守卫开火 input 真文件)",
        }
    stats: { fires: 45, rescued_cells: 26, status: active }
    source_ref: "fixer-bblwall-2026-09-17 spec A3; \\pdfgentounicode 是 count 赋值形故 \\newcount"

  # ─── loop: 源码改写系 —— 按"保守→激进"排序 ───
  # 2026-09-19 drvopt-ext 车道 (soak-2026-09-18 aaai2027 ×15): doc 伴船
  # aaai2027.sty:58-59 `\RequirePackage{iftex}` + `\RequirePDFTeX` —— iftex
  # 引擎守卫在非目标引擎 \IFTEX@Require 拉 \read → nonstop 即 Emergency
  # stop, file-line 错落 emergency 零规则可接 (unfixable:emergency ×15)。
  # xelatex 下 \Require<X>TeX 守卫两向都安全: 通过形 (XeTeX/TUTeX/eTeX) 与
  # \relax 同语义，拉闸形 (PDFTeX/LuaTeX/pTeX/VTeX/AlephTeX/...) 中和即拆弹
  # —— 族级词形 \Require[A-Za-z]*TeX 一律换 \relax。
  # 2026-09-19 aaai-guard 加固: def-target 位 (\def\RequirePDFTeX/
  # \newcommand{\RequirePDFTeX}/\let 直跟形) 不换 —— 置换会成 \def\relax
  # 重定义灾; lookbehind 变宽形 (regex 引擎支持) 豁免 def 族直跟站，
  # use 站与宏体内裹站仍中和。族名补 pTeXng/HINT/Prote 非 TeX 尾闸。
  - id: iftex_engine_guard_neutralize
    description: "doc 伴船件内 iftex \\Require<X>TeX 引擎守卫 → xelatex 下 \\read Emergency stop → 中和 \\relax"
    phase: loop
    order: 47 # glyphtounicode_shadow(46)/opt_strip(48) 同档 —— 致死标记先拆
    when:
      any:
        - { category: emergency }
        # belt: 守卫炸点非首错时落早终/散件标记 (acro_v3_key_rename 同构兜底)
        - { category: early_eof }
        - { category: other }
    condition:
      # source_blob 见 \Require<X>TeX 词形才落 —— 站点必在 fileset 才可改写;
      # \b 挡 \RequireTeXfoo 自定义名尾 (TeX cs 名后接字母不词界)
      source_contains: "\\\\Require[A-Za-z]*TeX\\b"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # def-target lookbehind: \def/\let/newcommand 族直跟的 \Require*TeX
          # 是被定义位不是调用 —— 换 \relax 会成 \def\relax 灾 (regex 引擎
          # 支持变宽 lookbehind); 定义残留为空转，use 站照常中和。
          - {
              pattern: "(?<!\\\\(?:[gex]?def|let|newcommand|renewcommand|providecommand|DeclareRobustCommand|newrobustcmd|renewrobustcmd|providerobustcmd|DeclareTextCommand)\\s*\\*?\\s*\\{?\\s*)\\\\Require(?:[A-Za-z]*TeX|pTeXng|HINT|Prote)\\b",
              repl: "\\\\relax",
              match_surface: masked,
            }
    risk: low # 守卫唯一职能是错引擎拉闸; 通过形换 \relax 语义恒等
    known_gap: "\\csname 构造形与 fileset 外 (texmf 系统件) 站点不可改写未盖; def-target 位 (\\def/\\let/\\newcommand 族直跟) 按定义语义豁免 —— 本地重定义闸变死定义不中和; 中和后露出的 pdf 原语赋值站点 (aaai2027.sty \\pdfpagewidth/\\pdfpageheight) 归 pdftex_prim_guard/polyfill 链"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同 \ifpdftex=false → 同拉闸
    provenance:
      - {
          corpus: "soak-2026-09-18 aaai2027.sty ×15 (2609.19149/2609.19164/2609.17927/2609.19158/2609.19170/2609.19559 等)",
          error: "aaai2027.sty:59 Emergency stop. (\\RequirePDFTeX iftex 守卫，unfixable:emergency, rounds=2 零相关规则)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "drvopt-ext lane: \\RequirePDFTeX emergency 15 同质格 (iftex.sty \\IFTEX@Require \\read 机制)"

  # 2026-09-19 errsweep 车道 (soak-2026-09-18 2609.19664 fairmeta):
  # fairmeta.cls:25 `\DisableLigatures[f]{family=sf*}` 无引擎守卫 ——
  # microtype 该 cs 是 pdftex≥1.30/luatex 限定件，xelatex 下定义为
  # 报错+忽略 (file-line `Package microtype Error: Disabling ligatures
  # ... only possible` → halt-on-error 每轮必停，'other' 标记 stuck)。
  # 中和即语义恒等: xelatex 下 microtype 本就忽略此调用，连可选参
  # ([<lig>]) 与字体参 ({<spec>}) 一并吃掉换 \relax —— 换 bare
  # cs 名会留 [f]{family=sf*} 残字排进正文。
  - id: microtype_disableligatures_neutralize
    description: "microtype \\DisableLigatures (pdftex 限定件) 无守卫调用 → xelatex PackageError → 连参中和 \\relax"
    phase: loop
    order: 47 # iftex_engine_guard_neutralize(47) 同档 —— 引擎假定致死标记先拆
    when:
      any:
        - { category: other }
        - { category: emergency }
    condition:
      # 双闸: fileset 见该 cs 才改写 ∧ 本轮错误面确实是 microtype 拦停
      # (同名自定义宏不在 fileset 的格不误伤)
      source_contains: "\\\\DisableLigatures(?![a-zA-Z@])"
      ctx_suggests: "Disabling ligatures|microtype"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\DisableLigatures(?![a-zA-Z@])(\\s*\\[[^\\]\\n]*\\])?(\\s*\\{[^}\\n]*\\})?",
              repl: "\\\\relax ",
              match_surface: masked,
            }
    risk: low # xelatex 下该 cs 唯一行为是报错 + 忽略; 移除调用不改变任何输出
    known_gap: "\\SetProtrusion/\\SetExpansion/\\SetTracking 等同族 pdftex 限定声明未盖 (soak 未见，见再扩); \\DisableLigatures 跨行参 ([\\n]/{\\n}) 不吃"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同错
    provenance:
      - {
          corpus: "soak-2026-09-18 2609.19664 fairmeta (relink 后露出的二级标记)",
          error: "fairmeta.cls:25 Package microtype Error: Disabling ligatures of a font is only possible with pdftex version 1.30 or newer ('other' 标记，4 轮 stuck)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "errsweep-2026-09-19: missing_file relink 通路验证中揭示的下游标记"

  # 2026-09-19 driver-option strip 车道 (loop3-1206.0240/1706.07495/1306.0294):
  # [pdftex] 驱动选项残存进 zh 树 → xelatex 下装载 pdftex.def → \pdfcolorstack
  # 等原语 undefined → 错误恢复把 chardef 残值排进字流 (^^@×179/^^A×20
  # missing_char 族)。normalize 括号面只认单包 {graphicx} 形，多包
  # {graphicx,color}/{color,graphicx} 与 vendored cfg \ExecuteOptions{pdftex}
  # 漏网 (1306.0294 vendored color.cfg/graphics.cfg + 2007 pdftex.def 实案:
  # .eps 成 Unknown graphics extension → \includegraphics 错 → \subfloat 恢复
  # 级联)。guard(50)/polyfill(51) 只守卫/补定义——pdftex.def 仍载，chardef
  # token 照样排字 (polyfill 的 "pdfcolorstack":"#1" 臂回声同 token, 治不了
  # 泄漏) —— 剥选项必须排在它们之前。改写组与 hyperref_driver_neutralize
  # (70-pkgopt) 同构: 括号/PassOptions/def-driver 三套剥词 + 空括号清扫，
  # 另加 ExecuteOptions 驱动词换 xetex 臂 (cfg 驱动选支形，剥空会丢同括号
  # 兄弟选项故取显式换写)。
  - id: pdftex_driver_opt_strip
    description: "[pdftex] 驱动选项残存 (多包括号/vendored cfg 漏网面) → 驱动词剥除/ExecuteOptions 换 xetex, pdftex.def 不载"
    phase: loop
    order: 48 # guard(50)/polyfill(51) 之前 —— 根修先于症状补丁; polyfill 落地后 pdftex_prim 标记消失，再没机会
    when:
      any:
        - { category: pdftex_prim, payload_required: false }
        # file-line 错归 other 的失守面 (hyperref_driver_neutralize 同构);
        # 无站点 applied=False 当场让位下条，不耗轮
        - { category: other, payload_required: false }
    condition:
      # source_blob 仅 .tex/.sty/.cls —— 词级闸与改写臂词表同域 (剥谁放谁，
      # \b 挡 dvipsnames 伪命中); vendored cfg 格靠 .sty 内 pdftex 字样
      # (geometry.sty \Gm@pdftex) 放行; hypertex/dvips 独占格 (xcolor.sty
      # \GinDriver{hypertex} / aa.cls \aa@driver{dvips} 支无 pdftex 字样)
      # 同机制放行 —— 旧闸 \bpdftex\b 把改写臂盖得住的面拦在门外
      source_contains: "\\b(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\b"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls, .cfg]
        rewrites:
          # 全驱动括号: [pdftex] / [pdftex,dvips] → [] (括号可跨行)
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\]",
              repl: "[]",
              match_surface: masked,
            }
          # 括号首位驱动词: [pdftex,opt] → [opt]
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "[",
              match_surface: masked,
            }
          # 中段/末位驱动词: [opt,pdftex,opt2] / [opt,pdftex] → [opt,opt2]/[opt]
          - {
              pattern: "(\\[[^\\]]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\])",
              repl: "\\g<1>",
              match_surface: masked,
            }
          # PassOptionsToPackage/Class 首参同三套 (大括号形)
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\}",
              repl: "\\g<1>}",
              match_surface: masked,
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "\\g<1>",
              match_surface: masked,
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\})",
              repl: "\\g<1>",
              match_surface: masked,
            }
          # \\def\\<cs>driver<cs>{<drv>} 间接指派 → xetex (kaist-ucs.cls 形;
          # [Dd]river 大写面: xcolor.sty \GinDriver{hypertex}/maple2e \Driver)
          - {
              pattern: "(\\\\[gex]?def\\s*\\\\[\\w@]*[Dd]river[\\w@]*\\s*\\{)\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*\\}",
              repl: "\\g<1>xetex}",
              match_surface: masked,
            }
          # \\newcommand 族同形指派 (aa.cls \\aa@driver / webofc.cls
          # \\woc@driver / \\renewcommand{\mydriver}{pdftex} 条件选支;
          # cs 名可裸可 {..} 包，容忍 [n][default] 参槽)
          - {
              pattern: "(\\\\(?:newcommand|renewcommand|providecommand)\\s*\\{?\\s*\\\\[\\w@]*[Dd]river[\\w@]*\\s*\\}?\\s*(?:\\[\\d+\\]\\s*(?:\\[[^\\]]*\\]\\s*)?)?\\{)\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*\\}",
              repl: "\\g<1>xetex}",
              match_surface: masked,
            }
          # \\ExecuteOptions{...drv...} 驱动词 → xetex (变宽 lookbehind 逐词;
          # vendored color.cfg/graphics.cfg 驱动选支形，剥空丢兄弟选项故换写)
          - {
              pattern: "(?<=\\\\ExecuteOptions\\s*\\{[^{}]*)\\b(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\b",
              repl: "xetex",
              match_surface: masked,
            }
          # 空括号清扫: \usepackage[]{x} → \usepackage{x}
          - {
              pattern: "(\\\\(?:documentclass|usepackage|RequirePackage))\\s*\\[\\s*\\]",
              repl: "\\g<1>",
              match_surface: masked,
            }
    risk: low # xetex 下这些驱动本就失效; masked 面只改写活代码，注释/逐字不动
    known_gap: "vendored pdftex.def/dvips.def 实体件仍留 wdir (选支换 xetex 后不再被载，残留无害; 遮蔽退役属 vendored_shadow 面未覆盖 .cfg/.def —— backlog); .def/.clo 内驱动站点未盖 (无实证); \\let 形指派与 \\hypersetup 驱动键未盖 (同 neutralize)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同驱动面
    provenance:
      - {
          corpus: "loop3-1206.0240 (^^@×179) + 1706.07495 (^^@×106): \\usepackage[pdftex]{graphicx,color}/{color,graphicx} 多包括号漏 normalize; 1306.0294 (^^A×20): vendored color.cfg/graphics.cfg \\ExecuteOptions{pdftex} + vendored 2007 pdftex.def",
          error: "Undefined control sequence \\pdfcolorstack → chardef 残值排字 missing_char",
        }
    stats: { fires: 15, rescued_cells: 9, status: active }
    source_ref: "c0diag C0-ctrl census; normalize.py _DRIVER_SCOPE_RX 单包括号面外漏网"

  - id: pdftex_prim_guard
    description: "pdfTeX 原语裸用 (@pdftex_prims 族 token, load 期展开成 PDFTEX_PRIMS 交替) → \\ifdefined 守卫，xelatex 下静默跳过"
    phase: loop
    order: 50
    when: { category: pdftex_prim }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # bal = regex 递归平衡花括号: \{ (转义\{|\}|\% | 行注释 | 嵌套 bal |
          # 非括号)* \} —— TeX 词法同构 (注释/转义内括号不计配对), 跨行实参
          # 全真接管 (旧 [^\n] 弃守面收编)。赋值臂 value = (escape|bal|非括号
          # 非注释字符|孤{)* —— 裸 } 必停: 单行 \def\f{\prim=1} /
          # \def\f{\prim{a}}
          # 外层 } 不可吞，旧贪婪 [^\n%]*/[^\n]*} 吞外层 } 把 \fi 落出宏体外
          # → Extra/Incomplete \fi 破坏级缺陷 (primarg 期审计实证，primguard
          # 修)。孤 { 兜底吃字面量: 不可闭合 { 维持旧"整行吞", xetex
          # 跳过面干净。
          - {
              pattern: "(?<![\\\\a-zA-Z])(\\\\@pdftex_prims)(?![a-zA-Z@])(\\s*=\\s*(?:\\\\[{}%]|(?<bal>\\{(?:\\\\[{}%]|%[^\\n]*|(?&bal)|[^{}])*\\})|[^{}\\n%]|\\{)*)",
              repl: '\\ifdefined\g<1>\g<0>\\fi',
            }
          - {
              pattern: "(?<![\\\\a-zA-Z])(\\\\@pdftex_prims)(?![a-zA-Z@])(\\s*(?<bal>\\{(?:\\\\[{}%]|%[^\\n]*|(?&bal)|[^{}])*\\}))",
              repl: '\\ifdefined\g<1>\g<0>\\fi',
            }
    risk: low # lookbehind 排除 cs 名紧邻 (\<prim> 前接字母/反斜杠 = ifdefined/chardef/ifnum/let 定义语境 + 自输出第二枚), 幂等; loop1-1306.0036 实证旧 (?<!ifdefined) 会把 polyfill 注入的 \chardef\pdfoutput=1 再套娃改写
    known_gap: "实参内裸 \\fi/\\else/\\or token 在 xetex 跳读语义下仍被认作条件闭 (跳读不计花括号层) —— 包装形固有面，与站点正则无关，pdfdict 实参无实证; catcode 变更面 (verbatim/活动字符) 的括号/注释不识字面 —— raw 面匹配无 catcode 信息，全 regex_rewrite 共同限制"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核，守卫语义一致
    provenance:
      - {
          corpus: "1412.6980/*",
          error: "Undefined control sequence \\pdfoutput",
        }
    stats: { fires: 36, rescued_cells: 18, status: active }
    source_ref: "fixloop.py L344-361, L284-298"

  # 新增 (docs/spec/compile.md L268): guard 只管赋值型; 读取型 \ifnum\pdfoutput
  # 要补定义
  - id: pdftex_prim_polyfill
    description: "pdfTeX 原语补定义 (读取型/取参型/fileset 外站点) → 前导注入 \\ifdefined..\\else<寄存器 | 吞参 noop|chardef>\\fi"
    phase: loop
    order: 51 # 与 guard 同 trigger; dedup 后第二轮轮到它
    when: { category: pdftex_prim, payload_required: true }
    condition:
      any:
        - { prim_read_form: "{payload}" } # 源码确有 \\if*\\<prim> 读取语境才注入
        ## REVIEW 拓宽: fileset 外站点 (axessibility.sty:349 型系统 texmf
        ## 写型/读型原语) —— 主文件头注入与源证据无关; guard(50) 仍正确
        ## 弃守 (patch 不了看不见的件), polyfill 接住。写型站点由臂
        ## 内 \newcount 形全真接管 (见 _PRIM_COUNTISH)。
        - { err_outside_fileset: true }
        ## primarg 拓宽: fileset 内但 guard 包不到的取参站点 —— guard 两
        ## 形只要 \prim= / \prim{, \pdfrefobj\thecolor 型 (prim+cs token,
        ## spotcolor.sty:40 实证) 漏网; 源内见 \prim 即补定义，吞参 noop
        ## \ifdefined 幂等无害 (braced/赋值站点已被 guard 包过的不会回来
        ## 报错; 回来即确有未包站点)。
        - { source_contains: "\\\\{payload}(?![a-zA-Z@])" }
        ## pdfprim 车道臂 A: `pdf@` 别名族 (breakurl/pdfmark/pdftexcmds
        ## 系包体自导原语绑定) —— @-名定义上即 @=11 包内宏，报错站点必在
        ## 包体宏展开帧 (file_stack 归 doc .tex → err_outside_fileset 不中;
        ## 2502.03387 colm 实证 breakurl.sty:149 \sbox\pdf@box 报在 doc 侧)。
        ## fileset .sty 内字面站点已由 source_contains 臂覆盖; 本臂直放行 —
        ## 主文件头注定义 (AT_LETTER 包裹内 \ifdefined 形) 是唯一治法。
        - { payload_pattern: "@" }
    action:
      kind: builtin_transform
      function: pdftex_prim_polyfill
      params: { prim: "{payload}" } # 在主文件 \\documentclass 行后注入守卫
    risk: low
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "—",
          error: "Undefined control sequence (\\ifnum\\pdfoutput 读取型)",
        }
    stats: { fires: 60, rescued_cells: 30, status: active }
    source_ref: "docs/spec/compile.md L268"

  # 2026-09-20 singlesweep pdfprim 车道臂 B (pdftex-gated-codepath ×4):
  # pdf 模式门把能装代码段锁进死臂 —— \ifCLASSINFOpdf (1706.07613: 真臂
  # 装 graphicx[pdftex]+\graphicspath+\DeclareGraphicsExtensions, else 臂
  # 全注释 → \includegraphics undef), \ifpdf (2609.20238 dtrt.sty:226/237
  # 门 hyperref[pagebackref]+\dtbookmark → \backref undef, base+zh 双臂),
  # \ifx\pdfoutput\undefined (0712.1016 自产缺陷实证: snc.tex:25
  # `\ifhepph\else\ifx\pdfoutput\undefined\else<\pdfcompresslevel=9 +
  # hyperref[pdftex]>\fi\fi` —— polyfill 定义 \pdfoutput 后探针翻 else 臂，
  # hyperref[pdftex] 在 xetex 下 GenericError)。塌陷到编译期恒定臂:
  # \if<letters>pdf 族 → \iftrue (pdf 臂 = 能力臂，残存 [pdftex] 驱动词
  # 归 pdftex_driver_opt_strip(48) 收); \ifx 存在探针 → \iftrue (undefined
  # 真臂 = 非 pdftex = xetex 诚实臂，门消解后对 polyfill 注入的 \pdfoutput
  # 定义免疫 —— 自产缺陷根修)。\ifdefined/\ifcsname/\ifnum 值探针不改写:
  # 存在探针在 polyfill 落地后自然翻真、值探针经 _PRIM_INIT pdfoutput=0
  # 保持诚实假，塌与不塌同义 —— 且躲开 guard/polyfill 自注入的
  # \ifdefined\<prim>\else 惯形 (塌它会把刚注的定义变死)。
  - id: pdftex_gate_collapse
    description: "pdf 模式条件门 (\\if*pdf 族 + \\ifx\\pdfoutput 存在探针) 塌陷编译期恒定臂 → 死臂能力段复活"
    phase: loop
    order: 52 # polyfill(51) 后：guard/polyfill 先落自注入 \ifdefined 惯形不互踩; 门致 undefined_cs/other 格本规则先接
    when:
      any:
        - { category: undefined_cs, payload_required: false }
        - { category: pdftex_prim, payload_required: false }
        # file-line 错归 other 的失守面 (hyperref[pdftex] GenericError 型)
        - { category: other, payload_required: false }
    condition:
      # fileset 源确有可塌门才动 —— 门不在则零改写弃守不耗轮;
      # \if<letters>pdf 词尾 pdf 收 \ifpdf/\ifCLASSINFOpdf/\if@pdf 族，
      # 天然排除 \ifpdftrue/\ifpdffalse (词尾非 pdf) 与 \ifpdftex/
      # \ifpdfoutput/\ifpdfmode (pdf 后接字母被 (?![a-zA-Z@]) 挡)
      source_contains: "\\\\if[a-zA-Z@]*[pP][dD][fF](?![a-zA-Z@])|\\\\ifx\\s*\\\\pdfoutput\\s*\\\\(?:undefined|@undefined|relax)(?![a-zA-Z@])|\\\\ifx\\s*\\\\(?:undefined|@undefined|relax)\\s*\\\\pdfoutput(?![a-zA-Z@])"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # \if<letters>pdf 开关门 → \iftrue。def-target/操作数位 lookbehind:
          # \newif\ifpdf/\def\ifpdf/\let\ifpdf/\newcommand{\ifpdf} 是被定义位
          # 不是求值 —— 改写会成重定义灾; \ifx\ifpdf/\ifcat\ifpdf/
          # \ifdefined\ifpdf 操作数位 (探针右操作数) 语义随门存废，不同塌。
          # (?:\\[a-zA-Z@]+\s*)? 段护 \let\x\<门> RHS 与注入的
          # \let\ifpdf\iftrue 钩文本; \def\f{\ifpdf..} 门在宏体照常塌 (body
          # 非定义位 —— lookbehind 只消费一枚中间 cs 后遇 { 即失配放行)。
          - {
              pattern: "(?<!\\\\(?:[gex]?def|let|newif|newcount|newbox|newdimen|newtoks|newskip|newmuskip|newlength|newsavebox|newcommand|renewcommand|providecommand|DeclareRobustCommand|newrobustcmd|renewrobustcmd|providerobustcmd|DeclareTextCommand|newenvironment|ifx|ifcat|ifdefined)\\s*\\*?\\s*(?:\\{?\\s*|\\\\[a-zA-Z@]+\\s*)?)\\\\if[a-zA-Z@]*[pP][dD][fF](?![a-zA-Z@])",
              repl: "\\\\iftrue",
              match_surface: masked,
            }
          # \ifx\pdfoutput\<undef> 存在探针 → \iftrue (undefined 真臂是
          # xetex 诚实臂; 塌陷后 polyfill 注入的 \pdfoutput 定义翻不动门 —
          # 0712.1016 自产缺陷即此探针被 =1 初值翻 else 臂)
          - {
              pattern: "\\\\ifx\\s*\\\\pdfoutput\\s*\\\\(?:undefined|@undefined|relax)(?![a-zA-Z@])",
              repl: "\\\\iftrue",
              match_surface: masked,
            }
          # 反向操作数形 \ifx\<undef>\pdfoutput 同义同塌
          - {
              pattern: "\\\\ifx\\s*\\\\(?:undefined|@undefined|relax)\\s*\\\\pdfoutput(?![a-zA-Z@])",
              repl: "\\\\iftrue",
              match_surface: masked,
            }
    risk: low # 两臂皆编译期恒定真 —— 消门不消结构，\else/\fi 配对完整; 塌错向：pdf 臂在 xetex 下露出的 pdftex 残留归 prim guard/polyfill/driver-strip 链收
    known_gap: "texmf 内门不可改写未盖 (值探针由 _PRIM_INIT pdfoutput=0 保持非 pdf 臂); \\ifpdf\\ifpdf 嵌套内层按操作数位豁免不塌 (罕见惯形，外层塌后内层动态探针若 \\ifpdf 未定义下轮 undefined_cs 接); \\unless\\ifx 形与 \\ifnum\\pdfoutput 值探针不改写 (后者经 =0 初值保持诚实假); csname 构造门 (\\csname ifpdf\\endcsname) 无字面不中; \\ifx 探针 lookbehind 不设 —— \\let\\f\\ifx\\pdfoutput\\undefined 原文在 xetex 下本就裸奔 \\pdfoutput 报错，改写不劣化"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同缺 pdf 原语，门语义一致
    provenance:
      - {
          corpus: "singlesweep pdftex-gated-codepath ×4 (1706.07613 \\ifCLASSINFOpdf→graphicx[pdftex]→\\includegraphics; 2609.20238 dtrt.sty \\ifpdf→hyperref[pagebackref]→\\backref; 0712.1016 \\ifx\\pdfoutput 自产缺陷 GenericError)",
          error: "Undefined control sequence \\includegraphics / \\backref / GenericError (pdf 臂能力件被门死臂锁死)",
        }
    stats: { fires: 1, rescued_cells: 1, status: active }
    source_ref: "lane-pdfprim arm-B: 门死臂能力段复活 + polyfill 翻转存在探针的自产缺陷根修"
