# rules/40-install.yaml — fixloop 规则库分片：缺档装包 —— missing_file/missing_tfm → install/fetch + babel 选项
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # ─── loop: install 系 —— 环境缺失优先于源码改写 ───
  # 2026-09-19 wrapromote (relocatemiss 诊断修议#2, 2609.19170):
  # fragment 误判主档收容 —— find_main_tex pass-1 只收字面
  # \documentclass 件, 裸 \input 编排壳永不入池; 池内若只剩 fragment
  # (无 \end{document} 无 \input) 即编译 `*** (job aborted, no legal
  # \end found)`。修复层翻 main_rel 比动 inject 探测面爆炸半径小;
  # builtin 三重自门 (现 main 闭包已达 end=非 fragment 让位 / 零 wrapper
  # 无救让位 / 多 wrapper 歧义让位)。order 8.5 居 fileset 族(9) 前:
  # main 归位先于一切按 main 干的修复。
  - id: main_wrapper_promote
    description: "fragment 误判主档 → 闭包吞 main 且达 \\end{document} 的 \\input wrapper 提为 main_rel"
    phase: loop
    order: 8.5 # biber_biblatex_skew_route(8) 后, fileset 族(9) 前 —— main 归位先于按 main 修复
    when: { category: emergency }
    condition:
      ctx_suggests: "no legal \\\\end found"
    action:
      kind: builtin_transform
      function: main_wrapper_promote
      params: {}
    risk: low # 只翻 main_rel 不写文件; 恰一合格 wrapper 才动, 歧义/无救皆让位
    known_gap: "wrapper 经 \\import/宏参 \\input 等非 _walk_inputs 两跳口径拉 fragment 时不收; macro 生成 \\end{document} (\\csname 形) 非字面命中; wrapper 闭包缺 \\begin{document} 时提升后仍会错 (别家规则接管)"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "failmine4 soak-2026-09-18 2609.19170 (relocatemiss 诊断)",
          error: "*** (job aborted, no legal \\end found) —— sections/00_preamble.tex fragment 误判 main; 真入口 retd_jmlr_jmlr_candidate_20260828.tex 是根目录裸 \\input 编排壳, 无字面 \\documentclass 永不入池",
        }
    stats: { fires: 1, rescued_cells: 1, status: active }
    source_ref: "tmp/lane-relocatemiss/report.md 修议#2 (fixloop 收容臂); lane-wrapromote"

  # W79/W18/W102 孤儿裁决 (mechmap-2026-09-17): filemap 索引外的自产件。
  # 三条 order:9 窄谓词先于 install_file(10) 截流 —— 运行期生成件/包内
  # docstrip 件 install 必 miss 白烧轮次; 谓词不中 return False 不耗轮。
  # 2026-09-19 covgap-B 补第四条 order:9 居族首 (failmine4 4 格):
  # e-print 自带件在 wdir 但不在 TeX 解析位 (main 住子目录, compile
  # cwd=main_dir 无 TEXINPUTS 根注入) —— install_file 探测 cwd=wdir
  # 假命中 + filemap 无收录 (ifacconf/jmlr2e 实测 tlpdb 零命中)
  # → fired-unfixed。真件 verbatim 拷贝优于 stub/generate, 居族首;
  # builtin 自门 (main 未知/目标已在/瞬态扩展名/源不在 fileset 皆
  # False) 不中零耗让位 rungen/docstrip/stub。
  - id: fileset_relocate
    mechanisms: [W19]
    description: "稿自带件位错 (在 wdir 不在 main_dir 解析位) → 逐字节拷贝归位"
    phase: loop
    order: 9 # order:9 族首 —— 真件归位优于 generated_stub/docstrip/install_file
    when:
      any:
        - { category: missing_file, payload_required: true }
        - { category: missing_graphic, payload_required: true }
    action:
      kind: builtin_transform
      function: fileset_relocate
      params: {}
    risk: low # 仅工程内既有件逐字节拷贝; 不触源码不改语义; 目标已在/源缺席即让位
    known_gap: "payload 与盘上真身大小写不符且路径不同形时 basename 兜底可能命中同族异名件 (rank1); 多 main 工程取 main_rel 一件的解析位"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "failmine4 soak-2026-09-18 4 格 (2609.17927 ifacconf.cls@Artigo/ / 2609.19170 jmlr2e.sty@sections/ / 2609.19664 fairmeta.cls@templates/arxiv/ / 2609.20640 acronyms1.tex@IEEEtran/)",
          error: "File `X' not found → install_file fired-unfixed —— 件在 wdir 根/旁枝, main 子目录 cwd 不可见",
        }
    stats: { fires: 5, rescued_cells: 3, status: active }
    source_ref: "tmp/lane-covgap/ (逐格 workdir 解剖; install-table 误诊纠正 —— tlpdb 实查零命中)"

  - id: rungen_stub
    mechanisms: [W79]
    description: "\\openout\\w=<name> 运行期生成件缺档 → wdir 空 stub 让本遍 \\input 过"
    phase: loop
    order: 9 # install_file(10) 前: \openout 自产件 filemap 必 miss
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: generated_stub
      params: { faces: [openout] }
    risk: low # 空 stub 只让本遍 \input 静默; 下遍 \write 填实 (compile_passes:2)
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "hep-th/9703214 (mechmap W79)",
          error: "File `foots.tmp' not found — \\openout 推迟到 shipout, 同遍 \\input 必 miss",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus/mechanisms.jsonl W79 verdict suggested_rules"

  # W18: xfig/inkscape 文字覆盖层 (.pstex_t/.pdf_t/.pdftex_t) 常经宏体间接
  # \input (#2.pstex_t 形) —— IfFileExists 改写要动作者宏; 空 stub 惠及
  # 全部调用点更干净 (0707.1954 实证)。与 rungen_stub 同 builtin 分面。
  - id: nonctan_input_stub
    mechanisms: [W18]
    description: "xfig/inkscape 覆盖层 (.pstex_t/.pdf_t/.pdftex_t) 缺档 → wdir 空 stub"
    phase: loop
    order: 9
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: generated_stub
      params: { faces: [overlay] }
    risk: low # 空覆盖层 = 图内文字标签缺席, 版面保留; 生成物不回写源
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0707.1954 (mechmap W18)",
          error: "File `fig.pstex_t' not found — xfig 导出的文字覆盖层, 非 CTAN 件",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus/mechanisms.jsonl W18 verdict suggested_rules"

  # W102: 包内自带 .ins/.dtx 是作者钦定版本 —— bundled 件抽取优先于
  # install_file 装 TL 同名 (版本可能不同); stem 匹配或唯一 ins 定位,
  # 跑完复核 payload 落盘; 失败 return False 同轮落 install_file 兜底。
  - id: docstrip_generate
    mechanisms: [W102, B05]
    description: "包内自带 .ins → docstrip 抽取缺件 (bundled 版本优先于 TL 同名)"
    phase: loop
    order: 9
    when: { category: missing_file, payload_required: true }
    condition: { fileset: { has_ext: [.ins] } } # 无 ins 包直接让位
    action:
      kind: builtin_transform
      function: docstrip_generate
      params: { timeout: 60 }
    risk: low # 生成件进 wdir 不改源; latex 系 driver 缺席/生成失败不吞错
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "mechmap W102 (aipproc 族 .ins/.dtx 包内自产)",
          error: "File `aipproc.cls' not found — e-print 只带 .ins/.dtx",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus/mechanisms.jsonl W102 verdict suggested_rules"

  # 2026-09-20 taxonfix lane: tikz 库缺档两臂——"I did not find the tikz
  # library 'X'" 报的是**库名**非文件名, 裸 payload 走 install_file 必
  # miss (filemap 无 quantikz 键); 按内核查找约定拼
  # tikzlibrary{lib}.code.tex (现代名, ~192 条索引) 先探, miss 时
  # pgflibrary{lib}.code.tex (~40 条 pgflibrary-only 库无 tikzlib 孪生)
  # 同签兜底。ctx_suggests 签名闸把两臂钉死在 tikz-lib 错上; 族内自门
  # 件 (fileset_relocate/stub/docstrip) 对库名 payload 天然全 decline。
  - id: tikz_library_install
    description: "tikz 库缺档 → tikzlibrary{lib}.code.tex filemap 装包"
    phase: loop
    order: 9 # install_file(10) 前截流——payload 是库名非文件名, 裸装必 miss
    when: { category: missing_file, payload_required: true }
    condition:
      ctx_suggests: "did not find the tikz library"
    action:
      kind: install_file
      params:
        file: "tikzlibrary{payload}.code.tex"
        verify: file_probe
        already_present_ok: true
    risk: low # filemap 查不到即 decline 不耗轮; 装错包面窄 (库名→TL 包一一对应)
    engines:
      xelatex:
        { mode: native, via: "tlmgr search --file → tlmgr --usermode install" }
      tectonic:
        mode: degrade
        degrade: ctan_fetch
        fallback: advisory
    provenance:
      - {
          corpus: "loop3-2308.00056 / soak-2026-09-18 2609.20331+2609.20771",
          error: "Package tikz Error: I did not find the tikz library 'quantikz'/'quantikz2' —— 旧归 other 永不进 install 面; filemap: tikzlibraryquantikz[2].code.tex → quantikz",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "taxonfix lane (census 3 cells); tlpdb 索引 192 tikzlibrary 条实证"

  - id: pgf_library_install
    description: "tikz 库缺档 → pgflibrary{lib}.code.tex filemap 装包 (tikzlib 名 miss 兜底)"
    phase: loop
    order: 9 # 紧随 tikz_library_install——pgf 名是内核第二查找路径
    when: { category: missing_file, payload_required: true }
    condition:
      ctx_suggests: "did not find the tikz library"
    action:
      kind: install_file
      params:
        file: "pgflibrary{payload}.code.tex"
        verify: file_probe
        already_present_ok: true
    risk: low # 仅 tikzlib 名 miss 后到达; filemap 双 miss → 落 install_file 常规面
    engines:
      xelatex:
        { mode: native, via: "tlmgr search --file → tlmgr --usermode install" }
      tectonic:
        mode: degrade
        degrade: ctan_fetch
        fallback: advisory
    provenance:
      - {
          corpus: "tlpdb 索引普查 2026-09-20",
          error: "~40 库仅出 pgflibraryX.code.tex 无 tikzlib 孪生 (ext.*/graphdrawing.*/timelines 族) —— 单 tikzlib 臂对这些库必 miss",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "taxonfix lane; filemap pgflibrary-only 名单实证"

  - id: install_file
    mechanisms: [W19, W47, W52, W98, W51, W21]
    description: "缺文件 (.sty/.cls/.fd/.def/…) → filemap 查包 → 安装 → 探测复核"
    phase: loop
    order: 10
    when: { category: missing_file, payload_required: true }
    action:
      kind: install_file
      params:
        file: "{payload}"
        font_related_exts: [tfm, pfb, vf, fd, map, enc] # 命中扩展名 → 装后重建 map (L307)
        verify: file_probe # 装后复核; 仍缺 → applied=False 落后续规则 (L274-275)
        already_present_ok: true # 探测已在 → 记 applied (L268-269; 见 known_gaps 归因噪音)
    engines:
      xelatex:
        { mode: native, via: "tlmgr search --file → tlmgr --usermode install" }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # filemap(tlpdb 索引)→tlnet archive→解包到工作目录/本地 texmf
        fallback: advisory # 索引查不到 → 产出建议性报错 (附候选包名)
    provenance:
      - { corpus: "1706.03762/baseline", error: "File `import.sty' not found" }
      - {
          corpus: "1810.04805/*",
          error: "File `xifthen.sty' / `ifmtarg.sty' not found",
        }
      - {
          corpus: "*/ctex|zh (14格)",
          error: "File `zhnumber.sty' not found (ctex 注入链)",
        }
    stats: { fires: 91, rescued_cells: 17 }
    source_ref: "fixloop.py L301-311, L264-276"

  # 2026-09-16 wave-2: babel_opt 类目原无消费规则 (纯死端)。机理=稿传
  # [german]/[russian] 等老语言选项 → babel 找不到对应 ldf (babel-<lang>
  # 包未装; Arch 侧 tlpdb 注册装了但 runfiles 缺席 → 系统树假在场)。
  # payload=语言名 → try_exts 拼 {lang}.ldf / {lang}b.ldf 双候选
  # (russian→russianb.ldf 实证命名) → filemap → babel-<lang> 真包。
  # 2026-09-19 babel-lane: 选项名≠实档名桥 file_aliases 落地 —— ini 按
  # \BabelDefinitionFile{0}{X} 指名实档 (locale/*/babel-*.tex 全量扫出
  # flag-0 异形名表), ukrainian→ukraineb 型 try_exts 拼不出的走显式别名。
  # greek 系 (monotonic/polytonic/polutonikogreek→greek.ldf) 不入表 ——
  # XeTeX 下 ldf 硬拒 (见 polutoniko 规则注), russian 已由 b.ldf 扩展盖。
  - id: babel_lang_ldf_install
    description: "babel 语言选项缺 ldf → filemap 装 babel-<lang> 包"
    phase: loop
    order: 11 # install_file(10) 后, legacy_pkg_shim(12) 前
    when: { category: babel_opt, payload_required: true }
    action:
      kind: install_file
      params:
        file: "{payload}"
        try_exts: [".ldf", "b.ldf"]
        # 别名候选序在 try_exts 扩展之前 (actions.py _apply_install_file);
        # 同包内诱饵档 (bahasa/indon/melayu/brazil/portuges/slovene 的
        # 直名 .ldf) 无害 —— 装包全体落盘, probe 任一候选命中即收口。
        file_aliases:
          ukrainian: [ukraineb.ldf]
          hungarian: [magyar.ldf]
          lowersorbian: [lsorbian.ldf]
          uppersorbian: [usorbian.ldf]
          slovene: [slovenian.ldf]
          ukenglish: [UKenglish.ldf]
          usenglish: [USenglish.ldf]
          friulian: [friulan.ldf]
          classiclatin: [classicallatin.ldf]
          ecclesiasticlatin: [ecclesiasticallatin.ldf]
          brazil: [brazilian.ldf]
          portuges: [portuguese.ldf]
          indon: [indonesian.ldf]
          bahasa: [indonesian.ldf]
          bahasai: [indonesian.ldf]
          melayu: [malay.ldf]
          bahasam: [malay.ldf]
          austriangerman: [german-at.ldf]
          german-austria-traditional: [german-at-1901.ldf]
          german-switzerland-traditional: [german-switzerland-1901.ldf]
          swisshighgerman: [nswissgerman.ldf]
    engines:
      xelatex:
        {
          mode: native,
          via: "filemap {lang}.ldf→babel-<lang> → usermode install",
        }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # 同 install_file 降级通路
    provenance:
      - {
          corpus: "loop2-delta babel_opt×11 (+loop1 共 33)",
          error: "Package babel Error: Unknown option 'german'",
        }
    stats: { fires: 43 }
    source_ref: "wave-2 落地: taxonomy babel_opt (:301) 首个消费规则"

  # 2026-09-17 wave-4: off-CTAN 件仓内 vendor 平移 (cbucket-scout 清点)。
  # install_file(10) 查无真包 → 本规则 basename 查 vendor/{files,stubs,shims}
  # (files=真件平移, stubs=实测救援 stub, shims=.cls 替身 stub) → 命中平铺
  # 进 wdir; 查无 → decline 落 legacy_pkg_shim(12) 内建 shim 兜底。自闸 builtin, 无需新
  # condition 原语。同名 payload 相对路径落位 (a/b.sty → wdir/a/b.sty),
  # ../绝对/NUL 闸在 builtin 内。
  - id: vendored_fetch
    mechanisms: [B05, W80]
    description: "off-CTAN 缺件 → 包内 vendor/{files,stubs,shims} basename 平移 wdir"
    phase: loop
    order: 11.5 # install_file(10) 后: CTAN 真包优先; legacy_pkg_shim(12) 前: vendor 件优先于内建 shim
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: vendored_fetch
      params: {} # dir 缺省 = 包内 vendor/; 测试用 params.dir 指 fixture
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "cbucket-vendored-inventory (files 8 真件 + stubs 15)",
          error: "File `aastex.cls' not found (CTAN 下架/改名件)",
        }
    stats: { fires: 76, status: proposed }
    source_ref: "wave-4 落地: bench/results/cbucket-vendored-inventory/ dispositions"

  # 2026-09-18 nicematrix-lane: 装上件自检版本闸炸 (expl3 msg_critical
  # file-line 形) —— tlmgr/tlnet 只有最新版, 对运行期 format/L3 过新
  # (2308.12712: _texmf/home/.../nicematrix v7.11c 要 format ≥2026-06-01,
  #  runtime LaTeX2e 2025-11-01; xelatex tlmgr 通路无 version_guard)。
  # wdir 平铺 vendor 兼容钉版 → kpathsea cwd 序遮蔽 texmfhome 过新件,
  # 下轮自检过闸正常载入。稿自带过新版: _inject_write 指纹闸拒覆外来
  # 件 → 自动 decline; vendor 查无该件同样 decline → unfixable 归因清晰。
  - id: pkg_version_skew_vendored
    mechanisms: [B05]
    description: "版本自检炸 (release too old) → vendor 兼容版平铺遮蔽过新安装件"
    phase: loop
    order: 11.7 # vendored_fetch(11.5)/greek_fontenc_install(11.6) 后, babel_opt(13) 前
    when: { category: pkg_version_skew, payload_required: true }
    action:
      kind: builtin_transform
      function: vendored_fetch
      params: {} # dir 缺省 = 包内 vendor/; nicematrix 钉 v7.11a (floor format 2025-06-01)
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "e2ereal 2308.12712 (+ corpus nicematrix 用稿同族)",
          error: "nicematrix.sty:39: Critical Package nicematrix Error: Your LaTeX release is too old",
        }
    stats: { fires: 8, status: proposed }
    source_ref: "nicematrix-lane 2026-09-18: vendor/files/nicematrix.sty v7.11c→v7.11a 钉档"

  # 2026-09-19 csvsub-lane: 反向版本错位 —— 稿自带过旧 csvsimple-l3.sty
  # v2.2.0 (2021) 撞新 kernel expl3 收紧: `\bool_const:Nn { 1 }` 裸数字
  # 字面量不再被收 (2112.00045: csvsimple-l3.sty:36 Missing number,
  # treated as zero → Missing \begin{document} 级联)。两个既有机制都
  # 够不到: `_provides_date` 只认 `\ProvidesX{n}[date]` bracket 面,
  # `\ProvidesExplPackage{n}{d}{v}` brace 面读不出 → vendored_shadow_
  # isolate 的 ld<sd 确证闸拿不到日期; `_inject_write` 指纹闸拒覆外来
  # 件 → vendored_fetch 也不能原位替换。故走退役通路: err_head 点名
  # csvsimple-l3.sty (file-line 形) 或泄 `\c__csvsim_package_expl_bool`
  # ('!' 形 l.N 源码回显) ∧ wdir 在场 → mv .fixloop-iso; 下轮 kpsewhich
  # 落系统 2.7.0, 系统缺件则 missing_file → vendored_fetch(11.5) 递
  # vendor/files 钉版 (2.7.0, 本机逐字节同 texmf-dist 实证可编译)。
  - id: csvsimple_l3_kernel_retire
    mechanisms: [B05]
    description: "稿自带过旧 csvsimple-l3.sty kernel 不兼容 → mv .fixloop-iso 退役, 系统/vendor 新件递补"
    phase: loop
