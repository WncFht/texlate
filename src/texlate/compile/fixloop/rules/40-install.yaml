# rules/40-install.yaml — fixloop 规则库分片：缺档装包 —— missing_file/missing_tfm → install/fetch + babel 选项
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # ─── loop: install 系 —— 环境缺失优先于源码改写 ───
  # W79/W18/W102 孤儿裁决 (mechmap-2026-09-17): filemap 索引外的自产件。
  # 三条 order:9 窄谓词先于 install_file(10) 截流 —— 运行期生成件/包内
  # docstrip 件 install 必 miss 白烧轮次; 谓词不中 return False 不耗轮。
  - id: rungen_stub
    mechanisms: [W79]
    description: "\\openout\\w=<name> 运行期生成件缺档 → wdir 空 stub 让本遍 \\input 过"
    phase: loop
    order: 9 # install_file(10) 前: \openout 自产件 filemap 必 miss
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: generated_stub
      params: { faces: [openout] }
    risk: low # 空 stub 只让本遍 \input 静默; 下遍 \write 填实 (compile_passes:2)
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "hep-th/9703214 (mechmap W79)",
          error: "File `foots.tmp' not found — \\openout 推迟到 shipout, 同遍 \\input 必 miss",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W79 verdict suggested_rules"

  # W18: xfig/inkscape 文字覆盖层 (.pstex_t/.pdf_t/.pdftex_t) 常经宏体间接
  # \input (#2.pstex_t 形) —— IfFileExists 改写要动作者宏; 空 stub 惠及
  # 全部调用点更干净 (0707.1954 实证)。与 rungen_stub 同 builtin 分面。
  - id: nonctan_input_stub
    mechanisms: [W18]
    description: "xfig/inkscape 覆盖层 (.pstex_t/.pdf_t/.pdftex_t) 缺档 → wdir 空 stub"
    phase: loop
    order: 9
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: generated_stub
      params: { faces: [overlay] }
    risk: low # 空覆盖层 = 图内文字标签缺席, 版面保留; 生成物不回写源
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "0707.1954 (mechmap W18)",
          error: "File `fig.pstex_t' not found — xfig 导出的文字覆盖层, 非 CTAN 件",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W18 verdict suggested_rules"

  # W102: 包内自带 .ins/.dtx 是作者钦定版本 —— bundled 件抽取优先于
  # install_file 装 TL 同名 (版本可能不同); stem 匹配或唯一 ins 定位,
  # 跑完复核 payload 落盘; 失败 return False 同轮落 install_file 兜底。
  - id: docstrip_generate
    mechanisms: [W102, B05]
    description: "包内自带 .ins → docstrip 抽取缺件 (bundled 版本优先于 TL 同名)"
    phase: loop
    order: 9
    when: { category: missing_file, payload_required: true }
    condition: { fileset: { has_ext: [.ins] } } # 无 ins 包直接让位
    action:
      kind: builtin_transform
      function: docstrip_generate
      params: { timeout: 60 }
    risk: low # 生成件进 wdir 不改源; latex 系 driver 缺席/生成失败不吞错
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "mechmap W102 (aipproc 族 .ins/.dtx 包内自产)",
          error: "File `aipproc.cls' not found — e-print 只带 .ins/.dtx",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W102 verdict suggested_rules"

  - id: install_file
    mechanisms: [W19, W47, W52, W98, W51, W21]
    description: "缺文件 (.sty/.cls/.fd/.def/…) → filemap 查包 → 安装 → 探测复核"
    phase: loop
    order: 10
    when: { category: missing_file, payload_required: true }
    action:
      kind: install_file
      params:
        file: "{payload}"
        font_related_exts: [tfm, pfb, vf, fd, map, enc] # 命中扩展名 → 装后重建 map (L307)
        verify: file_probe # 装后复核; 仍缺 → applied=False 落后续规则 (L274-275)
        already_present_ok: true # 探测已在 → 记 applied (L268-269; 见 known_gaps 归因噪音)
    engines:
      xelatex:
        { mode: native, via: "tlmgr search --file → tlmgr --usermode install" }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # filemap(tlpdb 索引)→tlnet archive→解包到工作目录/本地 texmf
        fallback: advisory # 索引查不到 → 产出建议性报错 (附候选包名)
    provenance:
      - { corpus: "1706.03762/baseline", error: "File `import.sty' not found" }
      - {
          corpus: "1810.04805/*",
          error: "File `xifthen.sty' / `ifmtarg.sty' not found",
        }
      - {
          corpus: "*/ctex|zh (14格)",
          error: "File `zhnumber.sty' not found (ctex 注入链)",
        }
    stats: { fires: 26, rescued_cells: 17 }
    source_ref: "fixloop.py L301-311, L264-276"

  # 2026-09-16 wave-2: babel_opt 类目原无消费规则 (纯死端)。机理=稿传
  # [german]/[russian] 等老语言选项 → babel 找不到对应 ldf (babel-<lang>
  # 包未装; Arch 侧 tlpdb 注册装了但 runfiles 缺席 → 系统树假在场)。
  # payload=语言名 → try_exts 拼 {lang}.ldf / {lang}b.ldf 双候选
  # (russian→russianb.ldf 实证命名) → filemap → babel-<lang> 真包。
  # 2026-09-19 babel-lane: 选项名≠实档名桥 file_aliases 落地 —— ini 按
  # \BabelDefinitionFile{0}{X} 指名实档 (locale/*/babel-*.tex 全量扫出
  # flag-0 异形名表), ukrainian→ukraineb 型 try_exts 拼不出的走显式别名。
  # greek 系 (monotonic/polytonic/polutonikogreek→greek.ldf) 不入表 ——
  # XeTeX 下 ldf 硬拒 (见 polutoniko 规则注), russian 已由 b.ldf 扩展盖。
  - id: babel_lang_ldf_install
    description: "babel 语言选项缺 ldf → filemap 装 babel-<lang> 包"
    phase: loop
    order: 11 # install_file(10) 后, legacy_pkg_shim(12) 前
    when: { category: babel_opt, payload_required: true }
    action:
      kind: install_file
      params:
        file: "{payload}"
        try_exts: [".ldf", "b.ldf"]
        # 别名候选序在 try_exts 扩展之前 (actions.py _apply_install_file);
        # 同包内诱饵档 (bahasa/indon/melayu/brazil/portuges/slovene 的
        # 直名 .ldf) 无害 —— 装包全体落盘, probe 任一候选命中即收口。
        file_aliases:
          ukrainian: [ukraineb.ldf]
          hungarian: [magyar.ldf]
          lowersorbian: [lsorbian.ldf]
          uppersorbian: [usorbian.ldf]
          slovene: [slovenian.ldf]
          ukenglish: [UKenglish.ldf]
          usenglish: [USenglish.ldf]
          friulian: [friulan.ldf]
          classiclatin: [classicallatin.ldf]
          ecclesiasticlatin: [ecclesiasticallatin.ldf]
          brazil: [brazilian.ldf]
          portuges: [portuguese.ldf]
          indon: [indonesian.ldf]
          bahasa: [indonesian.ldf]
          bahasai: [indonesian.ldf]
          melayu: [malay.ldf]
          bahasam: [malay.ldf]
          austriangerman: [german-at.ldf]
          german-austria-traditional: [german-at-1901.ldf]
          german-switzerland-traditional: [german-switzerland-1901.ldf]
          swisshighgerman: [nswissgerman.ldf]
    engines:
      xelatex:
        {
          mode: native,
          via: "filemap {lang}.ldf→babel-<lang> → usermode install",
        }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # 同 install_file 降级通路
    provenance:
      - {
          corpus: "loop2-delta babel_opt×11 (+loop1 共 33)",
          error: "Package babel Error: Unknown option 'german'",
        }
    stats: { fires: 0 }
    source_ref: "wave-2 落地: taxonomy babel_opt (:301) 首个消费规则"

  # 2026-09-17 wave-4: off-CTAN 件仓内 vendor 平移 (cbucket-scout 清点)。
  # install_file(10) 查无真包 → 本规则 basename 查 vendor/{files,stubs}
  # (files=真件平移, stubs=实测救援 stub) → 命中平铺进 wdir; 查无 →
  # decline 落 legacy_pkg_shim(12) 内建 shim 兜底。自闸 builtin, 无需新
  # condition 原语。同名 payload 相对路径落位 (a/b.sty → wdir/a/b.sty),
  # ../绝对/NUL 闸在 builtin 内。
  - id: vendored_fetch
    mechanisms: [B05, W80]
    description: "off-CTAN 缺件 → 包内 vendor/{files,stubs} basename 平移 wdir"
    phase: loop
    order: 11.5 # install_file(10) 后: CTAN 真包优先; legacy_pkg_shim(12) 前: vendor 件优先于内建 shim
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: vendored_fetch
      params: {} # dir 缺省 = 包内 vendor/; 测试用 params.dir 指 fixture
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "cbucket-vendored-inventory (files 8 真件 + stubs 15)",
          error: "File `aastex.cls' not found (CTAN 下架/改名件)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "wave-4 落地: bench/results/cbucket-vendored-inventory/ dispositions"

  # 2026-09-18 nicematrix-lane: 装上件自检版本闸炸 (expl3 msg_critical
  # file-line 形) —— tlmgr/tlnet 只有最新版, 对运行期 format/L3 过新
  # (2308.12712: _texmf/home/.../nicematrix v7.11c 要 format ≥2026-06-01,
  #  runtime LaTeX2e 2025-11-01; xelatex tlmgr 通路无 version_guard)。
  # wdir 平铺 vendor 兼容钉版 → kpathsea cwd 序遮蔽 texmfhome 过新件,
  # 下轮自检过闸正常载入。稿自带过新版: _inject_write 指纹闸拒覆外来
  # 件 → 自动 decline; vendor 查无该件同样 decline → unfixable 归因清晰。
  - id: pkg_version_skew_vendored
    mechanisms: [B05]
    description: "版本自检炸 (release too old) → vendor 兼容版平铺遮蔽过新安装件"
    phase: loop
    order: 11.7 # vendored_fetch(11.5)/greek_fontenc_install(11.6) 后, babel_opt(13) 前
    when: { category: pkg_version_skew, payload_required: true }
    action:
      kind: builtin_transform
      function: vendored_fetch
      params: {} # dir 缺省 = 包内 vendor/; nicematrix 钉 v7.11a (floor format 2025-06-01)
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "e2ereal 2308.12712 (+ corpus_v3 nicematrix 用稿同族)",
          error: "nicematrix.sty:39: Critical Package nicematrix Error: Your LaTeX release is too old",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "nicematrix-lane 2026-09-18: vendor/files/nicematrix.sty v7.11c→v7.11a 钉档"

  # 2026-09-19 csvsub-lane: 反向版本错位 —— 稿自带过旧 csvsimple-l3.sty
  # v2.2.0 (2021) 撞新 kernel expl3 收紧: `\bool_const:Nn { 1 }` 裸数字
  # 字面量不再被收 (2112.00045: csvsimple-l3.sty:36 Missing number,
  # treated as zero → Missing \begin{document} 级联)。两个既有机制都
  # 够不到: `_provides_date` 只认 `\ProvidesX{n}[date]` bracket 面,
  # `\ProvidesExplPackage{n}{d}{v}` brace 面读不出 → vendored_shadow_
  # isolate 的 ld<sd 确证闸拿不到日期; `_inject_write` 指纹闸拒覆外来
  # 件 → vendored_fetch 也不能原位替换。故走退役通路: err_head 点名
  # csvsimple-l3.sty (file-line 形) 或泄 `\c__csvsim_package_expl_bool`
  # ('!' 形 l.N 源码回显) ∧ wdir 在场 → mv .fixloop-iso; 下轮 kpsewhich
  # 落系统 2.7.0, 系统缺件则 missing_file → vendored_fetch(11.5) 递
  # vendor/files 钉版 (2.7.0, 本机逐字节同 texmf-dist 实证可编译)。
  - id: csvsimple_l3_kernel_retire
    mechanisms: [B05]
    description: "稿自带过旧 csvsimple-l3.sty kernel 不兼容 → mv .fixloop-iso 退役, 系统/vendor 新件递补"
    phase: loop
    order: 11.8 # pkg_version_skew_vendored(11.7) 后, legacy_pkg_shim(12) 前
    when:
      any: # 本格签名是 syntax; 他版旧件别种炸法 (undefined_cs 等) 同闸收
        - { category: syntax }
        - { category: undefined_cs }
        - { category: other }
    condition:
      ctx_suggests: "csvsimple-l3\\.sty|csvsim_package_expl"
      cache_dir_glob: csvsimple-l3.sty
    action:
      kind: run_tool
      params:
        argv: ["mv", "csvsimple-l3.sty", "csvsimple-l3.sty.fixloop-iso"]
        timeout: 30
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus_v3 2112.00045 (stagerun-loop2 best_effort_pdf 残格)",
          error: "csvsimple-l3.sty:36: Missing number, treated as zero (v2.2.0 \\bool_const:Nn{1} vs expl3 收紧)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "csvsub-lane 2026-09-19: tmp/lane-csvsub 三臂实证 (orig 炸 / patch 过 / 2.7.0 过)"

  # 2026-09-19 pstadd-lane: 稿自带 pstricks-add 过旧对 (v2.32/2005-01-16)
  # 撞现代 pst-* 核 —— dx/dy 键自 pst-node v1.45 移除 (:51-52 xkeyval
  # `dx' undefined in families), \define@key[psset]{}{trueAngle} 空族 vs
  # pst-xkey v1.6 × xkeyval v2.10 的 \define@boolkey (:1170 → Missing
  # \begin{document} 级联), \psset@@tickstyle/\psk@tickstyle 自现代核
  # 消失 (:1544 Undefined×4 + Missing number×2)。pst-all.sty
  # \RequirePackage{pstricks-add} 走 kpathsea cwd 序中稿自带对;
  # find_vendored_shadows 要系统 probe 证 ld<sd —— 本机 texlive 无
  # pstricks-add → sd=None 盲区 (csvsimple 同型)。err_head 点名
  # pstricks-add.tex:N (file-line 形) 或泄 \psset@@tickstyle/\psk@tickstyle
  # 签名 cs ('!' 形展开栈回显) ∧ wdir 在场 → sh 循环 mv 成对 .fixloop-iso;
  # 指纹件 (本引擎注入的 v3.94) 跳过不自拆 —— 否则 :742 \colorlet 错会把
  # vendor 件退役→missing_file→重投→死循环。下轮 missing_file →
  # vendored_fetch(11.5) 递 vendor/files v3.94 对; \colorlet 需 xcolor
  # 前置已由 pstcol_pstricks_rewrite (70-pkgopt.yaml:359, order 185) 兜住。
  - id: pstricks_add_pair_retire
    mechanisms: [B05]
    description: "稿自带过旧 pstricks-add.tex/.sty 对遮蔽 → mv 双双 .fixloop-iso 退役, 系统/vendor v3.94 递补"
    phase: loop
    order: 11.9 # csvsimple_l3_kernel_retire(11.8) 后, legacy_pkg_shim(12) 前
    when:
      any: # 签名散三格: xkeyval→other / Undefined cs→undefined_cs / Missing→syntax
        - { category: syntax }
        - { category: undefined_cs }
        - { category: other }
    condition:
      ctx_suggests: "pstricks-add\\.tex:\\d+|\\\\psset@@tickstyle|\\\\psk@tickstyle"
      cache_dir_glob: pstricks-add.tex
      tool_available: sh
    action:
      kind: run_tool
      params:
        argv:
          - sh
          - -c
          - 'for f in pstricks-add.tex pstricks-add.sty; do if [ -f "$f" ] && ! grep -q ''texlate-fixloop-injected'' "$f"; then mv -f "$f" "$f.fixloop-iso"; fi; done; exit 0'
        timeout: 30
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus_v3 0707.4206 (stagerun flipcheck3 best_effort 残格, 12 错同根)",
          error: "pstricks-add.tex:1544: Undefined control sequence \\psset@@tickstyle (v2.32/2005 vs pst-node v1.45)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "pstadd-lane 2026-09-19: tmp/lane-multistrand/report.md + flipcheck3 work/0707.4206 实读"

  # fixable-data 裁定 (1003.2165): polutonikogreek 是弃名, greek.polutoniko
  # 亦走 locale/invalid/ 弃名桩必炸。现行 ini 正形是 `greek.polytonic`
  # (locale/el/babel-polytonicgreek.tex 自证 "Provided: greek.polytonic";
  # 裸 `polytonicgreek` 选项反而炸 —— \languageattribute{greek} 要求 greek
  # 语言本体已载)。装 babel-greek 的 greek.ldf 更糟: XeTeX 下 ldf 硬拒。
  # 只改选项位 (方括号列表 + PassOptionsToPackage/Class 首参)。
  - id: babel_opt_polutoniko_rewrite
    description: "babel 弃名 polutonikogreek / greek.polutoniko → greek.polytonic (ini 机制)"
    phase: loop
    order: 13 # babel_lang_ldf_install(11) 之后: 装得上真 ldf 的先装, 此条兜无档语言
    when: { category: babel_opt, payload_required: false }
    condition:
      any:
        - { source_contains: "polutonikogreek" }
        - { source_contains: "greek\\.polutoniko" }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # 选项括号可跨行 (1003.2165 docclass 选项表逐行注释排版实证)
          - {
              pattern: "\\[([^\\]]*)\\bgreek\\.polutoniko\\b",
              repl: "[\\g<1>greek.polytonic",
            }
          - {
              pattern: "\\[([^\\]]*)\\bpolutonikogreek\\b",
              repl: "[\\g<1>greek.polytonic",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*)\\bgreek\\.polutoniko\\b",
              repl: "\\g<1>greek.polytonic",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*)\\bpolutonikogreek\\b",
              repl: "\\g<1>greek.polytonic",
            }
    risk: low # 同语言现行属性形; ini 路由 XeTeX 原生支持
    known_gap: "\\selectlanguage{polutonikogreek} 等正文引用不改 (选项修正后 greek 语言在位, 旧名引用 babel 兼容层接住); 需 babel ≥3.x ini 机制"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "fixable-data adjudication (1003.2165)",
          error: "Package babel Error: Unknown option 'polutonikogreek' (src 写 greek.polutoniko, ini 弃名桩报错)",
        }
    stats: { fires: 0 }
    source_ref: "scout-fail59 fixloop 杂项; babel_lang_ldf_install 残留格"

  # 2026-09-19 babel-lane (1206.0213): francais/frenchb 是 babel-french
  # 弃名 —— 现行 ini/ldf 双侧皆无名 (babel-francais.tex/francais.ldf/
  # frenchb.ldf 皆不在 TL, tlpdb 逐名核实), install 路必 decline; 正名
  # french 才是真档 (ini babel-french.tex → \BabelDefinitionFile{0}{french}
  # → french.ldf, filemap 钉在位, babel_lang_ldf_install 装好收口)。
  # 改名要盖全语言名位: 选项括号 + PassOptions 首参 + 正文 \selectlanguage
  # /\foreignlanguage/\iflanguage + otherlanguage/hyphenrules 环境参 ——
  # 漏正文引用会留 'francais' 未声明残错 (babel_undef 注入路会把弃名
  # 再灌回选项表 → 死循环尾巴, 故同一条规则一次改净)。
  - id: babel_opt_francais_rewrite
    description: "babel 弃名 francais/frenchb → french (选项表 + 正文语言引用全位改写)"
    phase: loop
    order: 13.5 # install(11)/polutoniko(13) 后: install decline 同轮即补
    when: { category: babel_opt, payload_required: false }
    condition: { source_contains: "\\bfrancais\\b|\\bfrenchb\\b" }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # 选项括号位 (docclass/usepackage/RequirePackage/LoadClass 系锚定)
          - {
              pattern: "(\\\\(?:documentclass|usepackage|RequirePackage|LoadClass|LoadClassWithOptions|RequirePackageWithOptions)\\s*\\[[^\\]]*)\\b(?:francais|frenchb)\\b",
              repl: "\\g<1>french",
            }
          # \PassOptionsTo{Package,Class}{..} 首参
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*)\\b(?:francais|frenchb)\\b",
              repl: "\\g<1>french",
            }
          # 正文语言选择命令直参
          - {
              pattern: "(\\\\(?:selectlanguage|foreignlanguage|iflanguage)\\s*\\{)\\s*(?:francais|frenchb)\\s*(\\})",
              repl: "\\g<1>french\\g<2>",
            }
          # otherlanguage/otherlanguage*/hyphenrules 环境参
          - {
              pattern: "(\\\\begin\\{(?:otherlanguage\\*?|hyphenrules)\\}\\s*\\{)\\s*(?:francais|frenchb)\\s*(\\})",
              repl: "\\g<1>french\\g<2>",
            }
    risk: low # francais 在现代 babel 双侧皆无名, 改写无歧义; french 正形
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus_v3 1206.0213 ([english,francais] + \\selectlanguage{francais}:123)",
          error: "Package babel Error: Unknown option 'francais'",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-babel/ 2026-09-19: babel-francais.tex/francais.ldf 皆 NOT-IN-TL (tlpdb 核实)"

  # 2026-09-19 babel-lane: babel_undef (语言本体未声明) 消费规则 —— 稿面
  # \selectlanguage/\iflanguage 引用选项表外语言, 或 ldf 自带 AtBeginDocument
  # 钩引姊妹名 (babel-german.def:739 \iflanguage{ngerman} —— Arch xelatex
  # 格式零非英 \l@* → [german] 装好 ldf 后仍炸此签)。修法=把 payload 语言
  # 名补进 babel 选项表头: babel 主语言=选项表末项, 头插永不夺主位; 语言
  # 本体经 ini/ldf 路由自解析, 缺档下轮回 babel_opt → install 链接手。
  # 自限: 每 payload 只火一次 (applied 键去重), 伪名注入变 Unknown option
  # 后 install decline → unfixable 归因不变 (稿本来就炸)。
  - id: babel_undeclared_option
    description: "babel 'language X undefined' → 选项表头补 X (非主语言位; ldf 缺链 install 接)"
    phase: loop
    order: 14 # 改写系末位; babel_undef 独占类目无竞序
    when: { category: babel_undef, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # \usepackage/\RequirePackage 带表 → 表头插 (lookahead 锚 ]{..babel..})
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*\\[)(?=[^\\]]*\\]\\s*\\{[^}]*\\bbabel\\b[^}]*\\})",
              repl: "\\g<1>{payload},",
            }
          # \usepackage{babel}/\{..babel..\} 无表 → 新生选项表
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage))(\\s*\\{[^}]*\\bbabel\\b[^}]*\\})",
              repl: "\\g<1>[{payload}]\\g<2>",
            }
          # docclass/LoadClass 全局选项表 → 选项流及 babel (cls 内载也盖)
          - {
              pattern: "(\\\\(?:documentclass|LoadClass|LoadClassWithOptions)\\s*\\[)",
              repl: "\\g<1>{payload},",
            }
          - {
              pattern: "(\\\\documentclass)(\\s*\\{)",
              repl: "\\g<1>[{payload}]\\g<2>",
            }
          # \PassOptionsTo{Package,Class}{..}{babel} 首参表头
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)(?=[^}]*\\}\\s*\\{babel\\})",
              repl: "\\g<1>{payload},",
            }
    risk: low # 头插不夺主位; 伪名注入下一轮即被 install decline 截回
    known_gap: "语言名若仅经 \\babelprovide/ini-only 声明且永不进选项表 (罕见) 不盖; 注入 docclass 全局项可能带 'Unused global option' info"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "corpus_v3 0707.1325/1003.2165 ([german] ldf 装好后炸 \\iflanguage{ngerman} 钩)",
          error: "Package babel Error: You haven't defined the language 'ngerman' yet",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-babel/ 2026-09-19: babel.sty \\@nolanerr :942 + babel-german.def:739-740 实证"

  - id: install_tfm
    mechanisms: [W95]
    description: "Font X not loadable (TFM 缺) → 装 {X}.tfm 所在包 + 重建 map"
    phase: loop
    order: 20
    when: { category: missing_tfm, payload_required: true }
    action:
      kind: install_file
      params: { file: "{payload}.tfm", font_related: true, verify: file_probe }
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # tfm 文件可落工作目录直接可用
        fallback: advisory
        note: "updmap 不存在: TFM 直读不需要 map; 若后端还要 pfb map → escalate"
    provenance:
      - {
          corpus: "1511.06432/1512.03385/1810.04805/2106.09685 baseline",
          error: "Font phvb at Npt not loadable → helvetic",
        }
      - { corpus: "1906.08237/*", error: "rsfs10 → rsfs" }
    stats: { fires: 13, rescued_cells: 13 }
    source_ref: "fixloop.py L314-321"

  # 2026-09-18 C3 (stats 驱动, loop1 (id,arm) dedup 面): babel-greek 走 ldf
  # 路时 XeTeX 下 ldf 还要 greek-fontenc 的 tuenc-greek.def —— greek.ldf:118
  # \@ifl@aded{def}{tuenc-greek} 落空即 \bbl@error+\@@end 硬死 (ldf 注释
  # 明写 "Install the greek-fontenc package or use polyglossia")。实态:
  # babel_lang_ldf_install(11) 装好 greek.ldf 而 def 缺 → 次轮 syntax
  # (err ctx 含 greek.ldf 路径); babel_opt:'greek' 轮报错文本本身亦含
  # "language definition file greek.ldf" —— 两类 err_head 同闸。
  # filemap: tuenc-greek.def→greek-fontenc (lgrenc.def 同包, 8-bit 引擎并落)。
  ## REVIEW(c3): 触发面仅限 err ctx 提到 greek.ldf/'greek' 选项的格;
  ## 对非 babel-greek 语境的 greek 提及不误伤 (pattern 含 .ldf/引号形)。
  - id: greek_fontenc_install
    description: "babel greek ldf 路缺 greek-fontenc → xelatex 下 ldf \\@@end 硬死 → 装 tuenc-greek.def"
    phase: loop
    order: 11.6 # babel_lang_ldf_install(11)/vendored_fetch(11.5) 后; def 先装无害
    when:
      any:
        - { category: babel_opt, payload_required: false }
        - { category: syntax, payload_required: false }
        - { category: other, payload_required: false }
    condition:
      ctx_suggests: "greek\\.ldf|'greek'|'polutonikogreek'"
    action:
      kind: install_file
      params: { file: tuenc-greek.def }
    engines:
      xelatex:
        {
          mode: native,
          via: "filemap tuenc-greek.def→greek-fontenc → usermode install",
        }
      tectonic:
        mode: same
    provenance:
      - {
          corpus: "loop1-dedup 1306.0504 (greek.polytonic→greek.ldf→tuenc-greek.def 缺)",
          error: "greek.ldf:130 Missing \\endcsname inserted → \\@@end",
        }
      - {
          corpus: "loop1-dedup 2105.00102 ([english,greek] babel)",
          error: "greek.ldf:130 Missing \\endcsname inserted",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-c3-fixloop/ — C3 stats 驱动; greek.ldf:113-131 引擎分支实读"
