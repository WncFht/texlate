  # 递补闸: revtex4-2.cls probe/vendor 双空 → 拒动 (delegate 死路)。
  - id: revtex_era_retire
    mechanisms: [B05]
    description: "revtex4.cls v4.0a 内嵌 textcase \\@uclcnotmath 撞现代 kernel → 工程件退役+delegate, texmf 遮蔽根 delegate"
    phase: loop
