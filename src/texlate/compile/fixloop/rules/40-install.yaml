  # 2026-09-19 revtexlane (census 3 格同机: 0806.4149/1003.0910/1907.00131):
  # e-print/user-texmf 自带 revtex4.cls v4.0a (2020/09/30) 内嵌 textcase
  # v0.06 —— \MakeUppercase 绑死 \MakeTextUppercase→\@uclcnotmath
  # (revtex4.cls:3737-3750), 内嵌 \protected@edef\reserved@a 现代 kernel
  # 炸 "Illegal parameter number in definition of \reserved@a" (\Citeauthor
  # →natbib \NAT@UP, 0806.4149 实测) / "Use of \@citex doesn't match"
  # (thebibliography mark 机, 1003.0910/1907.00131 实测)。dispatch 缺口:
  # revtex4_legacy_class_rewrite(75:182) 只见 .tex \documentclass——够不到
  # emulateapj.cls \LoadClass{revtex4} 径与 cat=other/early_eof 签名;
  # legacy_pkg_shim(12) shim_map 有 revtex4.cls 但 install_file(10) 先中
  # (TL revtex4 包名在场)。指纹双锚: \ProvidesClass{revtex4} 本名精确
  # (4-1/4-2/4b4 分署别名) ∧ \@uclcnotmath 内嵌机 (现代 textcase 同名机走
  # expl3 分支不在此件)。builtin 双臂 (mnras-retire 裁定形):
  # (a) 工程内 .cls mv .fixloop-iso + 同 stem delegate →revtex4-2
  #     (本名件同写——系统无 revtex4 名递补, 缺 delegate 即 missing_file);
  # (b) ~/texmf TEXMFHOME 链尾树外遮蔽——只读指纹探测, cwd 根 delegate
