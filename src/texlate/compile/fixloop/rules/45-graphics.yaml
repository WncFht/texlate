# rules/45-graphics.yaml — fixloop 规则库分片：图形 —— ps_image/missing_graphic 的 eps 链与图档修复
#
# 分片约定：本文件只是 rules: 列表的一段，按文件名序与其他分片经
# _yamlish.load_yaml 目录合并装载；同 phase 调度按 order 字段升序（与文件
# 拼接序无关）。schema/语义约定（phase/when/condition/engines/stats 字段、
# provenance 义务、书写约束 flow 集合单行写完）见 rules/30-route.yaml 头注。
# 新增规则：挑所属域文件追加条目即可；条目数不手维护 —— 统计用
# `grep -c '^  - id: ' src/texlate/compile/fixloop/rules/*.yaml`。
version: 1

rules:
  # W31 孤儿裁决 (mechmap-2026-09-17): svg 包 = inkscape + shell-escape
  # 外部链; tectonic 侧由 svg_route (30-route precheck) 先拒走 xelatex。
  # 本规则两臂自适应: inkscape 在 ∧ flag 未被引擎 seam 拒放 →
  # engine_flags 请 -shell-escape (svg 包自带 shell-out 链接管余下);
  # inkscape 缺席或 flag 落 flags_dropped → 全量 *.svg→*.pdf 预转换 +
  # 活 \includesvg → \includegraphics 改写 (opts 过 graphicx 白名单)。
  - id: svg_prepare
    mechanisms: [W31, B05]
    description: "svg 包文档缺件/包级报错 → inkscape 在请 -shell-escape; 缺席预转换 svg→pdf 并改写 \\includesvg"
    phase: loop
    order: 9 # install_file(10) 前: *_svg-tex.pdf 是包自产中间件, filemap 必 miss
    when:
      any:
        - { category: missing_file, payload_required: true }
        - { category: other } # svg 包 PackageError 归 other (taxonomy 无专属类目)
    condition: {
        # raw 粗筛 (注释行命中无害 —— builtin 内遮盖视图复核是权威)
        source_contains: "(\\\\usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\bsvg\\b|\\\\includesvg\\b",
      }
    action:
      kind: builtin_transform
      function: svg_prepare
      params: {}
    risk: low # flag 经引擎 seam 拒放自管; 转换产物进 wdir, 改写限存活引用点
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 正常已被 svg_route 拒走; 走到此处同法可救
    provenance:
      - {
          corpus: "mechmap W31 (svg 包 inkscape/shell-escape 链)",
          error: "Package svg Error / File `*_svg-tex.pdf' not found",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W31 verdict suggested_rules"

  # 1404.5720 实证: \includegraphics{feedforward.eps} 缺件但同 stem .pdf 在盘
  # (arXiv 源常图文不配套)。签名归 missing_file 非 missing_graphic —— 图链
  # (17/18) 够不着; install(10)/shim(12) 对工程数据件必拒。本规则剥引用扩展名
  # → graphicx \Gin@extensions 自选 (.pdf 先中)。sibling 缺席时 fileset 闸
  # 不点火落后续; 真无图可解次轮以无 ext 名再报缺, ctx_suggests 闸防回环。
  - id: graphic_ext_relax
    mechanisms: [W21]
    description: "missing_file 的 .eps/.ps 图引用剥扩展名 → graphicx 自选同 stem sibling"
    phase: loop
    order: 14 # legacy_pkg_shim(12)/babel_opt(13) 后, eps_to_pdf(15) 前
    when: { category: missing_file, payload_required: true }
    condition:
      ctx_suggests: "\\.(eps|ps|epsi|epsf)' not found"
      # gfxrelax #229 (firedunfixed): has_ext global-any 时代工程里随便一
      # 张 .pdf 就放行 —— 真缺件 (tar 未随图) 也剥名白烧一轮才轮到 17.6
      # 占位臂。sibling_exts 把闸收进 payload stem 域: 剥扩展名后的
      # basename 在工程内存图形族交替件才点火。same-basename-anywhere
      # 语义 (kpathsea TEXINPUTS 近似, 宁宽勿严) —— false-accept 亏一轮,
      # false-abstain 会把盘上真图换成占位框。
      fileset: { sibling_exts: [.pdf, .png, .jpg, .jpeg, .eps, .epsf, .epsi, .ps, .mps] }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty]
        rewrites:
          # lookahead 锚定 payload (允许路径前缀, 须 \}-终止防词干误吃);
          # \g<2> 保住 stem (含路径) 只剥扩展名; masked 面 —— 注释内
          # \includegraphics 引用不算存活引用位、不改写不计命中
          - {
              pattern: "(\\\\includegraphics\\s*\\*?\\s*(?:\\[[^\\]]*\\])?\\s*\\{)(?=(?:[^{}/]*/)*{payload}\\})([^{}]*?)\\.(?:eps|ps|epsi|epsf)\\}",
              repl: '\g<1>\g<2>}',
              match_surface: masked,
            }
    risk: low # 改写仅限 payload 精确引用; 无 sibling 时 fileset 闸拦住
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    source_ref: "wave-4 规则批; c6f1511 落地, lookahead 锚定防词干误吃"
    provenance:
      - {
          corpus: "1404.5720 (realpostfix2 shim residuals, task#23)",
          error: "5× File `X.eps' not found 且 X.pdf 同目录在盘",
        }
    stats: { fires: 8, status: proposed }

  # 新增 (fixloop-v2 整改): log 确证的 PS 硬墙 → 先救后拒。
  # 实证: tectonic 对 .eps 工程分两类 —— 能出 pdf~ 的 (eps 引用未真正进
  # xdvipdfmx 路径) 与撞墙的 ("image inclusion failed for X.eps")。
  # epstopdf/gs 全量转换 + 显式引用改写可救后者 (0903.0543/1406.1994 手测出 pdf)。
  - id: eps_to_pdf
    description: "xdvipdfmx 'image inclusion failed for X.eps' → 全量 eps→pdf 转换 + .tex/.sty 显式引用改写"
    phase: loop
    order: 15
    when: { category: ps_image }
    action:
      kind: builtin_transform
      function: eps_to_pdf
      params: { exts: [.tex, .sty] }
    risk: low # 只加 .pdf 产物 + 改已死路径的引用; 扩展名引用改写有等价物
    engines:
      tectonic: { mode: native }
      xelatex: { mode: same } # xelatex 撞此墙罕见 (xdvipdfmx 内嵌 gs), 撞上同法可救
    provenance:
      - {
          corpus: "fixloop-corpusv2 ps_image 9 格 (tectonic)",
          error: 'image inclusion failed for "*.eps" (xdvipdfmx unrecoverable)',
        }
    stats: { fires: 11, rescued_cells: 11, status: validated } # fixloop-v2-rules-2026-09-15 实测
    source_ref: "fixloop-v2 整改; texglot app/graphics.py 同思路"

  # 2105.00151 (pipecensus; IEICE 模板 ``\usepackage[dvipdfmx]{graphicx,xcolor}``
  # 字面方括号驱动) 实证: doc 强指 dvipdfmx → dvipdfmx.def
  # ``\Gread@extractbb@aux`` 对 pdf/png 族先 ``\openin <stem>.xbb``, miss 退
  # ``"|extractbb -O <file>"`` pipe → 沙箱 ``shell_escape=f`` (受限白名单
  # 也关) → pipe 死 → 每图一对 ``Cannot run pipe command`` +
  # ``<stem>.xbb (no BoundingBox)`` 双错 (13 图 26 错, PDF 出但图全丢)。
  # xetex.def 走 ``\XeTeXpdffile`` 原生量尺寸无此链。修复 = 全量 extractbb
  # 可图形 ``extractbb -x`` 预生成 ``<stem>.xbb`` 旁文件 —— 缓存在盘非空
  # 即被直读, pipe 臂整体跳过。签名只产生于 dvipdfmx.def, 无 source 闸。
  - id: xbb_pregen
    description: "dvipdfmx pipe/xbb 双错 → 全量图形 extractbb -x 预生成 .xbb bbox 缓存"
    phase: loop
    order: 15.5 # eps_to_pdf(15) 后, eps_route(16) 前 —— other 类目同区
    when: { category: other }
    condition:
      ctx_suggests: "\\.xbb \\(no BoundingBox\\)|Cannot run pipe command"
      tool_available: extractbb
    action:
      kind: builtin_transform
      function: xbb_pregen
      params: {}
    risk: low # 只写 .xbb bbox 缓存旁文件, 不改源不改引用
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # xdvipdfmx 内嵌同链, doc 强指 dvipdfmx 时同法可救
    provenance:
      - {
          corpus: "2105.00151 (pipecensus pipe/xbb 26 错格, 13 图全丢)",
          error: "Cannot run pipe command + Cannot determine size of graphic in X.xbb",
        }
    stats: { fires: 1, status: proposed }
    source_ref: "tmp/lane-pipecensus/cells.jsonl; graphics-def dvipdfmx.def:104-131"

  # 兜底拒: 转换工具缺席或全数失败时才拒 —— 替代原 precheck fileset 版,
  # 后者实证把 baseline pdf~ 格也 0 轮拒掉 (0812.4521/nucl-th/0104042 回归)。
  - id: eps_route
    mechanisms: [W87]
    description: "log 确证 PS 硬墙且 eps_to_pdf 不可行 → 路由 xelatex"
    phase: loop
    order: 16
    when: { category: ps_image }
    action:
      kind: reject_route
      params:
        {
          route: "xelatex",
          reason: "PS image hard wall (log-confirmed; epstopdf/gs 缺席或转换失败)",
        }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 侧救不动则 unfixable:ps_image 诚实上报
    provenance:
      - {
          corpus: "fixloop-corpusv2 eps_route 11 拒格复盘",
          error: "fileset 静态拒 → log 确证拒 (v2)",
        }
    stats: { fires: 0, status: validated } # 全语料 ps_image 均被 eps_to_pdf 救回, 兜底未点火
    source_ref: "docs/08-translate-compile.md L218, L271; fixloop-v2 整改"

  # ── 2026-09-16 signature-mining "other" 拆家: missing_graphic 两规则 ──
  # 序: case_link (17) 先行 —— 盘上有大小写变体时改写引用即解; 无变体
  # 返回未应用 → 落到 repair (18)。repair 内部分级: pdf 且未蒸馏 → gs
  # 重蒸馏就地覆盖 (留 .fixloop-rd 备份兼已蒸馏标记); 非 pdf/无 gs/蒸馏
  # 败/marker 在 → \includegraphics 改写 \fbox 占位框保编译。
  - id: graphic_case_link
    mechanisms: [W53, W66] # W66 扩面: ci-glob 命中面经 _rewrite_case_refs 同收 \includepdf
    description: "missing_graphic 盘上存大小写变体 → \\includegraphics/\\includepdf 参数改写真名"
    phase: loop
    order: 17
    when: { category: missing_graphic, payload_required: true }
    action:
      kind: builtin_transform
      function: graphic_case_link
      params: {}
    risk: low # 只在 ci-glob 命中真实文件时改写引用; 无命中即不动
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2403.15102/2211.04457 (cbv4 other 拆家)",
          error: "Unable to load picture or PDF file 'img/sf_08_VX.pdf' (盘存 SF_08_VX.pdf)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/research/product/2026-09-16-signature-mining.md §2.2"

  # W66 孤儿裁决 (mechmap-2026-09-17): pdfpages \includepdf 引用的外部
  # pdf 缺件 —— 翻译管线对 includepdf 区整体跳过, 编译侧同语义 stub:
  # 整调用改写 \clearpage\null 空页保分页位 (页面数失真可接受)。
  # 序在 case_link(17) 后 —— 缺件但盘上存大小写变体的先救变体;
  # repair(18) 的 \fbox 语义不适用整页 pdf。
  - id: includepdf_missing_stub
    mechanisms: [W66]
    description: "\\includepdf{payload} 缺件 → 整调用改写 \\clearpage\\null 占位"
    phase: loop
    order: 17.5
    when:
      any:
        - { category: missing_graphic, payload_required: true }
        - { category: missing_file, payload_required: true }
    condition: {
        # raw 粗筛 (builtin 内 _live_matches 遮盖复核, 注释内调用点不动)
        source_contains: "\\\\includepdf(?![a-zA-Z])",
      }
    action:
      kind: builtin_transform
      function: includepdf_missing_stub
      params: {}
    risk: low # 缺件调用点才动; 本可解析引用有守卫; % fixloop 前缀注释留痕
    engines:
      xelatex: { mode: same }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "mechmap W66 (pdfpages 外嵌整页 pdf 缺件)",
          error: "File `supp.pdf' not found / Unable to load picture (includepdf 链)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/corpus_v3/mechanisms.jsonl W66 verdict suggested_rules"

  # failmine3 lane (8 格: 1206.0213/1404.6041/1511.06706/1706.02532/
  # 1803.00128/1803.00130/1907.00032/2003.10664): graphic_ext_relax(14)
  # 点火剥扩展名或 fileset 闸放行后, .eps 真缺件仍在 —— tar 内图档本就
  # 未随稿 (arXiv 源缺图常态)。本规则在解析位落最小合法占位件
  # (BoundingBox + 灰框交叉线): xelatex xdvipdfmx gs distiller 直读不
  # 需 shell-escape (epsprobe -no-shell-escape 实证), tectonic 同链。
  # 选占位文件不改源 —— \epsfig{file=X.eps} kv 形与宏定义位 #1.eps
  # 引用正则够不着, 落盘文件统一可解。序在 includepdf_stub(17.5) 后:
  # 缺件两臂 (pdf 页/eps 图) 各管各域。builtin 内置守卫: 非图形族
  # 后缀拒、无扩展 payload 须有存活图形引用作证、.. 与出 wdir 拒。
  # 2026-09-19 failmine4-covgap 扩臂 (6 格: 2501.01402/2501.01329/
  # 2509.14901 +3): xetex "Unable to load picture or PDF file 'x.png'"
  # 措辞走 missing_graphic 类目 —— 原 missing_file-only when 永不
  # dispatch; when 加 missing_graphic 臂 + condition 加 xetex 措辞,
  # builtin 同步按后缀分发真格式占位 (PNG/JPEG/PDF 二进制, 见
  # _builtins_graphics _*_PLACEHOLDER), 落盘基址改 main_dir (TeX
  # cwd 解析位 —— 子目录 main 时 wdir 根位不可见)。
  # fmsingles census (failmine4 item5, 1012.1365): 随源 PoS.cls 是 dvips
  # 时代 \\ifpdf 路由 —— else 支 ``\\DeclareGraphicsExtensions{.ps,.eps,.pstex}``
  # 在 xelatex 下整表不可解 (normalize 的 \\ifpdf→\\iftrue 补丁只罩 breakurl
  # 装载段, 裸 \\ifpdf 已复元) → 6 处无扩展引用全报 "File `X' not found"
  # + "I could not locate the file with any of these extensions: .ps,.eps,.pstex"
  # (PoSlogo + plots/*5 全部 .pdf 在盘)。签名归 other —— 无扩展名够不着
  # missing_file 的 \\.ext 锚。修法 = PS-only 扩展表前置 .pdf/.png/.jpg/.jpeg
  # (unicode 引擎原生可读格), 含 .pdf 的表不动。序在 placeholder(17.6) 前:
  # 盘上有图时补表即解, 占位是缺件兜底不该先动。
  - id: graphics_ext_pslist_repair
    description: "unicode 引擎下 PS-only \\DeclareGraphicsExtensions 表 → 前置 .pdf/.png/.jpg/.jpeg"
    phase: loop
    order: 17.55 # graphic_ext_relax(14) 剥名后形如本签; placeholder(17.6) 前 —— 有件先解件
    when:
      any:
        - { category: missing_file, payload_required: true }
        - { category: missing_graphic, payload_required: true }
        - { category: other }
    condition:
      any:
        # rep.ctx 止于 l.N 回显行——"I could not locate ..." 帮助行在其后,
        # 永不入 err_head (failmine4-a 实证 2105.00106/2203.00045 ctx 截断)。
        # file:line 形态的 File-not-found 签名在 rep.first, 用无扩展名形
        # ([^'.]+ 拒带点名——带点名 = 显式扩展绕过扩展表或真缺件, 不归本规)
        - ctx_suggests: "File `[^'.]+' not found"
        # 留旧臂兜任何会把帮助行纳入 ctx 窗的 issuer 形态
        - ctx_suggests: "could not locate the file with any of these extensions"
      source_contains: "\\\\DeclareGraphicsExtensions\\s*\\{(?![^}]*\\.pdf)"
      engine_in: [xelatex, tectonic]
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # 负前瞻锁"表内无 .pdf"才补 (PoS.cls 真支 {.pdf,.jpg,.jpeg} 不动);
          # masked 面注释内声明不算位
          - {
              pattern: "(\\\\DeclareGraphicsExtensions\\s*\\{)(?![^}]*\\.pdf)([^}]*)\\}",
              repl: "\\g<1>.pdf,.png,.jpg,.jpeg,\\g<2>}",
              match_surface: masked,
            }
    risk: low # 只加候选扩展名; unicode 引擎下 .ps/.eps/.pstex 本不可读
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # bundled xdvipdfmx 同表语义
    provenance:
      - {
          corpus: "1012.1365 (stagerun-loop2/loop3; failmine4 item5)",
          error: "File `PoSlogo' not found + could not locate the file with any of these extensions: .ps,.eps,.pstex (PoS.cls \\ifpdf else 支)",
        }
      - {
          corpus: "2105.00106 + 2203.00045 (stagerun-loop3; chronic347 item-a)",
          error: "LaTeX Error: File `fig2_direct_indirect_small' not found (doc \\ifpdf else 支 {.eps}; figures/*.jpg 与 *.pdf 在盘)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-fmsingles/; PoS.cls:205-210 \\ifpdf 分支; normalize.py breakurl-scoped \\ifpdf patch"

  - id: graphic_missing_placeholder
    mechanisms: [W21]
    description: "missing_file/missing_graphic 图档真缺件 → 解析位落最小合法格式占位 (EPS/PNG/JPEG/PDF 按后缀)"
    phase: loop
    order: 17.6 # includepdf_missing_stub(17.5) 后, graphic_repair(18) 前
    when:
      any:
        - { category: missing_file, payload_required: true }
        - { category: missing_graphic, payload_required: true }
    condition:
      any:
        # raw 粗筛三臂: 带 PS 扩展名直中; 无扩展名 (ext_relax 剥后形态)
        # 进 builtin 内 live-ref 复核 (1803.00128: 剥后报错仍带 .eps,
        # extless 形为 graphicx 全扩展试尽后的兜底签名); xetex 图形域
        # "Unable to load" 措辞臂 (failmine4-covgap, missing_graphic 专属
        # 签名, 对 missing_file 臂无害 —— 非图形后缀 builtin 内拒)
        - { ctx_suggests: "\\.(eps|ps|epsi|epsf)' not found" }
        - { ctx_suggests: "File `[^']+' not found" }
        - { ctx_suggests: "Unable to load picture or PDF file" }
    action:
      kind: builtin_transform
      function: graphic_missing_placeholder
      params: {}
    risk: low # 只加占位文件不改源; 非图域 payload builtin 内拒; 落盘留 %%Title/COM 痕
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # bundled xdvipdfmx 同 gs distiller 链
    provenance:
      - {
          corpus: "failmine3 loop3 8 格 (1206.0213/1404.6041/1511.06706/1706.02532/1803.00128/1803.00130/1907.00032/2003.10664)",
          error: "File `X.eps' not found — graphic_ext_relax 已点火, tar 内图档真缺",
        }
      - {
          corpus: "failmine4-covgap v3all 6 格 (2501.01402/2501.01329/2509.14901/2501.01425/2603.08153/2604.03907)",
          error: "Unable to load picture or PDF file 'x.png' — xetex 图形域缺件措辞, missing_graphic 类目",
        }
    stats: { fires: 11, rescued_cells: 8, status: active }
    source_ref: "tmp/lane-failmine3/ (#164a); epsprobe 真编译臂 -no-shell-escape 验证; tmp/lane-covgap/ (二进制占位实证)"

  - id: graphic_repair
    description: "missing_graphic 在盘但拒载 → gs 重蒸馏就地覆盖, 败则 \\fbox 占位"
    phase: loop
    order: 18
    when: { category: missing_graphic, payload_required: true }
    action:
      kind: builtin_transform
      function: graphic_repair
      params: {}
    risk: medium # 重蒸馏覆盖原图 (留 .fixloop-rd 备份); stub 丢图保编译
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1502.06541/1012.5273 (cbv4 other 拆家)",
          error: "figDY.pdf 合法但双引擎拒载 / zeromode.pdf 转换后仍拒载",
        }
