  # xlinkobj lane 5 格普查 (1404.5668/1206.0148/1907.00277/2403.05523/
  # 2412.19437): 工程船货 .pdf 对象结构残缺 (cairo shading obj 缺 endobj /
  # bare-CR EOL / token-per-line 挤烂 / ObjStm 压坏) → xdvipdfmx
  # ``pdf:image`` import ``pdf_read_object`` 回 NULL → ``pdf_link_obj(NULL)``
  # fatal → xelatex SIGPIPE。签名 ``xdvipdfmx:fatal:`` 只走 stderr→
  # stdout_tail, .log 干净 —— ``_report_of`` 的 ``\w+:fatal:`` 归一抬成 '!'
  # 行使签名对 ctx_suggests 可见 (同签恒伴 ``Didn't find "endobj"`` warning,
  # 位 fatal 前行不入 err_head ctx 窗, 不作闸)。修复 = 全量内嵌 .pdf
  # ``gs -sDEVICE=pdfwrite`` 重序列化 (内容不动只改对象布局; 5/5 格 bisect
  # 实证清 fatal) —— fatal 不携文件名, 全量重写是唯一定位法。
  - id: pdf_asset_sanitize
    description: "xdvipdfmx pdf_link_obj invalid-object fatal → 全量内嵌 .pdf gs pdfwrite 重序列化"
    phase: loop
    order: 18.5 # graphic_repair(18) 后 —— 图件重蒸馏同族; other 类目同区
    when: { category: other }
    condition:
      ctx_suggests: "pdf_link_obj\\(\\): passed invalid object"
      tool_available: gs
    action:
      kind: builtin_transform
      function: pdf_asset_sanitize
      params: {}
    risk: medium # 重写内嵌图件字节 (原件留 .fixloop-rd 备份); 重序列化不改内容
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # bundled xdvipdfmx 同 fatal 链 (2412.19437 实证)
    provenance:
      - {
          corpus: "xlinkobj lane 5 格 (1404.5668/1206.0148/1907.00277/2403.05523/2412.19437)",
          error: 'xdvipdfmx:fatal: pdf_link_obj(): passed invalid object (伴 Didn''t find "endobj")',
        }
    stats: { fires: 5, status: proposed }
    source_ref: "tmp/lane-xlinkobj/; gs pdfwrite rewrite 5/5 bisect-verified"

  # astro-ph/9901081 实证 + core 层普查 (11 格 preamble 形): 2.09 老稿
  # ``\input <pkg>.sty`` 裸装载——plain \input 以 @=catcode-12 读包文件,
  # 包内全部 @-cs 断成 ``\define``+``@key`` 垃圾 (epsfig.sty:46
  # ``\define@key`` 报 ``\define`` undefined_cs), 且文件不进 \@filelist
  # 注册表、不走选项处理。``\usepackage{pkg}`` 是 LaTeX2e 唯一正载。
  # 前瞻 ``(?=[\s\S]*\\begin{document})`` 只改导言区位——post-doc
  # \input .sty (corpus 2 格) 换 \usepackage 会 preamble-only 新错,
  # 原样保留。precheck -11 = 先于 pstricks/svg 路由门: 改写把
  # ``\input pstricks.sty`` 也翻译成 \usepackage 形 → tectonic 侧由
  # 既有路由正确拒走 (原 \input 形逃逸路由面); 先于 static_precheck(0)
  # → 转换后缺件经其扫描面 shim/install 可达。
  - id: input_sty_to_usepackage
    description: "\\input <pkg>.sty 裸装载 (@=12 读包文件 → @-cs 全裂) → 改写 \\usepackage{<pkg>}"
    phase: precheck
    order: -11 # 先于 pstricks_route(-10)/svg_route(-9)/static_precheck(0)
    when: { always: true }
    condition:
      source_contains: "\\\\input(?:\\s*\\{\\s*|\\s+)([A-Za-z][A-Za-z0-9_-]*)\\.sty(?:\\s*\\}|(?![\\w.-]))(?=[\\s\\S]*\\\\begin\\s*\\{document\\})"
      # 2.09 (\documentstyle) 无 \usepackage——改写即非法 (0806.0904/0806.2953 回归)
      main_head_contains: "\\documentclass"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          # braced|bare 两形共 \\g<1> 单组——(?| 分支复位是 regex 扩展,
          # ruleset_validate 用 stdlib re 全量扫 repl/pattern 必须同构。
          # ``\.sty`` 后 ``(?:\s*\}|(?![\w.-]))`` 择一: braced 收 ``}``,
          # bare 零消耗留分隔空白 (不吃 \n, 防 \begin{document} 并进同行)
          # + ``(?![\w.-])`` 防 .styx 半名误中。
          - {
              pattern: "\\\\input(?:\\s*\\{\\s*|\\s+)([A-Za-z][A-Za-z0-9_-]*)\\.sty(?:\\s*\\}|(?![\\w.-]))(?=[\\s\\S]*\\\\begin\\s*\\{document\\})",
              repl: "\\\\usepackage{\\g<1>}",
            }
    risk: low # \input .sty 在 LaTeX2e 恒为误载; 前瞻闸只动导言区位
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 源码改写天然可移植, 还顺带补路由识别
    provenance:
      - {
          corpus: "astro-ph/9901081 (loop2 undefined_cs fail)",
          error: "epsfig.sty:46 Undefined control sequence \\define (\\input epsfig.sty 裸装载 @=12 裂 \\define@key)",
        }
    stats: { fires: 41, status: proposed }
    source_ref: "bench/results/stagerun-loop2-2026-09-18/cases.jsonl astro-ph/9901081"

  # firedunfixed 普查 item5 (2403.05444/2308.04278, epsconv lane):
  # e-print 随带 X-eps-converted-to.pdf (上游 epstopdf 产物) 而 X.eps 不随稿,
  # 稿面未载 epstopdf —— 显式 {X.eps} 归 missing_file|X.eps (graphic_ext_relax
  # sibling 闸收进 stem 域后 conv 件 X-eps-converted-to ≠ X 不再放行剥名),
  # 裸 {X} 报无扩展名 File `X' not found 归 other|None 死路 (taxonomy 要求
  # \.\w+)。资产侧别名修复: 存活引用全扫 + payload/err_head 提名 → conv 件
  # 在盘则 copyfile 落 <cwd>/<refdir>/<stem>.pdf (裸名 .pdf 补全即解) +
  # eps 族显式引用剥名接管 (eps_to_pdf 转换+改写同 builtin 先例)。
  # order 8.6 = main_wrapper_promote(8.5) 后、fileset 族(9) 前 —— conv 件随稿
  # 家一轮全愈必须先拿派发窗: 2403.05444 实证 fileset_relocate(9) 逐轮搬一张
  # .eps (arvix/→cwd), 13 图 > 8 轮预算耗尽在 Fig8。cache_dir_glob 把本臂限在
  # 随稿 conv 家, 家外 decline 透传不抢 relocate/install_file 真件归位;
  # eps_to_pdf(15)/占位(17.6) 仍在后殿 —— 随稿真件字节优于外部转换与占位框。
  - id: eps_converted_alias
    mechanisms: [W21]
    description: "File `X(.eps)' not found 且 X-eps-converted-to.pdf 随稿 → 解析位落 X.pdf 别名 + eps 族引用剥名"
    phase: loop
    order: 8.6 # fileset_relocate(9) 前 —— conv 家一轮全愈, 防逐轮搬迁饿死
    when:
      any:
        - { category: missing_file, payload_required: true }
        - { category: missing_graphic, payload_required: true }
        - { category: ps_image, payload_required: true }
        - { category: other } # 裸名缺件 File `X' not found 无 ext 归此类无 payload
    condition:
      ctx_suggests: "File `[^']+' not found|Unable to load picture or PDF file|image inclusion failed"
      cache_dir_glob: "**/*-eps-converted-to.pdf"
    action:
      kind: builtin_transform
      function: eps_converted_alias
      params: {}
    risk: low # 只落引用解析位 .pdf 别名 (随稿转换件字节) + eps 族剥名; 字面可解引用不触
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # bundled xdvipdfmx 同 \Gin@extensions 补全序
    provenance:
      - {
          corpus: "2403.05444/2308.04278 (firedunfixed census item5)",
          error: "File `Fig1' not found / File `system-model' not found — 随稿只有 FigN-eps-converted-to.pdf",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "tmp/lane-firedunfixed/report.md item5; tmp/lane-epsconv/"
