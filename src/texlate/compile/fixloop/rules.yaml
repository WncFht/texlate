          # AIP 会议文集: aipproc.cls + aipcheck.tex (\input 版本自检件)。
          # 1306.2177 实证: \layoutstyle/\keywords/\pacs + \author{Name}{address={...}}
          # 双参 keyval 约定 (在 document 体内调用)。
          aipproc.cls:
            needs: ["keyval.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{aipproc}[2026/09/16 fixloop legacy shim -> article + AIP polyfills]
              \LoadClassWithOptions{article}
              \RequirePackage{keyval}
              \providecommand{\layoutstyle}[1]{}
              \providecommand{\classification}[1]{}
              \providecommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              \providecommand{\pacs}[1]{\par\noindent\textbf{PACS:} #1\par}
              \def\fixaip@addr{}
              \define@key{fixaip@a}{address}{\gdef\fixaip@addr{#1}}
              \define@key{fixaip@a}{altaddress}{\gdef\fixaip@addr{#1}}
              \define@key{fixaip@a}{email}{}
              \define@key{fixaip@a}{homepage}{}
              \def\fixaip@authors{}
              \def\@author{\fixaip@authors}
              \renewcommand{\author}[2]{%
                \setkeys{fixaip@a}{#2}%
                \ifx\fixaip@authors\@empty
                  \gdef\fixaip@authors{#1\ifx\fixaip@addr\@empty\else\\{\footnotesize\fixaip@addr}\fi}%
                \else
                  \g@addto@macro\fixaip@authors{\and #1\ifx\fixaip@addr\@empty\else\\{\footnotesize\fixaip@addr}\fi}%
                \fi
                \def\fixaip@addr{}}
              % 真身 aipproc.cls 的致谢环境 (AIPacknowledgments 版式头) —
              % 1306.2177 实证: 无头容器即可, 语义=不带号小节
              \newenvironment{theacknowledgments}
                {\par\noindent\textbf{Acknowledgments.}\space}{\par}
              \endinput
          aipcheck.tex:
            body: |
              % AIP \input{aipcheck} 版本自检件 —— 纯 \typeout, 无排版语义
              \endinput
          # A&A aa.cls (TL 无, aanda 继任类也不在) —— article + A&A 宏面 polyfill。
          # 0905.4439 实证: \abstract 五段命令 + \inst/\institute/\offprints 等。
          aa.cls:
            needs: ["natbib.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{aa}[2026/09/16 fixloop legacy shim -> article + A&A polyfills]
              \LoadClassWithOptions{article}
              % 真身 aa.cls 内置 natbib (\citep/\citeyear 面, 2401.17274 实证)。
              % 默认 author-year 对空 \bibitem{} (0905.4439: 45 条无 label
              % 无引用的裸书目) 自写 aux 次轮回读炸 "Bibliography not
              % compatible with author-year citations"; numbers 模式对
              % author-year 形与裸形 bibitem 通吃 → shim 取宽容侧
              \RequirePackage[numbers]{natbib}
              \providecommand{\inst}[1]{\textsuperscript{\,#1}}
              \providecommand{\offprints}[1]{}
              \providecommand{\mail}[1]{}
              \providecommand{\object}[1]{}
              \providecommand{\authorrunning}[1]{}
              \providecommand{\titlerunning}[1]{}
              \providecommand{\subtitle}[1]{}
              \providecommand{\keywords}[1]{\par\noindent\textbf{Key words.} #1\par}
              % \abstract 五段式 (context/aims/methods/results/conclusions) 命令形态
              % —— A&A 稿在 document 体内调用, 占掉 article 的 abstract 环境名
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[5]{\begin{quotation}\noindent\textbf{Abstract.} #1 #2 #3 #4 #5\end{quotation}}
              % \institute 收地址块 (内含 \and) —— \maketitle 后兜底输出防丢内容
              \def\aa@institute{}
              \providecommand{\institute}[1]{\gdef\aa@institute{#1}}
              \let\aa@maketitle\maketitle
              \renewcommand{\maketitle}{\aa@maketitle\par\begingroup\ifx\aa@institute\@empty\else{\footnotesize\let\and\\\aa@institute\par}\fi\endgroup}
              % 天文记号 (\la/\ga 用 \leq/\geq 近似 —— 不引 amssymb 依赖)
              \providecommand{\ion}[2]{#1~#2}
              \providecommand{\sun}{\ensuremath{\odot}}
              \providecommand{\degr}{\ensuremath{{}^\circ}}
              \providecommand{\arcmin}{\ensuremath{'}}
              \providecommand{\arcsec}{\ensuremath{''}}
              \providecommand{\la}{\ensuremath{\leq}}
              \providecommand{\ga}{\ensuremath{\geq}}
              \endinput
          # IOP 系 (iopart.cls 作者工具包, 1996 版起不在 TL): 实证 wdir 常自带
