  # 2026-09-16 wave-3: install_sysfont 失败后的二级出路 —— 名查找的字体
  # (fontconfig 面) 根本不在 TL 包索引 (Noto Mono: 发行版只有 Noto Sans
  # Mono; 名字带空格亦进不了 filemap) → 把文档对 {payload} 的引用换成
  # LM 显示名。用显示名不用文件名: 全家族解析 (\textbf/\textit 自动
  # 命中字重), 裸 .otf 只给单重; "Latin Modern *" 经 engine 注入的
  # FONTCONFIG_FILE (texmf opentype 注册) 保证可解, 每个 TL 都有 lm。
  - id: font_name_substitute
    description: "fontspec 名查找字体真缺 (install 无解) → 引用换成 Latin Modern 显示名"
    phase: loop
    order: 31 # install_sysfont(30) 装不上才轮到换名
    when: { category: fontspec_missing, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(\\\\setmonofont|\\\\setCJKmonofont)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>{Latin Modern Mono}',
            }
          - {
              pattern: "(\\\\setmathfont)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>{Latin Modern Math}',
            }
          - {
              pattern: "(\\\\setmainfont|\\\\setsansfont|\\\\setromanfont|\\\\setmathrm|\\\\fontspec|\\\\setCJKmainfont|\\\\setCJKsansfont|\\\\setfontfamily)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>{Latin Modern Roman}',
            }
          - {
              pattern: "(\\\\newfontfamily|\\\\newfontface|\\\\setfontface|\\\\newCJKfontfamily)(\\s*(?:\\[[^\\]]*\\]\\s*)?)(\\s*\\{[^}]*\\}|\\\\[a-zA-Z@]+)(\\s*(?:\\[[^\\]]*\\]\\s*)?)\\{\\s*{payload}\\s*\\}",
              repl: '\g<1>\g<2>\g<3>\g<4>{Latin Modern Roman}',
            }
    risk: medium # 字体观感改变 (Noto→LM); 只对已确认装不上的字体动手
    known_gap: "显示名解析依赖 engine 的 FONTCONFIG_FILE 注入 (texmf opentype 注册); payload 含正则元字符会过配 (brace 边界已挡大部分); addfontfeatures 等冷门 cs 未覆盖 → applied=False"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop2-delta fontspec_missing (1706.00240)",
          error: "The font \"Noto Mono\" cannot be found (\\setmonofont, bundled font-termes.sty)",
        }
    stats: { fires: 0 }
    source_ref: "wave-3: fontspec_missing 名替换面 (install_sysfont 兜底)"

