  # 新增 (fixloop-v2 整改): tectonic bundle 内建类太老遮蔽 —— 内置
  # aastex 5.0rc3.1 (1999) 缺 \actaa/deluxetable 宏族, missing_file 打不到
  # (bundle 能解析), 只能 undefined_cs 确证后往 wdir 注 stub 遮蔽换 emulateapj
  # (全 API 面一次补齐, 含 \rotate no-op; emulateapj 经 ctan_fetch 拉进 wdir)。
  - id: aastex_bundle_shadow
    description: "tectonic 内置 aastex 5.0rc3 缺新宏 → wdir 注 aastex.cls stub 遮蔽 (→emulateapj)"
    phase: loop
    order: 155 # journal_cs_polyfill(160) 之前: 遮蔽换类比逐宏补表更彻底
    when: { category: undefined_cs, payload_required: true }
    condition:
      engine_in: [tectonic] # bundle 内建类问题只存在于 tectonic
      # 同款注释-FP 收紧: %\documentclass{aastex} 注释行不得触发遮蔽
      # (行锚同 :369 latex209 gate 先例)。
      source_contains: "(?m)^[ \\t]*\\\\documentclass[ \\t]*(\\[[^\\]]*\\])?[ \\t]*\\{aastex\\}"
    action:
      kind: builtin_transform
      function: bundled_class_shadow
      params:
        target: aastex.cls
        needs: ["emulateapj.cls"]
        include_journal_table: true # \\actaa 族也算触发宏
        cs_set: # aastex 5.0rc3 缺失的 deluxetable/新宏族 (emulateapj 全覆盖)
          [
            tabletypesize,
            tablefontsize,
            tablewidth,
            tablenum,
            tablehead,
            colhead,
            startdata,
            enddata,
            tablecomments,
            tablerefs,
            rotate,
            deluxetable,
            tablebreak,
            figset,
            platecomment,
            splittablenotes,
          ]
        body: |
          \NeedsTeXFormat{LaTeX2e}
          \ProvidesClass{aastex}[2026/09/15 fixloop bundle shadow -> emulateapj]
          \LoadClassWithOptions{emulateapj}
          \providecommand{\rotate}{}
          \endinput
    engines:
      xelatex: { mode: native } # 实际不可达: engine_in 门只放行 tectonic
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1806.06690 tectonic 臂 (fixloop-corpusv2)",
          error: "Undefined control sequence \\actaa → \\tabletypesize (aastex 5.0rc3.1 连环缺)",
        }
    stats: { fires: 1, rescued_cells: 1, status: validated } # 1806.06690 tec 实证 clean
    source_ref: "fixloop-v2 整改; tectonic bundle aastex 版本实证"

