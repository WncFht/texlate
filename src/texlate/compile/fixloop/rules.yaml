              \let\frontmatter@init\relax
              \endinput
          # revtex4b4.cls = REVTeX4 beta-4 预发版名 (TL 从未收 ——
          # physics/0104031 实证 \documentclass[aps,prl,twocolumn,endfloats])。
          # revtex4-2 同桥; endfloats 等失效选项由类选项警告吸收
          revtex4b4.cls:
            needs: ["revtex4-2.cls"]
