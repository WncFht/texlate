  # bundled/旧稿 \acsetup{X-format=...} 在 acro v3.8 下键已废 (旧键兼容表
  # 存在于源但实测不注册, "acro/short-format unknown" 实证); v3 原名
  # format/X。定点只改 \acsetup{...} 花括号内, 不动他处 -format 字样。
  - id: acro_v3_key_rename
    description: "acro v2 旧键 (short|long|extra|foreign|first-long)-format → v3 format/X"
    phase: loop
    order: 167 # undefined_color_fallback(166) 之后, revtex4_array_swap_guard(170) 之前
    when:
      any:
        - { category: key_unknown } # 1706.00240: l3keys 错行原无 head 签 → 落 early_eof 误判
        - { category: early_eof } # belt: acro 错非首错时仍落 tail 早终签, ctx_suggests 照判
        - { category: other }
        - { category: emergency }
