          # ── 2026-09-16 wave-2 (loop2-delta 残盘 ~27 格, 1d scout-unfix 枚举) ──
          # 继任类桥: emulateapj-rtx4 (revtex4 时代变体, 1404.2351 实证),
          # amsart2000 (vintage amsart), nature2 (老 Nature 名) —— 同
