  # 新增 (2026-09-16): undefined_cs 无包映射项的 cs→修复表 —— spec 支持
  # strip_pkg/usepackage+装文件/cs_map/polyfill 组合 (builtins.cs_targeted_fix)。
  # 首版表: headerps@out→剥 breakurl (dvips 钩子在 Unicode 引擎无定义),
  # mathbbm→xelatex 装 bbm / tectonic 换 dsfont\mathds。
  - id: cs_targeted_fix
    description: "undefined_cs payload 命中 cs 修复表 → 剥包/装包/宏改写/polyfill 定向修"
    phase: loop
    order: 165 # journal_cs_polyfill(160) 之后, undefined_cs_guess(900) 之前
    when: { category: undefined_cs, payload_required: true }
    action:
      kind: builtin_transform
      function: cs_targeted_fix
      params:
        # 默认表 = builtins._CS_FIX_TABLE; 此 cs_table 叠加在其上。
        # n100 undefined_cs 逐签名归因: 全部 24 个 payload 均为 splice/join
        # 合并残骸 (cs+后 token 粘连), 非缺包 —— cs_map 拆回原形
        # (\\old\b 词边界定, 不碰更长 cs)。笔误类 llm_hook 候选本批为零。
        cs_table:
          # \item+X: 1012.1321/2003.10959/2009.11013/2105.03900/2410.06025/
          # math--0307301 —— itemize 内 \item 与首词粘连
          itemFSU: { cs_map: { itemFSU: "item FSU" } }
          itemNGA: { cs_map: { itemNGA: "item NGA" } }
          itemCM: { cs_map: { itemCM: "item CM" } }
          itemBalakrishnan:
            { cs_map: { itemBalakrishnan: "item Balakrishnan" } }
          itemSPELL: { cs_map: { itemSPELL: "item SPELL" } }
          itemFlop: { cs_map: { itemFlop: "item Flop" } }
          # \par+罗马号: 1206.1808 —— 原文 "\pari) 在 \cite..." 即 "\par i)"
          pari: { cs_map: { pari: "par i" } }
          parii: { cs_map: { parii: "par ii" } }
          # {\it+op}: 2203.13109 —— 同文上行就有正确的 {\it op.cit.}
          itop: { cs_map: { itop: "it op" } }
          # \hline+Cd: 1003.4522 deluxetable 行 "Cd~\textsc{i}"
          hlineCd: { cs_map: { hlineCd: "hline Cd" } }
          # \linebreak+GF: math--0605301 bibitem "quotient ring GF(2)"
          linebreakGF: { cs_map: { linebreakGF: "linebreak GF" } }
          # 1511.02908 ×13: 自定义 \def\dd{\operatorname{d}} 被粘 (\ddr=d/dr 等);
          # \frac/\bf/\Delta/\nabla/\in 同型合并
          ddr: { cs_map: { ddr: "dd r" } }
          ddf: { cs_map: { ddf: "dd f" } }
          ddt: { cs_map: { ddt: "dd t" } }
          ddR: { cs_map: { ddR: "dd R" } }
          ddF: { cs_map: { ddF: "dd F" } }
          frack: { cs_map: { frack: "frac k" } }
          fracr: { cs_map: { fracr: "frac r" } }
          Deltau: { cs_map: { Deltau: "Delta u" } }
          nablau: { cs_map: { nablau: "nabla u" } }
          bfr: { cs_map: { bfr: "bf r" } }
          bfv: { cs_map: { bfv: "bf v" } }
          bfk: { cs_map: { bfk: "bf k" } }
          inV: { cs_map: { inV: "in V" } }
          # {\it/\rm+首词} 粘连 —— 2401.17274 (aa.cls 缺类后级联面) +
          # hep-ph/9910403: {\it Uhuru}/{\rm and} 同型
          itUhuru: { cs_map: { itUhuru: "it Uhuru" } }
          itEinstein: { cs_map: { itEinstein: "it Einstein" } }
          itChandra: { cs_map: { itChandra: "it Chandra" } }
          itXMM: { cs_map: { itXMM: "it XMM" } }
          rmROSAT: { cs_map: { rmROSAT: "rm ROSAT" } }
          rmSRG: { cs_map: { rmSRG: "rm SRG" } }
          rmand: { cs_map: { rmand: "rm and" } }
          # natbib 引用宏 —— 类内 natbib 缺席 (shim 顶替后) 或作者漏装包
          citep: { usepackage: natbib }
          citeyear: { usepackage: natbib }
          # 2501.14787 (repro-2501-2026-09-16): \DeclareUnicodeCharacter 是
          # inputenc 私有 cs, XeTeX 内核恒未定义 (en/zh 两臂同炸) → lccode
          # 惯用法 polyfill。normalize.XETEX_COMPATIBILITY 同源 shim
          # (c582736 已源头落); 本条目兜底绕开 normalize 的编译路径。
          DeclareUnicodeCharacter:
            {
              polyfill: '\providecommand{\DeclareUnicodeCharacter}[2]{\begingroup\lccode`\~="#1\relax\lowercase{\endgroup\catcode`~\active\protected\def~}{#2}}',
            }
        # 表外 fallback (2026-09-16): glue 残骸前缀拆分 —— payload 未命中
        # cs_table 时, 若 cs = 已知粘连头 + 残余 (大写起首或 ≤4 字符) 则合成
        # cs_map 拆回 "head rest" (replay 实证 rmPT 型新残骸仍零星冒头,
        # 逐条收表追不上)。split_guard 挡与头同前缀的真宏名 (part/parbox/
        # ddot/fraction…); 含 @ 的包内私有 cs 不拆 (版本偏斜非粘连)。
        # in 头不收: int/indent/input/index/infty 前缀面太热, inV 留显式条目。
        split_heads:
          [linebreak, item, hline, nabla, Delta, frac, par, dd, bf, it, rm]
        split_guard:
          [part, para, parbox, parskip, itemize, itemsep, ddot, ddots, fraction]
    risk: medium # 剥包/换宏族改版式; 表只收语料实证条目
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1909.05039 (fixloop-v2)",
          error: "\\headerps@out ← breakurl shipout 钩在 hdvipdfm 下无定义",
        }
      - {
          corpus: "2301.01267 (fixloop-v2)",
          error: "\\mathbbm ← bbm 对 tectonic 是 MF-only 死路",
        }
    # 2026-09-16 实跑: 1909.05039 xelatex headerps@out→剥 breakurl,
    # 上圈 unfixable:undefined_cs → clean (fixloop-v2-rules 对照)
    stats: { fires: 1, rescued_cells: 1, status: validated }
    source_ref: "handoff-2026-09-15 §2.2 undefined_cs 无包映射项"

  # repro-2501 缺陷B 规则侧兜底: 色名参被段切漏保 (TRANSPARENT_NAMES 遮蔽
  # argspec → {blue} 翻成中文) → xcolor Undefined color。真修在 segmenter/
  # tables; 此规则把未知色名注册成黑保住编译链, 逐色名 dedup 各注一行。
  - id: undefined_color_fallback
    description: "(x)color Undefined color 'X' → 主文件 docclass 后注 \\definecolor{X}{rgb}{0,0,0} 兜底黑"
    phase: loop
    order: 166 # cs_targeted_fix(165) 之后, undefined_cs_guess(900) 之前
    when: { category: undefined_color, payload_required: true }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\documentclass(\\[[^\\]\\n]*\\])?\\{[^}\\n]+\\}",
              repl: '\g<0>\n\\definecolor{payload}{rgb}{0,0,0} % fixloop: undefined-color fallback',
            }
    risk: low # 注册色名不改版式; 色名参槽由错误先决条件保证 (x)color 已载
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "2501.14787 (repro-2501-2026-09-16)",
          error: "Package xcolor Error: Undefined color '这是译文' ×4",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "repro-2501-2026-09-16/README.md 缺陷B; 1e cross-session handoff"

  # repro-1306 (1e 移交, e2e 实证 0 err 7页): revtex4-1 4.1s 的
  # \document@inithook→\switch@array 对 array v2.6n 校验失败仍无条件 \let
  # 换旧协议 \@mkpream/\insert@column → \xdef\@preamble 展开失衡 →
  # Extra \or ×30 → Incomplete \iffalse → Emergency。守卫=\begin{document}
  # 前存真值 + AtBeginDocument 恢复 (排在 revtex inithook 后)。
  # 坑: 只恢复 \@mkpream 会 HANG——mkpream+insert@column 必须成对。
  - id: revtex4_array_swap_guard
    description: "revtex4-1 'Unrecognized array package' 指纹 (校验失败仍换旧协议 \\\\@mkpream/\\\\insert@column) → \\\\begin{document} 前注守卫: 存真值 + AtBeginDocument 恢复"
    phase: loop
    order: 170 # undefined_color_fallback(166) 之后, undefined_cs_guess(900) 之前
    when: { category: syntax }
    condition:
      source_contains: "\\\\documentclass\\s*(\\[[^\\]]*\\])?\\s*\\{revtex4"
      ctx_suggests: "Extra \\\\or"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\begin\\s*\\{document\\}",
              repl: '\\makeatletter\n\\let\\TEXLATE@sv@mkpream\\@mkpream\n\\let\\TEXLATE@sv@insertcol\\insert@column\n\\AtBeginDocument{%\n\\let\\@mkpream\\TEXLATE@sv@mkpream\n\\let\\insert@column\\TEXLATE@sv@insertcol}%\n\\makeatother\n\g<0>',
            }
    risk: low # 守卫幂等 no-op: array 未载/校验已通过时, 存回的就是当前值
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # bundle 内核旧 → 校验或已通过; 守卫仍为 no-op
    provenance:
      - {
          corpus: "1306.0067 (modec-expand-2026-09-16, expand layer)",
          error: "Extra \\or. l.150 \\begin{tabular}{>{\\centering\\arraybackslash}m{1.25in}...} — revtex4-1+dcolumn(array v2.6n) 签名失配",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/results/repro-1306-2026-09-16/ (probe-* 全矩阵 + e2e 7页实证); draft revtex4-array-guard.yaml (1e, d2d82e8)"

  # ─── F4 (2026-09-16): 缺字分诊 —— warnings 段 missing_char 升级类别驱动 ───
  # 两条互斥子路径都在 missing_char_fix 内 (码位×字体 查表):
  #   CJK 落非 CJK 字体 = xeCJK 字体绑定被污染 (elsart \no@harm → \protect
  #   重定义 → \selectfont 失效 → 首用把 xeCJK/<fam>/<ser>/<sh>/<size> 绑死
  #   lmroman; cond-mat/0307508 实跑 4379 缺字根因, /tmp/mc-repro 复现)
  #   → \AtBeginDocument 预热盒在干净上下文先绑常用 size;
  #   符号/拉丁缺字 (≠ U+2260 / − U+2212 / § U+A7 / ø U+F8 / è U+E8)
  #   → char→命令字面替换, 表条目见 builtins._MC_TABLE, params.char_table 可扩。
  - id: missing_char_fix
    description: "无 '!' 错但 log 有 Missing character → 码位分级: CJK→xeCJK 绑定预热, 符号/拉丁→字面替换"
    phase: loop
    order: 25 # 与类别独占, 序位只影响同 category 规则间
    when: { category: warn_missing_char }
    action:
      kind: builtin_transform
      function: missing_char_fix
      params: {}
    risk: low # 预热盒不可见; replace 只动缺字码位本身
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "cond-mat/0307508 (n100-postcutover)",
          error: "Missing character×4379 in lmroman10-regular (CJK 绑定污染)",
        }
      - {
          corpus: "0707.3950 / 0905.4907 / 0806.1079 / 1003.1464 / 1608.02516 / 2403.15096 (n100)",
          error: "Missing character: CJK in cmr/lmroman + ≠−§øè in cm*",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "spec 2026-09-16-batch-hardening-design §9 F4"

