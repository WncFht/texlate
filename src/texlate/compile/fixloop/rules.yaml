    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L274; ctanfetch-probe.md §3.3"

  # 新增 (docs/08:269): 工程自带旧 .sty/.cls 遮蔽已装新版 ——
  # 错误触发型 (undefined_cs/already_def 反复出现时才怀疑遮蔽),
  # 按 \\ProvidesPackage 日期比较, 盲删必死 (同目录 cls 可能是唯一来源)
  - id: vendored_sty_shadow
    description: "工程自带旧 .sty/.cls 比系统新装版本旧 → rename 隔离 (.fixloop-iso)"
    phase: loop
    order: 150
    when:
      any:
        - { category: undefined_cs }
        - { category: already_def }
    condition: { vendored_shadow: true } # builtin 探测: 本地副本日期 < 系统副本日期
    action:
      kind: builtin_transform
      function: vendored_shadow_isolate
      params: { exts: [.sty, .cls], suffix: ".fixloop-iso" }
    risk: medium # rename 会改变工程布局; 只在确证更旧时动
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # tectonic 同理: cwd 旧版遮蔽 bundle 新版
    provenance:
      - { corpus: "—", error: "装了新包但错误依旧 → 工程内旧 .sty 遮蔽" }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L269"

  # 新增 (fixloop-v2 整改): tectonic bundle 内建类太老遮蔽 —— 内置
  # aastex 5.0rc3.1 (1999) 缺 \actaa/deluxetable 宏族, missing_file 打不到
  # (bundle 能解析), 只能 undefined_cs 确证后往 wdir 注 stub 遮蔽换 emulateapj
  # (全 API 面一次补齐, 含 \rotate no-op; emulateapj 经 ctan_fetch 拉进 wdir)。
  - id: aastex_bundle_shadow
    description: "tectonic 内置 aastex 5.0rc3 缺新宏 → wdir 注 aastex.cls stub 遮蔽 (→emulateapj)"
    phase: loop
    order: 155 # journal_cs_polyfill(160) 之前: 遮蔽换类比逐宏补表更彻底
    when: { category: undefined_cs, payload_required: true }
    condition:
      engine_in: [tectonic] # bundle 内建类问题只存在于 tectonic
      source_contains: "\\\\documentclass[ \\t]*(\\[[^\\]]*\\])?[ \\t]*\\{aastex\\}"
    action:
      kind: builtin_transform
      function: bundled_class_shadow
      params:
        target: aastex.cls
        needs: ["emulateapj.cls"]
        include_journal_table: true # \\actaa 族也算触发宏
        cs_set: # aastex 5.0rc3 缺失的 deluxetable/新宏族 (emulateapj 全覆盖)
          [
            tabletypesize,
            tablefontsize,
            tablewidth,
            tablenum,
            tablehead,
            colhead,
            startdata,
            enddata,
            tablecomments,
            tablerefs,
            rotate,
            deluxetable,
            tablebreak,
            figset,
            platecomment,
            splittablenotes,
          ]
        body: |
          \NeedsTeXFormat{LaTeX2e}
          \ProvidesClass{aastex}[2026/09/15 fixloop bundle shadow -> emulateapj]
          \LoadClassWithOptions{emulateapj}
          \providecommand{\rotate}{}
          \endinput
    engines:
      xelatex: { mode: native } # 实际不可达: engine_in 门只放行 tectonic
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1806.06690 tectonic 臂 (fixloop-corpusv2)",
          error: "Undefined control sequence \\actaa → \\tabletypesize (aastex 5.0rc3.1 连环缺)",
        }
    stats: { fires: 1, rescued_cells: 1, status: validated } # 1806.06690 tec 实证 clean
    source_ref: "fixloop-v2 整改; tectonic bundle aastex 版本实证"

  # 新增 (fixloop-v2 整改): AAS 期刊缩写宏缺失 —— tectonic bundle 内置
  # aastex 5.0rc3.1 (1999) 没有 \actaa 族 (emulateapj/后期 aastex 才有);
  # undefined_cs payload (l.N 行末 cs 名) 命中期刊表 → 全表 \providecommand
  # 注入主文件 \documentclass 后。payload 不命中 → False 落 guess。
  - id: journal_cs_polyfill
    description: "AAS 期刊缩写宏缺失 (老 aastex/内置类太旧) → 注入期刊宏表 providecommand"
    phase: loop
    order: 160 # vendored_sty_shadow(150) 之后, undefined_cs_guess(900) 之前
    when: { category: undefined_cs, payload_required: true }
    action:
      kind: builtin_transform
      function: journal_cs_polyfill
      params: {} # 默认表 = builtins._JOURNAL_MACROS; macros: {cs: 展开} 可扩
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "1806.06690 tectonic 臂 (fixloop-corpusv2)",
          error: "Undefined control sequence \\actaa (bundle 内 aastex 5.0rc3.1 无此宏)",
        }
    stats: { fires: 0, status: proposed } # 本语料唯一命中格被 order155 shadow 先接住
    source_ref: "fixloop-v2 整改; emulateapj.cls L1201-1256 期刊表"

