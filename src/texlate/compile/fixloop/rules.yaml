  - id: font_sub_shim
    description: "MF-only 字体包 (bbm 等) → Type1 近亲 (dsfont/dsrom) shim 改写"
    phase: loop
    order: 45 # missing_pfb 在 tectonic 的顺位 (updmap unsupported → 落此)
    when: { category: missing_pfb, payload_required: false }
    condition:
      engine_in: [tectonic]
      shim_known: true # 工程须用了 shim_map 内的 MF-only 包
    action:
      kind: builtin_transform
      function: font_sub_shim
      params:
        exts: [.tex, .sty]
        shim_map:
          bbm:
            {
              usepackage: "dsfont",
              cs_map:
                { mathbbm: "mathds", mathbmss: "mathds", mathbmtt: "mathtt" },
            }
          # 探针实证改写 (ctanfetch-probe §3.5): 注掉 bbm, dsfont 已在 bundle 内
    engines:
