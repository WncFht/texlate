  # repro-1306 (1e 移交, e2e 实证 0 err 7页): revtex4-1 4.1s 的
  # \document@inithook→\switch@array 对 array v2.6n 校验失败仍无条件 \let
  # 换旧协议 \@mkpream/\insert@column → \xdef\@preamble 展开失衡 →
  # Extra \or ×30 → Incomplete \iffalse → Emergency。守卫=\begin{document}
  # 前存真值 + AtBeginDocument 恢复 (排在 revtex inithook 后)。
  # 坑: 只恢复 \@mkpream 会 HANG——mkpream+insert@column 必须成对。
  - id: revtex4_array_swap_guard
    description: "revtex4-1 'Unrecognized array package' 指纹 (校验失败仍换旧协议 \\\\@mkpream/\\\\insert@column) → \\\\begin{document} 前注守卫: 存真值 + AtBeginDocument 恢复"
    phase: loop
    order: 170 # undefined_color_fallback(166) 之后, undefined_cs_guess(900) 之前
    when: { category: syntax }
    condition:
      source_contains: "\\\\documentclass\\s*(\\[[^\\]]*\\])?\\s*\\{revtex4"
      ctx_suggests: "Extra \\\\or"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\begin\\s*\\{document\\}",
              repl: '\\makeatletter\n\\let\\TEXLATE@sv@mkpream\\@mkpream\n\\let\\TEXLATE@sv@insertcol\\insert@column\n\\AtBeginDocument{%\n\\let\\@mkpream\\TEXLATE@sv@mkpream\n\\let\\insert@column\\TEXLATE@sv@insertcol}%\n\\makeatother\n\g<0>',
            }
    risk: low # 守卫幂等 no-op: array 未载/校验已通过时, 存回的就是当前值
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # bundle 内核旧 → 校验或已通过; 守卫仍为 no-op
    provenance:
      - {
          corpus: "1306.0067 (modec-expand-2026-09-16, expand layer)",
          error: "Extra \\or. l.150 \\begin{tabular}{>{\\centering\\arraybackslash}m{1.25in}...} — revtex4-1+dcolumn(array v2.6n) 签名失配",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "bench/results/repro-1306-2026-09-16/ (probe-* 全矩阵 + e2e 7页实证); draft revtex4-array-guard.yaml (1e, d2d82e8)"

  # ─── F4 (2026-09-16): 缺字分诊 —— warnings 段 missing_char 升级类别驱动 ───
  # 两条互斥子路径都在 missing_char_fix 内 (码位×字体 查表):
  #   CJK 落非 CJK 字体 = xeCJK 字体绑定被污染 (elsart \no@harm → \protect
  #   重定义 → \selectfont 失效 → 首用把 xeCJK/<fam>/<ser>/<sh>/<size> 绑死
  #   lmroman; cond-mat/0307508 实跑 4379 缺字根因, /tmp/mc-repro 复现)
  #   → \AtBeginDocument 预热盒在干净上下文先绑常用 size;
  #   符号/拉丁缺字 (≠ U+2260 / − U+2212 / § U+A7 / ø U+F8 / è U+E8)
  #   → char→命令字面替换, 表条目见 builtins._MC_TABLE, params.char_table 可扩。
  - id: missing_char_fix
    description: "无 '!' 错但 log 有 Missing character → 码位分级: CJK→xeCJK 绑定预热, 符号/拉丁→字面替换"
    phase: loop
    order: 25 # 与类别独占, 序位只影响同 category 规则间
    when: { category: warn_missing_char }
    action:
      kind: builtin_transform
      function: missing_char_fix
      params: {}
    risk: low # 预热盒不可见; replace 只动缺字码位本身
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "cond-mat/0307508 (n100-postcutover)",
          error: "Missing character×4379 in lmroman10-regular (CJK 绑定污染)",
        }
      - {
          corpus: "0707.3950 / 0905.4907 / 0806.1079 / 1003.1464 / 1608.02516 / 2403.15096 (n100)",
          error: "Missing character: CJK in cmr/lmroman + ≠−§øè in cm*",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "spec 2026-09-16-batch-hardening-design §9 F4"

  # ─── F4b (2026-09-16, fixer-cjkfont 交付 f7822a8): 缺字第二分级 ——
  # 西里尔/组合符/拉丁扩展带的码位既非 CJK(预热) 也非 char_table 替换
  # 条目 → newunicodechar 逐字绑定 Libertinus Serif 字体回退。
  - id: font_fallback
    description: "Missing character 落西里尔/组合符/拉丁扩展带 → newunicodechar 逐字回退 Libertinus Serif"
    phase: loop
    order: 26 # missing_char_fix(25) 之后: replace 表先吃, 残带内码位走字体回退
    when: { category: warn_missing_char }
    action:
      kind: builtin_transform
      function: font_fallback
      params: {} # fallback_ranges/fallback_font/char_table 可覆盖
    risk: low
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "—", error: "Missing character: 西里尔/组合符落在无字形字体" }
    stats: { fires: 0, status: proposed }
    source_ref: "fixer-cjkfont 交付 (builtins.py f7822a8); 1d 转办 2026-09-16"

  # 2026-09-16 wave-3: early_eof 交互档 (hep-ph/0111248 bundled
  # aipcheck.tex) —— 稿自带 "press <return> to continue" \typein 终端读,
  # nonstop 模式必死。忠实 stub 而非注释: \typein{msg} → \typeout{msg}
  # (横幅照常打印, 跳过等待); 两参形 \typein[\cs]{msg} 是"读入存 cs",
  # 空输入即作者默许的默认 → \typeout{msg}\def\cs{}。
  - id: typein_neutralize
    description: "\\typein 交互读 → \\typeout 打印 (两参形补 \\def\\cs{} 默认空)"
    phase: loop
    order: 180
    when: { category: early_eof, payload_required: false }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "\\\\typein\\s*\\[\\s*(\\\\[a-zA-Z@]+)\\s*\\]\\s*(\\{[^{}]*\\})",
              repl: '\\typeout\g<2>\\def\g<1>{}',
            }
          - {
              pattern: "\\\\typein(\\s*\\{)",
              repl: '\\typeout\g<1>',
            }
    risk: low # nonstop 下交互本就不可能; msg 保留在 transcript
    known_gap: "msg 内嵌套 {} 时两参形不命中 ({[^{}]*} 边界) → 落单参形也不中 (后跟 [) → applied=False; 裸 \\read-1 原语未覆盖"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop2-delta early_eof (hep-ph/0111248)",
          error: "aipcheck.tex \\typein{* Type <return> to continue ...} → \\end occurred, 0 pages",
        }
    stats: { fires: 0 }
    source_ref: "wave-3: early_eof 类目首个消费规则 (交互面)"

  # fixable-data 裁定 (2211.13028/2308.12612, 1d 已批): doc 强指 dvi/pdf
  # 驱动给 hyperref 家族, xelatex 下必炸 "Wrong driver option"/
  # "Wrong hyperref driver"。剥除一切选项括号内的驱动词让 hyperref/
  # graphicx 自侦 hxetex —— docclass 全局选项同样覆盖 (剥离对 xetex
  # 恒正确: 这些驱动在 XeTeX 下本来就走不通)。hypdvips 整包换 hyperref
  # (它只为 dvips 路由存在; doc 若另载 hyperref, 二次加载无害)。
  - id: hyperref_driver_neutralize
    description: "hyperref 家族驱动选项 (pdftex/dvips/…) + hypdvips → 剥词/换包, 交自侦"
    phase: loop
    order: 181 # typein_neutralize(180) 之后; early_eof/hyperref_driver 双签兜底
    when:
      any:
        - { category: hyperref_driver, payload_required: false }
        - { category: early_eof, payload_required: false }
    condition:
      source_contains: "hypdvips|\\[[^\\]]*\\b(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\b"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # hypdvips → hyperref (选项面保留, 多为 hyp* 公共键)
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]\\n]*\\]\\s*)?)\\{hypdvips\\}",
              repl: "\\g<1>{hyperref}",
            }
          # 全驱动括号: [dvips] / [dvips,pdftex] → [] (括号可跨行)
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\]",
              repl: "[]",
            }
          # 括号首位驱动词: [dvips,opt] → [opt]
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "[",
            }
          # 中段/末位驱动词: [opt,dvips,opt2] / [opt,dvips] → [opt,opt2]/[opt]
          - {
              pattern: "(\\[[^\\]]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\])",
              repl: "\\g<1>",
            }
          # PassOptionsToPackage/Class 首参同三套 (大括号形)
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\}",
              repl: "\\g<1>}",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "\\g<1>",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\})",
              repl: "\\g<1>",
            }
          # 空括号清扫: \usepackage[]{x} → \usepackage{x}
          - {
              pattern: "(\\\\(?:documentclass|usepackage|RequirePackage))\\s*\\[\\s*\\]",
              repl: "\\g<1>",
            }
    risk: low # xetex 下这些驱动本就失效; 自侦即作者意图
    known_gap: "doc 若用 hypdvips 专属 cs (嵌入 PS 钩子) 会前进到 undefined_cs → cs_targeted_fix; \\hypersetup 内驱动键、非括号赋值 (\\def\\@driver) 未覆盖"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同驱动面
    provenance:
      - {
          corpus: "fixable-data adjudication (2211.13028, 2308.12612)",
          error: "hypdvips: Wrong hyperref driver `hxetex' / hyperref: Wrong driver option `pdftex'",
        }
    stats: { fires: 0 }
    source_ref: "scout-fail59 fixable-data §4 驱动剥除 (1d 批准); taxonomy hyperref_driver 签名同期扩三形态"

  # 上古 REVTeX 4 系 (v4.0rc ~/texmf 阴影件 / revtex4b* TL 缺席) vs 现代内核:
  # \@uclcnotmath 路径上 \NoCaseChange{##} 塌缩成裸 # → \protected@edef
  # \reserved@a 撞 Illegal parameter number (traced, zh/en 同炸 —— 类文件
  # 本体过时非译文问题); revtex4b4 直接 missing_file。revtex4-2 是现行
  # TL 兼容实现, docclass 改写 6 格实测全出 pdf (slac_one/slac_two .rtx
  # 期刊子式在 4-2 下仅 unknown-option warning)。
  - id: revtex4_legacy_class_rewrite
    description: "\\documentclass{revtex4{,b*}} (v4.0rc 上古系) → revtex4-2"
    phase: loop
    order: 182 # hyperref_driver_neutralize(181) 之后, undefined_cs_guess(900) 之前
    when:
      any:
        - { category: syntax }
        - { category: missing_file }
        - { category: capacity }
    condition:
      # 花括号精确形 {revtex4}/{revtex4b4}: revtex4-1/revtex4-2 不误中;
      # 括号组 [^\]] 允许 docclass 选项跨行 (babel 组先例)。
      source_contains: "\\\\documentclass(?:\\s*\\[[^\\]]*\\])?\\s*\\{revtex4(?:b\\d*)?\\}"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex] # suffix 匹配 lowercase, .TEX 同收 (physics/0104031)
        rewrites:
          # 只改 docclass 花括号: \ProvidesClass{revtex4} (bundled cls 内)
          # 与正文散见 {revtex4} 字串不动。
          - {
              pattern: "(\\\\documentclass\\s*(?:\\[[^\\]]*\\]\\s*)?\\{)revtex4(?:b\\d*)?\\}",
              repl: "\\g<1>revtex4-2}",
            }
    risk: low # revtex4-2 向后兼容 4.0 文档面; 上古 cls 在现代内核已无救
    known_gap: "revtex4 专属旧 cs (\\preprint/旧 \\iftwocolumn 面) 若用则前进 undefined_cs → cs_targeted_fix; endfloats 等旧选项 4-2 有同名面"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 内核不兼容与引擎无关
    provenance:
      - {
          corpus: "loop1 unfixable cluster (1109.2144/1109.2205/1109.5313/1012.1830/hep-ph--0605134 均 slac_one|slac_two+revtex4; physics/0104031 revtex4b4)",
          error: "Illegal parameter number in definition of \\reserved@a / File `revtex4b4.cls' not found / TeX capacity exceeded",
        }
    stats: { fires: 0 }
    source_ref: "manual bisect 1109.2205: revtex4+ctex+title+maketitle+section 充要, 纯 en 同炸 → 类文件/内核不兼容; revtex4-2 替换 6/6 出 pdf"

  - id: docclass_post_option_normalize
    description: "\\documentclass{X}[opts] 后置选项畸形 → 孤儿 [opts] 行归位 \\documentclass[opts]{X}"
    phase: loop
    order: 183 # revtex4_legacy_class_rewrite(182) 之后, undefined_cs_guess(900) 之前
    when:
      any:
        - { category: syntax }
        - { category: undefined_cs }
    condition:
      # 孤儿选项行: segmenter 把 src 同行 `\documentclass{X}[opts]` 的
      # [opts] 段拆成独立块, splice 落 preamble 孤行 → Missing \begin{document}。
      source_contains: "(?m)^[ \\t]*\\[[0-9a-zA-Z,=.\\- ]+\\][ \\t]*$"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          # 既有选项 → 尾部合并: \documentclass[a]{X}…^[o]$ → \documentclass[a,o]{X}
          # 中间段以 \begin{document} 回火——正文内孤立 [x] 行不越界吞。
          - {
              pattern: "(\\\\documentclass[ \\t]*\\[[^\\]\\n]*)\\]([ \\t]*\\{[^}\\n]*\\})((?:(?!\\\\begin\\{document\\})[\\s\\S])*?)^[ \\t]*\\[([0-9a-zA-Z,=.\\- ]+)\\][ \\t]*$",
              repl: "\\g<1>,\\g<4>]\\g<2>\\g<3>",
              flags: [MULTILINE],
            }
          # 无既有选项 → 新建选项组: \documentclass{X}…^[o]$ → \documentclass[o]{X}
          - {
              pattern: "(\\\\documentclass[ \\t]*)(\\{[^}\\n]*\\})((?:(?!\\\\begin\\{document\\})[\\s\\S])*?)^[ \\t]*\\[([0-9a-zA-Z,=.\\- ]+)\\][ \\t]*$",
              repl: "\\g<1>[\\g<4>]\\g<2>\\g<3>",
              flags: [MULTILINE],
            }
    risk: low # 选项归位是源作者本意; 仅 preamble 内孤行, 正文 [x] 行不达
    known_gap: "多孤儿行只归位最近一条 (per-docclass 单匹配); 选项序改变 (o 尾插) 与源序不同但语义同"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "loop1 unfixable:syntax (1206.2111 schulze.tex src l.1 `\\documentclass{article}[12pt]`)",
          error: "LaTeX Error: Missing \\begin{document} @ splice l.36 (孤儿 [12pt] 行)",
        }
    stats: { fires: 0 }
    source_ref: "1206.2111 zh l.41 孤儿 [12pt] 在 inject 块后 preamble 内; src 原形 \\documentclass{article}[12pt] 同行后置"

