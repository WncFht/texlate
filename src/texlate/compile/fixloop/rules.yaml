              \IfFileExists{axodraw2.sty}{\RequirePackage{axodraw2}}{%
                \def\Line(#1,#2)(#3,#4){}%
                \def\DashLine(#1,#2)(#3,#4)#5{}%
                \def\ArrowLine(#1,#2)(#3,#4){}%
                \def\DashArrowLine(#1,#2)(#3,#4)#5{}%
                \def\Gluon(#1,#2)(#3,#4)#5#6{}%
                \def\Photon(#1,#2)(#3,#4)#5#6{}%
                \def\ZigZag(#1,#2)(#3,#4)#5#6{}%
                \def\ArrowArc(#1,#2)(#3,#4,#5){}%
                \def\GlueArc(#1,#2)(#3,#4,#5)#6#7{}%
                \def\PhotonArc(#1,#2)(#3,#4,#5)#6#7{}%
                \def\ZigZagArc(#1,#2)(#3,#4,#5)#6#7{}%
                \def\Vertex(#1,#2)#3{}%
                \def\ECirc(#1,#2)#3{}%
                \def\BCirc(#1,#2)#3{}%
                \def\GCirc(#1,#2)#3#4{}%
                \def\Text(#1,#2)#3[#4]#5{#5}%
                \def\EText(#1,#2)#3{}%
                \def\GOval(#1,#2)#3#4(#5,#6)[#7]{}%
                \def\BBox(#1,#2)(#3,#4){}%
                \def\BBoxc(#1,#2)(#3,#4){}%
              }
              \endinput
          # emulateapj5/emulateapj 只有 .cls 实体 (TL 无 .sty)——老稿以
