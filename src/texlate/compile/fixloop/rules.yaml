              \providecommand{\biota}{\boldsymbol{\iota}}
              \providecommand{\bkappa}{\boldsymbol{\kappa}}
              \providecommand{\blambda}{\boldsymbol{\lambda}}
              \providecommand{\bmu}{\boldsymbol{\mu}}
              \providecommand{\bnu}{\boldsymbol{\nu}}
              \providecommand{\bxi}{\boldsymbol{\xi}}
              \providecommand{\bpi}{\boldsymbol{\pi}}
              \providecommand{\brho}{\boldsymbol{\rho}}
              \providecommand{\bsigma}{\boldsymbol{\sigma}}
              \providecommand{\btau}{\boldsymbol{\tau}}
              \providecommand{\bupsilon}{\boldsymbol{\upsilon}}
              \providecommand{\bphi}{\boldsymbol{\phi}}
              \providecommand{\bchi}{\boldsymbol{\chi}}
              \providecommand{\bpsi}{\boldsymbol{\psi}}
              \providecommand{\bomega}{\boldsymbol{\omega}}
              \providecommand{\bGamma}{\boldsymbol{\Gamma}}
              \providecommand{\bDelta}{\boldsymbol{\Delta}}
              \providecommand{\bTheta}{\boldsymbol{\Theta}}
              \providecommand{\bLambda}{\boldsymbol{\Lambda}}
              \providecommand{\bXi}{\boldsymbol{\Xi}}
              \providecommand{\bPi}{\boldsymbol{\Pi}}
              \providecommand{\bSigma}{\boldsymbol{\Sigma}}
              \providecommand{\bUpsilon}{\boldsymbol{\Upsilon}}
              \providecommand{\bPhi}{\boldsymbol{\Phi}}
              \providecommand{\bPsi}{\boldsymbol{\Psi}}
              \providecommand{\bOmega}{\boldsymbol{\Omega}}
              \providecommand{\bnabla}{\boldsymbol{\nabla}}
              \providecommand{\bpartial}{\boldsymbol{\partial}}
              \endinput
          # kastrup 的 binhex 真身在 TL: overrides 钉 binhex.tex→kastrup 对
          # 全引擎生效, xelatex 侧 tlmgr 装真包即可; tectonic 侧 ctan_fetch
          # 的 OVERLAY_EXTS 不收 .tex (平铺会撞名遮蔽工程源文件) → 真身永远
          # 落不了地, 本 stub 即 tectonic 通路兜底。newtxtext.sty 实需可展开
          # \nhex{<位数>}{<数>} —— expl3 全展开实现, 宽度=高位补零 (加 base^w
          # 再丢首位)。2211.04574 实证。
          binhex.tex:
            body: |
              \ExplSyntaxOn
              % 高位补零到宽 w: 数字位数 < w 时递归前缀 0 (可展开)
              \cs_new:Npn \fixloop_pad:nn #1#2
                {
                  \int_compare:nTF { \tl_count:n {#1} < #2 }
                    { \fixloop_pad:nn { 0 #1 } {#2} }
                    { #1 }
                }
              \cs_new:Npn \fixloop_nbase:nnn #1#2#3
                {
                  \exp_args:Ne \fixloop_pad:nn
                    { \int_to_Base:nn { \int_eval:n {#3} } { \int_eval:n {#1} } }
                    { #2 }
                }
              \cs_new:Npn \nbinbased #1#2#3 { \fixloop_nbase:nnn { \fp_eval:n { round ( 2 ** #1 ) } } {#2} {#3} }
              \cs_new:Npn \nhex #1#2 { \fixloop_nbase:nnn {16} {#1} {#2} }
              \cs_new:Npn \noct #1#2 { \fixloop_nbase:nnn {8} {#1} {#2} }
              \cs_new:Npn \ntetra #1#2 { \fixloop_nbase:nnn {4} {#1} {#2} }
              \cs_new:Npn \nbinary #1#2 { \fixloop_nbase:nnn {2} {#1} {#2} }
              \cs_new:Npn \hex #1 { \fixloop_nbase:nnn {16} {1} {#1} }
              \cs_new:Npn \oct #1 { \fixloop_nbase:nnn {8} {1} {#1} }
              \cs_new:Npn \tetra #1 { \fixloop_nbase:nnn {4} {1} {#1} }
              \cs_new:Npn \binary #1 { \fixloop_nbase:nnn {2} {1} {#1} }
              \ExplSyntaxOff
              \endinput
          # espcrc2 (Elsevier CRC 会议样式, 不在 TL): 实证 hep-lat/0111009 +
          # hep-ph/0111218 —— \author{Name\address[tag]{affil}} 约定。
          espcrc2.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{espcrc2}[2026/09/16 fixloop legacy shim -> article + polyfills]
              % \address 在 \author 参数体内调用 → 落在 article \maketitle 的
              % tabular cell 里: 组内 \\ 会炸, 用 \newline 并把参数内 \\ 同义化
              \providecommand{\address}[2][]{\newline{\let\\\newline\footnotesize #2}}
              \providecommand{\email}[1]{\texttt{#1}}
              \providecommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              \providecommand{\PACS}[1]{\par\noindent\textbf{PACS:} #1\par}
              \@ifundefined{keyword}{\newenvironment{keyword}{\par\noindent\textbf{Keywords:}\space}{\par}}{}
