          osajnl2.cls: { body: *osa_body }
          # SISSA 高能类 (JHEP/JHEP3/jhep/jcap 作者包, 不在 TL) —— article +
          # polyfill; \preprint/\keywords/\emailAdd/\affiliation 全在导言区
          # 调用 → 收集制 (affiliation 攒到 \maketitle 后输出), 其余 no-op。
          JHEP.cls:
            body: &sissa_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{jhep-family}[2026/09/16 fixloop legacy shim -> article + SISSA polyfills]
              \LoadClassWithOptions{article}
              \providecommand{\preprint}[1]{}
              \providecommand{\keywords}[1]{}
              \providecommand{\emailAdd}[1]{}
              \providecommand{\arxivnumber}[1]{}
              \providecommand{\proceeding}[1]{}
              \providecommand{\collaboration}[1]{}
              \def\fixsissa@affils{}
              \providecommand{\affiliation}[2][]{\g@addto@macro\fixsissa@affils{\par{\footnotesize #2}}}
              \let\fixsissa@maketitle\maketitle
              \renewcommand{\maketitle}{\fixsissa@maketitle\begingroup\fixsissa@affils\par\endgroup}
              \endinput
          JHEP3.cls: { body: *sissa_body }
          jhep.cls: { body: *sissa_body }
          jcap.cls: { body: *sissa_body }
          # CUP jpp.cls (J. Plasma Physics 作者包, 不在 TL) —— article +
          # 双参 \title/\author (jpp 约定 \title[short]{long})。
          jpp.cls:
