# rules.yaml — fixloop 编译修复规则表 (schema v1.1)
#
# 来源: bench/py/fixloop.py spike (冷 TEXMFHOME, 22 格, 16/16 救回) 的
# 硬编码修复逻辑 → 数据化; 另并入 docs/08 §5.2 实证缺口回填的 9 条新规则。
# v2 (2026-09-15 corpus_v2 40 篇实测整改): eps_route 由 fileset 静态拒改
# log 确证 (ps_image taxonomy + eps_to_pdf 救回 + 兜底拒); pstricks 独立成
# pstricks_route; legacy_pkg_shim 接住退役包; aastex_bundle_shadow 遮蔽
# tectonic 内置老类 (aastex 5.0rc3); journal_cs_polyfill 补期刊缩写宏;
# undefined_cs payload 改抓 l.N 行末 cs 名; latex209 gate 修行锚定防注释误杀。
# 整改后 tectonic 臂 FAIL→pdf 1/16→12/16, reject 21→10 格, union pdf
# 32→34/40, 零回归。missing_tfm 对账: 全 8 格经 install_tfm 修复、零
# unfixable; astro-ph/0306068 xelatex 的 unfixable:other 实系 wdir 自带
# 化石类 caps.cls (1997 CUP) 手工重实现 tabular 内核 (\hbox\bgroup$ +
# \@tabarray + \ifnum0=`} 技巧) 与 LaTeX2e≥2024 内核不兼容 —— 任意
# \chapter 即炸 "Extra }, or forgotten $.", 可恢复错被 halt-on-error
# 提升为致命; tectonic bundle LaTeX2e 2021 不受影响 → clean。判为正确
# 裁决 (修需改写对方 cls 内核, 无可泛化规则), 留痕备查。
# 社区贡献入口 = 新增/修改本文件条目。
#
# 两层结构:
#   taxonomy: log 文本 → (category, payload)      —— "这是什么错"
#   rules:    (category, payload) → 修复动作       —— "怎么修"
# 新增一个修复通常只需在 rules 追加一条 (复用已有 category);
# 只有新错误形态才需要加 taxonomy 行。
#
# 语法约定: pattern/repl 均按 Python re 语义; repl 里 \g<N> 为分组引用;
# action.function 表示该动作是命名内置函数 (算法型, 非纯 regex,
# 注册表在 builtins.py —— 新函数才需要 PR 代码)。
# 书写约束: flow 集合 {..}/[..] 必须单行写完 (子集解析器不跨行)。
#
# 每条规则逐条带注释: 出处为 spike 行号 (fixloop.py Lxxx) 或 docs/08 行号。

version: 1

meta:
  source: "bench/py/fixloop.py + docs/08 §5"
  generated: "2026-09-15"
  engine_default: xelatex
  loop:
    max_rounds: 8 # spike L40
    one_rule_per_round: true # 每轮只应用一条成功规则, 便于归因 (L549-565)
    dedup_key: "{rule_id}:{payload}" # ctx.applied, 同规则同负载不重复 (L552,561)
    stuck_sig_repeat: 3 # 同 category:payload 连续 3 轮 → verdict=stuck (L756-761)
    clean_err_max: 3 # pdf 且 '!' 错 ≤3 → acceptable (L41, L786-791)
    compile_passes: 2 # 第二轮仅在已出 pdf 时跑 (L628-630)
    timeout_sec: 120
    warn_demote: false # warnings 只记录不改判; §4.3 clean 三件套在 pipeline 层做
    warn_driven_fixes: true # v1.1: 错误全无时 warnings 可驱动 warn_* 类别修复轮

# ────────────────────────────────────────────────────────────────
# 引擎能力位: 决定每条规则的 action 用 native 还是 degrade 路径
# ────────────────────────────────────────────────────────────────
capabilities:
  xelatex:
    kpsewhich: true
    tlmgr: true
    updmap: true
    shell_escape: true
    bundle: false
  tectonic:
    kpsewhich: false # 无 kpsewhich; 以"本地文件存在+bundle 含不含"近似
    tlmgr: false # 无 tlmgr → install_* 走 ctan_fetch 降级
    updmap: false # 无 updmap; 字体 map 由 bundle 内部管理
    shell_escape: partial # 新版支持但受限; minted 场景按不可完全依赖处理
    bundle:
      true # bundle 内建按需拉文件 (install_file 等价物),
      # 但只覆盖 bundle 索引内文件; 物理字体仍须改写规则

# ────────────────────────────────────────────────────────────────
# 共享知识: file → TeX Live 包名 索引 (install_* 动作的 oracle)
# xelatex: tlmgr search --global --file '/X' (fixloop.py L176-208)
# tectonic: 离线解析 texlive.tlpdb 生成的静态索引 + overrides 手工表
#   (ctan.py: tlpkg/texlive.tlpdb.xz ~2.8MB → 8148 包 / 138K basename,
#    filemap.json ~5.5MB, 构建 0.14s, 缓存 ~/.cache/texlate/)
# ────────────────────────────────────────────────────────────────
filemap:
  xelatex_oracle: "tlmgr search --global --file '/{fname}'"
  tectonic_oracle: "texlive.tlpdb 离线索引 (随规则库分发, 定期重建)"
  cache: "全局 json 缓存, file→[pkg] (远端仓库知识, 与环境冷热无关)"
  denylist_platform_suffixes: # 过滤平台特定包条目 (L190-204)
    [windows, win32, macosx, linux, x86_64, aarch64, amd64, i386, universal]
  denylist_prefixes: [tlmgr, tlgs]
  overrides: {} # 社区贡献: "fname": "tl_pkg" 手工映射兜底
  # 例: "iclr14submit_e.sty": null   # TL 无此包 → 预检扫描的已知噪声
  version_guard: # docs/08 §5.2 第9条: ctan_fetch 版本前置检查
    enabled: true # tlnet 只发最新; 新版对 bundle 的 expl3/LaTeX2e 太旧会拒载
    texlive_format_epoch: "2022-07-14" # tectonic bundle 快照年代 (ctanfetch-probe §3.4)

# ────────────────────────────────────────────────────────────────
# log 尾部红线 warning 扫描 (docs/08 §4.3): 只记录进 cell.warnings,
# 其中 invalid_utf8 在无 '!' 错时升级为 warn_utf8 类别驱动修复轮。
# ────────────────────────────────────────────────────────────────
warnings:
  - {
      id: invalid_utf8,
      pattern: "Invalid UTF-8 byte|Missing character.*U\\+FFFD",
    }
  - { id: missing_char, pattern: "Missing character" } # CJK 渲染检查原料
  - {
      id: missing_graphic,
      pattern: "File `[^']+\\.(eps|png|jpg|pdf)' not found|cannot (find|open) image",
    }
  - { id: tectonic_degrade, pattern: "^!+ .*not found" } # tectonic File..not found 降级行

# ════════════════════════════════════════════════════════════════
# 第一层: 分类学 —— log → (category, payload)
# 评估序: 存在 '!' 行时按序首命中 (scope:head, 输入='!'行+其后8行);
#         全文无 '!' 行时评估 scope:tail 段 (输入=log 末 30 行);
#         仍无命中但有 warning 命中 → scope:warnings 驱动 warn_* 类。
# 对应 fixloop.py classify() L67-125。
# ════════════════════════════════════════════════════════════════
taxonomy:
  # —— 文件缺失类 (抓文件名 → install_file) ——
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "File `([^']+\\.[a-zA-Z0-9]+)' not found",
    }
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "I can't find file `([^']+)'",
    }
  # —— TFM 字体缺失 (抓字体名=文件名 → install_tfm) ——
  - {
      id: missing_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Font \\\\?\\S*?=?\\s*([a-zA-Z0-9]+) at [0-9.]+pt not loadable",
    }
  - {
      id: missing_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Metric \\(TFM\\) file[^\\n]*?(\\w+)\\.(tfm)",
    }
  # —— fontspec 时代错配 / 系统字体缺失 ——
  - {
      id: xetexglyph_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Cannot use XeTeXglyph with (\\S+)",
    }
  - {
      id: missing_pfb,
      scope: head,
      pattern: "Cannot proceed without .vf|physical font",
    }
  # —— xdvipdfmx PS 硬墙 (tectonic 无 gs 通道; 实证签名 fixloop-v2 整改) ——
  # compilebench taxonomy 对应类别名 ps_image; 首错为
  # "! something bad happened inside xdvipdfmx" (stdout_tail 归一),
  # ctx8 内含 "caused by: pdf: image inclusion failed for "X.eps""。
  - {
      id: ps_image,
      scope: head,
      payload_group: 1,
      pattern: 'image inclusion failed for "([^"]+\.(?:eps|ps|EPS|PS))"|PostScript images are not supported',
    }
  - {
      id: fontspec_missing,
      scope: head,
      payload_group: 1,
      pattern: 'font [“"]([^”"]+)[”"] cannot be found',
    }
  # —— 源码级 ——
  - { id: illegal_unit, scope: head, pattern: "Illegal unit of measure" }
  - {
      id: option_clash,
      scope: head,
      payload_group: 1,
      pattern: "Option clash for package ([\\w-]+)",
    }
  - {
      id: already_def,
      scope: head,
      payload_group: 1,
      pattern: "Command \\\\?([\\w@]+) already defined",
    }
  - {
      id: soul_err,
      scope: head,
      pattern: "Package soul Error|Reconstruction failed",
    }
  - { id: hyphenation, scope: head, pattern: "Not a letter" }
  - {
      id: minted_froz,
      scope: head,
      pattern: "frozencache|Cannot highlight code",
    }
  - {
      id: latex209,
      scope: head,
      pattern: "documentstyle|LaTeX ?2\\.09|LaTeX2e command .* in LaTeX 2\\.09",
    }
  # undefined_cs 命中后再细分 pdfTeX 原语 (L110-114)
  # payload = 出错行 l.N 上最后一个 \cs (TeX 错误展示约定: 冒犯 cs 在该行末),
  # 供 journal_cs_polyfill 等按名命中; 无 l. 行时 payload=None 正常降级。
  - id: undefined_cs
    scope: head
    pattern: "Undefined control sequence(?:[\\s\\S]*?l\\.\\d+[^\\n]*\\\\([a-zA-Z@]+))?"
    payload_group: 1
    subclassify:
      { pattern: "\\\\(pdf[a-zA-Z@]+)", into: pdftex_prim, payload_group: 1 }
  - { id: capacity, scope: head, pattern: "TeX capacity exceeded" }
  - {
      id: emergency,
      scope: head,
      pattern: "Emergency stop|cannot \\\\read|Fatal error|job aborted",
    }
  - {
      id: env_mismatch,
      scope: head,
      pattern: "begin\\{[^}]*\\}.*ended by|Extra \\\\end",
    }
  - id: syntax
    scope: head
    pattern: "Missing|Runaway|Paragraph ended|Misplaced|Double subscript|Illegal|There's no line|Lonely|Bad math|Something's wrong|not in outer par|allowed only in math|improper"
  - { id: other, scope: head, pattern: "^!" } # 兜底: 有 '!' 行必命中
  # —— tail 段: 仅当全文 0 个 '!' 行时评估 (交互式缺文件/Emergency) ——
  - {
      id: missing_file,
      scope: tail,
      payload_group: 1,
      pattern: "File `([^']+\\.[a-zA-Z0-9]+)' not found",
      guard: "Enter file name|Emergency",
    }
  - {
      id: missing_file,
      scope: tail,
      payload_group: null,
      pattern: "Enter file name",
    }
  - { id: latex209, scope: tail, pattern: "documentstyle|LaTeX ?2\\.09" }
  # —— warnings 段: 无 '!' 且无 tail 命中, 但 warning 红线命中 (v1.1) ——
  - { id: warn_utf8, scope: warnings, warn_id: invalid_utf8 } # docs/08 §5.2 non_utf8_source 的类别入口
  # 都不中: err 为空 → clean; err 非空 → other

# ════════════════════════════════════════════════════════════════
# 第二层: 修复规则 (16 spike + 9 新增 = 25 条)
# phase: gate(每轮分类后最先评估) / precheck(编译前一次性) / loop(每轮)
# 同 phase 内按 order 升序, 首个 when+condition 满足且 dedup 未命中的执行。
# engines.<name>.mode: native | same(源改写天然可移植) | degrade | unsupported | skip
# condition 原语: tool_available / cap_available / engine_in /
#   main_head_contains / source_contains / ctx_suggests / fileset /
#   vendored_shadow / package_version_ge / prim_read_form /
#   shim_known / cache_dir_glob / any:[...]  (未知键 → 规则跳过, fail-closed)
# ════════════════════════════════════════════════════════════════
rules:
  # ─── gate: 路由拒绝先于一切修复尝试 ───
  # spike 语义: 主循环 L748-755 在 pick_and_apply 之前短路,
  # 等效于最高优先级 → 用 phase:gate 显式建模。
  - id: latex209_reject
    description: "LaTeX 2.09 文档 (\\documentstyle/化石 cls) → 路由拒绝, 转 latex+dvips 通道"
    phase: gate
    order: 1
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: mhc 子串会被注释 %\documentstyle 误中 (1806.06690);
        # 加行锚定复核 —— 真 2.09 文档的 \documentstyle 必在行首。
        source_contains: "(?m)^[ \\t]*\\\\documentstyle",
      }
    action:
      kind: reject_route
      params: { route: "latex+dvips", reason: "LaTeX 2.09 document" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 路由层策略, 与引擎无关
    provenance:
      - {
          corpus: "hep-th 类语料 (hjfy 经验移植)",
          error: "LaTeX2e command in LaTeX 2.09 document",
        }
    stats: { fires: 0, status: proposed } # 本轮语料未触发, 为 2.09 论文预留
    source_ref: "fixloop.py L508-520, L748-755"

  # 新增 (docs/08:273): pstricks 文档走 dvips 路由前的 .pro 前置检查
  - id: pstricks_dvips_preflight
    description: "pstricks 文档被路由 latex+dvips 前, 预检 pst-tools.pro 等 dvips 资源存在"
    phase: gate
    order: 0 # 先于 latex209_reject(1): pstricks 时先记 .pro 预检信息再路由
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: documentstyle 行锚定 (注释不命中) AND pstricks 依赖,
        # 单 pattern 内顺序表达: \documentstyle 恒在文档头部先于包引用。
        source_contains: "(?ms)^[ \\t]*\\\\documentstyle[\\s\\S]*?(\\\\usepackage(\\[[^\\]]*\\])?\\{pstricks|pspicture|\\\\psset)",
      }
    action:
      kind: builtin_transform
      function: pstricks_dvips_preflight # 缺 .pro → REJECT note 附 advisory; 全在 → 正常 reject
      params: { require_files: ["pst-tools.pro"], route: "latex+dvips" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "—", error: "dvips 兜底缺 .pro 时白跑一路由 (docs/08:273)" }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L273"

  # ─── precheck: 静态路由 + 第 0 招装包, 不进循环 ───
  # v2 整改 (fixloop-corpusv2 实测): 原 eps_route 按 fileset 静态拒 .eps 工程,
  # 实证误杀 —— tectonic 对部分 eps 工程能出 pdf~ (0812.4521/nucl-th/0104042
  # baseline 即 pdf~), 且 epstopdf 转换可整格救回 (0903.0543/1406.1994 手测
  # 出 pdf)。.eps 文件 → 循环内 log 确证的 ps_image 规则处理 (见 loop);
  # 此处只留代码级 PS 依赖 (pstricks/pspicture) 的预检路由 —— 无转换路径。
  - id: pstricks_route
    description: "pstricks/pspicture/\\psset 源码依赖 → tectonic 无可行路径, 预检路由 xelatex"
    phase: precheck
    order: -10 # 路由决策先于装包预检
    when: { always: true }
    condition:
      engine_in: [tectonic]
      source_contains: "\\\\usepackage(\\[[^\\]]*\\])?\\{(pstricks|pst-\\w+)\\}|pspicture|\\\\psset"
    action:
      kind: reject_route
      params:
        { route: "xelatex", reason: "pstricks/pspicture hard wall on tectonic" }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 下 pstricks 可走 (dvips 后端另议), 不触发
    provenance:
      - {
          corpus: "pstricks-probe (docs/research/latex/pstricks-route.md)",
          error: "xdvipdfmx EPS hard wall",
        }
    stats:
      {
        fires: 0,
        note: "v1 为 eps_route fileset 版; v2 拆出 .eps 改走 ps_image 循环规则",
      }
    source_ref: "docs/08-translate-compile.md L218, L271; fixloop-v2 整改"

  - id: static_precheck
    description: "静态扫全部源码的 \\usepackage|\\RequirePackage|\\documentclass → 探测缺失 → filemap 批量装包 (一次装好, 省 N 轮循环)"
    phase: precheck
    order: 0
    when: { always: true }
    action:
      kind: scan_install
      params:
        scan_patterns:
          - {
              regex: "\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              split: ",",
              suffix: ".sty",
            }
          - {
              regex: "\\\\documentclass\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              suffix: ".cls",
            }
        verify: file_probe # kpsewhich / 本地探测
        batch: true # 聚合后单次安装 (L611-617)
        noise_filter: "^[\\w.-]+$" # 滤掉 '\\\\@tempb.sty' 类误捕 token (见 known_gaps)
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: skip # bundle 按需拉包, 预检基本多余
        fallback: ctan_fetch # 增强位: 仅做本地存在性检查, 缺则 ctan_fetch
        note: "bundle 没有的包 (自定义 sty) 仍值得预检 → 保留轻量版"
    provenance:
      - { corpus: "*", error: "冷 TEXMFHOME 下高频 missing_file" }
    stats: { fires: 22, note: "22/22 格执行; 每格装 0-9 包" }
    source_ref: "fixloop.py L594-618"

  # ─── loop: install 系 —— 环境缺失优先于源码改写 ───
  - id: install_file
    description: "缺文件 (.sty/.cls/.fd/.def/…) → filemap 查包 → 安装 → 探测复核"
    phase: loop
    order: 10
    when: { category: missing_file, payload_required: true }
    action:
      kind: install_file
      params:
        file: "{payload}"
        font_related_exts: [tfm, pfb, vf, fd, map, enc] # 命中扩展名 → 装后重建 map (L307)
        verify: file_probe # 装后复核; 仍缺 → applied=False 落后续规则 (L274-275)
        already_present_ok: true # 探测已在 → 记 applied (L268-269; 见 known_gaps 归因噪音)
    engines:
      xelatex:
        { mode: native, via: "tlmgr search --file → tlmgr --usermode install" }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # filemap(tlpdb 索引)→tlnet archive→解包到工作目录/本地 texmf
        fallback: advisory # 索引查不到 → 产出建议性报错 (附候选包名)
    provenance:
      - { corpus: "1706.03762/baseline", error: "File `import.sty' not found" }
      - {
          corpus: "1810.04805/*",
          error: "File `xifthen.sty' / `ifmtarg.sty' not found",
        }
      - {
          corpus: "*/ctex|zh (14格)",
          error: "File `zhnumber.sty' not found (ctex 注入链)",
        }
    stats: { fires: 26, rescued_cells: 17 }
    source_ref: "fixloop.py L301-311, L264-276"

  # 新增 (fixloop-v2 整改): 退役/改名包 shim —— install_file 查无真包后的出路。
  # 实证: 1806.06690 缺 aastex.cls → emulateapj 顶替出 13 页全文档 pdf;
  # psfig→epsfig 桥可用因 epsfig 的 Gin key 同收 figure=/file= (graphics pkg,
  # TL 内装得上)。真 2.09 文档到不了这里 —— gate 先拒, 语义分层干净。
  - id: legacy_pkg_shim
    description: "退役/改名包 (aastex/revtex.cls/psfig.sty 老名) → wdir 注入同名 stub + 装依赖"
    phase: loop
    order: 12 # install_file(10) 之后: 真包装得上先用真包, 查无才 shim
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: legacy_pkg_shim
      params:
        shim_map:
          # aastex→emulateapj 需自定义 body: emulateapj 的 deluxetable 重实现
          # 明写 \rotate 不支持 (cls 注释 "too difficult to implement"),
          # \providecommand 空宏保底 —— 表格竖排不换向, 内容全保 (1806.06690)。
          # \ProvidesClass 版本串必须日期开头, 否则 \@ifl@t@r 解析崩 \ifnum。
          aastex.cls:
            needs: ["emulateapj.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
