  # fixer-misschar A2 批落地 (827674d): \ifdefined 守卫防撞名 + 逐字
  # \newunicodechar 去重幂等。
  - id: cjk_font_fallback
    description: "CJK 缺字落 8-bit tfm 文本字体 (绑定污染残例) → newunicodechar 逐字回退 FandolSong"
    phase: loop
    order: 27 # font_fallback(26) 之后; CJK 段与非 CJK 带互不重叠, 两规独立挂
    when:
      any:
        - { category: warn_missing_char }
        - { category: warn_utf8 } # 同 missing_char_fix —— 类别排他 quirk 补漏
    action:
      kind: builtin_transform
      function: font_fallback
      params:
        # 与 _MC_TABLE cjk_glyph 同款 CJK 段表 (语义超集, 勿回退 textutil.CJK_RANGES)
        fallback_ranges:
          - [0x2E80, 0x303F]
          - [0x3040, 0x30FF]
          - [0x3100, 0x31EF]
          - [0x3200, 0x33FF]
          - [0x3400, 0x4DBF]
          - [0x4E00, 0x9FFF]
          - [0xA000, 0xA4CF]
          - [0xAC00, 0xD7AF]
          - [0xF900, 0xFAFF]
          - [0xFE30, 0xFE4F]
          - [0xFF00, 0xFFEF]
          - [0x20000, 0x2FA1F]
        # 文件形式命名 (kpathsea 解析, 不依赖 fontconfig; 与 inject
