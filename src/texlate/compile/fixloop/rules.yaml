  # ─── loop: 源码改写系 —— 按"保守→激进"排序 ───
  - id: pdftex_prim_guard
    description: "pdfTeX 原语裸用 (@pdftex_prims 族 token, load 期展开成 PDFTEX_PRIMS 交替) → \\ifdefined 守卫, xelatex 下静默跳过"
    phase: loop
    order: 50
    when: { category: pdftex_prim }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(?<![\\\\a-zA-Z])(\\\\@pdftex_prims)(\\s*=\\s*[^\\n%]*)",
              repl: '\\ifdefined\g<1>\g<0>\\fi',
            }
          - {
              pattern: "(?<![\\\\a-zA-Z])(\\\\@pdftex_prims)(\\s*\\{[^\\n]*\\})",
              repl: '\\ifdefined\g<1>\g<0>\\fi',
            }
    risk: low # lookbehind 排除 cs 名紧邻 (\<prim> 前接字母/反斜杠 = ifdefined/chardef/ifnum/let 定义语境 + 自输出第二枚), 幂等; loop1-1306.0036 实证旧 (?<!ifdefined) 会把 polyfill 注入的 \chardef\pdfoutput=1 再套娃改写
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核, 守卫语义一致
    provenance:
      - {
          corpus: "1412.6980/*",
          error: "Undefined control sequence \\pdfoutput",
        }
    stats: { fires: 3, rescued_cells: 3 }
    source_ref: "fixloop.py L344-361, L284-298"

