  # fixable-data 裁定 (2211.13028/2308.12612, 1d 已批): doc 强指 dvi/pdf
  # 驱动给 hyperref 家族, xelatex 下必炸 "Wrong driver option"/
  # "Wrong hyperref driver"。剥除一切选项括号内的驱动词让 hyperref/
  # graphicx 自侦 hxetex —— docclass 全局选项同样覆盖 (剥离对 xetex
  # 恒正确: 这些驱动在 XeTeX 下本来就走不通)。hypdvips 整包换 hyperref
  # (它只为 dvips 路由存在; doc 若另载 hyperref, 二次加载无害)。
  - id: hyperref_driver_neutralize
    description: "hyperref 家族驱动选项 (pdftex/dvips/…) + hypdvips → 剥词/换包, 交自侦"
    phase: loop
    order: 181 # typein_neutralize(180) 之后; early_eof/hyperref_driver 双签兜底
    when:
      any:
        - { category: hyperref_driver, payload_required: false }
        - { category: early_eof, payload_required: false }
    condition:
      source_contains: "hypdvips|\\[[^\\]]*\\b(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\b"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # hypdvips → hyperref (选项面保留, 多为 hyp* 公共键)
          - {
              pattern: "(\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]\\n]*\\]\\s*)?)\\{hypdvips\\}",
              repl: "\\g<1>{hyperref}",
            }
          # 全驱动括号: [dvips] / [dvips,pdftex] → [] (括号可跨行)
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\]",
              repl: "[]",
            }
          # 括号首位驱动词: [dvips,opt] → [opt]
          - {
              pattern: "\\[\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "[",
            }
          # 中段/末位驱动词: [opt,dvips,opt2] / [opt,dvips] → [opt,opt2]/[opt]
          - {
              pattern: "(\\[[^\\]]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\])",
              repl: "\\g<1>",
            }
          # PassOptionsToPackage/Class 首参同三套 (大括号形)
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,?\\s*)+\\}",
              repl: "\\g<1>}",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{)\\s*(?:(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*,\\s*)+",
              repl: "\\g<1>",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*?)(?:,\\s*(?:pdftex|dvips|dvipsone|dviwindo|ps2pdf|hypertex|vtex|vtexpdfmark|textures|tex4ht|latex2html|oztex|dvipdfmx?)\\s*)+(?=,|\\})",
              repl: "\\g<1>",
            }
          # 空括号清扫: \usepackage[]{x} → \usepackage{x}
          - {
              pattern: "(\\\\(?:documentclass|usepackage|RequirePackage))\\s*\\[\\s*\\]",
              repl: "\\g<1>",
            }
    risk: low # xetex 下这些驱动本就失效; 自侦即作者意图
    known_gap: "doc 若用 hypdvips 专属 cs (嵌入 PS 钩子) 会前进到 undefined_cs → cs_targeted_fix; \\hypersetup 内驱动键、非括号赋值 (\\def\\@driver) 未覆盖"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核同驱动面
    provenance:
      - {
          corpus: "fixable-data adjudication (2211.13028, 2308.12612)",
          error: "hypdvips: Wrong hyperref driver `hxetex' / hyperref: Wrong driver option `pdftex'",
        }
    stats: { fires: 0 }
    source_ref: "scout-fail59 fixable-data §4 驱动剥除 (1d 批准); taxonomy hyperref_driver 签名同期扩三形态"

  # 上古 REVTeX 4 系 (v4.0rc ~/texmf 阴影件 / revtex4b* TL 缺席) vs 现代内核:
  # \@uclcnotmath 路径上 \NoCaseChange{##} 塌缩成裸 # → \protected@edef
  # \reserved@a 撞 Illegal parameter number (traced, zh/en 同炸 —— 类文件
  # 本体过时非译文问题); revtex4b4 直接 missing_file。revtex4-2 是现行
  # TL 兼容实现, docclass 改写 6 格实测全出 pdf (slac_one/slac_two .rtx
  # 期刊子式在 4-2 下仅 unknown-option warning)。
  - id: revtex4_legacy_class_rewrite
    description: "\\documentclass{revtex4{,b*}} (v4.0rc 上古系) → revtex4-2"
    phase: loop
    order: 182 # hyperref_driver_neutralize(181) 之后, undefined_cs_guess(900) 之前
    when:
      any:
        - { category: syntax }
        - { category: missing_file }
        - { category: capacity }
    condition:
      # 花括号精确形 {revtex4}/{revtex4b4}: revtex4-1/revtex4-2 不误中;
      # 括号组 [^\]] 允许 docclass 选项跨行 (babel 组先例)。
      source_contains: "\\\\documentclass(?:\\s*\\[[^\\]]*\\])?\\s*\\{revtex4(?:b\\d*)?\\}"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex] # suffix 匹配 lowercase, .TEX 同收 (physics/0104031)
        rewrites:
          # 只改 docclass 花括号: \ProvidesClass{revtex4} (bundled cls 内)
          # 与正文散见 {revtex4} 字串不动。
          - {
              pattern: "(\\\\documentclass\\s*(?:\\[[^\\]]*\\]\\s*)?\\{)revtex4(?:b\\d*)?\\}",
              repl: "\\g<1>revtex4-2}",
            }
    risk: low # revtex4-2 向后兼容 4.0 文档面; 上古 cls 在现代内核已无救
    known_gap: "revtex4 专属旧 cs (\\preprint/旧 \\iftwocolumn 面) 若用则前进 undefined_cs → cs_targeted_fix; endfloats 等旧选项 4-2 有同名面"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 内核不兼容与引擎无关
    provenance:
      - {
          corpus: "loop1 unfixable cluster (1109.2144/1109.2205/1109.5313/1012.1830/hep-ph--0605134 均 slac_one|slac_two+revtex4; physics/0104031 revtex4b4)",
          error: "Illegal parameter number in definition of \\reserved@a / File `revtex4b4.cls' not found / TeX capacity exceeded",
        }
    stats: { fires: 0 }
    source_ref: "manual bisect 1109.2205: revtex4+ctex+title+maketitle+section 充要, 纯 en 同炸 → 类文件/内核不兼容; revtex4-2 替换 6/6 出 pdf"

  - id: docclass_post_option_normalize
    mechanisms: [W67]
    description: "\\documentclass{X}[opts] 后置选项畸形 → 孤儿 [opts] 行归位 \\documentclass[opts]{X}"
    phase: loop
    order: 183 # revtex4_legacy_class_rewrite(182) 之后, undefined_cs_guess(900) 之前
    when:
      any:
        - { category: syntax }
        - { category: undefined_cs }
    condition:
      # 孤儿选项行: segmenter 把 src 同行 `\documentclass{X}[opts]` 的
      # [opts] 段拆成独立块, splice 落 preamble 孤行 → Missing \begin{document}。
      source_contains: "(?m)^[ \\t]*\\[[0-9a-zA-Z,=.\\- ]+\\][ \\t]*$"
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          # 既有选项 → 尾部合并: \documentclass[a]{X}…^[o]$ → \documentclass[a,o]{X}
          # 中间段以 \begin{document} 回火——正文内孤立 [x] 行不越界吞。
          - {
              pattern: "(\\\\documentclass[ \\t]*\\[[^\\]\\n]*)\\]([ \\t]*\\{[^}\\n]*\\})((?:(?!\\\\begin\\{document\\})[\\s\\S])*?)^[ \\t]*\\[([0-9a-zA-Z,=.\\- ]+)\\][ \\t]*$",
              repl: "\\g<1>,\\g<4>]\\g<2>\\g<3>",
              flags: [MULTILINE],
            }
