# rules.yaml — fixloop 编译修复规则表 (schema v1.1)
#
# 来源: bench/py/fixloop.py spike (冷 TEXMFHOME, 22 格, 16/16 救回) 的
# 硬编码修复逻辑 → 数据化; 另并入 docs/08 §5.2 实证缺口回填的 9 条新规则。
# v2 (2026-09-15 corpus_v2 40 篇实测整改): eps_route 由 fileset 静态拒改
# log 确证 (ps_image taxonomy + eps_to_pdf 救回 + 兜底拒); pstricks 独立成
# pstricks_route; legacy_pkg_shim 接住退役包; aastex_bundle_shadow 遮蔽
# tectonic 内置老类 (aastex 5.0rc3); journal_cs_polyfill 补期刊缩写宏;
# undefined_cs payload 改抓 l.N 行末 cs 名; latex209 gate 修行锚定防注释误杀。
# 整改后 tectonic 臂 FAIL→pdf 1/16→12/16, reject 21→10 格, union pdf
# 32→34/40, 零回归。missing_tfm 对账: 全 8 格经 install_tfm 修复、零
# unfixable; astro-ph/0306068 xelatex 的 unfixable:other 实系 wdir 自带
# 化石类 caps.cls (1997 CUP) 手工重实现 tabular 内核 (\hbox\bgroup$ +
# \@tabarray + \ifnum0=`} 技巧) 与 LaTeX2e≥2024 内核不兼容 —— 任意
# \chapter 即炸 "Extra }, or forgotten $.", 可恢复错被 halt-on-error
# 提升为致命; tectonic bundle LaTeX2e 2021 不受影响 → clean。判为正确
# 裁决 (修需改写对方 cls 内核, 无可泛化规则), 留痕备查。
# v3 (2026-09-16): taxonomy +inputenc_unicode (inputenc 拒载 Unicode 引擎)
# +undefined_cs 空 l.N 变体行 (宏/钩展开上下文取末位 cs); syntax 族扩
# Extra }/\\endgroup/\\fi 等组/条件多 token 错; rules +inputenc_strip(94)
# +cs_targeted_fix(165, cs→修复表首版 headerps@out/mathbbm)。
# v4 (2026-09-16 signature-mining 扩列): filemap.overrides +epsf.tex
# /tcilatex.tex (.tex 索引缺席兜底); taxonomy +missing_graphic/+babel_opt/
# +hyperref_driver/+float_opt/+pkg_order/+invalid_char/+expl3_backend
# ("other" 拆家) + ps_image 数字扩展名变体 (metapost); shim_map +mn2e/
# svjour/slashbox/geom/tcilatex/epsf/svglov3; rules +graphic_case_link(17)
# +graphic_repair(18) +invalid_char_recode(97)。同轮 FP 收紧 (fix-engine-fp
# 口径对齐): latex209 head/tail 收真 2.09 签名 (\documentstyle cs/compat-mode
# 横幅/"LaTeX Version 2.09"/"in LaTeX 2.09" 错文; aastex "Original \LaTeX2.09"
# 横幅四案误中实证); source_contains 三处加行锚 (?m)^[ \t]* 防注释误中
# (pstricks_route/pstricks_dvips_preflight/aastex_bundle_shadow, 1803.08846;
# pstricks 包名口径对齐 engine.py _PSTRICKS_RE 元素级)。
# 社区贡献入口 = 新增/修改本文件条目。
#
# 两层结构:
#   taxonomy: log 文本 → (category, payload)      —— "这是什么错"
#   rules:    (category, payload) → 修复动作       —— "怎么修"
# 新增一个修复通常只需在 rules 追加一条 (复用已有 category);
# 只有新错误形态才需要加 taxonomy 行。
#
# 语法约定: pattern/repl 均按 Python re 语义; repl 里 \g<N> 为分组引用;
# action.function 表示该动作是命名内置函数 (算法型, 非纯 regex,
# 注册表在 builtins.py —— 新函数才需要 PR 代码)。
# 书写约束: flow 集合 {..}/[..] 必须单行写完 (子集解析器不跨行)。
#
# 每条规则逐条带注释: 出处为 spike 行号 (fixloop.py Lxxx) 或 docs/08 行号。

version: 1

meta:
  source: "bench/py/fixloop.py + docs/08 §5"
  generated: "2026-09-15"
  engine_default: xelatex
  loop:
    max_rounds: 8 # spike L40
    one_rule_per_round: true # 每轮只应用一条成功规则, 便于归因 (L549-565)
    dedup_key: "{rule_id}:{payload}" # ctx.applied, 同规则同负载不重复 (L552,561)
    stuck_sig_repeat: 3 # 同 category:payload 连续 3 轮 → verdict=stuck (L756-761)
    clean_err_max: 3 # pdf 且 '!' 错 ≤3 → acceptable (L41, L786-791)
    compile_passes: 2 # 第二轮仅在已出 pdf 时跑 (L628-630)
    timeout_sec: 120
    warn_demote: false # warnings 只记录不改判; §4.3 clean 三件套在 pipeline 层做
    warn_driven_fixes: true # v1.1: 错误全无时 warnings 可驱动 warn_* 类别修复轮

# ────────────────────────────────────────────────────────────────
# 引擎能力位: 决定每条规则的 action 用 native 还是 degrade 路径
# ────────────────────────────────────────────────────────────────
capabilities:
  xelatex:
    kpsewhich: true
    tlmgr: true
    updmap: true
    shell_escape: true
    bundle: false
  tectonic:
    kpsewhich: false # 无 kpsewhich; 以"本地文件存在+bundle 含不含"近似
    tlmgr: false # 无 tlmgr → install_* 走 ctan_fetch 降级
    updmap: false # 无 updmap; 字体 map 由 bundle 内部管理
    shell_escape: partial # 新版支持但受限; minted 场景按不可完全依赖处理
    bundle:
      true # bundle 内建按需拉文件 (install_file 等价物),
      # 但只覆盖 bundle 索引内文件; 物理字体仍须改写规则

# ────────────────────────────────────────────────────────────────
# 共享知识: file → TeX Live 包名 索引 (install_* 动作的 oracle)
# xelatex: tlmgr search --global --file '/X' (fixloop.py L176-208)
# tectonic: 离线解析 texlive.tlpdb 生成的静态索引 + overrides 手工表
#   (ctan.py: tlpkg/texlive.tlpdb.xz ~2.8MB → 8148 包 / 138K basename,
#    filemap.json ~5.5MB, 构建 0.14s, 缓存 ~/.cache/texlate/)
# ────────────────────────────────────────────────────────────────
filemap:
  xelatex_oracle: "tlmgr search --global --file '/{fname}'"
  tectonic_oracle: "texlive.tlpdb 离线索引 (随规则库分发, 定期重建)"
  cache: "全局 json 缓存, file→[pkg] (远端仓库知识, 与环境冷热无关)"
  denylist_platform_suffixes: # 过滤平台特定包条目 (L190-204)
    [windows, win32, macosx, linux, x86_64, aarch64, amd64, i386, universal]
  denylist_prefixes: [tlmgr, tlgs]
  overrides: # 社区贡献: "fname": "tl_pkg" 手工映射兜底
    # 例: "iclr14submit_e.sty": null   # TL 无此包 → 预检扫描的已知噪声
    # 2026-09-16 起全引擎生效: tectonic 经 CtanFetcher.index 套入, xelatex
    # 等经 _wire_engine 的 eng.filemap 实例遮蔽 (overrides-first 包装)。
    "binhex.tex": "kastrup" # 真身在 kastrup (2211.04574 实证); .tex 入索引后仍留显式钉
    # .tex 已入 INDEX_EXTS (runfiles 段限定, doc/src 噪声不收) —— 此表
    # 继续作显式钉与已知噪声登记 (signature-mining 2026-09-16 §2.1;
    # overrides 是 basename→pkg 直表, 不经 runfiles 过滤)。
    "epsf.tex": "epsf" # 1706.02568; 真身 tex/generic/epsf/epsf.tex ∈ epsf 包
    "tcilatex.tex": null # physics/0307021; TL 无 (TCI 私有) → 已知噪声, 走 shim_map stub
    # ── 2026-09-16 babel ldf 钉组: `.ldf` 不在 INDEX_EXTS → 索引恒 miss,
    # overrides-first 直通真包 (babel_lang_ldf_install 规则的查询落点)。
    # 钉名 = 规则 try_exts 实际查询名 ({lang}.ldf / {lang}b.ldf)。
    "german.ldf": "babel-german"
    "germanb.ldf": "babel-german"
    "ngerman.ldf": "babel-german"
    "ngermanb.ldf": "babel-german"
    "russian.ldf": "babel-russian" # TL 无此名 (真身 russianb.ldf) —— 首候选
    # 装上包后 probe miss, 次候选 russianb.ldf 走 already_present_ok 收口
    "russianb.ldf": "babel-russian"
    "french.ldf": "babel-french"
    "frenchb.ldf": "babel-french"
    "francais.ldf": "babel-french"
    "spanish.ldf": "babel-spanish"
    "greek.ldf": "babel-greek"
    "latin.ldf": "babel-latin"
    "turkish.ldf": "babel-turkish"
    "brazil.ldf": "babel-portuges"
    "portuges.ldf": "babel-portuges"
    "portuguese.ldf": "babel-portuges"
    "italian.ldf": "babel-italian"
    "polish.ldf": "babel-polish"
    "czech.ldf": "babel-czech"
    "ukraineb.ldf": "babel-ukrainian" # 实档名; 选项 ukrainian 查询名
    # (ukrainian[b].ldf) 永不落此 —— 该格残留, 归选项改写类后续规则
  version_guard: # docs/08 §5.2 第9条: ctan_fetch 版本前置检查
    enabled: true # tlnet 只发最新; 新版对 bundle 的 expl3/LaTeX2e 太旧会拒载
    texlive_format_epoch: "2022-07-14" # tectonic bundle 快照年代 (ctanfetch-probe §3.4)

# ────────────────────────────────────────────────────────────────
# log 尾部红线 warning 扫描 (docs/08 §4.3): 只记录进 cell.warnings,
# 其中 invalid_utf8 在无 '!' 错时升级为 warn_utf8 类别驱动修复轮。
# ────────────────────────────────────────────────────────────────
warnings:
  - {
      id: invalid_utf8,
      pattern: "Invalid UTF-8 byte|Missing character.*U\\+FFFD",
    }
  - { id: missing_char, pattern: "Missing character" } # CJK 渲染检查原料
  - {
      id: missing_graphic,
      pattern: "File `[^']+\\.(eps|png|jpg|pdf)' not found|cannot (find|open) image",
    }
  - { id: tectonic_degrade, pattern: "^!+ .*not found" } # tectonic File..not found 降级行

# ════════════════════════════════════════════════════════════════
# 第一层: 分类学 —— log → (category, payload)
# 评估序: 存在 '!' 行时按序首命中 (scope:head, 输入='!'行+其后8行);
#         全文无 '!' 行时评估 scope:tail 段 (输入=log 末 30 行);
#         仍无命中但有 warning 命中 → scope:warnings 驱动 warn_* 类。
# 对应 fixloop.py classify() L67-125。
# ════════════════════════════════════════════════════════════════
taxonomy:
  # —— 文件缺失类 (抓文件名 → install_file) ——
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "File `([^']+\\.[a-zA-Z0-9]+)' not found",
    }
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "I can't find file `([^']+)'",
    }
  # 2026-09-16 第三种缺档措辞: `\PackageError` 自报 "Cannot find the
  # file X.ext" (无反引号对) —— textgreek.sty:39 lgrenc.def 实证
  # (1706.02694/2308.00072/2410.06051 三格同墙, greek-fontenc 一包全解);
  # 不盖 'File `X' not found' 主签名, 互补并列。
  - {
      id: missing_file,
      scope: head,
      payload_group: 1,
      pattern: "Cannot find the file\\s+([\\w@.+-]+\\.[a-zA-Z0-9]+)",
    }
  # —— TFM 字体缺失 (抓字体名=文件名 → install_tfm) ——
  # payload 类须含 "-": SkakNew-Diagram 型名按 [a-zA-Z0-9]/\w 抓会在
  # 连字符处截断成 "Diagram" → filemap 必 miss (loop1-2211.12985 实证)。
  - {
      id: missing_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Font \\\\?\\S*?=?\\s*([\\w-]+) at [0-9.]+pt not loadable",
    }
  - {
      id: missing_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Metric \\(TFM\\) file[^\\n]*?([\\w-]+)\\.(tfm)",
    }
  # —— fontspec 时代错配 / 系统字体缺失 ——
  - {
      id: xetexglyph_tfm,
      scope: head,
      payload_group: 1,
      pattern: "Cannot use XeTeXglyph with (\\S+)",
    }
  - {
      id: missing_pfb,
      scope: head,
      pattern: "Cannot proceed without .vf|physical font",
    }
  # —— xdvipdfmx PS 硬墙 (tectonic 无 gs 通道; 实证签名 fixloop-v2 整改) ——
  # compilebench taxonomy 对应类别名 ps_image; 首错为
  # "! something bad happened inside xdvipdfmx" (stdout_tail 归一),
  # ctx8 内含 "caused by: pdf: image inclusion failed for "X.eps""。
  - {
      id: ps_image,
      scope: head,
      payload_group: 1,
      pattern: 'image inclusion failed for "([^"]+\.(?:eps|ps|EPS|PS))"|PostScript images are not supported',
    }
  # metapost 数字扩展名变体 (0806.4589: diag1.1 实为 EPS 产物; 上行只认
  # .eps/.ps → 漏归 other)。双引号 xdvipdfmx 形态 + 单引号 Unable-to-load
  # 形态并列; payload_group 缺省 = 首个非空组。
  - {
      id: ps_image,
      scope: head,
      pattern: "image inclusion failed for \"([^\"]+\\.[0-9]+)\"|Unable to load picture or PDF file '([^']+\\.[0-9]+)'",
    }
  - {
      id: fontspec_missing,
      scope: head,
      payload_group: 1,
      pattern: 'font [“"]([^”"]+)[”"] cannot be found',
    }
  # —— 源码级 ——
  - { id: illegal_unit, scope: head, pattern: "Illegal unit of measure" }
  - {
      id: option_clash,
      scope: head,
      payload_group: 1,
      pattern: "Option clash for package ([\\w-]+)",
    }
  - {
      id: already_def,
      scope: head,
      payload_group: 1,
      pattern: "Command '?\\\\?([\\w@]+)'? already defined",
    }
  - {
      # ntheorem 自检错 (Theorem style X already defined) —— amsthm/thmtools
      # 预定义同名 th@X 样式撞车, payload=样式名 (非 cs 名)
      id: already_def,
      scope: head,
      payload_group: 1,
      pattern: "Theorem style ([\\w@]+) already defined",
    }
  - {
      id: soul_err,
      scope: head,
      pattern: "Package soul Error|Reconstruction failed",
    }
  - { id: hyphenation, scope: head, pattern: "Not a letter" }
  - {
      id: minted_froz,
      scope: head,
      pattern: "frozencache|Cannot highlight code",
    }
  # —— 2026-09-16 新增 (compilebench-v3 失败构成): inputenc 对 Unicode
  # 引擎整包拒载 (inputenc.sty:164), xelatex 走 -file-line-error 形态时
  # 首错即此。剥装载点见 inputenc_strip 规则 ——
  - {
      id: inputenc_unicode,
      scope: head,
      pattern: "inputenc is not designed for",
    }
  # 2026-09-16 收紧 (对齐 compile/engine.py _LATEX209_TAIL_RE): 裸
  # "LaTeX2.09" 字样误中 aastex 系 cls 的 info 横幅 "Original \LaTeX2.09
  # style" (LaTeX2e 文档; 2211.04503/1803.08927/1803.09046/2203.04385 四案
  # 实证)。真 2.09 只认: \documentstyle cs 本体 / 内核 compat-mode 横幅 /
  # "in LaTeX 2.09" 错文 / "LaTeX Version 2.09" 上古版横幅。
  - {
      id: latex209,
      scope: head,
      pattern: "(?m)\\\\documentstyle\\b|LaTeX 2\\.09 COMPATIBILITY MODE|LaTeX2e command[^\\n]*\\bin LaTeX 2\\.09|LaTeX Version 2\\.09|^[ \\t]*Compatibility mode",
    }
  # 2026-09-16 新增变体行 (1909.05039 实证): 冒犯 cs 在宏/钩展开上下文
  # 尾行而 l.N 行空白时 (\__hook shipout ...geHook \headerps@out 型),
  # 抓 l.N 空白行之前的最后一个 \cs —— tempered 段保证取"最后一个"。
  # 本行先于通用行评估; 不命中时由下行兜底 (payload=None 语义不变)。
  - id: undefined_cs
    scope: head
    pattern: "Undefined control sequence[\\s\\S]*?\\\\([a-zA-Z@]+)(?:(?!\\\\[a-zA-Z@]+)[\\s\\S])*?l\\.\\d+[ \\t]*(?:\\r?\\n|$)"
    payload_group: 1
    subclassify:
      { pattern: "\\\\(pdf[a-zA-Z@]+)", into: pdftex_prim, payload_group: 1 }
  # undefined_cs 命中后再细分 pdfTeX 原语 (L110-114)
  # payload = 出错行 l.N 上最后一个 \cs (TeX 错误展示约定: 冒犯 cs 在该行末),
  # 供 journal_cs_polyfill 等按名命中; 无 l. 行时 payload=None 正常降级。
  - id: undefined_cs
    scope: head
    pattern: "Undefined control sequence(?:[\\s\\S]*?l\\.\\d+[^\\n]*\\\\([a-zA-Z@]+))?"
    payload_group: 1
    subclassify:
      { pattern: "\\\\(pdf[a-zA-Z@]+)", into: pdftex_prim, payload_group: 1 }
  - { id: capacity, scope: head, pattern: "TeX capacity exceeded" }
  # 2026-09-16 compile-hard 新增 (2211.13013, aux-cjk-truncation 留档):
  # 引擎自产 aux 族中间件被 8192B 写缓冲劈断多字节字符 → 下遍回读
  # "Invalid UTF-8 byte" + "! File ended while scanning use of \@newl@bel"。
  # 须在 emergency 前评估——'!' 行后 ctx8 可能混入 Emergency stop 抢签;
  # cs 名单覆盖 aux/toc/lof 回读宏族 (\@newl@bel/\@writefile/\contentsline)。
  - {
      id: aux_scan_eof,
      scope: head,
      payload_group: 1,
      pattern: "File ended while scanning use of \\\\?@?(newl@?bel|writefile|contentsline)",
    }
  - {
      id: emergency,
      scope: head,
      pattern: "Emergency stop|cannot \\\\read|Fatal error|job aborted",
    }
  - {
      id: env_mismatch,
      scope: head,
      pattern: "begin\\{[^}]*\\}.*ended by|Extra \\\\end",
    }
  # ── 2026-09-16 signature-mining "other" 拆家 (§2.2) ── 精确字面签名须
  # 先于 syntax 宽词族评估 (syntax 含 Missing/Illegal 等词会抢签)。
  # file-line-error 形态 (无 '!' 前缀) 也走本段 —— _ERR_FILELINE_RE 已计。
  - {
      id: missing_graphic,
      scope: head,
      pattern: "Unable to load picture or PDF file '([^']+)'|image inclusion failed for \"([^\"]+\\.(?:pdf|png|jpe?g))\"",
    }
  - {
      id: babel_opt,
      scope: head,
      payload_group: 1,
      pattern: "Package babel Error: Unknown (?:option|language) [`']([^`']+)'",
    }
  - {
      id: hyperref_driver,
      scope: head,
      payload_group: 1,
      # 三形态合一: "Wrong DVI mode driver option `X'" (hyperref 老文案) /
      # "Wrong driver option `X'" (hyperref 现行) / "Wrong hyperref driver `X'"
      # (hypdvips 自检) —— 2211.13028/2308.12612 曾因此漏签落 early_eof。
      pattern: "Wrong (?:hyperref driver|(?:DVI mode )?driver option) [`']([^`']+)'",
    }
  - {
      id: float_opt,
      scope: head,
      payload_group: 1,
      pattern: "Unknown float option [`']([^`']+)'",
    }
  - {
      id: pkg_order,
      scope: head,
      payload_group: 1,
      pattern: "Package (\\w+) Error: \\w+ must be loaded (?:before|after)",
    }
  # 2026-09-16 repro-2501 缺陷B: 色名参槽被译文/mock 污染 ({blue}→'这是译文')
  # → (x)color Undefined color; payload=色名, 供 undefined_color_fallback 兜底。
  - {
      id: undefined_color,
      scope: head,
      payload_group: 1,
      pattern: "Package (?:x)?color Error: Undefined color '([^']+)'",
    }
  - {
      id: invalid_char,
      scope: head,
      pattern: "Text line contains an invalid character",
    }
  - {
      id: expl3_backend,
      scope: head,
      pattern: "Backend request inconsistent with engine",
    }
  # 2026-09-16 扩 syntax 族: Extra }/\\endgroup/\\right/\\middle/\\else/\\fi/\\or
  # 与 Forgotten \\endgroup —— 组/定界/条件多 token 错误归 syntax
  # (astro-ph/0306068 "Extra }, or forgotten $." 原是 other 兜底;
  # Extra \\end 已由 env_mismatch 先行接住, 不重复列)。
  - id: syntax
    scope: head
    pattern: "Missing|Runaway|Paragraph ended|Misplaced|Double subscript|Illegal|There's no line|Lonely|Bad math|Something's wrong|not in outer par|allowed only in math|improper|Extra \\}|Forgotten \\\\endgroup|Extra \\\\(?:endgroup|right|middle|else|fi|or)\\b"
  - { id: other, scope: head, pattern: "^!" } # 兜底: 有 '!' 行必命中
  # —— tail 段: 仅当全文 0 个 '!' 行时评估 (交互式缺文件/Emergency) ——
  # preempts: 致命尾错夺弱 head 类的路由 (regress4-2410.00012: chemgreek
  # 缺档是真杀手, 此前永远被上游包内 undefined_cs 抢路由)。early_eof
  # 不挂——零页是后果不是可修因, 抢占会盖住可行动的 head 错。
  - {
      id: missing_file,
      scope: tail,
      payload_group: 1,
      pattern: "File `([^']+\\.[a-zA-Z0-9]+)' not found",
      guard: "Enter file name|Emergency",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  - {
      id: missing_file,
      scope: tail,
      payload_group: null,
      pattern: "Enter file name",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  # tail 行同款收紧 (aastex 横幅会落 tail 30 行内抢签) —— 与 head 行同表。
  - {
      id: latex209,
      scope: tail,
      pattern: "(?m)\\\\documentstyle\\b|LaTeX 2\\.09 COMPATIBILITY MODE|LaTeX2e command[^\\n]*\\bin LaTeX 2\\.09|LaTeX Version 2\\.09|^[ \\t]*Compatibility mode",
    }
  # —— cls/sty 「求档文」尾段: 类文件内部 \IfFileExists 失败→\stop 死路
  #   (aastex61 "Please update your system to include revtex4-1.cls" 实证:
  #   \stop 夹在条件内 → \end occurred incomplete, 无 '!' 无 missing_file
  #   行) —— plea 提出的文件名即 actionable payload, 归 missing_file 让
  #   install/shim 链接手; 须排在 early_eof 之前 (同尾共存时 plea 优先) ——
  - {
      id: missing_file,
      scope: tail,
      payload_group: 1,
      pattern: "(?:include|download|install|get|need)\\s+(\\S+\\.(?:cls|sty|clo|tex|def|fd|map|cfg))",
      guard: "No pages of output",
      preempts: [undefined_cs, pdftex_prim, other, emergency],
    }
  # —— 干净日志零页面: TeX 早夭但无 '!' 行 (1706.00175 实证:
  #   "(\end occurred when \ifx on line 27 was incomplete)" + "No pages of
  #   output") —— guard 把「有页输出仅带 \end occurred 警告」挡在外面 ——
  - {
      id: early_eof,
      scope: tail,
      payload_group: 1,
      pattern: "\\\\end occurred (?:when (\\\\?\\w+)[^\\n]*?incomplete|inside a group)",
      guard: "No pages of output",
    }
  - {
      id: early_eof,
      scope: tail,
      pattern: "No pages of output",
      payload_group: null,
    }
  # —— warnings 段: 无 '!' 且无 tail 命中, 但 warning 红线命中 (v1.1) ——
  - { id: warn_utf8, scope: warnings, warn_id: invalid_utf8 } # docs/08 §5.2 non_utf8_source 的类别入口
  - { id: warn_missing_char, scope: warnings, warn_id: missing_char } # F4: 无 '!' 错但缺字 → 分诊修复入口
  # 都不中: err 为空 → clean; err 非空 → other

# ════════════════════════════════════════════════════════════════
# 第二层: 修复规则 (36 条: 2 gate + 2 precheck + 32 loop)
# phase: gate(每轮分类后最先评估) / precheck(编译前一次性) / loop(每轮)
# 同 phase 内按 order 升序, 首个 when+condition 满足且 dedup 未命中的执行。
# engines.<name>.mode: native | same(源改写天然可移植) | degrade | unsupported | skip
# condition 原语: tool_available / cap_available / engine_in /
#   main_head_contains / source_contains / ctx_suggests / fileset /
#   vendored_shadow / package_version_ge / prim_read_form /
#   shim_known / cache_dir_glob / any:[...]  (未知键 → 规则跳过, fail-closed)
# ════════════════════════════════════════════════════════════════
rules:
  # ─── gate: 路由拒绝先于一切修复尝试 ───
  # spike 语义: 主循环 L748-755 在 pick_and_apply 之前短路,
  # 等效于最高优先级 → 用 phase:gate 显式建模。
  - id: latex209_reject
    description: "LaTeX 2.09 文档 (\\documentstyle/化石 cls) → 路由拒绝, 转 latex+dvips 通道"
    phase: gate
    order: 1
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: mhc 子串会被注释 %\documentstyle 误中 (1806.06690);
        # 加行锚定复核 —— 真 2.09 文档的 \documentstyle 必在行首。
        source_contains: "(?m)^[ \\t]*\\\\documentstyle",
      }
    action:
      kind: reject_route
      params: { route: "latex+dvips", reason: "LaTeX 2.09 document" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # 路由层策略, 与引擎无关
    provenance:
      - {
          corpus: "hep-th 类语料 (hjfy 经验移植)",
          error: "LaTeX2e command in LaTeX 2.09 document",
        }
    stats: { fires: 0, status: proposed } # 本轮语料未触发, 为 2.09 论文预留
    source_ref: "fixloop.py L508-520, L748-755"

  # 新增 (docs/08:273): pstricks 文档走 dvips 路由前的 .pro 前置检查
  - id: pstricks_dvips_preflight
    description: "pstricks 文档被路由 latex+dvips 前, 预检 pst-tools.pro 等 dvips 资源存在"
    phase: gate
    order: 0 # 先于 latex209_reject(1): pstricks 时先记 .pro 预检信息再路由
    when:
      any:
        - { category: latex209 }
        - { category: missing_file, main_head_contains: "\\documentstyle" }
    condition: {
        # v2 修正: documentstyle 行锚定 (注释不命中) AND pstricks 依赖,
        # 单 pattern 内顺序表达: \documentstyle 恒在文档头部先于包引用。
        # 2026-09-16 再修: 后半 pstricks 组同病注释误中 (source_contains 跑
        # raw 源, % 注释行会命中) —— 内组加同款行锚, 口径同 pstricks_route
        # (engine.py _PSTRICKS_RE 元素级语义)。
        source_contains: "(?ms)^[ \\t]*\\\\documentstyle[\\s\\S]*?^[ \\t]*(\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\b(pstricks(-\\w+)?|pst-\\w+)\\b|\\\\begin\\s*\\{pspicture\\*?\\}|\\\\pspicture\\b|\\\\psset\\b)",
      }
    action:
      kind: builtin_transform
      function: pstricks_dvips_preflight # 缺 .pro → REJECT note 附 advisory; 全在 → 正常 reject
      params: { require_files: ["pst-tools.pro"], route: "latex+dvips" }
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - { corpus: "—", error: "dvips 兜底缺 .pro 时白跑一路由 (docs/08:273)" }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L273"

  # ─── precheck: 静态路由 + 第 0 招装包, 不进循环 ───
  # v2 整改 (fixloop-corpusv2 实测): 原 eps_route 按 fileset 静态拒 .eps 工程,
  # 实证误杀 —— tectonic 对部分 eps 工程能出 pdf~ (0812.4521/nucl-th/0104042
  # baseline 即 pdf~), 且 epstopdf 转换可整格救回 (0903.0543/1406.1994 手测
  # 出 pdf)。.eps 文件 → 循环内 log 确证的 ps_image 规则处理 (见 loop);
  # 此处只留代码级 PS 依赖 (pstricks/pspicture) 的预检路由 —— 无转换路径。
  - id: pstricks_route
    description: "pstricks/pspicture/\\psset 源码依赖 → tectonic 无可行路径, 预检路由 xelatex"
    phase: precheck
    order: -10 # 路由决策先于装包预检
    when: { always: true }
    condition:
      engine_in: [tectonic]
      # 2026-09-16 注释-FP 收紧 (1803.08846 实证: %\usepackage{pstricks}
      # 注释行误杀 baseline-clean 稿): source_contains 跑 raw 源 → 各备选项
      # 行锚 (?m)^[ \t]* (:369 latex209 gate 先例, % 注释行不命中)。包名
      # 元素级口径同 compile/engine.py _PSTRICKS_RE (2d06184):
      # pstricks(?:-\w+)?|pst-\w+ 元素边界 (防 {notpstricks} 子串),
      # RequirePackage 同收, {amsmath,pstricks} 非首元素命中; pspicture
      # 收 \begin{pspicture*?}/\pspicture cs 两形态。
      source_contains: "(?m)^[ \\t]*(\\\\(?:usepackage|RequirePackage)\\s*(\\[[^\\]]*\\])?\\s*\\{[^}]*?\\b(pstricks(-\\w+)?|pst-\\w+)\\b|\\\\begin\\s*\\{pspicture\\*?\\}|\\\\pspicture\\b|\\\\psset\\b)"
    action:
      kind: reject_route
      params:
        { route: "xelatex", reason: "pstricks/pspicture hard wall on tectonic" }
    engines:
      tectonic: { mode: native }
      xelatex: { mode: skip } # xelatex 下 pstricks 可走 (dvips 后端另议), 不触发
    provenance:
      - {
          corpus: "pstricks-probe (docs/research/latex/pstricks-route.md)",
          error: "xdvipdfmx EPS hard wall",
        }
    stats:
      {
        fires: 0,
        note: "v1 为 eps_route fileset 版; v2 拆出 .eps 改走 ps_image 循环规则",
      }
    source_ref: "docs/08-translate-compile.md L218, L271; fixloop-v2 整改"

  - id: static_precheck
    description: "静态扫全部源码的 \\usepackage|\\RequirePackage|\\documentclass → 探测缺失 → filemap 批量装包 (一次装好, 省 N 轮循环)"
    phase: precheck
    order: 0
    when: { always: true }
    action:
      kind: scan_install
      params:
        scan_patterns:
          - {
              regex: "\\\\(?:usepackage|RequirePackage)\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              split: ",",
              suffix: ".sty",
            }
          - {
              regex: "\\\\documentclass\\s*(?:\\[[^\\]]*\\])?\\s*\\{([^}]+)\\}",
              suffix: ".cls",
            }
          # \input/\include/\InputIfFileExists —— 花括号/裸名两形态通收;
          # suffix 仅在名无扩展时补 (engine.py _apply_scan_install 条件化)
          # —— `\input epsf` 裸名此前不进预检清单 (loop1 实证)。
          - {
              regex: "\\\\(?:input|include|InputIfFileExists)(?=[^a-zA-Z])\\s*\\{?([^\\s{}%\\\\]+)",
              suffix: ".tex",
            }
        verify: file_probe # kpsewhich / 本地探测
        batch: true # 聚合后单次安装 (L611-617)
        noise_filter: "^[\\w.-]+$" # 滤掉 '\\\\@tempb.sty' 类误捕 token (见 known_gaps)
    engines:
      xelatex: { mode: native }
      tectonic:
        mode: degrade
        degrade: skip # bundle 按需拉包, 预检基本多余
        fallback: ctan_fetch # 增强位: 仅做本地存在性检查, 缺则 ctan_fetch
        note: "bundle 没有的包 (自定义 sty) 仍值得预检 → 保留轻量版"
    provenance:
      - { corpus: "*", error: "冷 TEXMFHOME 下高频 missing_file" }
    stats: { fires: 22, note: "22/22 格执行; 每格装 0-9 包" }
    source_ref: "fixloop.py L594-618"

  # ─── loop: install 系 —— 环境缺失优先于源码改写 ───
  - id: install_file
    description: "缺文件 (.sty/.cls/.fd/.def/…) → filemap 查包 → 安装 → 探测复核"
    phase: loop
    order: 10
    when: { category: missing_file, payload_required: true }
    action:
      kind: install_file
      params:
        file: "{payload}"
        font_related_exts: [tfm, pfb, vf, fd, map, enc] # 命中扩展名 → 装后重建 map (L307)
        verify: file_probe # 装后复核; 仍缺 → applied=False 落后续规则 (L274-275)
        already_present_ok: true # 探测已在 → 记 applied (L268-269; 见 known_gaps 归因噪音)
    engines:
      xelatex:
        { mode: native, via: "tlmgr search --file → tlmgr --usermode install" }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # filemap(tlpdb 索引)→tlnet archive→解包到工作目录/本地 texmf
        fallback: advisory # 索引查不到 → 产出建议性报错 (附候选包名)
    provenance:
      - { corpus: "1706.03762/baseline", error: "File `import.sty' not found" }
      - {
          corpus: "1810.04805/*",
          error: "File `xifthen.sty' / `ifmtarg.sty' not found",
        }
      - {
          corpus: "*/ctex|zh (14格)",
          error: "File `zhnumber.sty' not found (ctex 注入链)",
        }
    stats: { fires: 26, rescued_cells: 17 }
    source_ref: "fixloop.py L301-311, L264-276"

  # 2026-09-16 wave-2: babel_opt 类目原无消费规则 (纯死端)。机理=稿传
  # [german]/[russian] 等老语言选项 → babel 找不到对应 ldf (babel-<lang>
  # 包未装; Arch 侧 tlpdb 注册装了但 runfiles 缺席 → 系统树假在场)。
  # payload=语言名 → try_exts 拼 {lang}.ldf / {lang}b.ldf 双候选
  # (russian→russianb.ldf 实证命名) → filemap → babel-<lang> 真包。
  # 覆盖 31/33; ukrainian(ukraineb)/polutonikogreek(TL 无此 ldf) 残留。
  - id: babel_lang_ldf_install
    description: "babel 语言选项缺 ldf → filemap 装 babel-<lang> 包"
    phase: loop
    order: 11 # install_file(10) 后, legacy_pkg_shim(12) 前
    when: { category: babel_opt, payload_required: true }
    action:
      kind: install_file
      params:
        file: "{payload}"
        try_exts: [".ldf", "b.ldf"]
    engines:
      xelatex: { mode: native, via: "filemap {lang}.ldf→babel-<lang> → usermode install" }
      tectonic:
        mode: degrade
        degrade: ctan_fetch # 同 install_file 降级通路
    provenance:
      - {
          corpus: "loop2-delta babel_opt×11 (+loop1 共 33)",
          error: "Package babel Error: Unknown option 'german'",
        }
    stats: { fires: 0 }
    source_ref: "wave-2 落地: taxonomy babel_opt (:301) 首个消费规则"

  # fixable-data 裁定 (1003.2165): polutonikogreek 是弃名, greek.polutoniko
  # 亦走 locale/invalid/ 弃名桩必炸。现行 ini 正形是 `greek.polytonic`
  # (locale/el/babel-polytonicgreek.tex 自证 "Provided: greek.polytonic";
  # 裸 `polytonicgreek` 选项反而炸 —— \languageattribute{greek} 要求 greek
  # 语言本体已载)。装 babel-greek 的 greek.ldf 更糟: XeTeX 下 ldf 硬拒。
  # 只改选项位 (方括号列表 + PassOptionsToPackage/Class 首参)。
  - id: babel_opt_polutoniko_rewrite
    description: "babel 弃名 polutonikogreek / greek.polutoniko → greek.polytonic (ini 机制)"
    phase: loop
    order: 13 # babel_lang_ldf_install(11) 之后: 装得上真 ldf 的先装, 此条兜无档语言
    when: { category: babel_opt, payload_required: false }
    condition:
      any:
        - { source_contains: "polutonikogreek" }
        - { source_contains: "greek\\.polutoniko" }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          # 选项括号可跨行 (1003.2165 docclass 选项表逐行注释排版实证)
          - {
              pattern: "\\[([^\\]]*)\\bgreek\\.polutoniko\\b",
              repl: "[\\g<1>greek.polytonic",
            }
          - {
              pattern: "\\[([^\\]]*)\\bpolutonikogreek\\b",
              repl: "[\\g<1>greek.polytonic",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*)\\bgreek\\.polutoniko\\b",
              repl: "\\g<1>greek.polytonic",
            }
          - {
              pattern: "(\\\\PassOptionsTo(?:Package|Class)\\s*\\{[^}]*)\\bpolutonikogreek\\b",
              repl: "\\g<1>greek.polytonic",
            }
    risk: low # 同语言现行属性形; ini 路由 XeTeX 原生支持
    known_gap: "\\selectlanguage{polutonikogreek} 等正文引用不改 (选项修正后 greek 语言在位, 旧名引用 babel 兼容层接住); 需 babel ≥3.x ini 机制"
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same }
    provenance:
      - {
          corpus: "fixable-data adjudication (1003.2165)",
          error: "Package babel Error: Unknown option 'polutonikogreek' (src 写 greek.polutoniko, ini 弃名桩报错)",
        }
    stats: { fires: 0 }
    source_ref: "scout-fail59 fixable-data 杂项; babel_lang_ldf_install 残留格"

  # 新增 (fixloop-v2 整改): 退役/改名包 shim —— install_file 查无真包后的出路。
  # 实证: 1806.06690 缺 aastex.cls → emulateapj 顶替出 13 页全文档 pdf;
  # psfig→epsfig 桥可用因 epsfig 的 Gin key 同收 figure=/file= (graphics pkg,
  # TL 内装得上)。真 2.09 文档到不了这里 —— gate 先拒, 语义分层干净。
  - id: legacy_pkg_shim
    description: "退役/改名包 (aastex/revtex.cls/psfig.sty 老名) → wdir 注入同名 stub + 装依赖"
    phase: loop
    order: 12 # install_file(10) 之后: 真包装得上先用真包, 查无才 shim
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: legacy_pkg_shim
      params:
        shim_map:
          # aastex→emulateapj 需自定义 body: emulateapj 的 deluxetable 重实现
          # 明写 \rotate 不支持 (cls 注释 "too difficult to implement"),
          # \providecommand 空宏保底 —— 表格竖排不换向, 内容全保 (1806.06690)。
          # \ProvidesClass 版本串必须日期开头, 否则 \@ifl@t@r 解析崩 \ifnum。
          aastex.cls:
            needs: ["emulateapj.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{aastex}[2026/09/15 fixloop legacy shim -> emulateapj]
              % emulateapj 内 \usepackage{emulateapj5} 自指递归爆栈
              % (BeginEnvironment 包 \begin → input stack 10000) —— 预注册
              % ver@/opt@ 令 \@ifl@aded 判已载, usepackage 成 no-op (1d 实证×2)
              \expandafter\def\csname ver@emulateapj5.sty\endcsname{2026/09/17}
              \expandafter\def\csname opt@emulateapj5.sty\endcsname{twocolumn,onecolumn}
              \LoadClassWithOptions{emulateapj}
              \providecommand{\rotate}{}
              \endinput
          revtex.cls: { loads: "revtex4-2", needs: ["revtex4-2.cls"] }
          psfig.sty:
            needs: ["epsfig.sty"]
            body: |
              % 版本串必须日期开头 —— \@ifl@t@r 解析 ver@*.sty, 裸文字会
              % 触发 "Missing = inserted for \ifnum" (halt-on-error 下致命)
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{psfig}[2026/09/15 fixloop legacy shim -> epsfig]
              \RequirePackage{epsfig}
              \let\psfig\epsfig
              \endinput
          # ── 2026-09-16 n100 F1 扩列 ──────────────────────────────────
          # elsart 家族 → elsarticle: Elsevier 官方继任类, 明确兼容 elsart 稿
          # (\author[tag]/\address[tag]/abstract 环境同签名)。0707.4465 实证。
          # elsart.cls 转 body 形 (hep-lat/0111059): 派生类 cpcauth
          # \LoadClass{elsart} 后直接引用 elsart 私有面, elsarticle 不导出。
          # eqntopsep/eqnarraycolsep 被赋 \@plus/\@minus 胶 → 必须 \newskip;
          # \@bls 在因子位 (2\@bls) 用 → \newdimen。余为 elsart 私有 if/count/
          # 版式宏; \@sharp 由内核 \mkpream 自绑, 无需补。纯增量对普通
          # elsart 稿无副作用。
          elsart.cls:
            needs: ["elsarticle.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{elsart}[2026/09/17 fixloop legacy shim -> elsarticle]
              \LoadClassWithOptions{elsarticle}
              \newskip\eqntopsep
              \newskip\eqnarraycolsep
              \newdimen\@bls
              \@bls=13\p@
              \newdimen\@frontmatterwidth
              \newcount\@maxlistdepth
              \@maxlistdepth=8
              \newif\if@TwoColumn
              \@TwoColumntrue
              \newif\if@ussrhead
              \newif\if@Elproofing
              \def\@pagenumprefix{}
              \def\ESpagenumber#1{\arabic{#1}}
              \def\head@format#1#2{#1\space#2}
              \def\@secnumfont{\bfseries}
              \def\head@style{}
              \endinput
          elsart1p.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          elsart3p.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          elsart5p.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          elsevier.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          # elsart 旁系 (gtrap-scout-2026-09-16 §a): elsart3/3-1/elsart1、
          # autart (Automatica, \proc@elem 逐字节同 elsart)、personal
          # (elsart 克隆) —— 非 ship 声明的 class-not-found 模态同图
          # elsarticle; ship 真载体的 misschar 毒化由 CJK_FIRST_USE_WARMUP
          # 覆盖 (cmrepro 10/10 实证), 不属本表。
          elsart3.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          elsart3-1.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          elsart1.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          autart.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          personal.cls: { loads: "elsarticle", needs: ["elsarticle.cls"] }
          # sig-alternate (ACM ≤2015 版式) → acmart 官方继任; naturemag → nature。
          sig-alternate.cls: { loads: "acmart", needs: ["acmart.cls"] }
          sig-alternate-05-2015.cls: { loads: "acmart", needs: ["acmart.cls"] }
          naturemag.cls: { loads: "nature", needs: ["nature.cls"] }
          # AASTeX v6.x 全退役 (TL 无 aastex6x) → emulateapj + 6x 宏面 polyfill。
          # emulateapj 自带 deluxetable*/\tablehead/\affiliation/\keywords/\dataset
          # 等 aastex5 面; 6x 新增元数据宏在 body 里补 (2105.03750 实证面:
          # \received/\email/\correspondingauthor/\startlongtable/\facilities 等)。
          aastex61.cls:
            needs: ["emulateapj.cls", "epsf.sty"]
            body: &aastex6x_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{aastex6x}[2026/09/16 fixloop legacy shim -> emulateapj]
              % emulateapj5 自指递归保险 —— ver@/opt@ 预注册同 aastex.cls 条
              \expandafter\def\csname ver@emulateapj5.sty\endcsname{2026/09/17}
              \expandafter\def\csname opt@emulateapj5.sty\endcsname{twocolumn,onecolumn}
              \LoadClassWithOptions{emulateapj}
              \providecommand{\received}[1]{}
              \providecommand{\revised}[1]{}
              \providecommand{\accepted}[1]{}
              \providecommand{\published}[1]{}
              \providecommand{\submitjournal}[1]{}
              \providecommand{\correspondingauthor}[1]{}
              % emulateapj 自带 revtex 系 \email (隐参+可选参, 内部 \@AF@join 未武装
              % 会炸) 与 \collaboration (revtex 组语义) —— provide 不够, 得 renew 覆盖
              \providecommand{\email}[1]{}
              \renewcommand{\email}[1]{}
              \providecommand{\collaboration}[2]{#2}
              \renewcommand{\collaboration}[2]{#2}
              % \keywords 在 emulateapj 受 showkeys 选项门控 —— 同样覆盖成确定性版式
              \providecommand{\keywords}[1]{}
              \renewcommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              % emulateapj \url→\anchor 原样排印参数 —— footnote 等已冻结参数内
              % catcode-8 `_`/`^`/`&` 炸 Missing $ (2105.03750 实证)。真身
              % aastex63 装 hyperref 后 \url 走 detokenize-rescan 全收; shim 取
              % 轻量等价: \detokenize 回收成 catcode-12 文本再 \texttt 排印
              % (TU 下 `_`/`^` 有真字形)。签名兼容 emulateapj \@dblarg 形:
              % \url{X} 与 \url[anchor]{X} 都排 X
              \renewcommand{\url}[2][]{\texttt{\detokenize{#2}}}
              \providecommand{\nocollaboration}[1]{}
              \providecommand{\facilities}[1]{\par\noindent\textbf{Facilities:} #1\par}
              \providecommand{\software}[1]{\par\noindent\textbf{Software:} #1\par}
              % aastex6x \startlongtable 把 deluxetable 拉成长表; emulateapj 的
              % deluxetable 本就是 longtable 实现 —— no-op 语义一致
              \providecommand{\startlongtable}{}
              \providecommand{\endlongtable}{}
              \providecommand{\watermark}[1]{}
              \providecommand{\rotate}{}
              \endinput
          aastex62.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          aastex63.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          aastex631.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          AASTeX62.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          # 老 APS 类 (revtex3 时代): prl.cls → revtex4-2 的 aps,prl 版式。
          # 0905.1767 precheck 实证缺名 (编译未实际请求 —— 前瞻性条目)。
          prl.cls:
            needs: ["revtex4-2.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{prl}[2026/09/16 fixloop legacy shim -> revtex4-2 aps,prl]
              \PassOptionsToClass{aps,prl}{revtex4-2}
              \LoadClassWithOptions{revtex4-2}
              % revtex4-2 把 frontmatter 机器 (\collaboration@sw/\AU@grp 等) 推迟到
              % \begin{document} 的 \frontmatter@init 才武装; revtex3 时代老稿在
              % 导言区就调 \author → 提前跑一遍并冻结, 防 begin-doc 重跑清数据
              \frontmatter@init
              \let\frontmatter@init\relax
              \endinput
          apl.cls:
            needs: ["revtex4-2.cls"]
            body: |
              % AIP apl.cls (Applied Physics Letters 老类) → revtex4-2 aip,apl
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{apl}[2026/09/16 fixloop legacy shim -> revtex4-2 aip,apl]
              \PassOptionsToClass{aip,apl}{revtex4-2}
              \LoadClassWithOptions{revtex4-2}
              % 同 prl.cls —— 提前武装 frontmatter 机器供导言区 \author 用
              \frontmatter@init
              \let\frontmatter@init\relax
              \endinput
          # revtex4.cls 老名 (revtex4.cls 表项之上另名, 1003.4522 实证) ——
          # 同 frontmatter 提前武装。
          revtex4.cls:
            needs: ["revtex4-2.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{revtex4}[2026/09/16 fixloop legacy shim -> revtex4-2]
              \LoadClassWithOptions{revtex4-2}
              \frontmatter@init
              \let\frontmatter@init\relax
              \endinput
          # revtex4-1.cls: aastex61/62 内部 \IfFileExists 硬依赖 (缺失则
          # \stop 死路 → early_eof 零页; loop1 13 格实证簇)。TL 只存
          # revtex4-2 —— 同名桥 + frontmatter 提前武装。
          revtex4-1.cls:
            needs: ["revtex4-2.cls"]
