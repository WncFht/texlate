          svjour2.cls: { body: *svjour_body }
          # EPL epl2.cls (Europhysics Letters, 期刊外发): \abstract 为命令
          # 形态、\pacs 双参、\shortauthor/\shorttitle/\shortinstitute。
          epl2.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{epl2}[2026/09/16 fixloop legacy shim -> article + epl polyfills]
              \LoadClassWithOptions{article}
              \providecommand{\shorttitle}[1]{}
              \providecommand{\shortauthor}[1]{}
              \providecommand{\shortinstitute}[1]{}
              \providecommand{\institute}[1]{}
              \providecommand{\pacs}[2]{\par\noindent\textbf{PACS:} #1\quad #2\par}
              \providecommand{\abstract}{}
              \renewcommand{\abstract}[1]{\begin{quotation}\noindent\textbf{Abstract.} #1\end{quotation}}
              \endinput
          # IMS imsart.cls (TL 无): article 底 + frontmatter 常用件。
          imsart.cls:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{imsart}[2026/09/16 fixloop legacy shim -> article + imsart polyfills]
              \LoadClassWithOptions{article}
              \providecommand{\thankstext}[2]{}
              \providecommand{\affiliation}[1]{}
              \providecommand{\address}[2]{{\footnotesize #2\par}}
              \providecommand{\runtitle}[1]{}
              \providecommand{\runauthor}[1]{}
              \endinput
          # ACM conm-p-l.cls (90s 会议 preprint 版式) → acmart 官方继任。
          conm-p-l.cls: { loads: "acmart", needs: ["acmart.cls"] }
          # JHEP/JINST 作者样式、Elsevier espcrc1 —— TL 全数缺席, noop 保底。
          jheppub.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{jheppub}[2026/09/16 fixloop noop stub - JHEP author kit, not in TL]
              \endinput
          jinstpub.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{jinstpub}[2026/09/16 fixloop noop stub - JINST author kit, not in TL]
              \endinput
          espcrc1.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{espcrc1}[2026/09/16 fixloop noop stub - Elsevier crc, not in TL]
              \endinput
          # 杂项 CTAN-only/退役件: Paul Taylor diagrams (license 不进 TL,
          # 宏面巨大 noop 仅过 missing_file)、texsort 字母序件、setstack
          # 堆栈宏件、default.sty 模板渣名。
          diagrams.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{diagrams}[2026/09/16 fixloop noop stub - P.Taylor diagrams, not in TL]
              \endinput
          texsort.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{texsort}[2026/09/16 fixloop noop stub - letter sort util, not in TL]
              \endinput
          setstack.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{setstack}[2026/09/16 fixloop noop stub - S-stack macros, not in TL]
              \endinput
          default.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{default}[2026/09/16 fixloop noop stub - template cruft name]
              \endinput
          # undertilde 唯一宏面 \utilde → \widetilde 降级近似 (真身依赖
          # 专用 .tex 字体机制, CTAN-only)。
          undertilde.sty:
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{undertilde}[2026/09/16 fixloop degrade shim -> widetilde]
              \providecommand{\utilde}[1]{\widetilde{#1}}
              \endinput
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # stub 注入与引擎无关; needs 装不上则下轮 missing_file 归因
    provenance:
