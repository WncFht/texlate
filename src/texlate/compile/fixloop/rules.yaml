          # axodraw v1 → axodraw2 (TL 唯一存续支; v1 核心费曼图宏 \Line/
          # \Gluon/\Photon/\ArrowLine 等同名续存, 色彩/缩放面有差 —— 残差
          # 交 undefined_cs 轮)。
          axodraw.sty:
            needs: ["axodraw2.sty"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{axodraw}[2026/09/17 fixloop legacy shim -> axodraw2 + fallback noops]
              % needs 装不上时死端实证 (0905.4380/0806.1498/hep-ph/0501163):
