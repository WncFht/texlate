          # ── 2026-09-16 loop1 missing_file 簇扩列 (113 格主体) ──────────
          # 实证: 下列文件在 tlpdb 索引查无 (publisher 授权外发/CTAN-only/
          # 退役件), install_file/tlmgr 通路救不了 —— 桥接优先于 noop;
