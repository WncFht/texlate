              \providecommand{\address}[2][]{\newline{\let\\\newline\footnotesize #2}}
              \providecommand{\email}[1]{\texttt{#1}}
              \providecommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              \providecommand{\PACS}[1]{\par\noindent\textbf{PACS:} #1\par}
              \@ifundefined{keyword}{\newenvironment{keyword}{\par\noindent\textbf{Keywords:}\space}{\par}}{}
