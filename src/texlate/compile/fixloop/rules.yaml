          # geom.sty (S. Levy 1992, LaTeX2.09 巨型样式; 不在 TL) —— geometry
          # 桥接 + 宏面 polyfill (0806.0904 \input{geom.sty} 实证)。经 \input
          # 装载 → @ catcode=12, 本 stub 全禁 @-cs。原包宏面 (CTAN 取件核实):
          # \fullref/\Fullref/\reftype/\Reftype/\label*/\setlabeltype/\preref/
          # \ifproofing/\ifautolabel/\presection/\marginparstyle/\markbothsame/
          # \unnumbered(=\the<cnt>置\relax); \margins 非原包 API (稿自定义)
          # → providecommand 不覆盖; \ns 原包亦未解析 → no-op。
          geom.sty:
            needs: ["geometry.sty"]
            body: |
              \typeout{fixloop legacy shim: geom.sty -> geometry + polyfills}
              \RequirePackage{geometry}
              \newif\ifproofing \proofingfalse
              \newif\ifautolabel \autolabelfalse
              \providecommand{\prooftag}[1]{}
              \providecommand{\theoremintro}[1]{}
              \providecommand{\ns}{}
              \providecommand{\marginparstyle}[1]{}
              \providecommand{\mediumseries}{\mdseries}
              \providecommand{\normalshape}{\normalfont}
              \providecommand{\presection}[1]{\vspace{#1}}
              \providecommand{\markbothsame}[1]{\markboth{#1}{#1}}
              \providecommand{\unnumbered}[1]{\expandafter\let\csname the#1\endcsname\relax}
              \providecommand{\margins}[3][0pt]{\newgeometry{hmargin=#2,vmargin=#3}}
              \providecommand{\fullref}[1]{\ref{#1}}
              \providecommand{\Fullref}[1]{\ref{#1}}
              \providecommand{\reftype}[1]{}
              \providecommand{\Reftype}[1]{}
              \providecommand{\setlabeltype}[2]{}
              \providecommand{\preref}{}
              \let\geomoriglabel\label
              \def\label{\futurelet\geomnext\geomlabelx}
              \def\geomlabelx{\ifx\geomnext*\expandafter\geomlabelstar\else\expandafter\geomoriglabel\fi}
              \def\geomlabelstar*#1{\geomoriglabel{#1}}
              \endinput
          # tcilatex.tex (TCI Scientific Word 私有初始化件, TL 无; 常见
          # \input{tcilatex} 夹在导言区) —— 批八按真身面升级 (1011.5681
          # 随稿本 1278 行取证): 用户面 func/limfunc/unit/dsum/QQQ/FRAME
          # + SW pragma noop 族全覆盖; 真身自包 \makeatletter。残面
          # (Greekmath 粗体希腊/\TCItag/\IFRAME 三态分派) 由下游
          # undefined_cs 继续归因。
          tcilatex.tex:
            body: |
              % fixloop legacy shim: tcilatex.tex — TCI SW 用户面抄值
              \makeatletter
              \def\func#1{\mathop{\rm #1}\nolimits}
              \def\limfunc#1{\mathop{\rm #1}}
              \def\unit#1{\mathord{\thinspace\rm #1}}
              \def\dsum{\mathop{\displaystyle\sum}}
              % QQQ{name}{replacement} — SW define-by-name 出口 (用户函数表)
              \long\def\QQQ#1#2{\long\expandafter\def\csname#1\endcsname{#2}}
              % FRAME{data}{w}{h}{vshift}{caption}{label}{name}{body} —— 真身
              % 按 data 首字母 (i/d/f) 分 inline/display/float 三型; shim 保文
              % 降版式: fbox+parbox 装 body, caption 小字附尾。
              \def\FRAME#1#2#3#4#5#6#7#8{\par\fbox{\parbox{\linewidth}{#8\par{\footnotesize #5\par}}}\par}
              % SW pragma 族 —— 排版指令通道, 全 noop/passthru (真身抄值)
              \@ifundefined{QTP}{\def\QTP#1{}}{}
              \@ifundefined{QEXCLUDE}{\def\QEXCLUDE#1{}}{}
              \@ifundefined{Qlb}{\def\Qlb#1{#1}}{}
              \@ifundefined{Qlt}{\def\Qlt#1{#1}}{}
              \def\QWE{}
              \long\def\QQA#1#2{}
              \def\QTR#1#2{{\csname#1\endcsname{#2}}}
              \long\def\TeXButton#1#2{#2}
              \long\def\QSubDoc#1#2{#2}
              \def\EXPAND#1[#2]#3{}
              \def\NOEXPAND#1[#2]#3{}
              \def\PROTECTED{}
              \def\LaTeXparent#1{}
              \def\ChildStyles#1{}
              \def\ChildDefaults#1{}
              \def\QTagDef#1#2#3{}
              \@ifundefined{correctchoice}{\def\correctchoice{\relax}}{}
              \@ifundefined{HTML}{\def\HTML#1{\relax}}{}
              \@ifundefined{TCIIcon}{\def\TCIIcon#1#2#3#4{\relax}}{}
              % verifier-batch8 残面回添 (真身 L601/811/819/1106/1268 抄值,
              % \msi@int 限位分发简化为 \mathop{\textstyle} 同 \tsum 式):
              \def\TEXTsymbol#1{\mbox{$#1$}}
              \def\tint{\mathop{\textstyle\int}}
              \def\tiint{\mathop{\textstyle\iint}}
              \def\tsum{\mathop{\textstyle\sum}}
              \def\tprod{\mathop{\textstyle\prod}}
              \def\tfrac#1#2{{\textstyle{#1\over#2}}}
              \def\stackunder#1#2{\mathrel{\mathop{#2}\limits_{#1}}}
              \makeatother
              \endinput
          # epsf.tex (老 epsf plain-TeX 图件接口; TL epsf 包 tex/generic/epsf/
          # 已有真身 —— overrides 直解后 xelatex 侧 tlmgr 装真包; tectonic
          # 侧 .tex 不可平铺 (同 binhex) → 本 stub 为 tectonic 通路兜底,
