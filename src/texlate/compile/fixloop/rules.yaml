  # 新增 (docs/08:270): xelatex 侧 minted v3 装包 × 工程自带 v2 frozencache
  # → 改挂 minted2 (v2 API 包)。注意改写只打包装载点: minted2 的 env 名仍是
  # {minted}, \begin{minted} 绝不能动 (盲改 {minted}→{minted2} 会毁 env)。
  - id: minted_v3_rewrite
    description: "minted v3 装包 × 工程 v2 frozencache → \\usepackage{minted}→{minted2} 装载点改写"
    phase: loop
    order: 135 # frozencache 剥选项(130)先试; 它放弃/复发才轮到
    when: { category: minted_froz }
    condition:
      engine_in: [xelatex]
      cache_dir_glob: "_minted-*" # 工程确有 frozencache 目录才是 v3×v2 错配
      package_version_ge: { file: "minted.sty", version: 3 }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex]
        rewrites:
          - {
              pattern: "\\\\(usepackage|RequirePackage)(\\s*\\[[^\\]]*\\])?\\s*\\{minted\\}",
              repl: '\\\g<1>\g<2>{minted2}',
            }
          - {
              pattern: "\\\\PassOptionsToPackage(\\{[^}]*\\})\\{minted\\}",
              repl: '\\PassOptionsToPackage\g<1>{minted2}',
            }
    risk: medium
    engines:
      xelatex: { mode: native }
      tectonic: { mode: skip } # tectonic 侧 minted 版本由 bundle 管, 无此错配
    provenance:
      - {
          corpus: "—",
          error: "minted v3 读 v2 frozencache 报 ~50 错 (docs/08:257)",
        }
    stats: { fires: 0, status: proposed }
    source_ref: "docs/08-translate-compile.md L257, L270"

