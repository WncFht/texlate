  # 新增 (fixloop-v2 整改): 退役/改名包 shim —— install_file 查无真包后的出路。
  # 实证: 1806.06690 缺 aastex.cls → emulateapj 顶替出 13 页全文档 pdf;
  # psfig→epsfig 桥可用因 epsfig 的 Gin key 同收 figure=/file= (graphics pkg,
  # TL 内装得上)。真 2.09 文档到不了这里 —— gate 先拒, 语义分层干净。
  - id: legacy_pkg_shim
    mechanisms: [B05, W80]
    description: "退役/改名包 (aastex/revtex.cls/psfig.sty 老名) → wdir 注入同名 stub + 装依赖"
    phase: loop
    order: 12 # install_file(10) 之后: 真包装得上先用真包, 查无才 shim
    when: { category: missing_file, payload_required: true }
    action:
      kind: builtin_transform
      function: legacy_pkg_shim
      params:
        shim_map:
          # aastex→emulateapj 需自定义 body: emulateapj 的 deluxetable 重实现
          # 明写 \rotate 不支持 (cls 注释 "too difficult to implement"),
          # \providecommand 空宏保底 —— 表格竖排不换向, 内容全保 (1806.06690)。
          # \ProvidesClass 版本串必须日期开头, 否则 \@ifl@t@r 解析崩 \ifnum。
          aastex.cls:
            needs: ["emulateapj.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{aastex}[2026/09/15 fixloop legacy shim -> emulateapj]
              % emulateapj 内 \usepackage{emulateapj5} 自指递归爆栈
              % (BeginEnvironment 包 \begin → input stack 10000) —— 预注册
              % ver@/opt@ 令 \@ifl@aded 判已载, usepackage 成 no-op (1d 实证×2)
              \expandafter\def\csname ver@emulateapj5.sty\endcsname{2026/09/17}
              \expandafter\def\csname opt@emulateapj5.sty\endcsname{twocolumn,onecolumn}
              \LoadClassWithOptions{emulateapj}
              \providecommand{\rotate}{}
              % aastex v5 前置元数据面 (6x body 同款, fixer-aastex-stub):
              % revtex 链 \email 依赖 \@AF@join 武装会炸 → provide+renew
              % no-op; slug-line 三元组保险; \paperid 稿号 slug revtex/
              % emulateapj 皆无 (0707.1778 活调用 → 参数泄漏级联实证)。
              \providecommand{\email}[1]{}
              \renewcommand{\email}[1]{}
              \providecommand{\received}[1]{}
              \providecommand{\revised}[1]{}
              \providecommand{\accepted}[1]{}
              \providecommand{\paperid}[1]{}
              \endinput
          revtex.cls: { loads: "revtex4-2", needs: ["revtex4-2.cls"] }
          psfig.sty:
            needs: ["epsfig.sty"]
            body: |
              % 版本串必须日期开头 —— \@ifl@t@r 解析 ver@*.sty, 裸文字会
              % 触发 "Missing = inserted for \ifnum" (halt-on-error 下致命)
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{psfig}[2026/09/15 fixloop legacy shim -> epsfig]
              \RequirePackage{epsfig}
              \let\psfig\epsfig
              \endinput
          # \input psfig / \input{psfig.tex} 裸装载形 (批七 wave-final ×1):
          # 同桥 epsfig —— \input 语境必在导言区 (psfig 史前装载惯例),
          # \RequirePackage 合法; 若真有正文内 \input 会报 preamble-only 错
          # 再议 (未观测)。裸 payload `psfig` 由 legacy_pkg_shim L722-726
          # 归一到 psfig.tex 键, 同条覆盖 ×6 裸签格。
          psfig.tex:
            needs: ["epsfig.sty"]
            body: |
              % fixloop legacy shim: psfig.tex -> epsfig (官方 (e)psfig emulation)
              \RequirePackage{epsfig}
              \endinput
          # ── AAS v4 系 2.09 选项文件 (批七, 22 格全量面调查) ──
          # \documentstyle[...,aasms4/aaspp4/aas2pp4]{article} 经 legacy
          # 重写成 \usepackage{...} → TL 不载 → missing_file。22 格使用面
          # 普查并集: \affil/\keywords/\received/\accepted/\journalid/
          # \articleid/\slugcomment/\lefthead/\righthead —— 元数据 noop +
          # 渲染保留宏。三体同面 (v4 family), anchor 复用。
          aasms4.sty:
            needs: []
            body: &aas4_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{aas4x}[2026/09/17 fixloop legacy shim -> article + AAS meta]
              \providecommand{\received}[1]{}
              \providecommand{\accepted}[1]{}
              \providecommand{\journalid}[2]{}
              \providecommand{\articleid}[2]{}
              \providecommand{\slugcomment}[1]{\par\noindent{\footnotesize #1\par}}
              \providecommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              \providecommand{\affil}[1]{\par\noindent{\small #1\par}}
              \providecommand{\lefthead}[1]{\markboth{#1}{}}
              \providecommand{\righthead}[1]{\markboth{}{#1}}
              \endinput
          # aaspp4.sty 不在此 —— 下方 fuller body (deluxetable 面,
          # 9703134 实证) 才是真身条目; 旧 anchor 键曾在此造成 yaml
          # dup-key 后写赢死影, 批八清除。
          aas2pp4.sty: { needs: [], body: *aas4_body }
          # eqsecnum 2.09 选项文件 (wave-final 单格): 公式按节编号 ——
          # .sty 语境 @ 即字母, 无需 makeatletter 包装 (cs_table eqnobysec
          # 条目是 docclass 后注入, 语境不同才需要)。
          eqsecnum.sty:
            needs: []
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesPackage{eqsecnum}[2026/09/17 fixloop legacy shim]
              \@addtoreset{equation}{section}
              \renewcommand{\theequation}{\thesection.\arabic{equation}}
              \endinput
          # ── 2026-09-16 n100 F1 扩列 ──────────────────────────────────
          # elsart 家族 → elsarticle: Elsevier 官方继任类, 明确兼容 elsart 稿
          # (\author[tag]/\address[tag]/abstract 环境同签名)。0707.4465 实证。
          # elsart.cls 转 body 形 (hep-lat/0111059): 派生类 cpcauth
          # \LoadClass{elsart} 后直接引用 elsart 私有面, elsarticle 不导出。
          # eqntopsep/eqnarraycolsep 被赋 \@plus/\@minus 胶 → 必须 \newskip;
          # \@bls 在因子位 (2\@bls) 用 → \newdimen。余为 elsart 私有 if/count/
          # 版式宏; \@sharp 由内核 \mkpream 自绑, 无需补。纯增量对普通
          # elsart 稿无副作用。
          elsart.cls:
            needs: ["elsarticle.cls"]
            body: &elsart_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{elsart}[2026/09/17 fixloop legacy shim -> elsarticle]
              \LoadClassWithOptions{elsarticle}
              \newskip\eqntopsep
              \newskip\eqnarraycolsep
              \newdimen\@bls
              \@bls=13\p@
              \newdimen\@frontmatterwidth
              \newcount\@maxlistdepth
              \@maxlistdepth=8
              \newif\if@TwoColumn
              \@TwoColumntrue
              \newif\if@ussrhead
              \newif\if@Elproofing
              \def\@pagenumprefix{}
              \def\ESpagenumber#1{\arabic{#1}}
              \def\head@format#1#2{#1\space#2}
              \def\@secnumfont{\bfseries}
              \def\head@style{}
              % 批八: elsart 公开面补 (corauth 30格实证) —— \corauth[label]{注}
              % 桥 elsarticle \cortext; \startlocaldefs/\endlocaldefs 是
              % elsart 导言区局部定义定界 (imsart 同构), noop 对吞界定符
              % 保留内部定义生效; \end 前缀名 \@ifdefinable 拒收用 ifdefined 守。
              \providecommand{\corauth}[2][]{\ifdefined\cortext\cortext[#1]{#2}\fi}
              \providecommand{\startlocaldefs}{}
              \ifdefined\endlocaldefs\else\def\endlocaldefs{}\fi
              % verifier-batch8 残面回添: \corauthref{label} 引注号回指 +
              % frontmatter 依赖件 —— \NoHyper 是 hyperref 时代 env 名
              % (elsart 稿当 begin/end 用), \t@glob@notes 是 elsarticle
              % 内部注件容器 (@=letter 域内直定义)。
              \providecommand{\corauthref}[1]{\ref{#1}}
              \ifdefined\NoHyper\else\newenvironment{NoHyper}{}{}\fi
              \providecommand{\t@glob@notes}{}
              \endinput
          # 批八: elsart 全系兄弟共享同体 (ProvidesClass 名差仅 warning,
          # siam_body 先例) —— loads 裸桥无公开宏面, elsart1p 实证 corauth 炸。
          elsart1p.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsart3p.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsart5p.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsevier.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          # elsart 旁系 (gtrap-scout-2026-09-16 §a): elsart3/3-1/elsart1、
          # autart (Automatica, \proc@elem 逐字节同 elsart)、personal
          # (elsart 克隆) —— 非 ship 声明的 class-not-found 模态同图
          # elsarticle; ship 真载体的 misschar 毒化由 CJK_FIRST_USE_WARMUP
          # 覆盖 (cmrepro 10/10 实证), 不属本表。
          elsart3.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsart3-1.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          elsart1.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          autart.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          personal.cls: { needs: ["elsarticle.cls"], body: *elsart_body }
          # sig-alternate (ACM ≤2015 版式) → acmart 官方继任; naturemag → nature。
          sig-alternate.cls: { loads: "acmart", needs: ["acmart.cls"] }
          sig-alternate-05-2015.cls: { loads: "acmart", needs: ["acmart.cls"] }
          naturemag.cls: { loads: "nature", needs: ["nature.cls"] }
          # AASTeX v6.x 全退役 (TL 无 aastex6x) → emulateapj + 6x 宏面 polyfill。
          # emulateapj 自带 deluxetable*/\tablehead/\affiliation/\keywords/\dataset
          # 等 aastex5 面; 6x 新增元数据宏在 body 里补 (2105.03750 实证面:
          # \received/\email/\correspondingauthor/\startlongtable/\facilities 等)。
          aastex61.cls:
            needs: ["emulateapj.cls", "epsf.sty"]
            body: &aastex6x_body |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{aastex6x}[2026/09/16 fixloop legacy shim -> emulateapj]
              % emulateapj5 自指递归保险 —— ver@/opt@ 预注册同 aastex.cls 条
              \expandafter\def\csname ver@emulateapj5.sty\endcsname{2026/09/17}
              \expandafter\def\csname opt@emulateapj5.sty\endcsname{twocolumn,onecolumn}
              \LoadClassWithOptions{emulateapj}
              \providecommand{\received}[1]{}
              \providecommand{\revised}[1]{}
              \providecommand{\accepted}[1]{}
              \providecommand{\published}[1]{}
              \providecommand{\submitjournal}[1]{}
              \providecommand{\correspondingauthor}[1]{}
              % emulateapj 自带 revtex 系 \email (隐参+可选参, 内部 \@AF@join 未武装
              % 会炸) 与 \collaboration (revtex 组语义) —— provide 不够, 得 renew 覆盖
              \providecommand{\email}[1]{}
              \renewcommand{\email}[1]{}
              \providecommand{\collaboration}[2]{#2}
              \renewcommand{\collaboration}[2]{#2}
              % \keywords 在 emulateapj 受 showkeys 选项门控 —— 同样覆盖成确定性版式
              \providecommand{\keywords}[1]{}
              \renewcommand{\keywords}[1]{\par\noindent\textbf{Keywords:} #1\par}
              % emulateapj \url→\anchor 原样排印参数 —— footnote 等已冻结参数内
              % catcode-8 `_`/`^`/`&` 炸 Missing $ (2105.03750 实证)。真身
              % aastex63 装 hyperref 后 \url 走 detokenize-rescan 全收; shim 取
              % 轻量等价: \detokenize 回收成 catcode-12 文本再 \texttt 排印
              % (TU 下 `_`/`^` 有真字形)。签名兼容 emulateapj \@dblarg 形:
              % \url{X} 与 \url[anchor]{X} 都排 X
              \renewcommand{\url}[2][]{\texttt{\detokenize{#2}}}
              \providecommand{\nocollaboration}[1]{}
              \providecommand{\facilities}[1]{\par\noindent\textbf{Facilities:} #1\par}
              \providecommand{\software}[1]{\par\noindent\textbf{Software:} #1\par}
              % aastex6x \startlongtable 把 deluxetable 拉成长表; emulateapj 的
              % deluxetable 本就是 longtable 实现 —— no-op 语义一致
              \providecommand{\startlongtable}{}
              \providecommand{\endlongtable}{}
              \providecommand{\watermark}[1]{}
              \providecommand{\rotate}{}
              \endinput
          aastex62.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          aastex63.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          aastex631.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          AASTeX62.cls:
            { needs: ["emulateapj.cls", "epsf.sty"], body: *aastex6x_body }
          # 老 APS 类 (revtex3 时代): prl.cls → revtex4-2 的 aps,prl 版式。
          # 0905.1767 precheck 实证缺名 (编译未实际请求 —— 前瞻性条目)。
          prl.cls:
            needs: ["revtex4-2.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{prl}[2026/09/16 fixloop legacy shim -> revtex4-2 aps,prl]
              \PassOptionsToClass{aps,prl}{revtex4-2}
              \LoadClassWithOptions{revtex4-2}
              % revtex4-2 把 frontmatter 机器 (\collaboration@sw/\AU@grp 等) 推迟到
              % \begin{document} 的 \frontmatter@init 才武装; revtex3 时代老稿在
              % 导言区就调 \author → 提前跑一遍并冻结, 防 begin-doc 重跑清数据
              \frontmatter@init
              \let\frontmatter@init\relax
              \endinput
          apl.cls:
            needs: ["revtex4-2.cls"]
            body: |
              % AIP apl.cls (Applied Physics Letters 老类) → revtex4-2 aip,apl
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{apl}[2026/09/16 fixloop legacy shim -> revtex4-2 aip,apl]
              \PassOptionsToClass{aip,apl}{revtex4-2}
              \LoadClassWithOptions{revtex4-2}
              % 同 prl.cls —— 提前武装 frontmatter 机器供导言区 \author 用
              \frontmatter@init
              \let\frontmatter@init\relax
              \endinput
          # revtex4.cls 老名 (revtex4.cls 表项之上另名, 1003.4522 实证) ——
          # 同 frontmatter 提前武装。
          revtex4.cls:
            needs: ["revtex4-2.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{revtex4}[2026/09/16 fixloop legacy shim -> revtex4-2]
              \LoadClassWithOptions{revtex4-2}
              \frontmatter@init
              \let\frontmatter@init\relax
              \endinput
          # revtex4-1.cls: aastex61/62 内部 \IfFileExists 硬依赖 (缺失则
          # \stop 死路 → early_eof 零页; loop1 13 格实证簇)。TL 只存
          # revtex4-2 —— 同名桥 + frontmatter 提前武装。
          revtex4-1.cls:
            needs: ["revtex4-2.cls"]
            body: |
              \NeedsTeXFormat{LaTeX2e}
              \ProvidesClass{revtex4-1}[2026/09/16 fixloop legacy shim -> revtex4-2]
              \LoadClassWithOptions{revtex4-2}
              \frontmatter@init
              \let\frontmatter@init\relax
              \endinput
