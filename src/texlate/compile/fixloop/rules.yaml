          # 吞掉降级 (clip 语义不移植)。\input 装载 → 禁 @-cs。
          epsf.tex:
            needs: ["graphicx.sty"]
            body: |
              \typeout{fixloop legacy shim: epsf.tex -> graphicx bridge}
              \RequirePackage{graphicx}
              \newdimen\epsfxsize \newdimen\epsfysize
              \newif\ifepsfverbose
              \let\epsfclipon\relax \let\epsfclipoff\relax
              \def\epsfsize#1#2{\epsfxsize=#1\epsfysize=#2\relax}
              \def\epsfbox{\futurelet\geomepsnext\geomepsbox}
              \def\geomepsbox{\ifx\geomepsnext[\expandafter\geomepsboxbb\else\expandafter\geomepsboxplain\fi}
              \def\geomepsboxbb[#1]#2{\geomepsinclude{#2}}
              \def\geomepsboxplain#1{\geomepsinclude{#1}}
              \def\geomepsinclude#1{\ifdim\epsfxsize>0pt
                \includegraphics[width=\epsfxsize]{#1}%
                \else\ifdim\epsfysize>0pt
                \includegraphics[height=\epsfysize]{#1}%
                \else\includegraphics{#1}\fi\fi}
              \let\epsffile\epsfbox
              \endinput
          # graphicx.tex (TL tex/plain/graphics/ miniltx 包装 —— LaTeX 稿
          # \input{graphicx} 的本意是 graphicx 包接口; filemap.overrides
          # 已钉 null 挡住 install 通路, 此 stub 桥到真包。
          # nucl-ex/0408018 实证: 真身装上后 \zap@space 递归爆栈 61 错。
