  # 新增 (fixloop-v2 整改): AAS 期刊缩写宏缺失 —— tectonic bundle 内置
  # aastex 5.0rc3.1 (1999) 没有 \actaa 族 (emulateapj/后期 aastex 才有);
  # undefined_cs payload (l.N 行末 cs 名) 命中期刊表 → 全表 \providecommand
