  # ─── loop: 源码改写系 —— 按"保守→激进"排序 ───
  - id: pdftex_prim_guard
    description: "pdfTeX 原语裸用 (\\pdfoutput 等 13 个) → \\ifdefined 守卫, xelatex 下静默跳过"
    phase: loop
    order: 50
    when: { category: pdftex_prim }
    action:
      kind: regex_rewrite
      params:
        exts: [.tex, .sty, .cls]
        rewrites:
          - {
              pattern: "(?<!ifdefined)(\\\\(pdfoutput|pdfminorversion|pdfcompresslevel|pdfinfo|pdfpagewidth|pdfpageheight|pdfhorigin|pdfvorigin|pdfsuppressptexinfo|pdftrailer|pdfpxdimen|pdflastxpos|pdflastypos))(\\s*=\\s*[^\\n%]*)",
              repl: '\\ifdefined\g<1>\g<0>\\fi',
            }
          - {
              pattern: "(?<!ifdefined)(\\\\(pdfoutput|pdfminorversion|pdfcompresslevel|pdfinfo|pdfpagewidth|pdfpageheight|pdfhorigin|pdfvorigin|pdfsuppressptexinfo|pdftrailer|pdfpxdimen|pdflastxpos|pdflastypos))(\\s*\\{[^\\n]*\\})",
              repl: '\\ifdefined\g<1>\g<0>\\fi',
            }
    risk: low # lookbehind 防重复套守卫, 幂等
    engines:
      xelatex: { mode: native }
      tectonic: { mode: same } # XeTeX 内核, 守卫语义一致
    provenance:
      - {
          corpus: "1412.6980/*",
          error: "Undefined control sequence \\pdfoutput",
        }
    stats: { fires: 3, rescued_cells: 3 }
    source_ref: "fixloop.py L344-361, L284-298"

