repos:
  # 顺序即语义：原地改写型 fixer（markdownlint --fix）在前，改了就 fail 一次
  # 让你 re-add；git-format-staged 链式 formatter 只写 index 收尾——commit
  # 永远成功，混合暂存时未暂存的编辑不受污染。
  # prettier / markdownlint-cli2 / gfs 版本以 package.json 为唯一事实源；
  # autocorrect 等系统工具走 brew。
  #
  # 本文件是通用 base：每个仓库都有 markdown + yaml + gitleaks。
  # 其他文件类型的 hook 块按 census 结果从 skill 的 references/recipes.md
  # 逐卡追加到下面的 hooks: 列表（缩进与现有条目一致）。
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 --fix
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
      - id: md-table-align
        name: md table display-width realign
        # MD060 按显示宽度（CJK=2）判对齐——markdownlint --fix/prettier 修
        # 不齐的表由本件原位改写兜底（MAINTENANCE §11「先 align 再 lint」
        # 的自动化）；幂等，已对齐的表零 diff。改写类 fail-re-add 语义同上。
        entry: uv run python tools/md_table_align.py
        language: system
        types: [markdown]
      - id: docs-linkcheck
        name: docs/ markdown dead-link check
        # 全量扫 docs/（pass_filenames: false）——删/改名目标件不触发本钩
        # 的盲区由 CI format job 同命令兜底。
        entry: uv run python tools/docs_linkcheck.py
        language: system
        files: '^docs/.*\.md$'
        pass_filenames: false
      - id: ruff-format-md
        name: ruff format (md python fences)
        # CI `ruff format --check .` 连 md 内 python 栅栏一起查；gfs stdin
        # 拿不到文件名识别不了栅栏，只能文件名模式原位改写——与
        # markdownlint --fix 同属"改了就 fail 一次 re-add"语义
        entry: ruff format
        language: system
        types: [markdown]
      # prettier 不进 md 链：它按字符宽给表格补白，与本仓表格显示宽度
      # （CJK=2，tools/md_table_align.py + MD060）约定互斥——同一张 CJK 表
      # 两件工具来回补白即乒乓。md 面 = markdownlint --fix → md-table-align
      # → ruff format（python 栅栏）→ autocorrect。
      - id: autocorrect-md
        name: autocorrect (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "autocorrect --stdin"
        language: system
        types: [markdown]
      - id: prettier-yaml
        name: prettier (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        types: [yaml]
      # yaml 散文注释 ≤80 显示列（CJK 按 2 列计——yamllint 只数字符所以
      # 自写）。check 类、失败才拦；断点该落标点/从句边界是语义判断，
      # 机检只管宽度，断点靠人工（机械重排用编辑器 reflow）。
      - id: yaml-comment-width
        name: yaml comment width (display cols)
        entry: python3 scripts/check-yaml-comments.py
        language: system
        types: [yaml]
      - id: prettier-js
        name: prettier (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        files: '\.(jsx?|mjs|cjs|json)$'
      - id: shfmt
        name: shfmt (staged content; zsh passthrough)
        entry: ./node_modules/.bin/git-format-staged --formatter "bash scripts/fmt-shell.sh"
        language: system
        types: [shell]
      - id: ruff-format
        name: ruff format (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "ruff format -"
        language: system
        types: [python]
      - id: taplo
        name: taplo fmt (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "taplo fmt -"
        language: system
        types: [toml]
      - id: shellcheck
        name: shellcheck (bash only; zsh skipped)
        entry: bash -c 'for f in "$@"; do head -1 "$f" | grep -q "^#!.*zsh" || shellcheck -S warning "$f"; done' --
        language: system
        types: [shell]
        # .agents/ vendored skill 原样入库——上游脚本不吃本仓 lint 口径
        exclude: "^.agents/"
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: eslint
        name: eslint
        entry: ./node_modules/.bin/eslint --max-warnings 0 --no-warn-ignored
        language: system
        files: '\.(jsx?|mjs|cjs)$'
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: '\.github/workflows/.*\.(yml|yaml)$'
      - id: rules-yaml-load
        name: fixloop rules/ load validation
        # 引用未实装 builtin / 非法转义会在整表 load 时 RulesetError——
        # 挂表入仓则 wave 逐格 error（809 格事故）。staged-only 校验：
        # pre-commit stash 后工作区即 staged 态，load 的就是待提交内容。
        # Ruleset.load() 默认装载 rules/ 目录合并视图——任一分片改动即
        # 触发全量校验（分片间合并冲突/引用断链只能整表验）。
        # 在飞窗口 --no-verify 绕过是约定逃生口；bench run 波前
        # Ruleset.load() preflight 兜底拦截。
        entry: uv run python -c "from texlate.compile.fixloop import Ruleset; Ruleset.load()"
        language: system
        files: '^src/texlate/compile/fixloop/rules/.*\.yaml$'
        pass_filenames: false
  # secret 门控：默认规则 + .gitleaks.toml 自定义（本仓自有凭据格式、
  # 历史已提交值的精确放行）。GitHub push protection 只认标准 pattern，
  # 自有格式靠这里的自定义规则拦。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
