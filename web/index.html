<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <!-- 浏览器外壳底色;实际值由 pdfTheme.applyPaletteChrome 按色板覆写 -->
        <meta name="theme-color" content="#f5f1e8" />
        <script>
            // 外观预置（单轴合并）：首绘前按色板键落 data-theme 归类防 FOUC——
            // 暗命名槽直暗，auto/none/未知值听 OS；旧 texlate-theme 键的迁移
            // 映射与 settings.ts readPaperTheme 同口径；面板色微调由 JS 补
            try {
                var p = localStorage.getItem("texlate-paper-theme");
                if (p === null) {
                    var t0 = localStorage.getItem("texlate-theme");
                    p =
                        t0 === "dark"
                            ? "dark"
                            : t0 === "light"
                              ? "paper"
                              : "auto";
                }
                var d =
                    p === "dark" ||
                    p === "onedark" ||
                    p === "black" ||
                    ((p === "auto" || p === "none") &&
                        matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.theme = d ? "dark" : "light";
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.content = d ? "#17140f" : "#f5f1e8";
            } catch (e) {}
        </script>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a63d2f'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='serif'%3E译%3C/text%3E%3C/svg%3E"
        />
        <title>TeXlate — arXiv 双语对照阅读</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
