<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <!-- 浏览器外壳底色;实际值由 settings.ts applyTheme 按已解析主题覆写 -->
        <meta name="theme-color" content="#f5f1e8" />
        <script>
            // 主题预置（U6）：首绘前落 data-theme 防 FOUC——store 侧接管后同键
            try {
                var c = localStorage.getItem("texlate-theme") || "auto";
                var d =
                    c === "dark" ||
                    (c === "auto" &&
                        matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.theme = d ? "dark" : "light";
            } catch (e) {}
        </script>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a63d2f'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='serif'%3E译%3C/text%3E%3C/svg%3E"
        />
        <title>TeXlate — arXiv 双语对照阅读</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
