# rules-fragment.yaml — acm_proc_article-sp.cls shim_map 条目替换件
# (fixer-legacy-acm, 2026-09-17)
#
# 挂点: src/texlate/compile/fixloop/rules.yaml → rules[id=legacy_pkg_shim]
#       .action.params.shim_map —— 替换现行一行:
#         acm_proc_article-sp.cls: { loads: "acmart", needs: ["acmart.cls"] }
#
# 背景: 纯 loads 桥只换类壳 —— 老 acm_proc 作者块族 (\alignauthor 列起始、
# \affaddr/\affinst、\titlenote、\additionalauthors、\numberofauthors) 在
# acmart 下未定义或语义错配。1306.0281 实证: \titlenote 嵌在 \author{} 参内,
# acmart 原生 \def\titlenote 在 \MakeUppercase 的 \__text_expand 里展开,
# 向 \@title 追加 \footnotemark → \@xfootnotemark 定界参失配 + Missing
# \endcsname 百连风暴 (unfixable:early_eof)。
#
# 设计:
#  * \titlenote 必须无条件重定义 (acmart 原生定义即炸点) —— \protected 桥到
#    \thanks: text_expand/pdfstring 里原样穿透, typeset 时落 \thankses 注脚条
#    (老语义=作者挂注, \thanks 即 acmart 对应物; \authornote 在 \addresses
#    展开中追加 mark 会丢锚, 不用)。
#  * \alignauthor 是列起始命令非分组命令 (名字文跑到 \\) —— 零参 \par 复刻
#    "新作者列"断行, 稿内固有 \\ 继续分行。
#  * \affaddr/\affinst 在 \author{} 参内顶层 —— acmart \affiliation 在此处
#    执行会向 \addresses 追加脏 token, 改走 inline emph 保文本。
#  * \numberofauthors acmart 自动计数 → noop (cs_table polyfill 已盖, 双保险)。
#  * \subtitle acmart 原生有 —— 守卫形仅防异路径。
#  * abstract 序桥: 老版式 abstract 在 \maketitle 后, acmart \@saveabstract
#    对已出 maketitle 的稿 ClassError (halt 臂 1306.0281 截死在标题页)。
#    条件重定义: maketitle 未出走原生 stash, 已出就地排成无号节。
#  * 2.09 字族开关: acmart 经 amsart 已带 \rm\sf\tt\bf\it\sl\sc 七件
#    (amsart.cls:437-443 DeclareOldFontCommand), 唯 \cal/\mit 被 amsart
#    有意略去 —— 稿内宏体 (head.tex \cA→{\cal A}) 展开即 undefined_cs
#    (shortsecret.tex ~100)。只补此二名, ifdefined 守。
#  * 守卫: \ifdefined...\else...\fi (\protected\def 需要显式前缀;
#    \titlenote 除外必须覆盖)。cls 装载期 @=letter, 私有 cs 直用。
#  * body 首行 \n 真实换行起 —— docclass 行尾 % 注释吞注入 seam belt
#    (cls 全量写本无此暴露, 保留无害, 防 body 复用进 _inject_after_docclass 类缝)。
#
# 降级面 (best_effort 可接受): 五作者并为单个 acmart author 条目 (原生
# per-author 结构无法从 \alignauthor 列流无损重建), 机构信息以 emph 行内
# 保留, titlenote 注文进 thanks 条; pdfauthor 元数据含整段脏串 (cosmetic)。
#
# 已知剩余残面 (不在本件覆盖, 留报告): tikzpicture env 实调而 preamble
# \usepackage{tikz} 被稿主注释 (cls 预载 tikz 有 option-clash 回归面, 不桥);
# missing \item ×~5 (lwehard/extlwe/shortsecret 文档侧 list 怪癖);
# \baselinestretch 重定义 ClassError + definition env 未闭合 (末端诊断)。

acm_proc_article-sp.cls:
  needs: ["acmart.cls"]
  body: "\n\\NeedsTeXFormat{LaTeX2e}\n\\ProvidesClass{acm_proc_article-sp}[2026/09/17 fixloop legacy shim -> acmart + author-block kit]\n\\LoadClassWithOptions{acmart}\n% --- acm_proc_article-sp author-block family under acmart (1306.0281) ---\n% \\alignauthor is a column-starter (no arg, name runs to \\\\) — \\par mirrors\n% the old \"new author column\" break inside the single acmart \\author{} arg.\n\\ifdefined\\alignauthor\\else\\protected\\def\\alignauthor{\\par}\\fi\n% \\affaddr/\\affinst{inst} sit loose inside \\author{} — acmart \\affiliation\n% would corrupt \\addresses there; inline emph keeps the text.\n\\ifdefined\\affaddr\\else\\protected\\def\\affaddr#1{\\emph{#1}}\\fi\n\\ifdefined\\affinst\\else\\protected\\def\\affinst#1{\\emph{#1}}\\fi\n% \\titlenote inside \\author{} executes inside \\MakeUppercase: acmart's\n% native def appends \\footnotemark to \\@title -> \\@xfootnotemark mismatch\n% + Missing \\endcsname storm (100 errs). Override is mandatory — \\protected\n% bridge to \\thanks survives text_expand and lands in the \\thankses strip.\n\\protected\\def\\titlenote#1{\\thanks{#1}}\n% \\additionalauthors{names} top-level -> register as another acmart author.\n\\ifdefined\\additionalauthors\\else\\protected\\long\\def\\additionalauthors#1{\\author{#1}}\\fi\n% \\numberofauthors{N} — acmart auto-counts (cs_table polyfill also covers).\n\\ifdefined\\numberofauthors\\else\\protected\\def\\numberofauthors#1{}\\fi\n% acmart has native \\subtitle — guard only for exotic load paths.\n\\ifdefined\\subtitle\\else\\protected\\def\\subtitle#1{}\\fi\n% Old acm_proc order puts abstract AFTER \\maketitle; acmart \\@saveabstract\n% ClassErrors once \\@ACM@maketitle@typeset. Conditional bridge: pre-maketitle\n% keeps the native Collect@Body stash; post-maketitle typesets the body as a\n% plain labelled block — NO Collect@Body on the late path (its body-scan\n% hijacks \\abstract and cannot tolerate a typesetting callback).\n\\renewenvironment{abstract}{\\if@ACM@maketitle@typeset\\par\\medskip\\noindent{\\bfseries\\abstractname.}\\space\\ignorespaces\\else\\Collect@Body\\@saveabstract\\fi}{\\if@ACM@maketitle@typeset\\par\\medskip\\fi}\n% 2.09 font switches: acmart inherits \\rm\\sf\\tt\\bf\\it\\sl\\sc from\n% amsart (its \\DeclareOldFontCommand block); only \\cal/\\mit are missing\n% (amsart deliberately omits them) — doc \\cA->{\\cal A} family needs them.\n\\ifdefined\\cal\\else\\DeclareOldFontCommand{\\cal}{\\normalfont\\itshape}{\\mathcal}\\fi\n\\ifdefined\\mit\\else\\DeclareOldFontCommand{\\mit}{\\normalfont\\itshape}{\\mathnormal}\\fi\n\\endinput\n"
