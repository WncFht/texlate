# fixer-acro-v3 交付片段 (2026-09-17) —— 1706.00240 acro v2→v3 键迁移
#
# 两处改动 (applied 到 src/texlate/compile/fixloop/rules.yaml):
#   A) taxonomy head 段新增 key_unknown 签名 —— 插在 undefined_color 之后、
#      invalid_char 之前 (即原 index 31 位, syntax/other 兜底之前)。
#   B) 既有规则 acro_v3_key_rename (order 167) 的 when.any 扩两类目。
#
# 机理: acro.sty v3.8 的 v2 兼容键定义整段在 \AcroModule{upgrade}
# (L5785-6098) 内, 非 upgrade 装载即被 \__acro_gobble_module:w 吞掉 →
# \acsetup{short-format=X} 报 "The key 'acro/short-format' is unknown"。
# 该 "LaTeX Error: The key" 行此前无任何 head 签命中 → 落 tail
# "No pages of output" → 误判 early_eof, acro_v3_key_rename 的
# when=other/emergency 永远接不到 → unfixable。
#
# 验证 (bench/results/fixer-acro-v3-2026-09-17/, verify.py):
#   baseline splice-base: unfixable:early_eof (r1 cat=early_eof 规则不点火)
#   candidate splice-test: r1 cat=key_unknown pay=acro/short-format,
#     acro_v3_key_rename 点火 → \acsetup{single, short-format=\acsize}
#     改写成 {single, format/short=\acsize} (逐字节核对, format/short 是
#     acro_deprecate_option:nn{format/short} 的官方 v3 目标键)。
#     acro 错消除, r2 推进到下一个既有潜伏错 (apj.bbx:194 biblatex
#     "Cannot patch bibliography macro author" —— apj.bbx 老样式 vs
#     新 biblatex 内核, 与 acro 无关的另一积压面)。
#   env 贴片说明: 两个 scratch 副本预改 font-termes.sty Noto Mono→
#     Noto Sans Mono 仅为让编译走到 acro 错 (Noto Mono 本机不存在);
#     非规则内容, 不进 fragment。

# ── A) taxonomy 新增 (插在 undefined_color 签名之后) ──
signature_add:
  - {
      id: key_unknown,
      scope: head,
      payload_group: 1,
      pattern: "The key '([\\w@./-]+)' is unknown and is being ignored",
    }

# ── B) acro_v3_key_rename when 段替换 (其余不动) ──
rule_patch:
  id: acro_v3_key_rename
  when:
    any:
      - { category: key_unknown }
      - { category: early_eof }
      - { category: other }
      - { category: emergency }
  # condition 不变: { ctx_suggests: "key 'acro/[\\w-]+' is unknown" }
  # early_eof 腿是 belt: acro 错非首错 (前面有他错抢 rep.first) 时
  # 仍落 tail early_eof, ctx_suggests 在 err_head 里照样能检到。
