# fixer-aastex-stub 交付 — legacy_pkg_shim params.shim_table 内 aastex.cls 条目替换。
# 合入方式: 用下方 aastex.cls 块整段替换 rules.yaml L728-736 现有条目。
#
# 变更: 补 aastex v5 期前置元数据宏面 (与 aastex6x_body 对齐):
#   - \email: revtex4/4-1 链提供的是 \sanitize@url+\@email 版, 在 emulateapj
#     (\@AF@join 未武装) 下炸 —— provide+renew no-op, 同 6x body 处置。
#     实证面: splice 树内活调用 75 格 (含 \author{...\email{...}} 内嵌)。
#   - \received/\revised/\accepted: revtex4(-1) 提供 [name]{date} 两参形,
#     v5 稿一参形调用兼容; 补 provide 仅作 revtex 加载失败边缘的保险。
#   - \paperid: aastex v5 稿号 slug 宏, emulateapj/revtex 链均无 ——
#     0707.1778 实证活调用: 未定义 → 参数 {71366} 泄漏导言区 →
#     Missing \begin{document} 级联。provide no-op 丢编辑部稿号。
#   - \journalid/\articleid 有意不收: 全部语料调用均为注释态 (0 活调用)。
#
# capacity×6 复查结论 (无需新规则):
#   astro-ph/0104174 + astro-ph/0408531 的 input-stack 爆栈 =
#   emulateapj.cls 内联 atbeginend 补丁 + 稿内 bundled emulateapj5.sty
#   二次补丁互捕 (\let\BeginEnvironment=\begin 拿到已补丁版) →
#   \begin{document} 无限互递归, pending token \BeforeBegdocument。
#   已由 2acf4e0 ver@/opt@emulateapj5 预注册根治 (\usepackage 整载 no-op)。
#   验证: 复刻 round-3 环境 (texmf 仅 revtex4 v4.0a、无 revtex4-1、wdir
#   bundled emulateapj5.sty 在场、稿面 \usepackage{emulateapj5}) —
#   0104174 → 3 页 clean, 0408531 → 4 页 clean, log 确认 emulateapj5 未载入。
#   已知残留 (不修): \input{emulateapj5} 直读路径绕过 ver@ 预注册 ——
#   语料内未见 \input 形态调用, 记 known_gap 不实现。
#   1907.00027 (main-memory capacity, revtex4-1 直用, 非 aastex 链) 与
#   1706.00335/2105.00111/1404.0037/1706.00076 (article/amsart 族 input-stack)
#   不属 aastex stub 面 —— 移交回 41 重新路由 (译文腐蚀/他类)。

# ── 替换块 (shim_map.aastex.cls) ──
aastex.cls:
  needs: ["emulateapj.cls"]
  body: |
    \NeedsTeXFormat{LaTeX2e}
    \ProvidesClass{aastex}[2026/09/15 fixloop legacy shim -> emulateapj]
    % emulateapj 内 \usepackage{emulateapj5} 自指递归爆栈
    % (BeginEnvironment 包 \begin → input stack 10000) —— 预注册
    % ver@/opt@ 令 \@ifl@aded 判已载, usepackage 成 no-op (1d 实证×2)
    \expandafter\def\csname ver@emulateapj5.sty\endcsname{2026/09/17}
    \expandafter\def\csname opt@emulateapj5.sty\endcsname{twocolumn,onecolumn}
    \LoadClassWithOptions{emulateapj}
    \providecommand{\rotate}{}
    % aastex v5 前置元数据面 (6x body 同款): revtex 链 \email 依赖
    % \@AF@join 武装会炸 → provide+renew no-op; slug-line 三元组保险。
    \providecommand{\email}[1]{}
    \renewcommand{\email}[1]{}
    \providecommand{\received}[1]{}
    \providecommand{\revised}[1]{}
    \providecommand{\accepted}[1]{}
    \providecommand{\paperid}[1]{}
    \endinput
