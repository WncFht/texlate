# scout-misschar-coverage findings — why ~350 pure-nonCJK misschar cells weren't healed
# Data: bench/results/stagerun-loop1-2026-09-16/cases.jsonl (347 pure-nonCJK rows, 128 unique pids)
# Companion files: cells.json (per-row census), rows.json (per-row cp/font/action detail), nofire.json

summary:
  pure_noncjk_rows: 347        # case rows with Missing character, zero CJK cps (41's "350")
  unique_pids: 128
  font_fallback_ever_fired_pids: 90   # 89 fired rows; mechanism applied but chars persist
  post_era_latest_rows: 118           # pids whose latest row ran after font_fallback existed (09-17 04:47+)

era_correction:
  finding: >-
    "font_fallback never fired" is mostly a STALE-DATA artifact: the rule first
    appears in fired rows at 2026-09-17 04:47. All no-fire+in-band rows from
    09-16 15:51–19:28 batches predate the rule. 76 pids have both early no-fire
    rows and a later fired row — the no-fire rows are pre-rule, not skip-bugs.
    In post-era latest rows, residual missing chars persist DESPITE
    font_fallback having applied ("N char(s) -> Libertinus Serif").
  implication: the true defect = mechanism reachability, not rule dispatch.

root_causes:  # on 118 post-era latest rows
  combining_mark_accent_generated:
    pids: 62
    dominant_cp: "U+0327 x61 (also 0301/0308/0351/0323)"
    mechanism: >-
      Accent cses (\c \~ \^ \' \" \u \v etc.) over bases with no precomposed
      glyph emit base + COMBINING-MARK nodes typeset in the ambient font
      ([lmroman*]:mapping=tex-text, which lacks U+0300-036F). The mark is
      generated by the accent machinery — never an input char — so
      \newunicodechar's active-char binding cannot intercept it.
    evidence:
      - "1206.1954 src: `M. Gu\\c{t}\\u{a}` (author Guță in \\bibitem) → 0327 in [lmroman9-regular]"
      - "2308.00063 splice L1022 mock-zh probe `这是译文\\c{这是译文}\\~{...}\\^{...}` → 0327 in [lmroman12]; char literal nowhere in sources (verified rglob)"
      - "2308.00063 log L811-812: missing 0327 in [lmroman12-regular]:mapping=tex-text; WHILE \\newunicodechar{̧} line 54 is present in the tex"
    fix_spec:
      rule: "new builtin accent_mark_fix (or extend missing_char_fix), order between missing_char_fix(25) and font_fallback(26)"
      action: >-
        For each missing combining-mark cp: map to accent cs
        (0327→\c 0301→\' 0308→\" 0303→\~ 0302→\^ 0300→\` 0307→\. 0304→\=
        0306→\u 030C→\v 030B→\H 0328→\k 0323→\d 0331→\b 030A→\r 0361→\t).
        Rewrite `\<cs>{x}` sites (masked view, .tex+.bbl+.cls): if
        unicodedata.normalize('NFC', x+mark) is a single char → replace with
        that literal char AND self-inject its \newunicodechar fallback line
        (do NOT rely on font_fallback re-fire: applied-key font_fallback:None
        is one-shot per cell). If no precomposed char → strip accent keep base.
      caveat: "accent cs in real math (\\' = \\acute) must NOT be rewritten inside math — limit to text-mode sites or rely on the cs-arg check"

  math_font_chars:
    pids: 36
    dominant_cps: "0xC5(Å)x9 0x141(Ł)x3 0x131(ı)x3 0xD8(ø)x2 0xB7 0xB1 0xA0 + combining marks in cmmi/cmr"
    mechanism: >-
      Two sub-modes. (a) char-producing cses used inside math: `Y$\i$lmaz`
      (0707.2150 author), `$\L^{\phi,p}` (1306.0480 math paper L-space),
      `\AA` in math context (1109.5670), `\def\i{\mathrm{i}}` (2112.00009) —
      cs expands inside math → char typeset via cmmi → missing; (b) literal
      chars typed inside math — newunicodechar fires but replacement
      `{\txlatefallback X}` in math still typesets X via the MATH font
      (\txlatefallback only switches text family) → still missing.
    fix_spec:
      literal: >-
        font_fallback replacement template → mode-aware:
        `{\ifmmode\mbox{\txlatefallback X}\else{\txlatefallback X}\fi}`
        (active chars DO expand in math; \mbox escapes to text mode where the
        fallback font applies). One-line template change in builtins.py.
      cs_form: >-
        prologue shim after \documentclass for no-arg letter cses that lack
        math meaning: {\i \j \L \l \O \o \AA \aa \AE \ae \OE \oe \ss \S \P
        \dag \ddag \copyright \pounds}: `\let\oldX\X \protected\def\X{\ifmmode
        \text{\oldX}\else\oldX\fi}`. Do NOT shim accent cses (\' \^ \~ have
        real math meanings = \acute \hat \tilde).

  cls_pretokenized_chars:
    pids: 2
    evidence: >-
      0806.2630 jetpl.cls lines 68/70/106 literal Cyrillic inside
      `\addtocontents{sod}{\protect УПДЕТЦБОЙЕ...}` — chars tokenized at cls
      load (before post-\documentclass injection activates them) or stored in
      token registers → active-char binding never sees them.
    fix_spec: >-
      Source-level literal-char replacement reaches these (rewrites bytes
      before tokenization): extend missing_char_fix params exts to
      [.tex,.cls,.sty,.bbl] so char_table replace + a source-level fallback
      wrapper can touch package internals. Alternative for the write/readback
      class: rely on the \addtocontents round-trip (chars re-tokenized on
      .sod read → active-char binding then works — depends which path the cls
      uses; jetpl uses token registers = NOT reachable).

  nullfont_noise:
    pids: 5
    mechanism: >-
      ASCII digits/punct (0x38 '8', 0x3b ';' etc.) reported 'in font nullfont'
      = measuring-box/\write contexts — unprintable BY DESIGN; no font fix
      can help; chars are not user-visible losses.
    fix_spec: >-
      signature-level exclusion (route to 1d): missing_char warn signature
      (rules.yaml L147 pattern "Missing character") should ignore
      `in font nullfont` lines; alternatively accept a no-op acknowledge rule.

  outband_coverage:
    pids: 13
    cps: "FFFD x4 (src mojibake dashes: '24812508' page ranges in bibitems — literal char, IS reachable), 200E LRM, 2044, 2211, 2217, 2032, 252c, F047 PUA, C1 0x80-0x9F, greek 0x3a5-0x3f5"
    fix_spec: >-
      char_table extensions (params-only, missing_char_fix): FFFD→`-`,
      C1→strip, U+200E/200B/FEFF→strip, PUA→strip+advisory, 2044→`/`,
      2217→`\ensuremath{\ast}`, 2032→`$'$`, 2211→`\ensuremath{\sum}`,
      greek letters→`\ensuremath{\alpha}`-style. Only helps literal-source
      occurrences (masked-view limits still apply).

  warn_utf8_lastcat:
    rows: 6
    mechanism: >-
      rows whose final category is warn_utf8 (not warn_missing_char) never
      evaluate the mc rules even though missing chars coexist — category
      exclusivity quirk; the chars would hit the same reachability wall anyway.
    fix_spec: low priority; document only.

net_fixable_estimate:
  accent_mark_fix: "~62 pids (the 0327 megacluster) — biggest single win"
  math_mode_pair: "~36 pids (b1 template + b2 cs shim)"
  char_table_exts: "~13 pids outband + partial others"
  cls_source_rewrite: "2 pids"
  nullfont: "5 pids — signature exclusion, no render fix possible"
  note: "buckets overlap; expect ~90-110 of 128 pids to reach zero-misschar"
