# JINST.cls shim_map 草案（scout-modec-resid 实测：xelatex 16pp / 0 err / 0 missing_char）
# 仓内已有裸 JINST.cls:{loads:article}（768c528）——本版带 JINST 特有宏面 polyfill，
# 转项目体验方式合入升级。要点：JINST 语义=\begin{document} 自动出标题块（稿内无
# \maketitle 调用）→ abstract/keywords stash + AtBeginDocument 释放 + maketitle 同钩补打。
JINST.cls:
  needs: ["graphicx.sty", "hyperref.sty"]
  body: |
    \NeedsTeXFormat{LaTeX2e}
    \ProvidesClass{JINST}[2026/09/16 fixloop legacy shim -> article + JINST polyfills]
    \LoadClassWithOptions{article}
    \RequirePackage{graphicx}
    \RequirePackage{hyperref}
    \providecommand{\email}[1]{\href{mailto:#1}{\texttt{#1}}}
    \def\JINST@abstract{}
    \def\JINST@keywords{}
    \providecommand{\abstract}{}
    \renewcommand{\abstract}[1]{\gdef\JINST@abstract{#1}}
    \providecommand{\keywords}[1]{\gdef\JINST@keywords{#1}}
    \providecommand{\acknowledgments}{\section*{Acknowledgments}}
    \providecommand{\arxiv}[1]{\href{https://arxiv.org/abs/#1}{arXiv:#1}}
    \providecommand{\proceeding}[1]{}
    \providecommand{\notoc}[1]{}
    \AtBeginDocument{%
      \ifx\@title\@empty\else\maketitle\fi
      \ifx\JINST@abstract\@empty\else\begin{quotation}\noindent\textbf{Abstract.} \JINST@abstract\end{quotation}\fi
      \ifx\JINST@keywords\@empty\else\par\noindent\textbf{Keywords:} \JINST@keywords\par\fi}
    \endinput
