# fixer-polyfill-journal 交付片段 —— 两处并入点。
#
# ══ A. journal_cs_polyfill.params.macros (rules.yaml ~L3146, arcsec 行后) ══
# 无参期刊宏 —— 全表广播注入 (\providecommand 幂等), 该 builtin 用
# _DOCCLASS_LINE_RE 整行锚定, 天然免疫行尾注释吞注入 (见下注)。
        macros:
          # ...现有条目保持...
          # \farcs = AAS 角秒小数 (0\farcs60 → .″60) —— 1003.0851 实证;
          # 与 arcsec 同族但含小数点语义, \hbox 内 $''$ 双模式安全
          farcs: ".\hbox{$''$}"
          # aa.cls 系裸 \acknowledgements 章头 —— 0806.3705/astro-ph/0408064/
          # astro-ph/0501615。env 形 \begin{acknowledgements} 走别的签名不进此表
          acknowledgements: "\section*{Acknowledgements}"

# ══ B. cs_targeted_fix.params.cs_table (rules.yaml ~L3170) ══
# ★ 全表 polyfill 一律 "\n" 前缀 —— _inject_after_docclass 在 docclass 行尾
#   (eol 处) 注入; 行尾带 % 注释 (%!PN 编辑器指令等, 1404.0346 实证) 时无
#   前缀的 snippet 整段被注释吞 → applied=True 但从未生效 → 同 payload 复发。
#   \n 前缀让代码逃出注释落下一行。建议: builtin 侧把注入点改到 eol+1
#   (1d 的地盘, 报告有 spec) 或全表既有 polyfill 补此前缀。
        cs_table:
          # ...现有条目保持...

          # ── REPLACE: 原 maketitle: { polyfill: '\providecommand{\maketitle}{}' }
          # 本批 ~25 格 maketitle payload 全是真炸点 (\email/\authorblockN/A)
          # 藏 \@author 展开体、l.N 行末 \maketitle 抢签 (payload 口径偏到
          # 展开点行末的已知现象)。类已定义 \maketitle → 旧 \providecommand
          # 变 no-op, 真炸点原样留 → POST 仍 undefined_cs:maketitle。
          # 新块: \maketitle 兜底保留 + 元数据宏全家桶 (\providecommand 幂等)。
          # 实证: 0905.0440 clean / 0806.3220 / 1003.0851 clean / 1404.0346 愈
          # (IEEEtran+%!PN 尾注格, 靠 \n 前缀逃出注释)。
          maketitle:
            {
              polyfill: "\n\\providecommand{\\maketitle}{}\n\\providecommand{\\email}[1]{\\texttt{#1}}\n\\providecommand{\\authorblockN}[1]{#1}\n\\providecommand{\\authorblockA}[1]{\\\\[1ex]{\\small #1}}\n\\providecommand{\\authorrunning}[1]{}\n\\providecommand{\\titlerunning}[1]{}\n\\providecommand{\\inst}[1]{\\textsuperscript{#1}}\n\\providecommand{\\institute}[1]{}",
            }
          # 同块挂直接 payload 键 (\authorblockN 裸调顶层时 payload 直达)
          authorblockN:
            {
              polyfill: "\n\\providecommand{\\email}[1]{\\texttt{#1}}\n\\providecommand{\\authorblockN}[1]{#1}\n\\providecommand{\\authorblockA}[1]{\\\\[1ex]{\\small #1}}",
            }
          authorblockA:
            {
              polyfill: "\n\\providecommand{\\email}[1]{\\texttt{#1}}\n\\providecommand{\\authorblockN}[1]{#1}\n\\providecommand{\\authorblockA}[1]{\\\\[1ex]{\\small #1}}",
            }
          # 元数据宏裸调直达键 (aaspp4/svjour 系 preamble 散调)
          authorrunning:
            { polyfill: "\n\\providecommand{\\authorrunning}[1]{}" }
          titlerunning:
            { polyfill: "\n\\providecommand{\\titlerunning}[1]{}" }
          institute: { polyfill: "\n\\providecommand{\\institute}[1]{}" }
          inst:
            { polyfill: "\n\\providecommand{\\inst}[1]{\\textsuperscript{#1}}" }
          affil: { polyfill: "\n\\providecommand{\\affil}[1]{#1}" } # aaspp4

          # \csname bibitemStop\endcsname 融合残留 —— 已落地 NoStop 条目的对偶
          # (10-11 格: 1003.0512/1206.0220/1206.0242/1206.5920/1306.6101/
          # 1404.6028/1706.00249/1803.00235/1803.03209)。拆回 → \bibitemStop:
          # 在场则调 (revtex polyfill 已供), 未定义也安全 (\csname 未定义→\relax)
          csnamebibitemStop:
            { cs_map: { csnamebibitemStop: "csname bibitemStop" } }

          # recmath 系 wide-abstract 单参命令 \wideabs{...} —— cond-mat/0104373
          # /9901011/9910489, nucl-th/0104002 (~5 格)。quote 块保全文面
          wideabs:
            {
              polyfill: "\n\\providecommand{\\wideabs}[1]{\\begin{quote}\\small\\noindent #1\\end{quote}}",
            }

          # imsart/EJS 局部定义区定界 —— 间是普通 \def, 定界符本体 inert
          # (1012.2012/1206.1960/1811.10292)。两键对称, 先到先注。
          # ★ \endlocaldefs 不能用 \providecommand/\newcommand 定义 —— LaTeX
          #   \@ifdefinable 拒 \end 前缀名 ("Command \endlocaldefs already
          #   defined. Or name \end... illegal", 1206.1960 实证) → 走原语
          #   \ifdefined..\else\def..\fi 守卫式定义。
          startlocaldefs:
            {
              polyfill: "\n\\providecommand{\\startlocaldefs}{}\n\\ifdefined\\endlocaldefs\\else\\def\\endlocaldefs{}\\fi",
            }
          endlocaldefs:
            {
              polyfill: "\n\\providecommand{\\startlocaldefs}{}\n\\ifdefined\\endlocaldefs\\else\\def\\endlocaldefs{}\\fi",
            }

          # 老 AMS/期刊 running-head 对 —— \lefthead{...}\righthead{...}
          # (1012.1584, astro-ph/9901236, astro-ph/9901311)。页眉装饰非正文,
          # \markboth 近似 (article 默认 pagestyle 不读 mark, 视觉零差)
          lefthead:
            { polyfill: "\n\\providecommand{\\lefthead}[1]{\\markboth{#1}{}}" }
          righthead:
            { polyfill: "\n\\providecommand{\\righthead}[1]{\\markboth{}{#1}}" }

          # epstopdf 包宏 (2104.00126) —— 稿依赖而 preamble 未装, 直接装包
          epstopdfDeclareGraphicsRule: { usepackage: epstopdf }
