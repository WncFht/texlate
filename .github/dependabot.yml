version: 2

# 三生态周报 + actions SHA pin 维护（ci/release 全部 SHA pin，靠 dependabot
# 推进版本而非手追）。open-pull-requests-limit 收窄防 PR 雨。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /zotero
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /bench/ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
