name: Release

# tag v* 触发：版本断言 → 构建 SPA → uv build → wheel 断言 → GitHub Release
# + PyPI（OIDC trusted publisher，免 token）→ zotero xpi 挂 versioned
# release + update.json 推常驻 `release` tag（Zotero 更新源）→ docker
# 双架镜像推 ghcr.io。
# 与 ci.yml 同源纪律：node 22 / uv / 同一 build-web.sh 链路。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release 产物
  packages: write # ghcr.io 推送

jobs:
  dist:
    name: sdist + wheel + Release + PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release
      id-token: write # PyPI trusted publishing（OIDC，免 token）
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # tag 必须与 pyproject + zotero/package.json 同版号——一处漂移三面
      # 分叉（wheel 版本 ≠ xpi 版本 ≠ 用户预期），发布前先炸在此处。
      - name: tag ↔ version 一致性断言
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; \
            print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ZOT=$(python3 -c "import json; \
            print(json.load(open('zotero/package.json'))['version'])")
          if [ "$PKG" != "$TAG" ] || [ "$ZOT" != "$TAG" ]; then
            echo "::error::tag v$TAG != pyproject $PKG / zotero $ZOT"
            exit 1
          fi
          echo "version $TAG 三方一致"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web 构建 → src/texlate/server/static
        # npm ci --prefix web → vite build → cp -R web/dist/. static/
        run: scripts/build-web.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: uv build（sdist + wheel）
        run: uv build

      - name: wheel 断言：SPA 已入包
        # pyproject [tool.hatch.build] artifacts 强制携带 static/——
        # 防"wheel 无前端"回归（audit m3.md 点名的交付断链）。
        run: |
          whl=$(ls dist/texlate-*-py3-none-any.whl)
          python3 -m zipfile -l "$whl" | grep -q "texlate/server/static/index.html"
          python3 -m zipfile -l "$whl" | grep -q "texlate/server/static/pdfjs/"
          echo "wheel SPA 断言通过: $whl"

      - name: wheel 冒烟：console script 可用
        run: |
          uv tool install dist/texlate-*-py3-none-any.whl
          "$HOME/.local/bin/texlate" version

      # 幂等：release 已存在则只 --clobber 重传产物——job 重跑安全
      # （PyPI/网络抖动后 re-run 不会死在 create 冲突上）。
      - name: GitHub Release + 产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "texlate $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      # OIDC trusted publishing：PyPI 项目页配 pending publisher
      # （repo WncFht/texlate + workflow release.yml）后免 token。
      # --check-url 跳过已存在文件——同 tag 重跑幂等。
      - name: Publish → PyPI
        run: uv publish --check-url https://pypi.org/simple/

      - name: Actions artifact（dist/ 存档）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: texlate-dist-${{ github.ref_name }}
          path: dist/

  # zotero 插件：xpi 挂 v{ver} release（update_link 指向它），update.json /
  # update-beta.json 推常驻 tag `release` 的 release 资产——manifest 里的
  # updateURL 指向 releases/download/release/update.json，Zotero 轮询该地址。
  zotero:
    name: Zotero xpi + update feed
    needs: dist # 等 versioned release 存在后挂 xpi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zotero/package-lock.json

      - name: 构建 xpi + update manifest
        run: |
          npm ci --prefix zotero
          npm run --prefix zotero build
          ls -la zotero/.scaffold/build/

      - name: xpi → versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            zotero/.scaffold/build/texlate.xpi --clobber

      - name: update.json → floating `release` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view release >/dev/null 2>&1 || \
            gh release create release --title "Zotero update feed" \
              --notes "update.json 通道，由 release.yml 维护，勿手改"
          gh release upload release \
            zotero/.scaffold/build/update.json \
            zotero/.scaffold/build/update-beta.json --clobber

  docker:
    name: Docker → ghcr.io (amd64+arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU + buildx
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 先单架 --load 本地冒烟，再多架 --push（buildx 缓存命中，二段很快）。
      # Dockerfile 内 uname -m 选 tectonic 档——QEMU 下报目标架构，无需改文件。
      - name: Build amd64（本地冒烟用）
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VER="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64 --load -t "$IMAGE:$VER" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: 镜像冒烟（起服 + health + SPA）
        run: |
          docker run -d --name smoke -p 8765:8765 "$IMAGE:$VER"
          ok=""
          for _ in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:8765/api/health; then
              ok=1
              break
            fi
            sleep 1
          done
          spa=""
          if curl -sf --max-time 5 http://127.0.0.1:8765/ > /dev/null; then
            spa=1
          fi
          docker rm -f smoke
          test -n "$ok" # 30s 内 health 没起来 → fail
          test -n "$spa" # SPA 在镜像内可达

      - name: ghcr.io 登录
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build + push（amd64+arm64）
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$IMAGE:$VER" -t "$IMAGE:latest" .
