name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# 全部 job 只读——显式收窄 GITHUB_TOKEN，防后续加步骤时吃到默认写权限
permissions:
  contents: read

# 与 pre-commit 同源：本地不过 CI 必挂。format 门控（prettier check +
# markdownlint + eslint + actionlint）、python（ruff）、shell（shfmt +
# shellcheck）。工具版本一律钉死与本机同源：npm 件锁 package.json，
# 二进制件走官方 release + sha256（与下方 tectonic 同形制）——ubuntu-24.04
# 镜像无 brew（exit 127 实证），且诊断漂移咬人处（shellcheck 0.9 vs 0.11
# 告警集不同）须钉。版本事实源：gitleaks = .pre-commit-config.yaml rev，
# ruff/ty = uvx 钉小版，其余 = 本文件 sha256 旁的版本号。
jobs:
  format:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:md

      - name: YAML comment width
        run: python3 scripts/check-yaml-comments.py

      - name: ESLint
        run: npm run lint:js

      - name: actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          "$HOME/.local/bin/actionlint"

      - name: taplo (toml)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/taplo.gz \
            "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz"
          echo "8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156  /tmp/taplo.gz" \
            | sha256sum -c -
          gunzip -c /tmp/taplo.gz > "$HOME/.local/bin/taplo"
          chmod +x "$HOME/.local/bin/taplo"
          git ls-files -z '*.toml' | xargs -0r "$HOME/.local/bin/taplo" fmt --check

      # docs/ 死链闸：stdlib-only 脚本，ubuntu 镜像自带 python3 即可跑——
      # pre-commit 只拦 docs/*.md 改动触发的面，删目标件/改路径的全量
      # 复核在本步（本地不过 CI 必挂的同源约定）。
      - name: docs linkcheck
        run: python3 tools/docs_linkcheck.py

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks git 扫全史——增量 log-opts 跨 push/PR 形态易漏

      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gitleaks
        run: gitleaks git --redact .

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: ruff
        run: uvx ruff@0.16.9 format --check . && uvx ruff@0.16.9 check .

  # ty typecheck 闸：棘轮式——pyproject [tool.ty.src] exclude 是存量诊断
  # 白名单（未列文件须零诊断）。ty 诊断随版本漂移，uvx 钉死小版本。
  typecheck:
    name: Typecheck (ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # ty 要解析三方 import——uvx 的临时 env 里没有项目依赖，须先 sync 出
      # .venv 供 ty 自动发现（无 .venv 时全员 unresolved-import 实证）
      - name: uv sync（ty 解析依赖面）
        run: uv sync --frozen --extra server

      - name: ty check（棘轮面 = src，排除面见 pyproject）
        run: uvx ty@0.0.82 check src

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64"
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  $HOME/.local/bin/shfmt" \
            | sha256sum -c -
          chmod +x "$HOME/.local/bin/shfmt"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" \
            | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          cp /tmp/shellcheck-v0.11.0/shellcheck "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: shfmt + shellcheck
        run: |
          git ls-files -z '*.sh' | while IFS= read -r -d '' f; do
            head -1 "$f" | grep -q '^#!.*zsh' && continue
            shfmt -d -i 2 "$f"
            shellcheck -S warning "$f"
          done

  # windows leg：运行时代码全 POSIX 门控降级（fcntl/killpg/rlimits 都
  # sys.platform 分支），此 leg 的职责是让 Windows 真实跑一次测试套件，
  # 把漏网 POSIX-ism 炸出来——红了按发现修，不许 skip 养蛇。
  pytest:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Node (L1 tree-sitter 层依赖)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: bench/ts 依赖（tree-sitter-latex binding）
        run: npm ci --prefix bench/ts

      - name: uv sync
        run: uv sync --frozen --extra server

      - name: pytest
        run: uv run pytest tests/ -q

  # fuzz 冒烟：tests/fuzz/ 全文件面独立车道（~1800 用例，本地 ~1min）。
  # _FUZZ_ITERS 各文件硬编码、无 env knob——冒烟边界靠 timeout-minutes 兜底
  # 而非缩迭代；glob 自动收编后续新增 fuzz 文件。不装 node/bench-ts——
  # 现有 fuzz 面无 tree-sitter 依赖（validate 只伪造 node_modules 目录）。
  fuzz:
    name: Fuzz smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: uv sync
        run: uv sync --frozen --extra server

      - name: fuzz smoke (tests/fuzz/)
        run: uv run pytest tests/fuzz/ -q -x

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web 依赖
        run: npm ci --prefix web

      - name: tsc + eslint + vitest + build
        run: |
          npm run --prefix web typecheck
          npm run --prefix web lint
          npm run --prefix web test
          npm run --prefix web build

  # zotero 插件：lint+tsc+build 三闸。npm test（zotero-plugin test）需真 Zotero
  # runtime——prefs.test.ts 调 Zotero.Plugins.resolveURI/File API 读构建产物，
  # 宿主绑定不可无头跑，mocha 用例不在 CI 面（本地开发用）。
  zotero:
    name: Zotero
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zotero/package-lock.json

      - name: zotero 依赖
        run: npm ci --prefix zotero

      # build 脚本内链 tsc --noEmit（zotero-plugin build && tsc --noEmit）——
      # 勿用裸 npx tsc：根面会误解析到同名恶作剧包而非真 TypeScript
      - name: prettier + eslint + tsc + scaffold build
        run: |
          npm run --prefix zotero lint:check
          npm run --prefix zotero build

  # 编译引擎冒烟：真引擎跑 `texlate run` 全链（normalize → mock 翻译 →
  # ctex 注入 → 编译 → judge）。tectonic 用官方 musl 静态二进制（sha256 钉死，
  # 与 Dockerfile 同源）；xelatex 走 apt texlive（重 leg，~GB 级安装——
  # 若 flaky 可从 matrix 摘除，tectonic 是分发默认引擎）。
  engine:
    name: Engine smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tectonic
          - name: xelatex
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tectonic
        if: matrix.name == 'tectonic'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  /tmp/tectonic.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/tectonic.tar.gz -C "$HOME/.local/bin" tectonic
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tectonic --version

      - name: Install xelatex (TeX Live + ctex/fandol)
        if: matrix.name == 'xelatex'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese latexmk
          xelatex --version | head -1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: uv sync
        run: uv sync --frozen --extra server

      - name: texlate run e2e 冒烟（真编译）
        run: |
          mkdir -p /tmp/mini-tex
          cat > /tmp/mini-tex/main.tex <<'EOF'
          \documentclass{article}
          \begin{document}
          \section{Intro}
          This is a longer paragraph of English text that should definitely be
          segmented into at least one chunk for translation purposes.

          And a second paragraph here.
          \end{document}
          EOF
          uv run texlate run /tmp/mini-tex --engine "${{ matrix.name }}"
