name: 功能建议
description: 新能力、新通路、新交互
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 现在的痛点或做不到的事——先说问题再说方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的形态
      description: 命令长什么样、界面在哪、输出什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代
      description: 现有功能的组合能不能顶；为什么不够
