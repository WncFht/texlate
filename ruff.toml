# select=ALL 全开；全局 ignore 只留普适项（formatter 冲突 / CJK / copyright / 互斥规则）。
# bench/** 的一次性脚本式豁免在 per-file-ignores 里单独声明；
# src/** 产品代码吃严格全集（docstring / 类型标注 / 异常纪律全要）。
target-version = "py312"
# bench/results/ 是脚本产出目录——与 .prettierignore 同一条线，不进链
# .agents/ 是 vendored skill 原样入库区——上游代码不吃本仓 lint 口径
extend-exclude = ["bench/results", ".agents"]

[lint]
select = ["ALL"]
ignore = [
  "COM812",
  "ISC001", # 官方列名与 ruff format 冲突，必关
  "CPY001", # 无 copyright 头惯例
  "RUF001",
  "RUF002",
  "RUF003", # 中文注释/字符串的 CJK unicode 歧义，全仓皆是
  "D203",   # 与 D211 互斥（select=ALL 双开时 ruff 告警）
  "D213",   # 与 D212 互斥，同上
  "D400",
  "D415",   # 首行句读规则只认 ASCII 句点；中文 docstring 以「。」结尾，全仓皆中
  "E501",   # ruff format 不重排字符串/注释；行宽交给 formatter
]

[lint.per-file-ignores]
# bench/ 是评测脚本：无发布 API、中文注释、进程即死的一次性驱动；
# 探私有内部 / 盲捕异常 / assert 断言 / print 输出都是 bench 语义本身
"bench/**/*.py" = [
  "D",
  "ANN",
  "T201",
  "ERA001",
  "BLE001",
  "PTH",
  "UP031",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "S101",
  "INP001",
  "FBT001",
  "FBT002",
  "FBT003",
  "ARG001",
  "ARG002",
  "SIM115",
  "SLF001",
  "S603",
  "PLW1510",
  "PLC0415",
  "E402",
  "N801",
  "N818",
  "S311",     # 语料抽样的 random.Random(seed) 是复现语义，非密码学
  "ASYNC109", # bench 驱动的 timeout 形参是编译墙钟，传给下游非 asyncio.timeout
  "ASYNC240", # bench async 编排里 rglob/mkdir 是有意同步（逐篇顺序驱动）
]
# pytest 断言 + 免 docstring + 无 __init__.py 惯例
"tests/**/*.py" = ["D", "S101", "INP001"]
# tools/ 与 bench/ 同类——诊断脚本无发布 API；命名/闭包/print 皆脚本语义
