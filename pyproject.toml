[project]
name = "texlate"
version = "0.1.0"
description = "arXiv LaTeX 源码 → LLM 段落级翻译 → ctex 重编译中文 PDF，双语对照阅读（hjfy.top 开源复现）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "beautifulsoup4>=4.15.0",
  "defusedxml>=0.7.1",
  "httpx>=0.28",
  "lxml>=5",
  "pypdf>=5.0",
  "python-docx>=1.2.0",
  "pyyaml>=6.0.3",
  "typer>=0.12",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
]

[project.scripts]
texlate = "texlate.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# SPA 产物拷入位是 gitignored 构建产物（scripts/build-web.sh 生成）——artifacts 强制入包
artifacts = ["src/texlate/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/texlate"]
