[project]
name = "texlate"
version = "0.1.1"
description = "arXiv LaTeX 源码 → LLM 段落级翻译 → ctex 重编译中文 PDF，双语对照阅读（hjfy.top 开源复现）"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["arxiv", "latex", "translation", "llm", "chinese", "bilingual-pdf"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
# server 依赖（fastapi/uvicorn/sse-starlette/python-multipart）在 core——
# `uvx texlate web` 裸装即得 web 形态，无 extra 面
dependencies = [
  "beautifulsoup4>=4.15.0",
  "defusedxml>=0.7.1",
  "fastapi>=0.115",
  "httpx>=0.28",
  "lxml>=5",
  "pypdf>=5.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.3",
  "regex>=2026.9.10",
  "rich>=13",
  "sse-starlette>=2.1",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# spec 承诺名（docs/decisions/background.md、docs/spec/validate.md）：L1 tree-sitter 校验是 node 子进程
# 跑随包 `validate/ts/` 数据件，python 侧零依赖——空 extra 仅占位兑现安装面，
# 运行时 `shutil.which("node")` 探测缺席即降级 L0。
ts-validator = []

[project.scripts]
texlate = "texlate.cli:app"

[project.urls]
Homepage = "https://github.com/WncFht/texlate"
Repository = "https://github.com/WncFht/texlate"
Issues = "https://github.com/WncFht/texlate/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  # AGPL 可选件：不入 wheel 依赖面，但 dev/CI 须装——seqpos 双遍主路径
  # （_text_layer+_marks_layer 几何回填）只有 pymupdf 在场才被测到，
  # 缺席时静默走 pypdf 兜底面、occ["text"] 归一口径不同。
  "pymupdf>=1.24",
]

# typecheck 棘轮：exclude 列出的是存量诊断待清面。2026-09-28 首波已清
# 62 文件 / 1080 诊断（segmenter+gullet+export+compile 大半面），剩 27 行
# 全是另一会话在飞区（server/cli/fixloop-actions/pipecore/repair/share/
# l2/pipeline），归其收口时逐件清。未列文件=0 诊断基线，CI
# `uvx ty@0.0.82 check src` 钉死（tools/tests/bench 属脚本类不在闸径）。
[tool.ty.src]
exclude = [
  # 散点文件（按路径序）——均在另一会话在飞区，归其收口时清。
  # 注意条目随拆包漂移：凡 `X.py → X/` 子包化的旧叶，白名单跟到目录级
  #（actions/pipecore/repair/_common/compile/translate/pipeline 七处）
  "src/texlate/cli/_common.py",
  "src/texlate/cli/share.py",
  "src/texlate/cli/thin.py",
  "src/texlate/compile/engine/_base.py",
  "src/texlate/compile/fixloop/actions",
  "src/texlate/latex/segmenter",
  "src/texlate/pipecore",
  "src/texlate/repair",
  "src/texlate/server/_common.py",
  "src/texlate/server/app.py",
  "src/texlate/server/babeldoc.py",
  "src/texlate/server/events.py",
  "src/texlate/server/http.py",
  "src/texlate/server/providers.py",
  "src/texlate/server/routers/compat.py",
  "src/texlate/server/routers/deps.py",
  "src/texlate/server/routers/files.py",
  "src/texlate/server/routers/meta.py",
  "src/texlate/server/routers/reader.py",
  "src/texlate/server/routers/refs.py",
  "src/texlate/server/routers/share.py",
  "src/texlate/server/routers/srccut.py",
  "src/texlate/server/routers/tasks.py",
  "src/texlate/server/seqpos",
  "src/texlate/server/settings.py",
  "src/texlate/server/srccut.py",
  "src/texlate/server/staticfiles.py",
  "src/texlate/server/store/__init__.py",
  "src/texlate/server/sweep.py",
  "src/texlate/server/worker/_common",
  "src/texlate/server/worker/__init__.py",
  "src/texlate/server/worker/compile",
  "src/texlate/server/worker/core.py",
  "src/texlate/server/worker/emit.py",
  "src/texlate/server/worker/fetch.py",
  "src/texlate/server/worker/html.py",
  "src/texlate/server/worker/parse.py",
  "src/texlate/server/worker/pdf.py",
  "src/texlate/server/worker/retranslate.py",
  "src/texlate/server/worker/runner.py",
  "src/texlate/server/worker/share.py",
  "src/texlate/server/worker/translate",
  "src/texlate/share.py",
  "src/texlate/validate/l2.py",
  "src/texlate/validate/logattr.py",
  "src/texlate/xlat/pipeline",
]

[tool.pytest.ini_options]
# 裸 pytest 从仓根只收 tests/——tmp/refs/ 参考 clone、bench、web 不入收集；
# norecursedirs 全量覆盖 pytest 默认值，需把默认集一并列回
testpaths = ["tests"]
# bench/py 纯 stdlib 脚本目——kernel/specs/verbs 供 tests/bench_kernel/ 直接
# import（收口原各文件模块级 sys.path.insert 的全会话污染）；
# tests 使桶内测试文件可解析根部 _*kit/conftest/_translators 共享件
pythonpath = ["bench/py", "tests"]
norecursedirs = [
  "tmp",
  "bench",
  "web",
  ".*",
  "*.egg",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}",
]
markers = [
  # 快环 -m "not slow and not integration"：重构迭代期只跑纯单元面
  "slow: 走 corpus/重产物数据的全量扫描用例（gitignored 数据层在场才跑）",
  "integration: 依赖外部工具/网络/真进程的用例（xelatex/kpsewhich/sh/网关/sidecar）",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# SPA 产物拷入位是 gitignored 构建产物（scripts/build-web.sh 生成）——artifacts 强制入包
artifacts = ["src/texlate/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/texlate"]

[tool.hatch.build.targets.sdist]
# 默认 sdist = 整棵工作树（bench 重产物全入包不可行）——白名单收敛
include = ["/src", "/tests", "/README.md", "/pyproject.toml"]
