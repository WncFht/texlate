[project]
name = "texlate"
version = "0.1.0"
description = "arXiv LaTeX 源码 → LLM 段落级翻译 → ctex 重编译中文 PDF，双语对照阅读（hjfy.top 开源复现）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "beautifulsoup4>=4.15.0",
  "defusedxml>=0.7.1",
  "httpx>=0.28",
  "lxml>=5",
  "pypdf>=5.0",
  "python-docx>=1.2.0",
  "pyyaml>=6.0.3",
  "typer>=0.12",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
]

[project.scripts]
texlate = "texlate.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
# 裸 pytest 从仓根只收 tests/——tmp/refs/ 参考 clone、bench、web 不入收集；
# norecursedirs 全量覆盖 pytest 默认值，需把默认集一并列回
testpaths = ["tests"]
# bench/py 纯 stdlib 脚本目——triage/rundiff/benchlib 供 test_bench_* 直接
# import（收口原各文件模块级 sys.path.insert 的全会话污染）
pythonpath = ["bench/py"]
norecursedirs = [
  "tmp",
  "bench",
  "web",
  ".*",
  "*.egg",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# SPA 产物拷入位是 gitignored 构建产物（scripts/build-web.sh 生成）——artifacts 强制入包
artifacts = ["src/texlate/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/texlate"]

[tool.hatch.build.targets.sdist]
# 默认 sdist = 整棵工作树（bench/results 24G+ 全入包，构建不可行）——白名单收敛
include = ["/src", "/tests", "/README.md", "/pyproject.toml"]
